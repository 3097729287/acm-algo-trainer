name: TB checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TB_OFFLINE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: msys2/setup-msys2@v2
        id: compiler
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose the Windows compiler to Python
        env:
          MSYS2_LOCATION: ${{ steps.compiler.outputs.msys2-location }}
        run: |
          Join-Path $env:MSYS2_LOCATION 'ucrt64/bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify C++ dependency
        run: g++ --version
      - name: Desktop and regression dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Local leaderboard fixture dependencies
        working-directory: server/leaderboard
        run: npm ci --ignore-scripts
      - name: SQLite, API, migration, translation and judge regressions
        run: python scripts/check.py
      - name: Native WebView compiler and form fixtures
        run: |
          python desktop/tests/official_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/silent_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/managed_login.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/login_probe_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/close_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/interactive_browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/webview_resources_native.py --rounds 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Browser sessions and intercepted native submissions
        working-directory: frontend
        env:
          TB_PYTHON: python
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/algorithm-lab-guided-model.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/accounts.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/external-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/hybrid-cf.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/hybrid-cf.mjs --preparation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/hybrid-cf.mjs --atcoder --preparation --reuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/login-sessions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../desktop/tests/qoj_platform.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/browser-official.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TB_OFFLINE: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:model
      - run: node tests/revision-1429-model.mjs
      - run: node tests/radar-frequency.mjs
      - run: node tests/navigation-learning-model.mjs
      - run: node tests/navigation-defaults-model.mjs
      - run: node tests/training-list-platforms-model.mjs
      - run: node tests/platform-registry-model.mjs
      - run: node tests/course-entry-model.mjs
      - run: node tests/next-actions-model.mjs
      - run: node tests/daily-growth-authority-model.mjs
      - run: node tests/level-up-model.mjs
      - run: node tests/uniform-random.mjs
      - run: npm run test:math
      - run: npm run test:compilers
      - run: node tests/official-sites.mjs
      - run: npm run test:ui
      - run: node tests/catalog-activity.mjs
      - run: node tests/browser-preparation.mjs
      - run: node tests/workspace-decorations.mjs
      - run: node tests/statement-format.mjs
      - run: node tests/webview-loading.mjs
      - run: node tests/replay-layout.mjs
      - run: node tests/rankings.mjs
      - run: node tests/software-updates.mjs
      - run: npm run test:issues
      - run: node tests/ui-social.mjs
      - run: node tests/messages-modal.mjs
      - run: node tests/ui-redesign.mjs
      - run: node tests/ui-v131.mjs
      - run: node tests/revision-flows.mjs
      - run: node tests/account-sync-status.mjs
      - run: node tests/mock-layout.mjs
      - run: node tests/mock-controls.mjs
      - run: node tests/filter-toolbar.mjs
      - run: node tests/platforms.mjs
      - run: node tests/training-remove-scope.mjs
      - run: node tests/training-list-platforms.mjs
      - run: node tests/wasd-navigation.mjs
      - run: node tests/settings-scenes.mjs
      - run: node tests/chrome-theme.mjs
      - run: node tests/training-overview.mjs
      - run: node tests/navigation-learning.mjs
      - run: node tests/template-first-frame.mjs
      - run: node tests/course-entry.mjs
      - run: node tests/auth-recovery.mjs
      - run: node tests/admin-settings.mjs
      - run: node tests/public-avatar-cache.mjs
      - run: node tests/root-ui-refinements.mjs
      - run: node tests/insert-template-model.mjs
      - run: node tests/unified-controls.mjs
      - run: node tests/statement-translation.mjs
      - run: node tests/next-actions.mjs
      - run: node tests/navigation-defaults-model.mjs
      - run: node tests/ui-followups.mjs
      - run: TB_REAL_FOCUS=1 xvfb-run -a node tests/level-up.mjs
      - run: node tests/ability-evidence.mjs
      - run: node tests/lifecycle-layout.mjs
      - run: npm run test:workbench
      - run: node tests/code-format.mjs
      - run: node tests/experience-challenge.mjs
      - run: npm run test:e2e
      - run: node tests/detailed-solutions.mjs
      - run: node tests/editorial-teaching.mjs
      - run: node tests/content-batch-1430.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-ui-screenshots
          path: frontend/tests/screenshots/
          if-no-files-found: ignore

  leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tb-isolated-ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install leaderboard dependencies
        working-directory: server/leaderboard
        run: npm ci --ignore-scripts
      - name: HTTP protocol and ranking rules
        working-directory: server/leaderboard
        run: npm test
      - name: MySQL protocol, transactions and snapshot migration
        working-directory: server/leaderboard
        env:
          TB_MYSQL_TEST_PORT: '3306'
          TB_MYSQL_TEST_PASSWORD: tb-isolated-ci
        run: npm run test:mysql
