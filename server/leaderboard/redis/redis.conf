bind 0.0.0.0
port 6379
protected-mode yes
daemonize no
logfile ""
dir /data

aclfile /run/secrets/redis_acl

appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# Start conservatively until the instance's RAM and intended workload are known.
maxmemory 256mb
maxmemory-policy noeviction
