<title>Prim：选择跨越 S 的最便宜边</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#62748a"/></marker></defs>
<rect width="780" height="345" rx="12" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="24" y="35" font-size="22" fill="#233348" text-anchor="start">Prim：选择跨越 S 的最便宜边</text><rect x="30" y="70" width="270" height="205" rx="8" fill="#e6f3e9" stroke="#25834a" stroke-width="2"/><text x="55" y="104" font-size="19" fill="#25834a" text-anchor="start">已加入 S</text><circle cx="110" cy="200" r="24" fill="#fff" stroke="#2879b4" stroke-width="3"/><text x="110" y="207" font-size="20" fill="#2879b4" text-anchor="middle">0</text><circle cx="225" cy="160" r="24" fill="#fff" stroke="#2879b4" stroke-width="3"/><text x="225" y="167" font-size="20" fill="#2879b4" text-anchor="middle">2</text><circle cx="570" cy="120" r="24" fill="#fff" stroke="#2879b4" stroke-width="3"/><text x="570" y="127" font-size="20" fill="#2879b4" text-anchor="middle">1</text><circle cx="570" cy="245" r="24" fill="#fff" stroke="#2879b4" stroke-width="3"/><text x="570" y="252" font-size="20" fill="#2879b4" text-anchor="middle">3</text><line x1="249" y1="155" x2="546" y2="124" stroke="#b96b11" stroke-width="3"/><line x1="249" y1="169" x2="546" y2="240" stroke="#62748a" stroke-width="3"/><text x="375" y="122" font-size="18" fill="#b96b11" text-anchor="start">10：本轮选择</text><text x="370" y="229" font-size="18" fill="#233348" text-anchor="start">15：之后候选</text><text x="40" y="318" font-size="19" fill="#233348" text-anchor="start">best[1] = min(23,10)；best[3] = min(23,15)。</text></g></svg>