<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" role="img" aria-label="拓扑序：统一决定所有新增边的方向">
<title>拓扑序：统一决定所有新增边的方向</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#62748a"/></marker></defs>
<rect width="780" height="320" rx="12" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="24" y="35" font-size="22" fill="#233348" text-anchor="start">拓扑序：统一决定所有新增边的方向</text><text x="28" y="83" font-size="20" fill="#233348" text-anchor="start">固定边：1 → 3、2 → 3；待定边：1 — 2、3 — 4。</text><path d="M126,154 C185,99 395,99 454,154" fill="none" stroke="#2879b4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="110" cy="176" r="24" fill="#fff" stroke="#2879b4" stroke-width="3"/><text x="110" y="183" font-size="20" fill="#2879b4" text-anchor="middle">1</text><text x="110" y="229" font-size="18" fill="#233348" text-anchor="middle">位置 0</text><circle cx="290" cy="176" r="24" fill="#fff" stroke="#2879b4" stroke-width="3"/><text x="290" y="183" font-size="20" fill="#2879b4" text-anchor="middle">2</text><text x="290" y="229" font-size="18" fill="#233348" text-anchor="middle">位置 1</text><circle cx="470" cy="176" r="24" fill="#fff" stroke="#2879b4" stroke-width="3"/><text x="470" y="183" font-size="20" fill="#2879b4" text-anchor="middle">3</text><text x="470" y="229" font-size="18" fill="#233348" text-anchor="middle">位置 2</text><circle cx="650" cy="176" r="24" fill="#fff" stroke="#2879b4" stroke-width="3"/><text x="650" y="183" font-size="20" fill="#2879b4" text-anchor="middle">4</text><text x="650" y="229" font-size="18" fill="#233348" text-anchor="middle">位置 3</text><line x1="136" y1="176" x2="264" y2="176" stroke="#62748a" stroke-width="3" marker-end="url(#arrow)"/><line x1="316" y1="176" x2="444" y2="176" stroke="#62748a" stroke-width="3" marker-end="url(#arrow)"/><line x1="496" y1="176" x2="624" y2="176" stroke="#62748a" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="285" font-size="20" fill="#233348" text-anchor="start">所有边都从较小位置走向较大位置，不可能沿边绕回起点。</text></g></svg>