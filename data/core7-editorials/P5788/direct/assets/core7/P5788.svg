<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425" role="img" aria-labelledby="title"><title id="title">当前值 3 到来时，只解决较小的待回答位置</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">当前值 3 到来时，只解决较小的待回答位置</text>
<rect x="55" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="118.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="185" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="248.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="315" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="378.5" y="126.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="445" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="508.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="575" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="638.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="45" y="220" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">第 4 项值 3：第 3 项值 2 的答案为下标 4</text>
<rect x="55" y="285" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="118.5" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="185" y="285" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="248.5" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="315" y="285" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="378.5" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="445" y="285" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="508.5" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="575" y="285" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="638.5" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<text x="45" y="395" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">最后的 5 没有更大右邻，答案为 0</text>
</g></svg>
