<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title"><title id="title">同秩火柴必须配对：目标原位置出现一对逆序</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同秩火柴必须配对：目标原位置出现一对逆序</text>
<text x="30" y="122" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">第一列</text>
<rect x="200" y="90" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="261.0" y="121.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="325" y="90" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="386.0" y="121.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="450" y="90" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="511.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="575" y="90" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="636.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="30" y="227" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">第二列</text>
<rect x="200" y="195" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="261.0" y="226.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="325" y="195" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="386.0" y="226.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="450" y="195" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="511.0" y="226.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="575" y="195" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="636.0" y="226.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="30" y="332" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">目标位置</text>
<rect x="200" y="300" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="261.0" y="331.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="325" y="300" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="386.0" y="331.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="450" y="300" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="511.0" y="331.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="575" y="300" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="636.0" y="331.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="45" y="415" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">前两个交换一次即可，不必把两列都分别排成升序</text>
</g></svg>
