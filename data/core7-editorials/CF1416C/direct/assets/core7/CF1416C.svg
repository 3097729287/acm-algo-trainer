<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">只统计最高不同位，平局把 x 的低位留零</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">只统计最高不同位，平局把 x 的低位留零</text>
<text x="55" y="117" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">原值</text>
<rect x="300" y="85" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="378.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="460" y="85" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="538.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<text x="55" y="212" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">异或 2 后</text>
<rect x="300" y="180" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="378.5" y="211.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="460" y="180" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="538.5" y="211.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="65" y="295" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">原来有 1 对逆序；选 x=2，变成 0 对</text>
<text x="65" y="355" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">x=3 也能零逆序，但更大，所以答案取 x=2</text>
</g></svg>
