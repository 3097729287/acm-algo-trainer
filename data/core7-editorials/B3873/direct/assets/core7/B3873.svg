<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">达到一百毫升后，更多容量合并到同一达标状态</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">达到一百毫升后，更多容量合并到同一达标状态</text>
<rect x="170" y="100" width="197" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="268.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">60</text>
<rect x="370" y="100" width="197" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="468.5" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">50</text>
<text x="270" y="200" fill="#2365ab" font-size="23" text-anchor="middle" font-weight="normal">售价 4</text>
<text x="470" y="200" fill="#12805c" font-size="23" text-anchor="middle" font-weight="normal">售价 3</text>
<text x="65" y="270" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">合计 110 毫升，费用 7；状态记为容量 100</text>
<text x="65" y="335" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">单瓶都未达标；允许超过，不要求恰好一百</text>
</g></svg>
