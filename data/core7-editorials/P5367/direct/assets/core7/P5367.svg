<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">排列 2、1、3 之前，先选一的整块有两种</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">排列 2、1、3 之前，先选一的整块有两种</text>
<rect x="180" y="90" width="132" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="246.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="315" y="90" width="132" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="381.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="450" y="90" width="132" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="516.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="60" y="210" width="185" height="65" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="152.5" y="249.5" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1 2 3</text>
<rect x="285" y="210" width="185" height="65" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="377.5" y="249.5" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1 3 2</text>
<rect x="510" y="210" width="185" height="65" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="602.5" y="249.5" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2 1 3</text>
<text x="45" y="345" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">首位更小的剩余值有一个：1 × 2! + 1 = 3</text>
</g></svg>
