<text x="80" y="285" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">选第 2 到 6 项：5+1+6+2+14=28</text>
<text x="80" y="322" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">余数三在前缀五重现时，仍不能覆盖最早位置一</text>
