<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">四人按逆时针编号：朝内者从 0 左数三人</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">四人按逆时针编号：朝内者从 0 左数三人</text>
<circle cx="385" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="385" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<circle cx="245" cy="220" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="245" y="227" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="385" cy="340" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="385" y="347" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="525" cy="220" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="525" y="227" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<line x1="385" y1="100" x2="525" y2="220" stroke="#bc3645" stroke-width="3"/>
<line x1="525" y1="220" x2="385" y2="340" stroke="#bc3645" stroke-width="3"/>
<line x1="385" y1="340" x2="245" y2="220" stroke="#bc3645" stroke-width="3"/>
<text x="50" y="95" fill="#243449" font-size="19" text-anchor="start" font-weight="normal">下标增加：0→1→2→3</text>
<text x="45" y="385" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">左数顺时针走 0→3→2→1，(0−3+4)%4=1</text>
</g></svg>
