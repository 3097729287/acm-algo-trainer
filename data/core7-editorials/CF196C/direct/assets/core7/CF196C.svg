<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title"><title id="title">连续极角块对应互不重叠的几何扇区</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">连续极角块对应互不重叠的几何扇区</text>
<polygon points="310,410 420,245 530,135" fill="#e1f3eb"/>
<polygon points="310,410 200,300 145,135" fill="#e4eef9"/>
<line x1="310" y1="410" x2="420" y2="245" stroke="#12805c" stroke-width="4"/>
<line x1="420" y1="245" x2="530" y2="135" stroke="#12805c" stroke-width="4"/>
<line x1="310" y1="410" x2="200" y2="300" stroke="#68778b" stroke-width="4"/>
<line x1="200" y1="300" x2="145" y2="135" stroke="#68778b" stroke-width="4"/>
<circle cx="310" cy="410" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="310" y="417" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="420" cy="245" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="420" y="252" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="530" cy="135" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="530" y="142" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="200" cy="300" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="200" y="307" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="145" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="145" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="340" y="418" fill="#68778b" font-size="19" text-anchor="start" font-weight="normal">点1</text>
<text x="450" y="253" fill="#68778b" font-size="19" text-anchor="start" font-weight="normal">点4</text>
<text x="560" y="143" fill="#68778b" font-size="19" text-anchor="start" font-weight="normal">点5</text>
<text x="230" y="308" fill="#68778b" font-size="19" text-anchor="start" font-weight="normal">点2</text>
<text x="175" y="143" fill="#68778b" font-size="19" text-anchor="start" font-weight="normal">点3</text>
<text x="435" y="335" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">圆内是树编号</text>
<text x="435" y="375" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">小字是平面点编号</text>
<text x="50" y="465" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">每个孩子获得与子树大小相同的连续角度点块</text>
</g></svg>
