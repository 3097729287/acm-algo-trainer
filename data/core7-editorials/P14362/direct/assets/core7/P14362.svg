<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title"><title id="title">一个乡镇接两条新路，城市化费只付一次</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">一个乡镇接两条新路，城市化费只付一次</text>
<line x1="100" y1="100" x2="330" y2="200" stroke="#12805c" stroke-width="4"/>
<rect x="203.0" y="118.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="215.0" y="140.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">1</text>
<line x1="100" y1="300" x2="330" y2="200" stroke="#12805c" stroke-width="4"/>
<rect x="203.0" y="218.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="215.0" y="240.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">2</text>
<line x1="100" y1="300" x2="650" y2="300" stroke="#2365ab" stroke-width="4"/>
<rect x="363.0" y="268.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="375.0" y="290.0" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">4</text>
<line x1="650" y1="300" x2="650" y2="100" stroke="#2365ab" stroke-width="4"/>
<rect x="638.0" y="168.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="650.0" y="190.0" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">5</text>
<circle cx="100" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="100" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="650" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="650" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="100" cy="300" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="100" y="307" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="650" cy="300" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="650" y="307" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="330" cy="200" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="330" y="207" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">T</text>
<rect x="390" y="160" width="220" height="55" rx="7" fill="#fff3f4" stroke="#bc3645" stroke-width="2"/>
<text x="500.0" y="194.5" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">乡镇启用费 1</text>
<text x="50" y="365" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">旧路 4+5，新路 1+2，另付一次启用费 1</text>
<text x="50" y="405" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">总费用 13；只画样例最优方案采用的道路</text>
</g></svg>
