<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title"><title id="title">平方门槛为四，太近的两个点反而不能直连</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">平方门槛为四，太近的两个点反而不能直连</text>
<line x1="190" y1="330" x2="270" y2="330" stroke="#bc3645" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="206.0" y="344.0" width="48" height="28" rx="3" fill="#fff"/>
<text x="230.0" y="366.0" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">1&lt;4</text>
<line x1="190" y1="330" x2="190" y2="90" stroke="#12805c" stroke-width="4"/>
<rect x="178.0" y="188.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="190.0" y="210.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">9</text>
<line x1="270" y1="330" x2="190" y2="90" stroke="#12805c" stroke-width="4"/>
<rect x="212.0" y="188.0" width="36" height="28" rx="3" fill="#fff"/>
<text x="230.0" y="210.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">10</text>
<circle cx="190" cy="330" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="190" y="337" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="270" cy="330" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="270" y="337" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="190" cy="90" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="190" y="97" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="330" y="155" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">一号 (0,0)，二号 (1,0)</text>
<text x="330" y="205" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">三号 (0,3)，c=4</text>
<text x="330" y="270" fill="#12805c" font-size="20" text-anchor="start" font-weight="normal">合法边平方费用：9、10</text>
<text x="330" y="320" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">总费用 19</text>
<text x="45" y="407" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">坐标按同一尺度绘制；不能先按普通最近邻连线</text>
</g></svg>
