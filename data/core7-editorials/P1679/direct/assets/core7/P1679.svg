<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title"><title id="title">十七拆成十六与一，只需要两个四次方</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">十七拆成十六与一，只需要两个四次方</text>
<circle cx="255" cy="130" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="255" y="137" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">16</text>
<circle cx="505" cy="130" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="505" y="137" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="255" y="215" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">2 的四次方</text>
<text x="505" y="215" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">1 的四次方</text>
<text x="65" y="285" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">同一个四次方允许重复，例如三等于三个一</text>
</g></svg>
