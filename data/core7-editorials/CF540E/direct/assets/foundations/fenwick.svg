<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title"><title id="title">树状数组：前六项拆成两个不重叠块</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">树状数组：前六项拆成两个不重叠块</text>
<rect x="90" y="90" width="97" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="138.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="190" y="90" width="97" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="238.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="290" y="90" width="97" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="338.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="390" y="90" width="97" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="438.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="490" y="90" width="97" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="538.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="590" y="90" width="97" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="638.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<line x1="90" y1="175" x2="485" y2="175" stroke="#2365ab" stroke-width="8"/>
<text x="290" y="215" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">tree[4]：第 1 至 4 项</text>
<line x1="490" y1="175" x2="685" y2="175" stroke="#12805c" stroke-width="8"/>
<text x="588" y="250" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">tree[6]：第 5、6 项</text>
<text x="40" y="280" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">6 − lowbit(6) = 4；4 − lowbit(4) = 0</text>
</g></svg>
