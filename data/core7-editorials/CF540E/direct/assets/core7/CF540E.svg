<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title"><title id="title">只交换第一与第三位，未触及的第二位仍参与逆序</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">只交换第一与第三位，未触及的第二位仍参与逆序</text>
<text x="60" y="120" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">原序列</text>
<rect x="235" y="85" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="293.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="355" y="85" width="117" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="413.5" y="116.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="475" y="85" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="533.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="60" y="220" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">交换后</text>
<rect x="235" y="185" width="117" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="293.5" y="216.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="355" y="185" width="117" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="413.5" y="216.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="475" y="185" width="117" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="533.5" y="216.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="65" y="285" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">触及端点之间：1 对；与中间未触及位置：2 对</text>
<text x="65" y="335" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">共 3 对；两端的坐标距离 2，排名距离 1</text>
</g></svg>
