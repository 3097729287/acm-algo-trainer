<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">已知受害点只列一部分，比较到它们的最远距离</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">已知受害点只列一部分，比较到它们的最远距离</text>
<line x1="130" y1="170" x2="300" y2="170" stroke="#68778b" stroke-width="4"/>
<line x1="300" y1="170" x2="470" y2="170" stroke="#68778b" stroke-width="4"/>
<line x1="470" y1="170" x2="640" y2="170" stroke="#68778b" stroke-width="4"/>
<circle cx="130" cy="170" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="130" y="177" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="300" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="300" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="470" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="470" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="640" cy="170" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="640" y="177" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="60" y="285" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">受害点为 1、4，半径 d=2；可能源头是 2 或 3</text>
<text x="60" y="350" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">点 2 到两个标记距离为 1、2，最大值 2 合格</text>
<text x="60" y="405" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">“未列为受害点”不等于“未受影响”，不能排除 2、3</text>
</g></svg>
