<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">ab 变成 ac，末字修改比删除后再插入便宜</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">ab 变成 ac，末字修改比删除后再插入便宜</text>
<text x="240" y="90" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">空</text>
<text x="355" y="90" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">a</text>
<text x="470" y="90" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">ac</text>
<text x="100" y="150" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">空</text>
<rect x="185" y="120" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="241.0" y="151.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="300" y="120" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="356.0" y="151.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="415" y="120" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="471.0" y="151.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="100" y="225" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">a</text>
<rect x="185" y="195" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="241.0" y="226.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="300" y="195" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="356.0" y="226.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="415" y="195" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="471.0" y="226.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="100" y="300" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">ab</text>
<rect x="185" y="270" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="241.0" y="301.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="300" y="270" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="356.0" y="301.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="415" y="270" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="471.0" y="301.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="570" y="165" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">删：1+1=2</text>
<text x="570" y="235" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">插：1+1=2</text>
<text x="570" y="305" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">改：0+1=1</text>
<text x="55" y="375" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">每格是两个前缀之间的最小编辑次数，空前缀也是状态</text>
</g></svg>
