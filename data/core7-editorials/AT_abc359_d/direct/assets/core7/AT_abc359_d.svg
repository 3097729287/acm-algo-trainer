<text x="463.5" y="141.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<rect x="510" y="110" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="553.5" y="141.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<rect x="600" y="110" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="643.5" y="141.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<text x="60" y="185" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">ABAAABA：四个长度四窗口都不回文</text>
<rect x="60" y="245" width="87" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="103.5" y="276.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">A</text>
