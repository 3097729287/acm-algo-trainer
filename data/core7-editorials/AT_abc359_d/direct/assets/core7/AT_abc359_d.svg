<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" role="img" aria-labelledby="title"><title id="title">只禁止长度四的回文；短一些的重复仍允许</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">只禁止长度四的回文；短一些的重复仍允许</text>
<text x="40" y="85" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">原样例：AB?A?BA，K=4</text>
<rect x="60" y="110" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="103.5" y="141.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
