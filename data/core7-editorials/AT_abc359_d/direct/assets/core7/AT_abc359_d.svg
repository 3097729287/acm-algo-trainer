<text x="193.5" y="276.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<rect x="240" y="245" width="87" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="283.5" y="276.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<rect x="330" y="245" width="87" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="373.5" y="276.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<rect x="420" y="245" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="463.5" y="276.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<rect x="510" y="245" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="553.5" y="276.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<rect x="600" y="245" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="643.5" y="276.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<text x="60" y="335" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">ABBABBA：最前 ABBA 回文，这次填法作废</text>
</g></svg>
