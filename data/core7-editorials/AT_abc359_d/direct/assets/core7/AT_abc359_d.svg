<text x="283.5" y="141.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<rect x="330" y="110" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="373.5" y="141.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
