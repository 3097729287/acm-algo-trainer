<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">同一对子字母可有多个父来源，都要保留</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同一对子字母可有多个父来源，都要保留</text>
<line x1="380" y1="90" x2="220" y2="210" stroke="#2365ab" stroke-width="3"/>
<line x1="380" y1="90" x2="540" y2="210" stroke="#2365ab" stroke-width="3"/>
<line x1="220" y1="210" x2="140" y2="315" stroke="#2365ab" stroke-width="3"/>
<line x1="220" y1="210" x2="300" y2="315" stroke="#2365ab" stroke-width="3"/>
<line x1="540" y1="210" x2="460" y2="315" stroke="#2365ab" stroke-width="3"/>
<line x1="540" y1="210" x2="620" y2="315" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="80" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">I 或 N</text>
<circle cx="220" cy="210" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="220" y="217" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">W</text>
<circle cx="540" cy="210" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="540" y="217" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">W</text>
<circle cx="140" cy="315" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="140" y="322" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">I</text>
<circle cx="300" cy="315" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="300" y="322" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">I</text>
<circle cx="460" cy="315" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="460" y="322" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">I</text>
<circle cx="620" cy="315" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="620" y="322" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">I</text>
<text x="65" y="395" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">W→II；I→WW、N→WW，所以 IIII 的来源为 IN</text>
</g></svg>
