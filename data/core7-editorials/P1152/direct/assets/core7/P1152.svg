<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title"><title id="title">相邻四项只有三条相邻边，对应差值 3、2、1</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">相邻四项只有三条相邻边，对应差值 3、2、1</text>
<circle cx="170" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="170" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="310" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="310" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="450" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="450" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="590" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="590" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<line x1="195" y1="125" x2="285" y2="125" stroke="#68778b" stroke-width="3"/>
<text x="240" y="205" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">差 3</text>
<line x1="335" y1="125" x2="425" y2="125" stroke="#68778b" stroke-width="3"/>
<text x="380" y="205" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">差 2</text>
<line x1="475" y1="125" x2="565" y2="125" stroke="#68778b" stroke-width="3"/>
<text x="520" y="205" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">差 1</text>
<text x="65" y="270" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">三个差覆盖 1、2、3；不是任意两项之间的差</text>
</g></svg>
