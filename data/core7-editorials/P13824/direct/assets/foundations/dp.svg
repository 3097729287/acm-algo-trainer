<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title"><title id="title">DP：当前答案来自已经算好的子问题</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">DP：当前答案来自已经算好的子问题</text>
<rect x="75" y="85" width="180" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="165.0" y="122.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">f₂ = 2</text>
<rect x="425" y="85" width="180" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="515.0" y="122.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">f₃ = 3</text>
<rect x="240" y="205" width="270" height="60" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="375.0" y="242.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">f₄ = 2 + 3 = 5</text>
<line x1="165" y1="145" x2="320" y2="205" stroke="#68778b" stroke-width="3"/>
<line x1="515" y1="145" x2="430" y2="205" stroke="#68778b" stroke-width="3"/>
</g></svg>
