<svg xmlns="http://www.w3.org/2000/svg" width="760" height="435" viewBox="0 0 760 435" role="img" aria-labelledby="title"><title id="title">共同零位才有边，全一掩码的重复景点仍各自孤立</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">共同零位才有边，全一掩码的重复景点仍各自孤立</text>
<line x1="90" y1="135" x2="265" y2="135" stroke="#2365ab" stroke-width="4"/>
<line x1="265" y1="135" x2="440" y2="135" stroke="#2365ab" stroke-width="4"/>
<circle cx="90" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="90" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="90" y="195" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">缺位 2</text>
<circle cx="265" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="265" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="265" y="195" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">缺位 1、2</text>
<circle cx="440" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="440" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="440" y="195" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">缺位 1</text>
<circle cx="650" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="650" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<text x="650" y="195" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">缺位 0</text>
<circle cx="225" cy="300" r="29" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="225" y="307" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">7a</text>
<text x="225" y="355" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">没有零位</text>
<circle cx="530" cy="300" r="29" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="530" y="307" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">7b</text>
<text x="530" y="355" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">没有零位</text>
<text x="45" y="410" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">三个相连景点一组，另有六号与两个七号，共四组</text>
</g></svg>
