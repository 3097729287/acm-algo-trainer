<svg xmlns="http://www.w3.org/2000/svg" width="760" height="445" viewBox="0 0 760 445" role="img" aria-labelledby="title"><title id="title">右端四、至多三块：合法旧前缀是一至三</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">右端四、至多三块：合法旧前缀是一至三</text>
<text x="25" y="110" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">蛋糕</text>
<rect x="155" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="208.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">-2</text>
<rect x="265" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="318.5" y="111.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="375" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="428.5" y="111.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">-1</text>
<rect x="485" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="538.5" y="111.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="595" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="648.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">-5</text>
<text x="25" y="235" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">前缀</text>
<rect x="90" y="205" width="102" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="141.0" y="236.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="195" y="205" width="102" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="246.0" y="236.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">-2</text>
<rect x="300" y="205" width="102" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="351.0" y="236.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="405" y="205" width="102" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="456.0" y="236.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="510" y="205" width="102" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="561.0" y="236.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="615" y="205" width="102" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="666.0" y="236.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">-1</text>
<text x="45" y="335" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">右端前缀 4 − 最小旧前缀 (−2) = 6</text>
<text x="45" y="405" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">选 [3,−1,4]；当前前缀要在查询之后入队</text>
</g></svg>
