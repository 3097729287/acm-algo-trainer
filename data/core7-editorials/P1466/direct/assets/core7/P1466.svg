<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">一个划分被两个互补子集各统计一次</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">一个划分被两个互补子集各统计一次</text>
<rect x="95" y="95" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="173.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="255" y="95" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="333.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="505" y="95" width="157" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="583.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="255" y="225" fill="#2365ab" font-size="24" text-anchor="middle" font-weight="normal">集合和 3</text>
<text x="585" y="225" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">集合和 3</text>
<text x="65" y="295" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">选左边与选右边是同一组划分，最后计数除二</text>
