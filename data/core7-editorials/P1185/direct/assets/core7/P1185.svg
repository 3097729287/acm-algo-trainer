<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">删除右孩子及子树后，左子树仍在原来的字符列</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">删除右孩子及子树后，左子树仍在原来的字符列</text>
<text x="70" y="100" xml:space="preserve" font-family="Consolas,monospace" font-size="32">     o     </text>
<text x="70" y="142" xml:space="preserve" font-family="Consolas,monospace" font-size="32">    /      </text>
<text x="70" y="184" xml:space="preserve" font-family="Consolas,monospace" font-size="32">   /       </text>
<text x="70" y="226" xml:space="preserve" font-family="Consolas,monospace" font-size="32">  o        </text>
<text x="70" y="268" xml:space="preserve" font-family="Consolas,monospace" font-size="32"> / \       </text>
<text x="70" y="310" xml:space="preserve" font-family="Consolas,monospace" font-size="32">o   o      </text>
<text x="415" y="130" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">三层树，删除第 2 层</text>
<text x="415" y="180" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">从左数第 2 个结点</text>
<text x="415" y="245" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">整片右侧保留空格</text>
<text x="415" y="295" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">不重新居中，不改尺寸</text>
<text x="60" y="380" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">画布仍是 6 行、11 列，所有空白都是普通空格</text>
</g></svg>
