<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title"><title id="title">可以提前给下一层准备，每轮三次已足够</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">可以提前给下一层准备，每轮三次已足够</text>
<line x1="380" y1="90" x2="380" y2="190" stroke="#12805c" stroke-width="4"/>
<line x1="380" y1="190" x2="140" y2="310" stroke="#12805c" stroke-width="4"/>
<line x1="380" y1="190" x2="300" y2="310" stroke="#12805c" stroke-width="4"/>
<line x1="380" y1="190" x2="460" y2="310" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="190" x2="620" y2="310" stroke="#68778b" stroke-width="4"/>
<circle cx="380" cy="90" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="380" y="97" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="380" cy="190" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="380" y="197" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="140" cy="310" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="140" y="317" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="300" cy="310" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="300" y="317" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="460" cy="310" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="460" y="317" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="620" cy="310" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="620" y="317" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<text x="55" y="375" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">初始仅 1 黑；首轮把 2、3、4 染黑，对手走到 2</text>
<text x="55" y="430" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">第二轮再染 5、6：不必按最大孩子数回答 4</text>
</g></svg>
