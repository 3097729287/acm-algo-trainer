<svg xmlns="http://www.w3.org/2000/svg" width="760" height="505" viewBox="0 0 760 505" role="img" aria-labelledby="title"><title id="title">首轮看到负一的前提宝物，仍可能值得吃</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">首轮看到负一的前提宝物，仍可能值得吃</text>
<rect x="245" y="70" width="270" height="55" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="380.0" y="104.5" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">还剩 2 次，尚未解锁</text>
<line x1="380" y1="125" x2="205" y2="180" stroke="#2365ab" stroke-width="3"/>
<line x1="380" y1="125" x2="570" y2="180" stroke="#68778b" stroke-width="3"/>
<rect x="105" y="180" width="200" height="55" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="205.0" y="214.5" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">看到 A，吃得 −1</text>
<rect x="460" y="180" width="235" height="55" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="577.5" y="214.5" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">看到 B，尚不能吃</text>
<line x1="205" y1="235" x2="110" y2="310" stroke="#12805c" stroke-width="3"/>
<line x1="205" y1="235" x2="320" y2="310" stroke="#12805c" stroke-width="3"/>
<rect x="35" y="310" width="150" height="55" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="110.0" y="344.5" fill="#2365ab" font-size="18" text-anchor="middle" font-weight="normal">再来 A：放弃</text>
<rect x="245" y="310" width="150" height="55" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="320.0" y="344.5" fill="#12805c" font-size="18" text-anchor="middle" font-weight="normal">再来 B：+100</text>
<text x="110" y="405" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">总分 −1</text>
<text x="320" y="405" fill="#12805c" font-size="22" text-anchor="middle" font-weight="normal">总分 99</text>
<text x="575" y="345" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">之后最优也只得 0</text>
<text x="45" y="470" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">每次 A、B 各半：首轮吃 A 的条件期望 49，全局为 24.5</text>
</g></svg>
