<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title"><title id="title">二乘二全空白纸，一共九个长方形</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">二乘二全空白纸，一共九个长方形</text>
<rect x="55" y="105" width="90" height="90" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="100.0" y="157.0" fill="#12805c" font-size="28" text-anchor="middle" font-weight="normal">.</text>
<rect x="150" y="105" width="90" height="90" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="195.0" y="157.0" fill="#12805c" font-size="28" text-anchor="middle" font-weight="normal">.</text>
<rect x="55" y="200" width="90" height="90" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="100.0" y="252.0" fill="#12805c" font-size="28" text-anchor="middle" font-weight="normal">.</text>
<rect x="150" y="200" width="90" height="90" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="195.0" y="252.0" fill="#12805c" font-size="28" text-anchor="middle" font-weight="normal">.</text>
<text x="315" y="150" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">底在第一行：高度 [1,1]</text>
<text x="315" y="205" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">后缀贡献 1、2，共 3</text>
<text x="315" y="285" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">底在第二行：高度 [2,2]</text>
<text x="315" y="340" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">后缀贡献 2、4，共 6</text>
<text x="45" y="420" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">总计 3+6=9，也等于四单格、四双格、一个整格</text>
</g></svg>
