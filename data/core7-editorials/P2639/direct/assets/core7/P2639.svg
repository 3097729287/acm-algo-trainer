<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">同重的两捆可以各取一次，不能去重成一捆</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同重的两捆可以各取一次，不能去重成一捆</text>
<circle cx="160" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="160" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<circle cx="380" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="600" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="600" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<line x1="380" y1="170" x2="380" y2="235" stroke="#12805c" stroke-width="4"/>
<line x1="600" y1="170" x2="600" y2="235" stroke="#12805c" stroke-width="4"/>
<text x="490" y="275" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">5 + 5 = 10，恰好到容量</text>
<text x="65" y="325" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">重量 6 的那捆不取；不能拆捆，也不能重复拿同捆</text>
</g></svg>
