<svg xmlns="http://www.w3.org/2000/svg" width="760" height="475" viewBox="0 0 760 475" role="img" aria-labelledby="title"><title id="title">先吃指定的第二个，再沿已吃区间两侧扩展</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">先吃指定的第二个，再沿已吃区间两侧扩展</text>
<text x="55" y="85" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">初始美味度</text>
<rect x="95" y="105" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="163.5" y="136.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="235" y="105" width="137" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="303.5" y="136.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="375" y="105" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="443.5" y="136.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="515" y="105" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="583.5" y="136.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="55" y="235" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">可行吃法的原下标</text>
<rect x="95" y="255" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="163.5" y="286.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="235" y="255" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="303.5" y="286.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="375" y="255" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="443.5" y="286.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="515" y="255" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="583.5" y="286.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="65" y="385" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">得分：1×2 + 2×4 + 3×1 + 4×3 = 25</text>
<text x="65" y="450" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">首口后已吃段从 [2,2] 扩为 [2,3]、[2,4]、[1,4]</text>
</g></svg>
