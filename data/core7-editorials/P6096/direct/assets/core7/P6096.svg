<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">同样花一元到 X，可以保留更长的乘车前缀</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同样花一元到 X，可以保留更长的乘车前缀</text>
<text x="30" y="105" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">线一</text>
<rect x="155" y="75" width="92" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="201.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<rect x="250" y="75" width="92" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="296.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">X</text>
<text x="30" y="195" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">线二</text>
<rect x="155" y="165" width="92" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="201.0" y="196.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<rect x="250" y="165" width="92" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="296.0" y="196.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">Q</text>
<rect x="345" y="165" width="92" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="391.0" y="196.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">Q</text>
<rect x="440" y="165" width="92" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="486.0" y="196.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">Q</text>
<rect x="535" y="165" width="92" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="581.0" y="196.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">X</text>
<text x="30" y="285" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">线三</text>
<rect x="155" y="255" width="92" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="201.0" y="286.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">X</text>
<rect x="250" y="255" width="92" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="296.0" y="286.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<text x="400" y="110" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">时间 1，票价 1</text>
<text x="400" y="295" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">再花 1 元、坐 1 分钟</text>
<text x="40" y="348" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">选线二再线三：总票价 2，总时间 4+1=5</text>
</g></svg>
