<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">最便宜的演出不一定是每座城市的最优选择</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">最便宜的演出不一定是每座城市的最优选择</text>
<circle cx="90" cy="175" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="90" y="182" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="90" y="110" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">票 6</text>
<text x="90" y="250" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">答 6</text>
<circle cx="305" cy="175" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="305" y="182" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="305" y="110" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">票 20</text>
<text x="305" y="250" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">答 14</text>
<circle cx="520" cy="175" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="520" y="182" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="520" y="110" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">票 1</text>
<text x="520" y="250" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">答 1</text>
<circle cx="680" cy="175" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="680" y="182" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="680" y="110" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">票 25</text>
<text x="680" y="250" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">答 25</text>
<line x1="115" y1="175" x2="280" y2="175" stroke="#2365ab" stroke-width="3"/>
<line x1="330" y1="175" x2="495" y2="175" stroke="#2365ab" stroke-width="3"/>
<text x="190" y="160" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">往返 8</text>
<text x="412" y="160" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">往返 14</text>
<text x="55" y="315" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">二号选一号：6+8=14；选三号反而是 1+14=15</text>
</g></svg>
