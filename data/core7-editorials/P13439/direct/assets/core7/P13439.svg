<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">释放者不用付，当前同段其余七人都要贿赂</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">释放者不用付，当前同段其余七人都要贿赂</text>
<rect x="55" y="100" width="77" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="93.5" y="131.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="135" y="100" width="77" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="173.5" y="131.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="215" y="100" width="77" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="253.5" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="295" y="100" width="77" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="333.5" y="131.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="375" y="100" width="77" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="413.5" y="131.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="455" y="100" width="77" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="493.5" y="131.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="535" y="100" width="77" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="573.5" y="131.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">7</text>
<rect x="615" y="100" width="77" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="653.5" y="131.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<text x="65" y="240" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">共 8 间牢房，先释放第 3 人；其它 7 人都听到</text>
<text x="65" y="305" fill="#12805c" font-size="25" text-anchor="start" font-weight="normal">边界为 0、9：本次费用 9−0−2=7</text>
</g></svg>
