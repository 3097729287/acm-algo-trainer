<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425" role="img" aria-labelledby="title"><title id="title">四点链有六个不同 DFS 首次访问序列</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">四点链有六个不同 DFS 首次访问序列</text>
<line x1="110" y1="110" x2="290" y2="110" stroke="#68778b" stroke-width="4"/>
<line x1="290" y1="110" x2="470" y2="110" stroke="#68778b" stroke-width="4"/>
<line x1="470" y1="110" x2="650" y2="110" stroke="#68778b" stroke-width="4"/>
<circle cx="110" cy="110" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="110" y="117" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="290" cy="110" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="290" y="117" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="470" cy="110" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="470" y="117" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="650" cy="110" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="650" y="117" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="65" y="205" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">根 1：1234；根 2：2134 或 2341</text>
<text x="65" y="275" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">根 3：3214 或 3421；根 4：4321</text>
<text x="65" y="350" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">固定根：根的孩子有 deg! 种排列，其它点为 (deg−1)!</text>
<text x="65" y="405" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">仅首次进入的结点写入序列；回退本身不再写一次</text>
</g></svg>
