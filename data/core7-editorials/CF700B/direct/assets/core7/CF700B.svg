<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" role="img" aria-labelledby="title"><title id="title">四个大学排成链：同一配对让各边都达到上界</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">四个大学排成链：同一配对让各边都达到上界</text>
<line x1="100" y1="245" x2="285" y2="245" stroke="#68778b" stroke-width="5"/>
<line x1="285" y1="245" x2="470" y2="245" stroke="#68778b" stroke-width="5"/>
<line x1="470" y1="245" x2="655" y2="245" stroke="#68778b" stroke-width="5"/>
<circle cx="100" cy="245" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="100" y="252" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="285" cy="245" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="285" y="252" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="470" cy="245" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="470" y="252" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="655" cy="245" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="655" y="252" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<line x1="100" y1="222" x2="100" y2="90" stroke="#2365ab" stroke-width="3"/>
<line x1="100" y1="90" x2="470" y2="90" stroke="#2365ab" stroke-width="3"/>
<line x1="470" y1="90" x2="470" y2="222" stroke="#2365ab" stroke-width="3"/>
<line x1="285" y1="222" x2="285" y2="160" stroke="#12805c" stroke-width="3"/>
<line x1="285" y1="160" x2="655" y2="160" stroke="#12805c" stroke-width="3"/>
<line x1="655" y1="160" x2="655" y2="222" stroke="#12805c" stroke-width="3"/>
<text x="192.5" y="315" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">1 对跨边</text>
<text x="377.5" y="315" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">2 对跨边</text>
<text x="562.5" y="315" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">1 对跨边</text>
<text x="55" y="365" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">配对 (1,3)、(2,4)，距离各二；边贡献之和 1+2+1=4</text>
</g></svg>
