<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">两色可整体交换；孤立学生可以独立选择学校</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两色可整体交换；孤立学生可以独立选择学校</text>
<line x1="285" y1="200" x2="100" y2="120" stroke="#68778b" stroke-width="4"/>
<line x1="285" y1="200" x2="100" y2="235" stroke="#68778b" stroke-width="4"/>
<line x1="285" y1="200" x2="470" y2="120" stroke="#68778b" stroke-width="4"/>
<circle cx="100" cy="120" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="100" y="127" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="285" cy="200" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="285" y="207" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="100" cy="235" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="100" y="242" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="470" cy="120" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="470" y="127" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="650" cy="235" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="650" y="242" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="70" y="300" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">交流块：三人对一人</text>
<text x="525" y="300" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">孤立点：一对零</text>
<text x="55" y="350" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">B 校最少 1+0=1 人，最多 3+1=4 人</text>
</g></svg>
