<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title"><title id="title">最近共同领导是 2，但最大编号的共同领导是 5</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">最近共同领导是 2，但最大编号的共同领导是 5</text>
<line x1="100" y1="90" x2="260" y2="180" stroke="#12805c" stroke-width="4"/>
<line x1="260" y1="180" x2="390" y2="270" stroke="#12805c" stroke-width="4"/>
<line x1="390" y1="270" x2="295" y2="365" stroke="#68778b" stroke-width="4"/>
<line x1="390" y1="270" x2="520" y2="365" stroke="#68778b" stroke-width="4"/>
<line x1="100" y1="90" x2="100" y2="270" stroke="#68778b" stroke-width="4"/>
<circle cx="100" cy="90" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="100" y="97" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<circle cx="260" cy="180" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="260" y="187" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="390" cy="270" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="390" y="277" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="295" cy="365" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="295" y="372" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="520" cy="365" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="520" y="372" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="100" cy="270" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="100" y="277" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="435" y="115" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">参与者：3、4</text>
<text x="435" y="175" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">共同领导：2、5、0</text>
<text x="435" y="225" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">取最大编号 5</text>
<text x="60" y="422" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">输入领导编号不必小于下属；不能直接输出 LCA</text>
</g></svg>
