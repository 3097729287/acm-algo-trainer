<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">修路付的是损坏部分，完好长路仍为零</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">修路付的是损坏部分，完好长路仍为零</text>
<line x1="90" y1="185" x2="355" y2="100" stroke="#68778b" stroke-width="4"/>
<line x1="355" y1="100" x2="665" y2="185" stroke="#bc3645" stroke-width="4"/>
<line x1="90" y1="185" x2="355" y2="280" stroke="#12805c" stroke-width="4"/>
<line x1="355" y1="280" x2="665" y2="185" stroke="#12805c" stroke-width="4"/>
<circle cx="90" cy="185" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="90" y="192" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<circle cx="355" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="355" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="355" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="355" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="665" cy="185" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="665" y="192" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<text x="170" y="115" fill="#68778b" font-size="20" text-anchor="start" font-weight="normal">完好：0</text>
<text x="470" y="105" fill="#bc3645" font-size="20" text-anchor="start" font-weight="normal">损坏：100</text>
<text x="160" y="290" fill="#12805c" font-size="20" text-anchor="start" font-weight="normal">完好：0</text>
<text x="485" y="285" fill="#12805c" font-size="20" text-anchor="start" font-weight="normal">损坏：4</text>
<text x="70" y="350" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">选择 A→3→B，修复费 0+4=4</text>
</g></svg>
