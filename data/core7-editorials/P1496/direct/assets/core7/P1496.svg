<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">火烧赤壁：重叠长度只算一次</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">火烧赤壁：重叠长度只算一次</text>
<text x="35" y="107" fill="#2365ab" font-size="18" text-anchor="start" font-weight="normal">原段 1</text>
<line x1="170" y1="100" x2="250" y2="100" stroke="#2365ab" stroke-width="9"/>
<text x="35" y="172" fill="#12805c" font-size="18" text-anchor="start" font-weight="normal">原段 2</text>
<line x1="290" y1="165" x2="570" y2="165" stroke="#12805c" stroke-width="9"/>
<text x="35" y="237" fill="#bc3645" font-size="18" text-anchor="start" font-weight="normal">原段 3</text>
<line x1="410" y1="230" x2="650" y2="230" stroke="#bc3645" stroke-width="9"/>
<text x="170" y="282" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">-1</text>
<text x="250" y="282" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">1</text>
<text x="290" y="282" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">2</text>
<text x="410" y="282" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">5</text>
<text x="570" y="282" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">9</text>
<text x="650" y="282" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">11</text>
<text x="90" y="330" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">并集为 [−1,1) 与 [2,11)，总长度 2+9=11</text>
</g></svg>
