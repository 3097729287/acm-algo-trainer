<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">高度三、五、六：按 0→6→3→5 跳，共耗 49</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">高度三、五、六：按 0→6→3→5 跳，共耗 49</text>
<line x1="120" y1="290" x2="290" y2="80" stroke="#2365ab" stroke-width="3"/>
<line x1="290" y1="80" x2="460" y2="185" stroke="#2365ab" stroke-width="3"/>
<line x1="460" y1="185" x2="630" y2="115" stroke="#2365ab" stroke-width="3"/>
<circle cx="120" cy="290" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="120" y="297" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<text x="120" y="338" fill="#243449" font-size="17" text-anchor="middle" font-weight="normal">地面</text>
<circle cx="290" cy="80" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="290" y="87" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<text x="290" y="128" fill="#243449" font-size="17" text-anchor="middle" font-weight="normal">高度 6</text>
<circle cx="460" cy="185" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="460" y="192" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="460" y="233" fill="#243449" font-size="17" text-anchor="middle" font-weight="normal">高度 3</text>
<circle cx="630" cy="115" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="630" y="122" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="630" y="163" fill="#243449" font-size="17" text-anchor="middle" font-weight="normal">高度 5</text>
<text x="180" y="160" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">耗 36</text>
<text x="360" y="110" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">耗 9</text>
<text x="545" y="125" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">耗 4</text>
<text x="95" y="345" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">每段计高度差的平方：36+9+4=49</text>
</g></svg>
