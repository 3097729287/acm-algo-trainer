<svg xmlns="http://www.w3.org/2000/svg" width="760" height="555" viewBox="0 0 760 555" role="img" aria-labelledby="title"><title id="title">公共分支与交点抵消：路径总异或再异或交点权</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">公共分支与交点抵消：路径总异或再异或交点权</text>
<line x1="380" y1="105" x2="380" y2="195" stroke="#12805c" stroke-width="7"/>
<line x1="355" y1="235" x2="205" y2="330" stroke="#2365ab" stroke-width="5"/>
<line x1="405" y1="235" x2="555" y2="330" stroke="#bc3645" stroke-width="5"/>
<circle cx="380" cy="80" r="27" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="380" y="87" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="380" cy="220" r="27" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="380" y="227" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="180" cy="345" r="27" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="180" y="352" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<circle cx="580" cy="345" r="27" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="580" y="352" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<text x="425" y="85" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">t，点权1</text>
<text x="425" y="220" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">c，点权2</text>
<text x="110" y="400" fill="#2365ab" font-size="21" text-anchor="start" font-weight="normal">a，点权6</text>
<text x="525" y="400" fill="#bc3645" font-size="21" text-anchor="start" font-weight="normal">b，点权8</text>
<text x="45" y="465" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">(1⊕2⊕6) ⊕ (1⊕2⊕8) = 14</text>
<text x="45" y="525" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">X = 6⊕2⊕8 = 12；X⊕w[c] = 12⊕2 = 14</text>
</g></svg>
