<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title"><title id="title">并查集：父指针最终指向同一代表</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">并查集：父指针最终指向同一代表</text>
<circle cx="140" cy="115" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="140" y="122" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<circle cx="380" cy="115" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="122" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="620" cy="115" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="620" y="122" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<line x1="356" y1="115" x2="164" y2="115" stroke="#68778b" stroke-width="3"/>
<line x1="596" y1="115" x2="404" y2="115" stroke="#68778b" stroke-width="3"/>
<text x="375" y="190" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">2 → 1 → 0；三个点属于同一组</text>
<text x="375" y="245" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">压缩后 2 直接指向 0，组内关系不变</text>
</g></svg>
