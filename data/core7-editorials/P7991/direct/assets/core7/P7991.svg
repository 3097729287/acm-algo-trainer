<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">两条新路可以共用中间区域，不必连通全体田地</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两条新路可以共用中间区域，不必连通全体田地</text>
<line x1="75" y1="150" x2="195" y2="150" stroke="#2365ab" stroke-width="5"/>
<line x1="555" y1="150" x2="675" y2="150" stroke="#2365ab" stroke-width="5"/>
<line x1="195" y1="150" x2="315" y2="150" stroke="#12805c" stroke-width="5"/>
<line x1="315" y1="172" x2="315" y2="265" stroke="#12805c" stroke-width="4"/>
<line x1="315" y1="265" x2="555" y2="265" stroke="#12805c" stroke-width="4"/>
<line x1="555" y1="265" x2="555" y2="172" stroke="#12805c" stroke-width="4"/>
<circle cx="75" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="75" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="195" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="195" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="315" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="315" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="435" cy="150" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="435" y="157" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="555" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="555" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="675" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="675" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<text x="255" y="110" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">费用 1</text>
<text x="435" y="310" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">费用 4</text>
<text x="45" y="365" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">选择 2−3、3−5，总费用五；四号不必接入牛棚路线</text>
</g></svg>
