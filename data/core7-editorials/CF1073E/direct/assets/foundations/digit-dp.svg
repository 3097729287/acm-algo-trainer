<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">不超过二进制 101，禁止相邻两个 1，零不计</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">不超过二进制 101，禁止相邻两个 1，零不计</text>
<rect x="35" y="105" width="112" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="91.0" y="136.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">000</text>
<rect x="150" y="105" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="206.0" y="136.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">001</text>
<rect x="265" y="105" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="321.0" y="136.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">010</text>
<rect x="380" y="105" width="112" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="436.0" y="136.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">011</text>
<rect x="495" y="105" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="551.0" y="136.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">100</text>
<rect x="610" y="105" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="666.0" y="136.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">101</text>
<text x="91" y="205" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">0</text>
<text x="206" y="205" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">1</text>
<text x="321" y="205" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">2</text>
<text x="436" y="205" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">3</text>
<text x="551" y="205" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">4</text>
<text x="666" y="205" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">5</text>
<text x="45" y="285" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">001 与 010 的占位零不属于实际表示</text>
<text x="45" y="350" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">合法正整数：1、2、4、5，共 4 个</text>
</g></svg>
