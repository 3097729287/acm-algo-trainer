<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">右端加入 3：旧后缀两段合成同一 GCD 组</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">右端加入 3：旧后缀两段合成同一 GCD 组</text>
<rect x="200" y="75" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="256.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="315" y="75" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="371.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="430" y="75" width="112" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="486.0" y="106.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<line x1="485" y1="190" x2="485" y2="190" stroke="#bc3645" stroke-width="6"/>
<circle cx="485" cy="190" r="5" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="555" y="197" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">[3]：GCD 3</text>
<line x1="370" y1="240" x2="485" y2="240" stroke="#12805c" stroke-width="6"/>
<circle cx="370" cy="240" r="5" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="555" y="247" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">[2,3]：GCD 1</text>
<line x1="255" y1="290" x2="485" y2="290" stroke="#12805c" stroke-width="6"/>
<circle cx="255" cy="290" r="5" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="555" y="297" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">[2,2,3]：GCD 1</text>
<text x="95" y="345" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">分组为 (3,1)、(1,2)，本轮贡献 3×1+1×2=5</text>
</g></svg>
