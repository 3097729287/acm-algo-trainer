<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" role="img" aria-labelledby="title"><title id="title">一、三、四元凑六元，先拿大面额会多用一张</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">一、三、四元凑六元，先拿大面额会多用一张</text>
<circle cx="180" cy="120" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="180" y="127" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="290" cy="120" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="290" y="127" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="400" cy="120" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="400" y="127" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="180" cy="230" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="180" y="237" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="290" cy="230" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="290" y="237" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="530" y="130" fill="#bc3645" font-size="23" text-anchor="start" font-weight="normal">三张</text>
<text x="420" y="240" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">两张，最优</text>
<text x="65" y="315" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">比较最后一张后的剩余金额，不按面额贪心</text>
</g></svg>
