<svg xmlns="http://www.w3.org/2000/svg" width="760" height="315" viewBox="0 0 760 315" role="img" aria-labelledby="title"><title id="title">二级图腾：一个上方、两个下方的一级图形</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">二级图腾：一个上方、两个下方的一级图形</text>
<line x1="310" y1="75" x2="230" y2="155" stroke="#2365ab" stroke-width="3"/>
<line x1="310" y1="75" x2="390" y2="155" stroke="#2365ab" stroke-width="3"/>
<line x1="230" y1="155" x2="390" y2="155" stroke="#2365ab" stroke-width="3"/>
<line x1="230" y1="155" x2="150" y2="235" stroke="#2365ab" stroke-width="3"/>
<line x1="230" y1="155" x2="310" y2="235" stroke="#2365ab" stroke-width="3"/>
<line x1="150" y1="235" x2="310" y2="235" stroke="#2365ab" stroke-width="3"/>
<line x1="390" y1="155" x2="310" y2="235" stroke="#2365ab" stroke-width="3"/>
<line x1="390" y1="155" x2="470" y2="235" stroke="#2365ab" stroke-width="3"/>
<line x1="310" y1="235" x2="470" y2="235" stroke="#2365ab" stroke-width="3"/>
<text x="310" y="280" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">中心朝下的空洞保持为空格</text>
</g></svg>
