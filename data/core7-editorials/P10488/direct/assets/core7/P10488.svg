<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">交换两段只改变三处接缝，内部顺序保留</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">交换两段只改变三处接缝，内部顺序保留</text>
<rect x="50" y="85" width="79" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="89.5" y="116.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="132" y="85" width="79" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="171.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="214" y="85" width="79" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="253.5" y="116.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="296" y="85" width="79" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="335.5" y="116.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="378" y="85" width="79" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="417.5" y="116.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="460" y="85" width="79" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="499.5" y="116.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
