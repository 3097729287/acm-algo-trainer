<text x="581.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="624" y="85" width="79" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="663.5" y="116.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">7</text>
<line x1="212" y1="70" x2="212" y2="153" stroke="#2365ab" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="376" y1="70" x2="376" y2="153" stroke="#2365ab" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="540" y1="70" x2="540" y2="153" stroke="#2365ab" stroke-width="3" stroke-dasharray="7 5"/>
<text x="60" y="195" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">原断点：1→4、5→2、3→6，恰好三处</text>
<rect x="50" y="240" width="79" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="89.5" y="271.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="132" y="240" width="79" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="171.5" y="271.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="214" y="240" width="79" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="253.5" y="271.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="296" y="240" width="79" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="335.5" y="271.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="378" y="240" width="79" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="417.5" y="271.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="460" y="240" width="79" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="499.5" y="271.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="542" y="240" width="79" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="581.5" y="271.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="624" y="240" width="79" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="663.5" y="271.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">7</text>
<text x="60" y="340" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">交换 [4,5] 与 [2,3] 后全部有序；灰格是两端哨兵</text>
</g></svg>
