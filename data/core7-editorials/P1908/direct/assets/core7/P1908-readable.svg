<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title"><title id="title">合并 [2,4,5] 与 [1,3,6]：右值 1 一次匹配三项</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">合并 [2,4,5] 与 [1,3,6]：右值 1 一次匹配三项</text>
<rect x="130" y="85" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="183.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="240" y="85" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="293.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="350" y="85" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="403.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="130" y="210" width="107" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="183.5" y="241.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="240" y="210" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="293.5" y="241.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="350" y="210" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="403.5" y="241.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<line x1="183" y1="135" x2="183" y2="207" stroke="#bc3645" stroke-width="2"/>
<line x1="293" y1="135" x2="183" y2="207" stroke="#bc3645" stroke-width="2"/>
<line x1="403" y1="135" x2="183" y2="207" stroke="#bc3645" stroke-width="2"/>
<text x="625" y="125" fill="#bc3645" font-size="22" text-anchor="middle" font-weight="normal">1 &lt; 2 ≤ 4 ≤ 5</text>
<text x="625" y="250" fill="#bc3645" font-size="22" text-anchor="middle" font-weight="normal">本次增加 3 对</text>
<text x="80" y="315" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">左半原下标都较小；归并排序不改变左右所属半段</text>
</g></svg>
