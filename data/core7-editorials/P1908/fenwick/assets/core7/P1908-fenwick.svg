<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title"><title id="title">当前值 3：此前四项中严格大于它的有三项</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">当前值 3：此前四项中严格大于它的有三项</text>
<rect x="110" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="163.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="220" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="273.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="330" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="383.5" y="111.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="440" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="493.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="590" y="80" width="100" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="640.0" y="111.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<line x1="163" y1="145" x2="640" y2="210" stroke="#12805c" stroke-width="2"/>
<line x1="273" y1="145" x2="640" y2="210" stroke="#12805c" stroke-width="2"/>
<line x1="493" y1="145" x2="640" y2="210" stroke="#12805c" stroke-width="2"/>
<text x="85" y="265" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">此前共 4 项，≤3 的只有 2：严格大于者 4−1=3</text>
</g></svg>
