<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title"><title id="title">三连可以出现在中途，但同一号码不能兼有四和八</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">三连可以出现在中途，但同一号码不能兼有四和八</text>
<rect x="45" y="100" width="350" height="55" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="220.0" y="134.5" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">14444101000</text>
<text x="420" y="135" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">有三连；无 8</text>
<rect x="45" y="220" width="350" height="55" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="220.0" y="254.5" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">14444444448</text>
<text x="420" y="255" fill="#bc3645" font-size="21" text-anchor="start" font-weight="normal">虽有三连，但兼有 4、8</text>
<rect x="45" y="340" width="350" height="55" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="220.0" y="374.5" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">10010012022</text>
<text x="420" y="375" fill="#68778b" font-size="21" text-anchor="start" font-weight="normal">没有三连</text>
</g></svg>
