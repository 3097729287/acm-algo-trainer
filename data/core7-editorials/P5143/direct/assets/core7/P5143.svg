<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">高度顺序固定：五个点必须依次访问</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">高度顺序固定：五个点必须依次访问</text>
<line x1="100" y1="265" x2="230" y2="222" stroke="#2365ab" stroke-width="3"/>
<line x1="230" y1="222" x2="360" y2="179" stroke="#2365ab" stroke-width="3"/>
<line x1="360" y1="179" x2="490" y2="136" stroke="#2365ab" stroke-width="3"/>
<line x1="490" y1="136" x2="620" y2="93" stroke="#2365ab" stroke-width="3"/>
<circle cx="100" cy="265" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="100" y="272" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="100" y="308" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">(1,1,1)</text>
<circle cx="230" cy="222" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="230" y="229" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="230" y="265" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">(2,2,2)</text>
<circle cx="360" cy="179" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="360" y="186" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="360" y="222" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">(3,3,3)</text>
<circle cx="490" cy="136" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="490" y="143" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="490" y="179" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">(4,4,4)</text>
<circle cx="620" cy="93" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="620" y="100" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="620" y="136" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">(5,5,5)</text>
<text x="80" y="335" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">每一段长 √3，共四段，总长 4√3 ≈ 6.928</text>
</g></svg>
