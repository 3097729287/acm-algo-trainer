<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title"><title id="title">一秒只走一步，对角两格相距两步，不能连续打中</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">一秒只走一步，对角两格相距两步，不能连续打中</text>
<line x1="120" y1="90" x2="120" y2="330" stroke="#68778b" stroke-width="3"/>
<line x1="240" y1="90" x2="240" y2="330" stroke="#68778b" stroke-width="3"/>
<line x1="360" y1="90" x2="360" y2="330" stroke="#68778b" stroke-width="3"/>
<line x1="120" y1="90" x2="360" y2="90" stroke="#68778b" stroke-width="3"/>
<line x1="120" y1="210" x2="360" y2="210" stroke="#68778b" stroke-width="3"/>
<line x1="120" y1="330" x2="360" y2="330" stroke="#68778b" stroke-width="3"/>
<line x1="180" y1="150" x2="300" y2="150" stroke="#12805c" stroke-width="4"/>
<line x1="300" y1="150" x2="300" y2="270" stroke="#12805c" stroke-width="4"/>
<circle cx="180" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="180" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="300" cy="270" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="300" y="277" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="420" y="135" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">圆内是出现时刻</text>
<text x="420" y="205" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">时间差 1 &lt; 距离 2</text>
<text x="420" y="275" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">初始位置任选，只打 1 只</text>
</g></svg>
