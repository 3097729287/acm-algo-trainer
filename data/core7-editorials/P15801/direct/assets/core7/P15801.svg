<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">完全二叉树的最后一层必须从左连续填</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">完全二叉树的最后一层必须从左连续填</text>
<line x1="220" y1="115" x2="120" y2="240" stroke="#68778b" stroke-width="4"/>
<circle cx="220" cy="115" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="220" y="122" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="120" cy="240" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="120" y="247" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<line x1="520" y1="115" x2="620" y2="240" stroke="#68778b" stroke-width="4"/>
<circle cx="520" cy="115" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="520" y="122" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="620" cy="240" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="620" y="247" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="220" y="295" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">只有左孩子：两棵子树都完全</text>
<text x="540" y="335" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">只有右孩子：只有叶子子树完全</text>
<text x="60" y="375" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">左右方向不能交换；空树可作高度零的满子树</text>
</g></svg>
