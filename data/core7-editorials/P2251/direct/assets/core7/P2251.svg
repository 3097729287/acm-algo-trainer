<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title"><title id="title">等分保留较新的产品，最低分不会改变</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">等分保留较新的产品，最低分不会改变</text>
<rect x="55" y="100" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="118.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">16</text>
<rect x="185" y="100" width="127" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="248.5" y="131.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="315" y="100" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="378.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="445" y="100" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="508.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">9</text>
<rect x="575" y="100" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="638.5" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="45" y="235" fill="#243449" font-size="24" text-anchor="start" font-weight="normal">窗口 [16,5,6,9] 最低 5</text>
<text x="45" y="300" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">移到 [5,6,9,5] 仍最低 5，可用较新的第 5 件</text>
<text x="45" y="365" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">只比大小不能判断过期，候选必须保存位置</text>
</g></svg>
