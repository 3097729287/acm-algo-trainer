<rect x="175" y="85" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="228.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
