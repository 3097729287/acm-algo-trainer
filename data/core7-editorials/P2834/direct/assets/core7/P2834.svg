<svg xmlns="http://www.w3.org/2000/svg" width="760" height="335" viewBox="0 0 760 335" role="img" aria-labelledby="title"><title id="title">一元与二元凑三元，按数量组合只计两种</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">一元与二元凑三元，按数量组合只计两种</text>
<circle cx="180" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="180" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="290" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="290" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="400" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="400" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="180" cy="230" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="180" y="237" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="290" cy="230" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="290" y="237" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="555" y="135" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">3 张一元</text>
<text x="445" y="240" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">1 张一元、1 张二元</text>
<text x="65" y="310" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">1+2 与 2+1 是同一组；面额应在外层处理</text>
</g></svg>
