<text x="206.0" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="265" y="100" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="321.0" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="380" y="100" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="436.0" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="495" y="100" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="551.0" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="610" y="100" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="666.0" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="45" y="225" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">上方按顺序为六头牛的实际身高</text>
<rect x="35" y="285" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="91.0" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="150" y="285" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="206.0" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="265" y="285" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="321.0" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="380" y="285" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="436.0" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="495" y="285" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="551.0" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="610" y="285" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="666.0" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<text x="45" y="385" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">下方是目标编号；高度相同的相邻牛不能互相仰望</text>
</g></svg>
