<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title"><title id="title">最近且严格更高：两个高度一都看向第六头</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">最近且严格更高：两个高度一都看向第六头</text>
<rect x="35" y="100" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="91.0" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
