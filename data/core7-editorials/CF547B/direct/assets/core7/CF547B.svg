<svg xmlns="http://www.w3.org/2000/svg" width="760" height="435" viewBox="0 0 760 435" role="img" aria-labelledby="title"><title id="title">跨度内的最小值三，可以为短于它的窗口提供候选</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">跨度内的最小值三，可以为短于它的窗口提供候选</text>
<rect x="55" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="118.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="185" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="248.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="315" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="378.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="445" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="508.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="575" y="95" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="638.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="45" y="225" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">第3至5项最小为3，跨度长3，可提供长度1、2、3</text>
<rect x="55" y="290" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="118.5" y="321.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="185" y="290" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="248.5" y="321.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="315" y="290" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="378.5" y="321.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="445" y="290" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="508.5" y="321.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="575" y="290" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="638.5" y="321.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="45" y="405" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">全部最优强度：4、3、3、2、1；长跨度向短传播</text>
</g></svg>
