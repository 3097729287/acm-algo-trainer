<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title"><title id="title">4、1、6：首个更大位置与滑窗极值是不同答案</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">4、1、6：首个更大位置与滑窗极值是不同答案</text>
<rect x="135" y="100" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="213.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="295" y="100" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="373.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="455" y="100" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="533.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<text x="45" y="230" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">位置答案：3、3、0；6 到来时解决前两项</text>
<rect x="60" y="290" width="285" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="202.5" y="327.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">窗口 [4,1] 最大为 4</text>
<rect x="390" y="290" width="300" height="60" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="540.0" y="327.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">窗口 [1,6] 最大为 6</text>
<text x="45" y="415" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">栈等答案被解决；队列删去更差且更早过期的候选</text>
</g></svg>
