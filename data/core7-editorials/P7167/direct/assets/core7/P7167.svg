<svg xmlns="http://www.w3.org/2000/svg" width="760" height="445" viewBox="0 0 760 445" role="img" aria-labelledby="title"><title id="title">喷泉：1→2→5，等直径或更小盘直接跳过</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">喷泉：1→2→5，等直径或更小盘直接跳过</text>
<line x1="243" y1="125" x2="307" y2="125" stroke="#2365ab" stroke-width="6"/>
<text x="75" y="132" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">盘 1</text>
<text x="390" y="132" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">直径 4，容量 10</text>
<line x1="227" y1="180" x2="323" y2="180" stroke="#2365ab" stroke-width="6"/>
<text x="75" y="187" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">盘 2</text>
<text x="390" y="187" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">直径 6，容量 8</text>
<line x1="251" y1="235" x2="299" y2="235" stroke="#2365ab" stroke-width="6"/>
<text x="75" y="242" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">盘 3</text>
<text x="390" y="242" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">直径 3，容量 5</text>
<line x1="243" y1="290" x2="307" y2="290" stroke="#2365ab" stroke-width="6"/>
<text x="75" y="297" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">盘 4</text>
<text x="390" y="297" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">直径 4，容量 14</text>
<line x1="195" y1="345" x2="355" y2="345" stroke="#2365ab" stroke-width="6"/>
<text x="75" y="352" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">盘 5</text>
<text x="390" y="352" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">直径 10，容量 9</text>
<line x1="180" y1="130" x2="165" y2="180" stroke="#bc3645" stroke-width="3"/>
<line x1="165" y1="185" x2="165" y2="340" stroke="#bc3645" stroke-width="3"/>
<text x="535" y="383" fill="#12805c" font-size="19" text-anchor="middle" font-weight="normal">倒入 25：10+8 后剩 7，停盘 5</text>
<text x="75" y="425" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">若只倒入 18，恰好填满盘 2，答案是 2，不能再跳</text>
</g></svg>
