<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">第四行的两个三，分别来自上一行相邻两项</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">第四行的两个三，分别来自上一行相邻两项</text>
<circle cx="380" cy="85" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="92" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="325" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="325" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="435" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="435" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="270" cy="215" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="270" y="222" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="380" cy="215" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="222" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="490" cy="215" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="490" y="222" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="215" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="215" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="325" cy="280" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="325" y="287" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="435" cy="280" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="435" y="287" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="545" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="545" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<line x1="270" y1="239" x2="325" y2="256" stroke="#12805c" stroke-width="3"/>
<line x1="380" y1="239" x2="325" y2="256" stroke="#12805c" stroke-width="3"/>
<line x1="380" y1="239" x2="435" y2="256" stroke="#12805c" stroke-width="3"/>
<line x1="490" y1="239" x2="435" y2="256" stroke="#12805c" stroke-width="3"/>
<text x="60" y="335" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">左侧三：1+2；右侧三：2+1；首尾直接为一</text>
</g></svg>
