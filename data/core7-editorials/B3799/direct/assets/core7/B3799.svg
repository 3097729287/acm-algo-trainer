<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">统一加三后，正值来自原排序数组的一个后缀</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">统一加三后，正值来自原排序数组的一个后缀</text>
<rect x="110" y="75" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="166.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">-7</text>
<rect x="225" y="75" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="281.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">-5</text>
<rect x="340" y="75" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="396.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="455" y="75" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="511.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<rect x="570" y="75" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="626.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">12</text>
<rect x="110" y="190" width="112" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="166.0" y="221.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">-4</text>
<rect x="225" y="190" width="112" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="281.0" y="221.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">-2</text>
<rect x="340" y="190" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="396.0" y="221.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="455" y="190" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="511.0" y="221.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">11</text>
<rect x="570" y="190" width="112" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="626.0" y="221.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">15</text>
<line x1="335" y1="65" x2="335" y2="260" stroke="#bc3645" stroke-width="3" stroke-dasharray="7 5"/>
<text x="80" y="300" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">原值 &gt;−3 的后缀：2、8、12；实际和 5+11+15=31</text>
<text x="80" y="337" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">每项加同一偏移，排序次序不变</text>
</g></svg>
