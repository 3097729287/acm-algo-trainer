<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" role="img" aria-labelledby="title"><title id="title">用了相同张数会到同一位置，仍需比较已经得到的分</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">用了相同张数会到同一位置，仍需比较已经得到的分</text>
<rect x="130" y="95" width="132" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="196.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="265" y="95" width="132" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="331.0" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="400" y="95" width="132" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="466.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">10</text>
<rect x="535" y="95" width="132" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="601.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="195" y="175" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">格 1</text>
<text x="330" y="175" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">格 2</text>
<text x="465" y="175" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">格 3</text>
<text x="600" y="175" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">格 4</text>
<text x="65" y="245" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">先 1 再 2：5+1+3=9</text>
<text x="65" y="305" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">先 2 再 1：5+10+3=18</text>
<text x="65" y="365" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">两种卡各用一张，都到第 4 格；状态保留 18 分</text>
</g></svg>
