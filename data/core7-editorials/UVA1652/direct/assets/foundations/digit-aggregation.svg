<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title"><title id="title">同一批前缀：整数和与数位和的更新不同</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同一批前缀：整数和与数位和的更新不同</text>
<rect x="80" y="100" width="140" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="150.0" y="137.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<line x1="225" y1="130" x2="440" y2="130" stroke="#12805c" stroke-width="3"/>
<text x="330" y="115" fill="#12805c" font-size="23" text-anchor="middle" font-weight="normal">接上 3</text>
<rect x="450" y="100" width="180" height="60" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="540.0" y="137.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">13</text>
<rect x="80" y="220" width="140" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="150.0" y="257.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<line x1="225" y1="250" x2="440" y2="250" stroke="#12805c" stroke-width="3"/>
<text x="330" y="235" fill="#12805c" font-size="23" text-anchor="middle" font-weight="normal">接上 3</text>
<rect x="450" y="220" width="180" height="60" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="540.0" y="257.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">23</text>
<text x="45" y="345" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">数量 2；整数和 13+23=36；数位和 1+3+2+3=9</text>
<text x="45" y="390" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">前者旧和乘十，后者旧和不乘十</text>
</g></svg>
