<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title"><title id="title">同一棵博弈树，分别安排叶子使结果最大与最小</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同一棵博弈树，分别安排叶子使结果最大与最小</text>
<line x1="190" y1="100" x2="80" y2="245" stroke="#68778b" stroke-width="3"/>
<line x1="190" y1="100" x2="270" y2="205" stroke="#68778b" stroke-width="3"/>
<line x1="270" y1="205" x2="215" y2="315" stroke="#68778b" stroke-width="3"/>
<line x1="270" y1="205" x2="325" y2="315" stroke="#68778b" stroke-width="3"/>
<rect x="150" y="80" width="80" height="40" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="190.0" y="107.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">MAX</text>
<rect x="230" y="185" width="80" height="40" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="270.0" y="212.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">MIN</text>
<circle cx="80" cy="245" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="80" y="252" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="215" cy="315" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="215" y="322" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="325" cy="315" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="325" y="322" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="190" y="390" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">最大结果 3</text>
<line x1="570" y1="100" x2="460" y2="245" stroke="#68778b" stroke-width="3"/>
<line x1="570" y1="100" x2="650" y2="205" stroke="#68778b" stroke-width="3"/>
<line x1="650" y1="205" x2="595" y2="315" stroke="#68778b" stroke-width="3"/>
<line x1="650" y1="205" x2="705" y2="315" stroke="#68778b" stroke-width="3"/>
<rect x="530" y="80" width="80" height="40" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="570.0" y="107.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">MAX</text>
<rect x="610" y="185" width="80" height="40" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="650.0" y="212.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">MIN</text>
<circle cx="460" cy="245" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="460" y="252" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="595" cy="315" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="595" y="322" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="705" cy="315" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="705" y="322" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="570" y="390" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">最小结果 2</text>
</g></svg>
