<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">同批重量相加、时间取最大，前后两批时间相加</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同批重量相加、时间取最大，前后两批时间相加</text>
<rect x="40" y="85" width="430" height="190" rx="7" fill="#f7fbff" stroke="#2365ab" stroke-width="2"/>
<text x="255.0" y="187.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal"></text>
<rect x="510" y="85" width="210" height="190" rx="7" fill="#f5fff9" stroke="#12805c" stroke-width="2"/>
<text x="615.0" y="187.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal"></text>
<rect x="70" y="115" width="165" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="152.5" y="152.0" fill="#2365ab" font-size="18" text-anchor="middle" font-weight="normal">1：重60、时24</text>
<rect x="265" y="115" width="165" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="347.5" y="152.0" fill="#2365ab" font-size="18" text-anchor="middle" font-weight="normal">2：重40、时10</text>
<rect x="530" y="115" width="170" height="60" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="615.0" y="152.0" fill="#12805c" font-size="18" text-anchor="middle" font-weight="normal">3：重50、时18</text>
<text x="255" y="230" fill="#2365ab" font-size="23" text-anchor="middle" font-weight="normal">总重 100，耗时 24</text>
<text x="615" y="230" fill="#12805c" font-size="23" text-anchor="middle" font-weight="normal">耗时 18</text>
<text x="55" y="335" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">桥限重 100：先送 {1,2}，再送 {3}，总时 24+18=42</text>
</g></svg>
