<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title"><title id="title">当前坐标 5：左边距离 4+2，右边距离 1</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">当前坐标 5：左边距离 4+2，右边距离 1</text>
<line x1="90" y1="140" x2="675" y2="140" stroke="#68778b" stroke-width="3"/>
<circle cx="110" cy="140" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="110" y="147" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="110" y="195" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">此前</text>
<circle cx="300" cy="140" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="300" y="147" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="300" y="195" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">此前</text>
<circle cx="490" cy="140" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="490" y="147" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="490" y="195" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">当前</text>
<circle cx="585" cy="140" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="585" y="147" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<text x="585" y="195" fill="#243449" font-size="18" text-anchor="middle" font-weight="normal">此前</text>
<text x="60" y="245" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">左组：2×5−(1+3)=6；右组：6−5=1</text>
<text x="60" y="280" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">距离共 7；当前听力 4，贡献 28</text>
</g></svg>
