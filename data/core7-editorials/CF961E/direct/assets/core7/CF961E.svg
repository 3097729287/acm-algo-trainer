<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title"><title id="title">a 为 4、1、4、4：固定 i=3 时只查第四位</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">a 为 4、1、4、4：固定 i=3 时只查第四位</text>
<rect x="130" y="100" width="132" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="196.0" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="265" y="100" width="132" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="331.0" y="131.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="400" y="100" width="132" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="466.0" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="535" y="100" width="132" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="601.0" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="45" y="235" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">a[j] ≥ 3 激活位置 1、3、4；j 范围仅 [4,4]</text>
<text x="45" y="305" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">i=3 贡献 (3,4)；全部合法为 (1,3)、(1,4)、(3,4)</text>
<text x="45" y="365" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">位置二即使被包含在别人的范围，也未满足双方要求</text>
</g></svg>
