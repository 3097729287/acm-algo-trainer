<rect x="325" y="115" width="125" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="387.5" y="152.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">121</text>
<text x="387" y="230" fill="#2365ab" font-size="22" text-anchor="middle" font-weight="normal">第 3 天</text>
