<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title"><title id="title">跨中线的近点对，只需看两侧窄条</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">跨中线的近点对，只需看两侧窄条</text>
<rect x="180" y="80" width="160" height="250" rx="7" fill="#eef5ff" stroke="#2365ab" stroke-width="2"/>
<text x="260.0" y="212.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal"></text>
<rect x="340" y="80" width="160" height="250" rx="7" fill="#eff9f1" stroke="#12805c" stroke-width="2"/>
<text x="420.0" y="212.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal"></text>
<line x1="340" y1="65" x2="340" y2="340" stroke="#bc3645" stroke-width="3" stroke-dasharray="7 5"/>
<circle cx="280" cy="260" r="17" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="280" y="267" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<circle cx="390" cy="275" r="17" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="390" y="282" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<circle cx="210" cy="100" r="17" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="210" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">C</text>
<circle cx="455" cy="95" r="17" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="455" y="102" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">D</text>
<circle cx="90" cy="210" r="17" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="90" y="217" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">E</text>
<circle cx="640" cy="160" r="17" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="640" y="167" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">F</text>
<line x1="280" y1="260" x2="390" y2="275" stroke="#bc3645" stroke-width="3"/>
<text x="340" y="365" fill="#243449" font-size="20" text-anchor="middle" font-weight="normal">中线左右各宽 δ，只检查纵距也小于 δ 的点</text>
<text x="45" y="397" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">两侧内部最短距均 ≥δ；小格装点的上界来自这个前提</text>
</g></svg>
