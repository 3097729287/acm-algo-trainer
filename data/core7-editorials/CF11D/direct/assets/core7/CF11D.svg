<svg xmlns="http://www.w3.org/2000/svg" width="760" height="485" viewBox="0 0 760 485" role="img" aria-labelledby="title"><title id="title">四点完全图：四个三角环、三个四边环，共七个</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">四点完全图：四个三角环、三个四边环，共七个</text>
<line x1="220" y1="120" x2="540" y2="120" stroke="#12805c" stroke-width="4"/>
<line x1="540" y1="120" x2="540" y2="340" stroke="#12805c" stroke-width="4"/>
<line x1="540" y1="340" x2="220" y2="340" stroke="#12805c" stroke-width="4"/>
<line x1="220" y1="340" x2="220" y2="120" stroke="#12805c" stroke-width="4"/>
<line x1="220" y1="120" x2="540" y2="340" stroke="#68778b" stroke-width="4" stroke-dasharray="7 5"/>
<line x1="540" y1="120" x2="220" y2="340" stroke="#68778b" stroke-width="4" stroke-dasharray="7 5"/>
<circle cx="220" cy="120" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="220" y="127" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="540" cy="120" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="540" y="127" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="540" cy="340" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="540" y="347" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="220" cy="340" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="220" y="347" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="50" y="415" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">1→2→3→4 与 1→4→3→2 是同一个无向环</text>
<text x="50" y="465" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">固定最小起点后，仍须把正反方向的重复除以二</text>
</g></svg>
