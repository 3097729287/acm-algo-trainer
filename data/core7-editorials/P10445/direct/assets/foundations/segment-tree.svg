<circle cx="210" cy="185" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="210" y="192" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="550" cy="185" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="550" y="192" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="125" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="125" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="295" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="295" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="465" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="465" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="635" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="635" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="380" y="335" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">[2,3,1,4]：根的 10 = 左半 5 + 右半 5</text>
