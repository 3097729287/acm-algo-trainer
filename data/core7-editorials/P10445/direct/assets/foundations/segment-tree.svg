<line x1="550" y1="185" x2="465" y2="280" stroke="#68778b" stroke-width="3"/>
<line x1="550" y1="185" x2="635" y2="280" stroke="#68778b" stroke-width="3"/>
<circle cx="380" cy="95" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
