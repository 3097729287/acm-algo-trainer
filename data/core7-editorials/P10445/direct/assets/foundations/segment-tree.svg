<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">线段树：节点代表区间，父亲合并孩子</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">线段树：节点代表区间，父亲合并孩子</text>
<line x1="380" y1="95" x2="210" y2="185" stroke="#68778b" stroke-width="3"/>
<line x1="380" y1="95" x2="550" y2="185" stroke="#68778b" stroke-width="3"/>
<line x1="210" y1="185" x2="125" y2="280" stroke="#68778b" stroke-width="3"/>
