<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">两段都含原点：比较选中编号集合的最小差异</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两段都含原点：比较选中编号集合的最小差异</text>
<circle cx="100" cy="120" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="100" y="127" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="100" y="175" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">-10</text>
<circle cx="240" cy="120" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="240" y="127" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="240" y="175" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">-5</text>
<circle cx="380" cy="120" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="127" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="380" y="175" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<circle cx="520" cy="120" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="520" y="127" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="520" y="175" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="660" cy="120" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="660" y="127" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="660" y="175" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">10</text>
<text x="60" y="75" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">圆内为编号，下方为真实坐标；编号三有礼物</text>
<line x1="100" y1="220" x2="380" y2="220" stroke="#2365ab" stroke-width="7"/>
<text x="475" y="227" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">{1,2,3}</text>
<line x1="240" y1="280" x2="520" y2="280" stroke="#12805c" stroke-width="7"/>
<text x="565" y="287" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">{1,3,4}</text>
<text x="65" y="345" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">对称差为 {2,4}，最小编号二属于蓝色方案</text>
<text x="65" y="385" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">蓝色路线按坐标输出 2 1 3；集合比较与访问次序不同</text>
</g></svg>
