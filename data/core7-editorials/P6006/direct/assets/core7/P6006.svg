<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">四个零有四种下标三元组，两端固定后中间有两选</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">四个零有四种下标三元组，两端固定后中间有两选</text>
<rect x="95" y="95" width="137" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="163.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="235" y="95" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="303.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="375" y="95" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="443.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="515" y="95" width="137" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="583.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<text x="165" y="220" fill="#68778b" font-size="22" text-anchor="middle" font-weight="normal">下标 1</text>
<text x="305" y="220" fill="#68778b" font-size="22" text-anchor="middle" font-weight="normal">下标 2</text>
<text x="445" y="220" fill="#68778b" font-size="22" text-anchor="middle" font-weight="normal">下标 3</text>
<text x="585" y="220" fill="#68778b" font-size="22" text-anchor="middle" font-weight="normal">下标 4</text>
<text x="65" y="290" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">固定两端 1、4：中间可选 2 或 3，新增 2 组</text>
<text x="65" y="355" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">整段计数 = 左三格 1 + 右三格 1 − 交集 0 + 两端 2 = 4</text>
</g></svg>
