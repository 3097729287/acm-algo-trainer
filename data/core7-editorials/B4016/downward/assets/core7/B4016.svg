<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425" role="img" aria-labelledby="title"><title id="title">直径取不同孩子的两条链，长度按边数算</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">直径取不同孩子的两条链，长度按边数算</text>
<line x1="150" y1="150" x2="330" y2="150" stroke="#68778b" stroke-width="4"/>
<line x1="330" y1="150" x2="330" y2="280" stroke="#12805c" stroke-width="4"/>
<line x1="330" y1="150" x2="510" y2="150" stroke="#12805c" stroke-width="4"/>
<line x1="510" y1="150" x2="650" y2="280" stroke="#12805c" stroke-width="4"/>
<circle cx="150" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="150" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="330" cy="150" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="330" y="157" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="330" cy="280" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="330" y="287" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="510" cy="150" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="510" y="157" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="650" cy="280" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="650" y="287" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="70" y="350" fill="#12805c" font-size="25" text-anchor="start" font-weight="normal">路径 3→2→4→5：共有 3 条边</text>
<text x="70" y="405" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">以 2 为根，两条下行链分别长 1、2，合成 3</text>
</g></svg>
