<text x="470" y="120" fill="#2365ab" font-size="24" text-anchor="start" font-weight="normal">整体 3 人</text>
<text x="65" y="320" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">可选人数为 0、3、5、8；3 与 5 距目标同为 1</text>
<text x="65" y="365" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">平局取较少人数：答案 3</text>
