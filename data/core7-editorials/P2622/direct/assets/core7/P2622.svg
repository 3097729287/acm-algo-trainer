<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title"><title id="title">按第二个按钮，再按第一个，三盏灯全部关闭</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">按第二个按钮，再按第一个，三盏灯全部关闭</text>
<text x="35" y="115" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">初始</text>
<rect x="250" y="85" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="313.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="380" y="85" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="443.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="510" y="85" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="573.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="35" y="255" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">按钮 2 后</text>
<rect x="250" y="225" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="313.5" y="256.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="380" y="225" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="443.5" y="256.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="510" y="225" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="573.5" y="256.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="35" y="395" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">按钮 1 后</text>
<rect x="250" y="365" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="313.5" y="396.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="380" y="365" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="443.5" y="396.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="510" y="365" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="573.5" y="396.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<text x="175" y="185" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">按钮 2：强制开灯 1、关灯 2</text>
<text x="175" y="325" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">按钮 1：强制关灯 1、3</text>
</g></svg>
