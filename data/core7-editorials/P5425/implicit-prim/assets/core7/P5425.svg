<svg xmlns="http://www.w3.org/2000/svg" width="760" height="435" viewBox="0 0 760 435" role="img" aria-labelledby="title"><title id="title">N为四、K为三：只画必选的星形最小树</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">N为四、K为三：只画必选的星形最小树</text>
<line x1="100" y1="100" x2="380" y2="220" stroke="#bc3645" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="174.0" y="138.0" width="132" height="28" rx="3" fill="#fff"/>
<text x="240.0" y="160.0" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">2019201721</text>
<line x1="660" y1="100" x2="380" y2="220" stroke="#bc3645" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="454.0" y="138.0" width="132" height="28" rx="3" fill="#fff"/>
<text x="520.0" y="160.0" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">2019201637</text>
<line x1="380" y1="330" x2="380" y2="220" stroke="#12805c" stroke-width="4"/>
<rect x="314.0" y="253.0" width="132" height="28" rx="3" fill="#fff"/>
<text x="380.0" y="275.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">2019201553</text>
<circle cx="100" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="100" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="660" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="660" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="380" cy="330" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="337" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="380" cy="220" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="227" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="60" y="390" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">删去两条最大边，得到 {1}、{2}、{3,4}</text>
<text x="60" y="425" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">最小被删边 2019201637，就是最优组间距</text>
</g></svg>
