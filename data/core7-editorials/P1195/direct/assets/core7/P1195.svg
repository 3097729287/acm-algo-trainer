<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title"><title id="title">五朵云组成两组，只接受五减二等于三条边</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">五朵云组成两组，只接受五减二等于三条边</text>
<line x1="75" y1="170" x2="220" y2="170" stroke="#12805c" stroke-width="4"/>
<rect x="135.5" y="138.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="147.5" y="160.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">1</text>
<line x1="220" y1="170" x2="365" y2="170" stroke="#12805c" stroke-width="4"/>
<rect x="280.5" y="138.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="292.5" y="160.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">2</text>
<line x1="535" y1="170" x2="680" y2="170" stroke="#12805c" stroke-width="4"/>
<rect x="595.5" y="138.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="607.5" y="160.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">3</text>
<line x1="365" y1="170" x2="535" y2="170" stroke="#68778b" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="432.0" y="138.0" width="36" height="28" rx="3" fill="#fff"/>
<text x="450.0" y="160.0" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">20</text>
<circle cx="75" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="75" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="220" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="220" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="365" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="365" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="535" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="535" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="680" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="680" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="65" y="255" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">第一组：1、2、3</text>
<text x="490" y="255" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">第二组：4、5</text>
<text x="55" y="305" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">已付 1+2+3=6；再接分值 20 的边会只剩一组</text>
</g></svg>
