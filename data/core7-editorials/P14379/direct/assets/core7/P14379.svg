<svg xmlns="http://www.w3.org/2000/svg" width="760" height="485" viewBox="0 0 760 485" role="img" aria-labelledby="title"><title id="title">两类不贡献区间互斥：没有一，或双一端点而没有二</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两类不贡献区间互斥：没有一，或双一端点而没有二</text>
<rect x="65" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="126.0" y="126.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="190" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="251.0" y="126.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="315" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="376.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="440" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="501.0" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="565" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="626.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<line x1="65" y1="195" x2="310" y2="195" stroke="#bc3645" stroke-width="7"/>
<text x="65" y="240" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">无一空隙 [1,2]：2 选 2 = 1</text>
<line x1="315" y1="300" x2="685" y2="300" stroke="#12805c" stroke-width="7"/>
<text x="180" y="345" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">双一端点 [3,5]，无二：2 选 2 = 1</text>
<text x="45" y="420" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">全部长至少二区间 5 选 2 = 10，答案 10−1−1 = 8</text>
<text x="45" y="465" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">第四位改成2，第二类消失，答案变为9</text>
</g></svg>
