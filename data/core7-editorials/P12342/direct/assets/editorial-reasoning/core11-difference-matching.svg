<svg xmlns="http://www.w3.org/2000/svg" width="660" height="542" viewBox="0 0 660 542" role="img"><title>排序后的A十二十四二十二三十一，原B三十九二十七被三条匹配保留，四十四改零填十四空位</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="34" font-size="21" fill="#20334a" text-anchor="start">官方数组排序后：保留三项，第四项只修改一次</text><rect x="70" y="91" width="84" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="112" y="123" font-size="22" fill="#20334a" text-anchor="middle">A=12</text><rect x="70" y="245" width="84" height="46" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="112" y="277" font-size="22" fill="#20334a" text-anchor="middle">B=3</text><rect x="212" y="91" width="84" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="254" y="123" font-size="22" fill="#20334a" text-anchor="middle">A=14</text><rect x="212" y="245" width="84" height="46" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="254" y="277" font-size="22" fill="#20334a" text-anchor="middle">B=19</text><rect x="354" y="91" width="84" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="396" y="123" font-size="22" fill="#20334a" text-anchor="middle">A=22</text><rect x="354" y="245" width="84" height="46" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="396" y="277" font-size="22" fill="#20334a" text-anchor="middle">B=27</text><rect x="496" y="91" width="84" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="538" y="123" font-size="22" fill="#20334a" text-anchor="middle">A=31</text><rect x="496" y="245" width="84" height="46" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="538" y="277" font-size="22" fill="#20334a" text-anchor="middle">B=44</text><path d="M112 245 L112 138" stroke="#087b48" stroke-width="3"/><path d="M254 245 L396 138" stroke="#087b48" stroke-width="3"/><path d="M396 245 L538 138" stroke="#087b48" stroke-width="3"/><text x="246" y="179" font-size="18" fill="#20334a" text-anchor="middle">14无法接19，</text><text x="246" y="205" font-size="18" fill="#20334a" text-anchor="middle">先留空</text><text x="24" y="335" font-size="21" fill="#20334a" text-anchor="start">扫描12 / 14 / 22 / 31，used依次1 / 1 / 2 / 3。</text><text x="24" y="379" font-size="21" fill="#20334a" text-anchor="start">原44改成0，再放入A=14的空位；没有修改其它B。</text><text x="24" y="425" font-size="21" fill="#20334a" text-anchor="start">回到A原顺序：22、31、12、14</text><text x="24" y="467" font-size="21" fill="#20334a" text-anchor="start">重排后的B： 19、27、3、0</text><text x="24" y="509" font-size="21" fill="#20334a" text-anchor="start">真实差值：    3、 4、9、14，四项均严格为正。</text></g></svg>