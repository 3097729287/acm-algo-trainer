<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">两数相邻得分有方向，零的零次方另作规定</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两数相邻得分有方向，零的零次方另作规定</text>
<rect x="180" y="90" width="187" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="273.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="370" y="90" width="187" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="463.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="65" y="235" fill="#243449" font-size="24" text-anchor="start" font-weight="normal">先取左端：2 的 3 次方 = 8</text>
<text x="65" y="295" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">先取右端：3 的 2 次方 = 9，更优</text>
<text x="65" y="340" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">第一项本身没有得分；0 的 0 次方按题意为 0</text>
</g></svg>
