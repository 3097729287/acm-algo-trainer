<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title"><title id="title">横向与纵向分层，只有中间站能付费换层</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">横向与纵向分层，只有中间站能付费换层</text>
<line x1="110" y1="130" x2="420" y2="130" stroke="#2365ab" stroke-width="4"/>
<line x1="420" y1="270" x2="665" y2="270" stroke="#2365ab" stroke-width="4"/>
<line x1="420" y1="130" x2="420" y2="270" stroke="#bc3645" stroke-width="4"/>
<circle cx="110" cy="130" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="110" y="137" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">S</text>
<circle cx="110" cy="270" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="110" y="277" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">S</text>
<circle cx="420" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="420" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">T</text>
<circle cx="420" cy="270" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="420" y="277" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">T</text>
<circle cx="665" cy="130" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="665" y="137" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">E</text>
<circle cx="665" cy="270" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="665" y="277" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">E</text>
<text x="35" y="115" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">横</text>
<text x="35" y="275" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">纵</text>
<text x="265" y="110" fill="#243449" font-size="20" text-anchor="middle" font-weight="normal">两站：4 分钟</text>
<text x="545" y="310" fill="#243449" font-size="20" text-anchor="middle" font-weight="normal">三站：6 分钟</text>
<text x="435" y="205" fill="#bc3645" font-size="20" text-anchor="start" font-weight="normal">换乘 1</text>
<text x="80" y="365" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">S=(1,1)，T=(1,3)，E=(4,3)，共 4+1+6=11</text>
</g></svg>
