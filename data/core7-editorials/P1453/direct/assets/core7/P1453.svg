<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title"><title id="title">环边的两个端点不能同时选，断边后仍要保留约束</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">环边的两个端点不能同时选，断边后仍要保留约束</text>
<line x1="420" y1="120" x2="310" y2="280" stroke="#68778b" stroke-width="4"/>
<line x1="310" y1="280" x2="200" y2="120" stroke="#68778b" stroke-width="4"/>
<line x1="420" y1="120" x2="640" y2="250" stroke="#68778b" stroke-width="4"/>
<circle cx="200" cy="120" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="200" y="127" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<circle cx="420" cy="120" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="420" y="127" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="310" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="310" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="640" cy="250" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="640" y="257" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<line x1="225" y1="120" x2="395" y2="120" stroke="#bc3645" stroke-width="4" stroke-dasharray="7 5"/>
<text x="165" y="85" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">人流 1</text>
<text x="455" y="85" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">人流 2</text>
<text x="310" y="335" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">人流 1</text>
<text x="640" y="315" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">人流 5</text>
<text x="60" y="400" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">删红边后，分别禁选 0 或 1；可选 {0,3} 得 6</text>
<text x="60" y="440" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">倍率为 2 时利润 12.0；不能同时选 0、1</text>
</g></svg>
