<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375" viewBox="0 0 760 375" role="img" aria-labelledby="title"><title id="title">括号把前三项先相加，恰好再用两个乘号</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">括号把前三项先相加，恰好再用两个乘号</text>
<rect x="65" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="126.0" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="190" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="251.0" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="315" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="376.0" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="440" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="501.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="565" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="626.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<line x1="80" y1="195" x2="425" y2="195" stroke="#2365ab" stroke-width="4"/>
<text x="250" y="245" fill="#2365ab" font-size="24" text-anchor="middle" font-weight="normal">先加成 6</text>
<text x="65" y="325" fill="#12805c" font-size="28" text-anchor="start" font-weight="normal">(1+2+3) × 4 × 5 = 120</text>
<text x="65" y="365" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">所有相邻间隔都有运算，原数字顺序不变</text>
</g></svg>
