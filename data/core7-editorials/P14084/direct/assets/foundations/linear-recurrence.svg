<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title"><title id="title">用 X²=X+1 约简幂，再乘初值 s₀=0、s₁=1</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">用 X²=X+1 约简幂，再乘初值 s₀=0、s₁=1</text>
<rect x="60" y="90" width="130" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="125.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">X⁰</text>
<text x="290" y="122" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">1</text>
<line x1="390" y1="114" x2="495" y2="114" stroke="#12805c" stroke-width="3"/>
<rect x="525" y="90" width="150" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="600.0" y="121.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">s = 0</text>
<rect x="60" y="155" width="130" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="125.0" y="186.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">X¹</text>
<text x="290" y="187" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">X</text>
<line x1="390" y1="179" x2="495" y2="179" stroke="#12805c" stroke-width="3"/>
<rect x="525" y="155" width="150" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="600.0" y="186.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">s = 1</text>
<rect x="60" y="220" width="130" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="125.0" y="251.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">X²</text>
<text x="290" y="252" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">1+X</text>
<line x1="390" y1="244" x2="495" y2="244" stroke="#12805c" stroke-width="3"/>
<rect x="525" y="220" width="150" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="600.0" y="251.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">s = 1</text>
<rect x="60" y="285" width="130" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="125.0" y="316.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">X³</text>
<text x="290" y="317" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">1+2X</text>
<line x1="390" y1="309" x2="495" y2="309" stroke="#12805c" stroke-width="3"/>
<rect x="525" y="285" width="150" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="600.0" y="316.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">s = 2</text>
<rect x="60" y="350" width="130" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="125.0" y="381.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">X⁴</text>
<text x="290" y="382" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">2+3X</text>
<line x1="390" y1="374" x2="495" y2="374" stroke="#12805c" stroke-width="3"/>
<rect x="525" y="350" width="150" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="600.0" y="381.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">s = 3</text>
<text x="45" y="435" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">每次高次替换都对应同一条线性递推等式</text>
</g></svg>
