<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title"><title id="title">l=10，重复两段，上界1010，相邻一数之和至多二</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">l=10，重复两段，上界1010，相邻一数之和至多二</text>
<rect x="35" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="96.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">10</text>
<rect x="160" y="95" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="221.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">10</text>
<text x="315" y="128" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">1+1=2，且等于上界</text>
<rect x="35" y="205" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="96.0" y="236.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">00</text>
<rect x="160" y="205" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="221.0" y="236.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">11</text>
<text x="315" y="238" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">0+2=2，且小于上界</text>
<rect x="35" y="315" width="122" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="96.0" y="346.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">01</text>
<rect x="160" y="315" width="122" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="221.0" y="346.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">11</text>
<text x="315" y="348" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">1+2=3，超过相邻限制</text>
<rect x="35" y="425" width="122" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="96.0" y="456.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">11</text>
<rect x="160" y="425" width="122" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="221.0" y="456.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">00</text>
<text x="315" y="458" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">2+0=2，但超过上界</text>
</g></svg>
