<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375" viewBox="0 0 760 375" role="img" aria-labelledby="title"><title id="title">一次往返每条边两遍，谈话费用也可分配到边</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">一次往返每条边两遍，谈话费用也可分配到边</text>
<line x1="85" y1="150" x2="230" y2="150" stroke="#68778b" stroke-width="4"/>
<text x="157.5" y="115" fill="#243449" font-size="20" text-anchor="middle" font-weight="normal">L=1</text>
<line x1="230" y1="150" x2="375" y2="150" stroke="#68778b" stroke-width="4"/>
<text x="302.5" y="115" fill="#243449" font-size="20" text-anchor="middle" font-weight="normal">L=2</text>
<line x1="375" y1="150" x2="520" y2="150" stroke="#68778b" stroke-width="4"/>
<text x="447.5" y="115" fill="#243449" font-size="20" text-anchor="middle" font-weight="normal">L=1</text>
<line x1="520" y1="150" x2="665" y2="150" stroke="#68778b" stroke-width="4"/>
<text x="592.5" y="115" fill="#243449" font-size="20" text-anchor="middle" font-weight="normal">L=0</text>
<circle cx="85" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="85" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="85" y="215" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">C=2</text>
<circle cx="230" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="230" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="230" y="215" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">C=5</text>
<circle cx="375" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="375" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="375" y="215" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">C=3</text>
<circle cx="520" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="520" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="520" y="215" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">C=4</text>
<circle cx="665" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="665" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="665" y="215" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">C=1</text>
<text x="45" y="285" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">新边权依次为 9、12、9、5，总和三十五</text>
<text x="45" y="340" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">起点选五号，另加一次谈话费用一，总费用三十六</text>
</g></svg>
