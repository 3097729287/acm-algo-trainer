<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title"><title id="title">父子端点交错，兄弟区间包含而不交错</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">父子端点交错，兄弟区间包含而不交错</text>
<text x="100" y="85" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="180" y="85" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="260" y="85" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="340" y="85" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="420" y="85" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="500" y="85" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<text x="30" y="147" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">点1</text>
<line x1="100" y1="140" x2="340" y2="140" stroke="#2365ab" stroke-width="5"/>
<circle cx="100" cy="140" r="8" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<circle cx="340" cy="140" r="8" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="30" y="227" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">点2</text>
<line x1="180" y1="220" x2="500" y2="220" stroke="#12805c" stroke-width="5"/>
<circle cx="180" cy="220" r="8" fill="#fff" stroke="#12805c" stroke-width="3"/>
<circle cx="500" cy="220" r="8" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="30" y="307" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">点3</text>
<line x1="260" y1="300" x2="420" y2="300" stroke="#bc3645" stroke-width="5"/>
<circle cx="260" cy="300" r="8" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<circle cx="420" cy="300" r="8" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="550" y="145" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">1—2 严格交错</text>
<text x="550" y="220" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">1—3 严格交错</text>
<text x="550" y="295" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">2 包含 3，无边</text>
<text x="55" y="375" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">左端点 1、2、3 先分配；右端点依次为 4、5、6</text>
</g></svg>
