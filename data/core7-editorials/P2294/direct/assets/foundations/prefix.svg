<svg xmlns="http://www.w3.org/2000/svg" width="760" height="315" viewBox="0 0 760 315" role="img" aria-labelledby="title"><title id="title">区间和：整段减掉多算的前缀</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">区间和：整段减掉多算的前缀</text>
<rect x="200" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="258.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="320" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="378.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="440" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="498.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="560" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="618.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="45" y="128" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">a</text>
<line x1="200" y1="165" x2="677" y2="165" stroke="#2365ab" stroke-width="7"/>
<text x="400" y="200" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">S₄ = 10</text>
<line x1="200" y1="225" x2="317" y2="225" stroke="#bc3645" stroke-width="7"/>
<text x="200" y="265" fill="#bc3645" font-size="21" text-anchor="start" font-weight="normal">减去 S₁ = 2</text>
<line x1="320" y1="225" x2="677" y2="225" stroke="#12805c" stroke-width="7"/>
<text x="510" y="265" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">留下 3 + 1 + 4 = 8</text>
</g></svg>
