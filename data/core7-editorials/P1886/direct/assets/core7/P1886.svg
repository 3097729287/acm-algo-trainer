<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">长度三的完整窗口：当前右端也参与极值</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">长度三的完整窗口：当前右端也参与极值</text>
<rect x="30" y="90" width="85" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="72.5" y="121.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="118" y="90" width="85" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="160.5" y="121.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="206" y="90" width="85" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="248.5" y="121.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">-1</text>
<rect x="294" y="90" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="336.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">-3</text>
<rect x="382" y="90" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="424.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="470" y="90" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="512.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="558" y="90" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="600.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="646" y="90" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="688.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">7</text>
<text x="45" y="220" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">首窗 [1,3,−1]：最小 −1，最大 3</text>
<text x="45" y="285" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">次窗 [3,−1,−3]：最小 −3，最大 3</text>
<text x="45" y="360" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">全部最小：−1、−3、−3、−3、3、3</text>
<text x="45" y="425" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">全部最大：3、3、5、5、6、7</text>
</g></svg>
