<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title"><title id="title">非负数组窗口：加右项，超限才移左项</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">非负数组窗口：加右项，超限才移左项</text>
<rect x="200" y="90" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="258.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="320" y="90" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="378.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="440" y="90" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="498.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="560" y="90" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="618.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="200" y="185" fill="#2365ab" font-size="21" text-anchor="start" font-weight="normal">原窗口 [1,3]：和 4</text>
<text x="200" y="225" fill="#bc3645" font-size="21" text-anchor="start" font-weight="normal">加右侧 2：和 6；移走左侧 1</text>
<text x="200" y="265" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">新窗口 [3,2]：和 5</text>
</g></svg>
