<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title"><title id="title">坐标五至八包含三色，彩带长度是三</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">坐标五至八包含三色，彩带长度是三</text>
<rect x="430" y="80" width="210" height="265" rx="8" fill="#12805c" fill-opacity="0.10"/>
<text x="30" y="147" fill="#bc3645" font-size="20" text-anchor="start" font-weight="normal">颜色1</text>
<circle cx="430" cy="140" r="24" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="430" y="147" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="30" y="232" fill="#2365ab" font-size="20" text-anchor="start" font-weight="normal">颜色2</text>
<circle cx="150" cy="225" r="24" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="150" y="232" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="570" cy="225" r="24" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="570" y="232" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">7</text>
<text x="30" y="317" fill="#12805c" font-size="20" text-anchor="start" font-weight="normal">颜色3</text>
<circle cx="150" cy="310" r="24" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="150" y="317" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="290" cy="310" r="24" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="290" y="317" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="640" cy="310" r="24" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="640" y="317" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<line x1="80" y1="370" x2="710" y2="370" stroke="#68778b" stroke-width="3"/>
<text x="80" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">0</text>
<text x="150" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">1</text>
<text x="220" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">2</text>
<text x="290" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">3</text>
<text x="360" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">4</text>
<text x="430" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">5</text>
<text x="500" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">6</text>
<text x="570" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">7</text>
<text x="640" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">8</text>
<text x="710" y="400" fill="#68778b" font-size="19" text-anchor="middle" font-weight="normal">9</text>
<text x="45" y="445" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">原样例：选到位置 5、7、8；8−5=3，不加一</text>
</g></svg>
