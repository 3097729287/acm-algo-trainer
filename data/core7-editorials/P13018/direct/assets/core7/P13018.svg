<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">负差与正差抵消，酸甜总和作为收益保留</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">负差与正差抵消，酸甜总和作为收益保留</text>
<rect x="95" y="110" width="277" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="233.5" y="141.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">酸 1 甜 2</text>
<rect x="375" y="110" width="277" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="513.5" y="141.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">酸 2 甜 1</text>
<text x="235" y="250" fill="#2365ab" font-size="23" text-anchor="middle" font-weight="normal">差 −1，收益 3</text>
<text x="515" y="250" fill="#12805c" font-size="23" text-anchor="middle" font-weight="normal">差 +1，收益 3</text>
<text x="65" y="325" fill="#243449" font-size="24" text-anchor="start" font-weight="normal">一起选：酸 3、甜 3，差为零，总风味 6</text>
<text x="65" y="375" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">差值可以为负，不能把负下标状态丢掉</text>
</g></svg>
