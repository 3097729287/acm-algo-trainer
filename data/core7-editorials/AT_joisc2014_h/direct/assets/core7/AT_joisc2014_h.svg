<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title"><title id="title">JOI：两种计数差回到原状态，整段三种数量相同</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">JOI：两种计数差回到原状态，整段三种数量相同</text>
<rect x="220" y="90" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="276.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">J</text>
<rect x="335" y="90" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="391.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">O</text>
<rect x="450" y="90" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="506.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">I</text>
<text x="210" y="190" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">(0,0)</text>
<text x="325" y="190" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">(1,1)</text>
<text x="440" y="190" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">(0,1)</text>
<text x="555" y="190" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">(0,0)</text>
<line x1="210" y1="230" x2="555" y2="230" stroke="#12805c" stroke-width="5"/>
<text x="380" y="285" fill="#12805c" font-size="23" text-anchor="middle" font-weight="normal">两端前缀的 (J−O,J−I) 相同</text>
<text x="60" y="328" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">状态写在字符边界；区间从左边界之后到右边界为止</text>
</g></svg>
