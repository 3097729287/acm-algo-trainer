<svg xmlns="http://www.w3.org/2000/svg" width="760" height="315" viewBox="0 0 760 315" role="img" aria-labelledby="title"><title id="title">每条光纤只铺一次，不能把到根的距离全相加</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">每条光纤只铺一次，不能把到根的距离全相加</text>
<line x1="80" y1="145" x2="275" y2="145" stroke="#12805c" stroke-width="4"/>
<rect x="165.5" y="113.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="177.5" y="135.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">2</text>
<line x1="275" y1="145" x2="470" y2="145" stroke="#12805c" stroke-width="4"/>
<rect x="360.5" y="113.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="372.5" y="135.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">3</text>
<line x1="470" y1="145" x2="665" y2="145" stroke="#12805c" stroke-width="4"/>
<rect x="555.5" y="113.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="567.5" y="135.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">4</text>
<circle cx="80" cy="145" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="80" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="275" cy="145" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="275" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="470" cy="145" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="470" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="665" cy="145" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="665" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="55" y="225" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">这棵网络只需 2+3+4=9</text>
<text x="55" y="280" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">从一号到各点的距离 2、5、9 不是建设费用</text>
</g></svg>
