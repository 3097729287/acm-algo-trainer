<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title"><title id="title">同一路线的两个比例都得满足，所以取较小者</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同一路线的两个比例都得满足，所以取较小者</text>
<line x1="380" y1="85" x2="220" y2="195" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="85" x2="540" y2="195" stroke="#68778b" stroke-width="4"/>
<line x1="220" y1="195" x2="130" y2="320" stroke="#68778b" stroke-width="4"/>
<line x1="220" y1="195" x2="310" y2="320" stroke="#68778b" stroke-width="4"/>
<line x1="540" y1="195" x2="540" y2="320" stroke="#68778b" stroke-width="4"/>
<circle cx="380" cy="85" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="92" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">u</text>
<circle cx="220" cy="195" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="220" y="202" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">v</text>
<circle cx="540" cy="195" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="540" y="202" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<circle cx="130" cy="320" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="130" y="327" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="310" cy="320" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="310" y="327" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="540" cy="320" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="540" y="327" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">7</text>
<text x="55" y="385" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">v 子树有 3 人；u 共 5 名下属，向上传播比例 3/5</text>
<text x="55" y="430" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">v 内两个叶子只能提供 1/2，整条路线受 1/2 限制</text>
<text x="55" y="465" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">初始一名叛徒不会直接命令它的下属全部加入</text>
</g></svg>
