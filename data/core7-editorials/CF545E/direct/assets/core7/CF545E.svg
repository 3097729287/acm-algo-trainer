<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">最短路相同，再为最后一条边少付一单位</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">最短路相同，再为最后一条边少付一单位</text>
<line x1="105" y1="275" x2="380" y2="95" stroke="#12805c" stroke-width="4"/>
<rect x="230.5" y="153.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="242.5" y="175.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">1</text>
<line x1="380" y1="95" x2="655" y2="275" stroke="#12805c" stroke-width="4"/>
<rect x="505.5" y="153.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="517.5" y="175.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">1</text>
<line x1="105" y1="275" x2="655" y2="275" stroke="#68778b" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="368.0" y="288.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="380.0" y="310.0" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">2</text>
<circle cx="105" cy="275" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="105" y="282" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="380" cy="95" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="102" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="655" cy="275" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="655" y="282" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="60" y="345" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">源点 3：d[3]=0，d[2]=1，d[1]=2</text>
<text x="60" y="390" fill="#12805c" font-size="20" text-anchor="start" font-weight="normal">一号经二号或直达都最短，但父边选权 1 更便宜</text>
</g></svg>
