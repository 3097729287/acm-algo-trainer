<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">12 × 13：按数位相乘，同一次幂的贡献相加</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">12 × 13：按数位相乘，同一次幂的贡献相加</text>
<text x="105" y="115" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">位乘</text>
<text x="310" y="115" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">来自个位 2</text>
<text x="545" y="115" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">来自十位 1</text>
<text x="90" y="185" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">个位 3</text>
<rect x="295" y="145" width="180" height="62" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="385.0" y="183.0" fill="#12805c" font-size="22" text-anchor="middle" font-weight="normal">6 → 个位</text>
<rect x="535" y="145" width="190" height="62" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="630.0" y="183.0" fill="#2365ab" font-size="22" text-anchor="middle" font-weight="normal">3 → 十位</text>
<text x="90" y="270" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">十位 1</text>
<rect x="295" y="230" width="180" height="62" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="385.0" y="268.0" fill="#2365ab" font-size="22" text-anchor="middle" font-weight="normal">2 → 十位</text>
<rect x="535" y="230" width="190" height="62" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="630.0" y="268.0" fill="#bc3645" font-size="22" text-anchor="middle" font-weight="normal">1 → 百位</text>
<text x="75" y="340" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">十位合计 3+2=5，所以乘积为 156</text>
</g></svg>
