<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title"><title id="title">取消不是并集：新预约仍然只是九至二十一</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">取消不是并集：新预约仍然只是九至二十一</text>
<line x1="108" y1="120" x2="270" y2="120" stroke="#2365ab" stroke-width="11"/>
<text x="108" y="98" fill="#2365ab" font-size="22" text-anchor="start" font-weight="normal">旧 [1,10]</text>
<line x1="450" y1="195" x2="630" y2="195" stroke="#2365ab" stroke-width="11"/>
<text x="450" y="173" fill="#2365ab" font-size="22" text-anchor="start" font-weight="normal">旧 [20,30]</text>
<line x1="252" y1="300" x2="468" y2="300" stroke="#12805c" stroke-width="11"/>
<text x="252" y="278" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">新 [9,21]</text>
<circle cx="612" cy="390" r="24" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="612" y="397" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">29</text>
<text x="45" y="440" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">加入 [9,21] 取消两段；以后 [29,29] 不与它相交</text>
</g></svg>
