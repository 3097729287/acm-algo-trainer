<svg xmlns="http://www.w3.org/2000/svg" width="760" height="315" viewBox="0 0 760 315" role="img" aria-labelledby="title"><title id="title">267 度电：按实际落入的区间分别收费</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">267 度电：按实际落入的区间分别收费</text>
<text x="90" y="95" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<text x="270" y="95" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">150</text>
<text x="410" y="95" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">267</text>
<text x="570" y="95" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">400</text>
<line x1="90" y1="125" x2="270" y2="125" stroke="#2365ab" stroke-width="12"/>
<line x1="270" y1="125" x2="410" y2="125" stroke="#12805c" stroke-width="12"/>
<line x1="410" y1="125" x2="570" y2="125" stroke="#68778b" stroke-width="3" stroke-dasharray="7 5"/>
<text x="150" y="180" fill="#2365ab" font-size="21" text-anchor="start" font-weight="normal">150 度</text>
<text x="310" y="180" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">117 度</text>
<text x="65" y="245" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">150 × 0.4463 + 117 × 0.4663</text>
<text x="65" y="290" fill="#68778b" font-size="21" text-anchor="start" font-weight="normal">400 度以后的区间本次用量为零</text>
</g></svg>
