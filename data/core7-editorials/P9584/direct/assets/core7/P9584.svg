<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">新增叶子只新增它与旧点的距离，查询彼此独立</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">新增叶子只新增它与旧点的距离，查询彼此独立</text>
<line x1="120" y1="170" x2="330" y2="170" stroke="#68778b" stroke-width="4"/>
<line x1="330" y1="170" x2="550" y2="170" stroke="#68778b" stroke-width="4"/>
<line x1="330" y1="170" x2="330" y2="300" stroke="#68778b" stroke-width="4"/>
<circle cx="120" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="120" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="330" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="330" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="550" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="550" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="330" cy="300" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="330" y="307" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">新</text>
<text x="225" y="150" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">2</text>
<text x="440" y="150" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">3</text>
<text x="355" y="245" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">4</text>
<text x="60" y="365" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">旧无序距离和 10；新叶距离为 6、4、7，总计 17</text>
<text x="60" y="405" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">有序总和 = 2×(10+17)=54；自身距离为零</text>
</g></svg>
