<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">字母表 a、b、c：听到 abac 至少唱两遍</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">字母表 a、b、c：听到 abac 至少唱两遍</text>
<rect x="65" y="110" width="102" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="116.0" y="141.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<rect x="170" y="110" width="102" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="221.0" y="141.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">b</text>
<rect x="275" y="110" width="102" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="326.0" y="141.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">c</text>
<rect x="380" y="110" width="102" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="431.0" y="141.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<rect x="485" y="110" width="102" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="536.0" y="141.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">b</text>
<rect x="590" y="110" width="102" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="641.0" y="141.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">c</text>
<line x1="378" y1="80" x2="378" y2="230" stroke="#bc3645" stroke-width="3" stroke-dasharray="7 5"/>
<text x="210" y="240" fill="#2365ab" font-size="23" text-anchor="middle" font-weight="normal">第一遍</text>
<text x="535" y="240" fill="#2365ab" font-size="23" text-anchor="middle" font-weight="normal">第二遍</text>
<text x="45" y="310" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">绿色为听到的字母；b 后再听到 a，必须开始下一遍</text>
<text x="45" y="365" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">同一个字母在每遍只有一次，连续相同也要重新开始</text>
</g></svg>
