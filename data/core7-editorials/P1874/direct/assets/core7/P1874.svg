<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" role="img" aria-labelledby="title"><title id="title">前导零可保留：303 拆成 3 与 03 只要一个加号</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">前导零可保留：303 拆成 3 与 03 只要一个加号</text>
<rect x="170" y="100" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="233.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="300" y="100" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="363.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="430" y="100" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="493.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<line x1="300" y1="82" x2="300" y2="164" stroke="#bc3645" stroke-width="4"/>
<text x="300" y="210" fill="#bc3645" font-size="22" text-anchor="middle" font-weight="normal">只在这个间隙插入 +</text>
<text x="100" y="275" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">3+03=6：1 个加号</text>
<text x="415" y="275" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">3+0+3=6：2 个</text>
<text x="65" y="325" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">状态先记数字段数，最后减一才是加号数</text>
</g></svg>
