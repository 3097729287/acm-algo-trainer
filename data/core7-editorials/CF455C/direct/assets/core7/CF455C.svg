<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">长度四与长度二的链，连接中心后直径仍为四</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">长度四与长度二的链，连接中心后直径仍为四</text>
<line x1="150" y1="130" x2="250" y2="130" stroke="#68778b" stroke-width="4"/>
<line x1="250" y1="130" x2="350" y2="130" stroke="#68778b" stroke-width="4"/>
<line x1="350" y1="130" x2="450" y2="130" stroke="#68778b" stroke-width="4"/>
<line x1="450" y1="130" x2="550" y2="130" stroke="#68778b" stroke-width="4"/>
<line x1="250" y1="270" x2="350" y2="270" stroke="#68778b" stroke-width="4"/>
<line x1="350" y1="270" x2="450" y2="270" stroke="#68778b" stroke-width="4"/>
<line x1="350" y1="130" x2="350" y2="270" stroke="#12805c" stroke-width="4"/>
<circle cx="150" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
