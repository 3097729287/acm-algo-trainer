<circle cx="250" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="250" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="350" cy="130" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="350" y="137" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="450" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="450" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="550" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="550" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="250" cy="270" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="250" y="277" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<circle cx="350" cy="270" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
