<text x="450" y="277" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<text x="430" y="205" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">新路：中心 3 至中心 7</text>
<text x="55" y="350" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">max(4,2,2+1+1)=4</text>
<text x="55" y="390" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">询问中的城市只指定两块，允许另选连接端点</text>
</g></svg>
