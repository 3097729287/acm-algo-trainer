<svg xmlns="http://www.w3.org/2000/svg" width="760" height="445" viewBox="0 0 760 445" role="img" aria-labelledby="title"><title id="title">服务器可以相邻，客户必须恰好只有一个相邻服务器</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">服务器可以相邻，客户必须恰好只有一个相邻服务器</text>
<line x1="120" y1="105" x2="300" y2="200" stroke="#68778b" stroke-width="4"/>
<line x1="120" y1="300" x2="300" y2="200" stroke="#68778b" stroke-width="4"/>
<line x1="300" y1="200" x2="460" y2="200" stroke="#12805c" stroke-width="4"/>
<line x1="460" y1="200" x2="640" y2="105" stroke="#68778b" stroke-width="4"/>
<line x1="460" y1="200" x2="640" y2="300" stroke="#68778b" stroke-width="4"/>
<circle cx="120" cy="105" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="120" y="112" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="120" cy="300" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="120" y="307" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="300" cy="200" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="300" y="207" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="460" cy="200" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="460" y="207" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="640" cy="105" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="640" y="112" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="640" cy="300" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="640" y="307" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<text x="55" y="375" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">选服务器 3、4：客户 1、2、5、6 各由一台服务</text>
<text x="55" y="425" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">服务器自己不是客户；不能额外禁止绿色两点相邻</text>
</g></svg>
