<svg xmlns="http://www.w3.org/2000/svg" width="760" height="335" viewBox="0 0 760 335" role="img" aria-labelledby="title"><title id="title">两端不同，给另一端补一个镜像字符</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两端不同，给另一端补一个镜像字符</text>
<rect x="210" y="90" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="288.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<rect x="370" y="90" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="448.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">b</text>
<rect x="130" y="205" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="208.5" y="236.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<rect x="290" y="205" width="157" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="368.5" y="236.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">b</text>
<rect x="450" y="205" width="157" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="528.5" y="236.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<text x="65" y="315" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">新补右端 a，得到 aba；也可在左边补 b 得到 bab</text>
</g></svg>
