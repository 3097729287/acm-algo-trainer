<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title"><title id="title">去掉一份最低、一份最高，不删除所有相同分数</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">去掉一份最低、一份最高，不删除所有相同分数</text>
<rect x="155" y="95" width="107" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="208.5" y="126.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="265" y="95" width="107" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="318.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="375" y="95" width="107" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="428.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="485" y="95" width="107" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="538.5" y="126.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">9</text>
<text x="185" y="195" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">删除</text>
<text x="350" y="195" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">保留两个五</text>
<text x="515" y="195" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">删除</text>
<text x="125" y="245" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">(1+5+5+9−1−9) / (4−2) = 5</text>
</g></svg>
