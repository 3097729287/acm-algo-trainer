<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">树上两端路径的最大边是四，不是路径和七</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">树上两端路径的最大边是四，不是路径和七</text>
<line x1="100" y1="255" x2="380" y2="90" stroke="#12805c" stroke-width="4"/>
<rect x="228.0" y="140.5" width="24" height="28" rx="3" fill="#fff"/>
<text x="240.0" y="162.5" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">4</text>
<line x1="380" y1="90" x2="660" y2="255" stroke="#12805c" stroke-width="4"/>
<rect x="508.0" y="140.5" width="24" height="28" rx="3" fill="#fff"/>
<text x="520.0" y="162.5" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">3</text>
<line x1="100" y1="255" x2="660" y2="255" stroke="#68778b" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="322.0" y="263.0" width="116" height="28" rx="3" fill="#fff"/>
<text x="380.0" y="285.0" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">原非树边 8</text>
<circle cx="100" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="100" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="660" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="660" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="380" cy="90" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="97" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="55" y="330" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">将 8 改到 4，可以换下原树的 4；再大则不行</text>
</g></svg>
