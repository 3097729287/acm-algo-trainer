<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">代表可以在队伍中间，距离仍由相对偏移相减</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">代表可以在队伍中间，距离仍由相对偏移相减</text>
<text x="65" y="111" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">位置</text>
<rect x="205" y="80" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="263.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="325" y="80" width="117" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="383.5" y="111.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="445" y="80" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="503.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="565" y="80" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="623.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="65" y="186" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">舰船</text>
<rect x="205" y="155" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="263.5" y="186.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="325" y="155" width="117" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="383.5" y="186.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="445" y="155" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="503.5" y="186.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="565" y="155" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="623.5" y="186.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="65" y="261" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">根差</text>
<rect x="205" y="230" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="263.5" y="261.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">-1</text>
<rect x="325" y="230" width="117" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="383.5" y="261.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="445" y="230" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="503.5" y="261.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="565" y="230" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="623.5" y="261.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="65" y="325" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">根是二号；四号与三号之间是二、一，共两艘</text>
<text x="65" y="360" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">相对偏移：|−1−2|−1=2，不要求根就是队首</text>
</g></svg>
