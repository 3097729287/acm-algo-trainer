<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title"><title id="title">四颗珠对应五个边界，接缝决定额外能量</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">四颗珠对应五个边界，接缝决定额外能量</text>
<line x1="100" y1="130" x2="240" y2="130" stroke="#12805c" stroke-width="4"/>
<line x1="240" y1="130" x2="380" y2="130" stroke="#12805c" stroke-width="4"/>
<line x1="380" y1="130" x2="520" y2="130" stroke="#12805c" stroke-width="4"/>
<line x1="520" y1="130" x2="660" y2="130" stroke="#12805c" stroke-width="4"/>
<circle cx="100" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="100" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">10</text>
<circle cx="240" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="240" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="380" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="520" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="520" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="660" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="660" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">10</text>
<text x="65" y="230" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">先合 10→2 与 2→3：10×2×3=60</text>
<text x="65" y="290" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">再接 3→5：150；最后接 5→10：500</text>
<text x="65" y="365" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">以第 4 颗珠为断口起点，总能量 60+150+500=710</text>
</g></svg>
