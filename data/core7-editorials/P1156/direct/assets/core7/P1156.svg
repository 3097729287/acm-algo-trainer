<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title"><title id="title">刚好第十时刻仍可用垃圾，垫高或吃掉二选一</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">刚好第十时刻仍可用垃圾，垫高或吃掉二选一</text>
<text x="55" y="95" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">初始死亡时刻 10；垃圾在时刻 10 落下</text>
<rect x="95" y="150" width="277" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="233.5" y="181.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">垫高 10</text>
<rect x="375" y="150" width="277" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="513.5" y="181.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">吃掉 +30</text>
<text x="235" y="280" fill="#12805c" font-size="22" text-anchor="middle" font-weight="normal">井深 10：立即出井</text>
<text x="515" y="325" fill="#2365ab" font-size="22" text-anchor="middle" font-weight="normal">死亡时刻改为 40</text>
<text x="65" y="390" fill="#bc3645" font-size="23" text-anchor="start" font-weight="normal">两条分支只选一条；不可同件先吃再垫</text>
</g></svg>
