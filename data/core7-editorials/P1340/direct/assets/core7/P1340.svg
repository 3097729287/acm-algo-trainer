<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">插入新边后，只需替换旧树环上的最重边</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">插入新边后，只需替换旧树环上的最重边</text>
<line x1="105" y1="255" x2="375" y2="90" stroke="#68778b" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="228.0" y="140.5" width="24" height="28" rx="3" fill="#fff"/>
<text x="240.0" y="162.5" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">8</text>
<line x1="375" y1="90" x2="655" y2="255" stroke="#12805c" stroke-width="4"/>
<rect x="503.0" y="140.5" width="24" height="28" rx="3" fill="#fff"/>
<text x="515.0" y="162.5" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">3</text>
<line x1="105" y1="255" x2="655" y2="255" stroke="#12805c" stroke-width="4"/>
<rect x="342.0" y="263.0" width="76" height="28" rx="3" fill="#fff"/>
<text x="380.0" y="285.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">新边 2</text>
<circle cx="105" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="105" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="655" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="655" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="375" cy="90" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="375" y="97" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="60" y="330" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">旧最优 8+3=11；新最优 2+3=5</text>
</g></svg>
