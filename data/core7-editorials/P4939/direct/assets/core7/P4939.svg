<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">只存修改事件：查询五包含前两个，查询六再撤一次</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">只存修改事件：查询五包含前两个，查询六再撤一次</text>
<text x="30" y="120" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">坐标</text>
<rect x="190" y="90" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="253.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="320" y="90" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="383.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="450" y="90" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="513.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="580" y="90" width="127" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="643.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">11</text>
<text x="30" y="245" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">事件</text>
<rect x="190" y="215" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="253.5" y="246.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">+1</text>
<rect x="320" y="215" width="127" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="383.5" y="246.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">+1</text>
<rect x="450" y="215" width="127" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="513.5" y="246.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">−1</text>
<rect x="580" y="215" width="127" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="643.5" y="246.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">−1</text>
<text x="45" y="345" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">更新 [2,5]、[5,10]：查询 5 得 2，查询 6 得 1</text>
<text x="45" y="395" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">坐标 11 保留为撤销事件，不是合法位置也无妨</text>
</g></svg>
