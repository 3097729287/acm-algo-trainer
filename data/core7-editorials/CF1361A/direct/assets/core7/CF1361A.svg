<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">主题一、二先出现，第三篇才能选到主题三</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">主题一、二先出现，第三篇才能选到主题三</text>
<line x1="385" y1="125" x2="145" y2="125" stroke="#68778b" stroke-width="3"/>
<line x1="145" y1="125" x2="625" y2="250" stroke="#68778b" stroke-width="3"/>
<line x1="625" y1="250" x2="385" y2="125" stroke="#68778b" stroke-width="3"/>
<circle cx="145" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="145" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="145" y="80" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">主题 1</text>
<circle cx="385" cy="125" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="385" y="132" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="385" y="80" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">主题 2</text>
<circle cx="625" cy="250" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="625" y="257" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="625" y="205" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">主题 3</text>
<text x="50" y="315" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">写作顺序：2 → 1 → 3</text>
<text x="50" y="353" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">每次选已写邻居中缺失的最小正整数</text>
</g></svg>
