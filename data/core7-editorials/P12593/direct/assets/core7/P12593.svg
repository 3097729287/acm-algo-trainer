<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">同样两条边，先删中点与先删端点的费用不同</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同样两条边，先删中点与先删端点的费用不同</text>
<circle cx="140" cy="145" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="140" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="380" cy="145" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="620" cy="145" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="620" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<line x1="165" y1="145" x2="355" y2="145" stroke="#2365ab" stroke-width="3"/>
<line x1="405" y1="145" x2="595" y2="145" stroke="#2365ab" stroke-width="3"/>
<text x="260" y="125" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">权 2</text>
<text x="500" y="125" fill="#243449" font-size="24" text-anchor="middle" font-weight="normal">权 5</text>
<text x="55" y="245" fill="#bc3645" font-size="23" text-anchor="start" font-weight="normal">先删 2：两条同时删，费用 2×(2+5)=14</text>
<text x="55" y="310" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">先删两端：分别付 2、5，最后孤点免费，总费 7</text>
</g></svg>
