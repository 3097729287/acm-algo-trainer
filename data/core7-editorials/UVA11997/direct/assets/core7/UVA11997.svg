<svg xmlns="http://www.w3.org/2000/svg" width="760" height="325" viewBox="0 0 760 325" role="img" aria-labelledby="title"><title id="title">两条升序和列表，取走谁就推进谁</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两条升序和列表，取走谁就推进谁</text>
<text x="40" y="105" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">a=1</text>
<rect x="200" y="75" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="261.0" y="106.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="325" y="75" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="386.0" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<text x="40" y="195" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">a=3</text>
<rect x="200" y="165" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="261.0" y="196.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="325" y="165" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="386.0" y="196.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<text x="495" y="105" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">加 b=[2,5]</text>
<text x="495" y="195" fill="#12805c" font-size="20" text-anchor="start" font-weight="normal">先取 3，再取 5</text>
<text x="40" y="285" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">弹出 3 后，第一行推进到 6；第二行的 5 仍更小</text>
</g></svg>
