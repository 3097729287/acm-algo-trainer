<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">十二不是先拿九，三个四能少用一项</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">十二不是先拿九，三个四能少用一项</text>
<circle cx="110" cy="120" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="110" y="127" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">9</text>
<circle cx="260" cy="120" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="260" y="127" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="410" cy="120" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="410" y="127" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="560" cy="120" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="560" y="127" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="690" y="130" fill="#bc3645" font-size="23" text-anchor="middle" font-weight="normal">4 项</text>
<circle cx="185" cy="245" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="185" y="252" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="355" cy="245" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="355" y="252" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="525" cy="245" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="525" y="252" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="65" y="325" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">所有圆内数字均为平方数；下排只需 3 项</text>
</g></svg>
