<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">边权和更小，不代表按位或更小</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">边权和更小，不代表按位或更小</text>
<line x1="160" y1="105" x2="590" y2="105" stroke="#bc3645" stroke-width="4"/>
<line x1="160" y1="105" x2="375" y2="260" stroke="#12805c" stroke-width="5"/>
<line x1="590" y1="105" x2="375" y2="260" stroke="#12805c" stroke-width="5"/>
<circle cx="160" cy="105" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
