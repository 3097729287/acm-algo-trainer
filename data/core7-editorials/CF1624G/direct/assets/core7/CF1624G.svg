<circle cx="590" cy="105" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="590" y="112" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="375" cy="260" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="375" y="267" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="375" y="85" fill="#bc3645" font-size="22" text-anchor="middle" font-weight="normal">3</text>
<text x="240" y="210" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">4</text>
<text x="495" y="210" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">4</text>
<text x="70" y="330" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">选绿边：4 OR 4 = 4；选三和四则得到七</text>
</g></svg>
