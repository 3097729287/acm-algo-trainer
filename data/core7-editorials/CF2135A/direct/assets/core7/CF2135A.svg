<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" role="img" aria-labelledby="title"><title id="title">末块是三个 3：以前缀位置 2 的最优解接上</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">末块是三个 3：以前缀位置 2 的最优解接上</text>
<rect x="70" y="95" width="102" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="121.0" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="175" y="95" width="102" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="226.0" y="126.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="280" y="95" width="102" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="331.0" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="385" y="95" width="102" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="436.0" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="490" y="95" width="102" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="541.0" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="595" y="95" width="102" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="646.0" y="126.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="120" y="80" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">1</text>
<text x="225" y="80" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">2</text>
<text x="330" y="80" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">3</text>
<text x="435" y="80" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">4</text>
<text x="540" y="80" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">5</text>
<text x="645" y="80" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">6</text>
<line x1="70" y1="180" x2="275" y2="180" stroke="#12805c" stroke-width="6"/>
<line x1="280" y1="180" x2="590" y2="180" stroke="#2365ab" stroke-width="6"/>
<text x="65" y="230" fill="#12805c" font-size="19" text-anchor="start" font-weight="normal">f[2]=1：只保留第一个 1</text>
<text x="350" y="230" fill="#2365ab" font-size="19" text-anchor="start" font-weight="normal">本块首位置 l=3，长度 x=3</text>
<text x="130" y="300" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">f[5] = f[l−1] + x = f[2] + 3 = 1+3 = 4</text>
</g></svg>
