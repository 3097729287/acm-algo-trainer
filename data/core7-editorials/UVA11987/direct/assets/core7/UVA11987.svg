<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title"><title id="title">移动元素 4 时换一个代表结点，旧的存储结点仍保留</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">移动元素 4 时换一个代表结点，旧的存储结点仍保留</text>
<line x1="180" y1="130" x2="90" y2="255" stroke="#68778b" stroke-width="4"/>
<line x1="180" y1="130" x2="260" y2="255" stroke="#12805c" stroke-width="4"/>
<line x1="550" y1="130" x2="460" y2="255" stroke="#68778b" stroke-width="4"/>
<line x1="550" y1="130" x2="650" y2="255" stroke="#68778b" stroke-width="4"/>
<circle cx="180" cy="130" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="180" y="137" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="90" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="90" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="260" cy="255" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="260" y="262" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">7</text>
<circle cx="550" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="550" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="460" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="460" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<circle cx="650" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="650" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="160" y="335" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">pos[4]=7</text>
<text x="455" y="335" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">pos[3]=6；pos[5]=5</text>
<text x="65" y="390" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">左集合 {1,2,4}：3、7</text>
<text x="410" y="390" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">右集合 {3,5}：2、8</text>
<text x="65" y="428" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">圆内是存储结点编号；旧结点 4 不再由 pos[4] 指向</text>
</g></svg>
