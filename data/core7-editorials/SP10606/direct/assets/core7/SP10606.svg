<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">未出现的数字不要求补齐，出现过的按各自奇偶检查</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">未出现的数字不要求补齐，出现过的按各自奇偶检查</text>
<rect x="35" y="90" width="140" height="45" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="105.0" y="119.5" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">77</text>
<text x="210" y="121" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">奇数码 7 出现两次</text>
<rect x="35" y="180" width="140" height="45" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="105.0" y="209.5" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">211</text>
<text x="210" y="211" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">偶数码 2 一次，奇数码 1 两次</text>
<rect x="35" y="270" width="140" height="45" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="105.0" y="299.5" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">6222</text>
<text x="210" y="301" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">偶数码 6 一次，2 三次</text>
<rect x="35" y="360" width="140" height="45" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="105.0" y="389.5" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">662</text>
<text x="210" y="391" fill="#bc3645" font-size="23" text-anchor="start" font-weight="normal">偶数码 6 出现两次，不合法</text>
</g></svg>
