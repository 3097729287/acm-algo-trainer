<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title"><title id="title">目标是整块挡板：落到内部时就已经到达</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">目标是整块挡板：落到内部时就已经到达</text>
<line x1="200" y1="100" x2="380" y2="100" stroke="#2365ab" stroke-width="7"/>
<line x1="320" y1="340" x2="500" y2="340" stroke="#12805c" stroke-width="7"/>
<line x1="205" y1="85" x2="375" y2="85" stroke="#2365ab" stroke-width="3"/>
<line x1="375" y1="85" x2="365.3465918192059" y2="90.27368092464623" stroke="#2365ab" stroke-width="3"/>
<line x1="375" y1="85" x2="365.3465918192059" y2="79.72631907535377" stroke="#2365ab" stroke-width="3"/>
<line x1="380" y1="115" x2="380" y2="330" stroke="#bc3645" stroke-width="3"/>
<line x1="380" y1="330" x2="374.7263190753538" y2="320.3465918192059" stroke="#bc3645" stroke-width="3"/>
<line x1="380" y1="330" x2="385.2736809246462" y2="320.3465918192059" stroke="#bc3645" stroke-width="3"/>
<circle cx="200" cy="100" r="5" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<circle cx="380" cy="100" r="5" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<circle cx="320" cy="340" r="5" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<circle cx="500" cy="340" r="5" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<circle cx="380" cy="340" r="7" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="200" y="65" fill="#243449" font-size="19" text-anchor="start" font-weight="normal">起点 x=1</text>
<text x="390" y="92" fill="#243449" font-size="19" text-anchor="start" font-weight="normal">x=4</text>
<text x="40" y="105" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">高度 10</text>
<text x="40" y="345" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">高度 6</text>
<text x="470" y="205" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">行走 3，下落 4</text>
<text x="470" y="245" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">首次到目标：7</text>
<text x="325" y="380" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">目标 [3,6]；绿色落点 x=4 在内部</text>
<text x="45" y="427" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">不必多走到左端 x=3，更不必走到右端 x=6</text>
</g></svg>
