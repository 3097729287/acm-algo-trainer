<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">环内的钥匙互相锁住，砸入树上的点不一定有用</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">环内的钥匙互相锁住，砸入树上的点不一定有用</text>
<circle cx="130" cy="145" r="28" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="130" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="360" cy="145" r="28" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="360" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="610" cy="145" r="28" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="610" y="152" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<line x1="158" y1="145" x2="332" y2="145" stroke="#2365ab" stroke-width="3"/>
<polygon points="332.00,145.00 322.24,150.08 322.24,139.92" fill="#2365ab"/>
<line x1="388" y1="130" x2="582" y2="130" stroke="#bc3645" stroke-width="3"/>
<polygon points="582.00,130.00 572.24,135.08 572.24,124.92" fill="#bc3645"/>
<line x1="582" y1="160" x2="388" y2="160" stroke="#bc3645" stroke-width="3"/>
<polygon points="388.00,160.00 397.76,154.92 397.76,165.08" fill="#bc3645"/>
<text x="50" y="225" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">依赖 i → x：i 号的钥匙放在 x 号罐里</text>
<text x="50" y="280" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">砸一号：环仍锁住     砸二号：可取出一号、三号钥匙</text>
<text x="50" y="330" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">全部同属一块，最少砸一只，但不能在块中随便选</text>
</g></svg>
