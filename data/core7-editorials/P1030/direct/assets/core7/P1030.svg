<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">后序末尾的 A 定根，中序在 A 处分开</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">后序末尾的 A 定根，中序在 A 处分开</text>
<line x1="230" y1="100" x2="110" y2="220" stroke="#68778b" stroke-width="4"/>
<line x1="230" y1="100" x2="350" y2="220" stroke="#68778b" stroke-width="4"/>
<line x1="350" y1="220" x2="280" y2="330" stroke="#68778b" stroke-width="4"/>
<circle cx="230" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="230" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<circle cx="110" cy="220" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="110" y="227" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<circle cx="350" cy="220" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="350" y="227" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">C</text>
<circle cx="280" cy="330" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="280" y="337" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">D</text>
<text x="440" y="125" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">中序：B A D C</text>
<text x="440" y="200" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">后序：B D C A</text>
<text x="440" y="275" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">先序：A B C D</text>
<text x="65" y="395" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">A 左边只有 B；右子树根为 C，D 是 C 的左孩子</text>
</g></svg>
