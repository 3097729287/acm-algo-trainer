<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">去掉一枚 2 后，正重量是一、二、三</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">去掉一枚 2 后，正重量是一、二、三</text>
<rect x="130" y="90" width="167" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="213.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="300" y="90" width="167" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="383.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="470" y="90" width="167" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="553.5" y="121.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<line x1="475" y1="85" x2="630" y2="150" stroke="#bc3645" stroke-width="4"/>
<text x="60" y="230" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">保留 {1,2}：只用 1、只用 2、两者都用</text>
<rect x="130" y="275" width="167" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="213.5" y="306.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="300" y="275" width="167" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="383.5" y="306.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="470" y="275" width="167" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="553.5" y="306.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="60" y="365" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">空集重量 0 不计；三种重量，不按不同组成重复计数</text>
</g></svg>
