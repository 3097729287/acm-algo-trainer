<svg xmlns="http://www.w3.org/2000/svg" width="760" height="335" viewBox="0 0 760 335" role="img" aria-labelledby="title"><title id="title">代价八与七先保留，最后切断代价二的边</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">代价八与七先保留，最后切断代价二的边</text>
<line x1="80" y1="150" x2="275" y2="150" stroke="#12805c" stroke-width="4"/>
<rect x="165.5" y="118.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="177.5" y="140.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">8</text>
<line x1="275" y1="150" x2="470" y2="150" stroke="#bc3645" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="360.5" y="118.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="372.5" y="140.0" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">2</text>
<line x1="470" y1="150" x2="665" y2="150" stroke="#12805c" stroke-width="4"/>
<rect x="555.5" y="118.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="567.5" y="140.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">7</text>
<circle cx="80" cy="150" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="80" y="157" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<circle cx="275" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="275" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="470" cy="150" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="470" y="157" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="665" cy="150" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="665" y="157" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="60" y="235" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">红色城市敌占；两块各含一个敌方点</text>
<text x="60" y="300" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">必须断开它们，选择删除便宜的中间边，代价 2</text>
</g></svg>
