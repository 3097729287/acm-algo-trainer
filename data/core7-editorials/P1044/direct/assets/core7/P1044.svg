<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title"><title id="title">元素 1 弹出之前与之后：两段各自完成栈操作</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">元素 1 弹出之前与之后：两段各自完成栈操作</text>
<rect x="40" y="100" width="250" height="65" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="165.0" y="139.5" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">先出：2 … k+1</text>
<rect x="315" y="100" width="90" height="65" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="360.0" y="139.5" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="430" y="100" width="290" height="65" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="575.0" y="139.5" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">后出：k+2 … n</text>
<text x="165" y="215" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">k 个数，f[k] 种</text>
<text x="575" y="215" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">n−1−k 个数</text>
<text x="90" y="280" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">固定 k 时两侧独立配对；不同 k 由 1 的位置区分</text>
</g></svg>
