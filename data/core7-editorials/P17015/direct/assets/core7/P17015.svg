<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title"><title id="title">删中间得到两侧之和，新的邻居随后改变</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">删中间得到两侧之和，新的邻居随后改变</text>
<rect x="105" y="90" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="166.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="230" y="90" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="291.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="355" y="90" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="416.0" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="510" y="122" fill="#12805c" font-size="20" text-anchor="start" font-weight="normal">删 2，得 1+3=4</text>
<rect x="105" y="200" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="166.0" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="230" y="200" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="291.0" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="510" y="232" fill="#12805c" font-size="20" text-anchor="start" font-weight="normal">删 1，得 0+3=3</text>
<rect x="105" y="310" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="166.0" y="341.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="510" y="342" fill="#12805c" font-size="20" text-anchor="start" font-weight="normal">删 3，得 0</text>
<text x="65" y="420" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">总分 7；不加被删元素自身，边界不存在时为零</text>
</g></svg>
