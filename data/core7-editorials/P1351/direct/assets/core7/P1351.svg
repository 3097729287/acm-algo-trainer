<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title"><title id="title">中点相同，三组无序配对对应六个有序点对</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">中点相同，三组无序配对对应六个有序点对</text>
<line x1="240" y1="160" x2="85" y2="280" stroke="#68778b" stroke-width="4"/>
<line x1="240" y1="160" x2="240" y2="280" stroke="#68778b" stroke-width="4"/>
<line x1="240" y1="160" x2="395" y2="280" stroke="#68778b" stroke-width="4"/>
<circle cx="240" cy="160" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="240" y="167" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">c</text>
<circle cx="85" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="85" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="240" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="240" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="395" cy="280" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="395" y="287" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">10</text>
<text x="455" y="140" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">圆内数字为叶权</text>
<text x="455" y="200" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">最大：5×10=50</text>
<text x="455" y="260" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">有序和：160</text>
<text x="50" y="340" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">先累加 2×新权值×此前邻居权和，再更新邻居权和</text>
</g></svg>
