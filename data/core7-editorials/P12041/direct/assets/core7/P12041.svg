<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">给定零把 1、2、3 连通；给定一的边赋零</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">给定零把 1、2、3 连通；给定一的边赋零</text>
<line x1="125" y1="130" x2="290" y2="250" stroke="#2365ab" stroke-width="3"/>
<line x1="290" y1="250" x2="455" y2="130" stroke="#2365ab" stroke-width="3"/>
<line x1="125" y1="130" x2="455" y2="130" stroke="#2365ab" stroke-width="3"/>
<line x1="455" y1="130" x2="650" y2="130" stroke="#bc3645" stroke-width="5"/>
<circle cx="125" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="125" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="290" cy="250" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="290" y="257" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="455" cy="130" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="455" y="137" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="650" cy="130" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="650" y="137" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="180" y="190" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">权 1</text>
<text x="370" y="190" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">权 1</text>
<text x="290" y="113" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">权 1</text>
<text x="550" y="113" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">权 0</text>
<text x="65" y="305" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">前三点有正边路径，最小 mex=0；3 到 4 最小 mex=1</text>
</g></svg>
