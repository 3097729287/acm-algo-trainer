<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" role="img" aria-labelledby="title"><title id="title">n=m=五：先把三点团填满，再接两个新点</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">n=m=五：先把三点团填满，再接两个新点</text>
<line x1="90" y1="100" x2="295" y2="100" stroke="#12805c" stroke-width="4"/>
<rect x="180.5" y="68.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="192.5" y="90.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">1</text>
<line x1="295" y1="100" x2="200" y2="255" stroke="#12805c" stroke-width="4"/>
<rect x="235.5" y="145.5" width="24" height="28" rx="3" fill="#fff"/>
<text x="247.5" y="167.5" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">2</text>
<line x1="200" y1="255" x2="460" y2="255" stroke="#12805c" stroke-width="4"/>
<rect x="318.0" y="223.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="330.0" y="245.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">4</text>
<line x1="460" y1="255" x2="665" y2="255" stroke="#12805c" stroke-width="4"/>
<rect x="550.5" y="223.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="562.5" y="245.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">5</text>
<line x1="90" y1="100" x2="200" y2="255" stroke="#bc3645" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="107.0" y="155.5" width="76" height="28" rx="3" fill="#fff"/>
<text x="145.0" y="177.5" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">3 跳过</text>
<circle cx="90" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="90" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="295" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="295" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="200" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="200" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="460" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="460" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="665" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="665" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="45" y="330" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">一、二接受；三闭环；四、五必须留给新点</text>
<text x="45" y="375" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">最小生成树总权 1+2+4+5=12</text>
</g></svg>
