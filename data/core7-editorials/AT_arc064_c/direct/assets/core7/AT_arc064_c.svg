<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">圆内免费，只累加圆外的三段间隙</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">圆内免费，只累加圆外的三段间隙</text>
<circle cx="230" cy="165" r="80" fill="#fff" stroke="#12805c" stroke-width="3"/>
<circle cx="470" cy="165" r="40" fill="#fff" stroke="#12805c" stroke-width="3"/>
<line x1="70" y1="165" x2="150" y2="165" stroke="#bc3645" stroke-width="6"/>
<line x1="150" y1="165" x2="310" y2="165" stroke="#12805c" stroke-width="6"/>
<line x1="310" y1="165" x2="430" y2="165" stroke="#bc3645" stroke-width="6"/>
<line x1="430" y1="165" x2="510" y2="165" stroke="#12805c" stroke-width="6"/>
<line x1="510" y1="165" x2="590" y2="165" stroke="#bc3645" stroke-width="6"/>
<circle cx="70" cy="165" r="5" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<circle cx="590" cy="165" r="5" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="70" y="205" fill="#2365ab" font-size="18" text-anchor="middle" font-weight="normal">起点 −4</text>
<text x="230" y="270" fill="#12805c" font-size="18" text-anchor="middle" font-weight="normal">圆心 0，半径 2</text>
<text x="470" y="235" fill="#12805c" font-size="18" text-anchor="middle" font-weight="normal">圆心 6，半径 1</text>
<text x="625" y="205" fill="#2365ab" font-size="18" text-anchor="middle" font-weight="normal">终点 9</text>
<text x="110" y="145" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="370" y="145" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="550" y="145" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="70" y="325" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">红色暴露长度：2+3+2=7；绿色段不计费</text>
</g></svg>
