<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title"><title id="title">五点链以中心为根，三个核心保留最高的三个点</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">五点链以中心为根，三个核心保留最高的三个点</text>
<line x1="380" y1="95" x2="235" y2="205" stroke="#12805c" stroke-width="4"/>
<line x1="380" y1="95" x2="530" y2="205" stroke="#12805c" stroke-width="4"/>
<line x1="235" y1="205" x2="85" y2="310" stroke="#68778b" stroke-width="4"/>
<line x1="530" y1="205" x2="680" y2="310" stroke="#68778b" stroke-width="4"/>
<circle cx="380" cy="95" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="380" y="102" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="235" cy="205" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="235" y="212" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="530" cy="205" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="530" y="212" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="85" cy="310" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="85" y="317" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="680" cy="310" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="680" y="317" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="380" y="143" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">h=2</text>
<text x="235" y="253" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">h=1</text>
<text x="530" y="253" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">h=1</text>
<text x="85" y="358" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">h=0</text>
<text x="680" y="358" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">h=0</text>
<text x="65" y="398" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">高度降序 2、1、1、0、0；k=3，答案 0+1=1</text>
</g></svg>
