<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">同色孩子触发其子树内同色点，负战力不能跳过</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">同色孩子触发其子树内同色点，负战力不能跳过</text>
<line x1="380" y1="100" x2="200" y2="220" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="100" x2="560" y2="220" stroke="#12805c" stroke-width="4"/>
<line x1="200" y1="220" x2="200" y2="335" stroke="#68778b" stroke-width="4"/>
<circle cx="380" cy="100" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="380" y="107" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<circle cx="200" cy="220" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="200" y="227" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">−2</text>
<circle cx="560" cy="220" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="560" y="227" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="200" cy="335" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="200" y="342" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">−7</text>
<text x="55" y="395" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">绿色作黑、蓝色作白：根只增加右孩子的 4</text>
<text x="55" y="445" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">总士气为 10−2+4−7=5；不能越过白孩子直接加 −7</text>
</g></svg>
