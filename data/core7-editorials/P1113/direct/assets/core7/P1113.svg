<svg xmlns="http://www.w3.org/2000/svg" width="760" height="335" viewBox="0 0 760 335" role="img" aria-labelledby="title"><title id="title">并行前驱取最晚结束时刻，不把两段时间相加</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">并行前驱取最晚结束时刻，不把两段时间相加</text>
<rect x="45" y="95" width="185" height="65" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
