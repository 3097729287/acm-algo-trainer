<line x1="405" y1="167" x2="396.84388295195845" y2="159.61909526557577" stroke="#12805c" stroke-width="3"/>
<line x1="230" y1="225" x2="405" y2="190" stroke="#2365ab" stroke-width="3"/>
<line x1="405" y1="190" x2="396.5683084042503" y2="197.06445870779658" stroke="#2365ab" stroke-width="3"/>
<line x1="405" y1="190" x2="394.49980056246307" y2="186.72191949886076" stroke="#2365ab" stroke-width="3"/>
<text x="245" y="300" fill="#bc3645" font-size="22" text-anchor="middle" font-weight="normal">开始 8，结束 11</text>
