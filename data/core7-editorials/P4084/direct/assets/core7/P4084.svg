<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">固定两个不同颜色叶子，根只剩第三种颜色</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">固定两个不同颜色叶子，根只剩第三种颜色</text>
<line x1="380" y1="110" x2="170" y2="260" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="110" x2="380" y2="260" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="110" x2="590" y2="260" stroke="#68778b" stroke-width="4"/>
<circle cx="380" cy="110" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="117" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">色3</text>
<circle cx="170" cy="260" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="170" y="267" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">色1</text>
<circle cx="380" cy="260" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="267" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">色2</text>
<circle cx="590" cy="260" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="590" y="267" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">?</text>
<text x="60" y="345" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">根只能色 3；右叶可色 1 或色 2，共 2 种</text>
<text x="60" y="400" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">每个孩子先对不同于父色的状态求和，再在孩子间相乘</text>
</g></svg>
