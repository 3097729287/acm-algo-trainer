<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title"><title id="title">有序对到无序组：每组恰好数了两遍</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">有序对到无序组：每组恰好数了两遍</text>
<rect x="45" y="90" width="95" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="92.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">AB</text>
