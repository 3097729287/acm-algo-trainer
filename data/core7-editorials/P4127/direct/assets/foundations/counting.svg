<text x="385" y="220" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">{A,C}</text>
<line x1="385" y1="145" x2="385" y2="185" stroke="#68778b" stroke-width="3"/>
<rect x="525" y="90" width="95" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="572.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">BC</text>
<rect x="635" y="90" width="95" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="682.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">CB</text>
<text x="625" y="220" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">{B,C}</text>
