<text x="202.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">BA</text>
<text x="145" y="220" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">{A,B}</text>
<line x1="145" y1="145" x2="145" y2="185" stroke="#68778b" stroke-width="3"/>
<rect x="285" y="90" width="95" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="332.5" y="121.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">AC</text>
<rect x="395" y="90" width="95" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
