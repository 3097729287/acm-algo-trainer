<text x="653.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<line x1="605" y1="85" x2="700" y2="155" stroke="#bc3645" stroke-width="3"/>
<text x="65" y="305" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">第一天保留第 2 小时：1 小时；第二天第 1 至 4 小时：4 小时</text>
<text x="65" y="350" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">总在校时间 1+4=5，恰好只缺一节</text>
