<text x="253.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="305" y="200" width="97" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="353.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="405" y="200" width="97" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
