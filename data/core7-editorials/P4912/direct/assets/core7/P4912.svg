<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">长度先为负，仍可接上后一个魔法达到正目标</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">长度先为负，仍可接上后一个魔法达到正目标</text>
<circle cx="220" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="220" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">-3</text>
<circle cx="540" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="540" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<line x1="260" y1="135" x2="500" y2="135" stroke="#12805c" stroke-width="4"/>
<text x="380" y="105" fill="#12805c" font-size="22" text-anchor="middle" font-weight="normal">附加威力 7</text>
<text x="220" y="235" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">基础威力 10</text>
<text x="540" y="235" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">基础威力 20</text>
<text x="65" y="305" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">按编号 1→2：总长度 1，威力 10+20+7=37</text>
<text x="65" y="350" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">第一个魔法没有前驱附加值；只算相邻影响</text>
</g></svg>
