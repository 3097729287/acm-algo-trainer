<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">两种预算都必须满足，不能只检查其中一种</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两种预算都必须满足，不能只检查其中一种</text>
<text x="55" y="95" fill="#243449" font-size="24" text-anchor="start" font-weight="normal">金钱、时间上限均为 3</text>
<text x="55" y="165" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">愿望 A</text>
<rect x="270" y="135" width="172" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="356.0" y="166.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="445" y="135" width="172" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="531.0" y="166.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="55" y="245" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">愿望 B</text>
<rect x="270" y="215" width="172" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="356.0" y="246.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="445" y="215" width="172" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="531.0" y="246.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<text x="55" y="325" fill="#bc3645" font-size="23" text-anchor="start" font-weight="normal">A 与 B</text>
<rect x="270" y="295" width="172" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="356.0" y="326.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="445" y="295" width="172" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="531.0" y="326.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="300" y="385" fill="#68778b" font-size="22" text-anchor="start" font-weight="normal">金钱</text>
<text x="480" y="385" fill="#68778b" font-size="22" text-anchor="start" font-weight="normal">时间</text>
</g></svg>
