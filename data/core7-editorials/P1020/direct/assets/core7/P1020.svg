<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title"><title id="title">相等高度能继续拦截，后来的更高导弹需要另一套</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">相等高度能继续拦截，后来的更高导弹需要另一套</text>
<rect x="190" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="248.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="310" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="368.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="430" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="488.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<line x1="250" y1="160" x2="370" y2="160" stroke="#2365ab" stroke-width="4"/>
<text x="245" y="215" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">系统一：[3,3]</text>
<text x="470" y="215" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">系统二：[4]</text>
<text x="65" y="290" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">一套最多 2 发；全部拦下至少 2 套</text>
<text x="65" y="330" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">第一问允许相等，第二问的上升下界必须严格</text>
</g></svg>
