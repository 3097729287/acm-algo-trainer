<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title"><title id="title">两种位置区间，对应四条有向最近值配对</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两种位置区间，对应四条有向最近值配对</text>
<text x="35" y="115" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">原数值</text>
<rect x="220" y="85" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="288.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="360" y="85" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="428.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="500" y="85" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="568.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="55" y="215" width="310" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="210.0" y="252.0" fill="#2365ab" font-size="22" text-anchor="middle" font-weight="normal">位置 1→2 与 2→1</text>
<rect x="395" y="215" width="310" height="60" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="550.0" y="252.0" fill="#12805c" font-size="22" text-anchor="middle" font-weight="normal">位置 1→3 与 3→1</text>
<text x="45" y="345" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">查询 [1,2] 有 2 对；查询 [1,3] 有 4 对</text>
<text x="45" y="405" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">原编号加权：2×1 + 4×2 = 10</text>
</g></svg>
