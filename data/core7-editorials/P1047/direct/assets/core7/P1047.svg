<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">L=5：六个树位，重叠位置只移除一次</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">L=5：六个树位，重叠位置只移除一次</text>
<circle cx="100" cy="110" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="100" y="117" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<circle cx="210" cy="110" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="210" y="117" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="320" cy="110" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="320" y="117" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="430" cy="110" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="430" y="117" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="540" cy="110" r="23" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="540" y="117" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<circle cx="650" cy="110" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="650" y="117" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<line x1="210" y1="175" x2="430" y2="175" stroke="#2365ab" stroke-width="8"/>
<text x="245" y="210" fill="#2365ab" font-size="21" text-anchor="start" font-weight="normal">操作一：[1,3]</text>
<line x1="430" y1="245" x2="540" y2="245" stroke="#bc3645" stroke-width="8"/>
<text x="390" y="285" fill="#bc3645" font-size="21" text-anchor="start" font-weight="normal">操作二：[3,4]</text>
<text x="80" y="330" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">最后只留下位置 0、5，共两棵</text>
</g></svg>
