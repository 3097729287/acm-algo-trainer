<svg xmlns="http://www.w3.org/2000/svg" width="760" height="555" viewBox="0 0 760 555" role="img" aria-labelledby="title"><title id="title">固定左右边界牛：两种底边、一种顶边</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">固定左右边界牛：两种底边、一种顶边</text>
<line x1="125" y1="425" x2="640" y2="425" stroke="#68778b" stroke-width="3"/>
<line x1="125" y1="425" x2="125" y2="70" stroke="#68778b" stroke-width="3"/>
<rect x="160" y="220" width="280" height="180" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<line x1="160" y1="280" x2="440" y2="280" stroke="#12805c" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="160" y1="400" x2="440" y2="400" stroke="#2365ab" stroke-width="5"/>
<circle cx="160" cy="280" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="160" y="287" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">i</text>
<circle cx="300" cy="400" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="300" y="407" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">底2</text>
<circle cx="440" cy="220" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="440" y="227" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">j</text>
<circle cx="580" cy="100" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="580" y="107" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">外</text>
<text x="185" y="260" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">(0,2)</text>
<text x="320" y="385" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">(1,0)</text>
<text x="465" y="210" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">(2,3)</text>
<text x="610" y="95" fill="#243449" font-size="19" text-anchor="start" font-weight="normal">(3,5)</text>
<text x="45" y="485" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">x 条带 [0,2]：底边可取 y=0 或 y=2，顶边只可 y=3</text>
<text x="45" y="535" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">两个子集分别是 {i,j} 与 {i,底2,j}，贡献 2×1=2</text>
</g></svg>
