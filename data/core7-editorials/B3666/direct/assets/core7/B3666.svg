<svg xmlns="http://www.w3.org/2000/svg" width="760" height="535" viewBox="0 0 760 535" role="img" aria-labelledby="title"><title id="title">加入 2、1、3、5、4 后的严格后缀纪录</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">加入 2、1、3、5、4 后的严格后缀纪录</text>
<text x="110" y="85" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">加入值</text>
<text x="360" y="85" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">纪录下标</text>
<text x="650" y="85" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">异或</text>
<text x="110" y="150" fill="#243449" font-size="25" text-anchor="middle" font-weight="normal">2</text>
<text x="360" y="150" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">1</text>
<text x="650" y="150" fill="#2365ab" font-size="25" text-anchor="middle" font-weight="normal">1</text>
<text x="110" y="225" fill="#243449" font-size="25" text-anchor="middle" font-weight="normal">1</text>
<text x="360" y="225" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">1、2</text>
<text x="650" y="225" fill="#2365ab" font-size="25" text-anchor="middle" font-weight="normal">3</text>
<text x="110" y="300" fill="#243449" font-size="25" text-anchor="middle" font-weight="normal">3</text>
<text x="360" y="300" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">3</text>
<text x="650" y="300" fill="#2365ab" font-size="25" text-anchor="middle" font-weight="normal">3</text>
<text x="110" y="375" fill="#243449" font-size="25" text-anchor="middle" font-weight="normal">5</text>
<text x="360" y="375" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">4</text>
<text x="650" y="375" fill="#2365ab" font-size="25" text-anchor="middle" font-weight="normal">4</text>
<text x="110" y="450" fill="#243449" font-size="25" text-anchor="middle" font-weight="normal">4</text>
<text x="360" y="450" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">4、5</text>
<text x="650" y="450" fill="#2365ab" font-size="25" text-anchor="middle" font-weight="normal">1</text>
</g></svg>
