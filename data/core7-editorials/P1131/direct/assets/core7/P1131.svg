<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">增加短支入口，让所有叶子到根的时间相同</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">增加短支入口，让所有叶子到根的时间相同</text>
<line x1="380" y1="105" x2="205" y2="255" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="105" x2="555" y2="255" stroke="#68778b" stroke-width="4"/>
<circle cx="380" cy="105" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="112" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="205" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="205" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="555" cy="255" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="555" y="262" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="230" y="165" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">原长 1</text>
<text x="465" y="165" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">原长 3</text>
<text x="160" y="205" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">补 2</text>
<text x="500" y="205" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">补 0</text>
<text x="60" y="345" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">根到两个叶子最后都为 3，最少总增量为 2</text>
</g></svg>
