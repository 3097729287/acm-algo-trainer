<svg xmlns="http://www.w3.org/2000/svg" width="760" height="335" viewBox="0 0 760 335" role="img" aria-labelledby="title"><title id="title">五步到补给仍存活，六步到补给会先死亡</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">五步到补给仍存活，六步到补给会先死亡</text>
<text x="30" y="108" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">五步</text>
<rect x="140" y="75" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="182.5" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="228" y="75" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="270.5" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="316" y="75" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="358.5" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="404" y="75" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="446.5" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="492" y="75" width="85" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="534.5" y="106.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="580" y="75" width="85" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="622.5" y="106.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1→6</text>
<text x="625" y="155" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">鼠标</text>
<text x="30" y="235" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">六步</text>
<rect x="140" y="200" width="77" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="178.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="220" y="200" width="77" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="258.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="300" y="200" width="77" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="338.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="380" y="200" width="77" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="418.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="460" y="200" width="77" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="498.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="540" y="200" width="77" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="578.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="620" y="200" width="77" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="658.5" y="231.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">0 ×</text>
<text x="65" y="310" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">格内是到达后的血量：先扣血，尚大于零才允许补满</text>
</g></svg>
