<svg xmlns="http://www.w3.org/2000/svg" width="760" height="305" viewBox="0 0 760 305" role="img" aria-labelledby="title"><title id="title">系数三、五：区间五到十只有七不可表示</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">系数三、五：区间五到十只有七不可表示</text>
<rect x="70" y="100" width="100" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="120.0" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="173" y="100" width="100" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="223.0" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<rect x="276" y="100" width="100" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="326.0" y="131.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">7</text>
<rect x="379" y="100" width="100" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="429.0" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<rect x="482" y="100" width="100" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="532.0" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">9</text>
<rect x="585" y="100" width="100" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="635.0" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">10</text>
<text x="120" y="203" fill="#12805c" font-size="19" text-anchor="middle" font-weight="normal">5</text>
<text x="223" y="203" fill="#12805c" font-size="19" text-anchor="middle" font-weight="normal">3+3</text>
<text x="326" y="203" fill="#bc3645" font-size="19" text-anchor="middle" font-weight="normal">不可</text>
<text x="429" y="203" fill="#12805c" font-size="19" text-anchor="middle" font-weight="normal">3+5</text>
<text x="532" y="203" fill="#12805c" font-size="19" text-anchor="middle" font-weight="normal">3×3</text>
<text x="635" y="203" fill="#12805c" font-size="19" text-anchor="middle" font-weight="normal">5+5</text>
<text x="55" y="270" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">按余数类的首个可达值计数，最后共有 5 个</text>
</g></svg>
