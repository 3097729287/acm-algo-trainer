<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">沿一条边换根，边两侧的牛群距离一增一减</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">沿一条边换根，边两侧的牛群距离一增一减</text>
<line x1="140" y1="180" x2="380" y2="180" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="180" x2="620" y2="180" stroke="#68778b" stroke-width="4"/>
<circle cx="140" cy="180" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="140" y="187" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="380" cy="180" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="187" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="620" cy="180" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="620" y="187" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="140" y="110" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">0 头牛</text>
<text x="380" y="110" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">1 头牛</text>
<text x="620" y="110" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">2 头牛</text>
<text x="260" y="165" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">长 2</text>
<text x="500" y="165" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">长 3</text>
<text x="65" y="290" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">牛棚从 2 移到 3：两头牛各近 3，一头牛远 3</text>
<text x="65" y="350" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">总费从 6 变成 3，变化为 3×(3−2×2)=−3</text>
</g></svg>
