<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title"><title id="title">叉积：有向 AB 左侧为正，面积取绝对值</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">叉积：有向 AB 左侧为正，面积取绝对值</text>
<line x1="150" y1="265" x2="595" y2="265" stroke="#2365ab" stroke-width="3"/>
<line x1="150" y1="265" x2="300" y2="90" stroke="#12805c" stroke-width="3"/>
<line x1="595" y1="265" x2="300" y2="90" stroke="#68778b" stroke-width="3" stroke-dasharray="7 5"/>
<circle cx="150" cy="265" r="5" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="150" y="297" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">A (0,0)</text>
<circle cx="595" cy="265" r="5" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="595" y="297" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">B (3,0)</text>
<circle cx="300" cy="90" r="5" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="300" y="122" fill="#243449" font-size="21" text-anchor="middle" font-weight="normal">C (1,2)</text>
<text x="400" y="185" fill="#243449" font-size="20" text-anchor="middle" font-weight="normal">AB × AC = 3×2 − 0×1 = 6</text>
<text x="400" y="220" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">三角形面积 = 6 / 2 = 3</text>
</g></svg>
