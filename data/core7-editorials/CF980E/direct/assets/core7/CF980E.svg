<svg xmlns="http://www.w3.org/2000/svg" width="760" height="435" viewBox="0 0 760 435" role="img" aria-labelledby="title"><title id="title">保留六、五以后，只剩一个名额，四号需要两个</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">保留六、五以后，只剩一个名额，四号需要两个</text>
<line x1="380" y1="90" x2="235" y2="205" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="90" x2="565" y2="205" stroke="#12805c" stroke-width="4"/>
<line x1="235" y1="205" x2="90" y2="335" stroke="#68778b" stroke-width="4"/>
<line x1="235" y1="205" x2="245" y2="335" stroke="#68778b" stroke-width="4"/>
<line x1="235" y1="205" x2="400" y2="335" stroke="#68778b" stroke-width="4"/>
<circle cx="380" cy="90" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="380" y="97" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<circle cx="235" cy="205" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="235" y="212" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="565" cy="205" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="565" y="212" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<circle cx="90" cy="335" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="90" y="342" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="245" cy="335" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="245" y="342" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="400" cy="335" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="400" y="342" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="485" y="280" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">四号需要补 4、2 两点</text>
<text x="485" y="330" fill="#bc3645" font-size="20" text-anchor="start" font-weight="normal">剩一格，跳过四号</text>
<text x="485" y="380" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">之后可补二号</text>
<text x="55" y="425" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">再补 2：保留 {2,5,6}；删除 {1,3,4}</text>
</g></svg>
