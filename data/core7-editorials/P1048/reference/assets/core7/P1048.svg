<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">只有一株药，时间够两次也不能重复采</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">只有一株药，时间够两次也不能重复采</text>
<text x="55" y="92" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">总时间 4；唯一草药：耗时 2，价值 3</text>
<rect x="65" y="135" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="126.0" y="166.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="190" y="135" width="122" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="251.0" y="166.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="315" y="135" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="376.0" y="166.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="440" y="135" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="501.0" y="166.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="565" y="135" width="122" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="626.0" y="166.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="125" y="225" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">上限 0</text>
<text x="250" y="225" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">上限 1</text>
<text x="375" y="225" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">上限 2</text>
<text x="500" y="225" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">上限 3</text>
<text x="625" y="225" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">上限 4</text>
<text x="65" y="290" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">倒序：最大价值 3</text>
<text x="65" y="335" fill="#bc3645" font-size="23" text-anchor="start" font-weight="normal">正序会把同株重复加入，错误得到 6</text>
</g></svg>
