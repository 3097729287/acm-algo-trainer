<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title"><title id="title">两台机器人连续工作三秒，收八枚、花三枚</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">两台机器人连续工作三秒，收八枚、花三枚</text>
<text x="35" y="117" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">秒数</text>
<rect x="220" y="85" width="152" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="296.0" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="375" y="85" width="152" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="451.0" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="530" y="85" width="152" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="606.0" y="116.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="35" y="212" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">经过道路</text>
<rect x="220" y="180" width="152" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="296.0" y="211.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="375" y="180" width="152" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="451.0" y="211.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="530" y="180" width="152" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="606.0" y="211.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="35" y="307" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">收集金币</text>
<rect x="220" y="275" width="152" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="296.0" y="306.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="375" y="275" width="152" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="451.0" y="306.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="530" y="275" width="152" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="606.0" y="306.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="35" y="402" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">本秒购价</text>
<rect x="220" y="370" width="152" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="296.0" y="401.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="375" y="370" width="152" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="451.0" y="401.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="530" y="370" width="152" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="606.0" y="401.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<text x="65" y="460" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">前两秒第一台，末秒新买第二台；净收益 1+3+4−1−2=5</text>
</g></svg>
