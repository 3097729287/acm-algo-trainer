<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title"><title id="title">三个残留字符都指向同一次 boy 写入</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">三个残留字符都指向同一次 boy 写入</text>
<rect x="180" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="238.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">b</text>
<rect x="300" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="358.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">o</text>
<rect x="420" y="95" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="478.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">y</text>
<text x="240" y="80" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">0</text>
<line x1="240" y1="150" x2="240" y2="220" stroke="#2365ab" stroke-width="3"/>
<text x="360" y="80" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">1</text>
<line x1="360" y1="150" x2="240" y2="220" stroke="#2365ab" stroke-width="3"/>
<text x="480" y="80" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">2</text>
<line x1="480" y1="150" x2="240" y2="220" stroke="#2365ab" stroke-width="3"/>
<rect x="130" y="220" width="220" height="55" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="240.0" y="254.5" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">起点 0：只计一次</text>
</g></svg>
