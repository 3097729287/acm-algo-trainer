<text x="375" y="125" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">选中间一行三个格子</text>
<text x="375" y="190" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">覆盖次数和 2+4+2=8</text>
<text x="375" y="255" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">四种网位置，期望 8/4=2</text>
<text x="55" y="365" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">每个数字都由枚举四个二乘二窗口得到</text>
