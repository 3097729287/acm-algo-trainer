<svg xmlns="http://www.w3.org/2000/svg" width="760" height="335" viewBox="0 0 760 335" role="img" aria-labelledby="title"><title id="title">Alice 留出非零 5，把其余含零子集合并</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">Alice 留出非零 5，把其余含零子集合并</text>
<rect x="205" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="258.5" y="111.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="315" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="368.5" y="111.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<rect x="425" y="80" width="107" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="478.5" y="111.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="35" y="165" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">合并两个零，mex=1；5 留在外面</text>
<rect x="260" y="195" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="313.5" y="226.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="370" y="195" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="423.5" y="226.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="35" y="310" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">Bob 只能合并 [1,5]，mex=0，终局 Alice 获胜</text>
</g></svg>
