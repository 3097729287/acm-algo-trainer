<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title"><title id="title">随机前沿的候选等概率，合法完整序列未必等概率</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">随机前沿的候选等概率，合法完整序列未必等概率</text>
<line x1="380" y1="100" x2="210" y2="250" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="100" x2="550" y2="250" stroke="#68778b" stroke-width="4"/>
<circle cx="380" cy="100" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="210" cy="250" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="210" y="257" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="550" cy="250" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="550" y="257" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="55" y="330" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">根为 1：顺序 123 或 132，逆序期望 1/2</text>
<text x="55" y="385" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">根为 2：213，逆序 1；根为 3：312，逆序 2</text>
<text x="55" y="445" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">三种初始根等概率：总期望 (1/2+1+2)/3=7/6</text>
</g></svg>
