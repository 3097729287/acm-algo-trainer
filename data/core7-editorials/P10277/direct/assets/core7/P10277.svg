<svg xmlns="http://www.w3.org/2000/svg" width="760" height="475" viewBox="0 0 760 475" role="img" aria-labelledby="title"><title id="title">反向追到初场结束时刻3与1，对应可能农夫1与2</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">反向追到初场结束时刻3与1，对应可能农夫1与2</text>
<circle cx="150" cy="185" r="28" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="150" y="192" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="360" cy="185" r="28" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="360" y="192" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="620" cy="105" r="28" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="620" y="112" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<circle cx="620" cy="285" r="28" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="620" y="292" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">9</text>
<circle cx="360" cy="370" r="34" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="360" y="377" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">4159</text>
<line x1="180" y1="185" x2="330" y2="185" stroke="#12805c" stroke-width="3"/>
<text x="250" y="155" fill="#12805c" font-size="23" text-anchor="middle" font-weight="normal">1→3</text>
<line x1="385" y1="175" x2="595" y2="115" stroke="#12805c" stroke-width="3"/>
<text x="490" y="100" fill="#12805c" font-size="23" text-anchor="middle" font-weight="normal">3→8</text>
<line x1="385" y1="195" x2="595" y2="275" stroke="#68778b" stroke-width="3"/>
<text x="500" y="265" fill="#68778b" font-size="23" text-anchor="middle" font-weight="normal">3→9</text>
<text x="60" y="265" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">农夫2初场结束1</text>
<text x="250" y="300" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">农夫1初场结束3</text>
<text x="45" y="450" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">原样例 T=8；初场结束 3、1、4159，输出 110</text>
</g></svg>
