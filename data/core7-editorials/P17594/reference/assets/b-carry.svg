<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img"><title>当前看起来较大的加法，可能避免后续增量</title><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#172554"><text x="24" y="32" font-size="21" font-weight="bold">当前看起来较大的加法，可能避免后续增量</text><text x="28.0" y="68" font-size="17" >初始 x = 3，y = 1</text><rect x="28.0" y="116" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="52.0" y="146" text-anchor="middle">3</text><rect x="76.0" y="116" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="100.0" y="146" text-anchor="middle">1</text><rect x="28.0" y="164" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="52.0" y="194" text-anchor="middle">x</text><rect x="76.0" y="164" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="100.0" y="194" text-anchor="middle">y</text><text x="268.0" y="68" font-size="17" >先对低位加 1，再对高位取</text><text x="268.0" y="92" font-size="17" >或</text><rect x="268.0" y="116" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="292.0" y="146" text-anchor="middle">2</text><rect x="316.0" y="116" width="48" height="48" fill="#bfdbfe" stroke="#94a3b8"/><text x="340.0" y="146" text-anchor="middle">2</text><rect x="268.0" y="164" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="292.0" y="194" text-anchor="middle">加</text><rect x="316.0" y="164" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="340.0" y="194" text-anchor="middle">或</text><text x="508.0" y="68" font-size="17" >两步都取或</text><rect x="508.0" y="116" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="532.0" y="146" text-anchor="middle">1</text><rect x="556.0" y="116" width="48" height="48" fill="#bfdbfe" stroke="#94a3b8"/><text x="580.0" y="146" text-anchor="middle">3</text><rect x="508.0" y="164" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="532.0" y="194" text-anchor="middle">或</text><rect x="556.0" y="164" width="48" height="48" fill="#ffffff" stroke="#94a3b8"/><text x="580.0" y="194" text-anchor="middle">或</text><text x="24" y="244" font-size="17" >低位选加法暂时得到 2，但最终可保持 2；两次取或反而得到 3。</text></g></svg>