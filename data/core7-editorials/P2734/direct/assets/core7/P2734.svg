<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">眼前选八会输，先取七能拿二十二分</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">眼前选八会输，先取七能拿二十二分</text>
<rect x="75" y="100" width="147" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="148.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<rect x="225" y="100" width="147" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="298.5" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">15</text>
<rect x="375" y="100" width="147" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="448.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="525" y="100" width="147" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="598.5" y="131.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">7</text>
<text x="65" y="235" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">先取 7：最终先手 22，后手 11</text>
<text x="65" y="295" fill="#bc3645" font-size="24" text-anchor="start" font-weight="normal">先取 8：最佳也只有 15，对手得到 18</text>
<text x="65" y="345" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">两条路线的总分都为 33，比较的是各自最终所得</text>
</g></svg>
