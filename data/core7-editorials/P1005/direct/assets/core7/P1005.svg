<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title"><title id="title">剩余越少，当前轮次越晚，倍数反而越大</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">剩余越少，当前轮次越晚，倍数反而越大</text>
<rect x="70" y="95" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="123.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="180" y="95" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="233.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="290" y="95" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="343.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="450" y="127" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">第 1 轮：1×2=2</text>
<rect x="70" y="190" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="123.5" y="221.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">·</text>
<rect x="180" y="190" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="233.5" y="221.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="290" y="190" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="343.5" y="221.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="450" y="222" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">第 2 轮：2×4=8</text>
<rect x="70" y="285" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="123.5" y="316.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">·</text>
<rect x="180" y="285" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="233.5" y="316.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">·</text>
<rect x="290" y="285" width="107" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="343.5" y="316.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="450" y="317" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">第 3 轮：3×8=24</text>
<text x="65" y="380" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">按左、左、唯一数取：总分 34；两端取法需要比较</text>
</g></svg>
