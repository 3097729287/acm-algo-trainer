<rect x="487" y="100" width="79" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="526.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="569" y="100" width="79" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="608.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">9</text>
<rect x="651" y="100" width="79" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="690.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">7</text>
