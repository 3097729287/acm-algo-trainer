<text x="200.0" y="278.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">第一队：能力 4</text>
<rect x="465" y="245" width="210" height="52" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="570.0" y="278.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">第五队：能力 10</text>
<line x1="200" y1="298" x2="385" y2="350" stroke="#bc3645" stroke-width="3"/>
<line x1="570" y1="298" x2="385" y2="350" stroke="#12805c" stroke-width="3"/>
<text x="385" y="380" fill="#12805c" font-size="25" text-anchor="middle" font-weight="normal">冠军 5；亚军 1</text>
<text x="95" y="417" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">全体次大能力 9 在第五队同半区，进不了决赛</text>
