<text x="238.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="281" y="100" width="79" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="320.5" y="131.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
