<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">第一次放首与放尾不同，即使结果同为一个 a</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">第一次放首与放尾不同，即使结果同为一个 a</text>
<line x1="380" y1="90" x2="200" y2="225" stroke="#2365ab" stroke-width="4"/>
<line x1="380" y1="90" x2="560" y2="225" stroke="#12805c" stroke-width="4"/>
<circle cx="380" cy="90" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="380" y="97" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">空</text>
<circle cx="200" cy="225" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="200" y="232" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<circle cx="560" cy="225" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="560" y="232" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<text x="175" y="145" fill="#2365ab" font-size="23" text-anchor="middle" font-weight="normal">放首</text>
<text x="585" y="145" fill="#12805c" font-size="23" text-anchor="middle" font-weight="normal">放尾</text>
<text x="65" y="325" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">S=a、T=a，答案为 2，不能按不同结果字符串去重</text>
</g></svg>
