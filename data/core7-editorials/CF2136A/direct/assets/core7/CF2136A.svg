<svg xmlns="http://www.w3.org/2000/svg" width="760" height="295" viewBox="0 0 760 295" role="img" aria-labelledby="title"><title id="title">少方一个 A 隔出两个空隙，每隙最多两个 B</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">少方一个 A 隔出两个空隙，每隙最多两个 B</text>
<circle cx="165" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="165" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<circle cx="265" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="265" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<circle cx="365" cy="135" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="365" y="142" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">A</text>
<circle cx="465" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="465" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<circle cx="565" cy="135" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="565" y="142" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<line x1="140" y1="205" x2="290" y2="205" stroke="#2365ab" stroke-width="6"/>
<line x1="440" y1="205" x2="590" y2="205" stroke="#2365ab" stroke-width="6"/>
<text x="215" y="250" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">左隙：最多 2 球</text>
<text x="515" y="250" fill="#2365ab" font-size="20" text-anchor="middle" font-weight="normal">右隙：最多 2 球</text>
</g></svg>
