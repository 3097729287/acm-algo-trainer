<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title"><title id="title">父结点加三后检查边：换算成初始 x 区间</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">父结点加三后检查边：换算成初始 x 区间</text>
<circle cx="380" cy="100" r="30" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="107" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">+3</text>
<circle cx="190" cy="245" r="30" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="190" y="252" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">−2</text>
<circle cx="570" cy="245" r="30" fill="#fff" stroke="#bc3645" stroke-width="3"/>
<text x="570" y="252" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">+1</text>
<line x1="355" y1="125" x2="215" y2="220" stroke="#2365ab" stroke-width="3"/>
<line x1="405" y1="125" x2="545" y2="220" stroke="#2365ab" stroke-width="3"/>
<text x="150" y="155" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">边 [4,7]</text>
<text x="480" y="155" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">边 [5,8]</text>
<rect x="70" y="330" width="290" height="65" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="215.0" y="369.5" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">子2：初始 x ∈ [1,4]</text>
<rect x="400" y="330" width="290" height="65" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="545.0" y="369.5" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">子3：初始 x ∈ [2,5]</text>
<text x="45" y="460" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">查询 x=4：根与两个子结点都可作终点，共三个</text>
</g></svg>
