<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title"><title id="title">2 至 12 的六个圆数，零数均不小于一数</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">2 至 12 的六个圆数，零数均不小于一数</text>
<text x="100" y="85" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">十进制</text>
<text x="300" y="85" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">二进制</text>
<text x="500" y="85" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">零数</text>
<text x="655" y="85" fill="#243449" font-size="22" text-anchor="middle" font-weight="normal">一数</text>
<text x="100" y="150" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">2</text>
<text x="300" y="150" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">10</text>
<text x="500" y="150" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">1</text>
<text x="655" y="150" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">1</text>
<text x="100" y="210" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">4</text>
<text x="300" y="210" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">100</text>
<text x="500" y="210" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">2</text>
<text x="655" y="210" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">1</text>
<text x="100" y="270" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">8</text>
<text x="300" y="270" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">1000</text>
<text x="500" y="270" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">3</text>
<text x="655" y="270" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">1</text>
<text x="100" y="330" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">9</text>
<text x="300" y="330" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">1001</text>
<text x="500" y="330" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">2</text>
<text x="655" y="330" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">2</text>
<text x="100" y="390" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">10</text>
<text x="300" y="390" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">1010</text>
<text x="500" y="390" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">2</text>
<text x="655" y="390" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">2</text>
<text x="100" y="450" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">12</text>
<text x="300" y="450" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">1100</text>
<text x="500" y="450" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">2</text>
<text x="655" y="450" fill="#12805c" font-size="24" text-anchor="middle" font-weight="normal">2</text>
<text x="45" y="545" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">真实首位为 1，它前面的占位零不参与计数</text>
</g></svg>
