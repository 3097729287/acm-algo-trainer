<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">aaa 最多用两次：重叠一格比重叠两格更长</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">aaa 最多用两次：重叠一格比重叠两格更长</text>
<text x="40" y="115" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">原词</text>
<rect x="200" y="80" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="243.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<rect x="290" y="80" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="333.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<rect x="380" y="80" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="423.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<text x="40" y="210" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">下一词</text>
<rect x="380" y="175" width="87" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="423.5" y="206.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<rect x="470" y="175" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="513.5" y="206.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<rect x="560" y="175" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="603.5" y="206.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">a</text>
<line x1="425" y1="137" x2="425" y2="170" stroke="#12805c" stroke-width="4"/>
<text x="45" y="275" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">共用第三格的 a，实际结果为 aaaaa，长度五</text>
<text x="45" y="325" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">若共用两格，只得 aaaa；末词与使用次数却完全相同</text>
</g></svg>
