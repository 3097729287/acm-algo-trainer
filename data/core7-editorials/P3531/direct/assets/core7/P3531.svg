<rect x="320" y="85" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="378.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">B</text>
<rect x="440" y="85" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="498.5" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">A</text>
