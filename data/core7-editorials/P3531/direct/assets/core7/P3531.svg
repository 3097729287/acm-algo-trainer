<text x="258.5" y="231.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="320" y="200" width="117" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
