<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title"><title id="title">删去无宝叶子后，检查剩下的树是否分叉</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">删去无宝叶子后，检查剩下的树是否分叉</text>
<line x1="205" y1="185" x2="110" y2="285" stroke="#68778b" stroke-width="4"/>
<line x1="205" y1="185" x2="300" y2="285" stroke="#68778b" stroke-width="4"/>
<line x1="205" y1="185" x2="205" y2="85" stroke="#68778b" stroke-width="4"/>
<circle cx="205" cy="185" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="205" y="192" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="110" cy="285" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="110" y="292" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="300" cy="285" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="300" y="292" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="205" cy="85" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="205" y="92" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<line x1="565" y1="185" x2="470" y2="285" stroke="#68778b" stroke-width="4"/>
<line x1="565" y1="185" x2="660" y2="285" stroke="#68778b" stroke-width="4"/>
<line x1="565" y1="185" x2="565" y2="85" stroke="#68778b" stroke-width="4" stroke-dasharray="7 5"/>
<circle cx="565" cy="185" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="565" y="192" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="470" cy="285" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="470" y="292" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="660" cy="285" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="660" y="292" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="565" cy="85" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="565" y="92" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="205" y="350" fill="#bc3645" font-size="22" text-anchor="middle" font-weight="normal">三个分支有宝：No</text>
<text x="565" y="350" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">剪掉 4，走 2→1→3：Yes</text>
<text x="45" y="420" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">绿色有宝，灰色无宝；不能为了第三个分支重复经过边</text>
</g></svg>
