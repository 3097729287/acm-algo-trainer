<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" role="img" aria-labelledby="title"><title id="title">白珠等遇到真颜色后再定色，两端不能重复拿</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">白珠等遇到真颜色后再定色，两端不能重复拿</text>
<text x="55" y="95" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">原圈顺序：r r w w b b r b；剪在第 4 与第 5 颗之间</text>
<rect x="55" y="145" width="79" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="94.5" y="176.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">b</text>
<rect x="137" y="145" width="79" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="176.5" y="176.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">b</text>
<rect x="219" y="145" width="79" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="258.5" y="176.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">r</text>
<rect x="301" y="145" width="79" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="340.5" y="176.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">b</text>
<rect x="383" y="145" width="79" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="422.5" y="176.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">r</text>
<rect x="465" y="145" width="79" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="504.5" y="176.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">r</text>
<rect x="547" y="145" width="79" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="586.5" y="176.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">w</text>
<rect x="629" y="145" width="79" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="668.5" y="176.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">w</text>
<text x="65" y="245" fill="#2365ab" font-size="22" text-anchor="start" font-weight="normal">左端取 2 颗蓝</text>
<text x="390" y="245" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">右端取 4 颗红，白珠当红</text>
<text x="65" y="315" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">共 6 颗；中间 r、b 两颗未取，整圈总数仍为 8</text>
</g></svg>
