<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title"><title id="title">低价的两个端点可以共同覆盖中间点</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">低价的两个端点可以共同覆盖中间点</text>
<line x1="150" y1="170" x2="380" y2="170" stroke="#68778b" stroke-width="4"/>
<line x1="380" y1="170" x2="610" y2="170" stroke="#68778b" stroke-width="4"/>
<circle cx="150" cy="170" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="150" y="177" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="380" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="380" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="610" cy="170" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="610" y="177" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="150" y="240" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">费用 1</text>
<text x="380" y="240" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">费用 100</text>
<text x="610" y="240" fill="#243449" font-size="23" text-anchor="middle" font-weight="normal">费用 1</text>
<text x="60" y="320" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">设岗 {1,3}：总费 2；只设中点：总费 100</text>
<text x="60" y="380" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">未设岗点 2 被两个岗覆盖也合法，要求至少一次</text>
</g></svg>
