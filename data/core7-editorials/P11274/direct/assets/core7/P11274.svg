<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title"><title id="title">被删除的负分格子也要写进选择过程</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">被删除的负分格子也要写进选择过程</text>
<rect x="185" y="95" width="147" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="258.5" y="126.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">-9</text>
<rect x="335" y="95" width="147" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="408.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="55" y="185" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">先选 1、2</text>
<text x="550" y="130" fill="#68778b" font-size="21" text-anchor="start" font-weight="normal">队首在左</text>
<rect x="110" y="235" width="172" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="196.0" y="266.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">-9</text>
<rect x="285" y="235" width="172" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="371.0" y="266.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="460" y="235" width="172" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="546.0" y="266.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">6</text>
<line x1="130" y1="250" x2="265" y2="295" stroke="#bc3645" stroke-width="4"/>
<line x1="130" y1="295" x2="265" y2="250" stroke="#bc3645" stroke-width="4"/>
<text x="65" y="360" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">再选 3，先删一个旧格子：最终留下 5、6，得 11</text>
<text x="65" y="415" fill="#bc3645" font-size="23" text-anchor="start" font-weight="normal">若只输出 2、3，会把 5 删掉，只剩 6 分</text>
</g></svg>
