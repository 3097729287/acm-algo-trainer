<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title"><title id="title">二分返回边界位置；边界前的格子数是数量</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">二分返回边界位置；边界前的格子数是数量</text>
<rect x="115" y="105" width="89" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="159.5" y="136.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="207" y="105" width="89" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="251.5" y="136.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="299" y="105" width="89" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="343.5" y="136.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="391" y="105" width="89" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="435.5" y="136.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="483" y="105" width="89" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="527.5" y="136.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="575" y="105" width="89" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="619.5" y="136.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">8</text>
<text x="115" y="88" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">0</text>
<text x="207" y="88" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">1</text>
<text x="299" y="88" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">2</text>
<text x="391" y="88" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">3</text>
<text x="483" y="88" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">4</text>
<text x="575" y="88" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">5</text>
<text x="667" y="88" fill="#68778b" font-size="18" text-anchor="middle" font-weight="normal">6</text>
<text x="690" y="137" fill="#68778b" font-size="18" text-anchor="start" font-weight="normal">end</text>
<line x1="207" y1="155" x2="207" y2="210" stroke="#12805c" stroke-width="3"/>
<text x="207" y="240" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">lower_bound(2) = 1</text>
<line x1="483" y1="155" x2="483" y2="210" stroke="#bc3645" stroke-width="3"/>
<text x="483" y="240" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">upper_bound(2) = 4</text>
<text x="35" y="284" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">&lt; 2：1 个      ≤ 2：4 个      = 2：4 − 1 = 3 个</text>
</g></svg>
