<svg xmlns="http://www.w3.org/2000/svg" width="760" height="435" viewBox="0 0 760 435" role="img" aria-labelledby="title"><title id="title">逆序上限一：贪心正好分成两段</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">逆序上限一：贪心正好分成两段</text>
<rect x="120" y="95" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="188.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="260" y="95" width="137" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="328.5" y="126.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="400" y="95" width="137" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="468.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="540" y="95" width="137" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="608.5" y="126.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<line x1="397" y1="85" x2="397" y2="200" stroke="#bc3645" stroke-width="4"/>
<text x="45" y="260" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">[3,1] 一对；再加 2 会变两对，在 2 前切开</text>
<text x="45" y="325" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">新段 [2,0] 一对；共两段，limit=1 可行</text>
<text x="45" y="395" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">limit=0 需 [3]、[1,2]、[0] 三段，不可行</text>
</g></svg>
