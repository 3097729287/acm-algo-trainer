<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title"><title id="title">长度上限四：三与四可建，五的斜边禁止</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">长度上限四：三与四可建，五的斜边禁止</text>
<line x1="110" y1="320" x2="290" y2="320" stroke="#12805c" stroke-width="4"/>
<rect x="188.0" y="330.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="200.0" y="352.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">3</text>
<line x1="290" y1="320" x2="290" y2="80" stroke="#12805c" stroke-width="4"/>
<rect x="278.0" y="178.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="290.0" y="200.0" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">4</text>
<line x1="110" y1="320" x2="290" y2="80" stroke="#bc3645" stroke-width="4" stroke-dasharray="7 5"/>
<rect x="188.0" y="166.0" width="24" height="28" rx="3" fill="#fff"/>
<text x="200.0" y="188.0" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">5</text>
<circle cx="110" cy="320" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="110" y="327" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="290" cy="80" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="290" y="87" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="290" cy="320" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="290" y="327" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="400" y="110" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">一号 (0,0)</text>
<text x="400" y="160" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">二号 (3,4)</text>
<text x="400" y="210" fill="#243449" font-size="20" text-anchor="start" font-weight="normal">三号 (3,0)</text>
<text x="400" y="275" fill="#12805c" font-size="23" text-anchor="start" font-weight="normal">总长 7.00</text>
<text x="55" y="385" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">等于上限的边可以用；比较时用整数平方</text>
</g></svg>
