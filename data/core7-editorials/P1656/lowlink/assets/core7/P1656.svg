<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title"><title id="title">三角形里能绕行，连向四号的边却无替代通路</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">三角形里能绕行，连向四号的边却无替代通路</text>
<line x1="120" y1="170" x2="290" y2="95" stroke="#2365ab" stroke-width="4"/>
<line x1="290" y1="95" x2="290" y2="245" stroke="#2365ab" stroke-width="4"/>
<line x1="290" y1="245" x2="120" y2="170" stroke="#2365ab" stroke-width="4"/>
<line x1="290" y1="245" x2="610" y2="245" stroke="#bc3645" stroke-width="4"/>
<circle cx="120" cy="170" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="120" y="177" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="290" cy="95" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="290" y="102" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="290" cy="245" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="290" y="252" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="610" cy="245" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="610" y="252" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="447" y="220" fill="#bc3645" font-size="22" text-anchor="middle" font-weight="normal">唯一桥：3−4</text>
<text x="45" y="330" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">删三角形任一边仍连通；删红边后四号独立成块</text>
</g></svg>
