<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title"><title id="title">枢轴 3 的三路划分：只继续包含 k=1 的左段</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">枢轴 3 的三路划分：只继续包含 k=1 的左段</text>
<text x="35" y="110" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">划分前</text>
<rect x="220" y="80" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="263.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<rect x="310" y="80" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="353.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="400" y="80" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="443.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="490" y="80" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="533.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="580" y="80" width="87" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="623.5" y="111.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<text x="35" y="235" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">划分后</text>
<rect x="220" y="205" width="87" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="263.5" y="236.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="310" y="205" width="87" height="48" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="353.5" y="236.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="400" y="205" width="87" height="48" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="443.5" y="236.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<rect x="490" y="205" width="87" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="533.5" y="236.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">5</text>
<rect x="580" y="205" width="87" height="48" rx="7" fill="#edf5ff" stroke="#68778b" stroke-width="2"/>
<text x="623.5" y="236.0" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="305" y="190" fill="#12805c" font-size="20" text-anchor="middle" font-weight="normal">小于 3</text>
<text x="440" y="190" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">等于 3</text>
<text x="575" y="190" fill="#68778b" font-size="20" text-anchor="middle" font-weight="normal">大于 3</text>
<text x="45" y="315" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">零基下标 k=1 在左段；右段 5、4 此时无需排好</text>
</g></svg>
