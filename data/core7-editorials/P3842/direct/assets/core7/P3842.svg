<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title"><title id="title">每行的蓝段必须覆盖，绿色路线允许先走到另一端</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">每行的蓝段必须覆盖，绿色路线允许先走到另一端</text>
<line x1="140" y1="115" x2="260" y2="115" stroke="#68778b" stroke-width="1"/>
<line x1="260" y1="115" x2="380" y2="115" stroke="#68778b" stroke-width="1"/>
<line x1="140" y1="235" x2="260" y2="235" stroke="#68778b" stroke-width="1"/>
<line x1="260" y1="235" x2="380" y2="235" stroke="#68778b" stroke-width="1"/>
<line x1="140" y1="355" x2="260" y2="355" stroke="#68778b" stroke-width="1"/>
<line x1="260" y1="355" x2="380" y2="355" stroke="#68778b" stroke-width="1"/>
<line x1="140" y1="115" x2="140" y2="235" stroke="#68778b" stroke-width="1"/>
<line x1="140" y1="235" x2="140" y2="355" stroke="#68778b" stroke-width="1"/>
<line x1="260" y1="115" x2="260" y2="235" stroke="#68778b" stroke-width="1"/>
<line x1="260" y1="235" x2="260" y2="355" stroke="#68778b" stroke-width="1"/>
<line x1="380" y1="115" x2="380" y2="235" stroke="#68778b" stroke-width="1"/>
<line x1="380" y1="235" x2="380" y2="355" stroke="#68778b" stroke-width="1"/>
<line x1="140" y1="115" x2="380" y2="115" stroke="#2365ab" stroke-width="12"/>
<line x1="140" y1="235" x2="260" y2="235" stroke="#2365ab" stroke-width="12"/>
<line x1="260" y1="355" x2="380" y2="355" stroke="#2365ab" stroke-width="12"/>
<line x1="140" y1="115" x2="260" y2="115" stroke="#12805c" stroke-width="4"/>
<line x1="260" y1="115" x2="380" y2="115" stroke="#12805c" stroke-width="4"/>
<line x1="380" y1="115" x2="380" y2="235" stroke="#12805c" stroke-width="4"/>
<line x1="380" y1="235" x2="260" y2="235" stroke="#12805c" stroke-width="4"/>
<line x1="260" y1="235" x2="140" y2="235" stroke="#12805c" stroke-width="4"/>
<line x1="140" y1="235" x2="140" y2="355" stroke="#12805c" stroke-width="4"/>
<line x1="140" y1="355" x2="260" y2="355" stroke="#12805c" stroke-width="4"/>
<line x1="260" y1="355" x2="380" y2="355" stroke="#12805c" stroke-width="4"/>
<circle cx="140" cy="115" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="140" y="122" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">S</text>
<circle cx="380" cy="355" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="380" y="362" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">T</text>
<text x="525" y="160" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">三行段：</text>
<text x="525" y="215" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">[1,3]、[1,2]</text>
<text x="525" y="270" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">以及 [2,3]</text>
<text x="525" y="340" fill="#12805c" font-size="24" text-anchor="start" font-weight="normal">总共走 8 步</text>
<text x="55" y="445" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">横走 2+2+2，下降 2；终点不是“最后一段走完”就结束</text>
</g></svg>
