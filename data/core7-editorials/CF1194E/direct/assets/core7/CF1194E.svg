<svg xmlns="http://www.w3.org/2000/svg" width="760" height="535" viewBox="0 0 760 535" role="img" aria-labelledby="title"><title id="title">上下横线高度零与三：仅三条竖线贯穿</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">上下横线高度零与三：仅三条竖线贯穿</text>
<line x1="100" y1="130" x2="690" y2="130" stroke="#2365ab" stroke-width="6"/>
<line x1="100" y1="395" x2="690" y2="395" stroke="#2365ab" stroke-width="6"/>
<line x1="200" y1="130" x2="200" y2="395" stroke="#12805c" stroke-width="5"/>
<line x1="360" y1="130" x2="360" y2="395" stroke="#12805c" stroke-width="5"/>
<line x1="520" y1="130" x2="520" y2="395" stroke="#12805c" stroke-width="5"/>
<line x1="650" y1="220" x2="650" y2="395" stroke="#68778b" stroke-width="5"/>
<text x="45" y="140" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">3</text>
<text x="45" y="405" fill="#2365ab" font-size="23" text-anchor="start" font-weight="normal">0</text>
<text x="195" y="435" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">1</text>
<text x="355" y="435" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">3</text>
<text x="515" y="435" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">5</text>
<text x="645" y="435" fill="#68778b" font-size="21" text-anchor="start" font-weight="normal">6</text>
<text x="45" y="485" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">x=6 的短竖线上端为2，升到上边3前已被删除</text>
<text x="45" y="525" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">留下 x=1、3、5，任选两条，共 3 选 2 = 3 个矩形</text>
</g></svg>
