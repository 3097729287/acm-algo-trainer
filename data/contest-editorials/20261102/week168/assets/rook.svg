<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-label="被标记为“已保证不喝奶”的配对，不能重复朋友或菜"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="340" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">被标记为“已保证不喝奶”的配对，不能重复朋友或菜</text><text x="280" y="80" font-size="17" text-anchor="middle" fill="#1c324a">菜 1</text><text x="360" y="80" font-size="17" text-anchor="middle" fill="#1c324a">菜 2</text><text x="440" y="80" font-size="17" text-anchor="middle" fill="#1c324a">菜 3</text><text x="45" y="125" font-size="18" text-anchor="start" fill="#1c324a">朋友 1：a = 1</text><rect x="245" y="95" width="68" height="46" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="279.0" y="125.0" font-size="18" text-anchor="middle" fill="#1c324a">可选</text><rect x="325" y="95" width="68" height="46" rx="7" fill="#f5e1df" stroke="#6b89a4"/><text x="359.0" y="125.0" font-size="18" text-anchor="middle" fill="#1c324a">超辣</text><rect x="405" y="95" width="68" height="46" rx="7" fill="#f5e1df" stroke="#6b89a4"/><text x="439.0" y="125.0" font-size="18" text-anchor="middle" fill="#1c324a">超辣</text><text x="45" y="187" font-size="18" text-anchor="start" fill="#1c324a">朋友 2：a = 1</text><rect x="245" y="157" width="68" height="46" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="279.0" y="187.0" font-size="18" text-anchor="middle" fill="#1c324a">可选</text><rect x="325" y="157" width="68" height="46" rx="7" fill="#f5e1df" stroke="#6b89a4"/><text x="359.0" y="187.0" font-size="18" text-anchor="middle" fill="#1c324a">超辣</text><rect x="405" y="157" width="68" height="46" rx="7" fill="#f5e1df" stroke="#6b89a4"/><text x="439.0" y="187.0" font-size="18" text-anchor="middle" fill="#1c324a">超辣</text><text x="45" y="249" font-size="18" text-anchor="start" fill="#1c324a">朋友 3：a = 3</text><rect x="245" y="219" width="68" height="46" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="279.0" y="249.0" font-size="18" text-anchor="middle" fill="#1c324a">可选</text><rect x="325" y="219" width="68" height="46" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="359.0" y="249.0" font-size="18" text-anchor="middle" fill="#1c324a">可选</text><rect x="405" y="219" width="68" height="46" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="439.0" y="249.0" font-size="18" text-anchor="middle" fill="#1c324a">可选</text><text x="535" y="113" font-size="18" text-anchor="start" fill="#1c324a">按 a 从小到大处理</text><text x="535" y="163" font-size="18" text-anchor="start" fill="#1c324a">之前已选 j−1 道菜，全部 ≤ 当前 a</text><text x="535" y="213" font-size="18" text-anchor="start" fill="#1c324a">当前朋友可选 a−(j−1) 道安全菜</text><text x="45" y="307" font-size="18" text-anchor="start" fill="#1c324a">示例 a = (1,1,3)：R₁ = 5，R₂ = 4，R₃ = 0，答案 2×5 − 2×4 = 2</text></g></svg>
