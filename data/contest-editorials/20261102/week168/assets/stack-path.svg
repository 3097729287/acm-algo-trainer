<svg xmlns="http://www.w3.org/2000/svg" width="920" height="290" viewBox="0 0 920 290" role="img" aria-label="取物顺序 A₁ → B₁ → A₂ → A₃，恰好四件，总价值 17"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="290" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">取物顺序 A₁ → B₁ → A₂ → A₃，恰好四件，总价值 17</text><rect x="25" y="84" width="195" height="65" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="122.5" y="123.5" font-size="18" text-anchor="middle" fill="#1c324a">A₁：8 / 标记1</text><text x="123" y="181" font-size="18" text-anchor="middle" fill="#1c324a">(1,0,A)</text><line x1="224" y1="115" x2="246" y2="115" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="250" y="84" width="195" height="65" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="347.5" y="123.5" font-size="18" text-anchor="middle" fill="#1c324a">B₁：5 / 标记1</text><text x="348" y="181" font-size="18" text-anchor="middle" fill="#1c324a">(1,1,B)</text><line x1="449" y1="115" x2="471" y2="115" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="475" y="84" width="195" height="65" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="572.5" y="123.5" font-size="18" text-anchor="middle" fill="#1c324a">A₂：−3 / 标记0</text><text x="573" y="181" font-size="18" text-anchor="middle" fill="#1c324a">(2,1,A)</text><line x1="674" y1="115" x2="696" y2="115" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="700" y="84" width="195" height="65" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="797.5" y="123.5" font-size="18" text-anchor="middle" fill="#1c324a">A₃：7 / 标记1</text><text x="798" y="181" font-size="18" text-anchor="middle" fill="#1c324a">(3,1,A)</text><text x="35" y="225" font-size="18" text-anchor="start" fill="#1c324a">A₁ 的标记1：先换到 B。A₂ 的标记0：可以继续取 A₃。</text><text x="35" y="264" font-size="18" text-anchor="start" fill="#1c324a">最后的 A₃ 即使标记为1，也不要求再取第五件。</text></g></svg>
