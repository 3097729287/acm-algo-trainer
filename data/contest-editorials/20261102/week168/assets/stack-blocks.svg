<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-label="前缀内的标记1必须用另一堆隔开；标记0可以额外切段"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="330" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">前缀内的标记1必须用另一堆隔开；标记0可以额外切段</text><text x="30" y="83" font-size="18" text-anchor="start" fill="#1c324a">A 前三件：</text><rect x="180" y="55" width="160" height="55" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="260.0" y="89.5" font-size="18" text-anchor="middle" fill="#1c324a">8 / 标记1</text><rect x="380" y="55" width="160" height="55" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="460.0" y="89.5" font-size="18" text-anchor="middle" fill="#1c324a">−3 / 标记0</text><rect x="550" y="55" width="160" height="55" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="630.0" y="89.5" font-size="18" text-anchor="middle" fill="#1c324a">7 / 标记1</text><line x1="359" y1="53" x2="359" y2="115" stroke="#c14e48" stroke-width="2.4" stroke-dasharray="6 5"/><text x="30" y="160" font-size="18" text-anchor="start" fill="#1c324a">最少两段：</text><rect x="180" y="130" width="160" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="260.0" y="163.0" font-size="18" text-anchor="middle" fill="#1c324a">[ A₁ ]</text><rect x="380" y="130" width="330" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="545.0" y="163.0" font-size="18" text-anchor="middle" fill="#1c324a">[ A₂, A₃ ]</text><text x="30" y="235" font-size="18" text-anchor="start" fill="#1c324a">插入 B₁：</text><rect x="180" y="205" width="160" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="260.0" y="238.0" font-size="18" text-anchor="middle" fill="#1c324a">[ A₁ ]</text><rect x="380" y="205" width="130" height="52" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="445.0" y="238.0" font-size="18" text-anchor="middle" fill="#1c324a">[ B₁ ]</text><rect x="550" y="205" width="330" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="715.0" y="238.0" font-size="18" text-anchor="middle" fill="#1c324a">[ A₂, A₃ ]</text><text x="30" y="302" font-size="18" text-anchor="start" fill="#1c324a">A 内部一次强制切段 ≤ B 的一件；若 B 一件也不取，就无法隔开。</text></g></svg>
