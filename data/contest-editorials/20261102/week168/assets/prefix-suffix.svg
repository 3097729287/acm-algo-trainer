<svg xmlns="http://www.w3.org/2000/svg" width="920" height="270" viewBox="0 0 920 270" role="img" aria-label="两个和都包含当前位置 i；先求后缀，再更新前缀"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="270" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">两个和都包含当前位置 i；先求后缀，再更新前缀</text><rect x="130" y="80" width="100" height="52" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="180.0" y="113.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><rect x="250" y="80" width="100" height="52" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="300.0" y="113.0" font-size="18" text-anchor="middle" fill="#1c324a">-1</text><rect x="370" y="80" width="100" height="52" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="420.0" y="113.0" font-size="18" text-anchor="middle" fill="#1c324a">5</text><rect x="490" y="80" width="100" height="52" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="540.0" y="113.0" font-size="18" text-anchor="middle" fill="#1c324a">3</text><rect x="610" y="80" width="100" height="52" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="660.0" y="113.0" font-size="18" text-anchor="middle" fill="#1c324a">4</text><text x="420" y="66" font-size="18" text-anchor="middle" fill="#1c324a">i = 3</text><line x1="135" y1="167" x2="470" y2="167" stroke="#476782" stroke-width="2.4"/><text x="300" y="194" font-size="18" text-anchor="middle" fill="#1c324a">前缀 P = 2 − 1 + 5 = 6</text><line x1="375" y1="221" x2="710" y2="221" stroke="#476782" stroke-width="2.4"/><text x="550" y="248" font-size="18" text-anchor="middle" fill="#1c324a">后缀 S = 5 + 3 + 4 = 12</text><text x="755" y="103" font-size="18" text-anchor="start" fill="#1c324a">总和 13</text><text x="755" y="135" font-size="18" text-anchor="start" fill="#1c324a">旧前缀 1</text></g></svg>
