9.5" font-size="18" text-anchor="middle" fill="#1c324a">#</text><rect x="107" y="180" width="57" height="45" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="135.5" y="209.5" font-size="18" text-anchor="middle" fill="#1c324a">#</text><rect x="174" y="180" width="57" height="45" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="202.5" y="209.5" font-size="18" text-anchor="middle" fill="#1c324a">.</text><rect x="241" y="180" width="57" height="45" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="269.5" y="209.5" font-size="18" text-anchor="middle" fill="#1c324a">.</text><text x="365" y="105" font-size="18" text-anchor="start" fill="#1c324a">绿色格：最外圈；中间两格不计入</text><text x="365" y="151" font-size="18" text-anchor="start" fill="#1c324a">一个格子只判断一次，因此四个角不重复</text><text x="365" y="205" font-size="18" text-anchor="start" fill="#1c324a">单行 / 单列时，整行 / 整列都是外圈</text></g></svg>
