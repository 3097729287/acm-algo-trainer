<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310" role="img" aria-label="原圈走 d 步 → 查询空格 → 占用后把查询链接接到后继"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="310" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">原圈走 d 步 → 查询空格 → 占用后把查询链接接到后继</text><rect x="30" y="78" width="90" height="52" rx="7" fill="#e8edf2" stroke="#6b89a4"/><text x="75.0" y="111.0" font-size="18" text-anchor="middle" fill="#1c324a">1</text><rect x="145" y="78" width="90" height="52" rx="7" fill="#e8edf2" stroke="#6b89a4"/><text x="190.0" y="111.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><rect x="260" y="78" width="90" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="305.0" y="111.0" font-size="18" text-anchor="middle" fill="#1c324a">3</text><rect x="375" y="78" width="90" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="420.0" y="111.0" font-size="18" text-anchor="middle" fill="#1c324a">4</text><rect x="490" y="78" width="90" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="535.0" y="111.0" font-size="18" text-anchor="middle" fill="#1c324a">5</text><rect x="605" y="78" width="90" height="52" rx="7" fill="#e8edf2" stroke="#6b89a4"/><text x="650.0" y="111.0" font-size="18" text-anchor="middle" fill="#1c324a">6</text><text x="40" y="164" font-size="18" text-anchor="start" fill="#1c324a">灰色：已占用 1、2、6；绿色：空格 3、4、5</text><line x1="715" y1="104" x2="830" y2="104" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="772" y="80" font-size="17" text-anchor="middle" fill="#1c324a">哨兵 7</text><line x1="65" y1="209" x2="305" y2="209" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="185" y="196" font-size="18" text-anchor="middle" fill="#1c324a">find(1) = 3</text><line x1="650" y1="245" x2="825" y2="245" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="737" y="231" font-size="18" text-anchor="middle" fill="#1c324a">find(6) = 7</text><text x="40" y="281" font-size="18" text-anchor="start" fill="#1c324a">到哨兵后再 find(1)，得到空格 3；原始步数仍按 n = 6 计算</text></g></svg>
