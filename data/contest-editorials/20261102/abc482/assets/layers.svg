<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="N = 6 = 2×3：一轮分成两层，开始一轮时才增加代价"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="360" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">N = 6 = 2×3：一轮分成两层，开始一轮时才增加代价</text><rect x="30" y="95" width="230" height="58" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="145.0" y="131.0" font-size="18" text-anchor="middle" fill="#1c324a">层0 / 余1</text><rect x="335" y="95" width="230" height="58" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="450.0" y="131.0" font-size="18" text-anchor="middle" fill="#1c324a">层1 / 余2</text><rect x="640" y="95" width="230" height="58" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="755.0" y="131.0" font-size="18" text-anchor="middle" fill="#1c324a">层0 / 余6</text><line x1="266" y1="124" x2="329" y2="124" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="571" y1="124" x2="634" y2="124" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="295" y="79" font-size="17" text-anchor="middle" fill="#1c324a">×2，花费1</text><text x="600" y="79" font-size="17" text-anchor="middle" fill="#1c324a">×3，花费0</text><text x="30" y="204" font-size="18" text-anchor="start" fill="#1c324a">一轮得到约数 2×3=6；也可在任一层选指数0，即乘1。</text><rect x="30" y="242" width="190" height="50" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="125.0" y="274.0" font-size="18" text-anchor="middle" fill="#1c324a">余1 / t=0</text><rect x="345" y="242" width="190" height="50" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="440.0" y="274.0" font-size="18" text-anchor="middle" fill="#1c324a">余2 / t=1</text><rect x="660" y="242" width="190" height="50" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="755.0" y="274.0" font-size="18" text-anchor="middle" fill="#1c324a">余4 / t=2</text><line x1="227" y1="268" x2="338" y2="268" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="542" y1="268" x2="653" y2="268" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="285" y="233" font-size="17" text-anchor="middle" fill="#1c324a">一轮乘2</text><text x="600" y="233" font-size="17" text-anchor="middle" fill="#1c324a">再一轮乘2</text><text x="30" y="337" font-size="18" text-anchor="start" fill="#1c324a">模 7 时余4最少需要两轮。终点只读取回到层0的完整轮次；余1答案为1。</text></g></svg>
