<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="排序后的坐标保留重复值；闭区间 [2,4] 对应一段下标"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="300" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">排序后的坐标保留重复值；闭区间 [2,4] 对应一段下标</text><rect x="110" y="84" width="95" height="52" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="157.5" y="117.0" font-size="18" text-anchor="middle" fill="#1c324a">1</text><text x="157" y="161" font-size="16" text-anchor="middle" fill="#1c324a">下标 0</text><rect x="235" y="84" width="95" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="282.5" y="117.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><text x="282" y="161" font-size="16" text-anchor="middle" fill="#1c324a">下标 1</text><rect x="360" y="84" width="95" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="407.5" y="117.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><text x="407" y="161" font-size="16" text-anchor="middle" fill="#1c324a">下标 2</text><rect x="485" y="84" width="95" height="52" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="532.5" y="117.0" font-size="18" text-anchor="middle" fill="#1c324a">4</text><text x="532" y="161" font-size="16" text-anchor="middle" fill="#1c324a">下标 3</text><rect x="610" y="84" width="95" height="52" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="657.5" y="117.0" font-size="18" text-anchor="middle" fill="#1c324a">5</text><text x="657" y="161" font-size="16" text-anchor="middle" fill="#1c324a">下标 4</text><line x1="220" y1="207" x2="600" y2="207" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="415" y="241" font-size="18" text-anchor="middle" fill="#1c324a">保留三个位置：2、2、4</text><text x="80" y="279" font-size="18" text-anchor="start" fill="#1c324a">lower_bound(2) = 1；upper_bound(4) = 4；数量 = 4 − 1 = 3</text></g></svg>
