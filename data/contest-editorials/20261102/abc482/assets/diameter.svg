<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-label="偶数直径共用一个中心；奇数直径共用一条中心边"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="380" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">偶数直径共用一个中心；奇数直径共用一条中心边</text><text x="190" y="74" font-size="20" text-anchor="middle" fill="#1c324a">D = 4，半径 2</text><line x1="200" y1="185" x2="100" y2="135" stroke="#476782" stroke-width="2.4"/><line x1="200" y1="185" x2="300" y2="135" stroke="#476782" stroke-width="2.4"/><line x1="200" y1="185" x2="200" y2="280" stroke="#476782" stroke-width="2.4"/><line x1="100" y1="135" x2="45" y2="85" stroke="#476782" stroke-width="2.4"/><line x1="300" y1="135" x2="355" y2="85" stroke="#476782" stroke-width="2.4"/><line x1="200" y1="280" x2="200" y2="335" stroke="#476782" stroke-width="2.4"/><circle cx="200" cy="185" r="19" fill="#ffedc5" stroke="#476782" stroke-width="2"/><text x="200" y="191" font-size="17" text-anchor="middle" fill="#1c324a">中心</text><circle cx="100" cy="135" r="19" fill="#d9edf9" stroke="#476782" stroke-width="2"/><text x="100" y="141" font-size="17" text-anchor="middle" fill="#1c324a"></text><circle cx="300" cy="135" r="19" fill="#d9edf9" stroke="#476782" stroke-width="2"/><text x="300" y="141" font-size="17" text-anchor="middle" fill="#1c324a"></text><circle cx="200" cy="280" r="19" fill="#d9edf9" stroke="#476782" stroke-width="2"/><text x="200" y="286" font-size="17" text-anchor="middle" fill="#1c324a"></text><circle cx="45" cy="85" r="19" fill="#f4d8d5" stroke="#476782" stroke-width="2"/><text x="45" y="91" font-size="17" text-anchor="middle" fill="#1c324a">红</text><circle cx="355" cy="85" r="19" fill="#f4d8d5" stroke="#476782" stroke-width="2"/><text x="355" y="91" font-size="17" text-anchor="middle" fill="#1c324a">红</text><circle cx="200" cy="335" r="19" fill="#d9edf9" stroke="#476782" stroke-width="2"/><text x="200" y="341" font-size="17" text-anchor="middle" fill="#1c324a">蓝</text><text x="475" y="74" font-size="20" text-anchor="start" fill="#1c324a">D = 3，两侧各走 1 条边</text><line x1="590" y1="200" x2="740" y2="200" stroke="#b76a30" stroke-width="2.4"/><line x1="590" y1="200" x2="510" y2="115" stroke="#476782" stroke-width="2.4"/><line x1="590" y1="200" x2="510" y2="285" stroke="#476782" stroke-width="2.4"/><line x1="740" y1="200" x2="820" y2="115" stroke="#476782" stroke-width="2.4"/><line x1="740" y1="200" x2="820" y2="285" stroke="#476782" stroke-width="2.4"/><circle cx="590" cy="200" r="21" fill="#ffedc5" stroke="#476782" stroke-width="2"/><text x="590" y="206" font-size="17" text-anchor="middle" fill="#1c324a">左心</text><circle cx="740" cy="200" r="21" fill="#ffedc5" stroke="#476782" stroke-width="2"/><text x="740" y="206" font-size="17" text-anchor="middle" fill="#1c324a">右心</text><circle cx="510" cy="115" r="21" fill="#f4d8d5" stroke="#476782" stroke-width="2"/><text x="510" y="121" font-size="17" text-anchor="middle" fill="#1c324a">红</text><circle cx="510" cy="285" r="21" fill="#d9edf9" stroke="#476782" stroke-width="2"/><text x="510" y="291" font-size="17" text-anchor="middle" fill="#1c324a">蓝</text><circle cx="820" cy="115" r="21" fill="#f4d8d5" stroke="#476782" stroke-width="2"/><text x="820" y="121" font-size="17" text-anchor="middle" fill="#1c324a">红</text><circle cx="820" cy="285" r="21" fill="#f4d8d5" stroke="#476782" stroke-width="2"/><text x="820" y="291" font-size="17" text-anchor="middle" fill="#1c324a">红</text><text x="45" y="365" font-size="17" text-anchor="start" fill="#1c324a">同色端点必须来自不同中心分支。</text><text x="475" y="365" font-size="17" text-anchor="start" fill="#1c324a">红色端点：左侧一个 × 右侧两个 = 两对。</text></g></svg>
