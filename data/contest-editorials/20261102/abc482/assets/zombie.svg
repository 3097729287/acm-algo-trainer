<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-label="k = 2：先与右邻居相遇，再由两位传播者分别到达两端"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">k = 2：先与右邻居相遇，再由两位传播者分别到达两端</text><text x="30" y="72" font-size="18" text-anchor="start" fill="#1c324a">初始坐标：2、4（初始感染）、10、14、18。取右侧邻居 10。</text><line x1="100" y1="115" x2="680" y2="115" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="100" y1="115" x2="100" y2="363" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="40" y="365" font-size="16" text-anchor="start" fill="#1c324a">时间</text><text x="710" y="113" font-size="16" text-anchor="start" fill="#1c324a">坐标</text><text x="158" y="102" font-size="17" text-anchor="middle" fill="#1c324a">2</text><text x="216" y="102" font-size="17" text-anchor="middle" fill="#1c324a">4</text><text x="390" y="102" font-size="17" text-anchor="middle" fill="#1c324a">10</text><text x="622" y="102" font-size="17" text-anchor="middle" fill="#1c324a">18</text><line x1="158" y1="115" x2="274" y2="239" stroke="#368b66" stroke-width="2.4"/><line x1="216" y1="115" x2="419" y2="332" stroke="#b76a30" stroke-width="2.4"/><line x1="390" y1="115" x2="274" y2="239" stroke="#b76a30" stroke-width="2.4"/><line x1="622" y1="115" x2="419" y2="332" stroke="#368b66" stroke-width="2.4"/><circle cx="303" cy="208" r="5" fill="#b76a30" stroke="#476782" stroke-width="2"/><text x="303" y="214" font-size="17" text-anchor="middle" fill="#1c324a"></text><text x="320" y="213" font-size="17" text-anchor="start" fill="#1c324a">首次接触：t=3</text><circle cx="274" cy="239" r="5" fill="#b76a30" stroke="#476782" stroke-width="2"/><text x="274" y="245" font-size="17" text-anchor="middle" fill="#1c324a"></text><text x="291" y="244" font-size="17" text-anchor="start" fill="#1c324a">左端接触：t=4</text><circle cx="419" cy="332" r="5" fill="#b76a30" stroke="#476782" stroke-width="2"/><text x="419" y="338" font-size="17" text-anchor="middle" fill="#1c324a"></text><text x="436" y="337" font-size="17" text-anchor="start" fill="#1c324a">右端接触：t=7</text><text x="30" y="407" font-size="18" text-anchor="start" fill="#1c324a">橙线：两位传播者的轨迹。绿色：两端的人相向移动。完成时间 max(4,7) = 7。</text></g></svg>
