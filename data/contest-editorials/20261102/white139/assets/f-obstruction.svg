<svg xmlns="http://www.w3.org/2000/svg" width="980" height="245" viewBox="0 0 980 245">
<rect width="980" height="245" rx="16" fill="#ffffff"/>
<g font-family="Microsoft YaHei,SimHei,Arial,sans-serif" fill="#172033" font-size="19">
<text x="25" y="36" fill="#172033" font-size="23" text-anchor="start">F：最轻的孤立边无法获得代价只增加 1 的替代边</text>
<line x1="110" y1="130" x2="350" y2="130" stroke="#bc3744" stroke-width="5" stroke-dasharray=""/>
<text x="230.0" y="116" fill="#172033" font-size="22" text-anchor="middle">1</text>
<line x1="350" y1="130" x2="590" y2="130" stroke="#277da1" stroke-width="5" stroke-dasharray=""/>
<text x="470.0" y="116" fill="#172033" font-size="22" text-anchor="middle">5</text>
<line x1="590" y1="130" x2="830" y2="130" stroke="#277da1" stroke-width="5" stroke-dasharray=""/>
<text x="710.0" y="116" fill="#172033" font-size="22" text-anchor="middle">5</text>
<circle cx="110" cy="130" r="21" fill="white" stroke="#172033" stroke-width="2"/>
<text x="110" y="137" fill="#172033" font-size="20" text-anchor="middle">1</text>
<circle cx="350" cy="130" r="21" fill="white" stroke="#172033" stroke-width="2"/>
<text x="350" y="137" fill="#172033" font-size="20" text-anchor="middle">2</text>
<circle cx="590" cy="130" r="21" fill="white" stroke="#172033" stroke-width="2"/>
<text x="590" y="137" fill="#172033" font-size="20" text-anchor="middle">3</text>
<circle cx="830" cy="130" r="21" fill="white" stroke="#172033" stroke-width="2"/>
<text x="830" y="137" fill="#172033" font-size="20" text-anchor="middle">4</text>
<text x="490" y="190" fill="#172033" font-size="19" text-anchor="middle">替代 (1,2) 的新边只能连向 3 或 4；原路径都经过权为 5 的边。</text>
<text x="490" y="223" fill="#bc3744" font-size="19" text-anchor="middle">保持唯一 MST 要求新权值至少 6，但只增加 1 又要求新权值为 2，矛盾。</text>
</g></svg>