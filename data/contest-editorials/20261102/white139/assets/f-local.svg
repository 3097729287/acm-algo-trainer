<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330">
<rect width="980" height="330" rx="16" fill="#ffffff"/>
<g font-family="Microsoft YaHei,SimHei,Arial,sans-serif" fill="#172033" font-size="19">
<text x="25" y="37" fill="#172033" font-size="23" text-anchor="start">F：把一条树边和较轻邻边组成二边路径，再连接两端</text>
<text x="230" y="78" fill="#172033" font-size="18" text-anchor="middle">原树中的两条相邻边</text>
<line x1="70" y1="220" x2="235" y2="220" stroke="#277da1" stroke-width="5" stroke-dasharray=""/>
<line x1="235" y1="220" x2="400" y2="220" stroke="#277da1" stroke-width="4" stroke-dasharray=""/>
<circle cx="70" cy="220" r="20" fill="white" stroke="#172033" stroke-width="2"/>
<text x="70" y="227" fill="#172033" font-size="20" text-anchor="middle">1</text>
<circle cx="235" cy="220" r="20" fill="white" stroke="#172033" stroke-width="2"/>
<text x="235" y="227" fill="#172033" font-size="20" text-anchor="middle">2</text>
<circle cx="400" cy="220" r="20" fill="white" stroke="#172033" stroke-width="2"/>
<text x="400" y="227" fill="#172033" font-size="20" text-anchor="middle">3</text>
<text x="152" y="208" fill="#172033" font-size="20" text-anchor="middle">2</text>
<text x="318" y="208" fill="#172033" font-size="20" text-anchor="middle">5</text>
<text x="720" y="78" fill="#172033" font-size="18" text-anchor="middle">删去权为 5 的边后，用新边接回</text>
<line x1="560" y1="220" x2="725" y2="220" stroke="#277da1" stroke-width="5" stroke-dasharray=""/>
<line x1="725" y1="220" x2="890" y2="220" stroke="#bc3744" stroke-width="4" stroke-dasharray="7 6"/>
<circle cx="560" cy="220" r="20" fill="white" stroke="#172033" stroke-width="2"/>
<text x="560" y="227" fill="#172033" font-size="20" text-anchor="middle">1</text>
<circle cx="725" cy="220" r="20" fill="white" stroke="#172033" stroke-width="2"/>
<text x="725" y="227" fill="#172033" font-size="20" text-anchor="middle">2</text>
<circle cx="890" cy="220" r="20" fill="white" stroke="#172033" stroke-width="2"/>
<text x="890" y="227" fill="#172033" font-size="20" text-anchor="middle">3</text>
<text x="642" y="208" fill="#172033" font-size="20" text-anchor="middle">2</text>
<text x="808" y="208" fill="#172033" font-size="20" text-anchor="middle">5</text>
<path d="M 560 200 Q 725 15 890 200" fill="none" stroke="#16705a" stroke-width="4"/>
<text x="725" y="133" fill="#16705a" font-size="19" text-anchor="middle">新边权 6 = 5+1</text>
<text x="490" y="285" fill="#172033" font-size="18" text-anchor="middle">路径最大权为 5；新边权 6 严格更大。删去权为 5 的边，总代价仅增加 1。</text>
</g></svg>