<svg xmlns="http://www.w3.org/2000/svg" width="920" height="355" viewBox="0 0 920 355" role="img" aria-label="m=1、n=3：合法前缀结束于二，再接一段确定的全一后缀"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="355" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">m=1、n=3：合法前缀结束于二，再接一段确定的全一后缀</text><text x="35" y="77" font-size="18" text-anchor="start" fill="#1c324a">长度2前缀：</text><rect x="210" y="52" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="231.5" y="80.0" font-size="18" text-anchor="middle" fill="#1c324a">3</text><rect x="259" y="52" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="280.5" y="80.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><line x1="345" y1="76" x2="460" y2="76" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="505" y="52" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="526.5" y="80.0" font-size="18" text-anchor="middle" fill="#1c324a">3</text><rect x="554" y="52" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="575.5" y="80.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><rect x="603" y="52" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="624.5" y="80.0" font-size="18" text-anchor="middle" fill="#1c324a">1</text><text x="705" y="79" font-size="18" text-anchor="start" fill="#1c324a">补一个一</text><text x="35" y="170" font-size="18" text-anchor="start" fill="#1c324a">长度3前缀：</text><rect x="210" y="144" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="231.5" y="172.0" font-size="18" text-anchor="middle" fill="#1c324a">3</text><rect x="259" y="144" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="280.5" y="172.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><rect x="308" y="144" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="329.5" y="172.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><line x1="390" y1="168" x2="465" y2="168" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="510" y="175" font-size="18" text-anchor="start" fill="#1c324a">长度已满，直接计入</text><rect x="210" y="220" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="231.5" y="248.0" font-size="18" text-anchor="middle" fill="#1c324a">3</text><rect x="259" y="220" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="280.5" y="248.0" font-size="18" text-anchor="middle" fill="#1c324a">3</text><rect x="308" y="220" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="329.5" y="248.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><line x1="390" y1="244" x2="465" y2="244" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="510" y="251" font-size="18" text-anchor="start" fill="#1c324a">长度已满，直接计入</text><text x="35" y="321" font-size="18" text-anchor="start" fill="#1c324a">dp₂,₂ = 1，dp₃,₂ = 2，总数 1 + 2 = 3。同一个二可连续保留。</text></g></svg>
