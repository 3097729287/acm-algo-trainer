<svg xmlns="http://www.w3.org/2000/svg" width="920" height="455" viewBox="0 0 920 455" role="img" aria-label="K=2：同层使用同一位，但分支可以产生不同的加法进位"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="455" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">K=2：同层使用同一位，但分支可以产生不同的加法进位</text><line x1="450" y1="115" x2="235" y2="210" stroke="#476782" stroke-width="2.4"/><text x="359.5" y="167.5" font-size="18" text-anchor="start" fill="#1c324a">c=0</text><line x1="450" y1="115" x2="665" y2="210" stroke="#476782" stroke-width="2.4"/><text x="574.5" y="167.5" font-size="18" text-anchor="start" fill="#1c324a">c=0</text><line x1="235" y1="250" x2="235" y2="350" stroke="#476782" stroke-width="2.4"/><text x="252.0" y="305.0" font-size="18" text-anchor="start" fill="#1c324a">c=1</text><line x1="665" y1="250" x2="665" y2="350" stroke="#476782" stroke-width="2.4"/><text x="682.0" y="305.0" font-size="18" text-anchor="start" fill="#1c324a">c=0</text><rect x="387" y="76" width="126" height="48" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="450.0" y="107.0" font-size="18" text-anchor="middle" fill="#1c324a">1：0→0</text><rect x="172" y="211" width="126" height="48" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="235.0" y="242.0" font-size="18" text-anchor="middle" fill="#1c324a">2：1→0</text><rect x="602" y="211" width="126" height="48" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="665.0" y="242.0" font-size="18" text-anchor="middle" fill="#1c324a">3：0→1</text><rect x="172" y="351" width="126" height="48" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="235.0" y="382.0" font-size="18" text-anchor="middle" fill="#1c324a">4：0→1</text><rect x="602" y="351" width="126" height="48" rx="7" fill="#e7f1fa" stroke="#6b89a4"/><text x="665.0" y="382.0" font-size="18" text-anchor="middle" fill="#1c324a">5：0→0</text><text x="35" y="107" font-size="19" text-anchor="start" fill="#1c324a">深度0：k₀=0</text><text x="35" y="242" font-size="19" text-anchor="start" fill="#1c324a">深度1：k₁=1</text><text x="35" y="383" font-size="19" text-anchor="start" fill="#1c324a">深度2：k₂=0</text><text x="345" y="230" font-size="17" text-anchor="middle" fill="#1c324a">1+1+0=2</text><text x="790" y="230" font-size="17" text-anchor="middle" fill="#1c324a">0+1+0=1</text><text x="450" y="435" font-size="17" text-anchor="middle" fill="#1c324a">框内是顶点编号与初态→目标；边标 c 是进入孩子的加法进位。</text></g></svg>
