<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-label="交错变号后，交换并同时取反变为单纯的相邻交换"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476782" stroke-width="1.5"/></marker></defs><rect width="920" height="370" rx="12" fill="#f8fbff"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1c324a"><text x="24" y="34" font-size="22" text-anchor="start" fill="#1c324a">交错变号后，交换并同时取反变为单纯的相邻交换</text><text x="35" y="82" font-size="18" text-anchor="start" fill="#1c324a">原数组 a：</text><rect x="170" y="54" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="191.5" y="82.0" font-size="18" text-anchor="middle" fill="#1c324a">1</text><rect x="219" y="54" width="43" height="42" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="240.5" y="82.0" font-size="18" text-anchor="middle" fill="#1c324a">-2</text><rect x="268" y="54" width="43" height="42" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="289.5" y="82.0" font-size="18" text-anchor="middle" fill="#1c324a">-3</text><rect x="317" y="54" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="338.5" y="82.0" font-size="18" text-anchor="middle" fill="#1c324a">4</text><text x="455" y="82" font-size="18" text-anchor="start" fill="#1c324a">操作 i=2 后：</text><rect x="620" y="54" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="641.5" y="82.0" font-size="18" text-anchor="middle" fill="#1c324a">1</text><rect x="669" y="54" width="43" height="42" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="690.5" y="82.0" font-size="18" text-anchor="middle" fill="#1c324a">3</text><rect x="718" y="54" width="43" height="42" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="739.5" y="82.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><rect x="767" y="54" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="788.5" y="82.0" font-size="18" text-anchor="middle" fill="#1c324a">4</text><text x="35" y="178" font-size="18" text-anchor="start" fill="#1c324a">新数组 b：</text><rect x="170" y="150" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="191.5" y="178.0" font-size="18" text-anchor="middle" fill="#1c324a">1</text><rect x="219" y="150" width="43" height="42" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="240.5" y="178.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><rect x="268" y="150" width="43" height="42" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="289.5" y="178.0" font-size="18" text-anchor="middle" fill="#1c324a">-3</text><rect x="317" y="150" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="338.5" y="178.0" font-size="18" text-anchor="middle" fill="#1c324a">-4</text><text x="455" y="178" font-size="18" text-anchor="start" fill="#1c324a">同两位置交换：</text><rect x="620" y="150" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="641.5" y="178.0" font-size="18" text-anchor="middle" fill="#1c324a">1</text><rect x="669" y="150" width="43" height="42" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="690.5" y="178.0" font-size="18" text-anchor="middle" fill="#1c324a">-3</text><rect x="718" y="150" width="43" height="42" rx="7" fill="#ffedc5" stroke="#6b89a4"/><text x="739.5" y="178.0" font-size="18" text-anchor="middle" fill="#1c324a">2</text><rect x="767" y="150" width="43" height="42" rx="7" fill="#d4eddf" stroke="#6b89a4"/><text x="788.5" y="178.0" font-size="18" text-anchor="middle" fill="#1c324a">-4</text><line x1="215" y1="110" x2="215" y2="139" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="665" y1="110" x2="665" y2="139" stroke="#476782" stroke-width="2.4" marker-end="url(#arrow)"/><text x="35" y="257" font-size="18" text-anchor="start" fill="#1c324a">b 的奇数位保留 a，偶数位取反；例如 a₂=−2 对应 b₂=2。</text><text x="35" y="313" font-size="18" text-anchor="start" fill="#1c324a">a 的和 = b₁ − b₂ + b₃ − b₄；图中最终为 1 + 3 + 2 + 4 = 10。</text></g></svg>
