<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200"><rect width="720" height="200" fill="#f8f9fa"/><text x="20" y="30" font-size="16" fill="#212529">A题：每只青蛙汉字数 = 10 + 2×len(n) + len(2n) + len(4n)</text><text x="20" y="70" font-size="15" fill="#212529">n=1: len(1)=1, len(2)=1, len(4)=1 → 10+2+1+1=14</text><text x="20" y="100" font-size="15" fill="#212529">n=10: len(10)=1, len(20)=2, len(40)=2 → 10+2+2+2=16</text><text x="20" y="130" font-size="15" fill="#212529">n=20: len(20)=2, len(40)=2, len(80)=2 → 10+4+2+2=18</text><text x="20" y="170" font-size="15" fill="#212529">累加n=1..20得353</text></svg>