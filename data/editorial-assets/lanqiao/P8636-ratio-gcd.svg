<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#ffffff"/><text x="20" y="30" font-size="18" fill="#111">样例1：32 &lt; 200 &lt; 1250</text><text x="20" y="70" font-size="16" fill="#111">200/32 = 25/4 = 5² / 2²</text><text x="20" y="100" font-size="16" fill="#111">1250/200 = 25/4 = 5² / 2²</text><text x="20" y="145" font-size="16" fill="#111">分子侧：5 的指数为 2, 2 → gcd = 2</text><text x="20" y="175" font-size="16" fill="#111">分母侧：2 的指数为 2, 2 → gcd = 2</text><text x="20" y="220" font-size="18" fill="#0a5">最大公比 q = 5² / 2² = 25/4</text><line x1="20" y1="240" x2="700" y2="240" stroke="#888" stroke-width="1"/><text x="20" y="270" font-size="14" fill="#555">每个相邻比值都是 q 的正整数次幂，指数取 gcd 得到最大 q</text></svg>