<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#f8f9fa"/><text x="20" y="30" font-size="18" fill="#212529">红绿灯周期与等待时间</text><line x1="50" y1="100" x2="670" y2="100" stroke="#6c757d" stroke-width="2"/><line x1="50" y1="80" x2="50" y2="120" stroke="#6c757d" stroke-width="2"/><line x1="670" y1="80" x2="670" y2="120" stroke="#6c757d" stroke-width="2"/><text x="40" y="140" font-size="16" fill="#495057">0</text><text x="650" y="140" font-size="16" fill="#495057">period</text><rect x="50" y="90" width="200" height="20" fill="#198754"/><text x="100" y="80" font-size="16" fill="#198754">南北绿灯 2g</text><rect x="250" y="90" width="200" height="20" fill="#dc3545"/><text x="300" y="80" font-size="16" fill="#dc3545">东西绿灯 2r</text><rect x="450" y="90" width="200" height="20" fill="#198754"/><text x="500" y="80" font-size="16" fill="#198754">南北绿灯 2g</text><line x1="300" y1="60" x2="300" y2="160" stroke="#0d6efd" stroke-width="2" stroke-dasharray="6,4"/><text x="280" y="180" font-size="16" fill="#0d6efd">当前时刻 t</text><text x="20" y="230" font-size="16" fill="#495057">若入方向为南北向且 t 在东西绿灯区间，等待到下次南北绿灯开始</text><text x="20" y="260" font-size="16" fill="#495057">等待时间 = period - (t mod period) 或 2g - (t mod period)</text></svg>