<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <rect width="720" height="200" fill="#ffffff"/>
  <style>
    .box { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; }
    .arrow { stroke: #333333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .text { font-family: sans-serif; font-size: 18px; fill: #202124; text-anchor: middle; dominant-baseline: middle; }
    .label { font-family: sans-serif; font-size: 14px; fill: #5f6368; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
  <rect x="20" y="70" width="80" height="50" rx="8" class="box"/>
  <text x="60" y="95" class="text">20</text>
  <line x1="100" y1="95" x2="140" y2="95" class="arrow"/>
  <rect x="140" y="70" width="80" height="50" rx="8" class="box"/>
  <text x="180" y="95" class="text">10</text>
  <line x1="220" y1="95" x2="260" y2="95" class="arrow"/>
  <rect x="260" y="70" width="80" height="50" rx="8" class="box"/>
  <text x="300" y="95" class="text">5</text>
  <line x1="340" y1="95" x2="380" y2="95" class="arrow"/>
  <rect x="380" y="70" width="80" height="50" rx="8" class="box"/>
  <text x="420" y="95" class="text">2</text>
  <line x1="460" y1="95" x2="500" y2="95" class="arrow"/>
  <rect x="500" y="70" width="80" height="50" rx="8" class="box"/>
  <text x="540" y="95" class="text">1</text>
  <line x1="580" y1="95" x2="620" y2="95" class="arrow"/>
  <rect x="620" y="70" width="80" height="50" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
  <text x="660" y="95" class="text">0</text>
  <text x="60" y="140" class="label">输出</text>
  <text x="180" y="140" class="label">输出</text>
  <text x="300" y="140" class="label">输出</text>
  <text x="420" y="140" class="label">输出</text>
  <text x="540" y="140" class="label">输出</text>
  <text x="660" y="140" class="label">停止</text>
</svg>