<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><rect width="720" height="400" fill="#f8f9fa"/><text x="20" y="30" font-size="18" font-weight="bold" fill="#212529">最大后缀边际分数选取（示例：前缀 "bb"，剩余 R=2）</text><text x="20" y="70" font-size="16" fill="#212529">字母 'a' 的边际分数：b['a']=2，分数序列 2, 1, 0, -1, ...</text><text x="20" y="100" font-size="16" fill="#212529">字母 'b' 的边际分数：b['b']=0，分数序列 0, -1, -2, ...</text><text x="20" y="140" font-size="16" fill="#212529">选取最大的 R=2 个分数：2（来自 'a'）和 1（来自 'a'）</text><text x="20" y="170" font-size="16" fill="#212529">总和 = 2+1 = 3，最大后缀贡献 = R(R-1)/2 + 3 = 1 + 3 = 4</text><rect x="20" y="200" width="680" height="180" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="40" y="230" font-size="16" fill="#212529">分数选取示意：</text><text x="40" y="260" font-size="16" fill="#212529">'a' 列：2, 1, 0, -1, ...</text><text x="40" y="290" font-size="16" fill="#212529">'b' 列：0, -1, -2, ...</text><text x="40" y="320" font-size="16" fill="#212529">选中的分数：2（'a' 第1个），1（'a' 第2个）</text><text x="40" y="350" font-size="16" fill="#212529">未选中的分数：0（'a' 第3个），0（'b' 第1个），... </text></svg>