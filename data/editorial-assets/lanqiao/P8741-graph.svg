<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#f8f9fa"/><text x="20" y="30" font-size="18" fill="#212529">结点 1 与距离≤21的结点连边</text><circle cx="100" cy="150" r="20" fill="#0d6efd"/><text x="90" y="155" font-size="16" fill="#fff">1</text><circle cx="250" cy="150" r="20" fill="#6c757d"/><text x="240" y="155" font-size="16" fill="#fff">2</text><circle cx="400" cy="150" r="20" fill="#6c757d"/><text x="390" y="155" font-size="16" fill="#fff">21</text><circle cx="550" cy="150" r="20" fill="#6c757d"/><text x="540" y="155" font-size="16" fill="#fff">22</text><line x1="120" y1="150" x2="230" y2="150" stroke="#198754" stroke-width="2"/><line x1="120" y1="150" x2="380" y2="150" stroke="#198754" stroke-width="2"/><line x1="420" y1="150" x2="530" y2="150" stroke="#dc3545" stroke-width="2" stroke-dasharray="5,5"/><text x="150" y="130" font-size="14" fill="#198754">lcm(1,2)=2</text><text x="300" y="130" font-size="14" fill="#198754">lcm(1,21)=21</text><text x="450" y="130" font-size="14" fill="#dc3545">差=21，有边</text><text x="450" y="180" font-size="14" fill="#dc3545">差=21，有边</text><text x="20" y="250" font-size="16" fill="#212529">结点 1 与 22 差为 21，仍有边；与 23 差为 22，无边。</text></svg>