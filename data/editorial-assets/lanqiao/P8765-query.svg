<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"><rect width="720" height="260" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#000000">翻转后 P[0..7] = 0,1,2,1,2,3,4,3</text><text x="20" y="60" font-size="16" fill="#000000">查询 L=3，base=P[2]=2</text><g font-size="15" fill="#000000"><text x="20" y="100">下标</text><text x="80" y="100">0</text><text x="140" y="100">1</text><text x="200" y="100">2</text><text x="260" y="100">3</text><text x="320" y="100">4</text><text x="380" y="100">5</text><text x="440" y="100">6</text><text x="500" y="100">7</text><text x="20" y="140">P</text><text x="80" y="140">0</text><text x="140" y="140">1</text><text x="200" y="140">2</text><text x="260" y="140">1</text><text x="320" y="140">2</text><text x="380" y="140">3</text><text x="440" y="140">4</text><text x="500" y="140">3</text></g><rect x="250" y="110" width="40" height="50" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/><text x="240" y="190" font-size="15" fill="#e67e22">P[3]=1&lt;2，第一个低于 base 的位置 k=3</text><text x="20" y="230" font-size="15" fill="#000000">k=L，说明从 L 开始就不合法，输出 0</text></svg>