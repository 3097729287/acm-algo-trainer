<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"><rect width="720" height="330" fill="#ffffff"/><text x="25" y="30" font-family="sans-serif" font-size="19" fill="#172033">每一项都对应“前两班选 4-j 人 × 第三班选 j 人”</text><rect x="25" y="55" width="205" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="35" y="80" font-family="sans-serif" font-size="15" fill="#172033">第一班，2人</text><text x="35" y="108" font-family="sans-serif" font-size="19" fill="#172033">1, 2, 1</text><rect x="265" y="55" width="205" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="275" y="80" font-family="sans-serif" font-size="15" fill="#172033">第二班，3人，至多2</text><text x="275" y="108" font-family="sans-serif" font-size="19" fill="#172033">1, 3, 3</text><rect x="505" y="55" width="205" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="515" y="80" font-family="sans-serif" font-size="15" fill="#172033">第三班，2人</text><text x="515" y="108" font-family="sans-serif" font-size="19" fill="#172033">1, 2, 1</text><text x="45" y="160" font-family="sans-serif" font-size="19" fill="#172033">前两班选 0,1,2,3,4 人：1,5,10,9,3</text><rect x="25" y="185" width="210" height="55" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="35" y="220" font-family="sans-serif" font-size="17" fill="#172033">j=0：3 × 1 = 3</text><rect x="255" y="185" width="210" height="55" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="265" y="220" font-family="sans-serif" font-size="17" fill="#172033">j=1：9 × 2 = 18</text><rect x="485" y="185" width="210" height="55" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="495" y="220" font-family="sans-serif" font-size="17" fill="#172033">j=2：10 × 1 = 10</text><text x="210" y="290" font-family="sans-serif" font-size="20" fill="#172033">选4人的方案数：3 + 18 + 10 = 31</text></svg>