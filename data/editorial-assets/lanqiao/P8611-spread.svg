<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240"><rect width="720" height="240" fill="#ffffff"/><line x1="60" y1="120" x2="660" y2="120" stroke="#333333" stroke-width="3"/><text x="60" y="150" font-size="16" fill="#333333">0</text><text x="650" y="150" font-size="16" fill="#333333">100</text><circle cx="180" cy="120" r="8" fill="#e74c3c"/><text x="160" y="100" font-size="16" fill="#e74c3c">感冒(10,左)</text><circle cx="156" cy="120" r="8" fill="#3498db"/><text x="120" y="170" font-size="16" fill="#3498db">8,右</text><circle cx="300" cy="120" r="8" fill="#2ecc71"/><text x="280" y="100" font-size="16" fill="#2ecc71">20,左</text><line x1="180" y1="120" x2="156" y2="120" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/><line x1="156" y1="120" x2="300" y2="120" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/></marker></defs><text x="200" y="200" font-size="16" fill="#333333">感冒向左，先感染左侧向右的8，再感染右侧向左的20，共3只</text></svg>