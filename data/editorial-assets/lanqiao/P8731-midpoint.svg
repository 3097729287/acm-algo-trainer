<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#f8f9fa"/><text x="20" y="30" font-size="18" fill="#212529">中点 (A,B) 表示 A→B 方向的右侧车道</text><circle cx="200" cy="150" r="8" fill="#0d6efd"/><text x="180" y="140" font-size="16" fill="#0d6efd">A</text><circle cx="500" cy="150" r="8" fill="#0d6efd"/><text x="510" y="140" font-size="16" fill="#0d6efd">B</text><line x1="200" y1="150" x2="500" y2="150" stroke="#6c757d" stroke-width="4"/><line x1="200" y1="170" x2="500" y2="170" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6,4"/><text x="330" y="190" font-size="16" fill="#6c757d">道路中线</text><circle cx="350" cy="150" r="6" fill="#dc3545"/><text x="360" y="140" font-size="16" fill="#dc3545">中点</text><line x1="350" y1="150" x2="350" y2="120" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc3545"/></marker></defs><text x="360" y="115" font-size="16" fill="#dc3545">右侧</text><text x="20" y="250" font-size="16" fill="#495057">起点：从 A 沿 A→B 走半段到 B，进入方向为 A→B</text><text x="20" y="280" font-size="16" fill="#495057">终点：从 A 按 A→B 方向转弯合法后走半段到达中点</text></svg>