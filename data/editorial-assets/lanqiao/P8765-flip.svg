<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#000000">翻转前 P[0..7] = 0,1,2,3,2,1,2,1</text><text x="20" y="60" font-size="16" fill="#000000">翻转 [3,5]：P[3..5] 关于 P[2]=2 镜像，P[6..7] 加 2</text><g font-size="15" fill="#000000"><text x="20" y="100">下标</text><text x="80" y="100">0</text><text x="140" y="100">1</text><text x="200" y="100">2</text><text x="260" y="100">3</text><text x="320" y="100">4</text><text x="380" y="100">5</text><text x="440" y="100">6</text><text x="500" y="100">7</text><text x="20" y="140">翻转前</text><text x="80" y="140">0</text><text x="140" y="140">1</text><text x="200" y="140">2</text><text x="260" y="140">3</text><text x="320" y="140">2</text><text x="380" y="140">1</text><text x="440" y="140">2</text><text x="500" y="140">1</text><text x="20" y="180">翻转后</text><text x="80" y="180">0</text><text x="140" y="180">1</text><text x="200" y="180">2</text><text x="260" y="180">1</text><text x="320" y="180">2</text><text x="380" y="180">3</text><text x="440" y="180">4</text><text x="500" y="180">3</text></g><rect x="250" y="110" width="150" height="80" fill="none" stroke="#e74c3c" stroke-width="2"/><text x="260" y="220" font-size="15" fill="#e74c3c">镜像区间 [3,5]</text><text x="20" y="260" font-size="15" fill="#000000">P[3]=4-3=1, P[4]=4-2=2, P[5]=4-1=3；P[6]=2+2=4, P[7]=1+2=3</text></svg>