<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"><rect width="720" height="260" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#222">n=4 时 g(d) 与分块贡献</text><rect x="40" y="60" width="120" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="70" y="90" font-size="16" fill="#1e3a8a">d=1</text><text x="130" y="90" font-size="16" fill="#1e3a8a">g=1</text><rect x="180" y="60" width="120" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="210" y="90" font-size="16" fill="#166534">d=2</text><text x="270" y="90" font-size="16" fill="#166534">g=3</text><rect x="320" y="60" width="120" height="50" fill="#fef9c3" stroke="#ca8a04"/><text x="350" y="90" font-size="16" fill="#854d0e">d=3</text><text x="410" y="90" font-size="16" fill="#854d0e">g=8</text><rect x="460" y="60" width="120" height="50" fill="#fce7f3" stroke="#db2777"/><text x="490" y="90" font-size="16" fill="#9d174d">d=4</text><text x="550" y="90" font-size="16" fill="#9d174d">g=12</text><text x="40" y="150" font-size="16" fill="#222">分块：q=4 覆盖 d=1，贡献 16×1=16</text><text x="40" y="180" font-size="16" fill="#222">q=2 覆盖 d=2，贡献 4×3=12</text><text x="40" y="210" font-size="16" fill="#222">q=1 覆盖 d=3..4，贡献 1×(8+12)=20</text><text x="40" y="240" font-size="16" fill="#222">总和 16+12+20=48</text></svg>