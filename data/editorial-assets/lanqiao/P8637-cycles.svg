<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" fill="#222">排列 3 1 2 5 4 的置换环</text>
  <circle cx="120" cy="120" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="126" font-size="18" text-anchor="middle" fill="#1e3a8a">1</text>
  <circle cx="260" cy="120" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="126" font-size="18" text-anchor="middle" fill="#1e3a8a">3</text>
  <circle cx="190" cy="220" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="226" font-size="18" text-anchor="middle" fill="#1e3a8a">2</text>
  <line x1="145" y1="105" x2="235" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="145" x2="210" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="165" y1="195" x2="135" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="90" font-size="16" fill="#2563eb">p[1]=3</text>
  <text x="245" y="180" font-size="16" fill="#2563eb">p[3]=2</text>
  <text x="95" y="180" font-size="16" fill="#2563eb">p[2]=1</text>
  <text x="120" y="270" font-size="16" fill="#1e3a8a">环长 3，代价 2</text>

  <circle cx="480" cy="120" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="126" font-size="18" text-anchor="middle" fill="#14532d">4</text>
  <circle cx="600" cy="120" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="126" font-size="18" text-anchor="middle" fill="#14532d">5</text>
  <line x1="508" y1="105" x2="572" y2="105" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="572" y1="135" x2="508" y2="135" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="90" font-size="16" fill="#16a34a">p[4]=5</text>
  <text x="540" y="165" font-size="16" fill="#16a34a">p[5]=4</text>
  <text x="480" y="220" font-size="16" fill="#14532d">环长 2，代价 1</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>