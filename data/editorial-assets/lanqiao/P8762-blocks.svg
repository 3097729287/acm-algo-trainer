<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#333">数列分块结构（前4块）</text>
  <!-- 块1 -->
  <rect x="20" y="60" width="80" height="50" fill="#d0e8ff" stroke="#333" stroke-width="2"/>
  <text x="60" y="90" font-size="16" text-anchor="middle" fill="#333">1</text>
  <text x="60" y="130" font-size="14" text-anchor="middle" fill="#555">第1块</text>
  <!-- 块2 -->
  <rect x="110" y="60" width="120" height="50" fill="#d0e8ff" stroke="#333" stroke-width="2"/>
  <text x="170" y="90" font-size="16" text-anchor="middle" fill="#333">1, 2</text>
  <text x="170" y="130" font-size="14" text-anchor="middle" fill="#555">第2块</text>
  <!-- 块3 -->
  <rect x="240" y="60" width="160" height="50" fill="#d0e8ff" stroke="#333" stroke-width="2"/>
  <text x="320" y="90" font-size="16" text-anchor="middle" fill="#333">1, 2, 3</text>
  <text x="320" y="130" font-size="14" text-anchor="middle" fill="#555">第3块</text>
  <!-- 块4 -->
  <rect x="410" y="60" width="200" height="50" fill="#ffe0b2" stroke="#333" stroke-width="2"/>
  <text x="510" y="90" font-size="16" text-anchor="middle" fill="#333">1, 2, 3, 4</text>
  <text x="510" y="130" font-size="14" text-anchor="middle" fill="#555">第4块</text>
  <!-- 偏移标记 -->
  <line x1="410" y1="150" x2="510" y2="150" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="460" y="170" font-size="14" text-anchor="middle" fill="#e74c3c">t=2（前2项）</text>
  <!-- 位置标注 -->
  <text x="20" y="200" font-size="14" fill="#333">位置：1</text>
  <text x="110" y="200" font-size="14" fill="#333">2-3</text>
  <text x="240" y="200" font-size="14" fill="#333">4-6</text>
  <text x="410" y="200" font-size="14" fill="#333">7-10</text>
  <text x="20" y="230" font-size="14" fill="#333">前k块总长度：k(k+1)/2</text>
  <text x="20" y="260" font-size="14" fill="#333">前k-1块和：(k-1)k(k+1)/6</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>