<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><rect width="720" height="400" fill="#ffffff"/><style>text{font-family:monospace;font-size:14px;fill:#1f2937}.box{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.edge{stroke:#6b7280;stroke-width:2;fill:none}.label{font-size:15px;font-weight:bold;fill:#111827}</style><text x="20" y="30" class="label">线段树结点保存区间降序前8大值（不足补0）</text><text x="20" y="55">示例：位置1..10的值依次为10,20,...,100</text><rect x="260" y="80" width="200" height="50" rx="6" class="box"/><text x="270" y="100">根[1,10]</text><text x="270" y="120">[100,90,80,70,60,50,40,30]</text><line x1="330" y1="130" x2="180" y2="180" class="edge"/><line x1="390" y1="130" x2="540" y2="180" class="edge"/><rect x="80" y="180" width="200" height="50" rx="6" class="box"/><text x="90" y="200">左[1,5]</text><text x="90" y="220">[50,40,30,20,10,0,0,0]</text><rect x="440" y="180" width="200" height="50" rx="6" class="box"/><text x="450" y="200">右[6,10]</text><text x="450" y="220">[100,90,80,70,60,0,0,0]</text><line x1="140" y1="230" x2="80" y2="280" class="edge"/><line x1="220" y1="230" x2="280" y2="280" class="edge"/><rect x="20" y="280" width="120" height="50" rx="6" class="box"/><text x="30" y="300">[1,2]</text><text x="30" y="320">[20,10,0,0,0,0,0,0]</text><rect x="220" y="280" width="120" height="50" rx="6" class="box"/><text x="230" y="300">[3,5]</text><text x="230" y="320">[50,40,30,0,0,0,0,0]</text><text x="20" y="370">合并左[1,5]与右[6,10]：归并取前8得根[100,90,80,70,60,50,40,30]</text></svg>