<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><rect width="720" height="400" fill="#f8f9fa"/><text x="20" y="30" font-size="18" fill="#212529">30×50迷宫BFS：方向顺序 D &lt; L &lt; R &lt; U</text><rect x="20" y="50" width="680" height="300" fill="#ffffff" stroke="#adb5bd"/><text x="40" y="80" font-size="16" fill="#0d6efd">起点(0,0)</text><text x="580" y="340" font-size="16" fill="#dc3545">终点(29,49)</text><line x1="120" y1="100" x2="120" y2="160" stroke="#198754" stroke-width="3" marker-end="url(#arrowD)"/><text x="130" y="130" font-size="16" fill="#198754">D</text><line x1="120" y1="100" x2="60" y2="100" stroke="#fd7e14" stroke-width="3" marker-end="url(#arrowL)"/><text x="70" y="90" font-size="16" fill="#fd7e14">L</text><line x1="120" y1="100" x2="180" y2="100" stroke="#6f42c1" stroke-width="3" marker-end="url(#arrowR)"/><text x="190" y="90" font-size="16" fill="#6f42c1">R</text><line x1="120" y1="100" x2="120" y2="40" stroke="#d63384" stroke-width="3" marker-end="url(#arrowU)"/><text x="130" y="50" font-size="16" fill="#d63384">U</text><defs><marker id="arrowD" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#198754"/></marker><marker id="arrowL" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#fd7e14"/></marker><marker id="arrowR" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6f42c1"/></marker><marker id="arrowU" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d63384"/></marker></defs></svg>