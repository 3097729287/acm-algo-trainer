<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-family="sans-serif" fill="#222">S=ABCDEABCD, T=XAABZ 的 dp[0..5] 更新过程</text>
  <text x="20" y="60" font-size="14" font-family="sans-serif" fill="#444">INF 表示不可达；每行是处理完对应 S 前缀后的 dp 值</text>
  <g font-size="14" font-family="sans-serif" fill="#222">
    <text x="20" y="95">初始</text>
    <text x="120" y="95">0</text>
    <text x="200" y="95">INF</text>
    <text x="280" y="95">INF</text>
    <text x="360" y="95">INF</text>
    <text x="440" y="95">INF</text>
    <text x="520" y="95">INF</text>

    <text x="20" y="125">A</text>
    <text x="120" y="125">0</text>
    <text x="200" y="125">1</text>
    <text x="280" y="125">INF</text>
    <text x="360" y="125">INF</text>
    <text x="440" y="125">INF</text>
    <text x="520" y="125">INF</text>

    <text x="20" y="155">AB</text>
    <text x="120" y="155">0</text>
    <text x="200" y="155">1</text>
    <text x="280" y="155">2</text>
    <text x="360" y="155">INF</text>
    <text x="440" y="155">INF</text>
    <text x="520" y="155">INF</text>

    <text x="20" y="185">ABC</text>
    <text x="120" y="185">0</text>
    <text x="200" y="185">1</text>
    <text x="280" y="185">2</text>
    <text x="360" y="185">3</text>
    <text x="440" y="185">INF</text>
    <text x="520" y="185">INF</text>

    <text x="20" y="215">ABCD</text>
    <text x="120" y="215">0</text>
    <text x="200" y="215">1</text>
    <text x="280" y="215">2</text>
    <text x="360" y="215">3</text>
    <text x="440" y="215">4</text>
    <text x="520" y="215">INF</text>

    <text x="20" y="245">ABCDE</text>
    <text x="120" y="245">0</text>
    <text x="200" y="245">1</text>
    <text x="280" y="245">2</text>
    <text x="360" y="245">3</text>
    <text x="440" y="245">4</text>
    <text x="520" y="245">5</text>

    <text x="20" y="275">ABCDEA</text>
    <text x="120" y="275">0</text>
    <text x="200" y="275">1</text>
    <text x="280" y="275">1</text>
    <text x="360" y="275">2</text>
    <text x="440" y="275">4</text>
    <text x="520" y="275">5</text>

    <text x="20" y="305">ABCDEAB</text>
    <text x="120" y="305">0</text>
    <text x="200" y="305">1</text>
    <text x="280" y="305">1</text>
    <text x="360" y="305">2</text>
    <text x="440" y="305">2</text>
    <text x="520" y="305">5</text>

    <text x="20" y="335">ABCDEABC</text>
    <text x="120" y="335">0</text>
    <text x="200" y="335">1</text>
    <text x="280" y="335">1</text>
    <text x="360" y="335">2</text>
    <text x="440" y="335">2</text>
    <text x="520" y="335">3</text>

    <text x="20" y="365">ABCDEABCD</text>
    <text x="120" y="365">0</text>
    <text x="200" y="365">1</text>
    <text x="280" y="365">1</text>
    <text x="360" y="365">2</text>
    <text x="440" y="365">2</text>
    <text x="520" y="365">3</text>
  </g>
  <g font-size="14" font-family="sans-serif" fill="#555">
    <text x="120" y="390">dp[0]</text>
    <text x="200" y="390">dp[1]</text>
    <text x="280" y="390">dp[2]</text>
    <text x="360" y="390">dp[3]</text>
    <text x="440" y="390">dp[4]</text>
    <text x="520" y="390">dp[5]</text>
  </g>
</svg>