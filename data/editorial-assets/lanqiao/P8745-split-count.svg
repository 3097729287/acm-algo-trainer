<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><rect width="720" height="400" fill="white"/><text x="25" y="28" font-family="sans-serif" font-size="20" fill="#172033">四字符串的变换与最后一次状态求和</text><text x="25" y="90" font-family="sans-serif" font-size="16" fill="#172033">原串：u为空，v为整串</text><rect x="350" y="65" width="55" height="55" rx="5" fill="#eff6ff" stroke="#2563eb"/><text x="370" y="102" font-family="sans-serif" font-size="30" fill="#172033">(</text><rect x="425" y="65" width="55" height="55" rx="5" fill="#eff6ff" stroke="#2563eb"/><text x="445" y="102" font-family="sans-serif" font-size="30" fill="#172033">(</text><rect x="500" y="65" width="55" height="55" rx="5" fill="#eff6ff" stroke="#2563eb"/><text x="520" y="102" font-family="sans-serif" font-size="30" fill="#172033">(</text><rect x="575" y="65" width="55" height="55" rx="5" fill="#eff6ff" stroke="#2563eb"/><text x="595" y="102" font-family="sans-serif" font-size="30" fill="#172033">)</text><text x="25" y="190" font-family="sans-serif" font-size="16" fill="#172033">v反转并换括号，仍为4字符</text><rect x="350" y="165" width="55" height="55" rx="5" fill="#eff6ff" stroke="#2563eb"/><text x="370" y="202" font-family="sans-serif" font-size="30" fill="#172033">(</text><rect x="425" y="165" width="55" height="55" rx="5" fill="#eff6ff" stroke="#2563eb"/><text x="445" y="202" font-family="sans-serif" font-size="30" fill="#172033">)</text><rect x="500" y="165" width="55" height="55" rx="5" fill="#eff6ff" stroke="#2563eb"/><text x="520" y="202" font-family="sans-serif" font-size="30" fill="#172033">)</text><rect x="575" y="165" width="55" height="55" rx="5" fill="#eff6ff" stroke="#2563eb"/><text x="595" y="202" font-family="sans-serif" font-size="30" fill="#172033">)</text><text x="30" y="270" font-family="sans-serif" font-size="17" fill="#172033">读完前三字符：</text><text x="240" y="270" font-family="sans-serif" font-size="20" fill="#172033">旧 f[0]=2</text><text x="420" y="270" font-family="sans-serif" font-size="20" fill="#172033">旧 f[1]=3</text><path d="M300,285L390,325M480,285L390,325" fill="none" stroke="#15803d" stroke-width="3"/><text x="240" y="365" font-family="sans-serif" font-size="22" fill="#166534">最后读右括号：新 f[0]=2+3=5</text></svg>