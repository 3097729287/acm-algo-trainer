<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"><rect width="720" height="260" fill="#ffffff"/><text x="20" y="30" font-size="18" fill="#000000">N=12 枚举 a,b 查询 rest=12-a²-b²</text><g font-size="16" fill="#000000"><text x="20" y="70">a=0,b=0: rest=12, best[12] 不存在</text><text x="20" y="100">a=0,b=1: rest=11, best[11] 不存在</text><text x="20" y="130">a=0,b=2: rest=8, best[8]=2 ≥ b=2</text><text x="20" y="160">c=2, d=√(8-4)=2</text><text x="20" y="190" fill="#006600">输出 0 2 2 2</text></g></svg>