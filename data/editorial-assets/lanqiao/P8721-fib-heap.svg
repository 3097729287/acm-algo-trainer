<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#f8f9fa"/><text x="20" y="30" font-size="16" fill="#212529">D题：最小堆弹出与生成（前几步）</text><text x="20" y="70" font-size="15" fill="#212529">初始堆：{1,2,3,5,8}</text><text x="20" y="100" font-size="15" fill="#212529">弹出1 → 生成 3×1+2=5, 5×1+3=8, 8×1+5=13</text><text x="20" y="130" font-size="15" fill="#212529">弹出2 → 生成 8,13,21（8,13已存在）</text><text x="20" y="160" font-size="15" fill="#212529">弹出3 → 生成 11,18,29</text><text x="20" y="190" font-size="15" fill="#212529">弹出5 → 生成 17,28,45</text><text x="20" y="220" font-size="15" fill="#212529">弹出8 → 生成 26,43,69</text><text x="20" y="260" font-size="15" fill="#212529">第2020次弹出值为41269</text></svg>