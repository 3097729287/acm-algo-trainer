<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" fill="#222">第0层固定 [1,3]</text>
  <rect x="20" y="40" width="180" height="30" fill="#d0e8ff" stroke="#333"/>
  <text x="110" y="60" font-size="16" text-anchor="middle" fill="#222">[1,3]</text>

  <text x="20" y="110" font-size="16" fill="#222">第1层合法区间（图纸 .X.）</text>
  <rect x="20" y="120" width="60" height="30" fill="#d0ffd0" stroke="#333"/>
  <text x="50" y="140" font-size="16" text-anchor="middle" fill="#222">[1,1]</text>
  <rect x="140" y="120" width="60" height="30" fill="#d0ffd0" stroke="#333"/>
  <text x="170" y="140" font-size="16" text-anchor="middle" fill="#222">[3,3]</text>

  <text x="20" y="190" font-size="16" fill="#222">第2层合法区间（图纸 ..X）</text>
  <rect x="20" y="200" width="60" height="30" fill="#ffe0b0" stroke="#333"/>
  <text x="50" y="220" font-size="16" text-anchor="middle" fill="#222">[1,1]</text>
  <rect x="100" y="200" width="120" height="30" fill="#ffe0b0" stroke="#333"/>
  <text x="160" y="220" font-size="16" text-anchor="middle" fill="#222">[1,2]</text>
  <rect x="240" y="200" width="60" height="30" fill="#ffe0b0" stroke="#333"/>
  <text x="270" y="220" font-size="16" text-anchor="middle" fill="#222">[2,2]</text>

  <line x1="50" y1="120" x2="50" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="120" x2="170" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="50" y1="200" x2="50" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="400" y="80" font-size="16" fill="#222">箭头表示“被包含”：</text>
  <text x="400" y="110" font-size="16" fill="#222">下层区间必须包含上层区间</text>
  <text x="400" y="150" font-size="16" fill="#222">第1层 [1,1] 可由 [1,3] 得到</text>
  <text x="400" y="180" font-size="16" fill="#222">第2层 [1,1] 可由第1层 [1,1] 得到</text>
  <text x="400" y="210" font-size="16" fill="#222">第2层 [1,2] 无合法下层包含</text>
</svg>