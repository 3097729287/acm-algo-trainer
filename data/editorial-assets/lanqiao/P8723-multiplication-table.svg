<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">P=4 乘法表：枚举顺序与进制转换</text>
  <text x="20" y="70" font-size="15" fill="#333">行 i=1：</text>
  <rect x="100" y="50" width="120" height="30" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="160" y="70" font-size="15" text-anchor="middle" fill="#155724">1*1=1</text>
  <text x="240" y="70" font-size="14" fill="#555">（十进制 1×1=1，转换后仍为 1）</text>

  <text x="20" y="120" font-size="15" fill="#333">行 i=2：</text>
  <rect x="100" y="100" width="120" height="30" fill="#cce5ff" stroke="#004085" stroke-width="1.5"/>
  <text x="160" y="120" font-size="15" text-anchor="middle" fill="#004085">2*1=2</text>
  <text x="240" y="120" font-size="14" fill="#555">（十进制 2×1=2，转换后仍为 2）</text>
  <rect x="100" y="140" width="120" height="30" fill="#cce5ff" stroke="#004085" stroke-width="1.5"/>
  <text x="160" y="160" font-size="15" text-anchor="middle" fill="#004085">2*2=10</text>
  <text x="240" y="160" font-size="14" fill="#555">（十进制 2×2=4，4÷4=1 余 0 → "10"）</text>

  <text x="20" y="210" font-size="15" fill="#333">行 i=3：</text>
  <rect x="100" y="190" width="120" height="30" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/>
  <text x="160" y="210" font-size="15" text-anchor="middle" fill="#856404">3*1=3</text>
  <text x="240" y="210" font-size="14" fill="#555">（十进制 3×1=3，转换后仍为 3）</text>
  <rect x="100" y="230" width="120" height="30" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/>
  <text x="160" y="250" font-size="15" text-anchor="middle" fill="#856404">3*2=12</text>
  <text x="240" y="250" font-size="14" fill="#555">（十进制 3×2=6，6÷4=1 余 2 → "12"）</text>
  <rect x="100" y="270" width="120" height="30" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/>
  <text x="160" y="290" font-size="15" text-anchor="middle" fill="#856404">3*3=21</text>
  <text x="240" y="290" font-size="14" fill="#555">（十进制 3×3=9，9÷4=2 余 1 → "21"）</text>

  <text x="20" y="350" font-size="14" fill="#666">枚举顺序：i 从 1 到 3，j 从 1 到 i；每个等式左乘数固定为 i，右乘数递增。</text>
  <text x="20" y="375" font-size="14" fill="#666">转换规则：除基取余，余数 0~9 映射为数字，10~35 映射为大写字母，反转后拼接。</text>
</svg>