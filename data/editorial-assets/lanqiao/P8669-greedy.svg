<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240"><rect width="720" height="240" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#000000">排序后数组：[-100000, -10000, 2, 10000, 100000]</text><text x="20" y="60" font-size="16" fill="#000000">K=3，先取最大正数 100000，剩余 K=2</text><rect x="20" y="90" width="100" height="40" fill="#cce5ff" stroke="#000000"/><text x="45" y="115" font-size="16" fill="#000000">-100000</text><rect x="130" y="90" width="100" height="40" fill="#cce5ff" stroke="#000000"/><text x="155" y="115" font-size="16" fill="#000000">-10000</text><rect x="240" y="90" width="100" height="40" fill="#ffffff" stroke="#000000"/><text x="275" y="115" font-size="16" fill="#000000">2</text><rect x="350" y="90" width="100" height="40" fill="#ffffff" stroke="#000000"/><text x="385" y="115" font-size="16" fill="#000000">10000</text><rect x="460" y="90" width="100" height="40" fill="#ffe0b3" stroke="#000000"/><text x="495" y="115" font-size="16" fill="#000000">100000</text><text x="20" y="160" font-size="16" fill="#000000">左端乘积：(-100000)*(-10000)=10^9</text><text x="20" y="190" font-size="16" fill="#000000">右端乘积：2*10000=20000</text><text x="20" y="220" font-size="16" fill="#000000">取左端，最终乘积=100000*10^9=10^14</text></svg>