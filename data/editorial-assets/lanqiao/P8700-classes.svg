<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#f8f9fa" />
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#212529">等价类划分（k=0,1,2,3）</text>

  <text x="60" y="80" font-size="16" fill="#212529">外圈（12根）</text>
  <g font-size="14" fill="#212529">
    <rect x="60" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="80" y="110" text-anchor="middle">0</text>
    <rect x="100" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="120" y="110" text-anchor="middle">1</text>
    <rect x="140" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="160" y="110" text-anchor="middle">2</text>
    <rect x="180" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="200" y="110" text-anchor="middle">3</text>
    <rect x="220" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="240" y="110" text-anchor="middle">4</text>
    <rect x="260" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="280" y="110" text-anchor="middle">5</text>
    <rect x="300" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="320" y="110" text-anchor="middle">6</text>
    <rect x="340" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="360" y="110" text-anchor="middle">7</text>
    <rect x="380" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="400" y="110" text-anchor="middle">8</text>
    <rect x="420" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="440" y="110" text-anchor="middle">9</text>
    <rect x="460" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="480" y="110" text-anchor="middle">10</text>
    <rect x="500" y="90" width="40" height="30" fill="#d0ebff" stroke="#1c7ed6" /><text x="520" y="110" text-anchor="middle">11</text>
  </g>

  <text x="60" y="160" font-size="16" fill="#212529">中圈（8根）</text>
  <g font-size="14" fill="#212529">
    <rect x="60" y="170" width="40" height="30" fill="#d3f9d8" stroke="#2f9e44" /><text x="80" y="190" text-anchor="middle">0</text>
    <rect x="100" y="170" width="40" height="30" fill="#d3f9d8" stroke="#2f9e44" /><text x="120" y="190" text-anchor="middle">1</text>
    <rect x="140" y="170" width="40" height="30" fill="#d3f9d8" stroke="#2f9e44" /><text x="160" y="190" text-anchor="middle">2</text>
    <rect x="180" y="170" width="40" height="30" fill="#d3f9d8" stroke="#2f9e44" /><text x="200" y="190" text-anchor="middle">3</text>
    <rect x="220" y="170" width="40" height="30" fill="#d3f9d8" stroke="#2f9e44" /><text x="240" y="190" text-anchor="middle">4</text>
    <rect x="260" y="170" width="40" height="30" fill="#d3f9d8" stroke="#2f9e44" /><text x="280" y="190" text-anchor="middle">5</text>
    <rect x="300" y="170" width="40" height="30" fill="#d3f9d8" stroke="#2f9e44" /><text x="320" y="190" text-anchor="middle">6</text>
    <rect x="340" y="170" width="40" height="30" fill="#d3f9d8" stroke="#2f9e44" /><text x="360" y="190" text-anchor="middle">7</text>
  </g>

  <text x="60" y="240" font-size="16" fill="#212529">内圈（4根）</text>
  <g font-size="14" fill="#212529">
    <rect x="60" y="250" width="40" height="30" fill="#ffe3e3" stroke="#e03131" /><text x="80" y="270" text-anchor="middle">0</text>
    <rect x="100" y="250" width="40" height="30" fill="#ffe3e3" stroke="#e03131" /><text x="120" y="270" text-anchor="middle">1</text>
    <rect x="140" y="250" width="40" height="30" fill="#ffe3e3" stroke="#e03131" /><text x="160" y="270" text-anchor="middle">2</text>
    <rect x="180" y="250" width="40" height="30" fill="#ffe3e3" stroke="#e03131" /><text x="200" y="270" text-anchor="middle">3</text>
  </g>

  <rect x="60" y="90" width="40" height="30" fill="none" stroke="#f59f00" stroke-width="3" />
  <rect x="220" y="90" width="40" height="30" fill="none" stroke="#f59f00" stroke-width="3" />
  <rect x="380" y="90" width="40" height="30" fill="none" stroke="#f59f00" stroke-width="3" />
  <rect x="60" y="170" width="40" height="30" fill="none" stroke="#f59f00" stroke-width="3" />
  <rect x="220" y="170" width="40" height="30" fill="none" stroke="#f59f00" stroke-width="3" />
  <rect x="60" y="250" width="40" height="30" fill="none" stroke="#f59f00" stroke-width="3" />
  <text x="470" y="120" font-size="16" fill="#f59f00">类0：外0,4,8；中0,4；内0</text>
  <text x="470" y="150" font-size="16" fill="#f59f00">类1：外1,5,9；中1,5；内1</text>
  <text x="470" y="180" font-size="16" fill="#f59f00">类2：外2,6,10；中2,6；内2</text>
  <text x="470" y="210" font-size="16" fill="#f59f00">类3：外3,7,11；中3,7；内3</text>
  <text x="360" y="330" text-anchor="middle" font-size="16" fill="#495057">每类6根棒，目标：3G、2R、1Y</text>
</svg>
