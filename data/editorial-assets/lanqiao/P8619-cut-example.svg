<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#f8f9fa"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- 节点 -->
  <circle cx="100" cy="200" r="30" fill="#4a90d9" stroke="#2c5f8a" stroke-width="2"/>
  <text x="100" y="206" font-size="16" text-anchor="middle" fill="white">S</text>
  <circle cx="350" cy="120" r="30" fill="#f5a623" stroke="#b87d1a" stroke-width="2"/>
  <text x="350" y="126" font-size="16" text-anchor="middle" fill="white">格1</text>
  <circle cx="350" cy="280" r="30" fill="#f5a623" stroke="#b87d1a" stroke-width="2"/>
  <text x="350" y="286" font-size="16" text-anchor="middle" fill="white">格2</text>
  <circle cx="600" cy="200" r="30" fill="#7ed321" stroke="#4a8a0f" stroke-width="2"/>
  <text x="600" y="206" font-size="16" text-anchor="middle" fill="white">T</text>
  <!-- 边 S->格1 -->
  <line x1="130" y1="190" x2="315" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="150" font-size="14" fill="#333">10</text>
  <!-- 边 S->格2 -->
  <line x1="130" y1="210" x2="315" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="250" font-size="14" fill="#333">10</text>
  <!-- 边 格1->T -->
  <line x1="380" y1="130" x2="565" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="150" font-size="14" fill="#333">3</text>
  <!-- 边 格2->T -->
  <line x1="380" y1="270" x2="565" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="250" font-size="14" fill="#333">3</text>
  <!-- 双向边 格1<->格2 -->
  <line x1="350" y1="150" x2="350" y2="250" stroke="#d0021b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="250" x2="350" y2="150" stroke="#d0021b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="205" font-size="14" fill="#d0021b">1</text>
  <!-- 割线示意 -->
  <line x1="200" y1="50" x2="200" y2="350" stroke="#d0021b" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="205" y="70" font-size="14" fill="#d0021b">割线</text>
  <!-- 图例 -->
  <text x="20" y="30" font-size="16" fill="#333">1×2 格子网络（两格都选时最小割容量=6，答案=20-6=14）</text>
</svg>