<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- edges -->
  <line x1="360" y1="80" x2="200" y2="180" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="80" x2="520" y2="180" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="180" x2="440" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="180" x2="600" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- nodes -->
  <circle cx="360" cy="80" r="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="360" y="86" font-size="16" text-anchor="middle" fill="#0d47a1">1</text>
  <text x="360" y="130" font-size="14" text-anchor="middle" fill="#333333">w=1, f=8</text>

  <circle cx="200" cy="180" r="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="200" y="186" font-size="16" text-anchor="middle" fill="#0d47a1">3</text>
  <text x="200" y="230" font-size="14" text-anchor="middle" fill="#333333">w=-3, f=-3</text>

  <circle cx="520" cy="180" r="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="520" y="186" font-size="16" text-anchor="middle" fill="#0d47a1">2</text>
  <text x="520" y="230" font-size="14" text-anchor="middle" fill="#333333">w=-2, f=7</text>

  <circle cx="440" cy="300" r="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="440" y="306" font-size="16" text-anchor="middle" fill="#0d47a1">4</text>
  <text x="440" y="350" font-size="14" text-anchor="middle" fill="#333333">w=4, f=4</text>

  <circle cx="600" cy="300" r="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="600" y="306" font-size="16" text-anchor="middle" fill="#0d47a1">5</text>
  <text x="600" y="350" font-size="14" text-anchor="middle" fill="#333333">w=5, f=5</text>
</svg>