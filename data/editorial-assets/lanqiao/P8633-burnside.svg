<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" fill="#222">路径图 1-2-3，k=2</text>
  <line x1="120" y1="80" x2="220" y2="80" stroke="#333" stroke-width="3"/>
  <line x1="220" y1="80" x2="320" y2="80" stroke="#333" stroke-width="3"/>
  <circle cx="120" cy="80" r="22" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="87" font-size="18" text-anchor="middle" fill="#1e3a8a">1</text>
  <circle cx="220" cy="80" r="22" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="220" y="87" font-size="18" text-anchor="middle" fill="#1e3a8a">2</text>
  <circle cx="320" cy="80" r="22" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="320" y="87" font-size="18" text-anchor="middle" fill="#1e3a8a">3</text>

  <text x="20" y="150" font-size="16" fill="#222">恒等置换 id：循环 (1)(2)(3)，c=3，不动染色 2^3=8</text>
  <text x="20" y="185" font-size="16" fill="#222">交换置换 τ：循环 (1 3)(2)，c=2，不动染色 2^2=4</text>
  <text x="20" y="225" font-size="16" fill="#222">Burnside 和 = 8+4=12，|Aut(G)|=2，答案 = 12/2 = 6</text>

  <text x="20" y="270" font-size="14" fill="#555">τ 保持边集：边(1,2)映为(3,2)，边(3,2)映为(1,2)</text>
</svg>