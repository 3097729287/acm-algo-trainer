<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" fill="#222">样例：N=5, K=2，前缀和模2余数</text>
  <text x="20" y="60" font-size="15" fill="#222">下标 p：0   1   2   3   4   5</text>
  <text x="20" y="85" font-size="15" fill="#222">前缀和：0   1   3   6  10  15</text>
  <text x="20" y="110" font-size="15" fill="#222">余数 r：0   1   1   0   0   1</text>
  <line x1="20" y1="125" x2="700" y2="125" stroke="#888" stroke-width="1"/>
  <text x="20" y="150" font-size="15" fill="#222">扫描过程（ans 为累计答案）：</text>
  <text x="20" y="175" font-size="15" fill="#222">q=1, r=1：ans+=cnt[1]=0，cnt[1]=1</text>
  <text x="20" y="200" font-size="15" fill="#222">q=2, r=1：ans+=cnt[1]=1，cnt[1]=2</text>
  <text x="20" y="225" font-size="15" fill="#222">q=3, r=0：ans+=cnt[0]=1，ans=2，cnt[0]=2</text>
  <text x="20" y="250" font-size="15" fill="#222">q=4, r=0：ans+=cnt[0]=2，ans=4，cnt[0]=3</text>
  <text x="20" y="275" font-size="15" fill="#222">q=5, r=1：ans+=cnt[1]=2，ans=6，cnt[1]=3</text>
</svg>