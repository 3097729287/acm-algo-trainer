<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">相邻交换：i 在前 vs j 在前</text>
  <text x="20" y="65" font-size="16" fill="#111">i 在前贡献：(T+s_i+a_i) + (T+p_i+s_j+a_j)</text>
  <text x="20" y="95" font-size="16" fill="#111">j 在前贡献：(T+s_j+a_j) + (T+p_j+s_i+a_i)</text>
  <text x="20" y="125" font-size="16" fill="#111">差值 = p_i - p_j，故 p_i ≤ p_j 时 i 在前更优</text>
  <line x1="20" y1="145" x2="700" y2="145" stroke="#999" stroke-width="1"/>
  <text x="20" y="175" font-size="18" font-weight="bold" fill="#111">样例顺序 1,3,2 模拟</text>
  <rect x="20" y="195" width="200" height="60" fill="#d0e8ff" stroke="#333" stroke-width="1.5"/>
  <text x="30" y="220" font-size="15" fill="#111">同学1: s+a=20000, e=10000</text>
  <text x="30" y="242" font-size="15" fill="#111">发消息时刻 20000</text>
  <rect x="240" y="195" width="200" height="60" fill="#d0e8ff" stroke="#333" stroke-width="1.5"/>
  <text x="250" y="220" font-size="15" fill="#111">同学3: s+a=50000, e=30000</text>
  <text x="250" y="242" font-size="15" fill="#111">发消息时刻 80000</text>
  <rect x="460" y="195" width="200" height="60" fill="#d0e8ff" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="220" font-size="15" fill="#111">同学2: s+a=70000, e=20000</text>
  <text x="470" y="242" font-size="15" fill="#111">发消息时刻 180000</text>
  <text x="20" y="285" font-size="16" fill="#111">总和 = 20000 + 80000 + 180000 = 280000</text>
</svg>