<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><rect width="720" height="400" fill="#ffffff" /><text x="20" y="30" font-size="18" fill="#000000">E题：2×1010递增矩阵 ↔ Ballot路径</text><text x="20" y="60" font-size="16" fill="#000000">路径从(0,0)到(1010,1010)，任意前缀中上行次数≥下行次数</text><line x1="80" y1="340" x2="680" y2="340" stroke="#000000" stroke-width="2" /><line x1="80" y1="340" x2="80" y2="80" stroke="#000000" stroke-width="2" /><text x="680" y="370" font-size="16" fill="#000000">上行</text><text x="40" y="80" font-size="16" fill="#000000">下行</text><line x1="80" y1="340" x2="680" y2="80" stroke="#888888" stroke-width="2" stroke-dasharray="6,4" /><text x="500" y="120" font-size="16" fill="#888888">对角线 y=x</text><polyline points="80,340 200,340 200,220 320,220 320,100 440,100 440,80 560,80 560,80 680,80" fill="none" stroke="#0066cc" stroke-width="3" /><circle cx="80" cy="340" r="5" fill="#0066cc" /><circle cx="200" cy="340" r="5" fill="#0066cc" /><circle cx="200" cy="220" r="5" fill="#0066cc" /><circle cx="320" cy="220" r="5" fill="#0066cc" /><circle cx="320" cy="100" r="5" fill="#0066cc" /><circle cx="440" cy="100" r="5" fill="#0066cc" /><circle cx="440" cy="80" r="5" fill="#0066cc" /><circle cx="560" cy="80" r="5" fill="#0066cc" /><circle cx="680" cy="80" r="5" fill="#0066cc" /><text x="90" y="330" font-size="14" fill="#0066cc">(0,0)</text><text x="620" y="70" font-size="14" fill="#0066cc">(1010,1010)</text><text x="20" y="390" font-size="14" fill="#000000">dp[j]：已选j个下行，且任意前缀上行≥下行；转移dp[j]=(dp[j]+dp[j-1])%2020</text></svg>