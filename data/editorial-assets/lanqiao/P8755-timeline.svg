<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" fill="#000000">计算机1任务时间线</text>
  <line x1="50" y1="80" x2="650" y2="80" stroke="#000000" stroke-width="2"/>
  <text x="50" y="70" font-size="14" fill="#000000">1</text>
  <text x="150" y="70" font-size="14" fill="#000000">2</text>
  <text x="250" y="70" font-size="14" fill="#000000">3</text>
  <text x="350" y="70" font-size="14" fill="#000000">4</text>
  <text x="450" y="70" font-size="14" fill="#000000">5</text>
  <text x="550" y="70" font-size="14" fill="#000000">6</text>
  <text x="650" y="70" font-size="14" fill="#000000">7</text>
  <rect x="50" y="90" width="500" height="30" fill="#a0c4ff" stroke="#000000"/>
  <text x="200" y="110" font-size="14" fill="#000000">任务1: [1,6) 占用3</text>
  <rect x="350" y="130" width="100" height="30" fill="#ffd6a5" stroke="#000000"/>
  <text x="360" y="150" font-size="14" fill="#000000">任务4: [4,10) 占用1</text>
  <rect x="550" y="170" width="100" height="30" fill="#caffbf" stroke="#000000"/>
  <text x="560" y="190" font-size="14" fill="#000000">任务6: [6,9) 占用4</text>
  <text x="20" y="240" font-size="14" fill="#000000">时刻6：任务1结束释放3，任务4仍占用1，剩余4，接受任务6后占用5。</text>
</svg>