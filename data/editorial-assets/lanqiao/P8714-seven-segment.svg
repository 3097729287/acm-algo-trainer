<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"><rect width="720" height="380" fill="white" /><text x="20" y="30" font-family="sans-serif" font-size="20" fill="#172033">按原图的实际端点判断相邻，不跨越未亮的段</text><path d="M90,65L260,65" stroke="#2563eb" stroke-width="11" stroke-linecap="round" /><text x="175" y="55" font-family="sans-serif" font-size="22" fill="#172033">a</text><path d="M260,65L260,195" stroke="#2563eb" stroke-width="11" stroke-linecap="round" /><text x="305" y="120" font-family="sans-serif" font-size="22" fill="#172033">b</text><path d="M260,195L260,325" stroke="#2563eb" stroke-width="11" stroke-linecap="round" /><text x="305" y="240" font-family="sans-serif" font-size="22" fill="#172033">c</text><path d="M90,325L260,325" stroke="#2563eb" stroke-width="11" stroke-linecap="round" /><text x="175" y="360" font-family="sans-serif" font-size="22" fill="#172033">d</text><path d="M90,195L90,325" stroke="#2563eb" stroke-width="11" stroke-linecap="round" /><text x="65" y="240" font-family="sans-serif" font-size="22" fill="#172033">e</text><path d="M90,65L90,195" stroke="#2563eb" stroke-width="11" stroke-linecap="round" /><text x="65" y="120" font-family="sans-serif" font-size="22" fill="#172033">f</text><path d="M90,195L260,195" stroke="#2563eb" stroke-width="11" stroke-linecap="round" /><text x="175" y="175" font-family="sans-serif" font-size="22" fill="#172033">g</text><text x="370" y="100" font-family="sans-serif" font-size="20" fill="#172033">{b}：连通</text><text x="370" y="150" font-family="sans-serif" font-size="20" fill="#172033">{b,c,g}：同一端点相接</text><text x="370" y="200" font-family="sans-serif" font-size="20" fill="#172033">{b,f}：不连通</text><text x="370" y="250" font-family="sans-serif" font-size="20" fill="#172033">{d,g}：不连通</text><text x="370" y="315" font-family="sans-serif" font-size="20" fill="#172033">10 对相邻段；总计 80 种</text></svg>