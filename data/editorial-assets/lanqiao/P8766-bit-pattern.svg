<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"><rect width="720" height="280" fill="#f8f9fa" /><text x="20" y="30" font-size="18" font-weight="bold" fill="#212529">n=6 时合法三元组 (3,5,6) 的位模式</text><text x="20" y="70" font-size="16" fill="#212529">a = 3 = 011₂</text><text x="20" y="100" font-size="16" fill="#212529">b = 5 = 101₂</text><text x="20" y="130" font-size="16" fill="#212529">c = 6 = 110₂</text><text x="20" y="170" font-size="16" fill="#212529">逐位模式：</text><text x="20" y="200" font-size="16" fill="#212529">第2位：0,1,1 → 011</text><text x="20" y="225" font-size="16" fill="#212529">第1位：1,0,1 → 101</text><text x="20" y="250" font-size="16" fill="#212529">第0位：1,1,0 → 110</text><rect x="400" y="60" width="280" height="120" fill="#e9ecef" stroke="#495057" stroke-width="2" /><text x="420" y="90" font-size="16" fill="#212529">三种非零模式均出现</text><text x="420" y="120" font-size="16" fill="#212529">a&amp;b = 1 ≠ 0</text><text x="420" y="150" font-size="16" fill="#212529">a&amp;c = 2 ≠ 0</text><text x="420" y="180" font-size="16" fill="#212529">b&amp;c = 4 ≠ 0</text></svg>