<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#f8f9fa"/><text x="20" y="30" font-size="18" fill="#212529">线段树维护 v(l,r) 示意（r=3，排列 3 2 4 1）</text><text x="20" y="60" font-size="16" fill="#212529">叶子 l=1: v=0，l=2: v=1，l=3: v=0，l=4: 未激活(∞)</text><rect x="40" y="100" width="120" height="50" fill="#cfe2ff" stroke="#0d6efd"/><text x="70" y="130" font-size="16" fill="#084298">l=1: 0</text><rect x="200" y="100" width="120" height="50" fill="#fff3cd" stroke="#ffc107"/><text x="230" y="130" font-size="16" fill="#664d03">l=2: 1</text><rect x="360" y="100" width="120" height="50" fill="#cfe2ff" stroke="#0d6efd"/><text x="390" y="130" font-size="16" fill="#084298">l=3: 0</text><rect x="520" y="100" width="120" height="50" fill="#e9ecef" stroke="#6c757d"/><text x="550" y="130" font-size="16" fill="#495057">l=4: ∞</text><text x="20" y="200" font-size="16" fill="#212529">根节点最小值 = 0，出现次数 = 2（l=1 和 l=3）</text><text x="20" y="230" font-size="16" fill="#212529">因此以 r=3 结尾的连号区间有 2 个：[1,3] 和 [3,3]</text></svg>