<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#f8f9fa"/><text x="20" y="30" font-size="18" fill="#212529">连通性剪枝：剩余未访问格必须与当前格连通且包含终点</text><g transform="translate(50,60)"><rect x="0" y="0" width="200" height="200" fill="#ffffff" stroke="#343a40" stroke-width="2"/><rect x="0" y="0" width="66" height="66" fill="#adb5bd"/><rect x="67" y="0" width="66" height="66" fill="#adb5bd"/><rect x="134" y="0" width="66" height="66" fill="#adb5bd"/><rect x="0" y="67" width="66" height="66" fill="#adb5bd"/><rect x="67" y="67" width="66" height="66" fill="#0d6efd"/><rect x="134" y="67" width="66" height="66" fill="#adb5bd"/><rect x="0" y="134" width="66" height="66" fill="#adb5bd"/><rect x="67" y="134" width="66" height="66" fill="#adb5bd"/><rect x="134" y="134" width="66" height="66" fill="#adb5bd"/><text x="80" y="105" font-size="16" fill="#ffffff">当前</text><text x="10" y="20" font-size="14" fill="#212529">灰色：已访问</text><text x="10" y="190" font-size="14" fill="#212529">蓝色：当前格</text></g><g transform="translate(400,60)"><rect x="0" y="0" width="200" height="200" fill="#ffffff" stroke="#343a40" stroke-width="2"/><rect x="0" y="0" width="66" height="66" fill="#adb5bd"/><rect x="67" y="0" width="66" height="66" fill="#adb5bd"/><rect x="134" y="0" width="66" height="66" fill="#adb5bd"/><rect x="0" y="67" width="66" height="66" fill="#adb5bd"/><rect x="67" y="67" width="66" height="66" fill="#0d6efd"/><rect x="134" y="67" width="66" height="66" fill="#adb5bd"/><rect x="0" y="134" width="66" height="66" fill="#adb5bd"/><rect x="67" y="134" width="66" height="66" fill="#adb5bd"/><rect x="134" y="134" width="66" height="66" fill="#adb5bd"/><text x="80" y="105" font-size="16" fill="#ffffff">当前</text><text x="10" y="20" font-size="14" fill="#212529">灰色：已访问</text><text x="10" y="190" font-size="14" fill="#212529">蓝色：当前格</text></g><text x="50" y="280" font-size="16" fill="#212529">若剩余未访问格与当前格不连通，或终点不可达，则剪枝</text></svg>