<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#ffffff"/>
  <line x1="0" y1="200" x2="720" y2="200" stroke="#cccccc" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="400" stroke="#cccccc" stroke-width="1"/>
  <text x="365" y="195" font-size="14" fill="#666666">x</text>
  <text x="365" y="15" font-size="14" fill="#666666">y</text>
  <line x1="0" y1="400" x2="720" y2="0" stroke="#e74c3c" stroke-width="2"/>
  <line x1="0" y1="400" x2="720" y2="0" stroke="#2ecc71" stroke-width="2" transform="translate(0,0)"/>
  <line x1="0" y1="400" x2="720" y2="0" stroke="#3498db" stroke-width="2" transform="translate(0,0)"/>
  <circle cx="360" cy="200" r="5" fill="#000000"/>
  <text x="370" y="220" font-size="14" fill="#000000">(-1,0)</text>
  <text x="10" y="30" font-size="14" fill="#e74c3c">y=x+1</text>
  <text x="10" y="50" font-size="14" fill="#2ecc71">y=2x+2</text>
  <text x="10" y="70" font-size="14" fill="#3498db">y=3x+3</text>
</svg>