<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#f8f9fa"/><text x="20" y="30" font-size="18" fill="#212529">直线 Ax+By+C=0 的最简表示</text><text x="20" y="70" font-size="16" fill="#212529">点 (0,0) 与 (1,2)：A=2, B=-1, C=0</text><text x="20" y="100" font-size="16" fill="#212529">gcd(|2|,|-1|,|0|)=1，已最简</text><text x="20" y="130" font-size="16" fill="#212529">符号规范：A>0，保留 (2,-1,0)</text><text x="20" y="170" font-size="16" fill="#212529">点 (0,0) 与 (2,4)：A=4, B=-2, C=0</text><text x="20" y="200" font-size="16" fill="#212529">gcd=2，约分得 (2,-1,0)，与上同一直线</text><text x="20" y="240" font-size="16" fill="#212529">集合去重后只计一次</text></svg>