<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><rect width="720" height="400" fill="white"/><text x="30" y="30" font-family="sans-serif" font-size="19" fill="#172033">原题小例子 AB/BC：从每个格子出发可随时停止</text><rect x="70" y="75" width="180" height="95" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="85" y="107" font-family="sans-serif" font-size="24" fill="#172033">A</text><text x="85" y="145" font-family="sans-serif" font-size="20" fill="#172033">f=1+2+2=5</text><rect x="340" y="75" width="180" height="95" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="355" y="107" font-family="sans-serif" font-size="24" fill="#172033">B</text><text x="355" y="145" font-family="sans-serif" font-size="20" fill="#172033">f=1+1=2</text><rect x="70" y="235" width="180" height="95" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="85" y="267" font-family="sans-serif" font-size="24" fill="#172033">B</text><text x="85" y="305" font-family="sans-serif" font-size="20" fill="#172033">f=1+1=2</text><rect x="340" y="235" width="180" height="95" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="355" y="267" font-family="sans-serif" font-size="24" fill="#172033">C</text><text x="355" y="305" font-family="sans-serif" font-size="20" fill="#172033">f=1</text><path d="M260,120H330M160,180V225M430,180V225M260,280H330" fill="none" stroke="#15803d" stroke-width="3"/><text x="550" y="155" font-family="sans-serif" font-size="18" fill="#172033">总数</text><text x="540" y="190" font-family="sans-serif" font-size="18" fill="#172033">5+2+2+1</text><text x="570" y="225" font-family="sans-serif" font-size="24" fill="#172033">=10</text><text x="50" y="375" font-family="sans-serif" font-size="16" fill="#172033">移动只走向更大的字母；每个格子先计“立即停下”的1种。</text></svg>