<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" fill="#222">样例图：节点与边（括号内为长度，d=1 表示有限高杆）</text>
  <line x1="100" y1="100" x2="220" y2="100" stroke="#333" stroke-width="2"/>
  <text x="140" y="90" font-size="14" fill="#333">1 (d=0)</text>
  <line x1="220" y1="100" x2="340" y2="100" stroke="#c00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="250" y="90" font-size="14" fill="#c00">2 (d=1)</text>
  <line x1="100" y1="100" x2="340" y2="100" stroke="#333" stroke-width="2"/>
  <text x="190" y="130" font-size="14" fill="#333">9 (d=0)</text>
  <line x1="340" y1="100" x2="460" y2="100" stroke="#333" stroke-width="2"/>
  <text x="370" y="90" font-size="14" fill="#333">8 (d=0)</text>
  <line x1="340" y1="100" x2="460" y2="220" stroke="#c00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="380" y="170" font-size="14" fill="#c00">5 (d=1)</text>
  <line x1="460" y1="220" x2="580" y2="220" stroke="#333" stroke-width="2"/>
  <text x="490" y="210" font-size="14" fill="#333">4 (d=0)</text>
  <line x1="340" y1="100" x2="460" y2="220" stroke="#333" stroke-width="2"/>
  <text x="360" y="190" font-size="14" fill="#333">9 (d=0)</text>
  <circle cx="100" cy="100" r="18" fill="#e8f0fe" stroke="#333"/>
  <text x="94" y="106" font-size="16" fill="#222">1</text>
  <circle cx="220" cy="100" r="18" fill="#e8f0fe" stroke="#333"/>
  <text x="214" y="106" font-size="16" fill="#222">2</text>
  <circle cx="340" cy="100" r="18" fill="#e8f0fe" stroke="#333"/>
  <text x="334" y="106" font-size="16" fill="#222">3</text>
  <circle cx="460" cy="220" r="18" fill="#e8f0fe" stroke="#333"/>
  <text x="454" y="226" font-size="16" fill="#222">4</text>
  <circle cx="580" cy="220" r="18" fill="#e8f0fe" stroke="#333"/>
  <text x="574" y="226" font-size="16" fill="#222">5</text>
  <text x="20" y="300" font-size="16" fill="#222">原最短路（只走 d=0）：1-3-5，长度 9+8=17</text>
  <text x="20" y="330" font-size="16" fill="#222">拆除后最短路：1-2-3-5，长度 1+2+8=11，减少 6</text>
</svg>