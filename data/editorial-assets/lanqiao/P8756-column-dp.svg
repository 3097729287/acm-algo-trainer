<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="720" height="300" fill="#f8f9fa"/><text x="20" y="30" font-size="18" fill="#212529">列距 1：行差 2 冲突（recent 与 next）</text><text x="20" y="60" font-size="16" fill="#495057">列距 2：行差 1 冲突（older 与 next）</text><g transform="translate(40,90)"><rect x="0" y="0" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><rect x="0" y="40" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><rect x="0" y="80" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><rect x="0" y="120" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><text x="18" y="25" font-size="14" fill="#212529">older</text><rect x="100" y="0" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><rect x="100" y="40" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><rect x="100" y="80" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><rect x="100" y="120" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><text x="118" y="25" font-size="14" fill="#212529">recent</text><rect x="200" y="0" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><rect x="200" y="40" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><rect x="200" y="80" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><rect x="200" y="120" width="60" height="40" fill="#e9ecef" stroke="#343a40"/><text x="218" y="25" font-size="14" fill="#212529">next</text><circle cx="130" cy="20" r="8" fill="#0d6efd"/><circle cx="230" cy="100" r="8" fill="#dc3545"/><line x1="138" y1="20" x2="222" y2="100" stroke="#dc3545" stroke-width="2" stroke-dasharray="5,3"/><text x="150" y="70" font-size="14" fill="#dc3545">行差 2</text><circle cx="30" cy="60" r="8" fill="#198754"/><circle cx="230" cy="100" r="8" fill="#dc3545"/><line x1="38" y1="60" x2="222" y2="100" stroke="#198754" stroke-width="2" stroke-dasharray="5,3"/><text x="80" y="110" font-size="14" fill="#198754">行差 1</text></g><text x="40" y="270" font-size="14" fill="#495057">蓝点：recent 中的马；绿点：older 中的马；红点：next 中的马。虚线表示攻击关系。</text></svg>