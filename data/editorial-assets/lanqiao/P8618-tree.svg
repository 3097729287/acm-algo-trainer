<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#f8f9fa"/>
  <style>
    .node { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .text { font-family: sans-serif; font-size: 16px; fill: #222222; text-anchor: middle; dominant-baseline: middle; }
    .small { font-family: sans-serif; font-size: 14px; fill: #555555; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #333333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
  <!-- 根节点 -->
  <rect x="300" y="20" width="120" height="50" rx="8" class="node"/>
  <text x="360" y="45" class="text">[1,3] sum=15 mx=6</text>
  <!-- 左子节点 -->
  <rect x="120" y="120" width="120" height="50" rx="8" class="node"/>
  <text x="180" y="145" class="text">[1,2] sum=11 mx=6</text>
  <!-- 右子节点 -->
  <rect x="480" y="120" width="120" height="50" rx="8" class="node"/>
  <text x="540" y="145" class="text">[3,3] sum=4 mx=4</text>
  <!-- 叶子1 -->
  <rect x="40" y="240" width="100" height="50" rx="8" class="node"/>
  <text x="90" y="265" class="text">[1] 5</text>
  <!-- 叶子2 -->
  <rect x="200" y="240" width="100" height="50" rx="8" class="node"/>
  <text x="250" y="265" class="text">[2] 6</text>
  <!-- 叶子3 -->
  <rect x="480" y="240" width="100" height="50" rx="8" class="node"/>
  <text x="530" y="265" class="text">[3] 4</text>
  <!-- 连线 -->
  <line x1="330" y1="70" x2="210" y2="120" class="arrow"/>
  <line x1="390" y1="70" x2="510" y2="120" class="arrow"/>
  <line x1="150" y1="170" x2="100" y2="240" class="arrow"/>
  <line x1="210" y1="170" x2="240" y2="240" class="arrow"/>
  <line x1="540" y1="170" x2="530" y2="240" class="arrow"/>
  <!-- 说明文字 -->
  <text x="360" y="350" class="small">初始序列 [5,6,4]，根节点 sum=15，mx=6</text>
  <text x="360" y="375" class="small">操作 [1,2] 后，位置 1、2 变为 3，序列 [3,3,4]，根节点 sum=10</text>
</svg>