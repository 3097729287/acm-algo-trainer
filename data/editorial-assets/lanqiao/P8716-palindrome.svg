<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220"><rect width="720" height="220" fill="#ffffff"/><text x="20" y="30" font-size="18" fill="#222">普通回文日期：年份 y 与 rev4(y) 拼接</text><rect x="40" y="70" width="120" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="70" y="102" font-size="22" fill="#1e3a8a">2021</text><text x="175" y="102" font-size="22" fill="#222">→</text><rect x="210" y="70" width="120" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="240" y="102" font-size="22" fill="#14532d">1202</text><text x="345" y="102" font-size="22" fill="#222">→</text><rect x="380" y="70" width="200" height="50" fill="#fef3c7" stroke="#d97706"/><text x="405" y="102" font-size="22" fill="#78350f">20211202</text><text x="40" y="160" font-size="16" fill="#444">年份 2021 反转得 1202，月份 12、日期 02 合法。</text><text x="40" y="190" font-size="16" fill="#444">候选 20211202 大于 20200202，所以是下一个回文日期。</text></svg>