<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#f8f9fa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#212529">样例操作栈压缩结果</text>
  <rect x="20" y="50" width="120" height="40" fill="#cfe2ff" stroke="#0d6efd"/>
  <text x="50" y="75" font-size="16" fill="#084298">(0,3)</text>
  <rect x="160" y="50" width="120" height="40" fill="#d1e7dd" stroke="#198754"/>
  <text x="190" y="75" font-size="16" fill="#0f5132">(1,2)</text>
  <rect x="300" y="50" width="120" height="40" fill="#cfe2ff" stroke="#0d6efd"/>
  <text x="330" y="75" font-size="16" fill="#084298">(0,2)</text>
  <text x="20" y="130" font-size="16" font-weight="bold" fill="#212529">填充过程（value 从 3 递减）</text>
  <text x="20" y="160" font-size="15" fill="#212529">初始：a = [1, 2, 3]</text>
  <text x="20" y="190" font-size="15" fill="#212529">处理 (0,3)：q=3，右侧无位置，不填</text>
  <text x="20" y="220" font-size="15" fill="#212529">处理 (0,3) 填位置 1：a[1]=3，value=2</text>
  <text x="20" y="250" font-size="15" fill="#212529">处理 (1,2) 填位置 3：a[3]=2，value=1</text>
  <text x="20" y="280" font-size="15" fill="#212529">处理 (0,2) 填位置 2：a[2]=1，value=0</text>
  <text x="400" y="160" font-size="15" fill="#212529">最终：a = [3, 1, 2]</text>
</svg>