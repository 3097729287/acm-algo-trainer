<svg xmlns="http://www.w3.org/2000/svg" width="870" height="565" viewBox="0 0 870 565" role="img"><title>版本标记、内存旧值与真实数组的同步变化</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="23" fill="#20334a" text-anchor="start">初值 [2,4]、h=6：内存值过期，不代表真实数组仍超限</text><text x="25" y="82" font-size="20" fill="#20334a" text-anchor="start">本步结束后</text><text x="315" y="82" font-size="20" fill="#20334a" text-anchor="start">cur（stamp）</text><text x="590" y="82" font-size="20" fill="#20334a" text-anchor="start">ver</text><text x="685" y="82" font-size="20" fill="#20334a" text-anchor="start">真实数组</text><text x="25" y="137" font-size="19" fill="#20334a" text-anchor="start">初始</text><rect x="300" y="107" width="235" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="320" y="137" font-size="23" fill="#20334a" text-anchor="start">2(0)   4(0)</text><text x="605" y="137" font-size="24" fill="#20334a" text-anchor="start">0</text><rect x="670" y="107" width="150" height="44" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="745" y="137" font-size="24" fill="#20334a" text-anchor="middle">[2,4]</text><text x="25" y="205" font-size="19" fill="#20334a" text-anchor="start">① 第一项 +3</text><rect x="300" y="175" width="235" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="320" y="205" font-size="23" fill="#20334a" text-anchor="start">5(0)   4(0)</text><text x="605" y="205" font-size="24" fill="#20334a" text-anchor="start">0</text><rect x="670" y="175" width="150" height="44" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="745" y="205" font-size="24" fill="#20334a" text-anchor="middle">[5,4]</text><text x="25" y="273" font-size="19" fill="#20334a" text-anchor="start">② 第二项 +2</text><rect x="300" y="243" width="235" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="320" y="273" font-size="23" fill="#20334a" text-anchor="start">5(0)   6(0)</text><text x="605" y="273" font-size="24" fill="#20334a" text-anchor="start">0</text><rect x="670" y="243" width="150" height="44" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="745" y="273" font-size="24" fill="#20334a" text-anchor="middle">[5,6]</text><text x="25" y="341" font-size="19" fill="#20334a" text-anchor="start">③ 第一项 +2 → 崩溃</text><rect x="300" y="311" width="235" height="44" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="320" y="341" font-size="23" fill="#20334a" text-anchor="start">7(0)   6(0)</text><text x="605" y="341" font-size="24" fill="#20334a" text-anchor="start">1</text><rect x="670" y="311" width="150" height="44" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="745" y="341" font-size="24" fill="#20334a" text-anchor="middle">[2,4]</text><text x="25" y="409" font-size="19" fill="#20334a" text-anchor="start">④ 第二项 +1</text><rect x="300" y="379" width="235" height="44" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="320" y="409" font-size="23" fill="#20334a" text-anchor="start">7(0)   5(1)</text><text x="605" y="409" font-size="24" fill="#20334a" text-anchor="start">1</text><rect x="670" y="379" width="150" height="44" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="745" y="409" font-size="24" fill="#20334a" text-anchor="middle">[2,5]</text><text x="25" y="485" font-size="21" fill="#20334a" text-anchor="start">③ 七和六都属旧版，真实值已全回初值；等于六的②不崩溃</text><text x="25" y="531" font-size="21" fill="#20334a" text-anchor="start">④ 先识别旧标记：第二项恢复四再加一；第一项输出初值二</text></g></svg>