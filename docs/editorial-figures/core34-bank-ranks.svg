<svg xmlns="http://www.w3.org/2000/svg" width="760" height="790" viewBox="0 0 760 790" role="img"><title>六道题按唯一身份从初始库零移二五到库一，库零一三四六库一二五库二空，排名二走一步分别取三与五</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#12365a" font-size="24" text-anchor="start">移动题2、题5到库1；题号不是排名</text><text x="24" y="84" fill="#12365a" font-size="22" text-anchor="start">n=3，m=6；最初1到6全在库0</text><text x="24" y="167" fill="#12365a" font-size="23" text-anchor="start">库0</text><rect x="145" y="128" width="104" height="60" rx="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="197" y="167" fill="#12365a" font-size="23" text-anchor="middle">题1</text><text x="197" y="217" fill="#12365a" font-size="19" text-anchor="middle">排名1</text><rect x="275" y="128" width="104" height="60" rx="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="327" y="167" fill="#12365a" font-size="23" text-anchor="middle">题3</text><text x="327" y="217" fill="#12365a" font-size="19" text-anchor="middle">排名2</text><rect x="405" y="128" width="104" height="60" rx="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="457" y="167" fill="#12365a" font-size="23" text-anchor="middle">题4</text><text x="457" y="217" fill="#12365a" font-size="19" text-anchor="middle">排名3</text><rect x="535" y="128" width="104" height="60" rx="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="587" y="167" fill="#12365a" font-size="23" text-anchor="middle">题6</text><text x="587" y="217" fill="#12365a" font-size="19" text-anchor="middle">排名4</text><text x="24" y="291" fill="#12365a" font-size="23" text-anchor="start">库1</text><rect x="145" y="252" width="104" height="60" rx="7" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="197" y="291" fill="#12365a" font-size="23" text-anchor="middle">题2</text><text x="197" y="341" fill="#12365a" font-size="19" text-anchor="middle">排名1</text><rect x="275" y="252" width="104" height="60" rx="7" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="327" y="291" fill="#12365a" font-size="23" text-anchor="middle">题5</text><text x="327" y="341" fill="#12365a" font-size="19" text-anchor="middle">排名2</text><text x="24" y="415" fill="#12365a" font-size="23" text-anchor="start">库2</text><text x="153" y="415" fill="#12365a" font-size="21" text-anchor="start">空：任何合法正排名都不存在</text><text x="24" y="536" fill="#12365a" font-size="21" text-anchor="start">查“2 2 0”：库0的begin在题1，走1步到题3。</text><text x="24" y="589" fill="#12365a" font-size="22" text-anchor="start">查“2 2 1”：库1第2小是题5。</text><text x="24" y="642" fill="#12365a" font-size="21" text-anchor="start">查“2 1 2”：库2数量0小于1，先输出−1。</text><text x="24" y="695" fill="#12365a" font-size="21" text-anchor="start">where[2]=1、where[5]=1；其余归属仍是0。</text><text x="24" y="748" fill="#12365a" font-size="22" text-anchor="start">每道题只在一个库内；移动不会复制题目。</text></svg>