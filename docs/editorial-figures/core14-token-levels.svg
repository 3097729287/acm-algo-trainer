ct x="439" y="259" width="70" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="474" y="288" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="533" y="259" width="70" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="568" y="288" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="24" y="349" font-size="20" fill="#20334a" text-anchor="start">最终a</text><rect x="157" y="321" width="70" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="192" y="350" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="251" y="321" width="70" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="286" y="350" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="345" y="321" width="70" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="380" y="350" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="439" y="321" width="70" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="474" y="350" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="533" y="321" width="70" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="568" y="350" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="24" y="422" font-size="21" fill="#20334a" text-anchor="start">中央两侧都要求3，只取同一个3，不能相加成6。</text><text x="24" y="467" font-size="21" fill="#20334a" text-anchor="start">最终1&lt;2&lt;3&gt;2&gt;1，每条相邻约束同时满足。</text><text x="24" y="512" font-size="20" fill="#20334a" text-anchor="start">所有位置都达到两边下界的最大值，总和9最小。</text><text x="24" y="557" font-size="20" fill="#20334a" text-anchor="start">相等的c无需相等等级；端点只检查真实邻居。</text></g></svg>