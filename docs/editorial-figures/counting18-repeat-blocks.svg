<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img"><title>真实重复的字符块、块位权消失及短串实际跨过长度阈值</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247b65"/></marker></defs><rect width="640" height="940" fill="#f7fafc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="35" font-size="23" text-anchor="start" fill="#123750">每一项对应一整份 cc，从右往左编号</text><text x="24" y="78" font-size="19" text-anchor="start" fill="#123750">s=c，p13；第一轮重复二份得到cc</text><rect x="50" y="112" width="110" height="48" rx="6" fill="#cfe3f5" stroke="#91a9be"/><text x="105.0" y="143.0" font-size="20" text-anchor="middle" fill="#123750">c</text><path d="M175 136 L265 136" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="112" width="210" height="48" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="385.0" y="143.0" font-size="20" text-anchor="middle" fill="#123750">c | c</text><text x="24" y="202" font-size="19" text-anchor="start" fill="#123750">第二轮：五十四份 cc，共一百零八字符</text><rect x="20" y="260" width="100" height="56" rx="6" fill="#e8edf1" stroke="#91a9be"/><text x="70" y="294" font-size="18" text-anchor="middle" fill="#123750">前47份</text><text x="162" y="246" font-size="17" text-anchor="middle" fill="#123750">j=6</text><rect x="130" y="260" width="64" height="56" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="162.0" y="295.0" font-size="20" text-anchor="middle" fill="#123750">cc</text><text x="162" y="352" font-size="17" text-anchor="middle" fill="#123750">0</text><text x="232" y="246" font-size="17" text-anchor="middle" fill="#123750">j=5</text><rect x="200" y="260" width="64" height="56" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="232.0" y="295.0" font-size="20" text-anchor="middle" fill="#123750">cc</text><text x="232" y="352" font-size="17" text-anchor="middle" fill="#123750">6144</text><text x="302" y="246" font-size="17" text-anchor="middle" fill="#123750">j=4</text><rect x="270" y="260" width="64" height="56" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="302.0" y="295.0" font-size="20" text-anchor="middle" fill="#123750">cc</text><text x="302" y="352" font-size="17" text-anchor="middle" fill="#123750">5632</text><text x="372" y="246" font-size="17" text-anchor="middle" fill="#123750">j=3</text><rect x="340" y="260" width="64" height="56" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="372.0" y="295.0" font-size="20" text-anchor="middle" fill="#123750">cc</text><text x="372" y="352" font-size="17" text-anchor="middle" fill="#123750">384</text><text x="442" y="246" font-size="17" text-anchor="middle" fill="#123750">j=2</text><rect x="410" y="260" width="64" height="56" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="442.0" y="295.0" font-size="20" text-anchor="middle" fill="#123750">cc</text><text x="442" y="352" font-size="17" text-anchor="middle" fill="#123750">2400</text><text x="512" y="246" font-size="17" text-anchor="middle" fill="#123750">j=1</text><rect x="480" y="260" width="64" height="56" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="512.0" y="295.0" font-size="20" text-anchor="middle" fill="#123750">cc</text><text x="512" y="352" font-size="17" text-anchor="middle" fill="#123750">3736</text><text x="582" y="246" font-size="17" text-anchor="middle" fill="#123750">j=0</text><rect x="550" y="260" width="64" height="56" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="582.0" y="295.0" font-size="20" text-anchor="middle" fill="#123750">cc</text><text x="582" y="352" font-size="17" text-anchor="middle" fill="#123750">54</text><text x="24" y="397" font-size="19" text-anchor="start" fill="#123750">绿色每格含两个字符；灰框合并前47份</text><text x="24" y="447" font-size="19" text-anchor="start" fill="#123750">右起j份：块位权26^(2j)，再乘块值54</text><text x="24" y="496" font-size="19" text-anchor="start" fill="#123750">j≥7的47份：指数≥14，全为8192倍数</text><text x="24" y="545" font-size="19" text-anchor="start" fill="#123750">七份合计18350；模8192得到1966</text><text x="24" y="594" font-size="19" text-anchor="start" fill="#123750">j6的块位权4096并非零，但乘54后为零</text><path d="M24 632 L616 632" fill="none" stroke="#536c7e" stroke-width="2"/><text x="24" y="678" font-size="22" text-anchor="start" fill="#123750">份数与长度不能由余数代替</text><text x="24" y="723" font-size="19" text-anchor="start" fill="#123750">p5，aaac长四、值二；k至少二</text><rect x="55" y="760" width="170" height="48" rx="6" fill="#cfe3f5" stroke="#91a9be"/><text x="140.0" y="791.0" font-size="20" text-anchor="middle" fill="#123750">aaac</text><path d="M240 784 L310 784" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="760" width="260" height="48" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="455.0" y="791.0" font-size="20" text-anchor="middle" fill="#123750">aaac | aaac</text><text x="24" y="856" font-size="19" text-anchor="start" fill="#123750">实际拼接长八≥五；下一轮块因子为零</text><text x="24" y="902" font-size="19" text-anchor="start" fill="#123750">前导a占字符位：数值仍二，长度已经变</text></g></svg>