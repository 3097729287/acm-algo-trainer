<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1218" viewBox="0 0 640 1218" role="img"><title>真实末段、两个极值栈区间与完整最终候选比较</title><rect width="640" height="1218" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="35" class="title" text-anchor="start">六个实际数：每个断点一份候选</text><text x="24" y="78" class="small" text-anchor="start">最终切在第三项后：极差3+2=5</text><text x="105" y="116" class="small" text-anchor="middle">1</text><rect x="75" y="134" width="60" height="44" rx="5" fill="#c0e8cd" stroke="#7394aa"/><text x="105.0" y="163.0" class="" text-anchor="middle">1</text><text x="191" y="116" class="small" text-anchor="middle">2</text><rect x="161" y="134" width="60" height="44" rx="5" fill="#c0e8cd" stroke="#7394aa"/><text x="191.0" y="163.0" class="" text-anchor="middle">4</text><text x="277" y="116" class="small" text-anchor="middle">3</text><rect x="247" y="134" width="60" height="44" rx="5" fill="#c0e8cd" stroke="#7394aa"/><text x="277.0" y="163.0" class="" text-anchor="middle">2</text><text x="363" y="116" class="small" text-anchor="middle">4</text><rect x="333" y="134" width="60" height="44" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="363.0" y="163.0" class="" text-anchor="middle">8</text><text x="449" y="116" class="small" text-anchor="middle">5</text><rect x="419" y="134" width="60" height="44" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="449.0" y="163.0" class="" text-anchor="middle">7</text><text x="535" y="116" class="small" text-anchor="middle">6</text><rect x="505" y="134" width="60" height="44" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="535.0" y="163.0" class="" text-anchor="middle">9</text><line x1="318" y1="125" x2="318" y2="189" stroke="#b54d3b" stroke-width="3" stroke-dasharray=""/><text x="24" y="241" class="small" text-anchor="start">加入八：旧后缀按最大值分成两块</text><rect x="111" y="268" width="70" height="44" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="146.0" y="297.0" class="" text-anchor="middle">1</text><rect x="264" y="268" width="70" height="44" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="299.0" y="297.0" class="" text-anchor="middle">4</text><rect x="417" y="268" width="70" height="44" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="452.0" y="297.0" class="" text-anchor="middle">2</text><line x1="111" y1="332" x2="334" y2="332" stroke="#41768f" stroke-width="3" stroke-dasharray=""/><text x="223" y="371" class="small" text-anchor="middle">旧最大4，j0..1加(8−4)=4</text><line x1="417" y1="332" x2="487" y2="332" stroke="#41768f" stroke-width="3" stroke-dasharray=""/><text x="469" y="409" class="small" text-anchor="middle">j2加(8−2)=6</text><text x="24" y="466" class="small" text-anchor="start">加入七：末段从[8]变[8,7]，j3加1</text><text x="24" y="510" class="small" text-anchor="start">候选3→4；最小值8降到7，极差反而增一</text><text x="24" y="566" class="small" text-anchor="start">九到来：j4加2，j0..3加1，j3最终为5</text><text x="25" y="628" class="small" text-anchor="start">断点</text><text x="116" y="628" class="small" text-anchor="start">前缀dp</text><text x="267" y="628" class="small" text-anchor="start">真实末段</text><text x="467" y="628" class="small" text-anchor="start">极差</text><text x="556" y="628" class="small" text-anchor="start">候选</text><rect x="18" y="653" width="602" height="57" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="47" y="689" class="small" text-anchor="middle">0</text><text x="147" y="689" class="small" text-anchor="middle">0</text><text x="333" y="689" class="small" text-anchor="middle">1/4/2/8/7/9</text><text x="490" y="689" class="small" text-anchor="middle">8</text><text x="578" y="689" class="small" text-anchor="middle">8</text><rect x="18" y="724" width="602" height="57" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="47" y="760" class="small" text-anchor="middle">1</text><text x="147" y="760" class="small" text-anchor="middle">∞</text><text x="333" y="760" class="small" text-anchor="middle">4/2/8/7/9</text><text x="490" y="760" class="small" text-anchor="middle">7</text><text x="578" y="760" class="small" text-anchor="middle">∞</text><rect x="18" y="795" width="602" height="57" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="47" y="831" class="small" text-anchor="middle">2</text><text x="147" y="831" class="small" text-anchor="middle">3</text><text x="333" y="831" class="small" text-anchor="middle">2/8/7/9</text><text x="490" y="831" class="small" text-anchor="middle">7</text><text x="578" y="831" class="small" text-anchor="middle">10</text><rect x="18" y="866" width="602" height="57" rx="5" fill="#c0e8cd" stroke="#7394aa"/><text x="47" y="902" class="small" text-anchor="middle">3</text><text x="147" y="902" class="small" text-anchor="middle">3</text><text x="333" y="902" class="small" text-anchor="middle">8/7/9</text><text x="490" y="902" class="small" text-anchor="middle">2</text><text x="578" y="902" class="small" text-anchor="middle">5</text><rect x="18" y="937" width="602" height="57" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="47" y="973" class="small" text-anchor="middle">4</text><text x="147" y="973" class="small" text-anchor="middle">7</text><text x="333" y="973" class="small" text-anchor="middle">7/9</text><text x="490" y="973" class="small" text-anchor="middle">2</text><text x="578" y="973" class="small" text-anchor="middle">9</text><rect x="18" y="1008" width="602" height="57" rx="5" fill="#ffd1ca" stroke="#7394aa"/><text x="47" y="1044" class="small" text-anchor="middle">5</text><text x="147" y="1044" class="small" text-anchor="middle">4</text><text x="333" y="1044" class="small" text-anchor="middle">9</text><text x="490" y="1044" class="small" text-anchor="middle">0</text><text x="578" y="1044" class="small" text-anchor="middle">4</text><text x="24" y="1132" class="" text-anchor="start">断点五的4来自单元素末段，禁止参与最小值</text><text x="24" y="1179" class="" text-anchor="start">只查j0..4得到5；两个栈都不删除实际断点</text></svg>