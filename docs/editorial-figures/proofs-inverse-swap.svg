<svg xmlns="http://www.w3.org/2000/svg" width="720" height="742" viewBox="0 0 720 742" role="img"><title>排列位置一三交换前后的完整双向对应，仅数字一二的位置改变</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="38" font-size="23" fill="#20334a" text-anchor="start">交换当前排列的位置 1、3；箭头连接位置与数值</text><text x="26" y="99" font-size="23" fill="#20334a" text-anchor="start">交换前</text><text x="150" y="99" font-size="20" fill="#20334a" text-anchor="start">上排位置（P 下标）→下排数字（I 下标）</text><rect x="125" y="121" width="62" height="46" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="156" y="152" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="125" y="229" width="62" height="46" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="156" y="260" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="295" y="121" width="62" height="46" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="326" y="152" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="295" y="229" width="62" height="46" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="326" y="260" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="465" y="121" width="62" height="46" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="496" y="152" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="465" y="229" width="62" height="46" rx="8" fill="#f1f5f9" stroke="#087b48" stroke-width="2"/><text x="496" y="260" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="635" y="121" width="62" height="46" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="666" y="152" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="635" y="229" width="62" height="46" rx="8" fill="#f1f5f9" stroke="#087b48" stroke-width="2"/><text x="666" y="260" font-size="24" fill="#20334a" text-anchor="middle">4</text><path d="M156,170 L326,226" fill="none" stroke="#a32e36" stroke-width="3"/><polygon points="326,226 314.93768431483977,227.6202381559073 318.06642006417803,218.1222903454162" fill="#a32e36"/><path d="M326,170 L666,226" fill="none" stroke="#8290a2" stroke-width="3"/><polygon points="666,226 655.3203600431536,229.3083667257622 656.9455226452824,219.4413080699802" fill="#8290a2"/><path d="M496,170 L156,226" fill="none" stroke="#a32e36" stroke-width="3"/><polygon points="156,226 165.05447735471756,219.4413080699802 166.67963995684636,229.3083667257622" fill="#a32e36"/><path d="M666,170 L496,226" fill="none" stroke="#8290a2" stroke-width="3"/><polygon points="496,226 503.93357993582197,218.1222903454162 507.06231568516023,227.6202381559073" fill="#8290a2"/><text x="26" y="304" font-size="21" fill="#20334a" text-anchor="start">P = [2, 4, 1, 3]；I = [3, 1, 4, 2]</text><text x="26" y="362" font-size="23" fill="#20334a" text-anchor="start">交换后</text><text x="150" y="362" font-size="20" fill="#20334a" text-anchor="start">上排位置（P 下标）→下排数字（I 下标）</text><rect x="125" y="384" width="62" height="46" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="156" y="415" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="125" y="492" width="62" height="46" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="156" y="523" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="295" y="384" width="62" height="46" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="326" y="415" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="295" y="492" width="62" height="46" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="326" y="523" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="465" y="384" width="62" height="46" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="496" y="415" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="465" y="492" width="62" height="46" rx="8" fill="#f1f5f9" stroke="#087b48" stroke-width="2"/><text x="496" y="523" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="635" y="384" width="62" height="46" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="666" y="415" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="635" y="492" width="62" height="46" rx="8" fill="#f1f5f9" stroke="#087b48" stroke-width="2"/><text x="666" y="523" font-size="24" fill="#20334a" text-anchor="middle">4</text><path d="M156,433 L156,489" fill="none" stroke="#a32e36" stroke-width="3"/><polygon points="156,489 151.0,479.0 161.0,479.0" fill="#a32e36"/><path d="M326,433 L666,489" fill="none" stroke="#8290a2" stroke-width="3"/><polygon points="666,489 655.3203600431536,492.3083667257622 656.9455226452824,482.4413080699802" fill="#8290a2"/><path d="M496,433 L326,489" fill="none" stroke="#a32e36" stroke-width="3"/><polygon points="326,489 333.93357993582197,481.12229034541616 337.06231568516023,490.6202381559073" fill="#a32e36"/><path d="M666,433 L496,489" fill="none" stroke="#8290a2" stroke-width="3"/><polygon points="496,489 503.93357993582197,481.12229034541616 507.06231568516023,490.6202381559073" fill="#8290a2"/><text x="26" y="567" font-size="21" fill="#20334a" text-anchor="start">P = [1, 4, 2, 3]；I = [1, 3, 4, 2]</text><rect x="22" y="619" width="676" height="98" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="39" y="657" font-size="22" fill="#06613b" text-anchor="start">交换后：I[P[1]]=I[1]=1；I[P[3]]=I[2]=3</text><text x="39" y="692" font-size="21" fill="#20334a" text-anchor="start">数字 3、4 没有移动；它们的逆表记录保持原样</text></g></svg>