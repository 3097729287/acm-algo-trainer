e-width="2"/><text x="634" y="297" font-size="22" fill="#20334a" text-anchor="middle">7</text><text x="378" y="388" font-size="20" fill="#20334a" text-anchor="start">9只有素因子3，会连带3→2</text><text x="378" y="435" font-size="20" fill="#20334a" text-anchor="start">接着8只有素因子2，又拖到1</text><text x="378" y="482" font-size="20" fill="#20334a" text-anchor="start">此后只会减小，无法回到2</text><text x="22" y="620" font-size="21" fill="#20334a" text-anchor="start">左边五步全相等于3；重复的两个8始终一起变化</text><text x="22" y="666" font-size="20" fill="#20334a" text-anchor="start">原数组可取[3,8,8,3,9,9,1,1,1]，n=9全部合法</text></g></svg>