"middle">13</text><rect x="303" y="159" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="330" y="188" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="382" y="159" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="409" y="188" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="461" y="159" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="488" y="188" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="540" y="159" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="567" y="188" font-size="22" fill="#20334a" text-anchor="middle">13</text><text x="24" y="257" font-size="19" fill="#20334a" text-anchor="start">差B−A</text><rect x="145" y="229" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="172" y="258" font-size="22" fill="#20334a" text-anchor="middle">3</text><rect x="224" y="229" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="251" y="258" font-size="22" fill="#20334a" text-anchor="middle">3</text><rect x="303" y="229" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="330" y="258" font-size="22" fill="#20334a" text-anchor="middle">0</text><rect x="382" y="229" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="409" y="258" font-size="22" fill="#20334a" text-anchor="middle">0</text><rect x="461" y="229" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="488" y="258" font-size="22" fill="#20334a" text-anchor="middle">0</text><rect x="540" y="229" width="55" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="567" y="258" font-size="22" fill="#20334a" text-anchor="middle">3</text><text x="24" y="327" font-size="19" fill="#20334a" text-anchor="start">补偿后</text><rect x="145" y="299" width="55" height="42" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="172" y="328" font-size="22" fill="#20334a" text-anchor="middle">13</text><rect x="224" y="299" width="55" height="42" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="251" y="328" font-size="22" fill="#20334a" text-anchor="middle">13</text><rect x="303" y="299" width="55" height="42" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="330" y="328" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="382" y="299" width="55" height="42" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="409" y="328" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="461" y="299" width="55" height="42" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="488" y="328" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="540" y="299" width="55" height="42" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="567" y="328" font-size="22" fill="#20334a" text-anchor="middle">10</text><text x="24" y="416" font-size="20" fill="#20334a" text-anchor="start">差值3依次到来：best=1 → 2 → max(1,2+1−3)=1。</text><text x="24" y="462" font-size="20" fill="#20334a" text-anchor="start">三个0只加全局zeros；第三份3才扣这一段损失。</text><text x="24" y="507" font-size="21" fill="#20334a" text-anchor="start">历史最大gain仍为2，最终3个原正确+2=5。</text><text x="24" y="552" font-size="21" fill="#20334a" text-anchor="start">整段加3反而损失中间三台，只剩三台正确。</text></g></svg>