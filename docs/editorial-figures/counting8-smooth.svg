<svg xmlns="http://www.w3.org/2000/svg" width="640" height="672" viewBox="0 0 640 672" role="img"><title>Smooth Array：所有合法前驱与实际同时补全的最终数组</title><rect width="640" height="672" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">a=[2,1,2,1]；费用c=[5,4,3,2]</text><text x="24" y="76" class="small" text-anchor="start">箭头=可作为前驱；绿色1→3是最终保留方案</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3775a8"/></marker></defs><path d="M130 175 L348 175" stroke="#168377" stroke-width="3" marker-end="url(#arrow)"/><path d="M276 272 L350 205" stroke="#3775a8" stroke-width="3" marker-end="url(#arrow)"/><path d="M277 302 L494 302" stroke="#3775a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="129" width="106" height="95" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="77" y="156" class="small" text-anchor="middle">i=1，a=2</text><text x="77" y="184" class="small" text-anchor="middle">c=5</text><text x="77" y="211" class="small" text-anchor="middle">dp=5</text><rect x="171" y="258" width="106" height="95" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="224" y="285" class="small" text-anchor="middle">i=2，a=1</text><text x="224" y="313" class="small" text-anchor="middle">c=4</text><text x="224" y="340" class="small" text-anchor="middle">dp=4</text><rect x="350" y="129" width="106" height="95" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="403" y="156" class="small" text-anchor="middle">i=3，a=2</text><text x="403" y="184" class="small" text-anchor="middle">c=3</text><text x="403" y="211" class="small" text-anchor="middle">dp=8</text><rect x="496" y="258" width="106" height="95" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="549" y="285" class="small" text-anchor="middle">i=4，a=1</text><text x="549" y="313" class="small" text-anchor="middle">c=2</text><text x="549" y="340" class="small" text-anchor="middle">dp=6</text><text x="24" y="403" class="small" text-anchor="start">位置3：max(0,dp1=5,dp2=4)+3 = 8</text><text x="24" y="445" class="small" text-anchor="start">位置4：max(0,dp2=4)+2 = 6；全局best=8</text><text x="155" y="494" class="small" text-anchor="middle">位置1</text><rect x="119" y="510" width="72" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="155" y="541" class="" text-anchor="middle">2</text><text x="264" y="494" class="small" text-anchor="middle">位置2</text><rect x="228" y="510" width="72" height="47" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="264" y="541" class="" text-anchor="middle">2</text><text x="373" y="494" class="small" text-anchor="middle">位置3</text><rect x="337" y="510" width="72" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="373" y="541" class="" text-anchor="middle">2</text><text x="482" y="494" class="small" text-anchor="middle">位置4</text><rect x="446" y="510" width="72" height="47" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="482" y="541" class="" text-anchor="middle">2</text><text x="24" y="600" class="small" text-anchor="start">绿色原样保留；橙色位置2、4各由1改成2</text><text x="24" y="642" class="" text-anchor="start">总代价14 − 保留5−保留3 = 6 = 修改4+2</text></svg>