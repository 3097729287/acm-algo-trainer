<svg xmlns="http://www.w3.org/2000/svg" width="760" height="910" viewBox="0 0 760 910" role="img"><title>同一数轴显示倍数集合相减，七十四二十一删去早于十一的七，十与二十删去十只剩一；下方d六七商三及八九十商二分别只查块尾</title><rect width="760" height="910" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="38" font-size="24" fill="#17334d" text-anchor="start">询问[11,21]，候选d=7：保留14和21</text><text x="24" y="112" font-size="23" fill="#17334d" text-anchor="start">d=7</text><line x1="54" y1="160" x2="704" y2="160" stroke="#476986" stroke-width="2"/><rect x="384" y="133" width="300" height="54" fill="#dcfce7" opacity="0.65"/><line x1="54" y1="153" x2="54" y2="168" stroke="#476986" stroke-width="2"/><text x="54" y="195" font-size="17" fill="#17334d" text-anchor="middle">0</text><line x1="264" y1="153" x2="264" y2="168" stroke="#476986" stroke-width="2"/><text x="264" y="195" font-size="17" fill="#17334d" text-anchor="middle">7</text><line x1="354" y1="153" x2="354" y2="168" stroke="#476986" stroke-width="2"/><text x="354" y="195" font-size="17" fill="#17334d" text-anchor="middle">10</text><line x1="384" y1="153" x2="384" y2="168" stroke="#476986" stroke-width="2"/><text x="384" y="195" font-size="17" fill="#17334d" text-anchor="middle">11</text><line x1="474" y1="153" x2="474" y2="168" stroke="#476986" stroke-width="2"/><text x="474" y="195" font-size="17" fill="#17334d" text-anchor="middle">14</text><line x1="654" y1="153" x2="654" y2="168" stroke="#476986" stroke-width="2"/><text x="654" y="195" font-size="17" fill="#17334d" text-anchor="middle">20</text><line x1="684" y1="153" x2="684" y2="168" stroke="#476986" stroke-width="2"/><text x="684" y="195" font-size="17" fill="#17334d" text-anchor="middle">21</text><circle cx="264" cy="160" r="9" fill="#c74b4b"/><circle cx="474" cy="160" r="9" fill="#16806b"/><circle cx="684" cy="160" r="9" fill="#16806b"/><text x="24" y="246" font-size="23" fill="#17334d" text-anchor="start">3个 − 1个 = 2个：通过</text><text x="24" y="313" font-size="23" fill="#17334d" text-anchor="start">d=10</text><line x1="54" y1="361" x2="704" y2="361" stroke="#476986" stroke-width="2"/><rect x="384" y="334" width="300" height="54" fill="#dcfce7" opacity="0.65"/><line x1="54" y1="354" x2="54" y2="369" stroke="#476986" stroke-width="2"/><text x="54" y="396" font-size="17" fill="#17334d" text-anchor="middle">0</text><line x1="264" y1="354" x2="264" y2="369" stroke="#476986" stroke-width="2"/><text x="264" y="396" font-size="17" fill="#17334d" text-anchor="middle">7</text><line x1="354" y1="354" x2="354" y2="369" stroke="#476986" stroke-width="2"/><text x="354" y="396" font-size="17" fill="#17334d" text-anchor="middle">10</text><line x1="384" y1="354" x2="384" y2="369" stroke="#476986" stroke-width="2"/><text x="384" y="396" font-size="17" fill="#17334d" text-anchor="middle">11</text><line x1="474" y1="354" x2="474" y2="369" stroke="#476986" stroke-width="2"/><text x="474" y="396" font-size="17" fill="#17334d" text-anchor="middle">14</text><line x1="654" y1="354" x2="654" y2="369" stroke="#476986" stroke-width="2"/><text x="654" y="396" font-size="17" fill="#17334d" text-anchor="middle">20</text><line x1="684" y1="354" x2="684" y2="369" stroke="#476986" stroke-width="2"/><text x="684" y="396" font-size="17" fill="#17334d" text-anchor="middle">21</text><circle cx="354" cy="361" r="9" fill="#c74b4b"/><circle cx="654" cy="361" r="9" fill="#16806b"/><text x="24" y="447" font-size="23" fill="#17334d" text-anchor="start">2个 − 1个 = 1个：失败</text><text x="24" y="510" font-size="22" fill="#17334d" text-anchor="start">固定商的候选块：枚举的是d，不是原数x、y。</text><rect x="35" y="550" width="72" height="58" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="71" y="589" font-size="25" fill="#17334d" text-anchor="middle">6</text><rect x="117" y="550" width="72" height="58" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="153" y="589" font-size="25" fill="#17334d" text-anchor="middle">7</text><text x="310" y="587" font-size="21" fill="#17334d" text-anchor="start">21/d=3，只查最大的7，通过</text><rect x="35" y="663" width="72" height="58" rx="7" fill="#fee2e2" stroke="#476986" stroke-width="2"/><text x="71" y="702" font-size="25" fill="#17334d" text-anchor="middle">8</text><rect x="117" y="663" width="72" height="58" rx="7" fill="#fee2e2" stroke="#476986" stroke-width="2"/><text x="153" y="702" font-size="25" fill="#17334d" text-anchor="middle">9</text><rect x="199" y="663" width="72" height="58" rx="7" fill="#fee2e2" stroke="#476986" stroke-width="2"/><text x="235" y="702" font-size="25" fill="#17334d" text-anchor="middle">10</text><text x="310" y="700" font-size="21" fill="#17334d" text-anchor="start">21/d=2，只查最大的10，失败</text><text x="24" y="817" font-size="22" fill="#17334d" text-anchor="start">块内被减项随d增大不增，所以块尾倍数最多。</text><text x="24" y="868" font-size="22" fill="#17334d" text-anchor="start">块尾若失败，整块失败；若通过，它也是最大候选。</text></g></svg>