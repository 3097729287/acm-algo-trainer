<svg xmlns="http://www.w3.org/2000/svg" width="640" height="656" viewBox="0 0 640 656" role="img"><title>Fair and Square：真实三个方向、路径重数与幂和贡献</title><rect width="640" height="656" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">七点树：中心四权九，方向大小2、1、3</text><text x="24" y="70" class="" text-anchor="start">结点标记为 编号:权值；选点1、3、7在三个方向</text><line x1="66" y1="153" x2="180" y2="205" stroke="#ba7b2c" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="205" x2="310" y2="263" stroke="#ba7b2c" stroke-width="4" stroke-dasharray=""/><line x1="310" y1="116" x2="310" y2="263" stroke="#3775a8" stroke-width="4" stroke-dasharray=""/><line x1="310" y1="263" x2="440" y2="263" stroke="#168377" stroke-width="4" stroke-dasharray=""/><line x1="440" y1="263" x2="510" y2="340" stroke="#168377" stroke-width="4" stroke-dasharray=""/><line x1="510" y1="340" x2="565" y2="415" stroke="#168377" stroke-width="4" stroke-dasharray=""/><circle cx="66" cy="153" r="27" fill="#fce4b9" stroke="#52677b" stroke-width="3"/><text x="66" y="160" class="" text-anchor="middle">1:2</text><circle cx="180" cy="205" r="27" fill="#fce4b9" stroke="#52677b" stroke-width="1"/><text x="180" y="212" class="" text-anchor="middle">2:3</text><circle cx="310" cy="116" r="27" fill="#d8edf9" stroke="#52677b" stroke-width="3"/><text x="310" y="123" class="" text-anchor="middle">3:5</text><circle cx="310" cy="263" r="27" fill="#fff1a8" stroke="#52677b" stroke-width="1"/><text x="310" y="270" class="" text-anchor="middle">4:9</text><circle cx="440" cy="263" r="27" fill="#b8e6d1" stroke="#52677b" stroke-width="1"/><text x="440" y="270" class="" text-anchor="middle">5:6</text><circle cx="510" cy="340" r="27" fill="#b8e6d1" stroke="#52677b" stroke-width="1"/><text x="510" y="347" class="" text-anchor="middle">6:7</text><circle cx="565" cy="415" r="27" fill="#b8e6d1" stroke="#52677b" stroke-width="3"/><text x="565" y="422" class="" text-anchor="middle">7:8</text><text x="24" y="247" class="small" text-anchor="start">A={1,2}，大小2</text><text x="350" y="135" class="small" text-anchor="start">B={3}，大小1</text><text x="338" y="382" class="small" text-anchor="start">C={5,6,7}，大小3</text><text x="24" y="305" class="small" text-anchor="start">中心乘3次；其余所经点各乘2次</text><text x="24" y="466" class="" text-anchor="start">含中心：2×1 + 2×3 + 1×3 = 11</text><text x="24" y="506" class="" text-anchor="start">不含中心：2×1×3 = 6；合计17</text><text x="24" y="546" class="" text-anchor="start">P1=6，P2=14，P3=36</text><text x="24" y="586" class="" text-anchor="start">e3=(6³−3×6×14+2×36)/6 = 6</text><text x="24" y="626" class="small" text-anchor="start">全同方向：原1份−扣3份+补2份=0</text></svg>