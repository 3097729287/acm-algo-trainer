<svg xmlns="http://www.w3.org/2000/svg" width="660" height="538" viewBox="0 0 660 538" role="img"><title>八个原字符下的六条实际区间，右端三五七分别一二三条，每条长度至少四且首a尾b</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="34" font-size="21" fill="#20334a" text-anchor="start">官方例串：K=4，左端a、右端b；均为零基下标</text><text x="128" y="72" font-size="18" fill="#20334a" text-anchor="middle">0</text><rect x="106" y="85" width="44" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="128" y="113" font-size="24" fill="#20334a" text-anchor="middle">a</text><text x="190" y="72" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="168" y="85" width="44" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="190" y="113" font-size="24" fill="#20334a" text-anchor="middle">b</text><text x="252" y="72" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="230" y="85" width="44" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="252" y="113" font-size="24" fill="#20334a" text-anchor="middle">a</text><text x="314" y="72" font-size="18" fill="#20334a" text-anchor="middle">3</text><rect x="292" y="85" width="44" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="314" y="113" font-size="24" fill="#20334a" text-anchor="middle">b</text><text x="376" y="72" font-size="18" fill="#20334a" text-anchor="middle">4</text><rect x="354" y="85" width="44" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="376" y="113" font-size="24" fill="#20334a" text-anchor="middle">a</text><text x="438" y="72" font-size="18" fill="#20334a" text-anchor="middle">5</text><rect x="416" y="85" width="44" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="438" y="113" font-size="24" fill="#20334a" text-anchor="middle">b</text><text x="500" y="72" font-size="18" fill="#20334a" text-anchor="middle">6</text><rect x="478" y="85" width="44" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="500" y="113" font-size="24" fill="#20334a" text-anchor="middle">d</text><text x="562" y="72" font-size="18" fill="#20334a" text-anchor="middle">7</text><rect x="540" y="85" width="44" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="562" y="113" font-size="24" fill="#20334a" text-anchor="middle">b</text><text x="24" y="181" font-size="20" fill="#20334a" text-anchor="start">[0,3]</text><rect x="106" y="157" width="230" height="32" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="221" y="180" font-size="19" fill="#20334a" text-anchor="middle">abab</text><text x="24" y="226" font-size="20" fill="#20334a" text-anchor="start">[0,5]</text><rect x="106" y="202" width="354" height="32" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="283" y="225" font-size="19" fill="#20334a" text-anchor="middle">ababab</text><text x="24" y="271" font-size="20" fill="#20334a" text-anchor="start">[2,5]</text><rect x="230" y="247" width="230" height="32" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="345" y="270" font-size="19" fill="#20334a" text-anchor="middle">abab</text><text x="24" y="316" font-size="20" fill="#20334a" text-anchor="start">[0,7]</text><rect x="106" y="292" width="478" height="32" rx="8" fill="#fff7d6" stroke="#2d6db4" stroke-width="2"/><text x="345" y="315" font-size="19" fill="#20334a" text-anchor="middle">abababdb</text><text x="24" y="361" font-size="20" fill="#20334a" text-anchor="start">[2,7]</text><rect x="230" y="337" width="354" height="32" rx="8" fill="#fff7d6" stroke="#2d6db4" stroke-width="2"/><text x="407" y="360" font-size="19" fill="#20334a" text-anchor="middle">ababdb</text><text x="24" y="406" font-size="20" fill="#20334a" text-anchor="start">[4,7]</text><rect x="354" y="382" width="230" height="32" rx="8" fill="#fff7d6" stroke="#2d6db4" stroke-width="2"/><text x="469" y="405" font-size="19" fill="#20334a" text-anchor="middle">abdb</text><text x="24" y="466" font-size="21" fill="#20334a" text-anchor="start">按右端分批：r=3 加1；r=5 加2；r=7 加3，共6。</text><text x="24" y="507" font-size="20" fill="#20334a" text-anchor="start">每一条横段是原串中的一个实际区间，不按文本去重。</text></g></svg>