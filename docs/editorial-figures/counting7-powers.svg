"235" stroke="#8b9aa8" stroke-width="7" stroke-dasharray="7,4"/><line x1="147" y1="248" x2="291" y2="248" stroke="#3775a8" stroke-width="5" stroke-dasharray=""/><circle cx="147" cy="248" r="5" fill="#3775a8"/><circle cx="291" cy="248" r="5" fill="#3775a8"/><line x1="147" y1="261" x2="243" y2="261" stroke="#168377" stroke-width="7" stroke-dasharray=""/><circle cx="147" cy="261" r="5" fill="#168377"/><circle cx="195" cy="261" r="5" fill="#168377"/><circle cx="243" cy="261" r="5" fill="#168377"/><text x="75" y="302" class="small" text-anchor="start">(3,6),(4,8),(5,10)：+3</text><text x="24" y="330" class="small" text-anchor="start">p=4</text><line x1="99" y1="331" x2="243" y2="331" stroke="#8b9aa8" stroke-width="7" stroke-dasharray="7,4"/><line x1="99" y1="344" x2="147" y2="344" stroke="#3775a8" stroke-width="5" stroke-dasharray=""/><circle cx="99" cy="344" r="5" fill="#3775a8"/><circle cx="147" cy="344" r="5" fill="#3775a8"/><line x1="99" y1="357" x2="147" y2="357" stroke="#168377" stroke-width="7" stroke-dasharray=""/><circle cx="99" cy="357" r="5" fill="#168377"/><circle cx="147" cy="357" r="5" fill="#168377"/><text x="75" y="398" class="small" text-anchor="start">(2,8),(3,12)：+2</text><text x="24" y="426" class="small" text-anchor="start">p=8</text><line x1="99" y1="427" x2="243" y2="427" stroke="#8b9aa8" stroke-width="7" stroke-dasharray="7,4"/><line x1="51" y1="440" x2="51" y2="440" stroke="#3775a8" stroke-width="5" stroke-dasharray=""/><circle cx="51" cy="440" r="5" fill="#3775a8"/><circle cx="51" cy="440" r="5" fill="#3775a8"/><text x="75" y="494" class="small" text-anchor="start">无交集：+0</text><text x="24" y="568" class="" text-anchor="start">总数1+3+2+0=6；下一倍率16&gt;12才整体停止</text></svg>