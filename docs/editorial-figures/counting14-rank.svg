<svg xmlns="http://www.w3.org/2000/svg" width="640" height="955" viewBox="0 0 640 955" role="img"><title>第297个交替数的真实数字前缀定位</title><rect width="640" height="955" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#16867b"/></marker></defs><text x="24" y="35" class="title" text-anchor="start">第297项：长度块→前缀块→真实数字</text><text x="24" y="76" class="small" text-anchor="start">每块标明首末合法数；块内只含奇偶交替数</text><rect x="28" y="105" width="275" height="134" rx="5" fill="#e1e7ed" stroke="#7394aa"/><text x="165" y="142" class="" text-anchor="middle">两位：45个</text><text x="165" y="182" class="" text-anchor="middle">10 … 98</text><text x="165" y="220" class="small" text-anchor="middle">297−45=252</text><rect x="336" y="105" width="275" height="134" rx="5" fill="#e1e7ed" stroke="#7394aa"/><text x="473" y="142" class="" text-anchor="middle">三位：225个</text><text x="473" y="182" class="" text-anchor="middle">101 … 989</text><text x="473" y="220" class="small" text-anchor="middle">252−225=27</text><text x="24" y="285" class="" text-anchor="start">四位内排名27，首位1块有125项：保留</text><rect x="24" y="315" width="592" height="113" rx="5" fill="#f4c6ca" stroke="#7394aa"/><text x="44" y="352" class="" text-anchor="start">候选前缀10：25项，27&gt;25，跳过</text><text x="44" y="389" class="" text-anchor="start">1010 / 1012 / … / 1098；新排名2</text><rect x="24" y="453" width="592" height="113" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="44" y="490" class="" text-anchor="start">候选前缀12：25项，排名2在此块</text><text x="44" y="528" class="" text-anchor="start">1210 / 1212 / … / 1298</text><text x="24" y="617" class="" text-anchor="start">第三位1：下面五项是同一完整候选块</text><rect x="24" y="648" width="102" height="47" rx="5" fill="#e1e7ed" stroke="#7394aa"/><text x="75.0" y="678.5" class="" text-anchor="middle">1210</text><rect x="146" y="648" width="102" height="47" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="197.0" y="678.5" class="" text-anchor="middle">1212</text><rect x="268" y="648" width="102" height="47" rx="5" fill="#e1e7ed" stroke="#7394aa"/><text x="319.0" y="678.5" class="" text-anchor="middle">1214</text><rect x="390" y="648" width="102" height="47" rx="5" fill="#e1e7ed" stroke="#7394aa"/><text x="441.0" y="678.5" class="" text-anchor="middle">1216</text><rect x="512" y="648" width="102" height="47" rx="5" fill="#e1e7ed" stroke="#7394aa"/><text x="563.0" y="678.5" class="" text-anchor="middle">1218</text><text x="24" y="740" class="" text-anchor="start">末位0块1项：排名2&gt;1，跳过后排名1</text><text x="24" y="782" class="" text-anchor="start">末位2块1项：选择，得到1212</text><rect x="145" y="819" width="64" height="47" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="177.0" y="849.5" class="" text-anchor="middle">1</text><rect x="233" y="819" width="64" height="47" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="265.0" y="849.5" class="" text-anchor="middle">2</text><rect x="321" y="819" width="64" height="47" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="353.0" y="849.5" class="" text-anchor="middle">1</text><rect x="409" y="819" width="64" height="47" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="441.0" y="849.5" class="" text-anchor="middle">2</text><text x="24" y="917" class="" text-anchor="start">一基排名：相等时选入，只在严格大于时跳块</text></svg>