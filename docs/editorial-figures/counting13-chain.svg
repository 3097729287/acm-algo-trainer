<svg xmlns="http://www.w3.org/2000/svg" width="640" height="828" viewBox="0 0 640 828" role="img"><title>五个实际位置、保留子序列和读旧值更新</title><rect width="640" height="828" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#16867b"/></marker></defs><text x="24" y="35" class="title" text-anchor="start">原次序不变：两个22是两个真实位置</text><text x="24" y="73" class="small" text-anchor="start">绿保留、红删除；A/B/C/E连成12→22→22→23</text><text x="72" y="119" class="small" text-anchor="middle">位置1</text><rect x="24" y="142" width="96" height="55" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="72.0" y="176.5" class="" text-anchor="middle">12</text><text x="72" y="225" class="" text-anchor="middle">A</text><text x="194" y="119" class="small" text-anchor="middle">位置2</text><rect x="146" y="142" width="96" height="55" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="194.0" y="176.5" class="" text-anchor="middle">22</text><text x="194" y="225" class="" text-anchor="middle">B</text><text x="316" y="119" class="small" text-anchor="middle">位置3</text><rect x="268" y="142" width="96" height="55" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="316.0" y="176.5" class="" text-anchor="middle">22</text><text x="316" y="225" class="" text-anchor="middle">C</text><text x="438" y="119" class="small" text-anchor="middle">位置4</text><rect x="390" y="142" width="96" height="55" rx="5" fill="#f4c6ca" stroke="#7394aa"/><text x="438.0" y="176.5" class="" text-anchor="middle">32</text><text x="438" y="225" class="" text-anchor="middle">D</text><text x="560" y="119" class="small" text-anchor="middle">位置5</text><rect x="512" y="142" width="96" height="55" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="560.0" y="176.5" class="" text-anchor="middle">23</text><text x="560" y="225" class="" text-anchor="middle">E</text><text x="24" y="276" class="" text-anchor="start">实际保留的链（仍按原位置先后）</text><rect x="35" y="309" width="100" height="48" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="85.0" y="340.0" class="" text-anchor="middle">A:12</text><text x="85" y="387" class="small" text-anchor="middle">原位置1</text><line x1="142" y1="333" x2="181" y2="333" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="188" y="309" width="100" height="48" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="238.0" y="340.0" class="" text-anchor="middle">B:22</text><text x="238" y="387" class="small" text-anchor="middle">原位置2</text><line x1="295" y1="333" x2="334" y2="333" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="341" y="309" width="100" height="48" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="391.0" y="340.0" class="" text-anchor="middle">C:22</text><text x="391" y="387" class="small" text-anchor="middle">原位置3</text><line x1="448" y1="333" x2="487" y2="333" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="494" y="309" width="100" height="48" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="544.0" y="340.0" class="" text-anchor="middle">E:23</text><text x="544" y="387" class="small" text-anchor="middle">原位置5</text><text x="24" y="439" class="" text-anchor="start">读到D=32：旧尾2最长3，旧尾3为0</text><rect x="24" y="467" width="592" height="98" rx="5" fill="#ffdf98" stroke="#7394aa"/><text x="44" y="503" class="" text-anchor="start">当前候选：旧best3(0)+1=1</text><text x="44" y="543" class="" text-anchor="start">新best2=max(旧3,候选1)=3</text><text x="24" y="612" class="" text-anchor="start">读到E=23：旧尾2最长3，旧尾3为0</text><rect x="24" y="640" width="592" height="98" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="44" y="677" class="" text-anchor="start">当前候选：旧best2(3)+1=4</text><text x="44" y="716" class="" text-anchor="start">新best3=max(旧0,候选4)=4</text><text x="24" y="789" class="" text-anchor="start">最终最大保留4；删除5−4=1个</text></svg>