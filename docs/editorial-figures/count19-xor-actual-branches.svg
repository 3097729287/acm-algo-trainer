<svg xmlns="http://www.w3.org/2000/svg" width="480" height="825" viewBox="0 0 480 825"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#26826e"/></marker></defs><rect width="480" height="100%" rx="8" fill="#f7fafc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#17334d"><text x="18" y="28" font-size="16" font-weight="600">固定最大值4：逐位决定实际选择哪些身份</text><text x="18" y="57">候选 A=1 / B=2 / C=3 / D=4，取t=2</text><rect x="20" y="83" width="98" height="42" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="28" y="109.0">A: 001</text><rect x="135" y="83" width="98" height="42" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="143" y="109.0">B: 010</text><rect x="250" y="83" width="98" height="42" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="258" y="109.0">C: 011</text><rect x="365" y="83" width="98" height="42" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="373" y="109.0">D: 100</text><text x="18" y="159">bit2：m是1，候选为0的A/B/C优先</text><rect x="20" y="184" width="323" height="46" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="28" y="212.0">A:001，B:010，C:011</text><rect x="360" y="184" width="100" height="46" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="368" y="212.0">D:100</text><text x="18" y="262">cg=3≥2：先加2×4=8，低位只在A/B/C选</text><line x1="210" y1="280" x2="210" y2="295" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><rect x="104" y="304" width="235" height="44" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="112" y="331.0">bit1优先 B:010、C:011</text><text x="18" y="384">cg=2≥2：再加2×2=4；留下B、C</text><text x="18" y="421">两项全取，fullXor只算bit0：0+1=1</text><text x="18" y="458">总贡献8+4+1=13，也就是(2 xor4)+(3 xor4)</text><line x1="18" y1="482" x2="462" y2="482" stroke="#6c8294" stroke-width="2"/><text x="18" y="519">另一合法输入：[1,2,4,4,4]，k=4，最大值4</text><text x="18" y="550">取t=3；优先A=1、B=2仅cg=2，不够</text><rect x="21" y="575" width="439" height="44" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="29" y="602.0">整支fullXor=5+6=11；同值4中补1项得0</text><text x="18" y="660">这一支的bit2已经含在11中，不能再另加8</text><text x="18" y="696">三个4是不同身份C/D/E，当前最大值取E</text><text x="18" y="732">若查询把自身E选入，可换未选的C或D</text><text x="18" y="769">其贡献同为0；最终A/B/C/E四个身份不重复</text><text x="18" y="803">后面有同值不必都纳入当前前缀；按最右身份枚举</text></g></svg>