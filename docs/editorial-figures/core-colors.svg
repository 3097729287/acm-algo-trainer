<svg xmlns="http://www.w3.org/2000/svg" width="620" height="350" viewBox="0 0 620 350" role="img"><title>颜色三一二一保留两个一，改动另两个球就能全部同色，最少两次</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="38" font-size="23" fill="#20334a" text-anchor="start">目标颜色 1：先证明至少两次，再实现两次</text><circle cx="132" cy="102" r="31" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="132" y="111" font-size="27" fill="#20334a" text-anchor="middle">3</text><text x="132" y="177" font-size="19" fill="#a32e36" text-anchor="middle">修改一次</text><circle cx="132" cy="240" r="31" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="132" y="249" font-size="27" fill="#20334a" text-anchor="middle">1</text><circle cx="252" cy="102" r="31" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="252" y="111" font-size="27" fill="#20334a" text-anchor="middle">1</text><text x="252" y="177" font-size="19" fill="#087b48" text-anchor="middle">保留</text><circle cx="252" cy="240" r="31" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="252" y="249" font-size="27" fill="#20334a" text-anchor="middle">1</text><circle cx="372" cy="102" r="31" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="372" y="111" font-size="27" fill="#20334a" text-anchor="middle">2</text><text x="372" y="177" font-size="19" fill="#a32e36" text-anchor="middle">修改一次</text><circle cx="372" cy="240" r="31" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="372" y="249" font-size="27" fill="#20334a" text-anchor="middle">1</text><circle cx="492" cy="102" r="31" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="492" y="111" font-size="27" fill="#20334a" text-anchor="middle">1</text><text x="492" y="177" font-size="19" fill="#087b48" text-anchor="middle">保留</text><circle cx="492" cy="240" r="31" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="492" y="249" font-size="27" fill="#20334a" text-anchor="middle">1</text><text x="26" y="106" font-size="19" fill="#20334a" text-anchor="start">原色</text><text x="26" y="244" font-size="19" fill="#20334a" text-anchor="start">最终</text><text x="26" y="315" font-size="21" fill="#20334a" text-anchor="start">两个非 1 的球各改一次，达成已证明的下界 2。</text></g></svg>