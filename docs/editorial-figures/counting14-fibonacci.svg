<svg xmlns="http://www.w3.org/2000/svg" width="640" height="781" viewBox="0 0 640 781" role="img"><title>八个实际字符与全部跨界逆序对</title><rect width="640" height="781" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#16867b"/></marker></defs><text x="24" y="35" class="title" text-anchor="start">S6=101 | 01101：每格是原串真实位置</text><text x="24" y="75" class="small" text-anchor="start">左串S4、右串S5；左内部1对，右内部2对</text><text x="97" y="119" class="small" text-anchor="middle">1</text><rect x="70" y="139" width="54" height="42" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="97.0" y="167.0" class="" text-anchor="middle">1</text><text x="160" y="119" class="small" text-anchor="middle">2</text><rect x="133" y="139" width="54" height="42" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="160.0" y="167.0" class="" text-anchor="middle">0</text><text x="223" y="119" class="small" text-anchor="middle">3</text><rect x="196" y="139" width="54" height="42" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="223.0" y="167.0" class="" text-anchor="middle">1</text><text x="286" y="119" class="small" text-anchor="middle">4</text><rect x="259" y="139" width="54" height="42" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="286.0" y="167.0" class="" text-anchor="middle">0</text><text x="349" y="119" class="small" text-anchor="middle">5</text><rect x="322" y="139" width="54" height="42" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="349.0" y="167.0" class="" text-anchor="middle">1</text><text x="412" y="119" class="small" text-anchor="middle">6</text><rect x="385" y="139" width="54" height="42" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="412.0" y="167.0" class="" text-anchor="middle">1</text><text x="475" y="119" class="small" text-anchor="middle">7</text><rect x="448" y="139" width="54" height="42" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="475.0" y="167.0" class="" text-anchor="middle">0</text><text x="538" y="119" class="small" text-anchor="middle">8</text><rect x="511" y="139" width="54" height="42" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="538.0" y="167.0" class="" text-anchor="middle">1</text><line x1="254" y1="103" x2="254" y2="200" stroke="#bd5864" stroke-width="2" stroke-dasharray="4,4"/><text x="24" y="230" class="" text-anchor="start">左内部：(1,2)</text><text x="310" y="230" class="" text-anchor="start">右内部：(5,7)、(6,7)</text><text x="24" y="280" class="" text-anchor="start">跨界：每个左1，配每个右0，四条边就是四对</text><line x1="228" y1="365" x2="412" y2="365" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="228" y1="365" x2="412" y2="505" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="228" y1="505" x2="412" y2="365" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="228" y1="505" x2="412" y2="505" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="115" y="342" width="110" height="46" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="170.0" y="372.0" class="" text-anchor="middle">位置1：1</text><rect x="115" y="482" width="110" height="46" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="170.0" y="512.0" class="" text-anchor="middle">位置3：1</text><rect x="415" y="342" width="110" height="46" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="470.0" y="372.0" class="" text-anchor="middle">位置4：0</text><rect x="415" y="482" width="110" height="46" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="470.0" y="512.0" class="" text-anchor="middle">位置7：0</text><text x="24" y="575" class="" text-anchor="start">跨界：(1,4)/(1,7)/(3,4)/(3,7)</text><rect x="24" y="606" width="592" height="91" rx="5" fill="#ffdf98" stroke="#7394aa"/><text x="44" y="644" class="" text-anchor="start">inv6=inv4(1)+inv5(2)+one4(2)×zero5(2)</text><text x="44" y="681" class="" text-anchor="start">=1+2+4=7；三类位置互斥且穷尽</text><text x="24" y="744" class="" text-anchor="start">零：1+2=3；一：2+3=5</text></svg>