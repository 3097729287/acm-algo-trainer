<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img"><title>真实六位置零到五的三条镜像连线，相等对零五和一四输出一，不等对二三输出零；五位置中心二与自身对应</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="32" font-size="22" fill="#20334a" text-anchor="start">六个原位置：每个位置都要有一项结果</text><text x="52" y="82" font-size="18" fill="#20334a" text-anchor="middle">0</text><rect x="17" y="101" width="70" height="52" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="52" y="136" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="152" y="82" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="117" y="101" width="70" height="52" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="152" y="136" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="252" y="82" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="217" y="101" width="70" height="52" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="252" y="136" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="352" y="82" font-size="18" fill="#20334a" text-anchor="middle">3</text><rect x="317" y="101" width="70" height="52" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="352" y="136" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="452" y="82" font-size="18" fill="#20334a" text-anchor="middle">4</text><rect x="417" y="101" width="70" height="52" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="452" y="136" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="552" y="82" font-size="18" fill="#20334a" text-anchor="middle">5</text><rect x="517" y="101" width="70" height="52" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="552" y="136" font-size="25" fill="#20334a" text-anchor="middle">1</text><path d="M52 153 C52 301,552 301,552 153" fill="none" stroke="#15803d" stroke-width="3"/><path d="M152 153 C152 256,452 256,452 153" fill="none" stroke="#15803d" stroke-width="3"/><path d="M252 153 C252 207,352 207,352 153" fill="none" stroke="#b91c1c" stroke-width="3"/><text x="22" y="328" font-size="21" fill="#20334a" text-anchor="start">0↔5相等；1↔4相等；2↔3不同</text><text x="22" y="372" font-size="20" fill="#20334a" text-anchor="start">按原位置输出：</text><rect x="17" y="397" width="70" height="44" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="52" y="426" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="117" y="397" width="70" height="44" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="152" y="426" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="217" y="397" width="70" height="44" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="252" y="426" font-size="23" fill="#20334a" text-anchor="middle">0</text><rect x="317" y="397" width="70" height="44" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="352" y="426" font-size="23" fill="#20334a" text-anchor="middle">0</text><rect x="417" y="397" width="70" height="44" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="452" y="426" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="517" y="397" width="70" height="44" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="552" y="426" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="22" y="494" font-size="21" fill="#20334a" text-anchor="start">五项时，中间下标2与自己对应：</text><rect x="60" y="530" width="70" height="48" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="95" y="561" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="95" y="608" font-size="18" fill="#20334a" text-anchor="middle">0</text><rect x="166" y="530" width="70" height="48" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="201" y="561" font-size="23" fill="#20334a" text-anchor="middle">9</text><text x="201" y="608" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="272" y="530" width="70" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="307" y="561" font-size="23" fill="#20334a" text-anchor="middle">7</text><text x="307" y="608" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="378" y="530" width="70" height="48" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="413" y="561" font-size="23" fill="#20334a" text-anchor="middle">9</text><text x="413" y="608" font-size="18" fill="#20334a" text-anchor="middle">3</text><rect x="484" y="530" width="70" height="48" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="519" y="561" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="519" y="608" font-size="18" fill="#20334a" text-anchor="middle">4</text><text x="22" y="650" font-size="21" fill="#20334a" text-anchor="start">中心2 = 5−1−2；与自己相等，所以输出1。</text></g></svg>