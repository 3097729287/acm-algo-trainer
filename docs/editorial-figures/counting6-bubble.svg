<svg xmlns="http://www.w3.org/2000/svg" width="640" height="671" viewBox="0 0 640 671" role="img"><title>Binary Bubble Sort Inversions：带零身份的实际扫描与虚拟标签</title><rect width="640" height="671" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">A、B是固定的两个零；dq记录虚拟贡献</text><text x="24" y="70" class="" text-anchor="start">左扫1、右扫0、再左扫1；零的物理次序始终A在B前</text><text x="24" y="141" class="small" text-anchor="start">初始</text><rect x="140" y="110" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="168" y="141" class="" text-anchor="middle">1</text><rect x="208" y="110" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="236" y="141" class="" text-anchor="middle">1</text><rect x="276" y="110" width="57" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="304" y="141" class="" text-anchor="middle">0A</text><rect x="344" y="110" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="372" y="141" class="" text-anchor="middle">1</text><rect x="412" y="110" width="57" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="440" y="141" class="" text-anchor="middle">0B</text><text x="24" y="186" class="small" text-anchor="start">A、B贡献：2、3；dq=[(2,1),(3,1)]</text><text x="24" y="219" class="small" text-anchor="start">W=5, V=2, moved=0：I=5−0×2=5</text><text x="24" y="267" class="small" text-anchor="start">左扫1</text><rect x="140" y="236" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="168" y="267" class="" text-anchor="middle">1</text><rect x="208" y="236" width="57" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="236" y="267" class="" text-anchor="middle">0A</text><rect x="276" y="236" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="304" y="267" class="" text-anchor="middle">1</text><rect x="344" y="236" width="57" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="372" y="267" class="" text-anchor="middle">0B</text><rect x="412" y="236" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="440" y="267" class="" text-anchor="middle">1</text><text x="24" y="312" class="small" text-anchor="start">A、B贡献：1、2；dq=[(2,1),(3,1)]</text><text x="24" y="345" class="small" text-anchor="start">W=5, V=2, moved=1：I=5−1×2=3</text><text x="24" y="393" class="small" text-anchor="start">右扫0</text><rect x="140" y="362" width="57" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="168" y="393" class="" text-anchor="middle">0A</text><rect x="208" y="362" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="236" y="393" class="" text-anchor="middle">1</text><rect x="276" y="362" width="57" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="304" y="393" class="" text-anchor="middle">0B</text><rect x="344" y="362" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="372" y="393" class="" text-anchor="middle">1</text><rect x="412" y="362" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="440" y="393" class="" text-anchor="middle">1</text><text x="24" y="438" class="small" text-anchor="start">A、B贡献：0、1；dq=[(2,1)]</text><text x="24" y="471" class="small" text-anchor="start">W=2, V=1, moved=1：I=2−1×1=1</text><text x="24" y="519" class="small" text-anchor="start">左扫1</text><rect x="140" y="488" width="57" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="168" y="519" class="" text-anchor="middle">0A</text><rect x="208" y="488" width="57" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="236" y="519" class="" text-anchor="middle">0B</text><rect x="276" y="488" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="304" y="519" class="" text-anchor="middle">1</text><rect x="344" y="488" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="372" y="519" class="" text-anchor="middle">1</text><rect x="412" y="488" width="57" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="440" y="519" class="" text-anchor="middle">1</text><text x="24" y="564" class="small" text-anchor="start">A、B贡献：0、0；dq=[]</text><text x="24" y="597" class="small" text-anchor="start">W=0, V=0, moved=2：I=0−2×0=0</text><text x="24" y="641" class="" text-anchor="start">右扫后B仍贡献一；删最大项指多重集，不指零身份</text></svg>