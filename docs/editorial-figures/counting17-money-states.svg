<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1418" viewBox="0 0 640 1418" role="img"><title>实际四机器的高低钱迁移、相同存储位的不同解释及同一旧集合三分支</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247b65"/></marker></defs><rect width="640" height="1418" fill="#f7fafc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="36" font-size="23" text-anchor="start" fill="#123750">四台机器：真实币数沿同一数轴移动</text><text x="24" y="78" font-size="19" text-anchor="start" fill="#123750">绿线为合法来源；虚线二十区分低钱/高钱</text><path d="M180 110 L600 110" fill="none" stroke="#536c7e" stroke-width="2"/><text x="180" y="101" font-size="18" text-anchor="middle" fill="#123750">0</text><text x="320" y="101" font-size="18" text-anchor="middle" fill="#123750">20</text><text x="460" y="101" font-size="18" text-anchor="middle" fill="#123750">40</text><text x="600" y="101" font-size="18" text-anchor="middle" fill="#123750">60</text><path d="M320 121 L320 663" fill="none" stroke="#b08127" stroke-width="2" stroke-dasharray="5 5"/><path d="M208 193 L208 275" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M208 193 L341 275" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M208 193 L481 275" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M208 323 L208 405" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M341 323 L292 405" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M481 323 L432 405" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M208 453 L341 535" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M292 453 L425 535" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M432 453 L565 535" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><text x="22" y="154" font-size="16" text-anchor="start" fill="#123750">初始四</text><text x="22" y="178" font-size="16" text-anchor="start" fill="#123750">G0</text><circle cx="208" cy="170" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="208" y="177" font-size="21" text-anchor="middle" fill="#123750">4</text><text x="22" y="284" font-size="16" text-anchor="start" fill="#123750">特殊(1,20,40)</text><text x="22" y="308" font-size="16" text-anchor="start" fill="#123750">跳过或两返还</text><text x="22" y="332" font-size="16" text-anchor="start" fill="#123750">G0</text><circle cx="208" cy="300" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="208" y="307" font-size="21" text-anchor="middle" fill="#123750">4</text><circle cx="341" cy="300" r="22" fill="#cfe3f5" stroke="#7e9cb6"/><text x="341" y="307" font-size="21" text-anchor="middle" fill="#123750">23</text><circle cx="481" cy="300" r="22" fill="#cfe3f5" stroke="#7e9cb6"/><text x="481" y="307" font-size="21" text-anchor="middle" fill="#123750">43</text><text x="22" y="414" font-size="16" text-anchor="start" fill="#123750">普通(10,3)</text><text x="22" y="438" font-size="16" text-anchor="start" fill="#123750">四不够，其余减七</text><text x="22" y="462" font-size="16" text-anchor="start" fill="#123750">G−7</text><circle cx="208" cy="430" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="208" y="437" font-size="21" text-anchor="middle" fill="#123750">4</text><circle cx="292" cy="430" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="292" y="437" font-size="21" text-anchor="middle" fill="#123750">16</text><circle cx="432" cy="430" r="22" fill="#cfe3f5" stroke="#7e9cb6"/><text x="432" y="437" font-size="21" text-anchor="middle" fill="#123750">36</text><text x="22" y="544" font-size="16" text-anchor="start" fill="#123750">普通(1,20)</text><text x="22" y="568" font-size="16" text-anchor="start" fill="#123750">全部加十九</text><text x="22" y="592" font-size="16" text-anchor="start" fill="#123750">G12</text><circle cx="341" cy="560" r="22" fill="#cfe3f5" stroke="#7e9cb6"/><text x="341" y="567" font-size="21" text-anchor="middle" fill="#123750">23</text><circle cx="425" cy="560" r="22" fill="#cfe3f5" stroke="#7e9cb6"/><text x="425" y="567" font-size="21" text-anchor="middle" fill="#123750">35</text><circle cx="565" cy="560" r="22" fill="#cfe3f5" stroke="#7e9cb6"/><text x="565" y="567" font-size="21" text-anchor="middle" fill="#123750">55</text><path d="M20 664 L620 664" fill="none" stroke="#536c7e" stroke-width="2"/><text x="24" y="710" font-size="19" text-anchor="start" fill="#123750">同一旧高钱位O+23：23 → 16，清除</text><text x="24" y="754" font-size="19" text-anchor="start" fill="#123750">另一个位O+43：43 → 36 → 55，位置不动</text><text x="24" y="798" font-size="19" text-anchor="start" fill="#123750">第三台旧低钱4 → 23，写O+11</text><text x="24" y="842" font-size="19" text-anchor="start" fill="#123750">旧低钱16 → 35，重写已清除的O+23</text><text x="24" y="887" font-size="20" text-anchor="start" fill="#123750">先改G，再插入这两个新高钱状态</text><path d="M20 926 L620 926" fill="none" stroke="#536c7e" stroke-width="2"/><text x="24" y="971" font-size="19" text-anchor="start" fill="#123750">最后特殊(20,21,23)：读同一旧集合</text><text x="24" y="1015" font-size="19" text-anchor="start" fill="#123750">来源是23、35、55；可跳过或加一/加三</text><text x="70" y="1065" font-size="19" text-anchor="middle" fill="#123750">旧来源</text><text x="225" y="1065" font-size="19" text-anchor="middle" fill="#123750">23</text><text x="380" y="1065" font-size="19" text-anchor="middle" fill="#123750">35</text><text x="535" y="1065" font-size="19" text-anchor="middle" fill="#123750">55</text><text x="70" y="1126" font-size="18" text-anchor="middle" fill="#123750">跳过</text><rect x="181" y="1095" width="90" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="226.0" y="1127" font-size="22" text-anchor="middle" fill="#123750">23</text><rect x="336" y="1095" width="90" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="381.0" y="1127" font-size="22" text-anchor="middle" fill="#123750">35</text><rect x="491" y="1095" width="90" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="536.0" y="1127" font-size="22" text-anchor="middle" fill="#123750">55</text><text x="70" y="1190" font-size="18" text-anchor="middle" fill="#123750">加一</text><rect x="181" y="1159" width="90" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="226.0" y="1191" font-size="22" text-anchor="middle" fill="#123750">24</text><rect x="336" y="1159" width="90" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="381.0" y="1191" font-size="22" text-anchor="middle" fill="#123750">36</text><rect x="491" y="1159" width="90" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="536.0" y="1191" font-size="22" text-anchor="middle" fill="#123750">56</text><text x="70" y="1254" font-size="18" text-anchor="middle" fill="#123750">加三</text><rect x="181" y="1223" width="90" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="226.0" y="1255" font-size="22" text-anchor="middle" fill="#123750">26</text><rect x="336" y="1223" width="90" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="381.0" y="1255" font-size="22" text-anchor="middle" fill="#123750">38</text><rect x="491" y="1223" width="90" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="536.0" y="1255" font-size="22" text-anchor="middle" fill="#123750">58</text><text x="24" y="1338" font-size="19" text-anchor="start" fill="#123750">二十五不可达；五十八可达</text><text x="24" y="1382" font-size="19" text-anchor="start" fill="#123750">禁止从加一的新结果再加三：会伪造27/39/59</text></g></svg>