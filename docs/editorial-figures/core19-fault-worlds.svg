<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img"><title>两原因两现象的八类真实联合结果，只有现象一保留三千二百和四百份，归一化为八比一并显示精确舍入阈值</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">先验A、B各50%；只观察到现象1</text><text x="24" y="70" font-size="20" fill="#20334a" text-anchor="start">A下出现概率(80%,20%)；B下(40%,80%)</text><text x="24" y="104" font-size="20" fill="#20334a" text-anchor="start">用10000份等权结果表示完整联合分布</text><text x="180" y="145" font-size="20" fill="#20334a" text-anchor="middle">1和2都有</text><text x="331" y="145" font-size="20" fill="#20334a" text-anchor="middle">只有1</text><text x="482" y="145" font-size="20" fill="#20334a" text-anchor="middle">只有2</text><text x="633" y="145" font-size="20" fill="#20334a" text-anchor="middle">都没有</text><text x="35" y="209" font-size="27" fill="#20334a" text-anchor="start">A</text><rect x="112" y="170" width="137" height="64" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="180" y="210" font-size="25" fill="#20334a" text-anchor="middle">800</text><rect x="263" y="170" width="137" height="64" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="331" y="210" font-size="25" fill="#20334a" text-anchor="middle">3200</text><rect x="414" y="170" width="137" height="64" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="482" y="210" font-size="25" fill="#20334a" text-anchor="middle">200</text><rect x="565" y="170" width="137" height="64" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="633" y="210" font-size="25" fill="#20334a" text-anchor="middle">800</text><text x="35" y="304" font-size="27" fill="#20334a" text-anchor="start">B</text><rect x="112" y="265" width="137" height="64" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="180" y="305" font-size="25" fill="#20334a" text-anchor="middle">1600</text><rect x="263" y="265" width="137" height="64" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="331" y="305" font-size="25" fill="#20334a" text-anchor="middle">400</text><rect x="414" y="265" width="137" height="64" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="482" y="305" font-size="25" fill="#20334a" text-anchor="middle">2400</text><rect x="565" y="265" width="137" height="64" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="633" y="305" font-size="25" fill="#20334a" text-anchor="middle">600</text><text x="24" y="405" font-size="22" fill="#20334a" text-anchor="start">观察只保留绿色两格：3200+400=3600。</text><text x="24" y="452" font-size="22" fill="#20334a" text-anchor="start">A占8/9 → 88.89%；B占1/9 → 11.11%。</text><text x="24" y="499" font-size="21" fill="#20334a" text-anchor="start">其余六格确实不满足观察；不能只筛“现象1有”。</text><text x="24" y="546" font-size="20" fill="#20334a" text-anchor="start">舍入A：x=8889阈值159993；x=8890阈值160011。</text><text x="24" y="585" font-size="20" fill="#20334a" text-anchor="start">左侧固定160000；最大通过值8889，对应88.89。</text></g></svg>