<svg xmlns="http://www.w3.org/2000/svg" width="640" height="885" viewBox="0 0 640 885" role="img"><title>真实位置分组、无序对身份与六种类别</title><rect width="640" height="885" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#16867b"/></marker></defs><text x="24" y="35" class="title" text-anchor="start">205个实际位置，抽两个不同位置</text><text x="24" y="73" class="small" text-anchor="start">位置连续编号，重复数值仍代表不同对象</text><rect x="40" y="124" width="150.2439024390244" height="85" rx="0" fill="#bfe8d5" stroke="#7394aa"/><text x="115.1219512195122" y="157" class="small" text-anchor="middle">值1：55个</text><text x="115.1219512195122" y="190" class="small" text-anchor="middle">位置1..55</text><rect x="190.2439024390244" y="124" width="256.7804878048781" height="85" rx="0" fill="#c8dff4" stroke="#7394aa"/><text x="318.6341463414634" y="157" class="small" text-anchor="middle">值2：94个</text><text x="318.6341463414634" y="190" class="small" text-anchor="middle">位置56..149</text><rect x="447.0243902439025" y="124" width="152.97560975609758" height="85" rx="0" fill="#dfd1ef" stroke="#7394aa"/><text x="523.5121951219512" y="157" class="small" text-anchor="middle">值3：56个</text><text x="523.5121951219512" y="190" class="small" text-anchor="middle">位置150..205</text><text x="24" y="252" class="" text-anchor="start">真实无序对(1,56)：第一组挑1，第二组挑56</text><rect x="70" y="283" width="190" height="47" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="165.0" y="313.5" class="" text-anchor="middle">位置1 / 值1</text><rect x="375" y="283" width="190" height="47" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="470.0" y="313.5" class="" text-anchor="middle">位置56 / 值2</text><line x1="267" y1="306" x2="367" y2="306" stroke="#16867b" stroke-width="3" stroke-dasharray=""/><text x="24" y="375" class="" text-anchor="start">每对唯一分到两组：55×94=5170</text><text x="24" y="417" class="" text-anchor="start">(56,1)是同一个对，不再额外乘2</text><text x="24" y="474" class="" text-anchor="start">全部不同位置对：205×204/2=20910</text><rect x="40" y="509" width="250" height="42" rx="5" fill="#e1e7ed" stroke="#7394aa"/><text x="165.0" y="537.0" class="" text-anchor="middle">1/1：1485</text><rect x="350" y="509" width="250" height="42" rx="5" fill="#e1e7ed" stroke="#7394aa"/><text x="475.0" y="537.0" class="" text-anchor="middle">2/2：4371</text><rect x="40" y="562" width="250" height="42" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="165.0" y="590.0" class="" text-anchor="middle">1/2：5170</text><rect x="350" y="562" width="250" height="42" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="475.0" y="590.0" class="" text-anchor="middle">2/3：5264</text><rect x="40" y="615" width="250" height="42" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="165.0" y="643.0" class="" text-anchor="middle">1/3：3080</text><rect x="350" y="615" width="250" height="42" rx="5" fill="#e1e7ed" stroke="#7394aa"/><text x="475.0" y="643.0" class="" text-anchor="middle">3/3：1540</text><text x="24" y="711" class="" text-anchor="start">三种跨组13514 + 同组7396 = 20910</text><text x="24" y="760" class="" text-anchor="start">5170/20910=517/2091</text><text x="24" y="804" class="" text-anchor="start">5264/20910=2632/10455</text><text x="24" y="848" class="" text-anchor="start">3080/20910=308/2091</text></svg>