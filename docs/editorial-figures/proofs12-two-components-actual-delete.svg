<svg xmlns="http://www.w3.org/2000/svg" width="720" height="839" viewBox="0 0 720 839" role="img"><title>五点权二三五七十一，三角形一二三与单边四五两分量，删除红虚线一二可绕一三二仍两分量权十十八差八，桥四五给中途六但删除会三分量而不能用；对照两个树分量的三条边全桥无合法删除</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">原图已有2个分量时，只能删非桥；不是继续选最小桥</text><path d="M143 118 L63 264" stroke="#ef4444" stroke-width="3" fill="none" stroke-dasharray="7 6"/><path d="M143 118 L239 264" stroke="#16a34a" stroke-width="5" fill="none"/><path d="M63 264 L239 264" stroke="#16a34a" stroke-width="5" fill="none"/><path d="M456 191 L628 191" stroke="#b45309" stroke-width="4" fill="none"/><circle cx="143" cy="118" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="143" y="125" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="143" y="82" font-size="18" fill="#20334a" text-anchor="middle">权2</text><circle cx="63" cy="264" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="63" y="271" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="63" y="313" font-size="18" fill="#20334a" text-anchor="middle">权3</text><circle cx="239" cy="264" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="239" y="271" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="239" y="313" font-size="18" fill="#20334a" text-anchor="middle">权5</text><circle cx="456" cy="191" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="456" y="198" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="456" y="240" font-size="18" fill="#20334a" text-anchor="middle">权7</text><circle cx="628" cy="191" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="628" y="198" font-size="21" fill="#20334a" text-anchor="middle">5</text><text x="628" y="240" font-size="18" fill="#20334a" text-anchor="middle">权11</text><text x="326" y="126" font-size="20" fill="#20334a" text-anchor="start">删红虚线1—2，</text><text x="326" y="300" font-size="20" fill="#20334a" text-anchor="start">三角形仍经1—3—2连通</text><text x="22" y="367" font-size="20" fill="#20334a" text-anchor="start">分量{1,2,3}权10，{4,5}权18，合法答案|10−18|=8</text><text x="22" y="414" font-size="21" fill="#20334a" text-anchor="start">仅4—5是桥：bridges=1&lt;m=4，所以非桥确实存在</text><text x="22" y="461" font-size="20" fill="#20334a" text-anchor="start">删桥4—5会变3个分量；中途|28−2×11|=6不能用</text><text x="22" y="508" font-size="20" fill="#20334a" text-anchor="start">最终C=2分支忽略桥候选answer，直接输出两原分量差8</text><text x="22" y="567" font-size="20" fill="#20334a" text-anchor="start">对照：若左边只有1—2—3，没有三角形的第三条边</text><path d="M58 639 L167 639" stroke="#64748b" stroke-width="3" fill="none"/><path d="M167 639 L276 639" stroke="#64748b" stroke-width="3" fill="none"/><path d="M470 639 L627 639" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="58" cy="639" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="58" y="646" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="167" cy="639" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="167" y="646" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="276" cy="639" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="276" y="646" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="470" cy="639" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="470" y="646" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="627" cy="639" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="627" y="646" font-size="21" fill="#20334a" text-anchor="middle">5</text><text x="22" y="715" font-size="20" fill="#20334a" text-anchor="start">这时C仍为2，但bridges=m=3；任删一条都成3分量</text><text x="22" y="762" font-size="21" fill="#20334a" text-anchor="start">必须恰好删一条，不能什么都不删，故输出−1</text><text x="22" y="809" font-size="21" fill="#20334a" text-anchor="start">若初始≥3个分量，删边无法减少分量数，同样无解</text></g></svg>