<svg xmlns="http://www.w3.org/2000/svg" width="620" height="570" viewBox="0 0 620 570" role="img"><title>两张十元大券分别支付六元饮料找回八元小券，再买两份四元甜点的实际纸币余额</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="21" fill="#20334a" text-anchor="start">K=10：饮料 6、6；甜点 4、4；每种只买一次</text><text x="24" y="78" font-size="20" fill="#20334a" text-anchor="start">动作</text><text x="356" y="78" font-size="20" fill="#20334a" text-anchor="middle">小券张数</text><text x="524" y="78" font-size="20" fill="#20334a" text-anchor="middle">大券张数</text><text x="24" y="127" font-size="19" fill="#20334a" text-anchor="start">起点</text><rect x="320" y="96" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><rect x="488" y="96" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="356" y="127" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="524" y="127" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="24" y="198" font-size="19" fill="#20334a" text-anchor="start">买饮料①：付大券一张，找 4</text><rect x="320" y="167" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><rect x="488" y="167" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="356" y="198" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="524" y="198" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="24" y="269" font-size="19" fill="#20334a" text-anchor="start">买饮料②：付大券一张，找 4</text><rect x="320" y="238" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><rect x="488" y="238" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="356" y="269" font-size="25" fill="#20334a" text-anchor="middle">8</text><text x="524" y="269" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="24" y="340" font-size="19" fill="#20334a" text-anchor="start">买甜点①：付小券四张</text><rect x="320" y="309" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><rect x="488" y="309" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="356" y="340" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="524" y="340" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="24" y="411" font-size="19" fill="#20334a" text-anchor="start">买甜点②：付小券四张</text><rect x="320" y="380" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><rect x="488" y="380" width="72" height="46" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="356" y="411" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="524" y="411" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="24" y="504" font-size="21" fill="#20334a" text-anchor="start">大券共用 2 张，总付款 6+6+4+4=20，均可执行。</text><text x="24" y="542" font-size="21" fill="#a32e36" text-anchor="start">改成小券 10、大券 1：总钱相同，却买不了两杯。</text></g></svg>