<svg xmlns="http://www.w3.org/2000/svg" width="865" height="518" viewBox="0 0 865 518" role="img"><title>五次交替移动含一次零跳的真实二维路径</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="24" fill="#20334a" text-anchor="start">目标 (7,2)，k=3：横向三次机会，纵向一次有效移动</text><path d="M100,350 L730,350" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M100,350 L100,100" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="100" y="382" font-size="19" fill="#20334a" text-anchor="middle">0</text><text x="175" y="382" font-size="19" fill="#20334a" text-anchor="middle">1</text><text x="250" y="382" font-size="19" fill="#20334a" text-anchor="middle">2</text><text x="325" y="382" font-size="19" fill="#20334a" text-anchor="middle">3</text><text x="400" y="382" font-size="19" fill="#20334a" text-anchor="middle">4</text><text x="475" y="382" font-size="19" fill="#20334a" text-anchor="middle">5</text><text x="550" y="382" font-size="19" fill="#20334a" text-anchor="middle">6</text><text x="625" y="382" font-size="19" fill="#20334a" text-anchor="middle">7</text><text x="77" y="207" font-size="19" fill="#20334a" text-anchor="start">2</text><text x="77" y="357" font-size="19" fill="#20334a" text-anchor="start">0</text><text x="742" y="357" font-size="22" fill="#20334a" text-anchor="start">x</text><text x="94" y="84" font-size="22" fill="#20334a" text-anchor="start">y</text><path d="M100,350 L325,350" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M325,350 L325,200" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M325,200 L550,200" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M550,200 L625,200" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="100" cy="350" r="6" fill="#2563a6"/><circle cx="325" cy="350" r="6" fill="#2563a6"/><circle cx="325" cy="200" r="6" fill="#2563a6"/><circle cx="550" cy="200" r="6" fill="#2563a6"/><circle cx="625" cy="200" r="6" fill="#2563a6"/><text x="180" y="328" font-size="21" fill="#20334a" text-anchor="start">1：横 +3</text><text x="207" y="278" font-size="21" fill="#20334a" text-anchor="start">2：纵 +2</text><text x="380" y="175" font-size="21" fill="#20334a" text-anchor="start">3：横 +3</text><text x="583" y="240" font-size="21" fill="#20334a" text-anchor="start">5：横 +1</text><circle cx="550" cy="200" r="18" fill="none" stroke="#b36c17" stroke-width="3"/><text x="425" y="125" font-size="21" fill="#a06115" text-anchor="start">4：纵向走 0，仍在 (6,2)</text><text x="650" y="198" font-size="22" fill="#20334a" text-anchor="start">(7,2)</text><text x="25" y="444" font-size="21" fill="#20334a" text-anchor="start">位置：(0,0) → (3,0) → (3,2) → (6,2) → (6,2) → (7,2)</text><text x="25" y="486" font-size="22" fill="#20334a" text-anchor="start">第四步也计入答案；零跳后第五步才能再次横向</text></g></svg>