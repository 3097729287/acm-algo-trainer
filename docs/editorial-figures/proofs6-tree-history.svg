<svg xmlns="http://www.w3.org/2000/svg" width="720" height="713" viewBox="0 0 720 713" role="img"><title>真实十点树的三条匹配边和四个未匹配候选，六次合法询问依历史排除内部候选三，最后确定一，对所有相容隐藏路径都成立</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">真实10点树：绿色U={1,3,5,7}；粗蓝边为极大匹配</text><line x1="340" y1="83" x2="340" y2="157" stroke="#94a3b8" stroke-width="3"/><line x1="340" y1="157" x2="340" y2="245" stroke="#94a3b8" stroke-width="3"/><line x1="340" y1="245" x2="183" y2="328" stroke="#94a3b8" stroke-width="3"/><line x1="183" y1="328" x2="112" y2="414" stroke="#94a3b8" stroke-width="3"/><line x1="340" y1="245" x2="484" y2="328" stroke="#94a3b8" stroke-width="3"/><line x1="484" y1="328" x2="433" y2="414" stroke="#94a3b8" stroke-width="3"/><line x1="340" y1="157" x2="538" y2="157" stroke="#2d6db4" stroke-width="6"/><line x1="183" y1="328" x2="246" y2="414" stroke="#2d6db4" stroke-width="6"/><line x1="484" y1="328" x2="559" y2="414" stroke="#2d6db4" stroke-width="6"/><circle cx="340" cy="83" r="24" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="340" y="91" font-size="23" fill="#20334a" text-anchor="middle">1</text><circle cx="340" cy="157" r="24" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="340" y="165" font-size="23" fill="#20334a" text-anchor="middle">2</text><circle cx="340" cy="245" r="24" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="340" y="253" font-size="23" fill="#20334a" text-anchor="middle">3</text><circle cx="183" cy="328" r="24" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="183" y="336" font-size="23" fill="#20334a" text-anchor="middle">4</text><circle cx="484" cy="328" r="24" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="484" y="336" font-size="23" fill="#20334a" text-anchor="middle">6</text><circle cx="112" cy="414" r="24" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="112" y="422" font-size="23" fill="#20334a" text-anchor="middle">5</text><circle cx="246" cy="414" r="24" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="246" y="422" font-size="23" fill="#20334a" text-anchor="middle">9</text><circle cx="433" cy="414" r="24" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="433" y="422" font-size="23" fill="#20334a" text-anchor="middle">7</text><circle cx="559" cy="414" r="24" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="559" y="422" font-size="23" fill="#20334a" text-anchor="middle">10</text><circle cx="538" cy="157" r="24" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="538" y="165" font-size="23" fill="#20334a" text-anchor="middle">8</text><text x="22" y="470" font-size="21" fill="#20334a" text-anchor="start">前三问 (6,10)、(4,9)、(2,8) 均答0：只余绿色四个单点</text><text x="22" y="514" font-size="22" fill="#20334a" text-anchor="start">第4问 (5,3) 答0：再排除5和3，只余{1,7}</text><text x="22" y="558" font-size="22" fill="#20334a" text-anchor="start">第5问 (7,1) 答1，路径7—6—3—2—1</text><text x="22" y="602" font-size="21" fill="#20334a" text-anchor="start">内部3已由第4问排除，6和2已由匹配询问排除</text><text x="22" y="646" font-size="22" fill="#20334a" text-anchor="start">第6问 (7,7) 答0 ⇒ 输出1；总问数6=⌊10/2⌋+1</text><text x="22" y="688" font-size="21" fill="#20334a" text-anchor="start">裁判可换隐藏路径，但每个新路径都必须同时满足全部历史</text></g></svg>