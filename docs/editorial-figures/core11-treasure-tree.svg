<svg xmlns="http://www.w3.org/2000/svg" width="660" height="545" viewBox="0 0 660 545" role="img"><title>官方八点树及原权值，根深零，五号深三六号深四均两步可达，七号深五与八号深六不可达</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="34" font-size="21" fill="#20334a" text-anchor="start">官方八点树，k=2：绿可达，橙不可达；每点有物品</text><path d="M63 120 L175 120" stroke="#90a4bd" stroke-width="3"/><path d="M175 120 L270 63" stroke="#90a4bd" stroke-width="3"/><path d="M175 120 L285 185" stroke="#90a4bd" stroke-width="3"/><path d="M285 185 L390 185" stroke="#90a4bd" stroke-width="3"/><path d="M390 185 L495 185" stroke="#90a4bd" stroke-width="3"/><path d="M495 185 L600 185" stroke="#90a4bd" stroke-width="3"/><path d="M600 185 L600 290" stroke="#90a4bd" stroke-width="3"/><circle cx="63" cy="120" r="22" fill="#dcfce7" stroke="#20334a"/><text x="63" y="127" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="63" y="166" font-size="18" fill="#20334a" text-anchor="middle">值6</text><circle cx="175" cy="120" r="22" fill="#dcfce7" stroke="#20334a"/><text x="175" y="127" font-size="22" fill="#20334a" text-anchor="middle">2</text><text x="175" y="166" font-size="18" fill="#20334a" text-anchor="middle">值3</text><circle cx="270" cy="63" r="22" fill="#dcfce7" stroke="#20334a"/><text x="270" y="70" font-size="22" fill="#20334a" text-anchor="middle">3</text><text x="270" y="109" font-size="18" fill="#20334a" text-anchor="middle">值3</text><circle cx="285" cy="185" r="22" fill="#dcfce7" stroke="#20334a"/><text x="285" y="192" font-size="22" fill="#20334a" text-anchor="middle">4</text><text x="285" y="231" font-size="18" fill="#20334a" text-anchor="middle">值1</text><circle cx="390" cy="185" r="22" fill="#dcfce7" stroke="#20334a"/><text x="390" y="192" font-size="22" fill="#20334a" text-anchor="middle">5</text><text x="390" y="231" font-size="18" fill="#20334a" text-anchor="middle">值5</text><circle cx="495" cy="185" r="22" fill="#dcfce7" stroke="#20334a"/><text x="495" y="192" font-size="22" fill="#20334a" text-anchor="middle">6</text><text x="495" y="231" font-size="18" fill="#20334a" text-anchor="middle">值4</text><circle cx="600" cy="185" r="22" fill="#fff0d9" stroke="#20334a"/><text x="600" y="192" font-size="22" fill="#20334a" text-anchor="middle">7</text><text x="600" y="231" font-size="18" fill="#20334a" text-anchor="middle">值3</text><circle cx="600" cy="290" r="22" fill="#fff0d9" stroke="#20334a"/><text x="600" y="297" font-size="22" fill="#20334a" text-anchor="middle">8</text><text x="600" y="336" font-size="18" fill="#20334a" text-anchor="middle">值4</text><text x="24" y="375" font-size="21" fill="#20334a" text-anchor="start">到5：一步1→2→4，再一步4→5；共3边、2步。</text><text x="24" y="420" font-size="21" fill="#20334a" text-anchor="start">到6：一步1→2→4，再一步4→5→6；4边、2步。</text><text x="24" y="465" font-size="21" fill="#20334a" text-anchor="start">到7至少5边，任何2步最多4边，无法取到。</text><text x="24" y="510" font-size="21" fill="#20334a" text-anchor="start">分别出发停在1..6，各取一次：6+3+3+1+5+4=22。</text></g></svg>