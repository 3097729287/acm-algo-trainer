<svg xmlns="http://www.w3.org/2000/svg" width="720" height="734" viewBox="0 0 720 734" role="img"><title>六元素十十四六五负一中的前四项经选二选三再选二成为十六四四，五和负一不变，每步差分仅交换相邻偶数，奇差分一隔开末尾偶差分负六</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">替换中间值的三次真实动作，奇数差分1是边界</text><text x="22" y="106" font-size="20" fill="#20334a" text-anchor="start">初始</text><rect x="155" y="73" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="194.5" y="106" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="242" y="73" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="281.5" y="106" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="329" y="73" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="368.5" y="106" font-size="22" fill="#20334a" text-anchor="middle">8</text><rect x="416" y="73" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="455.5" y="106" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="503" y="73" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="542.5" y="106" font-size="22" fill="#20334a" text-anchor="middle">5</text><rect x="590" y="73" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="629.5" y="106" font-size="22" fill="#20334a" text-anchor="middle">-1</text><text x="22" y="159" font-size="20" fill="#20334a" text-anchor="start">对应差分</text><text x="231" y="159" font-size="22" fill="#234f81" text-anchor="middle">0</text><text x="318" y="159" font-size="22" fill="#234f81" text-anchor="middle">-2</text><text x="405" y="159" font-size="22" fill="#234f81" text-anchor="middle">-4</text><text x="492" y="159" font-size="22" fill="#b45309" text-anchor="middle">1</text><text x="579" y="159" font-size="22" fill="#234f81" text-anchor="middle">-6</text><text x="22" y="219" font-size="20" fill="#20334a" text-anchor="start">选i=2</text><rect x="155" y="186" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="194.5" y="219" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="242" y="186" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="281.5" y="219" font-size="22" fill="#20334a" text-anchor="middle">8</text><rect x="329" y="186" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="368.5" y="219" font-size="22" fill="#20334a" text-anchor="middle">8</text><rect x="416" y="186" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="455.5" y="219" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="503" y="186" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="542.5" y="219" font-size="22" fill="#20334a" text-anchor="middle">5</text><rect x="590" y="186" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="629.5" y="219" font-size="22" fill="#20334a" text-anchor="middle">-1</text><text x="22" y="272" font-size="20" fill="#20334a" text-anchor="start">对应差分</text><text x="231" y="272" font-size="22" fill="#234f81" text-anchor="middle">-2</text><text x="318" y="272" font-size="22" fill="#234f81" text-anchor="middle">0</text><text x="405" y="272" font-size="22" fill="#234f81" text-anchor="middle">-4</text><text x="492" y="272" font-size="22" fill="#b45309" text-anchor="middle">1</text><text x="579" y="272" font-size="22" fill="#234f81" text-anchor="middle">-6</text><text x="22" y="332" font-size="20" fill="#20334a" text-anchor="start">选i=3</text><rect x="155" y="299" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="194.5" y="332" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="242" y="299" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="281.5" y="332" font-size="22" fill="#20334a" text-anchor="middle">8</text><rect x="329" y="299" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="368.5" y="332" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="416" y="299" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="455.5" y="332" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="503" y="299" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="542.5" y="332" font-size="22" fill="#20334a" text-anchor="middle">5</text><rect x="590" y="299" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="629.5" y="332" font-size="22" fill="#20334a" text-anchor="middle">-1</text><text x="22" y="385" font-size="20" fill="#20334a" text-anchor="start">对应差分</text><text x="231" y="385" font-size="22" fill="#234f81" text-anchor="middle">-2</text><text x="318" y="385" font-size="22" fill="#234f81" text-anchor="middle">-4</text><text x="405" y="385" font-size="22" fill="#234f81" text-anchor="middle">0</text><text x="492" y="385" font-size="22" fill="#b45309" text-anchor="middle">1</text><text x="579" y="385" font-size="22" fill="#234f81" text-anchor="middle">-6</text><text x="22" y="445" font-size="20" fill="#20334a" text-anchor="start">再选i=2</text><rect x="155" y="412" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="194.5" y="445" font-size="22" fill="#20334a" text-anchor="middle">10</text><rect x="242" y="412" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="281.5" y="445" font-size="22" fill="#20334a" text-anchor="middle">6</text><rect x="329" y="412" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="368.5" y="445" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="416" y="412" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="455.5" y="445" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="503" y="412" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="542.5" y="445" font-size="22" fill="#20334a" text-anchor="middle">5</text><rect x="590" y="412" width="79" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="629.5" y="445" font-size="22" fill="#20334a" text-anchor="middle">-1</text><text x="22" y="498" font-size="20" fill="#20334a" text-anchor="start">对应差分</text><text x="231" y="498" font-size="22" fill="#234f81" text-anchor="middle">-4</text><text x="318" y="498" font-size="22" fill="#234f81" text-anchor="middle">-2</text><text x="405" y="498" font-size="22" fill="#234f81" text-anchor="middle">0</text><text x="492" y="498" font-size="22" fill="#b45309" text-anchor="middle">1</text><text x="579" y="498" font-size="22" fill="#234f81" text-anchor="middle">-6</text><text x="22" y="565" font-size="22" fill="#20334a" text-anchor="start">前3个偶差分从[0,−2,−4]排为[−4,−2,0]</text><text x="22" y="612" font-size="22" fill="#20334a" text-anchor="start">最后的−6虽更小，也不能跨过奇差分1</text><text x="22" y="659" font-size="21" fill="#20334a" text-anchor="start">每步只换相邻同奇偶差分；两侧原值同奇偶，动作合法</text><text x="22" y="706" font-size="21" fill="#20334a" text-anchor="start">最终[10,6,4,4,5,−1]；首项和末项均保持原值</text></g></svg>