<svg xmlns="http://www.w3.org/2000/svg" width="640" height="811" viewBox="0 0 640 811" role="img"><title>五段真实项链、两种多余字符分配和首差比较</title><rect width="640" height="811" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="35" class="title" text-anchor="start">线性项链：五个实际连续段</text><text x="24" y="77" class="small" text-anchor="start">A4 / B5 / C4；段型L|Q|L|Q|L</text><text x="24" y="114" class="" text-anchor="start">把多余Q放最后一个Q段</text><rect x="32" y="133" width="51" height="46" rx="5" fill="#bceacb" stroke="#7394aa"/><text x="57.5" y="163.0" class="" text-anchor="middle">L</text><text x="57" y="209" class="small" text-anchor="middle">1</text><rect x="96" y="133" width="51" height="46" rx="5" fill="#bceacb" stroke="#7394aa"/><text x="121.5" y="163.0" class="" text-anchor="middle">L</text><text x="121" y="209" class="small" text-anchor="middle">2</text><rect x="160" y="133" width="51" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="185.5" y="163.0" class="" text-anchor="middle">Q</text><text x="185" y="209" class="small" text-anchor="middle">3</text><rect x="224" y="133" width="51" height="46" rx="5" fill="#bceacb" stroke="#7394aa"/><text x="249.5" y="163.0" class="" text-anchor="middle">L</text><text x="249" y="209" class="small" text-anchor="middle">4</text><rect x="288" y="133" width="51" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="313.5" y="163.0" class="" text-anchor="middle">Q</text><text x="313" y="209" class="small" text-anchor="middle">5</text><rect x="352" y="133" width="51" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="377.5" y="163.0" class="" text-anchor="middle">Q</text><text x="377" y="209" class="small" text-anchor="middle">6</text><rect x="416" y="133" width="51" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="441.5" y="163.0" class="" te