ass="small" text-anchor="middle">5</text><rect x="352" y="349" width="51" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="377.5" y="379.0" class="" text-anchor="middle">Q</text><text x="377" y="425" class="small" text-anchor="middle">6</text><rect x="416" y="349" width="51" height="46" rx="5" fill="#bceacb" stroke="#7394aa"/><text x="441.5" y="379.0" class="" text-anchor="middle">L</text><text x="441" y="425" class="small" text-anchor="middle">7</text><rect x="480" y="349" width="51" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="505.5" y="379.0" class="" text-anchor="middle">Q</text><text x="505" y="425" class="small" text-anchor="middle">8</text><rect x="544" y="349" width="51" height="46" rx="5" fill="#bceacb" stroke="#7394aa"/><text x="569.5" y="379.0" class="" text-anchor="middle">L</text><text x="569" y="425" class="small" text-anchor="middle">9</text><line x1="153" y1="343" x2="153" y2="402" stroke="#aa4a32" stroke-width="3" stroke-dasharray=""/><line x1="409" y1="343" x2="409" y2="402" stroke="#aa4a32" stroke-width="3" stroke-dasharray=""/><line x1="473" y1="343" x2="473" y2="402" stroke="#aa4a32" stroke-width="3" stroke-dasharray=""/><line x1="537" y1="343" x2="537" y2="402" stroke="#aa4a32" stroke-width="3" stroke-dasharray=""/><text x="24" y="264" class="" text-anchor="start">四根段间线，恰有四次变化；不把首尾相连</text><text x="24" y="484" class="" text-anchor="start">第一个差别在位置四：上方L小于下方Q</text><text x="24" y="530" class="" text-anchor="start">多余L前移、多余Q后移，保持每段都非空</text><line x1="24" y1="555" x2="616" y2="555" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="24" y="597" class="" text-anchor="start">A1 / B3 / C2：LQL需要两个L，不可行</text><rect x="125" y="630" width="65" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="157.5" y="660.0" class="" text-anchor="middle">Q</text><rect x="210" y="630" width="65" height="46" rx="5" fill="#bceacb" stroke="#7394aa"/><text x="242.5" y="660.0" class="" text-anchor="middle">L</text><rect x="295" y="630" width="65" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="327.5" y="660.0" class="" text-anchor="middle">Q</text><rect x="380" y="630" width="65" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="412.5" y="660.0" class="" text-anchor="middle">Q</text><text x="24" y="727" class="" text-anchor="start">改用Q|L|QQ：一L三Q、两次变化</text><text x="24" y="773" class="" text-anchor="start">C0仅一段，两种字母同时非零则无解</text></svg>