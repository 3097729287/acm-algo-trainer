<svg xmlns="http://www.w3.org/2000/svg" width="720" height="797" viewBox="0 0 720 797" role="img"><title>键盘abbca下标零到四目标baac预算三，b在一二费用全零，输入a后零位置费用一四位置费用二，重复a不变；最后c三的左来源一减零加三四，右来源二加四减三三，真实二四四三移动二零一全部四字可达，仅留最小费用位置会误判</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">键盘s=abbca，目标t=baac，预算L=3</text><rect x="150" y="81" width="75" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="187.5" y="111" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="230" y="81" width="75" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="267.5" y="111" font-size="23" fill="#20334a" text-anchor="middle">b</text><rect x="310" y="81" width="75" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="347.5" y="111" font-size="23" fill="#20334a" text-anchor="middle">b</text><rect x="390" y="81" width="75" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="427.5" y="111" font-size="23" fill="#20334a" text-anchor="middle">c</text><rect x="470" y="81" width="75" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="507.5" y="111" font-size="23" fill="#20334a" text-anchor="middle">a</text><text x="187" y="153" font-size="18" fill="#20334a" text-anchor="middle">0</text><text x="267" y="153" font-size="18" fill="#20334a" text-anchor="middle">1</text><text x="347" y="153" font-size="18" fill="#20334a" text-anchor="middle">2</text><text x="427" y="153" font-size="18" fill="#20334a" text-anchor="middle">3</text><text x="507" y="153" font-size="18" fill="#20334a" text-anchor="middle">4</text><rect x="22" y="197" width="676" height="49" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="230" font-size="21" fill="#20334a" text-anchor="start">输入b</text><text x="212" y="230" font-size="21" fill="#20334a" text-anchor="start">位置1费用0</text><text x="455" y="230" font-size="21" fill="#20334a" text-anchor="start">位置2费用0</text><rect x="22" y="255" width="676" height="49" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="288" font-size="21" fill="#20334a" text-anchor="start">输入ba</text><text x="212" y="288" font-size="21" fill="#20334a" text-anchor="start">位置0费用1</text><text x="455" y="288" font-size="21" fill="#20334a" text-anchor="start">位置4费用2</text><rect x="22" y="313" width="676" height="49" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="346" font-size="21" fill="#20334a" text-anchor="start">输入baa</text><text x="212" y="346" font-size="21" fill="#20334a" text-anchor="start">位置0费用1</text><text x="455" y="346" font-size="21" fill="#20334a" text-anchor="start">位置4费用2</text><text x="22" y="421" font-size="21" fill="#20334a" text-anchor="start">最后要到c的位置3，左右来源分别计算：</text><text x="22" y="468" font-size="21" fill="#20334a" text-anchor="start">左侧a0：1−0+3=4；右侧a4：2+4−3=3</text><text x="22" y="515" font-size="21" fill="#20334a" text-anchor="start">费用2的历史状态反而达到预算3，不能丢掉</text><text x="22" y="569" font-size="20" fill="#20334a" text-anchor="start">真实路线：起点2的b →4的a →4的a →3的c</text><text x="22" y="616" font-size="22" fill="#20334a" text-anchor="start">移动2+0+1=3，四个字符全部输入</text><text x="22" y="673" font-size="20" fill="#20334a" text-anchor="start">若只保留当前最便宜的a0，最后会需4而误判</text><text x="22" y="720" font-size="21" fill="#20334a" text-anchor="start">两次扫描求历史费用±位置的最小值</text><text x="22" y="767" font-size="20" fill="#20334a" text-anchor="start">不只是找距离最近的字符，也不能只留全局最小</text></g></svg>