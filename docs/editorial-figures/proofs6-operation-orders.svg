<svg xmlns="http://www.w3.org/2000/svg" width="720" height="701" viewBox="0 0 720 701" role="img"><title>三个真实操作的全部六个排列及完整数值轨迹和增量贡献，显示联合事件仅在两行发生，初等对称系数用旧层完整运算数倒序更新得一三二</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">初值1；三个有身份的操作 A=+1、B=x2、C=x3</text><text x="112" y="86" font-size="21" fill="#20334a" text-anchor="middle">排列</text><text x="322" y="86" font-size="21" fill="#20334a" text-anchor="middle">实际数值轨迹</text><text x="534" y="86" font-size="21" fill="#20334a" text-anchor="middle">最终值</text><text x="659" y="86" font-size="21" fill="#20334a" text-anchor="middle">增量贡献</text><rect x="22" y="108" width="676" height="45" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="112" y="139" font-size="21" fill="#20334a" text-anchor="middle">A B C</text><text x="322" y="139" font-size="21" fill="#20334a" text-anchor="middle">1→2→4→12</text><text x="534" y="139" font-size="21" fill="#20334a" text-anchor="middle">12</text><text x="659" y="139" font-size="21" fill="#20334a" text-anchor="middle">6</text><rect x="22" y="160" width="676" height="45" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="112" y="191" font-size="21" fill="#20334a" text-anchor="middle">A C B</text><text x="322" y="191" font-size="21" fill="#20334a" text-anchor="middle">1→2→6→12</text><text x="534" y="191" font-size="21" fill="#20334a" text-anchor="middle">12</text><text x="659" y="191" font-size="21" fill="#20334a" text-anchor="middle">6</text><rect x="22" y="212" width="676" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="112" y="243" font-size="21" fill="#20334a" text-anchor="middle">B A C</text><text x="322" y="243" font-size="21" fill="#20334a" text-anchor="middle">1→2→3→9</text><text x="534" y="243" font-size="21" fill="#20334a" text-anchor="middle">9</text><text x="659" y="243" font-size="21" fill="#20334a" text-anchor="middle">3</text><rect x="22" y="264" width="676" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="112" y="295" font-size="21" fill="#20334a" text-anchor="middle">C A B</text><text x="322" y="295" font-size="21" fill="#20334a" text-anchor="middle">1→3→4→8</text><text x="534" y="295" font-size="21" fill="#20334a" text-anchor="middle">8</text><text x="659" y="295" font-size="21" fill="#20334a" text-anchor="middle">2</text><rect x="22" y="316" width="676" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="112" y="347" font-size="21" fill="#20334a" text-anchor="middle">B C A</text><text x="322" y="347" font-size="21" fill="#20334a" text-anchor="middle">1→2→6→7</text><text x="534" y="347" font-size="21" fill="#20334a" text-anchor="middle">7</text><text x="659" y="347" font-size="21" fill="#20334a" text-anchor="middle">1</text><rect x="22" y="368" width="676" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="112" y="399" font-size="21" fill="#20334a" text-anchor="middle">C B A</text><text x="322" y="399" font-size="21" fill="#20334a" text-anchor="middle">1→3→6→7</text><text x="534" y="399" font-size="21" fill="#20334a" text-anchor="middle">7</text><text x="659" y="399" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="22" y="458" font-size="21" fill="#20334a" text-anchor="start">初值贡献恒为6；增量贡献平均 (6+6+3+2+1+1)/6=19/6</text><text x="22" y="500" font-size="21" fill="#20334a" text-anchor="start">w₁=1加入后 e=[1,1,0]；再加入w₂=2，倒序读取旧层：</text><text x="22" y="544" font-size="23" fill="#20334a" text-anchor="start">先算e₂：0 + 旧e₁×2 = 0+1×2 = 2</text><text x="22" y="587" font-size="23" fill="#20334a" text-anchor="start">再算e₁：1 + 旧e₀×2 = 1+1×2 = 3</text><text x="22" y="632" font-size="23" fill="#20334a" text-anchor="start">W=1+3/2+2/3=19/6；答案6+19/6=55/6</text><text x="22" y="675" font-size="21" fill="#20334a" text-anchor="start">空子集项1必出现；两乘法项同时出现的概率2/6=1/3</text></g></svg>