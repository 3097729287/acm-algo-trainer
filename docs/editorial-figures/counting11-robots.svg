 stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="455" y="310" class="small" text-anchor="middle">8</text><line x1="505" y1="275" x2="505" y2="285" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="505" y="310" class="small" text-anchor="middle">9</text><line x1="555" y1="275" x2="555" y2="285" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="555" y="310" class="small" text-anchor="middle">10</text><path d="M46,271 L64,271 L55,251 Z" fill="#bd5864"/><path d="M346,271 L364,271 L355,251 Z" fill="#bd5864"/><path d="M546,271 L564,271 L555,251 Z" fill="#bd5864"/><rect x="92" y="95" width="26" height="25" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="105" y="114" class="small" text-anchor="middle">A</text><line x1="105" y1="119" x2="55" y2="136" stroke="#16867b" stroke-width="3" stroke-dasharray=""/><rect x="242" y="95" width="26" height="25" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="255" y="114" class="small" text-anchor="middle">B</text><line x1="255" y1="119" x2="205" y2="136" stroke="#16867b" stroke-width="3" stroke-dasharray=""/><rect x="392" y="95" width="26" height="25" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="405" y="114" class="small" text-anchor="middle">C</text><line x1="405" y1="119" x2="355" y2="136" stroke="#16867b" stroke-width="3" stroke-dasharray=""/><text x="24" y="207" class="" text-anchor="start">第1步L：A在0死，C在6死；仅B在3活</text><rect x="192" y="230" width="26" height="25" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="205" y="249" class="small" text-anchor="middle">B</text><line x1="205" y1="251" x2="355" y2="267" stroke="#16867b" stroke-width="3" stroke-dasharray=""/><text x="24" y="340" class="" text-anchor="start">随后三个R：B从3→4→5→6，第4步死亡</text><text x="24" y="383" class="" text-anchor="start">指令 L R R R R R R；真实存活 1 1 1 0 0 0 0</text><text x="24" y="428" class="" text-anchor="start">右候选树（左死者也可能仍在）</text><text x="24" y="487" class="" text-anchor="start">第1步：A B C</text><rect x="245" y="463" width="355" height="38" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="263" y="489" class="" text-anchor="start">候选3 − 左死2 = 1</text><text x="24" y="542" class="" text-anchor="start">第4步：A C</text><rect x="245" y="518" width="355" height="38" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="263" y="544" class="" text-anchor="start">候选2 − 左死2 = 0</text><text x="24" y="597" class="" text-anchor="start">第5步：A</text><rect x="245" y="573" width="355" height="38" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="263" y="599" class="" text-anchor="start">候选1 − 左死1 = 0</text><text x="24" y="668" class="" text-anchor="start">第5步只从树删除C，不是让C再死一次</text><text x="24" y="707" class="" text-anchor="start">L距离桶[1,4]中，桶1存A/C两人</text></svg>