"5" fill="#94a3b8"/><circle cx="130" cy="250" r="5" fill="#94a3b8"/><circle cx="230" cy="250" r="5" fill="#2563eb"/><circle cx="330" cy="250" r="5" fill="#2563eb"/><circle cx="430" cy="250" r="5" fill="#2563eb"/><circle cx="530" cy="250" r="5" fill="#94a3b8"/><circle cx="130" cy="350" r="5" fill="#2563eb"/><circle cx="230" cy="350" r="5" fill="#2563eb"/><circle cx="330" cy="350" r="5" fill="#2563eb"/><circle cx="430" cy="350" r="5" fill="#2563eb"/><circle cx="530" cy="350" r="5" fill="#2563eb"/><circle cx="130" cy="450" r="5" fill="#94a3b8"/><circle cx="230" cy="450" r="5" fill="#2563eb"/><circle cx="330" cy="450" r="5" fill="#2563eb"/><circle cx="430" cy="450" r="5" fill="#2563eb"/><circle cx="530" cy="450" r="5" fill="#94a3b8"/><circle cx="130" cy="550" r="5" fill="#94a3b8"/><circle cx="230" cy="550" r="5" fill="#94a3b8"/><circle cx="330" cy="550" r="5" fill="#2563eb"/><circle cx="430" cy="550" r="5" fill="#94a3b8"/><circle cx="530" cy="550" r="5" fill="#94a3b8"/><circle cx="330" cy="150" r="10" fill="#059669"/><circle cx="230" cy="150" r="10" fill="#dc2626"/><circle cx="330" cy="350" r="10" fill="#d97706"/><text x="280" y="178" font-size="19" fill="#20334a" text-anchor="middle">1格</text><text x="348" y="270" font-size="19" fill="#20334a" text-anchor="start">2格</text><text x="345" y="382" font-size="20" fill="#20334a" text-anchor="start">中心(3,3)</text><text x="22" y="615" font-size="21" fill="#20334a" text-anchor="start">绿点(1,3)：(-2)² + 0² = 4，圆周也涂#。</text><text x="22" y="662" font-size="21" fill="#20334a" text-anchor="start">红点(1,2)：(-2)² + (-1)² = 5，留句点。</text><text x="22" y="709" font-size="20" fill="#20334a" text-anchor="start">虚线两直角边：隔2行、1列；不是方格面积。</text></g></svg>