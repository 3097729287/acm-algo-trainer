<svg xmlns="http://www.w3.org/2000/svg" width="790" height="808" viewBox="0 0 790 808" role="img"><title>相同四乘四数独给定首行三四与三行二列二，先第一格填一使下一格行阻一三四列阻二，恢复格子和三掩码后二可放一可续，行掩码二十四二十六二十四</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#153655" font-size="24" text-anchor="start">同一4×4局面：试1失败，完整恢复后试2</text><text x="28" y="90" fill="#153655" font-size="20" text-anchor="start">试1：下一格无数字可填</text><rect x="28" y="118" width="61" height="61" rx="5" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/><text x="58" y="158" fill="#153655" font-size="26" text-anchor="middle">1</text><rect x="95" y="118" width="61" height="61" rx="5" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/><text x="125" y="158" fill="#153655" font-size="26" text-anchor="middle">·</text><rect x="162" y="118" width="61" height="61" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="192" y="158" fill="#153655" font-size="26" text-anchor="middle">3</text><rect x="229" y="118" width="61" height="61" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="259" y="158" fill="#153655" font-size="26" text-anchor="middle">4</text><rect x="28" y="185" width="61" height="61" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="58" y="225" fill="#153655" font-size="26" text-anchor="middle">·</text><rect x="95" y="185" width="61" height="61" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="125" y="225" fill="#153655" font-size="26" text-anchor="middle">·</text><rect x="162" y="185" width="61" height="61" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="192" y="225" fill="#153655" font-size="26" text-anchor="middle">·</text><rect x="229" y="185" width="61" height="61" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="259" y="225" fill="#153655" font-size="26" text-anchor="middle">·</text><rect x="28" y="252" width="61" height="61" rx="5" fill="#fff" stroke="#256