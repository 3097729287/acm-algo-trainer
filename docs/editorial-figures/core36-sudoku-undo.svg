"61" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="505" y="359" fill="#153655" font-size="26" text-anchor="middle">·</text><rect x="542" y="319" width="61" height="61" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="572" y="359" fill="#153655" font-size="26" text-anchor="middle">·</text><rect x="609" y="319" width="61" height="61" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="639" y="359" fill="#153655" font-size="26" text-anchor="middle">·</text><line x1="539" y1="114" x2="539" y2="381" stroke="#153655" stroke-width="3"/><line x1="404" y1="249" x2="671" y2="249" stroke="#153655" stroke-width="3"/><text x="24" y="455" fill="#153655" font-size="22" text-anchor="start">左图(1,2)：1/3/4被同行挡，2被同列挡。</text><text x="24" y="512" fill="#153655" font-size="22" text-anchor="start">(3,2)的固定2已预先记入列掩码，不能漏。</text><text x="24" y="578" fill="#153655" font-size="22" text-anchor="start">失败后：(1,1)由1恢复0；三个掩码都要撤销。</text><text x="24" y="638" fill="#153655" font-size="21" text-anchor="start">行：24 → 26 → 24；列0 → 2 → 0；宫0 → 2 → 0。</text><text x="24" y="700" fill="#153655" font-size="21" text-anchor="start">24只含数字3、4；26多了数字1对应的第1位。</text><text x="24" y="762" fill="#153655" font-size="22" text-anchor="start">改试2后(1,2)填1；找到整张解才返回成功。</text></svg>