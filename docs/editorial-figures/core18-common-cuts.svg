<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570" role="img"><title>同一零到十累计坐标轴上A原一二三四与B一五四，共同段末一六十同时保留，A原边界三删除表示相邻二和三合为五，真实只需一次合并</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">原数组的格宽就是数值，切点放在同一总量轴</text><text x="22" y="155" font-size="24" fill="#20334a" text-anchor="start">A</text><rect x="90" y="121" width="53" height="60" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="116.5" y="160" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="143" y="121" width="106" height="60" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="196.0" y="160" font-size="26" fill="#20334a" text-anchor="middle">2</text><rect x="249" y="121" width="159" height="60" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><text x="328.5" y="160" font-size="26" fill="#20334a" text-anchor="middle">3</text><rect x="408" y="121" width="212" height="60" rx="8" fill="#e9d5ff" stroke="#2d6db4" stroke-width="2"/><text x="514.0" y="160" font-size="26" fill="#20334a" text-anchor="middle">4</text><text x="22" y="310" font-size="24" fill="#20334a" text-anchor="start">B</text><rect x="90" y="276" width="53" height="60" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="116.5" y="315" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="143" y="276" width="265" height="60" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="275.5" y="315" font-size="26" fill="#20334a" text-anchor="middle">5</text><rect x="408" y="276" width="212" height="60" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><text x="514.0" y="315" font-size="26" fill="#20334a" text-anchor="middle">4</text><path d="M90 86 V351" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/><text x="90" y="382" font-size="22" fill="#20334a" text-anchor="middle">0</text><path d="M143 86 V351" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/><text x="143" y="382" font-size="22" fill="#20334a" text-anchor="middle">1</text><path d="M408 86 V351" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/><text x="408" y="382" font-size="22" fill="#20334a" text-anchor="middle">6</text><path d="M620 86 V351" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/><text x="620" y="382" font-size="22" fill="#20334a" text-anchor="middle">10</text><text x="249" y="220" font-size="20" fill="#20334a" text-anchor="middle">原边界3，仅A有</text><text x="22" y="439" font-size="21" fill="#20334a" text-anchor="start">合并A第2、3项：2+3=5；B不动，实际只需1次。</text><text x="22" y="485" font-size="21" fill="#20334a" text-anchor="start">三个真实段末1、6、10；0不产生额外段。</text><text x="22" y="531" font-size="20" fill="#20334a" text-anchor="start">代价=4+3−2×3=1，每段内部的合并可同时完成。</text></g></svg>