<svg xmlns="http://www.w3.org/2000/svg" width="780" height="705" viewBox="0 0 780 705" role="img"><title>实际三个半径一圆被六乘四方框相切包含，映射为三个闭的左下角允许矩形并在二二公共交点取得三个，纵向闭区间同点先加入再退出</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="21" fill="#20334a" text-anchor="start">左：原平面的圆与框；右：方框左下角(X,Y)的允许位置</text><line x1="44" y1="300" x2="44" y2="125" stroke="#e2e8f0"/><line x1="69" y1="300" x2="69" y2="125" stroke="#e2e8f0"/><line x1="94" y1="300" x2="94" y2="125" stroke="#e2e8f0"/><line x1="119" y1="300" x2="119" y2="125" stroke="#e2e8f0"/><line x1="144" y1="300" x2="144" y2="125" stroke="#e2e8f0"/><line x1="169" y1="300" x2="169" y2="125" stroke="#e2e8f0"/><line x1="194" y1="300" x2="194" y2="125" stroke="#e2e8f0"/><line x1="219" y1="300" x2="219" y2="125" stroke="#e2e8f0"/><line x1="244" y1="300" x2="244" y2="125" stroke="#e2e8f0"/><line x1="269" y1="300" x2="269" y2="125" stroke="#e2e8f0"/><line x1="294" y1="300" x2="294" y2="125" stroke="#e2e8f0"/><line x1="44" y1="300" x2="294" y2="300" stroke="#e2e8f0"/><line x1="44" y1="275" x2="294" y2="275" stroke="#e2e8f0"/><line x1="44" y1="250" x2="294" y2="250" stroke="#e2e8f0"/><line x1="44" y1="225" x2="294" y2="225" stroke="#e2e8f0"/><line x1="44" y1="200" x2="294" y2="200" stroke="#e2e8f0"/><line x1="44" y1="175" x2="294" y2="175" stroke="#e2e8f0"/><line x1="44" y1="150" x2="294" y2="150" stroke="#e2e8f0"/><line x1="44" y1="125" x2="294" y2="125" stroke="#e2e8f0"/><line x1="430" y1="300" x2="430" y2="125" stroke="#e2e8f0"/><line x1="455" y1="300" x2="455" y2="125" stroke="#e2e8f0"/><line x1="480" y1="300" x2="480" y2="125" stroke="#e2e8f0"/><line x1="505" y1="300" x2="505" y2="125" stroke="#e2e8f0"/><line x1="530" y1="300" x2="530" y2="125" stroke="#e2e8f0"/><line x1="555" y1="300" x2="555" y2="125" stroke="#e2e8f0"/><line x1="580" y1="300" x2="580" y2="125" stroke="#e2e8f0"/><line x1="605" y1="300" x2="605" y2="125" stroke="#e2e8f0"/><line x1="630" y1="300" x2="630" y2="125" stroke="#e2e8f0"/><line x1="430" y1="300" x2="630" y2="300" stroke="#e2e8f0"/><line x1="430" y1="275" x2="630" y2="275" stroke="#e2e8f0"/><line x1="430" y1="250" x2="630" y2="250" stroke="#e2e8f0"/><line x1="430" y1="225" x2="630" y2="225" stroke="#e2e8f0"/><line x1="430" y1="200" x2="630" y2="200" stroke="#e2e8f0"/><line x1="430" y1="175" x2="630" y2="175" stroke="#e2e8f0"/><line x1="430" y1="150" x2="630" y2="150" stroke="#e2e8f0"/><line x1="430" y1="125" x2="630" y2="125" stroke="#e2e8f0"/><rect x="94" y="150" width="150" height="100" fill="#ecfdf5" fill-opacity="0.65" stroke="#059669" stroke-width="3"/><circle cx="119" cy="225" r="25" fill="#dbeafe" fill-opacity="0.65" stroke="#2563eb" stroke-width="2"/><text x="119" y="232" font-size="21" fill="#20334a" text-anchor="middle">A</text><circle cx="219" cy="225" r="25" fill="#dbeafe" fill-opacity="0.65" stroke="#2563eb" stroke-width="2"/><text x="219" y="232" font-size="21" fill="#20334a" text-anchor="middle">B</text><circle cx="169" cy="175" r="25" fill="#dbeafe" fill-opacity="0.65" stroke="#2563eb" stroke-width="2"/><text x="169" y="182" font-size="21" fill="#20334a" text-anchor="middle">C</text><text x="94" y="279" font-size="18" fill="#20334a" text-anchor="start">(2,2)</text><text x="244" y="139" font-size="18" fill="#20334a" text-anchor="end">(8,6)</text><text x="24" y="341" font-size="18" fill="#20334a" text-anchor="start">宽6高4，A左切、B右切、C上切。</text><rect x="430" y="250" width="50" height="50" fill="#dbeafe" fill-opacity="0.55" stroke="#475569" stroke-width="2"/><text x="455.0" y="282.0" font-size="22" fill="#20334a" text-anchor="middle">A</text><rect x="480" y="250" width="100" height="50" fill="#fed7aa" fill-opacity="0.55" stroke="#475569" stroke-width="2"/><text x="530.0" y="282.0" font-size="22" fill="#20334a" text-anchor="middle">B</text><rect x="430" y="200" width="100" height="50" fill="#e9d5ff" fill-opacity="0.55" stroke="#475569" stroke-width="2"/><text x="508.0" y="232.0" font-size="22" fill="#20334a" text-anchor="middle">C</text><line x1="480" y1="142" x2="480" y2="315" stroke="#059669" stroke-dasharray="6,5" stroke-width="2"/><circle cx="480" cy="250" r="5" fill="#dc2626"/><path d="M486,250 L588,233" fill="none" stroke="#dc2626"/><text x="595" y="236" font-size="18" fill="#20334a" text-anchor="start">共同点(2,2)</text><text x="430" y="341" font-size="17" fill="#20334a" text-anchor="start">A[0,2]×[0,2]；B[2,6]×[0,2]</text><text x="430" y="372" font-size="18" fill="#20334a" text-anchor="start">C[0,4]×[2,4]；竖线X=2。</text><text x="24" y="418" font-size="21" fill="#20334a" text-anchor="start">固定X=2后，在同一Y轴上看闭区间：</text><text x="32" y="468" font-size="20" fill="#20334a" text-anchor="start">A</text><line x1="160" y1="462" x2="380" y2="462" stroke="#2563eb" stroke-width="5"/><circle cx="160" cy="462" r="5" fill="#2563eb"/><circle cx="380" cy="462" r="5" fill="#2563eb"/><text x="32" y="511" font-size="20" fill="#20334a" text-anchor="start">B</text><line x1="160" y1="505" x2="380" y2="505" stroke="#ea580c" stroke-width="5"/><circle cx="160" cy="505" r="5" fill="#ea580c"/><circle cx="380" cy="505" r="5" fill="#ea580c"/><text x="32" y="554" font-size="20" fill="#20334a" text-anchor="start">C</text><line x1="380" y1="548" x2="600" y2="548" stroke="#9333ea" stroke-width="5"/><circle cx="380" cy="548" r="5" fill="#9333ea"/><circle cx="600" cy="548" r="5" fill="#9333ea"/><line x1="380" y1="440" x2="380" y2="570" stroke="#059669" stroke-width="2" stroke-dasharray="5,4"/><text x="160" y="582" font-size="18" fill="#20334a" text-anchor="middle">Y=0</text><text x="380" y="582" font-size="18" fill="#20334a" text-anchor="middle">Y=2</text><text x="600" y="582" font-size="18" fill="#20334a" text-anchor="middle">Y=4</text><text x="24" y="626" font-size="21" fill="#20334a" text-anchor="start">Y=2先+C：2→3；再−A、−B。相切位置也取得3。</text><text x="24" y="670" font-size="20" fill="#20334a" text-anchor="start">配置平面的点才是一次放框；区域数就是所得圆数。</text></g></svg>