<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#26826e"/></marker></defs><rect width="480" height="100%" rx="8" fill="#f7fafc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#17334d"><text x="18" y="28" font-size="16" font-weight="600">先限制路径点数，再按真实边数分层</text><text x="18" y="58">官方6点例：k≤3，故只允许j≤2条边</text><line x1="68.18743511966511" y1="159.50156184149412" x2="153.08042820227155" y2="110.49828941169692" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><text x="108.5" y="127.5">2</text><line x1="194.0" y1="99.0" x2="284.0" y2="99.0" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><text x="237.0" y="92.0">3</text><line x1="325.1874351196651" y1="109.49843815850588" x2="410.08042820227155" y2="158.5017105883031" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><text x="365.5" y="127.5">4</text><line x1="67.99443010158706" y1="180.82591729688977" x2="153.29181465064275" y2="232.14304296054928" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><text x="108.5" y="200.0">1</text><line x1="194.0" y1="244.0" x2="284.0" y2="244.0" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><text x="237.0" y="237.0">1</text><line x1="324.99443010158706" y1="233.17408270311023" x2="410.2918146506427" y2="181.85695703945072" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><text x="365.5" y="200.0">1</text><line x1="71.0" y1="170.0" x2="407.0" y2="170.0" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><text x="237.0" y="163.0">10</text><circle cx="50" cy="170" r="19" fill="#e7f2ff" stroke="#4984bd"/><text x="46" y="175">1</text><circle cx="173" cy="99" r="19" fill="#e7f2ff" stroke="#4984bd"/><text x="169" y="104">2</text><circle cx="307" cy="99" r="19" fill="#e7f2ff" stroke="#4984bd"/><text x="303" y="104">3</text><circle cx="173" cy="244" r="19" fill="#e7f2ff" stroke="#4984bd"/><text x="169" y="249">4</text><circle cx="307" cy="244" r="19" fill="#e7f2ff" stroke="#4984bd"/><text x="303" y="249">5</text><circle cx="430" cy="170" r="19" fill="#e7f2ff" stroke="#4984bd"/><text x="426" y="175">6</text><text x="18" y="304">1→4→5→6虽只需3，但用4点；外面仅2点</text><text x="18" y="332">不能再删4点，因此便宜路线不合法</text><text x="18" y="370">每行是“恰走j条边”的独立问题，∞为不可达</text><text x="20" y="404">j</text><text x="85" y="404">点1</text><text x="150" y="404">点2</text><text x="215" y="404">点3</text><text x="280" y="404">点4</text><text x="345" y="404">点5</text><text x="410" y="404">点6</text><rect x="12" y="422" width="454" height="42" rx="4" fill="#eef4fc" stroke="#4984bd"/><text x="22" y="449">0</text><text x="87" y="449">0</text><text x="152" y="449">∞</text><text x="217" y="449">∞</text><text x="282" y="449">∞</text><text x="347" y="449">∞</text><text x="412" y="449">∞</text><rect x="12" y="473" width="454" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="22" y="500">1</text><text x="87" y="500">∞</text><text x="152" y="500">2</text><text x="217" y="500">∞</text><text x="282" y="500">1</text><text x="347" y="500">∞</text><text x="412" y="500">10</text><rect x="12" y="524" width="454" height="42" rx="4" fill="#eef4fc" stroke="#4984bd"/><text x="22" y="551">2</text><text x="87" y="551">∞</text><text x="152" y="551">∞</text><text x="217" y="551">5</text><text x="282" y="551">∞</text><text x="347" y="551">2</text><text x="412" y="551">∞</text><text x="18" y="605">j=1：由旧dp0[1]=0，加边(1,6,10)得10</text><text x="18" y="637">j=2：先清空新层；没有恰两边到6的路线</text><text x="18" y="670">ans记录所有允许层：∞→10→10，不被∞覆盖</text><text x="18" y="707">1→6只用2点，余下4点中任选2点删除即可</text><text x="18" y="743">若同层连续读到刚写的点4和点5，会偷走3边</text><text x="18" y="775">dp读旧行、ndp写新行；交换后再处理下一层</text></g></svg>