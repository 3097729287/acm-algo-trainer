<svg xmlns="http://www.w3.org/2000/svg" width="480" height="775" viewBox="0 0 480 775"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#26826e"/></marker></defs><rect width="480" height="100%" rx="8" fill="#f7fafc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#17334d"><text x="18" y="28" font-size="16" font-weight="600">三个坏块：两个端点一次照顾至多两块</text><text x="18" y="58">约束为[1,2] / [3,4] / [5,6] / [7,8]</text><text x="18" y="89">原串11010011；第2块01已平衡，其余三坏</text><text x="37" y="122">1</text><text x="92" y="122">2</text><text x="147" y="122">3</text><text x="202" y="122">4</text><text x="257" y="122">5</text><text x="312" y="122">6</text><text x="367" y="122">7</text><text x="422" y="122">8</text><rect x="22" y="139" width="48" height="42" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="30" y="165.0">1</text><rect x="77" y="139" width="48" height="42" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="85" y="165.0">1</text><rect x="132" y="139" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="140" y="165.0">0</text><rect x="187" y="139" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="195" y="165.0">1</text><rect x="242" y="139" width="48" height="42" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="250" y="165.0">0</text><rect x="297" y="139" width="48" height="42" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="305" y="165.0">0</text><rect x="352" y="139" width="48" height="42" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="360" y="165.0">1</text><rect x="407" y="139" width="48" height="42" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="415" y="165.0">1</text><line x1="73" y1="131" x2="73" y2="193" stroke="#bd3f55" stroke-width="2" stroke-dasharray="5 4"/><line x1="293" y1="131" x2="293" y2="193" stroke="#bd3f55" stroke-width="2" stroke-dasharray="5 4"/><line x1="403" y1="131" x2="403" y2="193" stroke="#bd3f55" stroke-width="2" stroke-dasharray="5 4"/><text x="18" y="219">红虚线：每个坏块内部都必须有一次奇偶变化</text><text x="18" y="251">一操作最多提供2个边界，2t≥3，因此t≥2</text><text x="18" y="293">先翻[2,5]：左块后缀+右块前缀连成一段</text><line x1="77" y1="320" x2="290" y2="320" stroke="#26826e" stroke-width="2"/><line x1="77" y1="315" x2="77" y2="325" stroke="#26826e" stroke-width="2"/><line x1="290" y1="315" x2="290" y2="325" stroke="#26826e" stroke-width="2"/><text x="135" y="311">翻第2..5格</text><rect x="22" y="340" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="30" y="366.0">1</text><rect x="77" y="340" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="85" y="366.0">0</text><rect x="132" y="340" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="140" y="366.0">1</text><rect x="187" y="340" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="195" y="366.0">0</text><rect x="242" y="340" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="250" y="366.0">1</text><rect x="297" y="340" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="305" y="366.0">0</text><rect x="352" y="340" width="48" height="42" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="360" y="366.0">1</text><rect x="407" y="340" width="48" height="42" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="415" y="366.0">1</text><text x="18" y="414">中间第2块01被整翻成10，仍然平衡</text><text x="18" y="448">再翻[8,8]：最后的11变成10</text><rect x="22" y="473" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="30" y="499.0">1</text><rect x="77" y="473" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="85" y="499.0">0</text><rect x="132" y="473" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="140" y="499.0">1</text><rect x="187" y="473" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="195" y="499.0">0</text><rect x="242" y="473" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="250" y="499.0">1</text><rect x="297" y="473" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="305" y="499.0">0</text><rect x="352" y="473" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="360" y="499.0">1</text><rect x="407" y="473" width="48" height="42" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="415" y="499.0">0</text><text x="18" y="552">四块均为10；真实两次操作达到下界</text><line x1="18" y1="578" x2="462" y2="578" stroke="#6c8294" stroke-width="2"/><text x="18" y="612">原各块的ones：2 / 1 / 0 / 2，长度都是2</text><text x="18" y="648">2×ones!=len 对应坏 / 好 / 坏 / 坏</text><text x="18" y="685">bad：0→1→1→2→3；(bad+1)/2=2</text><text x="18" y="722">原输入区间可乱序：计数不用真的排序或执行翻转</text><text x="18" y="755">奇数长度连“各占一半”都不能做到，先返回−1</text></g></svg>