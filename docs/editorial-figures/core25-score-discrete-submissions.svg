<svg xmlns="http://www.w3.org/2000/svg" width="720" height="626" viewBox="0 0 720 626" role="img"><title>满分七百五十用时二十五时整数提交次数一到十二的实际得分点，首675第四525第五475第十及以后225，目标700无解500最大4次225无限</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">a=750、s=25：base675、保底225</text><path d="M55 425 L653 425" fill="none" stroke="#64748b" stroke-width="2"/><path d="M55 70 L55 425" fill="none" stroke="#64748b" stroke-width="2"/><path d="M55 117.0 L653 117.0" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/><text x="660" y="123.0" font-size="17" fill="#20334a" text-anchor="start">700</text><path d="M55 205.0 L653 205.0" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><text x="660" y="211.0" font-size="17" fill="#20334a" text-anchor="start">500</text><path d="M55 326.0 L653 326.0" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4"/><text x="660" y="332.0" font-size="17" fill="#20334a" text-anchor="start">225</text><circle cx="55" cy="128.0" r="5" fill="#475569"/><text x="55" y="449" font-size="17" fill="#20334a" text-anchor="middle">1</text><text x="60" y="116.0" font-size="17" fill="#20334a" text-anchor="start">675</text><circle cx="103" cy="150.0" r="5" fill="#475569"/><text x="103" y="449" font-size="17" fill="#20334a" text-anchor="middle">2</text><circle cx="151" cy="172.0" r="5" fill="#475569"/><text x="151" y="449" font-size="17" fill="#20334a" text-anchor="middle">3</text><circle cx="199" cy="194.0" r="5" fill="#475569"/><text x="199" y="449" font-size="17" fill="#20334a" text-anchor="middle">4</text><text x="204" y="182.0" font-size="17" fill="#20334a" text-anchor="start">525</text><circle cx="247" cy="216.0" r="5" fill="#475569"/><text x="247" y="449" font-size="17" fill="#20334a" text-anchor="middle">5</text><text x="252" y="204.0" font-size="17" fill="#20334a" text-anchor="start">475</text><circle cx="295" cy="238.0" r="5" fill="#475569"/><text x="295" y="449" font-size="17" fill="#20334a" text-anchor="middle">6</text><circle cx="343" cy="260.0" r="5" fill="#475569"/><text x="343" y="449" font-size="17" fill="#20334a" text-anchor="middle">7</text><circle cx="391" cy="282.0" r="5" fill="#475569"/><text x="391" y="449" font-size="17" fill="#20334a" text-anchor="middle">8</text><circle cx="439" cy="304.0" r="5" fill="#475569"/><text x="439" y="449" font-size="17" fill="#20334a" text-anchor="middle">9</text><circle cx="487" cy="326.0" r="5" fill="#475569"/><text x="487" y="449" font-size="17" fill="#20334a" text-anchor="middle">10</text><text x="492" y="314.0" font-size="17" fill="#20334a" text-anchor="start">225</text><circle cx="535" cy="326.0" r="5" fill="#475569"/><text x="535" y="449" font-size="17" fill="#20334a" text-anchor="middle">11</text><circle cx="583" cy="326.0" r="5" fill="#475569"/><text x="583" y="449" font-size="17" fill="#20334a" text-anchor="middle">12</text><text x="22" y="493" font-size="21" fill="#20334a" text-anchor="start">横轴k为实际提交次数，只取整数点。</text><text x="22" y="540" font-size="19" fill="#20334a" text-anchor="start">目标700无解，输出0；目标500最多4次（525≥500）。</text><text x="22" y="585" font-size="20" fill="#20334a" text-anchor="start">第5次475&lt;500；目标225恰是保底，次数为inf。</text></g></svg>