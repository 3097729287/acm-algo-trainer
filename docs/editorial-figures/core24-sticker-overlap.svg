<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img"><title>三段纸带A和B和C拼接前有六张端点贴纸，拼接后A右B左及B右C左两处完全重合，独立两端和两个接头合四个可见位置</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="36" font-size="23" fill="#20334a" text-anchor="start">三段真实纸带：每段两端各一张贴纸</text><text x="22" y="81" font-size="21" fill="#20334a" text-anchor="start">拼接前：六张贴纸分别可见</text><rect x="50" y="130" width="150" height="58" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="125" y="166" font-size="22" fill="#20334a" text-anchor="middle">A纸带</text><circle cx="50" cy="159" r="13" fill="#fb7185" stroke="#9f1239" stroke-width="2"/><text x="50" y="219" font-size="19" fill="#20334a" text-anchor="middle">A左</text><circle cx="200" cy="159" r="13" fill="#fb7185" stroke="#9f1239" stroke-width="2"/><text x="200" y="219" font-size="19" fill="#20334a" text-anchor="middle">A右</text><rect x="270" y="130" width="150" height="58" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="345" y="166" font-size="22" fill="#20334a" text-anchor="middle">B纸带</text><circle cx="270" cy="159" r="13" fill="#fb7185" stroke="#9f1239" stroke-width="2"/><text x="270" y="219" font-size="19" fill="#20334a" text-anchor="middle">B左</text><circle cx="420" cy="159" r="13" fill="#fb7185" stroke="#9f1239" stroke-width="2"/><text x="420" y="219" font-size="19" fill="#20334a" text-anchor="middle">B右</text><rect x="490" y="130" width="150" height="58" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="565" y="166" font-size="22" fill="#20334a" text-anchor="middle">C纸带</text><circle cx="490" cy="159" r="13" fill="#fb7185" stroke="#9f1239" stroke-width="2"/><text x="490" y="219" font-size="19" fill="#20334a" text-anchor="middle">C左</text><circle cx="640" cy="159" r="13" fill="#fb7185" stroke="#9f1239" stroke-width="2"/><text x="640" y="219" font-size="19" fill="#20334a" text-anchor="middle">C右</text><text x="22" y="285" font-size="21" fill="#20334a" text-anchor="start">拼接后：四个位置可见，两处各重叠一对</text><rect x="80" y="350" width="160" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="160" y="390" font-size="22" fill="#20334a" text-anchor="middle">A纸带</text><rect x="240" y="350" width="160" height="65" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="320" y="390" font-size="22" fill="#20334a" text-anchor="middle">B纸带</text><rect x="400" y="350" width="160" height="65" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="480" y="390" font-size="22" fill="#20334a" text-anchor="middle">C纸带</text><circle cx="80" cy="382" r="14" fill="#fb7185" stroke="#334155" stroke-width="2"/><text x="80" y="455" font-size="19" fill="#20334a" text-anchor="middle">A左</text><text x="80" y="495" font-size="19" fill="#20334a" text-anchor="middle">位置1</text><circle cx="240" cy="382" r="14" fill="#34d399" stroke="#334155" stroke-width="2"/><text x="240" y="455" font-size="19" fill="#20334a" text-anchor="middle">A右 / B左</text><text x="240" y="495" font-size="19" fill="#20334a" text-anchor="middle">位置2</text><circle cx="400" cy="382" r="14" fill="#34d399" stroke="#334155" stroke-width="2"/><text x="400" y="455" font-size="19" fill="#20334a" text-anchor="middle">B右 / C左</text><text x="400" y="495" font-size="19" fill="#20334a" text-anchor="middle">位置3</text><circle cx="560" cy="382" r="14" fill="#fb7185" stroke="#334155" stroke-width="2"/><text x="560" y="455" font-size="19" fill="#20334a" text-anchor="middle">C右</text><text x="560" y="495" font-size="19" fill="#20334a" text-anchor="middle">位置4</text><text x="22" y="555" font-size="20" fill="#20334a" text-anchor="start">接头各只看见一张；链的左端与右端没有接在一起。</text><text x="22" y="606" font-size="22" fill="#20334a" text-anchor="start">6张原贴纸−2个接头各少见1张=4个可见位置</text><text x="22" y="657" font-size="20" fill="#20334a" text-anchor="start">n=1时只有一段，两个端点都可见，没有接头。</text></g></svg>