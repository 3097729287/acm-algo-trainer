<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img"><title>四架原飞机分别一三停机位一二四停机位二，飞机四离开后机位二只剩二，而历史仍保留身份二四，当前二一与历史二二不同</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">两机位：飞机身份与机位编号是两种下标</text><text x="22" y="78" font-size="20" fill="#20334a" text-anchor="start">前四架落地机位1/2/1/2；现在飞机4起飞</text><text x="22" y="130" font-size="20" fill="#20334a" text-anchor="start">起飞前</text><text x="57" y="169" font-size="20" fill="#20334a" text-anchor="start">1号机位当前</text><rect x="57" y="184" width="260" height="74" rx="8" fill="#f8fafc" stroke="#2d6db4" stroke-width="2"/><rect x="69" y="197" width="92" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="115" y="230" font-size="20" fill="#20334a" text-anchor="middle">飞机1</text><rect x="177" y="197" width="92" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="223" y="230" font-size="20" fill="#20334a" text-anchor="middle">飞机3</text><text x="402" y="169" font-size="20" fill="#20334a" text-anchor="start">2号机位当前</text><rect x="402" y="184" width="260" height="74" rx="8" fill="#f8fafc" stroke="#2d6db4" stroke-width="2"/><rect x="414" y="197" width="92" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="460" y="230" font-size="20" fill="#20334a" text-anchor="middle">飞机2</text><rect x="522" y="197" width="92" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="568" y="230" font-size="20" fill="#20334a" text-anchor="middle">飞机4</text><text x="22" y="301" font-size="21" fill="#20334a" text-anchor="start">实际数量：2、2</text><text x="22" y="336" font-size="20" fill="#20334a" text-anchor="start">起飞后：pos4=2，只从2号当前集合移走4</text><text x="57" y="375" font-size="20" fill="#20334a" text-anchor="start">1号机位当前</text><rect x="57" y="390" width="260" height="74" rx="8" fill="#f8fafc" stroke="#2d6db4" stroke-width="2"/><rect x="69" y="403" width="92" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="115" y="436" font-size="20" fill="#20334a" text-anchor="middle">飞机1</text><rect x="177" y="403" width="92" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="223" y="436" font-size="20" fill="#20334a" text-anchor="middle">飞机3</text><text x="402" y="375" font-size="20" fill="#20334a" text-anchor="start">2号机位当前</text><rect x="402" y="390" width="260" height="74" rx="8" fill="#f8fafc" stroke="#2d6db4" stroke-width="2"/><rect x="414" y="403" width="92" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="460" y="436" font-size="20" fill="#20334a" text-anchor="middle">飞机2</text><text x="22" y="507" font-size="21" fill="#20334a" text-anchor="start">实际数量：2、1</text><text x="22" y="589" font-size="22" fill="#20334a" text-anchor="start">历史集合始终：1号{1,3}；2号{2,4}。</text><text x="22" y="638" font-size="22" fill="#20334a" text-anchor="start">最终两行：当前2 1；曾停靠2 2。</text></g></svg>