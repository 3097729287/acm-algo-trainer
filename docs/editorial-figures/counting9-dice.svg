<svg xmlns="http://www.w3.org/2000/svg" width="640" height="727" viewBox="0 0 640 727" role="img"><title>Dice Roll：真实一次修改与全部三层六末面状态</title><rect width="640" height="727" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">原[1,6,1] → 改成[1,2,1]，只付一次</text><text x="24" y="75" class="small" text-anchor="start">对面：1↔6、2↔5、3↔4；相同面也不相邻</text><rect x="152" y="104" width="72" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="188" y="134" class="" text-anchor="middle">1</text><line x1="230" y1="127" x2="273" y2="127" stroke="#c54c43" stroke-width="3" stroke-dasharray=""/><rect x="280" y="104" width="72" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="316" y="134" class="" text-anchor="middle">6</text><line x1="358" y1="127" x2="401" y2="127" stroke="#c54c43" stroke-width="3" stroke-dasharray=""/><rect x="408" y="104" width="72" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="444" y="134" class="" text-anchor="middle">1</text><rect x="152" y="195" width="72" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="188" y="225" class="" text-anchor="middle">1</text><line x1="230" y1="218" x2="273" y2="218" stroke="#168377" stroke-width="3" stroke-dasharray=""/><rect x="280" y="195" width="72" height="45" rx="5" fill="#fff1a8" stroke="#7394aa"/><text x="316" y="225" class="" text-anchor="middle">2</text><line x1="358" y1="218" x2="401" y2="218" stroke="#168377" stroke-width="3" stroke-dasharray=""/><rect x="408" y="195" width="72" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="444" y="225" class="" text-anchor="middle">1</text><text x="24" y="278" class="small" text-anchor="start">列=当前末面v；绿路径=实际选择1→2→1</text><text x="150" y="314" class="small" text-anchor="middle">1</text><text x="227" y="314" class="small" text-anchor="middle">2</text><text x="304" y="314" class="small" text-anchor="middle">3</text><text x="381" y="314" class="small" text-anchor="middle">4</text><text x="458" y="314" class="small" text-anchor="middle">5</text><text x="535" y="314" class="small" text-anchor="middle">6</text><text x="24" y="359" class="small" text-anchor="start">读入1</text><rect x="118" y="331" width="64" height="46" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="150" y="362" class="" text-anchor="middle">0</text><rect x="195" y="331" width="64" height="46" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="227" y="362" class="" text-anchor="middle">1</text><rect x="272" y="331" width="64" height="46" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="304" y="362" class="" text-anchor="middle">1</text><rect x="349" y="331" width="64" height="46" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="381" y="362" class="" text-anchor="middle">1</text><rect x="426" y="331" width="64" height="46" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="458" y="362" class="" text-anchor="middle">1</text><rect x="503" y="331" width="64" height="46" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="535" y="362" class="" text-anchor="middle">1</text><text x="24" y="453" class="small" text-anchor="start">再读6</text><rect x="118" y="425" width="64" height="46" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="150" y="456" class="" text-anchor="middle">2</text><rect x="195" y="425" width="64" height="46" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="227" y="456" class="" text-anchor="middle">1</text><rect x="272" y="425" width="64" height="46" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="304" y="456" class="" text-anchor="middle">1</text><rect x="349" y="425" width="64" height="46" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="381" y="456" class="" text-anchor="middle">1</text><rect x="426" y="425" width="64" height="46" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="458" y="456" class="" text-anchor="middle">1</te