<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" role="img"><title>卡片身份、数值间隙与胜负状态</title><rect width="640" height="590" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">原五张牌与一次真实的获胜对局</text><text x="24" y="72" class="small" text-anchor="start">a = [1,2,4,4,4]，k = 1；颜色标记实际取牌</text><rect x="90" y="105" width="52" height="38" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="116.0" y="131.0" class="" text-anchor="middle">1</text><text x="116" y="166" class="small" text-anchor="middle">嘉宾取</text><rect x="185" y="105" width="52" height="38" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="211.0" y="131.0" class="" text-anchor="middle">2</text><text x="211" y="166" class="small" text-anchor="middle">Egor取</text><rect x="280" y="105" width="52" height="38" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="306.0" y="131.0" class="" text-anchor="middle">4</text><text x="306" y="166" class="small" text-anchor="middle">未取</text><rect x="375" y="105" width="52" height="38" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="401.0" y="131.0" class="" text-anchor="middle">4</text><text x="401" y="166" class="small" text-anchor="middle">未取</text><rect x="470" y="105" width="52" height="38" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="496.0" y="131.0" class="" text-anchor="middle">4</text><text x="496" y="166" class="small" text-anchor="middle">未取</text><text x="24" y="220" class="" text-anchor="start">同一条数值轴：从1能跳到2，不能跳到4</text><line x1="90" y1="285" x2="555" y2="285" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><line x1="130" y1="279" x2="130" y2="291" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="130" y="318" class="" text-anchor="middle">1</text><line x1="250" y1="279" x2="250" y2="291" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="250" y="318" class="" text-anchor="middle">2</text><line x1="370" y1="279" x2="370" y2="291" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="370" y="318" class="" text-anchor="middle">3</text><line x1="490" y1="279" x2="490" y2="291" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="490" y="318" class="" text-anchor="middle">4</text><rect x="120" y="250" width="145" height="23" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="190" y="242" class="small" text-anchor="middle">允许 [1,2]</text><line x1="250" y1="350" x2="490" y2="350" stroke="#bb575e" stroke-width="3" stroke-dasharray="6,5"/><text x="365" y="382" class="small" text-anchor="middle">2 → 4 差2，大于k</text><text x="24" y="426" class="" text-anchor="start">拿1以后：P(1)=真；Egor取2交出败态</text><text x="24" y="470" class="" text-anchor="start">拿2以后：P(2)=假；区间[2,3]没有牌</text><text x="24" y="514" class="" text-anchor="start">拿4以后：余两张4，Egor / Dabir各取一张</text><text x="24" y="555" class="" text-anchor="start">P(4)=假；从1数可达败态：2 − 1 = 1</text></svg>