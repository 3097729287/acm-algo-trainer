<svg xmlns="http://www.w3.org/2000/svg" width="640" height="829" viewBox="0 0 640 829" role="img"><title>实际十位数字的权值、两个被排除前缀和可行最大串</title><rect width="640" height="829" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="35" class="title" text-anchor="start">十个实际数位：两个二、八个三</text><text x="24" y="76" class="small" text-anchor="start">下标从左到右；权值指数从九降到零</text><text x="48" y="111" class="small" text-anchor="middle">1</text><rect x="24" y="126" width="49" height="46" rx="5" fill="#bceacb" stroke="#7394aa"/><text x="48.5" y="156.0" class="" text-anchor="middle">2</text><text x="48" y="200" class="small" text-anchor="middle">10^9</text><text x="107" y="111" class="small" text-anchor="middle">2</text><rect x="83" y="126" width="49" height="46" rx="5" fill="#bceacb" stroke="#7394aa"/><text x="107.5" y="156.0" class="" text-anchor="middle">2</text><text x="107" y="200" class="small" text-anchor="middle">10^8</text><text x="166" y="111" class="small" text-anchor="middle">3</text><rect x="142" y="126" width="49" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="166.5" y="156.0" class="" text-anchor="middle">3</text><text x="166" y="200" class="small" text-anchor="middle">10^7</text><text x="225" y="111" class="small" text-anchor="middle">4</text><rect x="201" y="126" width="49" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="225.5" y="156.0" class="" text-anchor="middle">3</text><text x="225" y="200" class="small" text-anchor="middle">10^6</text><text x="284" y="111" class="small" text-anchor="middle">5</text><rect x="260" y="126" width="49" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="284.5" y="156.0" class="" text-anchor="middle">3</text><text x="284" y="200" class="small" text-anchor="middle">10^5</text><text x="343" y="111" class="small" text-anchor="middle">6</text><rect x="319" y="126" width="49" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="343.5" y="156.0" class="" text-anchor="middle">3</text><text x="343" y="200" class="small" text-anchor="middle">10^4</text><text x="402" y="111" class="small" text-anchor="middle">7</text><rect x="378" y="126" width="49" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="402.5" y="156.0" class="" text-anchor="middle">3</text><text x="402" y="200" class="small" text-anchor="middle">10^3</text><text x="461" y="111" class="small" text-anchor="middle">8</text><rect x="437" y="126" width="49" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="461.5" y="156.0" class="" text-anchor="middle">3</text><text x="461" y="200" class="small" text-anchor="middle">10^2</text><text x="520" y="111" class="small" text-anchor="middle">9</text><rect x="496" y="126" width="49" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="520.5" y="156.0" class="" text-anchor="middle">3</text><text x="520" y="200" class="small" text-anchor="middle">10^1</text><text x="579" y="111" class="small" text-anchor="middle">10</text><rect x="555" y="126" width="49" height="46" rx="5" fill="#d2e6fa" stroke="#7394aa"/><text x="579.5" y="156.0" class="" text-anchor="middle">3</text><text x="579" y="200" class="small" text-anchor="middle">10^0</text><text x="24" y="251" class="" text-anchor="start">全三串余1842；前两位改二，减755+1087</text><text x="24" y="290" class="" text-anchor="start">1842−755−1087=0，所以2233333333可行</text><line x1="24" y1="316" x2="616" y2="316" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="24" y="352" class="" text-anchor="start">先试首位三：剩九个真实位置放两个二</text><rect x="24" y="372" width="90" height="46" rx="5" fill="#ffd0cc" stroke="#7394aa"/><text x="69.0" y="402.0" class="" text-anchor="middle">3</text><text x="135" y="401" class="small" text-anchor="start">→ 拒绝这一个前缀</text><text x="24" y="454" class="small" text-anchor="start">所需权值和1842，不在36个不同位置对中</text><text x="24" y="489" class="" text-anchor="start">再试前缀23：剩八个位置放一个二</text><rect x="24" y="509" width="90" height="46" rx="5" fill="#ffd0cc" stroke="#7394aa"/><text x="69.0" y="539.0" class="" text-anchor="middle">23</text><text x="135" y="538" class="small" text-anchor="start">→ 拒绝这一个前缀</text><text x="24" y="591" class="small" text-anchor="start">所需权值1087，不在这八个位置中</text><text x="24" y="662" class="small" text-anchor="start">九位权值（从右向左）：</text><text x="24" y="700" class="small" text-anchor="start">1 /10 /100 /1000 /1908 /873 /638 /311 /1087</text><rect x="24" y="727" width="592" height="72" rx="5" fill="#bceacb" stroke="#7394aa"/><text x="42" y="757" class="small" text-anchor="start">只剩八位时，最后的1087也不再可用</text><text x="42" y="785" class="small" text-anchor="start">先确认存在补全，再逐位取最大的可行字符</text></svg>