<svg xmlns="http://www.w3.org/2000/svg" width="620" height="525" viewBox="0 0 620 525" role="img"><title>三乘三平方展开格子中的平方项与两个方向的交叉项，以及按选择集合计入的次数</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="38" font-size="23" fill="#20334a" text-anchor="start">S² 中一对不同下标，占两个对称格子</text><text x="26" y="79" font-size="20" fill="#20334a" text-anchor="start">A = [1,2,3]，行与列各选择一个下标</text><text x="175" y="120" font-size="20" fill="#20334a" text-anchor="middle">A1=1</text><text x="323" y="120" font-size="20" fill="#20334a" text-anchor="middle">A2=2</text><text x="471" y="120" font-size="20" fill="#20334a" text-anchor="middle">A3=3</text><text x="50" y="183" font-size="21" fill="#20334a" text-anchor="middle">A1</text><rect x="102" y="144" width="142" height="66" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="173" y="185" font-size="23" fill="#20334a" text-anchor="middle">1×1=1</text><rect x="250" y="144" width="142" height="66" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="321" y="185" font-size="23" fill="#20334a" text-anchor="middle">1×2=2</text><rect x="398" y="144" width="142" height="66" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="469" y="185" font-size="23" fill="#20334a" text-anchor="middle">1×3=3</text><text x="50" y="255" font-size="21" fill="#20334a" text-anchor="middle">A2</text><rect x="102" y="216" width="142" height="66" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="173" y="257" font-size="23" fill="#20334a" text-anchor="middle">2×1=2</text><rect x="250" y="216" width="142" height="66" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="321" y="257" font-size="23" fill="#20334a" text-anchor="middle">2×2=4</text><rect x="398" y="216" width="142" height="66" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="469" y="257" font-size="23" fill="#20334a" text-anchor="middle">2×3=6</text><text x="50" y="327" font-size="21" fill="#20334a" text-anchor="middle">A3</text><rect x="102" y="288" width="142" height="66" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="173" y="329" font-size="23" fill="#20334a" text-anchor="middle">3×1=3</text><rect x="250" y="288" width="142" height="66" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="321" y="329" font-size="23" fill="#20334a" text-anchor="middle">3×2=6</text><rect x="398" y="288" width="142" height="66" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="469" y="329" font-size="23" fill="#20334a" text-anchor="middle">3×3=9</text><text x="26" y="407" font-size="22" fill="#2d6db4" text-anchor="start">蓝色对角：Q = 1+4+9 = 14</text><text x="26" y="449" font-size="22" fill="#087b48" text-anchor="start">绿色非对角：S²−Q = 36−14 = 22</text><text x="26" y="494" font-size="21" fill="#20334a" text-anchor="start">K=2 时按出现次数计入：2×14 + 1×22 = 50</text></g></svg>