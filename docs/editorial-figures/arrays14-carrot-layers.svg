<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>两轮统一切割的目标段与后缀层计数</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="38" font-size="28" fill="#20334a" text-anchor="start">两轮共用刀口：先切 2，再切 1</text><text x="40" y="76" font-size="21" fill="#20334a" text-anchor="start">目标 L = 1；每个格子是一根真实单位段，以「原材料下标，第几段」定位</text><text x="370" y="117" font-size="22" fill="#20334a" text-anchor="middle">第 1 段</text><text x="505" y="117" font-size="22" fill="#20334a" text-anchor="middle">第 2 段</text><text x="640" y="117" font-size="22" fill="#20334a" text-anchor="middle">第 3 段</text><text x="775" y="117" font-size="22" fill="#20334a" text-anchor="middle">第 4 段</text><text x="45" y="174" font-size="22" fill="#20334a" text-anchor="start">原材料 1：长 1</text><rect x="315" y="145" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="370" y="174" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="505" y="174" font-size="22" fill="#9aa6b3" text-anchor="middle">—</text><text x="640" y="174" font-size="22" fill="#9aa6b3" text-anchor="middle">—</text><text x="775" y="174" font-size="22" fill="#9aa6b3" text-anchor="middle">—</text><text x="45" y="234" font-size="22" fill="#20334a" text-anchor="start">原材料 2：长 2</text><rect x="315" y="205" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="370" y="234" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="450" y="205" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="505" y="234" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="640" y="234" font-size="22" fill="#9aa6b3" text-anchor="middle">—</text><text x="775" y="234" font-size="22" fill="#9aa6b3" text-anchor="middle">—</text><text x="45" y="294" font-size="22" fill="#20334a" text-anchor="start">原材料 3：长 3</text><rect x="315" y="265" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="370" y="294" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="450" y="265" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="505" y="294" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="585" y="265" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="640" y="294" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="775" y="294" font-size="22" fill="#9aa6b3" text-anchor="middle">—</text><text x="45" y="354" font-size="22" fill="#20334a" text-anchor="start">原材料 4：长 4</text><rect x="315" y="325" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="370" y="354" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="450" y="325" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="505" y="354" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="585" y="325" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="640" y="354" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="720" y="325" width="110" height="43" rx="5" fill="#fff0ce" stroke="#6d86a6" stroke-width="2"/><text x="775" y="354" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="45" y="414" font-size="22" fill="#20334a" text-anchor="start">原材料 5：长 4</text><rect x="315" y="385" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="370" y="414" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="450" y="385" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="505" y="414" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="585" y="385" width="110" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="640" y="414" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="720" y="385" width="110" height="43" rx="5" fill="#fff0ce" stroke="#6d86a6" stroke-width="2"/><text x="775" y="414" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="45" y="496" font-size="23" fill="#20334a" text-anchor="start">逐层计数</text><text x="370" y="496" font-size="22" fill="#20334a" text-anchor="middle">suf[1] = 5</text><text x="505" y="496" font-size="22" fill="#20334a" text-anchor="middle">suf[2] = 4</text><text x="640" y="496" font-size="22" fill="#20334a" text-anchor="middle">suf[3] = 3</text><text x="775" y="496" font-size="22" fill="#996300" text-anchor="middle">cnt[4] = 2</text><text x="45" y="541" font-size="22" fill="#20334a" text-anchor="start">12 个绿色段 + 2 个橙色段 = 14；橙格只来自原长恰为 4 的材料。</text><text x="45" y="585" font-size="22" fill="#20334a" text-anchor="start">同一轮方案：3 → 2+1 → 1+1+1；4 → 2+2 → 1+1+1+1。</text></g></svg>