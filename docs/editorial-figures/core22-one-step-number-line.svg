<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" role="img"><title>同一整数数轴0到12，7减3到4和加3到10为两个候选终点；7和11不在可达终点内，两条箭头为互斥选择</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="36" font-size="23" fill="#20334a" text-anchor="start">x=7、d=3：恰好选一支箭头</text><path d="M40 190 H690" stroke="#475569" stroke-width="3"/><path d="M40 184 V196" stroke="#475569"/><text x="40" y="226" font-size="18" fill="#20334a" text-anchor="middle">0</text><path d="M92 184 V196" stroke="#475569"/><text x="92" y="226" font-size="18" fill="#20334a" text-anchor="middle">1</text><path d="M144 184 V196" stroke="#475569"/><text x="144" y="226" font-size="18" fill="#20334a" text-anchor="middle">2</text><path d="M196 184 V196" stroke="#475569"/><text x="196" y="226" font-size="18" fill="#20334a" text-anchor="middle">3</text><path d="M248 184 V196" stroke="#475569"/><text x="248" y="226" font-size="18" fill="#20334a" text-anchor="middle">4</text><path d="M300 184 V196" stroke="#475569"/><text x="300" y="226" font-size="18" fill="#20334a" text-anchor="middle">5</text><path d="M352 184 V196" stroke="#475569"/><text x="352" y="226" font-size="18" fill="#20334a" text-anchor="middle">6</text><path d="M404 184 V196" stroke="#475569"/><text x="404" y="226" font-size="18" fill="#20334a" text-anchor="middle">7</text><path d="M456 184 V196" stroke="#475569"/><text x="456" y="226" font-size="18" fill="#20334a" text-anchor="middle">8</text><path d="M508 184 V196" stroke="#475569"/><text x="508" y="226" font-size="18" fill="#20334a" text-anchor="middle">9</text><path d="M560 184 V196" stroke="#475569"/><text x="560" y="226" font-size="18" fill="#20334a" text-anchor="middle">10</text><path d="M612 184 V196" stroke="#475569"/><text x="612" y="226" font-size="18" fill="#20334a" text-anchor="middle">11</text><path d="M664 184 V196" stroke="#475569"/><text x="664" y="226" font-size="18" fill="#20334a" text-anchor="middle">12</text><circle cx="248" cy="190" r="6" fill="#0f766e"/><circle cx="404" cy="190" r="6" fill="#2563eb"/><circle cx="560" cy="190" r="6" fill="#0f766e"/><circle cx="612" cy="190" r="6" fill="#b91c1c"/><path d="M404 165 Q326 65 248 165 l13 -9 m-13 9 l0 -16" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M404 165 Q482 65 560 165 l-13 -9 m13 9 l0 -16" fill="none" stroke="#0f766e" stroke-width="3"/><text x="326" y="104" font-size="23" fill="#20334a" text-anchor="middle">−3</text><text x="482" y="104" font-size="23" fill="#20334a" text-anchor="middle">+3</text><text x="90" y="275" font-size="21" fill="#20334a" text-anchor="start">绿色终点只有4与10；两者到7的距离都为3。</text><text x="90" y="320" font-size="21" fill="#20334a" text-anchor="start">7处距离0，11处距离4，都不等于一步长度3。</text><text x="90" y="365" font-size="21" fill="#20334a" text-anchor="start">判断的对象是目标y，条件是 |7−y|=3。</text></g></svg>