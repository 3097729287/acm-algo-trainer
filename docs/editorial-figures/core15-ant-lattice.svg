<svg xmlns="http://www.w3.org/2000/svg" width="660" height="575" viewBox="0 0 660 575" role="img"><title>真实坐标网格中的零零到六四重合反向两段只含三个整点，第三竖线过三二不重复加，两个位图对应首次再次及已计访问</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="33" font-size="21" fill="#20334a" text-anchor="start">A/B整段重合；C为x=3竖线，中心按点去重</text><circle cx="64" cy="332" r="2" fill="#cbd5e1"/><circle cx="64" cy="287" r="2" fill="#cbd5e1"/><circle cx="64" cy="242" r="2" fill="#cbd5e1"/><circle cx="64" cy="197" r="2" fill="#cbd5e1"/><circle cx="64" cy="152" r="2" fill="#cbd5e1"/><circle cx="109" cy="332" r="2" fill="#cbd5e1"/><circle cx="109" cy="287" r="2" fill="#cbd5e1"/><circle cx="109" cy="242" r="2" fill="#cbd5e1"/><circle cx="109" cy="197" r="2" fill="#cbd5e1"/><circle cx="109" cy="152" r="2" fill="#cbd5e1"/><circle cx="154" cy="332" r="2" fill="#cbd5e1"/><circle cx="154" cy="287" r="2" fill="#cbd5e1"/><circle cx="154" cy="242" r="2" fill="#cbd5e1"/><circle cx="154" cy="197" r="2" fill="#cbd5e1"/><circle cx="154" cy="152" r="2" fill="#cbd5e1"/><circle cx="199" cy="332" r="2" fill="#cbd5e1"/><circle cx="199" cy="287" r="2" fill="#cbd5e1"/><circle cx="199" cy="242" r="2" fill="#cbd5e1"/><circle cx="199" cy="197" r="2" fill="#cbd5e1"/><circle cx="199" cy="152" r="2" fill="#cbd5e1"/><circle cx="244" cy="332" r="2" fill="#cbd5e1"/><circle cx="244" cy="287" r="2" fill="#cbd5e1"/><circle cx="244" cy="242" r="2" fill="#cbd5e1"/><circle cx="244" cy="197" r="2" fill="#cbd5e1"/><circle cx="244" cy="152" r="2" fill="#cbd5e1"/><circle cx="289" cy="332" r="2" fill="#cbd5e1"/><circle cx="289" cy="287" r="2" fill="#cbd5e1"/><circle cx="289" cy="242" r="2" fill="#cbd5e1"/><circle cx="289" cy="197" r="2" fill="#cbd5e1"/><circle cx="289" cy="152" r="2" fill="#cbd5e1"/><circle cx="334" cy="332" r="2" fill="#cbd5e1"/><circle cx="334" cy="287" r="2" fill="#cbd5e1"/><circle cx="334" cy="242" r="2" fill="#cbd5e1"/><circle cx="334" cy="197" r="2" fill="#cbd5e1"/><circle cx="334" cy="152" r="2" fill="#cbd5e1"/><line x1="64" y1="332" x2="334" y2="152" stroke="#2563eb" stroke-width="6"/><line x1="64" y1="332" x2="334" y2="152" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/><line x1="199" y1="332" x2="199" y2="152" stroke="#64748b" stroke-width="3"/><circle cx="64" cy="332" r="8" fill="#ffcf80" stroke="#b45309"/><text x="74" y="319" font-size="18" fill="#20334a" text-anchor="start">(0,0)</text><circle cx="199" cy="242" r="8" fill="#ffcf80" stroke="#b45309"/><text x="209" y="229" font-size="18" fill="#20334a" text-anchor="start">(3,2)</text><circle cx="334" cy="152" r="8" fill="#ffcf80" stroke="#b45309"/><text x="344" y="139" font-size="18" fill="#20334a" text-anchor="start">(6,4)</text><text x="380" y="168" font-size="20" fill="#20334a" text-anchor="start">最小整方向(3,2)</text><text x="380" y="214" font-size="19" fill="#20334a" text-anchor="start">A首次：只标seen</text><text x="380" y="260" font-size="19" fill="#20334a" text-anchor="start">B二次：计3个中心</text><text x="380" y="306" font-size="18" fill="#20334a" text-anchor="start">C三次：(3,2)不再加</text><text x="24" y="400" font-size="21" fill="#20334a" text-anchor="start">A只含这三个整点；B反向仍是同一批实际点。</text><text x="24" y="447" font-size="21" fill="#20334a" text-anchor="start">C的其它整点只出现一次，不是会议中心。</text><text x="24" y="494" font-size="20" fill="#20334a" text-anchor="start">三条线段的交点身份可以重复，中心身份不能重复。</text><text x="24" y="540" font-size="21" fill="#20334a" text-anchor="start">seen问“到过吗”，counted问“已计入了吗”。</text></g></svg>