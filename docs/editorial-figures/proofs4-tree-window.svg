<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img"><title>真实合法五点树与进出欧拉序，合法输入三到四在交换DFS端点后用退出四到进入三的窗口，旁支五抵消而公共祖先一需补回，另示祖先询问一到五</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="35" font-size="23" fill="#20334a" text-anchor="start">输入询问(3,4)，符合3&lt;4；点旁小字是其值</text><line x1="340" y1="96" x2="214" y2="192" stroke="#087b48" stroke-width="4"/><line x1="340" y1="96" x2="521" y2="192" stroke="#087b48" stroke-width="4"/><line x1="214" y1="192" x2="130" y2="286" stroke="#087b48" stroke-width="4"/><line x1="214" y1="192" x2="306" y2="286" stroke="#94a3b8" stroke-width="4"/><circle cx="340" cy="96" r="24" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="340" y="104" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="372" y="84" font-size="19" fill="#20334a" text-anchor="start">值1</text><circle cx="214" cy="192" r="24" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="214" y="200" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="246" y="180" font-size="19" fill="#20334a" text-anchor="start">值2</text><circle cx="521" cy="192" r="24" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="521" y="200" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="553" y="180" font-size="19" fill="#20334a" text-anchor="start">值1</text><circle cx="130" cy="286" r="24" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="130" y="294" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="162" y="274" font-size="19" fill="#20334a" text-anchor="start">值3</text><circle cx="306" cy="286" r="24" fill="#f1f5f9" stroke="#20334a" stroke-width="2"/><text x="306" y="294" font-size="24" fill="#20334a" text-anchor="middle">5</text><text x="338" y="274" font-size="19" fill="#20334a" text-anchor="start">值2</text><text x="22" y="350" font-size="22" fill="#20334a" text-anchor="start">进入顺序先4后3；代码交换端点，LCA为1</text><text x="22" y="389" font-size="20" fill="#20334a" text-anchor="start">欧拉下标：</text><text x="52" y="426" font-size="19" fill="#20334a" text-anchor="middle">0</text><rect x="24" y="440" width="56" height="57" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="52" y="478" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="120" y="426" font-size="19" fill="#20334a" text-anchor="middle">1</text><rect x="92" y="440" width="56" height="57" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="120" y="478" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="188" y="426" font-size="19" fill="#20334a" text-anchor="middle">2</text><rect x="160" y="440" width="56" height="57" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="188" y="478" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="256" y="426" font-size="19" fill="#20334a" text-anchor="middle">3</text><rect x="228" y="440" width="56" height="57" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="256" y="478" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="324" y="426" font-size="19" fill="#20334a" text-anchor="middle">4</text><rect x="296" y="440" width="56" height="57" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="324" y="478" font-size="25" fill="#20334a" text-anchor="middle">5</text><text x="392" y="426" font-size="19" fill="#20334a" text-anchor="middle">5</text><rect x="364" y="440" width="56" height="57" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="392" y="478" font-size="25" fill="#20334a" text-anchor="middle">5</text><text x="460" y="426" font-size="19" fill="#20334a" text-anchor="middle">6</text><rect x="432" y="440" width="56" height="57" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="460" y="478" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="528" y="426" font-size