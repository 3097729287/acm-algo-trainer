<svg xmlns="http://www.w3.org/2000/svg" width="760" height="909" viewBox="0 0 760 909" role="img"><title>五个实际建站点及要求区间，选站二五费用一百零二，计算第四站从三项合法状态读二再加一，虚拟第六站只可继承第五状态</title><rect width="760" height="909" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="38" font-size="23" fill="#17334d" text-anchor="start">成本[3,2,4,1,100]；真实站选2和5，共102</text><rect x="83" y="99" width="82" height="66" rx="7" fill="#f1f5f9" stroke="#476986" stroke-width="2"/><text x="124" y="142" font-size="26" fill="#17334d" text-anchor="middle">3</text><text x="124" y="193" font-size="19" fill="#17334d" text-anchor="middle">位置1</text><rect x="211" y="99" width="82" height="66" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="252" y="142" font-size="26" fill="#17334d" text-anchor="middle">2</text><text x="252" y="193" font-size="19" fill="#17334d" text-anchor="middle">位置2</text><rect x="339" y="99" width="82" height="66" rx="7" fill="#f1f5f9" stroke="#476986" stroke-width="2"/><text x="380" y="142" font-size="26" fill="#17334d" text-anchor="middle">4</text><text x="380" y="193" font-size="19" fill="#17334d" text-anchor="middle">位置3</text><rect x="467" y="99" width="82" height="66" rx="7" fill="#f1f5f9" stroke="#476986" stroke-width="2"/><text x="508" y="142" font-size="26" fill="#17334d" text-anchor="middle">1</text><text x="508" y="193" font-size="19" fill="#17334d" text-anchor="middle">位置4</text><rect x="595" y="99" width="82" height="66" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="636" y="142" font-size="26" fill="#17334d" text-anchor="middle">100</text><text x="636" y="193" font-size="19" fill="#17334d" text-anchor="middle">位置5</text><text x="24" y="238" font-size="21" fill="#17334d" text-anchor="start">[1,3]</text><line x1="114" y1="231" x2="390" y2="231" stroke="#237bb6" stroke-width="5"/><circle cx="114" cy="231" r="7" fill="#2a7ea8"/><circle cx="390" cy="231" r="7" fill="#2a7ea8"/><text x="24" y="300" font-size="21" fill="#17334d" text-anchor="start">[2,4]</text><line x1="242" y1="293" x2="518" y2="293" stroke="#237bb6" stroke-width="5"/><circle cx="242" cy="293" r="7" fill="#2a7ea8"/><circle cx="518" cy="293" r="7" fill="#2a7ea8"/><text x="24" y="362" font-size="21" fill="#17334d" text-anchor="start">[5,5]</text><line x1="626" y1="355" x2="646" y2="355" stroke="#237bb6" stroke-width="5"/><circle cx="626" cy="355" r="7" fill="#2a7ea8"/><circle cx="646" cy="355" r="7" fill="#2a7ea8"/><text x="24" y="422" font-size="23" fill="#17334d" text-anchor="start">算i=4：只先检查右端小于4的[1,3]</text><text x="24" y="474" font-size="22" fill="#17334d" text-anchor="start">lower=1；前站0不可用，前站1、2、3可用。</text><rect x="72" y="512" width="104" height="67" rx="7" fill="#fff" stroke="#476986" stroke-width="2"/><text x="124" y="555" font-size="20" fill="#17334d" text-anchor="middle">dp[1]=3</text><rect x="252" y="512" width="104" height="67" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="304" y="555" font-size="20" fill="#17334d" text-anchor="middle">dp[2]=2</text><rect x="432" y="512" width="104" height="67" rx="7" fill="#fff" stroke="#476986" stroke-width="2"/><text x="484" y="555" font-size="20" fill="#17334d" text-anchor="middle">dp[3]=4</text><text x="24" y="635" font-size="22" fill="#17334d" text-anchor="start">读dp[2]=2，加新站4费用1，写dp[4]=3。</text><text x="24" y="689" font-size="22" fill="#17334d" text-anchor="start">[2,4]尚不用约束前站，因为新站4本身能覆盖。</text><text x="24" y="751" font-size="21" fill="#17334d" text-anchor="start">算虚拟i=6：lower=5；队列[2,4,5]删去2、4。</text><text x="24" y="809" font-size="22" fill="#17334d" text-anchor="start">只剩dp[5]=102，再加0 → 最终答案102。</text><text x="24" y="867" font-size="21" fill="#17334d" text-anchor="start">删队列候选不等于拆站；它是在删不再有用的状态。</text></g></svg>