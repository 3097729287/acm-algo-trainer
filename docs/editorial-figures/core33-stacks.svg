<svg xmlns="http://www.w3.org/2000/svg" width="720" height="762" viewBox="0 0 720 762" role="img"><title>实际输入14253分到四栈，位置数组02413在数值12345上的比较给三强制断点，34同栈底4顶3，全部压完后四栈各清空输出12345</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="24" fill="#20334a" text-anchor="start">输入位置与数值段不同：所有压完才弹</text><text x="22" y="78" font-size="23" fill="#20334a" text-anchor="start">输入顺序：1 → 4 → 2 → 5 → 3</text><rect x="24" y="118" width="122" height="102" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="85" y="152" font-size="23" fill="#20334a" text-anchor="middle">值1</text><text x="85" y="194" font-size="21" fill="#20334a" text-anchor="middle">位置0</text><rect x="159" y="118" width="122" height="102" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="220" y="152" font-size="23" fill="#20334a" text-anchor="middle">值2</text><text x="220" y="194" font-size="21" fill="#20334a" text-anchor="middle">位置2</text><rect x="294" y="118" width="122" height="102" rx="8" fill="#fef08a" stroke="#2d6db4" stroke-width="2"/><text x="355" y="152" font-size="23" fill="#20334a" text-anchor="middle">值3</text><text x="355" y="194" font-size="21" fill="#20334a" text-anchor="middle">位置4</text><rect x="429" y="118" width="122" height="102" rx="8" fill="#fef08a" stroke="#2d6db4" stroke-width="2"/><text x="490" y="152" font-size="23" fill="#20334a" text-anchor="middle">值4</text><text x="490" y="194" font-size="21" fill="#20334a" text-anchor="middle">位置1</text><rect x="564" y="118" width="122" height="102" rx="8" fill="#e9d5ff" stroke="#2d6db4" stroke-width="2"/><text x="625" y="152" font-size="23" fill="#20334a" text-anchor="middle">值5</text><text x="625" y="194" font-size="21" fill="#20334a" text-anchor="middle">位置3</text><text x="22" y="270" font-size="23" fill="#20334a" text-anchor="start">强制断点：1 | 2 | 3,4 | 5 → 共4栈</text><path d="M50 345 V505 H162 V345" fill="none" stroke="#475569" stroke-width="4"/><rect x="58" y="447" width="96" height="54" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="106" y="482" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="106" y="540" font-size="21" fill="#20334a" text-anchor="middle">先弹1</text><path d="M220 345 V505 H332 V345" fill="none" stroke="#475569" stroke-width="4"/><rect x="228" y="447" width="96" height="54" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="276" y="482" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="276" y="540" font-size="21" fill="#20334a" text-anchor="middle">再弹2</text><path d="M390 345 V505 H502 V345" fill="none" stroke="#475569" stroke-width="4"/><rect x="398" y="447" width="96" height="54" rx="8" fill="#fef08a" stroke="#2d6db4" stroke-width="2"/><text x="446" y="482" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="398" y="385" width="96" height="54" rx="8" fill="#fef08a" stroke="#2d6db4" stroke-width="2"/><text x="446" y="420" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="446" y="540" font-size="21" fill="#20334a" text-anchor="middle">先3后4</text><path d="M560 345 V505 H672 V345" fill="none" stroke="#475569" stroke-width="4"/><rect x="568" y="447" width="96" height="54" rx="8" fill="#e9d5ff" stroke="#2d6db4" stroke-width="2"/><text x="616" y="482" font-size="25" fill="#20334a" text-anchor="middle">5</text><text x="616" y="540" font-size="21" fill="#20334a" text-anchor="middle">最后5</text><text x="22" y="603" font-size="22" fill="#20334a" text-anchor="start">三四栈：先压4在底，再压3在顶。</text><text x="22" y="657" font-size="22" fill="#20334a" text-anchor="start">出栈连成1/2/3/4/5；每栈一次清空。</text><text x="22" y="711" font-size="23" fill="#20334a" text-anchor="start">ans：1 → 2 → 3 → 3 → 4</text></g></svg>