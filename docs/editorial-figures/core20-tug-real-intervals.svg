<svg xmlns="http://www.w3.org/2000/svg" width="720" height="705" viewBox="0 0 720 705" role="img"><title>实际原五位置十九九十二十四切在三之后，两队和二十七二十六；全部六个左区间8 9 10 17 19 27有真实端点，后继27差1前驱19差7</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">原位置切在3之后：左队[1,3]，右队[4,5]</text><text x="93" y="86" font-size="20" fill="#20334a" text-anchor="middle">原1</text><rect x="45" y="107" width="96" height="60" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="93" y="146" font-size="25" fill="#20334a" text-anchor="middle">10</text><text x="222" y="86" font-size="20" fill="#20334a" text-anchor="middle">原2</text><rect x="174" y="107" width="96" height="60" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="222" y="146" font-size="25" fill="#20334a" text-anchor="middle">9</text><text x="351" y="86" font-size="20" fill="#20334a" text-anchor="middle">原3</text><rect x="303" y="107" width="96" height="60" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="351" y="146" font-size="25" fill="#20334a" text-anchor="middle">8</text><text x="480" y="86" font-size="20" fill="#20334a" text-anchor="middle">原4</text><rect x="432" y="107" width="96" height="60" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="480" y="146" font-size="25" fill="#20334a" text-anchor="middle">12</text><text x="609" y="86" font-size="20" fill="#20334a" text-anchor="middle">原5</text><rect x="561" y="107" width="96" height="60" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="609" y="146" font-size="25" fill="#20334a" text-anchor="middle">14</text><path d="M421 84 L421 204" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><path d="M45 195 L399 195" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M432 195 L657 195" fill="none" stroke="#0f766e" stroke-width="3"/><text x="201" y="232" font-size="22" fill="#20334a" text-anchor="middle">10+9+8=27</text><text x="545" y="232" font-size="22" fill="#20334a" text-anchor="middle">12+14=26</text><text x="22" y="293" font-size="21" fill="#20334a" text-anchor="start">左侧全部6个真实区间，按和排序：</text><rect x="30" y="327" width="95" height="54" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="77" y="364" font-size="24" fill="#20334a" text-anchor="middle">8</text><text x="77" y="408" font-size="18" fill="#20334a" text-anchor="middle">[3,3]</text><rect x="144" y="327" width="95" height="54" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="191" y="364" font-size="24" fill="#20334a" text-anchor="middle">9</text><text x="191" y="408" font-size="18" fill="#20334a" text-anchor="middle">[2,2]</text><rect x="258" y="327" width="95" height="54" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="305" y="364" font-size="24" fill="#20334a" text-anchor="middle">10</text><text x="305" y="408" font-size="18" fill="#20334a" text-anchor="middle">[1,1]</text><rect x="372" y="327" width="95" height="54" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="419" y="364" font-size="24" fill="#20334a" text-anchor="middle">17</text><text x="419" y="408" font-size="18" fill="#20334a" text-anchor="middle">[2,3]</text><rect x="486" y="327" width="95" height="54" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="533" y="364" font-size="24" fill="#20334a" text-anchor="middle">19</text><text x="533" y="408" font-size="18" fill="#20334a" text-anchor="middle">[1,2]</text><rect x="600" y="327" width="95" height="54" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="647" y="364" font-size="24" fill="#20334a" text-anchor="middle">27</text><text x="647" y="408" font-size="18" fill="#20334a" text-anchor="middle">[1,3]</text><text x="22" y="470" font-size="21" fill="#20334a" text-anchor="start">查询右和26：lower_bound→27，差27−26=1。</text><text x="22" y="518" font-size="21" fill="#20334a" text-anchor="start">前驱19：差26−19=7；更远的数不会更好。</text><text x="22" y="568" font-size="20" fill="#20334a" text-anchor="start">左和已有合法原区间作见证，查询不会配到重叠队。</text><text x="22" y="616" font-size="20" fill="#20334a" text-anchor="start">每个切点只新增“刚在这里结束”的左区间。</text><text x="22" y="664" font-size="20" fill="#20334a" text-anchor="start">代码start=3是前缀长度，右队从start+1=4开始。</text></g></svg>