<svg xmlns="http://www.w3.org/2000/svg" width="720" height="803" viewBox="0 0 720 803" role="img"><title>abaaaaa的外层一对与核心baaaa，反转aaaab并用井号拼接后下标七起四个a匹配，真实保留串aaaa只能用二对；Z盒七十一内下标八由Z一等于三和右余三得三，保留aaa只许一对，最优外一加内二得三</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">S=abaaaaa：保留外层1对，核心T=baaaa</text><text x="22" y="82" font-size="22" fill="#20334a" text-anchor="start">R=aaaab；Z串U=R#T=aaaab#baaaa</text><rect x="29" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="57.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="90" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="118.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="151" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="179.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="212" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="240.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="273" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="301.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">b</text><rect x="334" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="362.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">#</text><rect x="395" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="423.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">b</text><rect x="456" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="484.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="517" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="545.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="578" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="606.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="639" y="124" width="56" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="667.0" y="154" font-size="23" fill="#20334a" text-anchor="middle">a</text><text x="56" y="196" font-size="18" fill="#20334a" text-anchor="middle">0</text><text x="117" y="196" font-size="18" fill="#20334a" text-anchor="middle">1</text><text x="178" y="196" font-size="18" fill="#20334a" text-anchor="middle">2</text><text x="239" y="196" font-size="18" fill="#20334a" text-anchor="middle">3</text><text x="300" y="196" font-size="18" fill="#20334a" text-anchor="middle">4</text><text x="361" y="196" font-size="18" fill="#20334a" text-anchor="middle">5</text><text x="422" y="196" font-size="18" fill="#20334a" text-anchor="middle">6</text><text x="483" y="196" font-size="18" fill="#20334a" text-anchor="middle">7</text><text x="544" y="196" font-size="18" fill="#20334a" text-anchor="middle">8</text><text x="605" y="196" font-size="18" fill="#20334a" text-anchor="middle">9</text><text x="666" y="196" font-size="18" fill="#20334a" text-anchor="middle">10</text><path d="M456 224 L695 224" stroke="#16a34a" stroke-width="6" fill="none"/><text x="22" y="270" font-size="21" fill="#20334a" text-anchor="start">起点7与串首连续相同4个a：Z[7]=4</text><rect x="22" y="308" width="676" height="108" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="39" y="341" font-size="21" fill="#20334a" text-anchor="start">删T的第0个b，留下aaaa，长度为4</text><text x="39" y="386" font-size="21" fill="#20334a" text-anchor="start">可配min(4, floor(4/2))=2对，而不是4对</text><text x="22" y="468" font-size="21" fill="#20334a" text-anchor="start">Z盒[7,11)已知匹配；再处理i=8时：</text><text x="22" y="515" font-size="21" fill="#20334a" text-anchor="start">Z[i−7]=Z[1]=3，盒内剩余11−8=3</text><text x="22" y="562" font-size="21" fill="#20334a" text-anchor="start">初值min(3,3)=3，已到串尾，不再扩展</text><text x="22" y="609" font-size="21" fill="#20334a" text-anchor="start">这对应保留aaa，Z为3，但最多只能配1对</text><text x="22" y="669" font-size="21" fill="#20334a" text-anchor="start">最优保留核心aaaa，接回两端a后为aaaaaa</text><text x="22" y="716" font-size="22" fill="#20334a" text-anchor="start">总答案=外层1+核心2=3，前后各取aaa</text><text x="22" y="773" font-size="20" fill="#20334a" text-anchor="start">#不是小写字母，匹配不会穿过R与T的分隔</text></g></svg>