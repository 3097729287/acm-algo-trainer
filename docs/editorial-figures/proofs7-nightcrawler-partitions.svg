<svg xmlns="http://www.w3.org/2000/svg" width="720" height="801" viewBox="0 0 720 801" role="img"><title>实际六点树的堆合并和每个备用值的节点身份，给出三到六条链的四个真实划分，逐步取出节点六三四且保留每条原链代表，分数二十四、三十、三十四、三十六可核对</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">真实6点树：圆内“编号:权值”；叶子4、5、6各开一条链</text><line x1="351" y1="87" x2="205" y2="171" stroke="#94a3b8" stroke-width="3"/><line x1="351" y1="87" x2="513" y2="171" stroke="#94a3b8" stroke-width="3"/><line x1="205" y1="171" x2="117" y2="269" stroke="#94a3b8" stroke-width="3"/><line x1="205" y1="171" x2="289" y2="269" stroke="#94a3b8" stroke-width="3"/><line x1="513" y1="171" x2="513" y2="269" stroke="#94a3b8" stroke-width="3"/><circle cx="351" cy="87" r="29" fill="#dbeafe" stroke="#20334a" stroke-width="2"/><text x="351" y="95" font-size="22" fill="#20334a" text-anchor="middle">1:8</text><circle cx="205" cy="171" r="29" fill="#dbeafe" stroke="#20334a" stroke-width="2"/><text x="205" y="179" font-size="22" fill="#20334a" text-anchor="middle">2:9</text><circle cx="513" cy="171" r="29" fill="#dbeafe" stroke="#20334a" stroke-width="2"/><text x="513" y="179" font-size="22" fill="#20334a" text-anchor="middle">3:4</text><circle cx="117" cy="269" r="29" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="117" y="277" font-size="22" fill="#20334a" text-anchor="middle">4:2</text><circle cx="289" cy="269" r="29" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="289" y="277" font-size="22" fill="#20334a" text-anchor="middle">5:7</text><circle cx="513" cy="269" r="29" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="513" y="277" font-size="22" fill="#20334a" text-anchor="middle">6:6</text><text x="22" y="345" font-size="22" fill="#20334a" text-anchor="start">节点2：堆[2,7]加入9 ⇒ [7,9]，备用“节点4的2”</text><text x="22" y="389" font-size="22" fill="#20334a" text-anchor="start">节点3：堆[6]加入4 ⇒ [6]，备用“节点3的4”</text><text x="22" y="433" font-size="21" fill="#20334a" text-anchor="start">根1：堆[6,7,9]加入8 ⇒ [7,8,9]，备用“节点6的6”</text><rect x="22" y="476" width="676" height="56" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="36" y="512" font-size="20" fill="#20334a" text-anchor="start">k=3</text><text x="135" y="512" font-size="20" fill="#20334a" text-anchor="start">{2,4}；{5}；{1,3,6}</text><text x="684" y="512" font-size="21" fill="#20334a" text-anchor="end">9+7+8=24</text><rect x="22" y="540" width="676" height="56" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="576" font-size="20" fill="#20334a" text-anchor="start">k=4</text><text x="135" y="576" font-size="20" fill="#20334a" text-anchor="start">{2,4}；{5}；{1,3}；{6}</text><text x="684" y="576" font-size="21" fill="#20334a" text-anchor="end">24+6=30</text><rect x="22" y="604" width="676" height="56" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="640" font-size="20" fill="#20334a" text-anchor="start">k=5</text><text x="135" y="640" font-size="20" fill="#20334a" text-anchor="start">{2,4}；{5}；{1}；{3}；{6}</text><text x="684" y="640" font-size="21" fill="#20334a" text-anchor="end">30+4=34</text><rect x="22" y="668" width="676" height="56" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="704" font-size="20" fill="#20334a" text-anchor="start">k=6</text><text x="135" y="704" font-size="20" fill="#20334a" text-anchor="start">所有节点分别单独成链</text><text x="684" y="704" font-size="21" fill="#20334a" text-anchor="end">34+2=36</text><text x="22" y="775" font-size="20" fill="#20334a" text-anchor="start">备用记录具体未计分节点；取走它后原链仍保有一个最大值代表</text></g></svg>