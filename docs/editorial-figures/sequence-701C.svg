<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 365" role="img" aria-labelledby="title"><title id="title">They Are Everywhere · 集齐后，继续缩：教学小例</title><rect width="920" height="365" rx="12" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#253340"><text x="24" y="35" font-size="22" fill="#253340">701C · 教学小例</text><text x="24" y="113" font-size="15" fill="#253340">房间按原顺序</text><rect x="244" y="85" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="261" y="115" font-size="19" fill="#253340">a</text><text x="266" y="151" font-size="12" fill="#657586">1</text><rect x="320" y="85" width="68" height="49" rx="6" fill="#e2f3ed" stroke="#257c67"/><text x="337" y="115" font-size="19" fill="#253340">a</text><text x="342" y="151" font-size="12" fill="#657586">2</text><rect x="396" y="85" width="68" height="49" rx="6" fill="#e2f3ed" stroke="#257c67"/><text x="413" y="115" font-size="19" fill="#253340">b</text><text x="418" y="151" font-size="12" fill="#657586">3</text><rect x="472" y="85" width="68" height="49" rx="6" fill="#e2f3ed" stroke="#257c67"/><text x="489" y="115" font-size="19" fill="#253340">c</text><text x="494" y="151" font-size="12" fill="#657586">4</text><rect x="548" y="85" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="565" y="115" font-size="19" fill="#253340">b</text><text x="570" y="151" font-size="12" fill="#657586">5</text><rect x="624" y="85" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="641" y="115" font-size="19" fill="#253340">c</text><text x="646" y="151" font-size="12" fill="#657586">6</text><path d="M320,172 V179 H540 V172" stroke="#257c67" stroke-width="2" fill="none"/><text x="320" y="203" font-size="15" fill="#257c67">abc：集齐全部三类，长度 3</text><text x="24" y="254" font-size="18" fill="#253340">从 aabc 移去第一个 a 后，仍有一个 a，种类数仍为 3。</text><text x="24" y="307" font-size="18" fill="#253340">只有计数变成 0，才真正失去一种宝可梦。</text></g></svg>