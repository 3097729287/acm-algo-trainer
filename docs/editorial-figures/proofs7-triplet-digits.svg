<svg xmlns="http://www.w3.org/2000/svg" width="720" height="732" viewBox="0 0 720 732" role="img"><title>h三M三的所有五种无相邻一子掩码选择，四种通过一种超界，并以u二v零逐层显示up或vi决定高一位的完整运算和最后最低位比较</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">最高位档h=3、n=27：base=24，M=3=011₂</text><text x="70" y="86" font-size="22" fill="#20334a" text-anchor="middle">u</text><text x="196" y="86" font-size="22" fill="#20334a" text-anchor="middle">v</text><text x="381" y="86" font-size="22" fill="#20334a" text-anchor="middle">u | 2v</text><text x="605" y="86" font-size="22" fill="#20334a" text-anchor="middle">≤3?</text><rect x="22" y="107" width="676" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="70" y="139" font-size="22" fill="#20334a" text-anchor="middle">00</text><text x="196" y="139" font-size="22" fill="#20334a" text-anchor="middle">00</text><text x="381" y="139" font-size="22" fill="#20334a" text-anchor="middle">000 = 0</text><text x="605" y="139" font-size="22" fill="#20334a" text-anchor="middle">是</text><rect x="22" y="162" width="676" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="70" y="194" font-size="22" fill="#20334a" text-anchor="middle">01</text><text x="196" y="194" font-size="22" fill="#20334a" text-anchor="middle">00</text><text x="381" y="194" font-size="22" fill="#20334a" text-anchor="middle">001 = 1</text><text x="605" y="194" font-size="22" fill="#20334a" text-anchor="middle">是</text><rect x="22" y="217" width="676" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="70" y="249" font-size="22" fill="#20334a" text-anchor="middle">01</text><text x="196" y="249" font-size="22" fill="#20334a" text-anchor="middle">01</text><text x="381" y="249" font-size="22" fill="#20334a" text-anchor="middle">011 = 3</text><text x="605" y="249" font-size="22" fill="#20334a" text-anchor="middle">是</text><rect x="22" y="272" width="676" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="70" y="304" font-size="22" fill="#20334a" text-anchor="middle">10</text><text x="196" y="304" font-size="22" fill="#20334a" text-anchor="middle">00</text><text x="381" y="304" font-size="22" fill="#20334a" text-anchor="middle">010 = 2</text><text x="605" y="304" font-size="22" fill="#20334a" text-anchor="middle">是</text><rect x="22" y="327" width="676" height="47" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="70" y="359" font-size="22" fill="#20334a" text-anchor="middle">10</text><text x="196" y="359" font-size="22" fill="#20334a" text-anchor="middle">10</text><text x="381" y="359" font-size="22" fill="#20334a" text-anchor="middle">110 = 6</text><text x="605" y="359" font-size="22" fill="#20334a" text-anchor="middle">否</text><text x="22" y="429" font-size="22" fill="#20334a" text-anchor="start">保留路径u=10、v=00：下移一位后才知道结果位</text><text x="22" y="475" font-size="20" fill="#20334a" text-anchor="start">i=1：旧up=u₂=0，vi=v₁=0 ⇒ 第2位=0|0=0，等于M₂</text><text x="22" y="520" font-size="20" fill="#20334a" text-anchor="start">i=0：旧up=u₁=1，vi=v₀=0 ⇒ 第1位=1|0=1，等于M₁</text><text x="22" y="565" font-size="20" fill="#20334a" text-anchor="start">最后单独比较第0位u₀=0≤M₀=1 ⇒ 接受，c=24+2=26</text><text x="22" y="612" font-size="20" fill="#20334a" text-anchor="start">若u=10、v=10：在i=1已有第2位=0|1=1&gt;M₂=0，立刻剪掉</text><text x="22" y="660" font-size="21" fill="#20334a" text-anchor="start">不能用本层ui|vi比较第i位；左移意味着vi贡献给第i+1位</text><text x="22" y="705" font-size="20" fill="#20334a" text-anchor="start">本档恰有4对；u=11因相邻两个1而禁止，v不在u中的位也禁止</text></g></svg>