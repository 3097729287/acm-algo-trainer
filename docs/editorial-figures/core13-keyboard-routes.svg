<svg xmlns="http://www.w3.org/2000/svg" width="660" height="582" viewBox="0 0 660 582" role="img"><title>两条六键键盘bcxxba及cbxxab，三次敲击的真实位置和累计移动距离</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="33" font-size="22" fill="#20334a" text-anchor="start">两例目标abc、预算4；键位从0开始</text><text x="84" y="70" font-size="17" fill="#20334a" text-anchor="middle">0</text><rect x="54" y="83" width="60" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="84" y="113" font-size="24" fill="#20334a" text-anchor="middle">b</text><text x="180" y="70" font-size="17" fill="#20334a" text-anchor="middle">1</text><rect x="150" y="83" width="60" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="180" y="113" font-size="24" fill="#20334a" text-anchor="middle">c</text><text x="276" y="70" font-size="17" fill="#20334a" text-anchor="middle">2</text><rect x="246" y="83" width="60" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="276" y="113" font-size="24" fill="#20334a" text-anchor="middle">x</text><text x="372" y="70" font-size="17" fill="#20334a" text-anchor="middle">3</text><rect x="342" y="83" width="60" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="372" y="113" font-size="24" fill="#20334a" text-anchor="middle">x</text><text x="468" y="70" font-size="17" fill="#20334a" text-anchor="middle">4</text><rect x="438" y="83" width="60" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="468" y="113" font-size="24" fill="#20334a" text-anchor="middle">b</text><text x="564" y="70" font-size="17" fill="#20334a" text-anchor="middle">5</text><rect x="534" y="83" width="60" height="43" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="564" y="113" font-size="24" fill="#20334a" text-anchor="middle">a</text><text x="24" y="164" font-size="22" fill="#20334a" text-anchor="start">a5 → b0：5；a5 → b4：1</text><text x="24" y="204" font-size="22" fill="#20334a" text-anchor="start">b0 → c1：总6；b4 → c1：总4</text><text x="24" y="245" font-size="20" fill="#20334a" text-anchor="start">离c更远的b4，累计费用反而更小。</text><text x="84" y="304" font-size="17" fill="#20334a" text-anchor="middle">0</text><rect x="54" y="317" width="60" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="84" y="347" font-size="24" fill="#20334a" text-anchor="middle">c</text><text x="180" y="304" font-size="17" fill="#20334a" text-anchor="middle">1</text><rect x="150" y="317" width="60" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="180" y="347" font-size="24" fill="#20334a" text-anchor="middle">b</text><text x="276" y="304" font-size="17" fill="#20334a" text-anchor="middle">2</text><rect x="246" y="317" width="60" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="276" y="347" font-size="24" fill="#20334a" text-anchor="middle">x</text><text x="372" y="304" font-size="17" fill="#20334a" text-anchor="middle">3</text><rect x="342" y="317" width="60" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="372" y="347" font-size="24" fill="#20334a" text-anchor="middle">x</text><text x="468" y="304" font-size="17" fill="#20334a" text-anchor="middle">4</text><rect x="438" y="317" width="60" height="43" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="468" y="347" font-size="24" fill="#20334a" text-anchor="middle">a</text><text x="564" y="304" font-size="17" fill="#20334a" text-anchor="middle">5</text><rect x="534" y="317" width="60" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="564" y="347" font-size="24" fill="#20334a" text-anchor="middle">b</text><text x="24" y="398" font-size="22" fill="#20334a" text-anchor="start">a4 → b1：3；a4 → b5：1</text><text x="24" y="438" font-size="22" fill="#20334a" text-anchor="start">b1 → c0：总4；b5 → c0：总6</text><text x="24" y="479" font-size="20" fill="#20334a" text-anchor="start">先前较贵的b1，才有预算内的完整路线。</text><text x="24" y="550" font-size="21" fill="#20334a" text-anchor="start">状态区分终点；同一终点只保留最低累计费用。</text></g></svg>