<svg xmlns="http://www.w3.org/2000/svg" width="660" height="435" viewBox="0 0 660 435" role="img"><title>四灯珠真实亮度复制为八格，绿色选第四与第一，坏边标记一到二三到四，跨末尾好边不含切口</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="33" font-size="21" fill="#20334a" text-anchor="start">原身份四 → 一：跨末尾的一段只含一条内部边</text><text x="54" y="92" font-size="18" fill="#20334a" text-anchor="middle">原1</text><rect x="26" y="114" width="56" height="50" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="54" y="147" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="93" y="201" font-size="17" fill="#20334a" text-anchor="middle">坏</text><text x="132" y="92" font-size="18" fill="#20334a" text-anchor="middle">原2</text><rect x="104" y="114" width="56" height="50" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="132" y="147" font-size="25" fill="#20334a" text-anchor="middle">9</text><text x="171" y="201" font-size="17" fill="#20334a" text-anchor="middle">好</text><text x="210" y="92" font-size="18" fill="#20334a" text-anchor="middle">原3</text><rect x="182" y="114" width="56" height="50" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="210" y="147" font-size="25" fill="#20334a" text-anchor="middle">10</text><text x="249" y="201" font-size="17" fill="#20334a" text-anchor="middle">坏</text><text x="288" y="92" font-size="18" fill="#20334a" text-anchor="middle">原4</text><rect x="260" y="114" width="56" height="50" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="288" y="147" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="327" y="201" font-size="17" fill="#20334a" text-anchor="middle">好</text><text x="366" y="92" font-size="18" fill="#20334a" text-anchor="middle">原1</text><rect x="338" y="114" width="56" height="50" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="366" y="147" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="405" y="201" font-size="17" fill="#20334a" text-anchor="middle">坏</text><text x="444" y="92" font-size="18" fill="#20334a" text-anchor="middle">原2</text><rect x="416" y="114" width="56" height="50" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="444" y="147" font-size="25" fill="#20334a" text-anchor="middle">9</text><text x="483" y="201" font-size="17" fill="#20334a" text-anchor="middle">好</text><text x="522" y="92" font-size="18" fill="#20334a" text-anchor="middle">原3</text><rect x="494" y="114" width="56" height="50" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="522" y="147" font-size="25" fill="#20334a" text-anchor="middle">10</text><text x="561" y="201" font-size="17" fill="#20334a" text-anchor="middle">坏</text><text x="600" y="92" font-size="18" fill="#20334a" text-anchor="middle">原4</text><rect x="572" y="114" width="56" height="50" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="600" y="147" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="24" y="252" font-size="20" fill="#20334a" text-anchor="start">A=1,9,10,2；K=2，M=0；绿色原4、原1可展示。</text><text x="24" y="300" font-size="20" fill="#20334a" text-anchor="start">扫到原4：删好边2→3后仍坏1，再删坏边3→4。</text><text x="24" y="348" font-size="20" fill="#20334a" text-anchor="start">复制用于展开跨界；长度≤4才不会重复一个原身份。</text><text x="24" y="396" font-size="20" fill="#20334a" text-anchor="start">全部4颗展开后只有3条内部边，切口边不检查。</text></g></svg>