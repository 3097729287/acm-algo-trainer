<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" role="img"><title>两个真实位置窗口怎样拼成连续互异的值域</title><rect width="640" height="590" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">位置轴和值域轴分开看</text><text x="24" y="72" class="small" text-anchor="start">零基位置；L=2；绿/黄为实际选择的两个窗口</text><text x="89" y="108" class="small" text-anchor="middle">0</text><rect x="63" y="126" width="52" height="38" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="89.0" y="152.0" class="" text-anchor="middle">2</text><text x="177" y="108" class="small" text-anchor="middle">1</text><rect x="151" y="126" width="52" height="38" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="177.0" y="152.0" class="" text-anchor="middle">1</text><text x="265" y="108" class="small" text-anchor="middle">2</text><rect x="239" y="126" width="52" height="38" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="265.0" y="152.0" class="" text-anchor="middle">2</text><text x="353" y="108" class="small" text-anchor="middle">3</text><rect x="327" y="126" width="52" height="38" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="353.0" y="152.0" class="" text-anchor="middle">4</text><text x="441" y="108" class="small" text-anchor="middle">4</text><rect x="415" y="126" width="52" height="38" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="441.0" y="152.0" class="" text-anchor="middle">3</text><text x="529" y="108" class="small" text-anchor="middle">5</text><rect x="503" y="126" width="52" height="38" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="529.0" y="152.0" class="" text-anchor="middle">5</text><line x1="89" y1="188" x2="265" y2="188" stroke="#bb575e" stroke-width="3" stroke-dasharray=""/><line x1="89" y1="180" x2="89" y2="196" stroke="#bb575e" stroke-width="2" stroke-dasharray=""/><line x1="265" y1="180" x2="265" y2="196" stroke="#bb575e" stroke-width="2" stroke-dasharray=""/><text x="24" y="229" class="" text-anchor="start">重复值2：prv[2]=0，但0在窗口[1,2]外</text><text x="24" y="269" class="" text-anchor="start">窗口[1,2]：lo=1，hi=2，最大prv=0</text><text x="24" y="306" class="" text-anchor="start">窗口[3,4]：lo=3，hi=4，最大prv=−1</text><text x="24" y="359" class="" text-anchor="start">另一条轴：排序后的值，不是原位置</text><rect x="125" y="386" width="68" height="45" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="159.0" y="415.5" class="" text-anchor="middle">1</text><rect x="220" y="386" width="68" height="45" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="254.0" y="415.5" class="" text-anchor="middle">2</text><rect x="315" y="386" width="68" height="45" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="349.0" y="415.5" class="" text-anchor="middle">3</text><rect x="410" y="386" width="68" height="45" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="444.0" y="415.5" class="" text-anchor="middle">4</text><text x="24" y="475" class="" text-anchor="start">最小值3 − L2 = 1，命中seen[1]</text><text x="24" y="515" class="" text-anchor="start">i=3时新登记j=1：位置[1,2]已在左侧</text><text x="24" y="554" class="" text-anchor="start">绿值域1..2和黄值域3..4恰接成1..4</text></svg>