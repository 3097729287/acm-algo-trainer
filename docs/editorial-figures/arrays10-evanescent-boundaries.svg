<svg xmlns="http://www.w3.org/2000/svg" width="870" height="596" viewBox="0 0 870 596" role="img"><title>三种内部删除前后相邻分界的消失与新生</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="24" fill="#20334a" text-anchor="start">竖线是分界：只删一格，比较删除前后的真实相邻关系</text><rect x="40" y="108" width="48" height="43" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="64" y="138" font-size="25" fill="#20334a" text-anchor="middle">a</text><rect x="102" y="108" width="48" height="43" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="126" y="138" font-size="25" fill="#20334a" text-anchor="middle">b</text><path d="M94,100 L94,157" stroke="#a95221" stroke-width="3" fill="none"/><rect x="164" y="108" width="48" height="43" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="188" y="138" font-size="25" fill="#20334a" text-anchor="middle">a</text><path d="M156,100 L156,157" stroke="#a95221" stroke-width="3" fill="none"/><path d="M109,112 L143,145" stroke="#bf4038" stroke-width="3" fill="none"/><path d="M143,112 L109,145" stroke="#bf4038" stroke-width="3" fill="none"/><path d="M310,130 L385,130" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="420" y="108" width="48" height="43" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="444" y="138" font-size="25" fill="#20334a" text-anchor="middle">a</text><rect x="482" y="108" width="48" height="43" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="506" y="138" font-size="25" fill="#20334a" text-anchor="middle">a</text><text x="670" y="138" font-size="25" fill="#20334a" text-anchor="start">减 2</text><text x="40" y="199" font-size="21" fill="#20334a" text-anchor="start">删中间 b，三段 → 一段</text><rect x="40" y