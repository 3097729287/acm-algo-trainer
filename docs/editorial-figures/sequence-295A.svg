<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 365" role="img" aria-labelledby="title"><title id="title">Greg and Array · 操作也有自己的区间：教学小例</title><rect width="920" height="365" rx="12" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#253340"><text x="24" y="35" font-size="22" fill="#253340">295A · 教学小例</text><text x="24" y="98" font-size="15" fill="#253340">操作编号 → 执行次数</text><rect x="244" y="70" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="261" y="100" font-size="19" fill="#253340">1</text><text x="266" y="136" font-size="12" fill="#657586">1</text><rect x="320" y="70" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="337" y="100" font-size="19" fill="#253340">2</text><text x="342" y="136" font-size="12" fill="#657586">2</text><rect x="396" y="70" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="413" y="100" font-size="19" fill="#253340">1</text><text x="418" y="136" font-size="12" fill="#657586">3</text><text x="24" y="198" font-size="15" fill="#253340">数组位置 → 最终增量</text><rect x="244" y="170" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="261" y="200" font-size="19" fill="#253340">2</text><text x="266" y="236" font-size="12" fill="#657586">1</text><rect x="320" y="170" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="337" y="200" font-size="19" fill="#253340">6</text><text x="342" y="236" font-size="12" fill="#657586">2</text><rect x="396" y="170" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="413" y="200" font-size="19" fill="#253340">5</text><text x="418" y="236" font-size="12" fill="#657586">3</text><text x="24" y="300" font-size="18" fill="#253340">原值 [1,2,3] + 增量 [2,6,5] = 最终 [3,8,8]。</text><text x="24" y="335" font-size="17" fill="#253340">操作 2 被执行两次：其每次增量 2，要乘次数 2。</text></g></svg>