<svg xmlns="http://www.w3.org/2000/svg" width="870" height="520" viewBox="0 0 870 520" role="img"><title>同一数轴上两组不同原元素各自夹住目标</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="24" fill="#20334a" text-anchor="start">a=[1,4,8,10]，b=[3,9]：两组各用两个不同原元素</text><path d="M130,145 L700,145" stroke="#9ba7b7" stroke-width="2" fill="none"/><path d="M180,140 L180,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="180" y="177" font-size="17" fill="#20334a" text-anchor="middle">1</text><path d="M230,140 L230,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="230" y="177" font-size="17" fill="#20334a" text-anchor="middle">2</text><path d="M280,140 L280,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="280" y="177" font-size="17" fill="#20334a" text-anchor="middle">3</text><path d="M330,140 L330,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="330" y="177" font-size="17" fill="#20334a" text-anchor="middle">4</text><path d="M380,140 L380,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="380" y="177" font-size="17" fill="#20334a" text-anchor="middle">5</text><path d="M430,140 L430,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="430" y="177" font-size="17" fill="#20334a" text-anchor="middle">6</text><path d="M480,140 L480,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="480" y="177" font-size="17" fill="#20334a" text-anchor="middle">7</text><path d="M530,140 L530,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="530" y="177" font-size="17" fill="#20334a" text-anchor="middle">8</text><path d="M580,140 L580,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="580" y="177" font-size="17" fill="#20334a" text-anchor="middle">9</text><path d="M630,140 L630,150" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="630" y="177" font-size="17" fill="#20334a" text-anchor="middle">10</text><path d="M180,121 L530,121" stroke="#2563a6" stroke-width="4" fill="none"/><text x="180" y="103" font-size="21" fill="#2563a6" text-anchor="middle">原数 1</text><text x="530" y="103" font-size="21" fill="#2563a6" text-anchor="middle">原数 8</text><circle cx="280" cy="145" r="9" fill="#2563a6"/><text x="280" y="217" font-size="22" fill="#2563a6" text-anchor="middle">合并后选 3</text><path d="M130,315 L700,315" stroke="#9ba7b7" stroke-width="2" fill="none"/><path d="M180,310 L180,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="180" y="347" font-size="17" fill="#20334a" text-anchor="middle">1</text><path d="M230,310 L230,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="230" y="347" font-size="17" fill="#20334a" text-anchor="middle">2</text><path d="M280,310 L280,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="280" y="347" font-size="17" fill="#20334a" text-anchor="middle">3</text><path d="M330,310 L330,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="330" y="347" font-size="17" fill="#20334a" text-anchor="middle">4</text><path d="M380,310 L380,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="380" y="347" font-size="17" fill="#20334a" text-anchor="middle">5</text><path d="M430,310 L430,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="430" y="347" font-size="17" fill="#20334a" text-anchor="middle">6</text><path d="M480,310 L480,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="480" y="347" font-size="17" fill="#20334a" text-anchor="middle">7</text><path d="M530,310 L530,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="530" y="347" font-size="17" fill="#20334a" text-anchor="middle">8</text><path d="M580,310 L580,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="580" y="347" font-size="17" fill="#20334a" text-anchor="middle">9</text><path d="M630,310 L630,320" stroke="#9ba7b7" stroke-width="1" fill="none"/><text x="630" y="347" font-size="17" fill="#20334a" text-anchor="middle">10</text><path d="M330,291 L630,291" stroke="#328350" stroke-width="4" fill="none"/><text x="330" y="273" font-size="21" fill="#328350" text-anchor="middle">原数 4</text><text x="630" y="273" font-size="21" fill="#328350" text-anchor="middle">原数 10</text><circle cx="580" cy="315" r="9" fill="#328350"/><text x="580" y="387" font-size="22" fill="#328350" text-anchor="middle">合并后选 9</text><text x="25" y="439" font-size="22" fill="#20334a" text-anchor="start">组一 {1,8} → 3；组二 {4,10} → 9；四个原位置各用一次</text><text x="25" y="483" font-size="21" fill="#20334a" text-anchor="start">数轴区间可重叠，原元素不能共用；两批端点由 n ≥ 2m 分开</text></g></svg>