<svg xmlns="http://www.w3.org/2000/svg" width="720" height="799" viewBox="0 0 720 799" role="img"><title>原六点树切一二边左右一三六与二四五各三点，k三时根在对侧各产生三个具体有序对，选全侧三点给出真实LCA见证，逐根集合大小二二三三三四总十七</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">原六点样例：n=6，k=3；切边1—2，两侧各3点</text><rect x="25" y="74" width="290" height="346" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><rect x="405" y="74" width="290" height="346" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><path d="M170 131 L550 131" stroke="#64748b" stroke-width="3" fill="none"/><path d="M170 131 L170 251" stroke="#64748b" stroke-width="3" fill="none"/><path d="M170 251 L170 371" stroke="#64748b" stroke-width="3" fill="none"/><path d="M550 131 L470 283" stroke="#64748b" stroke-width="3" fill="none"/><path d="M550 131 L630 283" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="170" cy="131" r="23" fill="#bfdbfe" stroke="#285b87" stroke-width="2"/><text x="170" y="138" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="170" cy="251" r="23" fill="#bfdbfe" stroke="#285b87" stroke-width="2"/><text x="170" y="258" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="170" cy="371" r="23" fill="#bfdbfe" stroke="#285b87" stroke-width="2"/><text x="170" y="378" font-size="21" fill="#20334a" text-anchor="middle">6</text><circle cx="550" cy="131" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="550" y="138" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="470" cy="283" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="470" y="290" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="630" cy="283" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="630" y="290" font-size="21" fill="#20334a" text-anchor="middle">5</text><text x="22" y="463" font-size="21" fill="#20334a" text-anchor="start">根r∈{2,4,5}：候选v=1，子树恰为{1,3,6}</text><text x="22" y="510" font-size="20" fill="#20334a" text-anchor="start">三对：(1,2)、(1,4)、(1,5)，LCA见证都选{1,3,6}</text><text x="22" y="567" font-size="21" fill="#20334a" text-anchor="start">根r∈{1,3,6}：候选v=2，子树恰为{2,4,5}</text><text x="22" y="614" font-size="20" fill="#20334a" text-anchor="start">三对：(2,1)、(2,3)、(2,6)，LCA见证都选{2,4,5}</text><text x="22" y="671" font-size="21" fill="#20334a" text-anchor="start">本边两次条件均通过：s=3≤n−k=3，各加3</text><text x="22" y="727" font-size="20" fill="#20334a" text-anchor="start">全树按根所得S：{1,2}、{1,2}、{1,2,3}、</text><text x="22" y="769" font-size="21" fill="#20334a" text-anchor="start">{1,2,4}、{1,2,5}、{1,2,3,6}；和为17</text></g></svg>