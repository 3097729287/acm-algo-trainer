<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img"><title>Walk the Line：城镇二到五的实际位置、预算十三与二分返回六</title><rect width="640" height="520" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">固定左端二：先计算预算，再看二分位置</text><text x="24" y="67" class="" text-anchor="start">S = 3，L = 10；前缀坐标 P = 0, 5, 7, 11, 12, 18</text><line x1="55" y1="155" x2="577" y2="155" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><line x1="55" y1="126" x2="55" y2="149" stroke="#9aabb9" stroke-width="1" stroke-dasharray=""/><circle cx="55" cy="155" r="7" fill="#52677b"/><text x="55" y="118" class="" text-anchor="middle">1</text><text x="55" y="190" class="" text-anchor="middle">0</text><line x1="200" y1="126" x2="200" y2="149" stroke="#9aabb9" stroke-width="1" stroke-dasharray=""/><circle cx="200" cy="155" r="7" fill="#168377"/><text x="200" y="118" class="" text-anchor="middle">2</text><text x="200" y="190" class="" text-anchor="middle">5</text><line x1="258" y1="126" x2="258" y2="149" stroke="#9aabb9" stroke-width="1" stroke-dasharray=""/><circle cx="258" cy="155" r="7" fill="#d68626"/><text x="258" y="118" class="" text-anchor="middle">3</text><text x="258" y="190" class="" text-anchor="middle">7</text><line x1="374" y1="126" x2="374" y2="149" stroke="#9aabb9" stroke-width="1" stroke-dasharray=""/><circle cx="374" cy="155" r="7" fill="#168377"/><text x="374" y="118" class="" text-anchor="middle">4</text><text x="374" y="190" class="" text-anchor="middle">11</text><line x1="403" y1="104" x2="403" y2="149" stroke="#9aabb9" stroke-width="1" stroke-dasharray=""/><circle cx="403" cy="155" r="7" fill="#168377"/><text x="403" y="96" class="" text-anchor="middle">5</text><text x="403" y="210" class="" text-anchor="middle">12</text><line x1="577" y1="126" x2="577" y2="149" stroke="#9aabb9" stroke-width="1" stroke-dasharray=""/><circle cx="577" cy="155" r="7" fill="#52677b"/><text x="577" y="118" class="" text-anchor="middle">6</text><text x="577" y="190" class="" text-anchor="middle">18</text><text x="24" y="238" class="small" text-anchor="start">城镇编号在轴上方，真实路程坐标在轴下方</text><line x1="200" y1="255" x2="258" y2="255" stroke="#d68626" stroke-width="5" stroke-dasharray=""/><text x="230" y="283" class="" text-anchor="middle">x = 7 − 5 = 2</text><line x1="258" y1="317" x2="403" y2="317" stroke="#168377" stroke-width="5" stroke-dasharray=""/><text x="332" y="347" class="" text-anchor="middle">y = 12 − 7 = 5</text><line x1="432" y1="137" x2="432" y2="360" stroke="#b75b36" stroke-width="2" stroke-dasharray="5,4"/><text x="24" y="391" class="" text-anchor="start">ym = max(10 − 2×2, (10 − 2)/2) = 6</text><text x="24" y="425" class="" text-anchor="start">允许坐标 ≤ 7 + 6 = 13（虚线）；第一个超过的是 18</text><text x="24" y="459" class="" text-anchor="start">upper_bound 返回城镇六 → 减一取城镇五</text><text x="24" y="493" class="" text-anchor="start">路线 3 → 2 → 3 → 4 → 5，路程 9，访问 4 个城镇</text></svg>