<svg xmlns="http://www.w3.org/2000/svg" width="760" height="895" viewBox="0 0 760 895" role="img"><title>同一三乘三矩阵原一一三二一二三二三中心一改二，原两条同色边中保留左上横边删除中心向上边，新增中心向左向右向下三条，总四对</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#12365a" font-size="24" text-anchor="start">只换中间一盏：旧2对 − 1对 + 3对 = 4对</text><text x="50" y="100" fill="#12365a" font-size="22" text-anchor="start">原板：base=2</text><rect x="50" y="140" width="67" height="67" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="83.5" y="185" fill="#12365a" font-size="29" text-anchor="middle">1</text><rect x="139" y="140" width="67" height="67" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="172.5" y="185" fill="#12365a" font-size="29" text-anchor="middle">1</text><rect x="228" y="140" width="67" height="67" rx="6" fill="#e9d5ff" stroke="#2563eb" stroke-width="2"/><text x="261.5" y="185" fill="#12365a" font-size="29" text-anchor="middle">3</text><rect x="50" y="229" width="67" height="67" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="83.5" y="274" fill="#12365a" font-size="29" text-anchor="middle">2</text><rect x="139" y="229" width="67" height="67" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="172.5" y="274" fill="#12365a" font-size="29" text-anchor="middle">1</text><rect x="228" y="229" width="67" height="67" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="261.5" y="274" fill="#12365a" font-size="29" text-anchor="middle">2</text><rect x="50" y="318" width="67" height="67" rx="6" fill="#e9d5ff" stroke="#2563eb" stroke-width="2"/><text x="83.5" y="363" fill="#12365a" font-size="29" text-anchor="middle">3</text><rect x="139" y="318" width="67" height="67" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="172.5" y="363" fill="#12365a" font-size="29" text-anchor="middle">2</text><rect x="228" y="318" width="67" height="67" rx="6" fill="#e9d5ff" stroke="#2563eb" stroke-width="2"/><text x="261.5" y="363" fill="#12365a" font-size="29" text-anchor="middle">3</text><line x1="118.5" y1="173.5" x2="137.5" y2="173.5" stroke="#64748b" stroke-width="7"/><line x1="172.5" y1="208.5" x2="172.5" y2="227.5" stroke="#dc2626" stroke-width="7"/><text x="420" y="100" fill="#12365a" font-size="22" text-anchor="start">中间1→2：共4对</text><rect x="420" y="140" width="67" height="67" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="453.5" y="185" fill="#12365a" font-size="29" text-anchor="middle">1</text><rect x="509" y="140" width="67" height="67" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="542.5" y="185" fill="#12365a" font-size="29" text-anchor="middle">1</text><rect x="598" y="140" width="67" height="67" rx="6" fill="#e9d5ff" stroke="#2563eb" stroke-width="2"/><text x="631.5" y="185" fill="#12365a" font-size="29" text-anchor="middle">3</text><rect x="420" y="229" width="67" height="67" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="453.5" y="274" fill="#12365a" font-size="29" text-anchor="middle">2</text><rect x="509" y="229" width="67" height="67" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="542.5" y="274" fill="#12365a" font-size="29" text-anchor="middle">2</text><rect x="598" y="229" width="67" height="67" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="631.5" y="274" fill="#12365a" font-size="29" text-anchor="middle">2</text><rect x="420" y="318" width="67" height="67" rx="6" fill="#e9d5ff" stroke="#2563eb" stroke-width="2"/><text x="453.5" y="363" fill="#12365a" font-size="29" text-anchor="middle">3</text><rect x="509" y="318" width="67" height="67" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="542.5" y="363" fill="#12365a" font-size="29" text-anchor="middle">2</text><rect x="598" y="318" width="67" height="67" rx="6" fill="#e9d5ff" stroke="#2563eb" stroke-width="2"/><text x="631.5" y="363" fill="#12365a" font-size="29" text-anchor="middle">3</text><line x1="488.5" y1="173.5" x2="507.5" y2="173.5" stroke="#64748b" stroke-width="7"/><line x1="488.5" y1="262.5" x2="507.5" y2="262.5" stroke="#15803d" stroke-width="7"/><line x1="577.5" y1="262.5" x2="596.5" y2="262.5" stroke="#15803d" stroke-width="7"/><line x1="542.5" y1="297.5" x2="542.5" y2="316.5" stroke="#15803d" stroke-width="7"/><line x1="30" y1="477" x2="91" y2="477" stroke="#64748b" stroke-width="6"/><text x="110" y="485" fill="#12365a" font-size="22" text-anchor="start">灰边：左上—上中，始终保留1对。</text><line x1="30" y1="539" x2="91" y2="539" stroke="#dc2626" stroke-width="6"/><text x="110" y="547" fill="#12365a" font-size="22" text-anchor="start">红边：中间—上中，旧1对被减掉。</text><line x1="30" y1="601" x2="91" y2="601" stroke="#15803d" stroke-width="6"/><text x="110" y="609" fill="#12365a" font-size="22" text-anchor="start">绿边：中间的左、右、下，各加1对。</text><text x="24" y="686" fill="#12365a" font-size="22" text-anchor="start">其余不接触中间格的边，两个端点都未改变。</text><text x="24" y="741" fill="#12365a" font-size="21" text-anchor="start">初始只向右、下数一次；改色影响必须查四邻。</text><text x="24" y="796" fill="#12365a" font-size="21" text-anchor="start">每次候选仍看原板，不累计前一个候选的更换。</text><text x="24" y="851" fill="#12365a" font-size="21" text-anchor="start">不换也合法，先保留base，再和全部改色结果比较。</text></svg>