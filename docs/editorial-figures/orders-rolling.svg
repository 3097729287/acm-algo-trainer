<svg xmlns="http://www.w3.org/2000/svg" width="620" height="528" viewBox="0 0 620 528" role="img"><title>后缀DP第五行由第六行与第七行的旧值计算，显示完整操作数和交换顺序</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="40" font-size="23" fill="#20334a" text-anchor="start">计算 i=5 之前：来源行只读，cur 新写</text><text x="26" y="84" font-size="20" fill="#20334a" text-anchor="start">选中份数</text><text x="380" y="84" font-size="18" fill="#20334a" text-anchor="middle">k=0</text><text x="460" y="84" font-size="18" fill="#20334a" text-anchor="middle">k=1</text><text x="540" y="84" font-size="18" fill="#20334a" text-anchor="middle">k=2</text><rect x="26" y="108" width="568" height="58" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="44" y="145" font-size="23" fill="#20334a" text-anchor="start">next  = Q[6]</text><text x="380" y="145" font-size="23" fill="#20334a" text-anchor="middle">0</text><text x="460" y="145" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="540" y="145" font-size="23" fill="#20334a" text-anchor="middle">∞</text><rect x="26" y="185" width="568" height="58" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="44" y="222" font-size="23" fill="#20334a" text-anchor="start">next2 = Q[7]</text><text x="380" y="222" font-size="23" fill="#20334a" text-anchor="middle">0</text><text x="460" y="222" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="540" y="222" font-size="23" fill="#20334a" text-anchor="middle">∞</text><rect x="26" y="365" width="568" height="58" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="44" y="402" font-size="23" fill="#20334a" text-anchor="start">cur   = Q[5]</text><text x="380" y="402" font-size="23" fill="#20334a" text-anchor="middle">0</text><text x="460" y="402" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="540" y="402" font-size="23" fill="#20334a" text-anchor="middle">3</text><text x="26" y="284" font-size="21" fill="#20334a" text-anchor="start">不选位置 5：next[2] = ∞</text><text x="26" y="324" font-size="21" fill="#20334a" text-anchor="start">选位置 5：next2[1] + b₅ = 1+2 = 3</text><text x="26" y="460" font-size="20" fill="#20334a" text-anchor="start">交换后进入 i=4：next=Q[5]，next2=Q[6]</text><text x="26" y="500" font-size="20" fill="#20334a" text-anchor="start">预算检查在交换前：pref[3][2]+cur[2] = 3+3</text></g></svg>