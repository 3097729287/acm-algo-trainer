<svg xmlns="http://www.w3.org/2000/svg" width="720" height="656" viewBox="0 0 720 656" role="img"><title>具体树路径补入公共祖先前后值一的频率由一变二，阈值数组只有第二项改变，恰一次答案从错误的三恢复为二，撤销后窗口原样恢复</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="35" font-size="23" fill="#20334a" text-anchor="start">仍取询问(3,4)，a=b=1；统计的是不同值个数</text><rect x="22" y="77" width="676" height="115" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="40" y="113" font-size="23" fill="#20334a" text-anchor="start">窗口奇数次顶点 {4,2,3}，值为 {3,2,1}</text><text x="40" y="157" font-size="23" fill="#20334a" text-anchor="start">cnt[1]=1；P[1]=3，P[2]=0，P[3]=0</text><path d="M360,199 L360,242" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="360,242 355.0,232.0 365.0,232.0" fill="#087b48"/><text x="389" y="230" font-size="21" fill="#087b48" text-anchor="start">临时加入根1（值1）</text><rect x="22" y="252" width="676" height="128" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="40" y="289" font-size="23" fill="#20334a" text-anchor="start">真实路径 {3,1,2,4}，值为 {1,1,2,3}</text><text x="40" y="332" font-size="22" fill="#20334a" text-anchor="start">cnt[1]：1→2，仅P[2]增加1；P[1]仍为3</text><text x="40" y="365" font-size="22" fill="#20334a" text-anchor="start">恰一次：P[1]−P[2]=3−1=2</text><path d="M360,387 L360,430" fill="none" stroke="#b36b16" stroke-width="3"/><polygon points="360,430 355.0,420.0 365.0,420.0" fill="#b36b16"/><text x="389" y="419" font-size="21" fill="#b36b16" text-anchor="start">读答案后立即移除根1</text><rect x="22" y="440" width="676" height="101" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="40" y="477" font-size="22" fill="#20334a" text-anchor="start">cnt[1]：2→1，仅P[2]减少1，恢复窗口统计</text><text x="40" y="517" font-size="21" fill="#20334a" text-anchor="start">used[1]一直为false；临时补值不改变窗口端点与奇偶</text><text x="22" y="586" font-size="22" fill="#a32e36" text-anchor="start">补根前若直接回答，会把频率恰一次的值误数成3种</text><text x="22" y="630" font-size="22" fill="#20334a" text-anchor="start">“至少a次”减去“至少b+1次”，恰好留下频率[a,b]</text></g></svg>