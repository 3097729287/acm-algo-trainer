<svg xmlns="http://www.w3.org/2000/svg" width="720" height="768" viewBox="0 0 720 768" role="img"><title>真实三人投票上限一二二目标k一，最大指数一的三个元组，最大指数二时外层A五元组包含内层B唯一一一一，扣后四种合计七种，给出Qcur和统一组全部系数与五减一算数</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">a=[2,4,4]、x=2：q=2的上限[1,2,2]，k=1</text><text x="22" y="80" font-size="22" fill="#20334a" text-anchor="start">M=1：总和2，上限[1,1,1]；三种都合法</text><rect x="40" y="111" width="209" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="144" y="145" font-size="23" fill="#20334a" text-anchor="middle">(0,1,1)</text><rect x="265" y="111" width="209" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="369" y="145" font-size="23" fill="#20334a" text-anchor="middle">(1,0,1)</text><rect x="490" y="111" width="209" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="594" y="145" font-size="23" fill="#20334a" text-anchor="middle">(1,1,0)</text><text x="22" y="209" font-size="21" fill="#20334a" text-anchor="start">M=2：总和3，A=5；红框B=1是A中的一部分</text><rect x="22" y="240" width="676" height="218" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><rect x="41" y="260" width="199" height="55" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="140" y="297" font-size="24" fill="#20334a" text-anchor="middle">(1,2,0)</text><rect x="260" y="260" width="199" height="55" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="359" y="297" font-size="24" fill="#20334a" text-anchor="middle">(1,0,2)</text><rect x="41" y="341" width="199" height="55" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="140" y="378" font-size="24" fill="#20334a" text-anchor="middle">(0,1,2)</text><rect x="260" y="341" width="199" height="55" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="359" y="378" font-size="24" fill="#20334a" text-anchor="middle">(0,2,1)</text><rect x="488" y="277" width="185" height="133" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="580" y="317" font-size="22" fill="#20334a" text-anchor="middle">B：(1,1,1)</text><text x="580" y="362" font-size="20" fill="#20334a" text-anchor="middle">最大值1，扣掉</text><text x="22" y="505" font-size="20" fill="#20334a" text-anchor="start">留下4种最大值2；与上面3种合计7个真实投票数组</text><text x="22" y="552" font-size="20" fill="#20334a" text-anchor="start">例如(1,2,0)还原为p=[2,4,1]：2×lcm=2×4=8</text><text x="22" y="599" font-size="20" fill="#20334a" text-anchor="start">乘积2×4×1=8；并列最大值(1,1,0)也只计一次</text><text x="22" y="646" font-size="20" fill="#20334a" text-anchor="start">Qcur=1+z，统一组(1+z+z²)²系数为1,2,3,2,1</text><text x="22" y="693" font-size="20" fill="#20334a" text-anchor="start">A的三次项=1×2+1×3=5；B的三次项=1，所以差4</text><text x="22" y="740" font-size="20" fill="#20334a" text-anchor="start">被减元组原本就在A内；不同M按真实最大值互不重叠</text></g></svg>