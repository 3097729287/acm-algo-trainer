<svg xmlns="http://www.w3.org/2000/svg" width="720" height="735" viewBox="0 0 720 735" role="img"><title>MEX五的真实合成树，零一二的两份不同副本各用一次，先合成三再合成五，第三个零保留，逐值库存与统一需求一二二二的算数同步</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">目标5：同值副本也各有身份，合成时不能重复使用</text><text x="22" y="72" font-size="21" fill="#20334a" text-anchor="start">先用0A、1A、2A造3；再用0B、1B、2B、3、4造5</text><rect x="325" y="102" width="70" height="49" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="360" y="136" font-size="25" fill="#20334a" text-anchor="middle">5</text><path d="M70,226 L360,153" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="360,153 351.52306649565696,160.289828417936 349.0819771630454,150.5923502472872" fill="#2d6db4"/><rect x="37" y="230" width="66" height="47" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="70" y="262" font-size="23" fill="#20334a" text-anchor="middle">0B</text><path d="M210,226 L360,153" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="360,153 353.1962701497142,161.87182394574705 348.8203029332309,152.8801104872196" fill="#2d6db4"/><rect x="177" y="230" width="66" height="47" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="210" y="262" font-size="23" fill="#20334a" text-anchor="middle">1B</text><path d="M350,226 L360,153" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="360,153 363.59654876422474,163.5860680607369 353.6890748099453,162.2288798478219" fill="#2d6db4"/><rect x="317" y="230" width="66" height="47" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="350" y="262" font-size="23" fill="#20334a" text-anchor="middle">2B</text><path d="M490,226 L360,153" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="360,153 371.1674566403106,153.53657449322813 366.2712143896038,162.25591000818534" fill="#2d6db4"/><rect x="457" y="230" width="66" height="47" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="490" y="262" font-size="23" fill="#20334a" text-anchor="middle">3</text><path d="M630,226 L360,153" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="360,153 370.9583858858095,150.78329551412662 368.3483951201844,160.43668601712358" fill="#2d6db4"/><rect x="597" y="230" width="66" height="47" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="630" y="262" font-size="23" fill="#20334a" text-anchor="middle">4</text><path d="M410,338 L490,280" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="490,280 484.8387334233608,289.9177279315812 478.96905770875145,281.82162349763735" fill="#2d6db4"/><rect x="377" y="342" width="66" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="410" y="374" font-size="22" fill="#20334a" text-anchor="middle">0A</text><path d="M500,338 L490,280" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="490,280 496.6263697437982,289.00506657490524 486.77176858635477,290.7041357399817" fill="#2d6db4"/><rect x="467" y="342" width="66" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="500" y="374" font-size="22" fill="#20334a" text-anchor="middle">1A</text><path d="M590,338 L490,280" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="490,280 501.1589023414773,280.69202495140945 496.1417214437588,289.34233684402744" fill="#2d6db4"/><rect x="557" y="342" width="66" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="590" y="374" font-size="22" fill="#20334a" text-anchor="middle">2A</text><rect x="35" y="342" width="180" height="47" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="125" y="374" font-size="22" fill="#20334a" text-anchor="middle">0C始终留着</text><text x="72" y="442" font-size="21" fill="#20334a" text-anchor="middle">处理值x</text><text x="238" y="442" font-size="21" fill="#20334a" text-anchor="middle">库存c</text><text x="404" y="442" font-size="21" fill="#20334a" text-anchor="middle">处理前q</text><text x="596" y="442" font-size="21" fill="#20334a" text-anchor="middle">较小值需求</text><rect x="22" y="459" width="676" height="37" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="72" y="486" font-size="20" fill="#20334a" text-anchor="middle">4</text><text x="238" y="486" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="404" y="486" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="596" y="486" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="22" y="502" width="676" height="37" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="72" y="529" font-size="20" fill="#20334a" text-anchor="middle">3</text><text x="238" y="529" font-size="20" fill="#20334a" text-anchor="middle">0</text><text x="404" y="529" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="596" y="529" font-size="20" fill="#20334a" text-anchor="middle">2×1−0=2</text><rect x="22" y="545" width="676" height="37" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="72" y="572" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="238" y="572" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="404" y="572" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="596" y="572" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="22" y="588" width="676" height="37" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="72" y="615" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="238" y="615" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="404" y="615" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="596" y="615" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="22" y="631" width="676" height="37" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="72" y="658" font-size="20" fill="#20334a" text-anchor="middle">0</text><text x="238" y="658" font-size="20" fill="#20334a" text-anchor="middle">3</text><text x="404" y="658" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="596" y="658" font-size="20" fill="#20334a" text-anchor="middle">3≥2，通过</text><text x="22" y="708" font-size="20" fill="#20334a" text-anchor="start">两条0/1/2需求来自不同分支，最后只耗两个零；0C没有领两次</text></g></svg>