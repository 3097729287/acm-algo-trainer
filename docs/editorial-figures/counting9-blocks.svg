<svg xmlns="http://www.w3.org/2000/svg" width="640" height="607" viewBox="0 0 640 607" role="img"><title>Maximize Score：形式单项划分与真实非单项优先执行</title><rect width="640" height="607" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">[1,2,3,4,1,2,3,4]：形式划分与真正执行</text><text x="24" y="75" class="small" text-anchor="start">位置1、2、3暂作单项；4..8同值端点组成五项块</text><text x="67" y="112" class="small" text-anchor="middle">1</text><rect x="40" y="129" width="54" height="45" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="67" y="159" class="" text-anchor="middle">1</text><text x="67" y="214" class="small" text-anchor="middle">28</text><text x="140" y="112" class="small" text-anchor="middle">2</text><rect x="113" y="129" width="54" height="45" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="140" y="159" class="" text-anchor="middle">2</text><text x="140" y="214" class="small" text-anchor="middle">27</text><text x="213" y="112" class="small" text-anchor="middle">3</text><rect x="186" y="129" width="54" height="45" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="213" y="159" class="" text-anchor="middle">3</text><text x="213" y="214" class="small" text-anchor="middle">26</text><text x="286" y="112" class="small" text-anchor="middle">4</text><rect x="259" y="129" width="54" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="286" y="159" class="" text-anchor="middle">4</text><text x="286" y="214" class="small" text-anchor="middle">25</text><text x="359" y="112" class="small" text-anchor="middle">5</text><rect x="332" y="129" width="54" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="359" y="159" class="" text-anchor="middle">1</text><text x="359" y="214" class="small" text-anchor="middle">4</text><text x="432" y="112" class="small" text-anchor="middle">6</text><rect x="405" y="129" width="54" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="432" y="159" class="" text-anchor="middle">2</text><text x="432" y="214" class="small" text-anchor="middle">3</text><text x="505" y="112" class="small" text-anchor="middle">7</text><rect x="478" y="129" width="54" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="505" y="159" class="" text-anchor="middle">3</text><text x="505" y="214" class="small" text-anchor="middle">2</text><text x="578" y="112" class="small" text-anchor="middle">8</text><rect x="551" y="129" width="54" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="578" y="159" class="" text-anchor="middle">4</text><text x="578" y="214" class="small" text-anchor="middle">1</text><text x="24" y="249" class="small" text-anchor="start">上方下标1..8；下方dp；空后缀dp9=0</text><line x1="259" y1="181" x2="604" y2="181" stroke="#168377" stroke-width="3" stroke-dasharray=""/><text x="432" y="280" class="small" text-anchor="middle">位置4：max(1+4, 5²+0)=25</text><text x="24" y="328" class="" text-anchor="start">实际第一步：选4，删除原4..8；得5²=25</text><rect x="142" y="355" width="78" height="48" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="181" y="387" class="" text-anchor="middle">1</text><text x="181" y="435" class="small" text-anchor="middle">原位置1</text><rect x="270" y="355" width="78" height="48" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="309" y="387" class="" text-anchor="middle">2</text><text x="309" y="435" class="small" text-anchor="middle">原位置2</text><rect x="398" y="355" width="78" height="48" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="437" y="387" class="" text-anchor="middle">3</text><text x="437" y="435" class="small" text-anchor="middle">原位置3</text><text x="24" y="486" class="" text-anchor="start">余下每值只剩一份，再分别删除，各得1</text><text x="24" y="532" class="" text-anchor="start">总分25+1+1+1=28；不是先删原位置1</text><text x="24" y="577" class="small" text-anchor="start">原位置1的一，副本在原位置5，必须先随大块消失</text></svg>