<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="575" viewBox="0 0 1040 575" role="img"><title>官方第二例的父亲允许区间与真实最优树</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="26" y="36" font-size="25" fill="#20334a" text-anchor="start">同一官方例：父亲位置的限制 ≠ 实际树的边</text><text x="26" y="76" font-size="19" fill="#20334a" text-anchor="start">位置 j</text><text x="26" y="111" font-size="19" fill="#20334a" text-anchor="start">顶点 P[j]</text><text x="26" y="146" font-size="19" fill="#20334a" text-anchor="start">系数 A[P[j]]</text><text x="170" y="76" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="170" y="111" font-size="22" fill="#20334a" text-anchor="middle">3</text><text x="170" y="146" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="254" y="76" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="254" y="111" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="254" y="146" font-size="20" fill="#20334a" text-anchor="middle">4</text><text x="338" y="76" font-size="20" fill="#20334a" text-anchor="middle">3</text><text x="338" y="111" font-size="22" fill="#20334a" text-anchor="middle">5</text><text x="338" y="146" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="422" y="76" font-size="20" fill="#20334a" text-anchor="middle">4</text><text x="422" y="111" font-size="22" fill="#20334a" text-anchor="middle">2</text><text x="422" y="146" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="506" y="76" font-size="20" fill="#20334a" text-anchor="middle">5</text><text x="506" y="111" font-size="22" fill="#20334a" text-anchor="middle">4</text><text x="506" y="146" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="28" y="206" font-size="19" fill="#20334a" text-anchor="start">I2 = [1,1]</text><rect x="140" y="181" width="60" height="36" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="170" y="206" font-size="18" fill="#2d6db4" text-anchor="middle">1</text><text x="28" y="263" font-size="19" fill="#20334a" text-anchor="start">I3 = [1,2]</text><rect x="140" y="238" width="144" height="36" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="170" y="263" font-size="18" fill="#2d6db4" text-anchor="middle">1</text><text x="254" y="263" font-size="18" fill="#2d6db4" text-anchor="middle">2</text><text x="28" y="320" font-size="19" fill="#20334a" text-anchor="start">I4 = [3,3]</text><rect x="308" y="295" width="60" height="36" rx="5" fill="#e5f7ef" stroke="#14876d" stroke-width="2"/><text x="338" y="320" font-size="18" fill="#14876d" text-anchor="middle">3</text><text x="28" y="377" font-size="19" fill="#20334a" text-anchor="start">I5 = [3,4]</text><rect x="308" y="352" width="144" height="36" rx="5" fill="#e5f7ef" stroke="#14876d" stroke-width="2"/><text x="338" y="377" font-size="18" fill="#14876d" text-anchor="middle">3</text><text x="422" y="377" font-size="18" fill="#14876d" text-anchor="middle">4</text><text x="28" y="453" font-size="20" fill="#20334a" text-anchor="start">包含关系：I₂ ⊂ I₃；I₄ ⊂ I₅</text><text x="28" y="486" font-size="18" fill="#20334a" text-anchor="start">两棵区间树，共管理父亲位置 1…4。</text><line x1="770" y1="132" x2="665" y2="203" stroke="#14876d" stroke-width="3"/><line x1="770" y1="132" x2="875" y2="203" stroke="#14876d" stroke-width="3"/><line x1="875" y1="247" x2="875" y2="318" stroke="#14876d" stroke-width="3"/><line x1="875" y1="362" x2="875" y2="428" stroke="#14876d" stroke-width="3"/><circle cx="770" cy="110" r="25" fill="#e5f7ef" stroke="#14876d" stroke-width="2"/><text x="770" y="118" font-size="23" fill="#20334a" text-anchor="middle">3</text><circle cx="665" cy="225" r="25" fill="#e5f7ef" stroke="#14876d" stroke-width="2"/><text x="665" y="233" font-size="23" fill="#20334a" text-anchor="middle">1</text><circle cx="875" cy="225" r="25" fill="#e5f7ef" stroke="#14876d" stroke-width="2"/><text x="875" y="233" font-size="23" fill="#20334a" text-anchor="middle">5</text><circle cx="875" cy="340" r="25" fill="#e5f7ef" stroke="#14876d" stroke-width="2"/><text x="875" y="348" font-size="23" fill="#20334a" text-anchor="middle">2</text><circle cx="875" cy="450" r="25" fill="#e5f7ef" stroke="#14876d" stroke-width="2"/><text x="875" y="458" font-size="23" fill="#20334a" text-anchor="middle">4</text><text x="636" y="68" font-size="22" fill="#20334a" text-anchor="start">真实树：根为顶点 3</text><text x="635" y="500" font-size="19" fill="#20334a" text-anchor="start">费用：1×2² + 1×1² + 1×1² = 6</text><text x="28" y="543" font-size="20" fill="#20334a" text-anchor="start">按孩子位置处理：1 给 3（+1）→ 5 给 3（+3）→ 2 给 5（+1）→ 4 给 2（+1）</text></g></svg>