<svg xmlns="http://www.w3.org/2000/svg" width="720" height="718" viewBox="0 0 720 718" role="img"><title>六个真实数位102203首尾13合四，中间0220合四，逐轮y10220取0到1022取2到102取2到10取0到1停止，每位身份明确</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="24" fill="#20334a" text-anchor="start">同一个数102203：首尾与中间分开</text><rect x="24" y="96" width="104" height="84" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="76" y="148" font-size="30" fill="#20334a" text-anchor="middle">1</text><text x="76" y="216" font-size="20" fill="#20334a" text-anchor="middle">首位</text><rect x="138" y="96" width="104" height="84" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="190" y="148" font-size="30" fill="#20334a" text-anchor="middle">0</text><text x="190" y="216" font-size="20" fill="#20334a" text-anchor="middle">中间</text><rect x="252" y="96" width="104" height="84" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="304" y="148" font-size="30" fill="#20334a" text-anchor="middle">2</text><text x="304" y="216" font-size="20" fill="#20334a" text-anchor="middle">中间</text><rect x="366" y="96" width="104" height="84" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="418" y="148" font-size="30" fill="#20334a" text-anchor="middle">2</text><text x="418" y="216" font-size="20" fill="#20334a" text-anchor="middle">中间</text><rect x="480" y="96" width="104" height="84" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="532" y="148" font-size="30" fill="#20334a" text-anchor="middle">0</text><text x="532" y="216" font-size="20" fill="#20334a" text-anchor="middle">中间</text><rect x="594" y="96" width="104" height="84" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="646" y="148" font-size="30" fill="#20334a" text-anchor="middle">3</text><text x="646" y="216" font-size="20" fill="#20334a" text-anchor="middle">末位</text><text x="22" y="277" font-size="23" fill="#20334a" text-anchor="start">红色：1+3=4；绿色：0+2+2+0=4</text><text x="22" y="333" font-size="22" fill="#20334a" text-anchor="start">last=3；中间副本y先是10220</text><text x="22" y="392" font-size="21" fill="#20334a" text-anchor="start">y=10220：取0，mid=0 → y=1022</text><text x="22" y="445" font-size="21" fill="#20334a" text-anchor="start">y=1022：取2，mid=2 → y=102</text><text x="22" y="498" font-size="21" fill="#20334a" text-anchor="start">y=102：取2，mid=4 → y=10</text><text x="22" y="551" font-size="21" fill="#20334a" text-anchor="start">y=10：取0，mid=4 → y=1</text><text x="22" y="604" font-size="21" fill="#20334a" text-anchor="start">y=1只剩首位，停止，不再计入mid。</text><text x="22" y="657" font-size="21" fill="#20334a" text-anchor="start">判定真时ans加1，计的是一个候选整数。</text></g></svg>