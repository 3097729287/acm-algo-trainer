<svg xmlns="http://www.w3.org/2000/svg" width="640" height="655" viewBox="0 0 640 655" role="img"><title>Expected Median：三乘二六组及全一一组的真实原下标</title><rect width="640" height="655" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">[1,0,1,1,0]，k=3：七组不同原下标</text><text x="122" y="82" class="small" text-anchor="middle">位置1</text><rect x="92" y="97" width="60" height="43" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="122" y="126" class="" text-anchor="middle">1</text><text x="216" y="82" class="small" text-anchor="middle">位置2</text><rect x="186" y="97" width="60" height="43" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="216" y="126" class="" text-anchor="middle">0</text><text x="310" y="82" class="small" text-anchor="middle">位置3</text><rect x="280" y="97" width="60" height="43" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="310" y="126" class="" text-anchor="middle">1</text><text x="404" y="82" class="small" text-anchor="middle">位置4</text><rect x="374" y="97" width="60" height="43" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="404" y="126" class="" text-anchor="middle">1</text><text x="498" y="82" class="small" text-anchor="middle">位置5</text><rect x="468" y="97" width="60" height="43" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="498" y="126" class="" text-anchor="middle">0</text><text x="24" y="185" class="small" text-anchor="start">选两个一的位置 ↓；选一个零的位置 →</text><text x="300" y="222" class="small" text-anchor="middle">零位置2</text><text x="500" y="222" class="small" text-anchor="middle">零位置5</text><text x="24" y="278" class="small" text-anchor="start">一位置(1, 3)</text><rect x="218" y="246" width="164" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="300" y="279" class="" text-anchor="middle">{1,2,3}</text><rect x="418" y="246" width="164" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="500" y="279" class="" text-anchor="middle">{1,3,5}</text><text x="24" y="358" class="small" text-anchor="start">一位置(1, 4)</text><rect x="218" y="326" width="164" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="300" y="359" class="" text-anchor="middle">{1,2,4}</text><rect x="418" y="326" width="164" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="500" y="359" class="" text-anchor="middle">{1,4,5}</text><text x="24" y="438" class="small" text-anchor="start">一位置(3, 4)</text><rect x="218" y="406" width="164" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="300" y="439" class="" text-anchor="middle">{2,3,4}</text><rect x="418" y="406" width="164" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="500" y="439" class="" text-anchor="middle">{3,4,5}</text><text x="24" y="535" class="" text-anchor="start">另选三个一：{1,3,4}，贡献1</text><text x="24" y="580" class="" text-anchor="start">每组中位数都是1：C(3,2)×C(2,1)+1 = 6+1 = 7</text><text x="24" y="625" class="small" text-anchor="start">{1,2,3}与{1,2,4}值同为[1,0,1]，位置不同各算一次</text></svg>