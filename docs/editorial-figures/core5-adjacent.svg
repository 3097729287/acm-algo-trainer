<svg xmlns="http://www.w3.org/2000/svg" width="650" height="420" viewBox="0 0 650 420" role="img"><title>三个真实二乘二方格，A和D分别竖直、水平或对角相邻，前两个坐标差之和一，第三个二</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="34" font-size="22" fill="#20334a" text-anchor="start">A 与 D：同列 / 同行共边，对角不共边</text><rect x="30" y="89" width="60" height="60" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="60" y="129" font-size="30" fill="#20334a" text-anchor="middle">A</text><rect x="97" y="89" width="60" height="60" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="127" y="129" font-size="30" fill="#20334a" text-anchor="middle">B</text><rect x="30" y="156" width="60" height="60" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="60" y="196" font-size="30" fill="#20334a" text-anchor="middle">D</text><rect x="97" y="156" width="60" height="60" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="127" y="196" font-size="30" fill="#20334a" text-anchor="middle">C</text><text x="30" y="253" font-size="17" fill="#087b48" text-anchor="start">Yes：行差1、列差0</text><text x="30" y="289" font-size="20" fill="#20334a" text-anchor="start">差之和 = 1</text><rect x="234" y="89" width="60" height="60" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="264" y="129" font-size="30" fill="#20334a" text-anchor="middle">A</text><rect x="301" y="89" width="60" height="60" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="331" y="129" font-size="30" fill="#20334a" text-anchor="middle">D</text><rect x="234" y="156" width="60" height="60" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="264" y="196" font-size="30" fill="#20334a" text-anchor="middle">B</text><rect x="301" y="156" width="60" height="60" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="331" y="196" font-size="30" fill="#20334a" text-anchor="middle">C</text><text x="234" y="253" font-size="17" fill="#087b48" text-anchor="start">Yes：行差0、列差1</text><text x="234" y="289" font-size="20" fill="#20334a" text-anchor="start">差之和 = 1</text><rect x="438" y="89" width="60" height="60" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="468" y="129" font-size="30" fill="#20334a" text-anchor="middle">A</text><rect x="505" y="89" width="60" height="60" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="535" y="129" font-size="30" fill="#20334a" text-anchor="middle">B</text><rect x="438" y="156" width="60" height="60" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="468" y="196" font-size="30" fill="#20334a" text-anchor="middle">C</text><rect x="505" y="156" width="60" height="60" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="535" y="196" font-size="30" fill="#20334a" text-anchor="middle">D</text><text x="438" y="253" font-size="17" fill="#a32e36" text-anchor="start">No：行差1、列差1</text><text x="438" y="289" font-size="20" fill="#20334a" text-anchor="start">差之和 = 2</text><text x="24" y="347" font-size="21" fill="#20334a" text-anchor="start">坐标差都是非负整数：和一只有 (1,0) 或 (0,1)。</text><text x="24" y="386" font-size="21" fill="#20334a" text-anchor="start">第三幅图 A 与 D 只碰一个角，不能判为相邻。</text></g></svg>