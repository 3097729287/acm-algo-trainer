<svg xmlns="http://www.w3.org/2000/svg" width="720" height="745" viewBox="0 0 720 745" role="img"><title>真实三栋楼归并的五个盈利块与目标楼自身块上界，完整资本轨迹二到三到五到七、目标亏损到五再盈利到九、帮手到十二后目标建第三层，展示资金和位置双条件</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">固定归并序列T；楼1自己的块只跳过，不能在帮手阶段领钱</text><rect x="22" y="80" width="128" height="140" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="86" y="108" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="86" y="139" font-size="21" fill="#20334a" text-anchor="middle">楼3块1</text><text x="86" y="170" font-size="21" fill="#20334a" text-anchor="middle">r=2</text><text x="86" y="201" font-size="21" fill="#20334a" text-anchor="middle">g=+1</text><rect x="161" y="80" width="128" height="140" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="225" y="108" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="225" y="139" font-size="21" fill="#20334a" text-anchor="middle">楼2块1</text><text x="225" y="170" font-size="21" fill="#20334a" text-anchor="middle">r=3</text><text x="225" y="201" font-size="21" fill="#20334a" text-anchor="middle">g=+2</text><rect x="300" y="80" width="128" height="140" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="364" y="108" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="364" y="139" font-size="21" fill="#20334a" text-anchor="middle">楼3块2</text><text x="364" y="170" font-size="21" fill="#20334a" text-anchor="middle">r=5</text><text x="364" y="201" font-size="21" fill="#20334a" text-anchor="middle">g=+2</text><rect x="439" y="80" width="128" height="140" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="503" y="108" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="503" y="139" font-size="21" fill="#20334a" text-anchor="middle">楼1块1</text><text x="503" y="170" font-size="21" fill="#20334a" text-anchor="middle">r=7</text><text x="503" y="201" font-size="21" fill="#20334a" text-anchor="middle">g=+2</text><rect x="578" y="80" width="128" height="140" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="642" y="108" font-size="21" fill="#20334a" text-anchor="middle">5</text><text x="642" y="139" font-size="21" fill="#20334a" text-anchor="middle">楼2块2</text><text x="642" y="170" font-size="21" fill="#20334a" text-anchor="middle">r=8</text><text x="642" y="201" font-size="21" fill="#20334a" text-anchor="middle">g=+3</text><text x="22" y="267" font-size="23" fill="#20334a" text-anchor="start">目标楼1的下一自身块在位置4，因此cap=3</text><text x="22" y="311" font-size="21" fill="#20334a" text-anchor="start">允许跳前两块：req=max(2,3−1)=2，gain=1+2=3</text><text x="22" y="355" font-size="20" fill="#20334a" text-anchor="start">四块合并虽也只需2元，但会跨过自身块，nj=4&gt;cap，必须拒绝</text><rect x="22" y="389" width="676" height="50" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="37" y="422" font-size="20" fill="#20334a" text-anchor="start">帮手前三块</text><text x="226" y="422" font-size="21" fill="#20334a" text-anchor="start">2→3→5→7</text><text x="683" y="422" font-size="19" fill="#20334a" text-anchor="end">位置5需8，暂时买不起</text><rect x="22" y="447" width="676" height="50" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="37" y="480" font-size="20" fill="#20334a" text-anchor="start">目标第1层</text><text x="226" y="480" font-size="21" fill="#20334a" text-anchor="start">7−4+2=5</text><text x="683" y="480" font-size="19" fill="#20334a" text-anchor="end">楼2第二块仍买不起</text><rect x="22" y="505" width="676" height="50" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="37" y="538" font-size="20" fill="#20334a" text-anchor="start">目标第2层</text><text x="226" y="538" font-size="21" fill="#20334a" text-anchor="start">5−5+9=9</text><text x="683" y="538" font-size="19" fill="#20334a" text-anchor="end">重新尝试帮手</text><rect x="22" y="563" width="676" height="50" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="37" y="596" font-size="20" fill="#20334a" text-anchor="start">帮手位置5</text><text x="226" y="596" font-size="21" fill="#20334a" text-anchor="start">9−8+11=12</text><text x="683" y="596" font-size="19" fill="#20334a" text-anchor="end">自己的位置4没有加钱</text><rect x="22" y="621" width="676" height="50" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="37" y="654" font-size="20" fill="#20334a" text-anchor="start">目标第3层</text><text x="226" y="654" font-size="21" fill="#20334a" text-anchor="start">12−12+0=0</text><text x="683" y="654" font-size="19" fill="#20334a" text-anchor="end">高度3，完整合法序列</text><text x="22" y="718" font-size="21" fill="#20334a" text-anchor="start">各楼合同顺序始终不变；“跳过摘要”不等于已经建成目标楼层</text></g></svg>