<svg xmlns="http://www.w3.org/2000/svg" width="720" height="724" viewBox="0 0 720 724" role="img"><title>真实二乘五网格缩成负三的上行段U、正二的下行段V和孤立正一段P，选择删除UV对应容量二的割，实际保留P得一分</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">合法网格 H=2、W=5：每个字母代表一整行段</text><rect x="35" y="80" width="62" height="60" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="66" y="121" font-size="28" fill="#20334a" text-anchor="middle">-</text><rect x="107" y="80" width="62" height="60" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="138" y="121" font-size="28" fill="#20334a" text-anchor="middle">-</text><rect x="179" y="80" width="62" height="60" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="210" y="121" font-size="28" fill="#20334a" text-anchor="middle">-</text><rect x="251" y="80" width="62" height="60" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="282" y="121" font-size="28" fill="#20334a" text-anchor="middle">#</text><rect x="323" y="80" width="62" height="60" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="354" y="121" font-size="28" fill="#20334a" text-anchor="middle">+</text><rect x="35" y="150" width="62" height="60" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="66" y="191" font-size="28" fill="#20334a" text-anchor="middle">+</text><rect x="107" y="150" width="62" height="60" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="138" y="191" font-size="28" fill="#20334a" text-anchor="middle">+</text><rect x="179" y="150" width="62" height="60" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="210" y="191" font-size="28" fill="#20334a" text-anchor="middle">#</text><rect x="251" y="150" width="62" height="60" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="282" y="191" font-size="28" fill="#20334a" text-anchor="middle">#</text><rect x="323" y="150" width="62" height="60" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="354" y="191" font-size="28" fill="#20334a" text-anchor="middle">#</text><text x="437" y="106" font-size="21" fill="#20334a" text-anchor="start">U：第一行1..3，−3</text><text x="437" y="153" font-size="21" fill="#20334a" text-anchor="start">P：第一行5，+1</text><text x="437" y="200" font-size="21" fill="#20334a" text-anchor="start">V：第二行1..2，+2</text><text x="22" y="256" font-size="23" fill="#20334a" text-anchor="start">U→V：删U会向下删V；P没有向下的通路</text><rect x="93" y="289" width="340" height="275" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="113" y="324" font-size="20" fill="#087b48" text-anchor="start">源点一侧：删除集 {U,V}</text><path d="M159.21348165713974,392.7784804075405 L252.84943981028908,368.71924115985627" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="252.84943981028908,368.71924115985627 244.4083510659251,376.050545328268 241.9197432289413,366.36515266541215" fill="#2d6db4"/><text x="201" y="356" font-size="21" fill="#2d6db4" text-anchor="middle">3</text><path d="M279.0,387.0 L279.0,470.0" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="279.0,470.0 274.0,460.0 284.0,460.0" fill="#2d6db4"/><text x="325" y="432" font-size="21" fill="#2d6db4" text-anchor="middle">INF</text><path d="M304.0,497.0 L567.0,497.0" fill="none" stroke="#a32e36" stroke-width="3"/><polygon points="567.0,497.0 557.0,502.0 557.0,492.0" fill="#a32e36"/><text x="441" y="481" font-size="21" fill="#a32e36" text-anchor="middle">2（割边）</text><path d="M537.2464465237599,384.3275041280527 L581.8538377543393,472.88629554170313" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="581.8538377543393,472.88629554170313 572.8897583192248,466.204583195234 581.8207599704459,461.70600458573006" fill="#2d6db4"/><text x="593" y="417" font-size="21" fill="#2d6db4" text-anchor="middle">1</text><circle cx="135" cy="399" r="25" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="135" y="407" font-size="23" fill="#20334a" text-anchor="middle">s</text><circle cx="279" cy="362" r="25" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="279" y="370" font-size="23" fill="#20334a" text-anchor="middle">U</text><circle cx="279" cy="497" r="25" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="279" y="505" font-size="23" fill="#20334a" text-anchor="middle">V</text><circle cx="526" cy="362" r="25" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="526" y="370" font-size="23" fill="#20334a" text-anchor="middle">P</text><circle cx="594" cy="497" r="25" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="594" y="505" font-size="23" fill="#20334a" text-anchor="middle">t</text><text x="22" y="610" font-size="23" fill="#20334a" text-anchor="start">原分数T=0，负权绝对值B=3；最小割C=2</text><text x="22" y="654" font-size="22" fill="#20334a" text-anchor="start">删除权值C−B=−1，剩下P得1分；一次选U即可实际完成</text><text x="22" y="698" font-size="22" fill="#20334a" text-anchor="start">只删U不删V会切INF边；空删除集的割代价为3</text></g></svg>