<svg xmlns="http://www.w3.org/2000/svg" width="760" height="853" viewBox="0 0 760 853" role="img"><title>九个实际字符X点X点XXX点X逐位标号，宽状态一零二零三一四零五与窄状态零零零零零四五零零，五到六首次窄接七继续，八缺失使九不可窄接</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#153655" font-size="24" text-anchor="start">s=X.X.XXX.X，固定x=1，窄间隔必须用</text><text x="117" y="91" fill="#153655" font-size="19" text-anchor="middle">1</text><rect x="91" y="112" width="53" height="58" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="117" y="152" fill="#153655" font-size="25" text-anchor="middle">X</text><text x="190" y="91" fill="#153655" font-size="19" text-anchor="middle">2</text><rect x="164" y="112" width="53" height="58" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="190" y="152" fill="#153655" font-size="25" text-anchor="middle">.</text><text x="263" y="91" fill="#153655" font-size="19" text-anchor="middle">3</text><rect x="237" y="112" width="53" height="58" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="263" y="152" fill="#153655" font-size="25" text-anchor="middle">X</text><text x="336" y="91" fill="#153655" font-size="19" text-anchor="middle">4</text><rect x="310" y="112" width="53" height="58" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="336" y="152" fill="#153655" font-size="25" text-anchor="middle">.</text><text x="409" y="91" fill="#153655" font-size="19" text-anchor="middle">5</text><rect x="383" y="112" width="53" height="58" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="409" y="152" fill="#153655" font-size="25" text-anchor="middle">X</text><text x="482" y="91" fill="#153655" font-size="19" text-anchor="middle">6</text><rect x="456" y="112" width="53" height="58" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="482" y="152" fill="#153655" font-size="25" text-anchor="middle">X</text><text x="555" y="91" fill="#153655" font-size="19" text-anchor="middle">7</text><rect x="529" y="112" width="53" height="58" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="555" y="152" fill="#153655" font-size="25" text-anchor="middle">X</text><text x="628" y="91" fill="#153655" font-size="19" text-anchor="middle">8</text><rect x="602" y="112" width="53" height="58" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="628" y="152" fill="#153655" font-size="25" text-anchor="middle">.</text><text x="701" y="91" fill="#153655" font-size="19" text-anchor="middle">9</text><rect x="675" y="112" width="53" height="58" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="701" y="152" fill="#153655" font-size="25" text-anchor="middle">X</text><text x="24" y="227" fill="#153655" font-size="23" text-anchor="start">宽链：1 → 3 → 5，e2[5]=3。</text><text x="24" y="285" fill="#153655" font-size="23" text-anchor="start">首次窄接：5 → 6，ex[6]=3+1=4。</text><text x="24" y="343" fill="#153655" font-size="23" text-anchor="start">继续窄接：6 → 7，ex[7]=4+1=5。</text><text x="24" y="411" fill="#153655" font-size="21" text-anchor="start">同一结尾位置可以同时保留两类不同候选：</text><text x="24" y="499" fill="#153655" font-size="22" text-anchor="start">e2</text><rect x="91" y="462" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="117" y="500" fill="#153655" font-size="24" text-anchor="middle">1</text><rect x="164" y="462" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="190" y="500" fill="#153655" font-size="24" text-anchor="middle">0</text><rect x="237" y="462" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="263" y="500" fill="#153655" font-size="24" text-anchor="middle">2</text><rect x="310" y="462" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="336" y="500" fill="#153655" font-size="24" text-anchor="middle">0</text><rect x="383" y="462" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="409" y="500" fill="#153655" font-size="24" text-anchor="middle">3</text><rect x="456" y="462" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="482" y="500" fill="#153655" font-size="24" text-anchor="middle">1</text><rect x="529" y="462" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="555" y="500" fill="#153655" font-size="24" text-anchor="middle">4</text><rect x="602" y="462" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="628" y="500" fill="#153655" font-size="24" text-anchor="middle">0</text><rect x="675" y="462" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="701" y="500" fill="#153655" font-size="24" text-anchor="middle">5</text><text x="24" y="595" fill="#153655" font-size="22" text-anchor="start">ex</text><rect x="91" y="558" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="117" y="596" fill="#153655" font-size="24" text-anchor="middle">0</text><rect x="164" y="558" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="190" y="596" fill="#153655" font-size="24" text-anchor="middle">0</text><rect x="237" y="558" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="263" y="596" fill="#153655" font-size="24" text-anchor="middle">0</text><rect x="310" y="558" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="336" y="596" fill="#153655" font-size="24" text-anchor="middle">0</text><rect x="383" y="558" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="409" y="596" fill="#153655" font-size="24" text-anchor="middle">0</text><rect x="456" y="558" width="53" height="58" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="482" y="596" fill="#153655" font-size="24" text-anchor="middle">4</text><rect x="529" y="558" width="53" height="58" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="555" y="596" fill="#153655" font-size="24" text-anchor="middle">5</text><rect x="602" y="558" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="628" y="596" fill="#153655" font-size="24" text-anchor="middle">0</text><rect x="675" y="558" width="53" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="701" y="596" fill="#153655" font-size="24" text-anchor="middle">0</text><text x="24" y="693" fill="#153655" font-size="22" text-anchor="start">9号虽是X，8号是点：ex[9]=0，不能跳过。</text><text x="24" y="750" fill="#153655" font-size="21" text-anchor="start">宽链到9号长5，也不能当作已有窄间隔的状态。</text><text x="24" y="807" fill="#153655" font-size="22" text-anchor="start">一组最优好链1/3/5/6/7：间隔2/2/1/1。</text></svg>