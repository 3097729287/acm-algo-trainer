<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img"><title>六城真实树的直径四三二五六，固定两遍扫描顺序，第一遍八问得到E三与端点四，第二遍复用下界三用六问得到端点六与D四，旧见证一点在纪录更新后仍被问，成功四失败十合十四</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">固定一种合法扫描顺序：两遍合计14问，不依赖随机好运</text><path d="M91 133 L235 133" stroke="#64748b" stroke-width="3" fill="none"/><path d="M235 133 L378 133" stroke="#64748b" stroke-width="3" fill="none"/><path d="M378 133 L522 133" stroke="#64748b" stroke-width="3" fill="none"/><path d="M235 133 L235 247" stroke="#64748b" stroke-width="3" fill="none"/><path d="M235 247 L378 247" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="91" cy="133" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="91" y="140" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="235" cy="133" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="235" y="140" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="378" cy="133" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="378" y="140" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="522" cy="133" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="522" y="140" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="235" cy="247" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="235" y="254" font-size="21" fill="#20334a" text-anchor="middle">5</text><circle cx="378" cy="247" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="378" y="254" font-size="21" fill="#20334a" text-anchor="middle">6</text><text x="22" y="310" font-size="20" fill="#20334a" text-anchor="start">直径是4—3—2—5—6，边数4；下表“+”答是，“−”答否</text><text x="22" y="361" font-size="21" fill="#20334a" text-anchor="start">第一遍r=1，从L=0开始；顺序2,3,4,5,6,1</text><rect x="22" y="390" width="676" height="46" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="421" font-size="20" fill="#20334a" text-anchor="start">查点2</text><text x="214" y="421" font-size="20" fill="#20334a" text-anchor="start">阈值1+，2−</text><text x="680" y="421" font-size="20" fill="#20334a" text-anchor="end">L=1，见证2</text><rect x="22" y="445" width="676" height="46" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="476" font-size="20" fill="#20334a" text-anchor="start">查点3</text><text x="214" y="476" font-size="20" fill="#20334a" text-anchor="start">阈值2+，3−</text><text x="680" y="476" font-size="20" fill="#20334a" text-anchor="end">L=2，见证3</text><rect x="22" y="500" width="676" height="46" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="531" font-size="20" fill="#20334a" text-anchor="start">查点4</text><text x="214" y="531" font-size="20" fill="#20334a" text-anchor="start">阈值3+，4−</text><text x="680" y="531" font-size="20" fill="#20334a" text-anchor="end">L=3，见证4</text><rect x="22" y="555" width="676" height="46" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="36" y="586" font-size="20" fill="#20334a" text-anchor="start">查点5、6</text><text x="214" y="586" font-size="20" fill="#20334a" text-anchor="start">各问阈值4−</text><text x="680" y="586" font-size="20" fill="#20334a" text-anchor="end">L仍为3，E=3</text><text x="22" y="659" font-size="20" fill="#20334a" text-anchor="start">第二遍r=4，先知dist(4,1)=3；顺序6,1,2,3,4,5</text><text x="22" y="706" font-size="20" fill="#20334a" text-anchor="start">查6：阈值4+、5−，L=4，见证6；旧见证1随后问5−</text><text x="22" y="753" font-size="21" fill="#20334a" text-anchor="start">查2、3、5各问5−，跳过起点4；本遍共6问</text><text x="22" y="800" font-size="21" fill="#20334a" text-anchor="start">成功3+1=4=D，失败5+5=10；8+6=14&lt;3n=18</text></g></svg>