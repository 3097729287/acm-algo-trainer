<svg xmlns="http://www.w3.org/2000/svg" width="620" height="618" viewBox="0 0 620 618" role="img"><title>猜值、算前缀、反查位置、核实真实值、计入一个区间的五步</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="40" font-size="24" fill="#20334a" text-anchor="start">固定 r=3：一次成功的查找</text><rect x="26" y="66" width="568" height="86" rx="8" fill="#f0f6ff" stroke="#2d6db4" stroke-width="2"/><text x="44" y="98" font-size="21" fill="#20334a" text-anchor="start">① 猜左端点的值 v=1</text><text x="44" y="131" font-size="18" fill="#20334a" text-anchor="start">此时右端点 a₃=2，S₂=3</text><rect x="26" y="174" width="568" height="86" rx="8" fill="#f0f6ff" stroke="#2d6db4" stroke-width="2"/><text x="44" y="206" font-size="21" fill="#20334a" text-anchor="start">② 算 wanted = 3 − 1×2 = 1</text><text x="44" y="239" font-size="18" fill="#20334a" text-anchor="start">它是要求的前缀和值，不是元素值</text><rect x="26" y="282" width="568" height="86" rx="8" fill="#f0f6ff" stroke="#2d6db4" stroke-width="2"/><text x="44" y="314" font-size="21" fill="#20334a" text-anchor="start">③ 查 pos[1] = 1，得到 l=1</text><text x="44" y="347" font-size="18" fill="#20334a" text-anchor="start">真实位置存在，区间 [1,3] 长度为三</text><rect x="26" y="390" width="568" height="86" rx="8" fill="#f0f6ff" stroke="#2d6db4" stroke-width="2"/><text x="44" y="422" font-size="21" fill="#20334a" text-anchor="start">④ 验证 a₁=1，等于猜测 v</text><text x="44" y="455" font-size="18" fill="#20334a" text-anchor="start">首尾 1×2 = 内部 3−1 = 2</text><rect x="26" y="498" width="568" height="86" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="44" y="530" font-size="21" fill="#20334a" text-anchor="start">⑤ 计入区间 [1,3]</text><text x="44" y="563" font-size="18" fill="#20334a" text-anchor="start">ans：0 → 1</text></g></svg>