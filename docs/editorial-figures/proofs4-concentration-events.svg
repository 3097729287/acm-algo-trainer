<svg xmlns="http://www.w3.org/2000/svg" width="720" height="691" viewBox="0 0 720 691" role="img"><title>合法三对牌中一个已知单张和两对未知牌，先翻新五之后第二张的三类具体身份、条件概率和状态变化</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">剩余信息：(k,z,ℓ)=(1,2,2)；尚余分值 2、5、9</text><text x="22" y="73" font-size="22" fill="#20334a" text-anchor="start">已知单张：2；未知位置的五张牌是 2、5、5、9、9</text><rect x="65" y="95" width="77" height="65" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="103" y="138" font-size="28" fill="#20334a" text-anchor="middle">2</text><rect x="164" y="95" width="77" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="202" y="138" font-size="28" fill="#20334a" text-anchor="middle">?</text><rect x="263" y="95" width="77" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="301" y="138" font-size="28" fill="#20334a" text-anchor="middle">?</text><rect x="362" y="95" width="77" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="400" y="138" font-size="28" fill="#20334a" text-anchor="middle">?</text><rect x="461" y="95" width="77" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="499" y="138" font-size="28" fill="#20334a" text-anchor="middle">?</text><rect x="560" y="95" width="77" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="598" y="138" font-size="28" fill="#20334a" text-anchor="middle">?</text><text x="22" y="195" font-size="22" fill="#20334a" text-anchor="start">第一张若是2：概率1/5，拿旧配对 → (0,2,2)</text><text x="22" y="235" font-size="22" fill="#20334a" text-anchor="start">第一张若是5或9：概率4/5；以下以先翻到5为例</text><rect x="22" y="257" width="676" height="95" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="39" y="288" font-size="22" fill="#20334a" text-anchor="start">第二张是5：条件概率1/4</text><text x="39" y="323" font-size="21" fill="#20334a" text-anchor="start">拿新配对</text><text x="675" y="323" font-size="22" fill="#20334a" text-anchor="end">(1,1,2)</text><rect x="22" y="368" width="676" height="95" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="39" y="399" font-size="22" fill="#20334a" text-anchor="start">第二张是2：条件概率1/4</text><text x="39" y="434" font-size="21" fill="#20334a" text-anchor="start">掉命后收走旧2，留下单张5</text><text x="675" y="434" font-size="22" fill="#20334a" text-anchor="end">(1,1,1)</text><rect x="22" y="479" width="676" height="95" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="39" y="510" font-size="22" fill="#20334a" text-anchor="start">第二张是9：条件概率2/4</text><text x="39" y="545" font-size="21" fill="#20334a" text-anchor="start">掉命，5与9各留一张已知牌</text><text x="675" y="545" font-size="22" fill="#20334a" text-anchor="end">(3,0,1)</text><text x="22" y="623" font-size="22" fill="#20334a" text-anchor="start">三行概率1/4+1/4+2/4=1；全按剩余四张未知牌计数</text><text x="22" y="665" font-size="21" fill="#20334a" text-anchor="start">若原本只剩一条命，后两行立刻结束，连已知配对也不能拿</text></g></svg>