<svg xmlns="http://www.w3.org/2000/svg" width="760" height="797" viewBox="0 0 760 797" role="img"><title>正式样例a二b一c负一，左和三，右b正一减c各贡献正一，累计一二三，符号和变量负数分开相乘；另示三零七逐位构造</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#153655" font-size="24" text-anchor="start">a=2，b=1，c=−1；检查a+b=b−c−c</text><text x="24" y="99" fill="#153655" font-size="23" text-anchor="start">左边：+a贡献2，+b贡献1，总数3。</text><rect x="25" y="150" width="128" height="55" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="89.0" y="186" fill="#153655" font-size="20" text-anchor="middle">右侧项</text><rect x="158" y="150" width="140" height="55" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="228.0" y="186" fill="#153655" font-size="20" text-anchor="middle">项前符号</text><rect x="303" y="150" width="123" height="55" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="364.5" y="186" fill="#153655" font-size="20" text-anchor="middle">变量值</text><rect x="431" y="150" width="152" height="55" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="507.0" y="186" fill="#153655" font-size="20" text-anchor="middle">实际贡献</text><rect x="588" y="150" width="113" height="55" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="644.5" y="186" fill="#153655" font-size="20" text-anchor="middle">累计</text><rect x="25" y="231" width="128" height="62" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="89.0" y="271" fill="#153655" font-size="23" text-anchor="middle">b</text><rect x="158" y="231" width="140" height="62" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="228.0" y="271" fill="#153655" font-size="23" text-anchor="middle">+1</text><rect x="303" y="231" width="123" height="62" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="364.5" y="271" fill="#153655" font-size="23" text-anchor="middle">+1</text><rect x="431" y="231" width="152" height="62" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="507.0" y="271" fill="#153655" font-size="17" text-anchor="middle">(+1)×1=1</text><rect x="588" y="231" width="113" height="62" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="644.5" y="271" fill="#153655" font-size="23" text-anchor="middle">1</text><rect x="25" y="318" width="128" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="89.0" y="358" fill="#153655" font-size="23" text-anchor="middle">−c</text><rect x="158" y="318" width="140" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="228.0" y="358" fill="#153655" font-size="23" text-anchor="middle">−1</text><rect x="303" y="318" width="123" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="364.5" y="358" fill="#153655" font-size="23" text-anchor="middle">−1</text><rect x="431" y="318" width="152" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="507.0" y="358" fill="#153655" font-size="17" text-anchor="middle">(−1)×(−1)=1</text><rect x="588" y="318" width="113" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="644.5" y="358" fill="#153655" font-size="23" text-anchor="middle">2</text><rect x="25" y="405" width="128" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="89.0" y="445" fill="#153655" font-size="23" text-anchor="middle">−c</text><rect x="158" y="405" width="140" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="228.0" y="445" fill="#153655" font-size="23" text-anchor="middle">−1</text><rect x="303" y="405" width="123" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="364.5" y="445" fill="#153655" font-size="23" text-anchor="middle">−1</text><rect x="431" y="405" width="152" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="507.0" y="445" fill="#153655" font-size="17" text-anchor="middle">(−1)×(−1)=1</text><rect x="588" y="405" width="113" height="62" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="644.5" y="445" fill="#153655" font-size="23" text-anchor="middle">3</text><text x="24" y="558" fill="#153655" font-size="22" text-anchor="start">符号来自表达式，变量负号来自赋值；二者相乘。</text><text x="24" y="617" fill="#153655" font-size="23" text-anchor="start">总和相等：左3、右3，所以输出Yes。</text><text x="24" y="689" fill="#153655" font-size="22" text-anchor="start">数字不是逐位相加：307由0 → 3 → 30 → 307。</text><text x="24" y="751" fill="#153655" font-size="22" text-anchor="start">c=-1：等号下标1，substr(2)仍保留−号。</text></svg>