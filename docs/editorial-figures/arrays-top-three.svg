<svg xmlns="http://www.w3.org/2000/svg" width="865" height="590" viewBox="0 0 865 590" role="img"><title>前三名原地更新的旧值读取与写回</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="24" y="36" font-size="25" fill="#20334a" text-anchor="start">旧前三名 [9,6,3]，新读入 x=10</text><text x="232" y="76" font-size="19" fill="#20334a" text-anchor="middle">top[0]</text><text x="317" y="76" font-size="19" fill="#20334a" text-anchor="middle">top[1]</text><text x="402" y="76" font-size="19" fill="#20334a" text-anchor="middle">top[2]</text><text x="20" y="123" font-size="18" fill="#20334a" text-anchor="start">写入前</text><rect x="198" y="92" width="68" height="48" rx="6" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="232" y="124" font-size="26" fill="#20334a" text-anchor="middle">9</text><rect x="283" y="92" width="68" height="48" rx="6" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="317" y="124" font-size="26" fill="#20334a" text-anchor="middle">6</text><rect x="368" y="92" width="68" height="48" rx="6" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="402" y="124" font-size="26" fill="#20334a" text-anchor="middle">3</text><text x="472" y="123" font-size="18" fill="#20334a" text-anchor="start">旧第一名 9，旧第二名 6，旧第三名 3</text><text x="20" y="206" font-size="18" fill="#20334a" text-anchor="start">top[2] = top[1]</text><rect x="198" y="175" width="68" height="48" rx="6" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="232" y="207" font-size="26" fill="#20334a" text-anchor="middle">9</text><rect x="283" y="175" width="68" height="48" rx="6" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="317" y="207" font-size="26" fill="#20334a" text-anchor="middle">6</text><rect x="368" y="175" width="68" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="402" y="207" font-size="26" fill="#20334a" text-anchor="middle">6</text><text x="472" y="206" font-size="18" fill="#20334a" text-anchor="start">读取第二格旧值 6 → 写第三格为 6</text><text x="20" y="289" font-size="18" fill="#20334a" text-anchor="start">top[1] = top[0]</text><rect x="198" y="258" width="68" height="48" rx="6" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="232" y="290" font-size="26" fill="#20334a" text-anchor="middle">9</text><rect x="283" y="258" width="68" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="317" y="290" font-size="26" fill="#20334a" text-anchor="middle">9</text><rect x="368" y="258" width="68" height="48" rx="6" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="402" y="290" font-size="26" fill="#20334a" text-anchor="middle">6</text><text x="472" y="289" font-size="18" fill="#20334a" text-anchor="start">读取第一格旧值 9 → 写第二格为 9</text><text x="20" y="372" font-size="18" fill="#20334a" text-anchor="start">top[0] = x</text><rect x="198" y="341" width="68" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="232" y="373" font-size="26" fill="#20334a" text-anchor="middle">10</text><rect x="283" y="341" width="68" height="48" rx="6" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="317" y="373" font-size="26" fill="#20334a" text-anchor="middle">9</text><rect x="368" y="341" width="68" height="48" rx="6" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="402" y="373" font-size="26" fill="#20334a" text-anchor="middle">6</text><text x="472" y="372" font-size="18" fill="#20334a" text-anchor="start">读取新数 x=10 → 写第一格为 10</text><text x="24" y="463" font-size="20" fill="#20334a" text-anchor="start">绿框：本步写入位置；每行都是这次赋值后的完整数组。</text><rect x="24" y="485" width="816" height="78" rx="6" fill="#fff7ed" stroke="#a26509" stroke-width="2"/><text x="40" y="515" font-size="20" fill="#20334a" text-anchor="start">如果先改第二格：旧 6 被 9 覆盖，第三格随后会错读成 9。</text><text x="40" y="546" font-size="20" fill="#20334a" text-anchor="start">正确结果保留 10、9、6；中间数组不能提前当答案输出。</text></g></svg>