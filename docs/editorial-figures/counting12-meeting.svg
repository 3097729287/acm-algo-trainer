aa"/><text x="321.5" y="486.5" class="" text-anchor="middle">1</text><text x="321" y="517" class="small" text-anchor="middle">3</text><rect x="389" y="462" width="51" height="35" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="414.5" y="486.5" class="" text-anchor="middle">0</text><text x="414" y="517" class="small" text-anchor="middle">4</text><rect x="482" y="462" width="51" height="35" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="507.5" y="486.5" class="" text-anchor="middle">0</text><text x="507" y="517" class="small" text-anchor="middle">5</text><line x1="270" y1="454" x2="270" y2="502" stroke="#bd5864" stroke-width="3" stroke-dasharray=""/><text x="24" y="566" class="" text-anchor="start">原a=2 / b=2；新j=3；a−b=j−q=0</text><text x="24" y="615" class="" text-anchor="start">真实大小j的加权轴：中心从3移到4</text><rect x="56" y="654" width="48" height="34" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="80.0" y="678.0" class="" text-anchor="middle">0</text><text x="80" y="721" class="small" text-anchor="middle">权1</text><rect x="149" y="654" width="48" height="34" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="173.0" y="678.0" class="" text-anchor="middle">1</text><text x="173" y="721" class="small" text-anchor="middle">权5</text><rect x="242" y="654" width="48" height="34" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="266.0" y="678.0" class="" text-anchor="middle">2</text><text x="266" y="721" class="small" text-anchor="middle">权10</text><rect x="335" y="654" width="48" height="34" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="359.0" y="678.0" class="" text-anchor="middle">3</text><text x="359" y="721" class="small" text-anchor="middle">权10</text><rect x="428" y="654" width="48" height="34" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="452.0" y="678.0" class="" text-anchor="middle">4</text><text x="452" y="721" class="small" text-anchor="middle">权5</text><rect x="521" y="654" width="48" height="34" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="545.0" y="678.0" 