<svg xmlns="http://www.w3.org/2000/svg" width="620" height="676" viewBox="0 0 620 676" role="img"><title>五点样例的竖边AB与CDE形成三个三角形，E及其另一行两个邻点AC再形成第四个</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="21" fill="#20334a" text-anchor="start">五点样例：竖边固定后三选一，再补一个孤点直角</text><text x="24" y="75" font-size="21" fill="#20334a" text-anchor="start">第一类：固定竖边 AB，第三点可选 C、D、E</text><path d="M92 122 L92 228 L320 228 Z" fill="#dbeafe" stroke="#2d6db4" stroke-width="3"/><path d="M92 213 L107 213 L107 228" fill="none" stroke="#2d6db4" stroke-width="2"/><circle cx="92" cy="228" r="6" fill="#20334a"/><text x="92" y="260" font-size="18" fill="#20334a" text-anchor="middle">A(1,0)</text><circle cx="92" cy="122" r="6" fill="#20334a"/><text x="92" y="106" font-size="18" fill="#20334a" text-anchor="middle">B(1,1)</text><circle cx="320" cy="228" r="6" fill="#20334a"/><text x="320" y="260" font-size="18" fill="#20334a" text-anchor="middle">C(3,0)</text><circle cx="548" cy="228" r="6" fill="#20334a"/><text x="548" y="260" font-size="18" fill="#20334a" text-anchor="middle">D(5,0)</text><circle cx="206" cy="122" r="6" fill="#20334a"/><text x="206" y="106" font-size="18" fill="#20334a" text-anchor="middle">E(2,1)</text><text x="24" y="302" font-size="22" fill="#2d6db4" text-anchor="start">AB+C、AB+D、AB+E：3 个，恰好 n−2</text><text x="24" y="354" font-size="21" fill="#20334a" text-anchor="start">第二类：固定 E，必须同时有 A、C</text><path d="M160 530 L280 410 L400 530 Z" fill="#dcfce7" stroke="#087b48" stroke-width="3"/><path d="M268 422 L280 434 L292 422" fill="none" stroke="#087b48" stroke-width="2"/><text x="123" y="562" font-size="20" fill="#20334a" text-anchor="start">A(1,0)</text><text x="280" y="396" font-size="20" fill="#20334a" text-anchor="middle">E(2,1)</text><text x="383" y="562" font-size="20" fill="#20334a" text-anchor="start">C(3,0)</text><text x="24" y="605" font-size="21" fill="#20334a" text-anchor="start">从 E 出发：向量 (−1,−1) 与 (1,−1)，点积为 0</text><text x="24" y="645" font-size="21" fill="#087b48" text-anchor="start">中心和两邻点都存在：唯一的 ACE，答案再加 1</text></g></svg>