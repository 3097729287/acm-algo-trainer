<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img"><title>实际票据日期与不可混用的源行目的行</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="38" font-size="27" fill="#20334a" text-anchor="start">三张原票 A、B、C：同日候选共读一份旧行</text><text x="35" y="80" font-size="22" fill="#20334a" text-anchor="start">金额上限 15，日期间隔 K = 3；A 在一月三日，B / C 在一月六日。</text><path d="M150,206 L890,206" stroke="#6d86a6" stroke-width="3" fill="none"/><path d="M240,198 L240,215" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="240" y="245" font-size="20" fill="#20334a" text-anchor="middle">1月1日</text><path d="M360,198 L360,215" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="360" y="245" font-size="20" fill="#20334a" text-anchor="middle">1月2日</text><path d="M480,198 L480,215" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="480" y="245" font-size="20" fill="#20334a" text-anchor="middle">1月3日</text><path d="M600,198 L600,215" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="600" y="245" font-size="20" fill="#20334a" text-anchor="middle">1月4日</text><path d="M720,198 L720,215" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="720" y="245" font-size="20" fill="#20334a" text-anchor="middle">1月5日</text><path d="M840,198 L840,215" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="840" y="245" font-size="20" fill="#20334a" text-anchor="middle">1月6日</text><text x="480" y="149" font-size="23" fill="#286b4d" text-anchor="middle">A：2 元</text><path d="M480,158 L480,195" stroke="#286b4d" stroke-width="3" fill="none"/><text x="840" y="128" font-size="23" fill="#996300" text-anchor="middle">B：8 元</text><text x="840" y="165" font-size="23" fill="#996300" text-anchor="middle">C：5 元</text><path d="M840,171 L840,195" stroke="#996300" stroke-width="3" fill="none"/><text x="35" y="312" font-size="24" fill="#2563a6" text-anchor="start">只读 dp[3]</text><rect x="55" y="345" width="210" height="180" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="160" y="393" font-size="23" fill="#20334a" text-anchor="middle">旧金额</text><text x="160" y="445" font-size="29" fill="#20334a" text-anchor="middle">{0, 2}</text><text x="160" y="492" font-size="21" fill="#20334a" text-anchor="middle">不含当天票</text><path d="M280,397 L455,377" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="315" y="356" font-size="22" fill="#20334a" text-anchor="start">B 加 8</text><rect x="480" y="340" width="210" height="76" rx="5" fill="#fff0ce" stroke="#6d86a6" stroke-width="2"/><text x="585" y="370" font-size="23" fill="#20334a" text-anchor="middle">0+8=8</text><text x="585" y="401" font-size="23" fill="#20334a" text-anchor="middle">2+8=10</text><path d="M280,437 L455,487" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="315" y="494" font-size="22" fill="#20334a" text-anchor="start">C 加 5</text><rect x="480" y="450" width="210" height="76" rx="5" fill="#fff0ce" stroke="#6d86a6" stroke-width="2"/><text x="585" y="480" font-size="23" fill="#20334a" text-anchor="middle">0+5=5</text><text x="585" y="511" font-size="23" fill="#20334a" text-anchor="middle">2+5=7</text><path d="M710,378 L840,594" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M710,489 L800,594" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="35" y="545" width="230" height="44" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="150" y="573" font-size="19" fill="#20334a" text-anchor="middle">继承 dp[5]={0,2}</text><path d="M150,589 L150,609" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="285" y="585" font-size="22" fill="#20334a" text-anchor="start">写 dp[6]：只合并各候选，不互相作为来源</text><rect x="120" y="611" width="775" height="65" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="507" y="653" font-size="25" fill="#20334a" text-anchor="middle">{ 0，2，5，7，8，10 }   最大为 10 = A + B</text><text x="35" y="724" font-size="23" fill="#a23b34" text-anchor="start">13 = B + C 需要同日两张：不能从刚写出的 8 再加 5。</text></g></svg>