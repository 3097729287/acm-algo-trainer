<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img"><title>三种实际数组与游戏检查顺序</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="38" font-size="28" fill="#20334a" text-anchor="start">先判断是否已经结束，再分析可执行的拆分</text><text x="35" y="89" font-size="22" fill="#20334a" text-anchor="start">① 初始 [6,7] 已非降；六有混合质因子也不能再动。</text><rect x="65" y="118" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="94.0" y="148" font-size="25" fill="#20334a" text-anchor="middle">6</text><rect x="130" y="118" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="159.0" y="148" font-size="25" fill="#20334a" text-anchor="middle">7</text><path d="M225,141 L345,141" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="375" y="150" font-size="25" fill="#286b4d" text-anchor="start">立即结束：Bob</text><text x="35" y="209" font-size="22" fill="#20334a" text-anchor="start">② [3,4,2] 未有序：Alice 把中间 4 拆成 2、2。</text><rect x="55" y="242" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="84.0" y="272" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="120" y="242" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="149.0" y="272" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="185" y="242" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="214.0" y="272" font-size="25" fill="#20334a" text-anchor="middle">2</text><path d="M265,265 L345,265" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="380" y="242" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="409.0" y="272" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="445" y="242" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="474.0" y="272" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="510" y="242" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="539.0" y="272" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="575" y="242" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="604.0" y="272" font-size="25" fill="#20334a" text-anchor="middle">2</text><path d="M408,301 L603,301" stroke="#a23b34" stroke-width="3" fill="none"/><text x="380" y="340" font-size="22" fill="#a23b34" text-anchor="start">左侧 3 &gt; 右侧 2，均不可再拆：Alice</text><text x="35" y="403" font-size="22" fill="#20334a" text-anchor="start">③ [8,3] 的底数 2、3 有序：八的两种首步都通往同一有序终局。</text><rect x="40" y="497" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="69.0" y="527" font-size="25" fill="#20334a" text-anchor="middle">8</text><rect x="105" y="497" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="134.0" y="527" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="305" y="444" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="334.0" y="474" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="370" y="444" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="399.0" y="474" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="435" y="444" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="464.0" y="474" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="305" y="554" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="334.0" y="584" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="370" y="554" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="399.0" y="584" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="435" y="554" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="464.0" y="584" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="665" y="497" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="694.0" y="527" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="730" y="497" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="759.0" y="527" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="795" y="497" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="824.0" y="527" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="860" y="497" width="58" height="45" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="889.0" y="527" font-size="25" fill="#20334a" text-anchor="middle">3</text><path d="M195,511 L280,468" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M195,527 L280,574" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M520,467 L640,510" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M520,576 L640,529" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="690" y="590" font-size="24" fill="#286b4d" text-anchor="start">拆完四：Bob</text><text x="40" y="663" font-size="22" fill="#20334a" text-anchor="start">胜负取决于最终是否非降；没有“最后一次拆分者获胜”的规则。</text></g></svg>