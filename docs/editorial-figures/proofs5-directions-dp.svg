<svg xmlns="http://www.w3.org/2000/svg" width="720" height="621" viewBox="0 0 720 621" role="img"><title>中心行代价C和上下双向DP的全部三乘三实际数值，中心二二由十二加二得到十四、十二加六得到十八，两半相加减本行十二得二十，并核对另一起点二二答案二十五</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">同一费用网格：每个条目都是选本行中心的费用</text><text x="118" y="86" font-size="27" fill="#20334a" text-anchor="middle">C</text><rect x="22" y="109" width="61" height="55" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="52" y="146" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="89" y="109" width="61" height="55" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="119" y="146" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="156" y="109" width="61" height="55" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="186" y="146" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="22" y="174" width="61" height="55" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="52" y="211" font-size="24" fill="#20334a" text-anchor="middle">9</text><rect x="89" y="174" width="61" height="55" rx="8" fill="#fef3c7" stroke="#a32e36" stroke-width="2"/><text x="119" y="211" font-size="24" fill="#20334a" text-anchor="middle">12</text><rect x="156" y="174" width="61" height="55" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="186" y="211" font-size="24" fill="#20334a" text-anchor="middle">9</text><rect x="22" y="239" width="61" height="55" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="52" y="276" font-size="24" fill="#20334a" text-anchor="middle">6</text><rect x="89" y="239" width="61" height="55" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="119" y="276" font-size="24" fill="#20334a" text-anchor="middle">12</text><rect x="156" y="239" width="61" height="55" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="186" y="276" font-size="24" fill="#20334a" text-anchor="middle">6</text><text x="352" y="86" font-size="27" fill="#20334a" text-anchor="middle">U</text><rect x="256" y="109" width="61" height="55" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="286" y="146" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="323" y="109" width="61" height="55" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="353" y="146" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="390" y="109" width="61" height="55" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="420" y="146" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="256" y="174" width="61" height="55" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="286" y="211" font-size="24" fill="#20334a" text-anchor="middle">13</text><rect x="323" y="174" width="61" height="55" rx="8" fill="#dbeafe" stroke="#a32e36" stroke-width="2"/><text x="353" y="211" font-size="24" fill="#20334a" text-anchor="middle">14</text><rect x="390" y="174" width="61" height="55" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="420" y="211" font-size="24" fill="#20334a" text-anchor="middle">13</text><rect x="256" y="239" width="61" height="55" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="286" y="276" font-size="24" fill="#20334a" text-anchor="middle">20</text><rect x="323" y="239" width="61" height="55" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="353" y="276" font-size="24" fill="#20334a" text-anchor="middle">25</text><rect x="390" y="239" width="61" height="55" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="420" y="276" font-size="24" fill="#20334a" text-anchor="middle">20</text><text x="586" y="86" font-size="27" fill="#20334a" text-anchor="middle">D</text><rect x="490" y="109" width="61" height="55" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="520" y="146" font-size="24" fill="#20334a" text-anchor="middle">20</text><rect x="557" y="109" width="61" height="55" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="587" y="146" font-size="24" fill="#20334a" text-anchor="middle">25</text><rect x="624" y="109" width="61" height="55" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="654" y="146" font-size="24" fill="#20334a" text-anchor="middle">20</text><rect x="490" y="174" width="61" height="55" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="520" y="211" font-size="24" fill="#20334a" text-anchor="middle">21</text><rect x="557" y="174" width="61" height="55" rx="8" fill="#dcfce7" stroke="#a32e36" stroke-width="2"/><text x="587" y="211" font-size="24" fill="#20334a" text-anchor="middle">18</text><rect x="624" y="174" width="61" height="55" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="654" y="211" font-size="24" fill="#20334a" text-anchor="middle">21</text><rect x="490" y="239" width="61" height="55" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="520" y="276" font-size="24" fill="#20334a" text-anchor="middle">6</text><rect x="557" y="239" width="61" height="55" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="587" y="276" font-size="24" fill="#20334a" text-anchor="middle">12</text><rect x="624" y="239" width="61" height="55" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="654" y="276" font-size="24" fill="#20334a" text-anchor="middle">6</text><text x="22" y="365" font-size="21" fill="#20334a" text-anchor="start">U₂,₂ = C₂,₂ + min(U₁,₁,U₁,₃) = 12+min(2,2)=14</text><text x="22" y="411" font-size="21" fill="#20334a" text-anchor="start">D₂,₂ = C₂,₂ + min(D₃,₁,D₃,₃) = 12+min(6,6)=18</text><text x="22" y="457" font-size="21" fill="#20334a" text-anchor="start">经过中心(2,2)：14+18−12=20；本行费用只支付一遍</text><text x="22" y="503" font-size="21" fill="#20334a" text-anchor="start">起点(2,1)只有右侧中心，答案20；起点(2,2)比较左右中心</text><text x="22" y="549" font-size="22" fill="#20334a" text-anchor="start">两者均为13+21−9=25，所以该起点答案25</text><text x="22" y="595" font-size="21" fill="#20334a" text-anchor="start">顶行U=C、底行D=C；越界转移不存在，不能用费用0替代</text></g></svg>