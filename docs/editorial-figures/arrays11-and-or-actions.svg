<svg xmlns="http://www.w3.org/2000/svg" width="870" height="590" viewBox="0 0 870 590" role="img"><title>前缀或与只改所选位的两个实际动作</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="24" fill="#20334a" text-anchor="start">001010：分界在第四位后，左边全零、右边全一</text><text x="25" y="134" font-size="21" fill="#20334a" text-anchor="start">原串</text><rect x="250" y="102" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="282" y="135" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="340" y="102" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="372" y="135" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="430" y="102" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="462" y="135" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="520" y="102" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="552" y="135" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="610" y="102" width="64" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="642" y="135" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="700" y="102" width="64" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="732" y="135" font-size="26" fill="#20334a" text-anchor="middle">0</text><path d="M597,92 L597,162" stroke="#a15b28" stroke-width="3" fill="none"/><text x="25" y="246" font-size="21" fill="#20334a" text-anchor="start">第六位做 OR</text><rect x="250" y="214" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="282" y="247" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="340" y="214" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="372" y="247" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="430" y="214" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="462" y="247" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="520" y="214" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="552" y="247" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="610" y="214" width="64" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="642" y="247" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="700" y="214" width="64" height="47" rx="4" fill="#fff0d8" stroke="#b07120" stroke-width="2"/><text x="732" y="247" font-size="26" fill="#20334a" text-anchor="middle">1</text><path d="M597,204 L597,274" stroke="#a15b28" stroke-width="3" fill="none"/><text x="25" y="358" font-size="21" fill="#20334a" text-anchor="start">第三位做 AND</text><rect x="250" y="326" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="282" y="359" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="340" y="326" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="372" y="359" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="430" y="326" width="64" height="47" rx="4" fill="#fff0d8" stroke="#b07120" stroke-width="2"/><text x="462" y="359" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="520" y="326" width="64" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="552" y="359" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="610" y="326" width="64" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="642" y="359" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="700" y="326" width="64" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="732" y="359" font-size="26" fill="#20334a" text-anchor="middle">1</text><path d="M597,316 L597,386" stroke="#a15b28" stroke-width="3" fill="none"/><text x="25" y="463" font-size="21" fill="#20334a" text-anchor="start">必改对象：前四位中的一在位置3；后两位中的零在位置6</text><text x="25" y="509" font-size="22" fill="#20334a" text-anchor="start">六个分界代价：3、2、3、2、3、2；最小为2</text><text x="25" y="553" font-size="22" fill="#20334a" text-anchor="start">第五位的一也保留，所以本例两步调换仍合法</text></g></svg>