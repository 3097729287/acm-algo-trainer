<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="795" viewBox="0 0 1000 795" role="img"><title>目标三与目标四的真实禁区及可用整数点</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="38" font-size="26" fill="#20334a" text-anchor="start">同一条整数轴：朋友在 4、7，范围 [0,10]，要选 3 点</text><text x="35" y="87" font-size="24" fill="#20334a" text-anchor="start">目标距离 t = 3</text><path d="M400,100 L400,121" stroke="#2563a6" stroke-width="3" fill="none"/><text x="400" y="147" font-size="20" fill="#2563a6" text-anchor="middle">朋友 4</text><path d="M610,100 L610,121" stroke="#2563a6" stroke-width="3" fill="none"/><text x="610" y="147" font-size="20" fill="#2563a6" text-anchor="middle">朋友 7</text><rect x="238" y="169" width="324" height="31" rx="5" fill="#ffe4df" stroke="#bc6259" stroke-width="2"/><text x="400" y="192" font-size="21" fill="#8a332d" text-anchor="middle">[2,6]</text><rect x="448" y="213" width="324" height="31" rx="5" fill="#ffe4df" stroke="#bc6259" stroke-width="2"/><text x="610" y="236" font-size="21" fill="#8a332d" text-anchor="middle">[5,9]</text><rect x="97" y="272" width="46" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="120" y="301" font-size="22" fill="#20334a" text-anchor="middle">0</text><rect x="167" y="272" width="46" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="190" y="301" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="237" y="272" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="260" y="301" font-size="22" fill="#20334a" text-anchor="middle">2</text><rect x="307" y="272" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="330" y="301" font-size="22" fill="#20334a" text-anchor="middle">3</text><rect x="377" y="272" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="400" y="301" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="447" y="272" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="470" y="301" font-size="22" fill="#20334a" text-anchor="middle">5</text><rect x="517" y="272" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="540" y="301" font-size="22" fill="#20334a" text-anchor="middle">6</text><rect x="587" y="272" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="610" y="301" font-size="22" fill="#20334a" text-anchor="middle">7</text><rect x="657" y="272" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="680" y="301" font-size="22" fill="#20334a" text-anchor="middle">8</text><rect x="727" y="272" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="750" y="301" font-size="22" fill="#20334a" text-anchor="middle">9</text><rect x="797" y="272" width="46" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="820" y="301" font-size="22" fill="#20334a" text-anchor="middle">10</text><text x="35" y="354" font-size="23" fill="#286b4d" text-anchor="start">并集 [2,9]：8 个禁点；11 − 8 = 3，选 0、1、10。</text><text x="35" y="428" font-size="24" fill="#20334a" text-anchor="start">目标距离 t = 4</text><path d="M400,441 L400,462" stroke="#2563a6" stroke-width="3" fill="none"/><text x="400" y="488" font-size="20" fill="#2563a6" text-anchor="middle">朋友 4</text><path d="M610,441 L610,462" stroke="#2563a6" stroke-width="3" fill="none"/><text x="610" y="488" font-size="20" fill="#2563a6" text-anchor="middle">朋友 7</text><rect x="168" y="510" width="464" height="31" rx="5" fill="#ffe4df" stroke="#bc6259" stroke-width="2"/><text x="400" y="533" font-size="21" fill="#8a332d" text-anchor="middle">[1,7]</text><rect x="378" y="554" width="464" height="31" rx="5" fill="#ffe4df" stroke="#bc6259" stroke-width="2"/><text x="610" y="577" font-size="21" fill="#8a332d" text-anchor="middle">[4,10]</text><rect x="97" y="613" width="46" height="43" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="120" y="642" font-size="22" fill="#20334a" text-anchor="middle">0</text><rect x="167" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="190" y="642" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="237" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="260" y="642" font-size="22" fill="#20334a" text-anchor="middle">2</text><rect x="307" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="330" y="642" font-size="22" fill="#20334a" text-anchor="middle">3</text><rect x="377" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="400" y="642" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="447" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="470" y="642" font-size="22" fill="#20334a" text-anchor="middle">5</text><rect x="517" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="540" y="642" font-size="22" fill="#20334a" text-anchor="middle">6</text><rect x="587" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="610" y="642" font-size="22" fill="#20334a" text-anchor="middle">7</text><rect x="657" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="680" y="642" font-size="22" fill="#20334a" text-anchor="middle">8</text><rect x="727" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="750" y="642" font-size="22" fill="#20334a" text-anchor="middle">9</text><rect x="797" y="613" width="46" height="43" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="820" y="642" font-size="22" fill="#20334a" text-anchor="middle">10</text><text x="35" y="695" font-size="23" fill="#a23b34" text-anchor="start">并集 [1,10]：10 个禁点；11 − 10 = 1，放不下 3 点。</text><text x="35" y="761" font-size="21" fill="#20334a" text-anchor="start">重复覆盖的坐标只禁一次；距离恰为三仍允许，传送点彼此不要求间隔。</text></g></svg>