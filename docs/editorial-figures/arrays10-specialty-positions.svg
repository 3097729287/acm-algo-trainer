<svg xmlns="http://www.w3.org/2000/svg" width="870" height="518" viewBox="0 0 870 518" role="img"><title>栈弹出对应原下标相邻剩余字符的合法删除</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="25" fill="#20334a" text-anchor="start">abba：原下标一直不变，星号只是已删位置</text><text x="280" y="83" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="385" y="83" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="490" y="83" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="595" y="83" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="25" y="141" font-size="21" fill="#20334a" text-anchor="start">开始</text><rect x="240" y="108" width="80" height="49" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="280" y="142" font-size="27" fill="#20334a" text-anchor="middle">a</text><rect x="345" y="108" width="80" height="49" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="385" y="142" font-size="27" fill="#20334a" text-anchor="middle">b</text><rect x="450" y="108" width="80" height="49" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="490" y="142" font-size="27" fill="#20334a" text-anchor="middle">b</text><rect x="555" y="108" width="80" height="49" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="595" y="142" font-size="27" fill="#20334a" text-anchor="middle">a</text><text x="25" y="257" font-size="21" fill="#20334a" text-anchor="start">删原二、三位</text><rect x="240" y="224" width="80" height="49" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="280" y="258" font-size="27" fill="#20334a" text-anchor="middle">a</text><rect x="345" y="224" width="80" height="49" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="385" y="258" font-size="27" fill="#8a94a5" text-anchor="middle">*</text><rect x="450" y="224" width="80" height="49" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="490" y="258" font-size="27" fill="#8a94a5" text-anchor="middle">*</text><rect x="555" y="224" width="80" height="49" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="595" y="258" font-size="27" fill="#20334a" text-anchor="middle">a</text><text x="25" y="373" font-size="21" fill="#20334a" text-anchor="start">再删原一、四位</text><rect x="240" y="340" width="80" height="49" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="280" y="374" font-size="27" fill="#8a94a5" text-anchor="middle">*</text><rect x="345" y="340" width="80" height="49" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="385" y="374" font-size="27" fill="#8a94a5" text-anchor="middle">*</text><rect x="450" y="340" width="80" height="49" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="490" y="374" font-size="27" fill="#8a94a5" text-anchor="middle">*</text><rect x="555" y="340" width="80" height="49" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="595" y="374" font-size="27" fill="#8a94a5" text-anchor="middle">*</text><path d="M385,170 L385,189" stroke="#a95221" stroke-width="3" fill="none"/><path d="M490,170 L490,189" stroke="#a95221" stroke-width="3" fill="none"/><path d="M385,189 L490,189" stroke="#a95221" stroke-width="3" fill="none"/><text x="640" y="151" font-size="21" fill="#20334a" text-anchor="start">先配 b 与 b</text><path d="M280,282 L280,305" stroke="#a95221" stroke-width="3" fill="none"/><path d="M595,282 L595,305" stroke="#a95221" stroke-width="3" fill="none"/><path d="M280,305 L595,305" stroke="#a95221" stroke-width="3" fill="none"/><text x="640" y="266" font-size="21" fill="#20334a" text-anchor="start">中间都为 *</text><text x="25" y="482" font-size="21" fill="#20334a" text-anchor="start">栈：a → ab → a → 空；后来的字符还能消掉暂时留下的栈顶</tex