<svg xmlns="http://www.w3.org/2000/svg" width="720" height="692" viewBox="0 0 720 692" role="img"><title>两个父位置排列各插入最小值一的三个缝隙，六个子排列完整且无重复，只有首缝增加记录数，具体生成乘以x加二</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">在位置排列中插入最小值1：删去1可唯一恢复父排列和缝隙</text><rect x="232" y="75" width="258" height="57" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="361" y="113" font-size="23" fill="#20334a" text-anchor="middle">[2,3]，R=2</text><path d="M361,132 L128,186" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="128,186 136.61291627265075,178.8713484248206 138.87067102373396,188.61314207301297" fill="#2d6db4"/><rect x="29" y="193" width="198" height="80" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="128" y="224" font-size="23" fill="#20334a" text-anchor="middle">[1,2,3]</text><text x="128" y="257" font-size="22" fill="#20334a" text-anchor="middle">R=3</text><path d="M361,132 L360,186" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="360,186 355.1860105584346,175.90913751671857 365.18429632168585,176.0942909567788" fill="#2d6db4"/><rect x="261" y="193" width="198" height="80" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="360" y="224" font-size="23" fill="#20334a" text-anchor="middle">[2,1,3]</text><text x="360" y="257" font-size="22" fill="#20334a" text-anchor="middle">R=2</text><path d="M361,132 L592,186" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="592,186 581.1243746859533,188.59244556904602 583.4006683563351,178.85496709019023" fill="#2d6db4"/><rect x="493" y="193" width="198" height="80" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="592" y="224" font-size="23" fill="#20334a" text-anchor="middle">[2,3,1]</text><text x="592" y="257" font-size="22" fill="#20334a" text-anchor="middle">R=2</text><rect x="232" y="315" width="258" height="57" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="361" y="353" font-size="23" fill="#20334a" text-anchor="middle">[3,2]，R=1</text><path d="M361,372 L128,426" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="128,426 136.61291627265075,418.8713484248206 138.87067102373396,428.61314207301297" fill="#2d6db4"/><rect x="29" y="433" width="198" height="80" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="128" y="464" font-size="23" fill="#20334a" text-anchor="middle">[1,3,2]</text><text x="128" y="497" font-size="22" fill="#20334a" text-anchor="middle">R=2</text><path d="M361,372 L360,426" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="360,426 355.1860105584346,415.9091375167186 365.18429632168585,416.09429095677876" fill="#2d6db4"/><rect x="261" y="433" width="198" height="80" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="360" y="464" font-size="23" fill="#20334a" text-anchor="middle">[3,1,2]</text><text x="360" y="497" font-size="22" fill="#20334a" text-anchor="middle">R=1</text><path d="M361,372 L592,426" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="592,426 581.1243746859533,428.59244556904605 583.4006683563351,418.85496709019026" fill="#2d6db4"/><rect x="493" y="433" width="198" height="80" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="592" y="464" font-size="23" fill="#20334a" text-anchor="middle">[3,2,1]</text><text x="592" y="497" font-size="22" fill="#20334a" text-anchor="middle">R=1</text><text x="22" y="578" font-size="22" fill="#20334a" text-anchor="start">首缝：1成为新记录 → 乘x；另两缝：记录数不变 → 乘2</text><text x="22" y="622" font-size="22" fill="#20334a" text-anchor="start">六个不同排列全部覆盖：R为1、2、3的个数依次为2、3、1</text><text x="22" y="666" font-size="22" fill="#20334a" text-anchor="start">故P₃(x)=x(x+1)(x+2)=2x+3x²+x³；每个排列只计一次</text></g></svg>