<svg xmlns="http://www.w3.org/2000/svg" width="640" height="538" viewBox="0 0 640 538" role="img"><title>Concat：临界长度、末次等长选择与候选真实字符</title><rect width="640" height="538" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">固定 i=0：选最长三串，切成两段过滤串</text><text x="24" y="70" class="" text-anchor="start">N=6，K=4；位置从零编号，已按拼接比较器排序</text><text x="70" y="110" class="" text-anchor="middle">0</text><rect x="27" y="126" width="88" height="52" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="70" y="160" class="" text-anchor="middle">9</text><text x="70" y="213" class="" text-anchor="middle">长1</text><text x="171" y="110" class="" text-anchor="middle">1</text><rect x="128" y="126" width="88" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="171" y="160" class="" text-anchor="middle">800</text><text x="171" y="213" class="" text-anchor="middle">长3</text><text x="272" y="110" class="" text-anchor="middle">2</text><rect x="229" y="126" width="88" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="272" y="160" class="" text-anchor="middle">77</text><text x="272" y="213" class="" text-anchor="middle">长2</text><text x="373" y="110" class="" text-anchor="middle">3</text><rect x="330" y="126" width="88" height="52" rx="5" fill="#e1e5ea" stroke="#7394aa"/><text x="373" y="160" class="" text-anchor="middle">6</text><text x="373" y="213" class="" text-anchor="middle">长1</text><text x="474" y="110" class="" text-anchor="middle">4</text><rect x="431" y="126" width="88" height="52" rx="5" fill="#e1e5ea" stroke="#7394aa"/><text x="474" y="160" class="" text-anchor="middle">55</text><text x="474" y="213" class="" text-anchor="middle">长2</text><text x="575" y="110" class="" text-anchor="middle">5</text><rect x="532" y="126" width="88" height="52" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="575" y="160" class="" text-anchor="middle">4000</text><text x="575" y="213" class="" text-anchor="middle">长4</text><text x="24" y="260" class="" text-anchor="start">tau=2，need=1，J=2；77 入选，后面的 55 不选</text><text x="24" y="300" class="" text-anchor="start">A段：(0,2] 中长度≥2 → 80077，5位</text><text x="24" y="340" class="" text-anchor="start">B段：J 之后长度&gt;2 → 4000，4位</text><rect x="24" y="372" width="62" height="56" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="55.0" y="408" class="" text-anchor="middle">9</text><rect x="86" y="372" width="310" height="56" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="241.0" y="408" class="" text-anchor="middle">80077</text><rect x="396" y="372" width="220" height="56" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="506.0" y="408" class="" text-anchor="middle">4000</text><text x="24" y="470" class="" text-anchor="start">候选：9 | 80077 | 4000 = 9800774000，共10位</text><text x="24" y="510" class="" text-anchor="start">前5位是 98007；前7位是 9800774，进入B段一位</text></svg>