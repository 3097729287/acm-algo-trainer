<svg xmlns="http://www.w3.org/2000/svg" width="720" height="813" viewBox="0 0 720 813" role="img"><title>三课程DAG2指向1，真实五次提交的课程成绩输出及全部三状态，非法整批零写入，通过后不能重选且挂科可重修</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="24" fill="#20334a" text-anchor="start">三门课程，只有2必须先于1通过</text><text x="22" y="80" font-size="23" fill="#20334a" text-anchor="start">先修箭头：2 → 1；课程3无先修</text><text x="24" y="139" font-size="20" fill="#20334a" text-anchor="start">本次课程与分数</text><text x="340" y="139" font-size="20" fill="#20334a" text-anchor="start">输出</text><text x="470" y="139" font-size="20" fill="#20334a" text-anchor="start">提交后1/2/3</text><rect x="20" y="165" width="680" height="78" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="34" y="211" font-size="21" fill="#20334a" text-anchor="start">[2,1]，100/100</text><text x="340" y="211" font-size="21" fill="#20334a" text-anchor="start">Error</text><text x="465" y="211" font-size="21" fill="#20334a" text-anchor="start">未 / 未 / 未</text><rect x="20" y="261" width="680" height="78" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="34" y="307" font-size="21" fill="#20334a" text-anchor="start">[2]，60</text><text x="340" y="307" font-size="21" fill="#20334a" text-anchor="start">P</text><text x="465" y="307" font-size="21" fill="#20334a" text-anchor="start">未 / 过 / 未</text><rect x="20" y="357" width="680" height="78" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="34" y="403" font-size="21" fill="#20334a" text-anchor="start">[1,3]，59/90</text><text x="340" y="403" font-size="21" fill="#20334a" text-anchor="start">FP</text><text x="465" y="403" font-size="21" fill="#20334a" text-anchor="start">挂 / 过 / 过</text><rect x="20" y="453" width="680" height="78" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="34" y="499" font-size="21" fill="#20334a" text-anchor="start">[1]，60</text><text x="340" y="499" font-size="21" fill="#20334a" text-anchor="start">P</text><text x="465" y="499" font-size="21" fill="#20334a" text-anchor="start">过 / 过 / 过</text><rect x="20" y="549" width="680" height="78" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="34" y="595" font-size="21" fill="#20334a" text-anchor="start">[3]，0</text><text x="340" y="595" font-size="21" fill="#20334a" text-anchor="start">Error</text><text x="465" y="595" font-size="21" fill="#20334a" text-anchor="start">过 / 过 / 过</text><text x="22" y="711" font-size="22" fill="#20334a" text-anchor="start">第一次整批不写，不能提前让2通过。</text><text x="22" y="763" font-size="20" fill="#20334a" text-anchor="start">第三次挂科可重修；第五次已通过不能重选。</text></g></svg>