<svg xmlns="http://www.w3.org/2000/svg" width="720" height="738" viewBox="0 0 720 738" role="img"><title>真实三点树根一值一负一两个孩子二三都值三正一，关键点相邻LCA一补入虚树，b1 b2各一来自不同孩子，同时拼成二一三得一，单链只有零，路径最高点和非平凡检查明确</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">两条链必须来自不同孩子：真实三点树，判断值3</text><path d="M360 135 L167 290" stroke="#64748b" stroke-width="3" fill="none"/><path d="M360 135 L553 290" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="360" cy="135" r="23" fill="#fee2e2" stroke="#285b87" stroke-width="2"/><text x="360" y="142" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="167" cy="290" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="167" y="297" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="553" cy="290" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="553" y="297" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="360" y="86" font-size="20" fill="#20334a" text-anchor="middle">a1=1，val=−1</text><text x="167" y="346" font-size="20" fill="#20334a" text-anchor="middle">a2=3，上传1</text><text x="553" y="346" font-size="20" fill="#20334a" text-anchor="middle">a3=3，上传1</text><text x="22" y="410" font-size="21" fill="#20334a" text-anchor="start">DFS会连续访问两个关键点；相邻LCA(2,3)=1</text><text x="22" y="457" font-size="21" fill="#20334a" text-anchor="start">两个孩子各只上传一次：b1=1，b2=1</text><text x="22" y="504" font-size="21" fill="#20334a" text-anchor="start">只取一条得−1+1=0；两条同时取：−1+1+1=1</text><text x="22" y="551" font-size="21" fill="#20334a" text-anchor="start">展开2—1—3，两个3和一个1，路径没有重复顶点</text><text x="22" y="614" font-size="21" fill="#20334a" text-anchor="start">任意简单路径有唯一最高点，至多经过它的两个孩子</text><text x="22" y="661" font-size="20" fill="#20334a" text-anchor="start">不同孩子子树不相交，所以保存的两条最优链能同时拼接</text><text x="22" y="708" font-size="21" fill="#20334a" text-anchor="start">若没有真实孩子链，单个+1不能触发；缺第二条时取0</text></g></svg>