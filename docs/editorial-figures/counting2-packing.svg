<svg xmlns="http://www.w3.org/2000/svg" width="640" height="591" viewBox="0 0 640 591" role="img"><title>Bin-ary Packing：不同袋余数不可拼接以及容量六的实际方案</title><rect width="640" height="591" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">槽不跨袋：记账必须能回到真实装袋</text><text x="24" y="72" class="" text-anchor="start">N=2，X=3，三个重量二的包裹：总容量够仍失败</text><text x="24" y="129" class="" text-anchor="start">袋1</text><rect x="105" y="97" width="210" height="46" rx="5" fill="#c4e6f6" stroke="#7394aa"/><text x="210" y="128" class="" text-anchor="middle">二槽</text><rect x="315" y="97" width="105" height="46" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="368" y="128" class="" text-anchor="middle">零头一</text><text x="24" y="191" class="" text-anchor="start">袋2</text><rect x="105" y="159" width="210" height="46" rx="5" fill="#c4e6f6" stroke="#7394aa"/><text x="210" y="190" class="" text-anchor="middle">二槽</text><rect x="315" y="159" width="105" height="46" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="368" y="190" class="" text-anchor="middle">零头一</text><text x="525" y="129" class="" text-anchor="middle">第三件二</text><rect x="470" y="153" width="110" height="46" rx="5" fill="#f8d6cc" stroke="#7394aa"/><text x="525" y="184" class="" text-anchor="middle">无处放</text><text x="24" y="243" class="" text-anchor="start">两个零头来自不同袋，不能拼成可用的二槽</text><text x="24" y="291" class="" text-anchor="start">样例首例：N=2，X=6，A=(3,2,1) 可行</text><text x="24" y="326" class="" text-anchor="start">重量4后：4槽×1、2槽×2；重量2后：2槽×2</text><text x="24" y="361" class="" text-anchor="start">重量1：拆出4个一槽，用3余1；落实为下面两袋</text><text x="24" y="424" class="" text-anchor="start">袋1</text><rect x="105" y="389" width="320" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="265.0" y="423" class="" text-anchor="middle">4</text><rect x="425" y="389" width="80" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="465.0" y="423" class="" text-anchor="middle">1</text><rect x="505" y="389" width="80" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="545.0" y="423" class="" text-anchor="middle">1</text><text x="24" y="498" class="" text-anchor="start">袋2</text><rect x="105" y="463" width="160" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="185.0" y="497" class="" text-anchor="middle">2</text><rect x="265" y="463" width="160" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="345.0" y="497" class="" text-anchor="middle">2</text><rect x="425" y="463" width="80" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="465.0" y="497" class="" text-anchor="middle">1</text><rect x="505" y="463" width="80" height="51" rx="5" fill="#e1e5ea" stroke="#7394aa"/><text x="545.0" y="497" class="" text-anchor="middle">空</text><text x="24" y="565" class="" text-anchor="start">重量分别为 4+1+1=6 与 2+2+1=5，最大值为六</text></svg>