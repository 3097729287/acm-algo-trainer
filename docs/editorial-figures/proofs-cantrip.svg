<svg xmlns="http://www.w3.org/2000/svg" width="720" height="550" viewBox="0 0 720 550" role="img"><title>五个袋子中先领两个，再用两个命中袋领到第三和第四袋，最后一个兑换袋已被领取</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="25" y="38" font-size="24" fill="#20334a" text-anchor="start">S=ooxxx，先拿 k=2 个：初始有 2 个 o 袋</text><text x="80" y="80" font-size="20" fill="#20334a" text-anchor="middle">位置 1</text><rect x="30" y="94" width="100" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="80" y="136" font-size="30" fill="#20334a" text-anchor="middle">o</text><text x="80" y="190" font-size="20" fill="#2d6db4" text-anchor="middle">初始领取</text><text x="212" y="80" font-size="20" fill="#20334a" text-anchor="middle">位置 2</text><rect x="162" y="94" width="100" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="212" y="136" font-size="30" fill="#20334a" text-anchor="middle">o</text><text x="212" y="190" font-size="20" fill="#2d6db4" text-anchor="middle">初始领取</text><text x="344" y="80" font-size="20" fill="#20334a" text-anchor="middle">位置 3</text><rect x="294" y="94" width="100" height="65" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="344" y="136" font-size="30" fill="#20334a" text-anchor="middle">x</text><text x="344" y="190" font-size="20" fill="#087b48" text-anchor="middle">兑换领取</text><text x="476" y="80" font-size="20" fill="#20334a" text-anchor="middle">位置 4</text><rect x="426" y="94" width="100" height="65" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="476" y="136" font-size="30" fill="#20334a" text-anchor="middle">x</text><text x="476" y="190" font-size="20" fill="#087b48" text-anchor="middle">兑换领取</text><text x="608" y="80" font-size="20" fill="#20334a" text-anchor="middle">位置 5</text><rect x="558" y="94" width="100" height="65" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="608" y="136" font-size="30" fill="#20334a" text-anchor="middle">x</text><text x="608" y="190" font-size="20" fill="#8995a5" text-anchor="middle">留在队伍</text><text x="28" y="237" font-size="23" fill="#20334a" text-anchor="start">领完前 2 个：手里 2 个 o</text><path d="M195,257 L195,282" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="195,282 190.0,272.0 200.0,272.0" fill="#2d6db4"/><text x="28" y="313" font-size="23" fill="#20334a" text-anchor="start">交出 1 个 o，拿到位置 3 的 x：剩 1 个 o</text><path d="M195,333 L195,358" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="195,358 190.0,348.0 200.0,348.0" fill="#2d6db4"/><text x="28" y="389" font-size="23" fill="#20334a" text-anchor="start">交出最后 1 个 o，拿到位置 4 的 x：剩 0 个 o</text><rect x="22" y="421" width="676" height="105" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="40" y="457" font-size="24" fill="#06613b" text-anchor="start">停止点 = 全串第 2 个 x = 位置 4</text><text x="40" y="497" font-size="21" fill="#06613b" text-anchor="start">初始 2 个 + 新领 (4−2) 个 = 4 个；位置 4 已经领到</text></g></svg>