<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="962" viewBox="0 0 1040 962" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#718096"/></marker></defs><rect width="1040" height="962" fill="#fbfcff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="28" y="42" font-size="27" fill="#18324f" text-anchor="start" font-weight="700">原函数共点 ↔ 参数点落在同一条非竖直直线上</text><text x="28" y="84" font-size="22" fill="#18324f" text-anchor="start">函数按编号：x+1，2x，2x，3x−1，4x，4x，4x+2</text><text x="48" y="132" font-size="24" fill="#18324f" text-anchor="start" font-weight="700">原函数平面 (x,y)</text><text x="563" y="132" font-size="23" fill="#18324f" text-anchor="start" font-weight="700">参数平面 (k,b)：箭头按编号走</text><line x1="55" y1="450" x2="493" y2="450" stroke="#718096" stroke-width="3"/><line x1="90" y1="505" x2="90" y2="160" stroke="#718096" stroke-width="3"/><text x="474" y="479" font-size="21" fill="#18324f" text-anchor="start">x</text><text x="58" y="173" font-size="21" fill="#18324f" text-anchor="start">y</text><defs><clipPath id="plot"><rect x="60" y="155" width="430" height="350"/></clipPath></defs><g clip-path="url(#plot)"><line x1="46.5" y1="419.2" x2="481.5" y2="287.2" stroke="#087f5b" stroke-width="3"/><line x1="46.5" y1="476.4" x2="481.5" y2="212.39999999999998" stroke="#2563a6" stroke-width="3"/><line x1="46.5" y1="533.6" x2="481.5" y2="137.5999999999999" stroke="#6d42ad" stroke-width="3"/><line x1="46.5" y1="502.8" x2="481.5" y2="-25.200000000000045" stroke="#bf3348" stroke-width="3"/><line x1="46.5" y1="414.8" x2="481.5" y2="-113.20000000000005" stroke="#b87512" stroke-width="3"/></g><circle cx="235" cy="362" r="8" fill="#18324f"/><text x="245" y="349" font-size="22" fill="#087f5b" text-anchor="start" font-weight="700">共同点 (1,2)</text><text x="46" y="532" font-size="18" fill="#087f5b" text-anchor="start">绿:x+1</text><text x="165" y="532" font-size="18" fill="#2563a6" text-anchor="s