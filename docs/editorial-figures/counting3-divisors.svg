<svg xmlns="http://www.w3.org/2000/svg" width="640" height="473" viewBox="0 0 640 473" role="img"><title>Increment All Divisors：真实操作影响及非负次数目标区间</title><rect width="640" height="473" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52677b"/></marker></defs><text x="24" y="34" class="title" text-anchor="start">操作三：只给它的约数位置一、三加一</text><text x="24" y="71" class="" text-anchor="start">官方首例 A=[4,7,4]；目标 V=7</text><rect x="232" y="99" width="175" height="53" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="319" y="133" class="" text-anchor="middle">选下标3，共3次</text><line x1="260" y1="152" x2="115" y2="219" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><line x1="377" y1="152" x2="525" y2="219" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><rect x="48" y="223" width="134" height="94" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="115" y="253" class="" text-anchor="middle">位置1</text><text x="115" y="290" class="" text-anchor="middle">4 → 7</text><rect x="253" y="223" width="134" height="94" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="320" y="253" class="" text-anchor="middle">位置2</text><text x="320" y="290" class="" text-anchor="middle">7 → 7</text><rect x="458" y="223" width="134" height="94" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="525" y="253" class="" text-anchor="middle">位置3</text><text x="525" y="290" class="" text-anchor="middle">4 → 7</text><text x="24" y="365" class="" text-anchor="start">x₁=7−V，x₂=V−7，x₃=V−4</text><text x="24" y="405" class="" text-anchor="start">全部非负 ⇒ 7≤V≤7 ⇒ 次数 (0,0,3)</text><text x="24" y="445" class="" text-anchor="start">V=8 会要求 x₁=−1，不能执行；目标并非越大越好</text></svg>