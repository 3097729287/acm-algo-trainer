<svg xmlns="http://www.w3.org/2000/svg" width="720" height="729" viewBox="0 0 720 729" role="img"><title>原四点权10、20、30、40，两条1—2平行边e0、e1和桥e2二三、e3三四；DFS低值1、1、3、4，子树和100、90、70、40，桥切30与70差40及60与40差20，low等号表示有替代路不是桥</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">原重边样例：两个1—2连接分别有自己的边号</text><rect x="42" y="61" width="455" height="216" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><rect x="569" y="61" width="116" height="216" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><path d="M90 150 Q180 22 270 150" stroke="#64748b" stroke-width="3" fill="none"/><path d="M90 150 Q180 278 270 150" stroke="#64748b" stroke-width="3" fill="none"/><path d="M270 150 L450 150" stroke="#64748b" stroke-width="3" fill="none"/><path d="M450 150 L630 150" stroke="#16a34a" stroke-width="5" fill="none"/><circle cx="90" cy="150" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="90" y="157" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="90" y="249" font-size="19" fill="#20334a" text-anchor="middle">权10</text><circle cx="270" cy="150" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="270" y="157" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="270" y="249" font-size="19" fill="#20334a" text-anchor="middle">权20</text><circle cx="450" cy="150" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="450" y="157" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="450" y="249" font-size="19" fill="#20334a" text-anchor="middle">权30</text><circle cx="630" cy="150" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="630" y="157" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="630" y="249" font-size="19" fill="#20334a" text-anchor="middle">权40</text><text x="180" y="76" font-size="20" fill="#20334a" text-anchor="middle">e0</text><text x="180" y="260" font-size="20" fill="#20334a" text-anchor="middle">e1</text><text x="360" y="126" font-size="20" fill="#20334a" text-anchor="middle">e2</text><text x="540" y="126" font-size="20" fill="#20334a" text-anchor="middle">e3</text><text x="22" y="323" font-size="21" fill="#20334a" text-anchor="start">DFS顺序1、2、3、4；跳过e0后，e1仍能从2回1</text><text x="22" y="370" font-size="20" fill="#20334a" text-anchor="start">dfn=[1,2,3,4]；low=[1,1,3,4]，low2=dfn1不成桥</text><text x="22" y="417" font-size="21" fill="#20334a" text-anchor="start">退出子树和=[100,90,70,40]；e2、e3才是桥</text><text x="22" y="475" font-size="21" fill="#20334a" text-anchor="start">删e2(2—3)：{1,2}权30，{3,4}权70，差40</text><text x="22" y="530" font-size="21" fill="#20334a" text-anchor="start">删e3(3—4)：{1,2,3}权60，{4}权40，差20</text><text x="22" y="585" font-size="20" fill="#20334a" text-anchor="start">两条平行边任删一条仍有另一条连接，均不产生两分量</text><text x="22" y="642" font-size="20" fill="#20334a" text-anchor="start">条件low[子]&gt;dfn[父]严格成立，才没有绕回父侧的出口</text><text x="22" y="699" font-size="20" fill="#20334a" text-anchor="start">原图连通，桥切开两侧恰为子树s和总和−s，最优20</text></g></svg>