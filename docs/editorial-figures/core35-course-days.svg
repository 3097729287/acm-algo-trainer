<svg xmlns="http://www.w3.org/2000/svg" width="760" height="886" viewBox="0 0 760 886" role="img"><title>十二天统一比例日期轴下八个实际班级区间，课一选一到三，课二拒三到四并以六到七替换四到十，课三拒七到八而选八到九，闭区间同日冲突清楚标出</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#12365a" font-size="24" text-anchor="start">m=12：同一门只选一班，课程须依序学完</text><text x="118" y="88" fill="#12365a" font-size="18" text-anchor="middle">1</text><text x="165" y="88" fill="#12365a" font-size="18" text-anchor="middle">2</text><text x="212" y="88" fill="#12365a" font-size="18" text-anchor="middle">3</text><text x="259" y="88" fill="#12365a" font-size="18" text-anchor="middle">4</text><text x="306" y="88" fill="#12365a" font-size="18" text-anchor="middle">5</text><text x="353" y="88" fill="#12365a" font-size="18" text-anchor="middle">6</text><text x="400" y="88" fill="#12365a" font-size="18" text-anchor="middle">7</text><text x="447" y="88" fill="#12365a" font-size="18" text-anchor="middle">8</text><text x="494" y="88" fill="#12365a" font-size="18" text-anchor="middle">9</text><text x="541" y="88" fill="#12365a" font-size="18" text-anchor="middle">10</text><text x="588" y="88" fill="#12365a" font-size="18" text-anchor="middle">11</text><text x="635" y="88" fill="#12365a" font-size="18" text-anchor="middle">12</text><text x="24" y="143" fill="#12365a" font-size="20" text-anchor="start">课1</text><line x1="102" y1="136" x2="651" y2="136" stroke="#cbd5e1" stroke-width="1"/><rect x="102" y="116" width="126" height="39" rx="6" fill="#bbf7d0" stroke="#2563eb" stroke-width="2"/><text x="165.0" y="142" fill="#12365a" font-size="17" text-anchor="middle">[1,3]</text><text x="24" y="172" fill="#15803d" font-size="15" text-anchor="start">选：到3</text><text x="24" y="211" fill="#12365a" font-size="20" text-anchor="start">课1</text><line x1="102" y1="204" x2="651" y2="204" stroke="#cbd5e1" stroke-width="1"/><rect x="149" y="184" width="173" height="39" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="235.5" y="210" fill="#12365a" font-size="17" text-anchor="middle">[2,5]</text><text x="24" y="240" fill="#475569" font-size="15" text-anchor="start">可行但晚</text><text x="24" y="279" fill="#12365a" font-size="20" text-anchor="start">课2</text><line x1="102" y1="272" x2="651" y2="272" stroke="#cbd5e1" stroke-width="1"/><rect x="196" y="252" width="79" height="39" rx="6" fill="#fecaca" stroke="#2563eb" stroke-width="2"/><text x="235.5" y="278" fill="#12365a" font-size="17" text-anchor="middle">[3,4]</text><text x="24" y="308" fill="#475569" font-size="15" text-anchor="start">3不大于3</text><text x="24" y="347" fill="#12365a" font-size="20" text-anchor="start">课2</text><line x1="102" y1="340" x2="651" y2="340" stroke="#cbd5e1" stroke-width="1"/><rect x="243" y="320" width="314" height="39" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="400.0" y="346" fill="#12365a" font-size="17" text-anchor="middle">[4,10]</text><text x="24" y="376" fill="#475569" font-size="15" text-anchor="start">先记10</text><text x="24" y="415" fill="#12365a" font-size="20" text-anchor="start">课2</text><line x1="102" y1="408" x2="651" y2="408" stroke="#cbd5e1" stroke-width="1"/><rect x="337" y="388" width="79" height="39" rx="6" fill="#bbf7d0" stroke="#2563eb" stroke-width="2"/><text x="376.5" y="414" fill="#12365a" font-size="17" text-anchor="middle">[6,7]</text><text x="24" y="444" fill="#15803d" font-size="15" text-anchor="start">再改为7</text><text x="24" y="483" fill="#12365a" font-size="20" text-anchor="start">课3</text><line x1="102" y1="476" x2="651" y2="476" stroke="#cbd5e1" stroke-width="1"/><rect x="384" y="456" width="79" height="39" rx="6" fill="#fecaca" stroke="#2563eb" stroke-width="2"/><text x="423.5" y="482" fill="#12365a" font-size="17" text-anchor="middle">[7,8]</text><text x="24" y="512" fill="#475569" font-size="15" text-anchor="start">7不大于7</text><text x="24" y="551" fill="#12365a" font-size="20" text-anchor="start">课3</text><line x1="102" y1="544" x2="651" y2="544" stroke="#cbd5e1" stroke-width="1"/><rect x="431" y="524" width="79" height="39" rx="6" fill="#bbf7d0" stroke="#2563eb" stroke-width="2"/><text x="470.5" y="550" fill="#12365a" font-size="17" text-anchor="middle">[8,9]</text><text x="24" y="580" fill="#15803d" font-size="15" text-anchor="start">选：到9</text><text x="24" y="619" fill="#12365a" font-size="20" text-anchor="start">课3</text><line x1="102" y1="612" x2="651" y2="612" stroke="#cbd5e1" stroke-width="1"/><rect x="525" y="592" width="79" height="39" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="564.5" y="618" fill="#12365a" font-size="17" text-anchor="middle">[10,11]</text><text x="24" y="648" fill="#475569" font-size="15" text-anchor="start">可行但晚</text><text x="24" y="741" fill="#12365a" font-size="21" text-anchor="start">上课日期含两端：前课第3天结束，后课最早第4天开。</text><text x="24" y="792" fill="#12365a" font-size="22" text-anchor="start">第2课[6,7]比[4,10]后开，却更早完成。</text><text x="24" y="843" fill="#12365a" font-size="22" text-anchor="start">选择结束日3 → 7 → 9，最终最早第9天学完。</text></svg>