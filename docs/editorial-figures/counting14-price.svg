<svg xmlns="http://www.w3.org/2000/svg" width="640" height="958" viewBox="0 0 640 958" role="img"><title>真实异或块配对与27个表达式的首块分类</title><rect width="640" height="958" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#16867b"/></marker></defs><text x="24" y="35" class="title" text-anchor="start">3/6/5/2：配对抵消的是非首块</text><text x="24" y="74" class="small" text-anchor="start">异或先算；首块3 XOR 6=5，第二块5 XOR 2=7</text><rect x="40" y="112" width="200" height="47" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="140.0" y="142.5" class="" text-anchor="middle">3 XOR 6</text><text x="287" y="144" class="title" text-anchor="middle">−</text><rect x="335" y="112" width="200" height="47" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="435.0" y="142.5" class="" text-anchor="middle">5 XOR 2</text><text x="573" y="143" class="small" text-anchor="middle">=−2</text><text x="140" y="195" class="small" text-anchor="middle">首块+5</text><text x="435" y="195" class="small" text-anchor="middle">−7</text><rect x="40" y="222" width="200" height="47" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="140.0" y="252.5" class="" text-anchor="middle">3 XOR 6</text><text x="287" y="254" class="title" text-anchor="middle">+</text><rect x="335" y="222" width="200" height="47" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="435.0" y="252.5" class="" text-anchor="middle">5 XOR 2</text><text x="573" y="253" class="small" text-anchor="middle">=12</text><text x="140" y="305" class="small" text-anchor="middle">首块+5</text><text x="435" y="305" class="small" text-anchor="middle">+7</text><text x="24" y="348" class="" text-anchor="start">第二块−7/+7抵消；两式和仍为5+5=10</text><text x="24" y="395" class="" text-anchor="start">四种首块长度：实际前缀、值、表达式数、贡献</text><text x="30" y="439" class="small" text-anchor="start">L</text><text x="104" y="439" class="small" text-anchor="start">首块</text><text x="355" y="439" class="small" text-anchor="start">值</text><text x="443" y="439" class="small" text-anchor="start">数量</text><text x="548" y="439" class="small" text-anchor="start">贡献</text><text x="30" y="492" class="small" text-anchor="start">1</text><text x="83" y="492" class="small" text-anchor="start">3</text><text x="365" y="492" class="small" text-anchor="middle">3</text><text x="460" y="492" class="small" text-anchor="middle">18</text><text x="567" y="492" class="small" text-anchor="middle">54</text><text x="30" y="553" class="small" text-anchor="start">2</text><text x="83" y="553" class="small" text-anchor="start">3 XOR 6</text><text x="365" y="553" class="small" text-anchor="middle">5</text><text x="460" y="553" class="small" text-anchor="middle">6</text><text x="567" y="553" class="small" text-anchor="middle">30</text><text x="30" y="614" class="small" text-anchor="start">3</text><text x="83" y="614" class="small" text-anchor="start">3 XOR 6 XOR 5</text><text x="365" y="614" class="small" text-anchor="middle">0</text><text x="460" y="614" class="small" text-anchor="middle">2</text><text x="567" y="614" class="small" text-anchor="middle">0</text><text x="30" y="675" class="small" text-anchor="start">4</text><text x="83" y="675" class="small" text-anchor="start">3 XOR 6 XOR 5 XOR 2</text><text x="365" y="675" class="small" text-anchor="middle">2</text><text x="460" y="675" class="small" text-anchor="middle">1</text><text x="567" y="675" class="small" text-anchor="middle">2</text><text x="24" y="753" class="" text-anchor="start">数量18+6+2+1=27；总贡献54+30+0+2=86</text><rect x="24" y="782" width="592" height="139" rx="5" fill="#ffdf98" stroke="#7394aa"/><text x="44" y="819" class="" text-anchor="start">answer：0 → 3×0+2×3=6</text><text x="44" y="858" class="" text-anchor="start">→ 3×6+2×5=28 → 3×28+2×0=84</text><text x="44" y="897" class="" text-anchor="start">最后只加前缀2：84+2=86</text></svg>