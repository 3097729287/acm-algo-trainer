<svg xmlns="http://www.w3.org/2000/svg" width="760" height="837" viewBox="0 0 760 837" role="img"><title>实际三乘五全一矩阵，横段在第二行一到三三到五合并一到五，纵段在第四列一到三，黄色交点二四两计一扣，七格并集</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="38" fill="#17324d" font-size="24" text-anchor="start">每格花粉1；p=1；方向选横、横、竖</text><text x="32" y="129" fill="#17324d" font-size="18" text-anchor="start">行1</text><rect x="102" y="90" width="96" height="63" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="150" y="130" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="219" y="90" width="96" height="63" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="267" y="130" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="336" y="90" width="96" height="63" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="384" y="130" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="453" y="90" width="96" height="63" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="501" y="130" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="570" y="90" width="96" height="63" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="618" y="130" fill="#17324d" font-size="27" text-anchor="middle">1</text><text x="32" y="211" fill="#17324d" font-size="18" text-anchor="start">行2</text><rect x="102" y="172" width="96" height="63" rx="4" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="150" y="212" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="219" y="172" width="96" height="63" rx="4" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="267" y="212" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="336" y="172" width="96" height="63" rx="4" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="384" y="212" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="453" y="172" width="96" height="63" rx="4" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="501" y="212" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="570" y="172" width="96" height="63" rx="4" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="618" y="212" fill="#17324d" font-size="27" text-anchor="middle">1</text><text x="32" y="293" fill="#17324d" font-size="18" text-anchor="start">行3</text><rect x="102" y="254" width="96" height="63" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="150" y="294" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="219" y="254" width="96" height="63" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="267" y="294" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="336" y="254" width="96" height="63" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="384" y="294" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="453" y="254" width="96" height="63" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="501" y="294" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="570" y="254" width="96" height="63" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="618" y="294" fill="#17324d" font-size="27" text-anchor="middle">1</text><text x="150" y="72" fill="#17324d" font-size="18" text-anchor="middle">列1</text><text x="267" y="72" fill="#17324d" font-size="18" text-anchor="middle">列2</text><text x="384" y="72" fill="#17324d" font-size="18" text-anchor="middle">列3</text><text x="501" y="72" fill="#17324d" font-size="18" text-anchor="middle">列4</text><text x="618" y="72" fill="#17324d" font-size="18" text-anchor="middle">列5</text><text x="24" y="386" fill="#17324d" font-size="22" text-anchor="start">两条横段：行2，列[1,3]与[3,5]。</text><text x="24" y="439" fill="#17324d" font-size="22" text-anchor="start">合并H：行2，列[1,5]，共5格（蓝+黄）。</text><text x="24" y="492" fill="#17324d" font-size="22" text-anchor="start">纵段V：列4，行[1,3]，共3格（绿+黄）。</text><text x="24" y="558" fill="#17324d" font-size="23" text-anchor="start">交点(2,4)：1≤4≤5，且1≤2≤3。</text><text x="24" y="610" fill="#17324d" font-size="22" text-anchor="start">黄色格在两笔和里各一次，扣1后5+3−1=7。</text><text x="24" y="669" fill="#17324d" font-size="21" text-anchor="start">同向先合并，才能保证黄色格只被扣一次。</text><text x="24" y="731" fill="#17324d" font-size="21" text-anchor="start">p=0只覆盖(2,2)、(2,4)两格，达不到目标7。</text><text x="24" y="791" fill="#17324d" font-size="22" text-anchor="start">p=1已有方案覆盖7格，所以最小体力为1。</text></svg>