<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img"><title>12个整数分母在同轴被相邻约数切成不重叠半开段，返回12六四三二一，分母9依次退9八七六到可整除处，段长6贡献12，总41</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">n=12：每个分母在数轴上恰出现一次</text><text x="22" y="78" font-size="21" fill="#20334a" text-anchor="start">约数1、2、3、4、6、12；色段返回值恒定</text><rect x="42" y="120" width="54" height="66" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="69.0" y="160" font-size="19" fill="#20334a" text-anchor="middle">返12</text><rect x="96" y="120" width="54" height="66" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="123.0" y="160" font-size="19" fill="#20334a" text-anchor="middle">返6</text><rect x="150" y="120" width="54" height="66" rx="8" fill="#e9d5ff" stroke="#2d6db4" stroke-width="2"/><text x="177.0" y="160" font-size="19" fill="#20334a" text-anchor="middle">返4</text><rect x="204" y="120" width="108" height="66" rx="8" fill="#fef08a" stroke="#2d6db4" stroke-width="2"/><text x="258.0" y="160" font-size="19" fill="#20334a" text-anchor="middle">返3</text><rect x="312" y="120" width="324" height="66" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><text x="474.0" y="160" font-size="19" fill="#20334a" text-anchor="middle">返2</text><rect x="636" y="120" width="54" height="66" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="663.0" y="160" font-size="19" fill="#20334a" text-anchor="middle">返1</text><path d="M69 188 v20" stroke="#475569"/><text x="69" y="238" font-size="19" fill="#20334a" text-anchor="middle">1</text><path d="M123 188 v20" stroke="#475569"/><text x="123" y="238" font-size="19" fill="#20334a" text-anchor="middle">2</text><path d="M177 188 v20" stroke="#475569"/><text x="177" y="238" font-size="19" fill="#20334a" text-anchor="middle">3</text><path d="M231 188 v20" stroke="#475569"/><text x="231" y="238" font-size="19" fill="#20334a" text-anchor="middle">4</text><path d="M285 188 v20" stroke="#475569"/><text x="285" y="238" font-size="19" fill="#20334a" text-anchor="middle">5</text><path d="M339 188 v20" stroke="#475569"/><text x="339" y="238" font-size="19" fill="#20334a" text-anchor="middle">6</text><path d="M393 188 v20" stroke="#475569"/><text x="393" y="238" font-size="19" fill="#20334a" text-anchor="middle">7</text><path d="M447 188 v20" stroke="#475569"/><text x="447" y="238" font-size="19" fill="#20334a" text-anchor="middle">8</text><path d="M501 188 v20" stroke="#475569"/><text x="501" y="238" font-size="19" fill="#20334a" text-anchor="middle">9</text><path d="M555 188 v20" stroke="#475569"/><text x="555" y="238" font-size="19" fill="#20334a" text-anchor="middle">10</text><path d="M609 188 v20" stroke="#475569"/><text x="609" y="238" font-size="19" fill="#20334a" text-anchor="middle">11</text><path d="M663 188 v20" stroke="#475569"/><text x="663" y="238" font-size="19" fill="#20334a" text-anchor="middle">12</text><text x="22" y="295" font-size="21" fill="#20334a" text-anchor="start">b=9：试9 → 8 → 7 → 6；12%6=0，返回2。</text><text x="22" y="348" font-size="21" fill="#20334a" text-anchor="start">[6,12)含6/7/8/9/10/11；6个分母×2=12。</text><text x="22" y="401" font-size="21" fill="#20334a" text-anchor="start">b=12另返1，不能塞进前段再重复加。</text><text x="22" y="457" font-size="21" fill="#20334a" text-anchor="start">逐段：12 + 6 + 4 + 2×3 + 6×2 + 1 = 41</text><text x="22" y="513" font-size="20" fill="#20334a" text-anchor="start">相邻约数间没有别的停点，故整段返回相同值。</text><text x="22" y="566" font-size="20" fill="#20334a" text-anchor="start">n=1：只有最后一项，初始answer=1就是答案。</text></g></svg>