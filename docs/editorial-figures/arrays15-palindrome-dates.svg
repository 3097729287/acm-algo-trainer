<svg xmlns="http://www.w3.org/2000/svg" width="760" height="894" viewBox="0 0 760 894" role="img"><title>实际四种月份日期拼接框与对称位置连线：122一日可行123一日中段冲突120三位日零开头非法12月四位日uu21只有九种</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="38" fill="#17324d" font-size="23" text-anchor="start">每个框是一个十进制位置，竖线分月份和日期</text><text x="24" y="100" fill="#17324d" font-size="22" text-anchor="start">m=122，y=1</text><rect x="79" y="127" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="112" y="162" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="162" y="127" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="195" y="162" fill="#17324d" font-size="27" text-anchor="middle">2</text><rect x="245" y="127" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="278" y="162" fill="#17324d" font-size="27" text-anchor="middle">2</text><rect x="328" y="127" width="66" height="52" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="361" y="162" fill="#17324d" font-size="27" text-anchor="middle">1</text><line x1="319" y1="120" x2="319" y2="185" stroke="#17324d" stroke-width="3"/><path d="M112 180 V191 H361 V180" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M195 180 V199 H278 V180" fill="none" stroke="#b45309" stroke-width="2"/><text x="24" y="243" fill="#17324d" font-size="20" text-anchor="start">中间22相等，唯一日期1，贡献1</text><text x="24" y="280" fill="#17324d" font-size="22" text-anchor="start">m=123，y=1</text><rect x="79" y="307" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="112" y="342" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="162" y="307" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="195" y="342" fill="#17324d" font-size="27" text-anchor="middle">2</text><rect x="245" y="307" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="278" y="342" fill="#17324d" font-size="27" text-anchor="middle">3</text><rect x="328" y="307" width="66" height="52" rx="4" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="361" y="342" fill="#17324d" font-size="27" text-anchor="middle">1</text><line x1="319" y1="300" x2="319" y2="365" stroke="#17324d" stroke-width="3"/><path d="M112 360 V371 H361 V360" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M195 360 V379 H278 V360" fill="none" stroke="#b45309" stroke-width="2"/><text x="24" y="423" fill="#17324d" font-size="20" text-anchor="start">中间23不同，贡献0</text><text x="24" y="460" fill="#17324d" font-size="22" text-anchor="start">m=120，y=3</text><rect x="79" y="487" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="112" y="522" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="162" y="487" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="195" y="522" fill="#17324d" font-size="27" text-anchor="middle">2</text><rect x="245" y="487" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="278" y="522" fill="#17324d" font-size="27" text-anchor="middle">0</text><rect x="328" y="487" width="66" height="52" rx="4" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="361" y="522" fill="#17324d" font-size="27" text-anchor="middle">0</text><rect x="411" y="487" width="66" height="52" rx="4" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="444" y="522" fill="#17324d" font-size="27" text-anchor="middle">2</text><rect x="494" y="487" width="66" height="52" rx="4" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="527" y="522" fill="#17324d" font-size="27" text-anchor="middle">1</text><line x1="319" y1="480" x2="319" y2="545" stroke="#17324d" stroke-width="3"/><path d="M112 540 V551 H527 V540" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M195 540 V559 H444 V540" fill="none" stroke="#b45309" stroke-width="2"/><path d="M278 540 V567 H361 V540" fill="none" stroke="#9333ea" stroke-width="2"/><text x="24" y="603" fill="#17324d" font-size="20" text-anchor="start">日期首位0，不是三位日期，贡献0</text><text x="24" y="640" fill="#17324d" font-size="22" text-anchor="start">m=12，y=4</text><rect x="79" y="667" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="112" y="702" fill="#17324d" font-size="27" text-anchor="middle">1</text><rect x="162" y="667" width="66" height="52" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="195" y="702" fill="#17324d" font-size="27" text-anchor="middle">2</text><rect x="245" y="667" width="66" height="52" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="278" y="702" fill="#17324d" font-size="27" text-anchor="middle">u</text><rect x="328" y="667" width="66" height="52" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="361" y="702" fill="#17324d" font-size="27" text-anchor="middle">u</text><rect x="411" y="667" width="66" height="52" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="444" y="702" fill="#17324d" font-size="27" text-anchor="middle">2</text><rect x="494" y="667" width="66" height="52" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="527" y="702" fill="#17324d" font-size="27" text-anchor="middle">1</text><line x1="236" y1="660" x2="236" y2="725" stroke="#17324d" stroke-width="3"/><path d="M112 720 V731 H527 V720" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M195 720 V739 H444 V720" fill="none" stroke="#b45309" stroke-width="2"/><path d="M278 720 V747 H361 V720" fill="none" stroke="#9333ea" stroke-width="2"/><text x="24" y="783" fill="#17324d" font-size="20" text-anchor="start">u=1..9；两个u是同一选择，贡献9</text><text x="24" y="849" fill="#17324d" font-size="21" text-anchor="start">长日期例：1121 → 121121；2221 → 122221。</text></svg>