<svg xmlns="http://www.w3.org/2000/svg" width="720" height="565" viewBox="0 0 720 565" role="img"><title>固定选手一后，剩余决赛三四限制第二人，但候选四仍不能覆盖决赛二三</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="38" font-size="23" fill="#20334a" text-anchor="start">决赛边：(1,2)、(3,4)、(2,3)；固定先选 1</text><line x1="105" y1="130" x2="290" y2="130" stroke="#8995a5" stroke-width="3"/><line x1="475" y1="260" x2="645" y2="130" stroke="#2d6db4" stroke-width="3"/><line x1="290" y1="130" x2="475" y2="260" stroke="#2d6db4" stroke-width="3"/><circle cx="105" cy="130" r="29" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="105" y="139" font-size="26" fill="#20334a" text-anchor="middle">1</text><circle cx="290" cy="130" r="29" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="290" y="139" font-size="26" fill="#20334a" text-anchor="middle">2</text><circle cx="475" cy="260" r="29" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="475" y="269" font-size="26" fill="#20334a" text-anchor="middle">3</text><circle cx="645" cy="130" r="29" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="645" y="139" font-size="26" fill="#20334a" text-anchor="middle">4</text><text x="27" y="205" font-size="21" fill="#667488" text-anchor="start">(1,2) 已由 1 覆盖</text><text x="420" y="325" font-size="21" fill="#2d6db4" text-anchor="middle">剩余边 (3,4) 限制第二人</text><rect x="24" y="350" width="672" height="87" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="40" y="384" font-size="23" fill="#06613b" text-anchor="start">候选 {1,3}：每条边都碰到 1 或 3 → 计入</text><text x="40" y="417" font-size="21" fill="#20334a" text-anchor="start">边 (1,2) 由 1，边 (3,4)、(2,3) 由 3 覆盖</text><rect x="24" y="456" width="672" height="87" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="40" y="491" font-size="23" fill="#a32e36" text-anchor="start">候选 {1,4}：边 (2,3) 两端都没选 → 不计入</text><text x="40" y="524" font-size="21" fill="#20334a" text-anchor="start">从一条剩余边选端点，只得到候选，仍要检查全部边</text></g></svg>