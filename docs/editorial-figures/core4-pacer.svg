<svg xmlns="http://www.w3.org/2000/svg" width="620" height="480" viewBox="0 0 620 480" role="img"><title>四分钟停跑跑停的真实位置零零一零零，分段各有一次停留损失，得两分满足两次音频要求</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">m=4，要求时刻 2 在侧 1，时刻 4 在侧 0</text><text x="62" y="88" font-size="18" fill="#20334a" text-anchor="middle">时刻 0</text><circle cx="62" cy="137" r="22" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="62" y="145" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="186" y="88" font-size="18" fill="#20334a" text-anchor="middle">时刻 1</text><circle cx="186" cy="137" r="22" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="186" y="145" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="310" y="88" font-size="18" fill="#20334a" text-anchor="middle">时刻 2</text><circle cx="310" cy="137" r="22" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="310" y="145" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="434" y="88" font-size="18" fill="#20334a" text-anchor="middle">时刻 3</text><circle cx="434" cy="137" r="22" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="434" y="145" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="558" y="88" font-size="18" fill="#20334a" text-anchor="middle">时刻 4</text><circle cx="558" cy="137" r="22" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="558" y="145" font-size="25" fill="#20334a" text-anchor="middle">0</text><line x1="86" y1="137" x2="162" y2="137" stroke="#8995a5" stroke-width="2"/><text x="124.0" y="205" font-size="20" fill="#20334a" text-anchor="middle">停，0分</text><line x1="210" y1="137" x2="286" y2="137" stroke="#8995a5" stroke-width="2"/><text x="248.0" y="205" font-size="20" fill="#20334a" text-anchor="middle">跑，1分</text><line x1="334" y1="137" x2="410" y2="137" stroke="#8995a5" stroke-width="2"/><text x="372.0" y="205" font-size="20" fill="#20334a" text-anchor="middle">跑，1分</text><line x1="458" y1="137" x2="534" y2="137" stroke="#8995a5" stroke-width="2"/><text x="496.0" y="205" font-size="20" fill="#20334a" text-anchor="middle">停，0分</text><rect x="24" y="249" width="572" height="104" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="42" y="286" font-size="21" fill="#20334a" text-anchor="start">前段 L=2，par=1：2−((2 xor 1)&amp;1)=1</text><text x="42" y="328" font-size="21" fill="#20334a" text-anchor="start">后段也只能跑 1 次；合计 2 分，边界准确相接。</text><text x="24" y="405" font-size="21" fill="#20334a" text-anchor="start">动作发生在 [0,1)、[1,2)、[2,3)、[3,4)。</text><text x="24" y="448" font-size="21" fill="#20334a" text-anchor="start">时刻 4 已结束，不再计算下一分钟。</text></g></svg>