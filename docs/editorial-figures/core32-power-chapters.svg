<svg xmlns="http://www.w3.org/2000/svg" width="720" height="825" viewBox="0 0 720 825" role="img"><title>从初始100依三章经过100到120，再中弹到下限100补20回120，第三章补1000后在400封顶；扣与补之间的中间状态真实可达</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">同一角色从初始100开始：单位0.01</text><text x="22" y="78" font-size="21" fill="#20334a" text-anchor="start">每章先逐次中弹并修正下限，再逐点补充</text><text x="22" y="124" font-size="21" fill="#20334a" text-anchor="start">第一章 x=0,y=20</text><rect x="24" y="148" width="202" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="125" y="189" font-size="25" fill="#20334a" text-anchor="middle">100</text><text x="125" y="241" font-size="18" fill="#20334a" text-anchor="middle">章前</text><rect x="260" y="148" width="202" height="65" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="361" y="189" font-size="25" fill="#20334a" text-anchor="middle">100</text><text x="361" y="241" font-size="18" fill="#20334a" text-anchor="middle">中弹后，已修正</text><rect x="496" y="148" width="202" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="597" y="189" font-size="25" fill="#20334a" text-anchor="middle">120</text><text x="597" y="241" font-size="18" fill="#20334a" text-anchor="middle">补充后，已修正</text><path d="M125 259 v25" stroke="#64748b"/><text x="22" y="297" font-size="21" fill="#20334a" text-anchor="start">第二章 x=100,y=20</text><rect x="24" y="321" width="202" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="125" y="362" font-size="25" fill="#20334a" text-anchor="middle">120</text><text x="125" y="414" font-size="18" fill="#20334a" text-anchor="middle">章前</text><rect x="260" y="321" width="202" height="65" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="361" y="362" font-size="25" fill="#20334a" text-anchor="middle">100</text><text x="361" y="414" font-size="18" fill="#20334a" text-anchor="middle">中弹后，已修正</text><rect x="496" y="321" width="202" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="597" y="362" font-size="25" fill="#20334a" text-anchor="middle">120</text><text x="597" y="414" font-size="18" fill="#20334a" text-anchor="middle">补充后，已修正</text><path d="M125 432 v25" stroke="#64748b"/><text x="22" y="470" font-size="21" fill="#20334a" text-anchor="start">第三章 x=0,y=1000</text><rect x="24" y="494" width="202" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="125" y="535" font-size="25" fill="#20334a" text-anchor="middle">120</text><text x="125" y="587" font-size="18" fill="#20334a" text-anchor="middle">章前</text><rect x="260" y="494" width="202" height="65" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="361" y="535" font-size="25" fill="#20334a" text-anchor="middle">120</text><text x="361" y="587" font-size="18" fill="#20334a" text-anchor="middle">中弹后，已修正</text><rect x="496" y="494" width="202" height="65" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="597" y="535" font-size="25" fill="#20334a" text-anchor="middle">400</text><text x="597" y="587" font-size="18" fill="#20334a" text-anchor="middle">补充后，已修正</text><text x="22" y="681" font-size="21" fill="#20334a" text-anchor="start">第二章：120逐扣到100后保持，再+20回120。</text><text x="22" y="731" font-size="21" fill="#20334a" text-anchor="start">不能先算120−50+20=90，最后才夹成100。</text><text x="22" y="781" font-size="21" fill="#20334a" text-anchor="start">第三章到400后，其余P点不再改变火力。</text></g></svg>