<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1085" viewBox="0 0 1040 1085" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#718096"/></marker></defs><rect width="1040" height="1085" fill="#fbfcff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="28" y="42" font-size="28" fill="#18324f" text-anchor="start" font-weight="700">Gift：闭邻域给下界，环还可能要求更多颜色</text><text x="28" y="82" font-size="21" fill="#18324f" text-anchor="start">节点标为“编号:颜色”；实线是原无向边，虚线表示距离2的限制。</text><line x1="155" y1="171" x2="373" y2="171" stroke="#718096" stroke-width="3"/><line x1="373" y1="171" x2="265" y2="291" stroke="#718096" stroke-width="3"/><line x1="265" y1="291" x2="155" y2="171" stroke="#718096" stroke-width="3"/><line x1="98" y1="414" x2="265" y2="291" stroke="#718096" stroke-width="3"/><line x1="432" y1="414" x2="265" y2="291" stroke="#718096" stroke-width="3"/><circle cx="155" cy="171" r="31" fill="#d5e7ff" stroke="#2563a6" stroke-width="3"/><text x="155" y="179" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">1:1</text><circle cx="373" cy="171" r="31" fill="#ffe1aa" stroke="#2563a6" stroke-width="3"/><text x="373" y="179" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">2:2</text><circle cx="265" cy="291" r="31" fill="#e5d9fb" stroke="#2563a6" stroke-width="3"/><text x="265" y="299" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">3:3</text><circle cx="98" cy="414" r="31" fill="#d5f1e4" stroke="#2563a6" stroke-width="3"/><text x="98" y="422" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">4:4</text><circle cx="432" cy="414" r="31" fill="#ffd7df" stroke="#2563a6" stroke-width="3"/><text x="432" y="422" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">5:5</text><text x="27" y="470" font-size="20" fill="#18324f" text-anchor="start">p=[2,3,1,3,3]；节点3的闭邻域含全部5点。</text><text x="27" y="508" font-size="21" fill="#087f5b" text-anchor="start">任意两点距≤2 → Δ+1=5，五色恰好可行。</text><line x1="782.0" y1="151.0" x2="863.1143648163613" y2="400.64434522374273" stroke="#bf3348" stroke-width="2" stroke-dasharray="8 6"/><line x1="913.2457992487311" y1="246.35565477625727" x2="700.8856351836387" y2="400.64434522374273" stroke="#bf3348" stroke-width="2" stroke-dasharray="8 6"/><line x1="863.1143648163613" y1="400.64434522374273" x2="650.7542007512689" y2="246.35565477625727" stroke="#bf3348" stroke-width="2" stroke-dasharray="8 6"/><line x1="700.8856351836387" y1="400.64434522374273" x2="782.0" y2="151.0" stroke="#bf3348" stroke-width="2" stroke-dasharray="8 6"/><line x1="650.7542007512689" y1="246.35565477625727" x2="913.2457992487311" y2="246.35565477625727" stroke="#bf3348" stroke-width="2" stroke-dasharray="8 6"/><line x1="782.0" y1="151.0" x2="913.2457992487311" y2="246.35565477625727" stroke="#718096" stroke-width="3"/><line x1="913.2457992487311" y1="246.35565477625727" x2="863.1143648163613" y2="400.64434522374273" stroke="#718096" stroke-width="3"/><line x1="863.1143648163613" y1="400.64434522374273" x2="700.8856351836387" y2="400.64434522374273" stroke="#718096" stroke-width="3"/><line x1="700.8856351836387" y1="400.64434522374273" x2="650.7542007512689" y2="246.35565477625727" stroke="#718096" stroke-width="3"/><line x1="650.7542007512689" y1="246.35565477625727" x2="782.0" y2="151.0" stroke="#718096" stroke-width="3"/><circle cx="782.0" cy="151.0" r="31" fill="#d5e7ff" stroke="#2563a6" stroke-width="3"/><text x="782.0" y="159.0" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">1:1</text><circle cx="913.2457992487311" cy="246.35565477625727" r="31" fill="#ffe1aa" stroke="#2563a6" stroke-width="3"/><text x="913.2457992487311" y="254.35565477625727" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">2:2</text><circle cx="863.1143648163613" cy="400.64434522374273" r="31" fill="#e5d9fb" stroke="#2563a6" stroke-width="3"/><text x="863.1143648163613" y="408.64434522374273" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">3:3</text><circle cx="700.8856351836387" cy="400.64434522374273" r="31" fill="#d5f1e4" stroke="#2563a6" stroke-width="3"/><text x="700.8856351836387" y="408.64434522374273" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">4:4</text><circle cx="650.7542007512689" cy="246.35565477625727" r="31" fill="#ffd7df" stroke="#2563a6" stroke-width="3"/><text x="650.7542007512689" y="254.35565477625727" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">5:5</text><text x="595" y="470" font-size="21" fill="#18324f" text-anchor="start">纯五环：Δ+1=3，但每对点距≤2</text><text x="595" y="508" font-size="22" fill="#bf3348" text-anchor="start">仍必须5色，故需另取环下界。</text><rect x="28" y="543" width="984" height="112" rx="10" fill="#f2f6fb" stroke="#bac9db" stroke-width="2"/><text x="48" y="578" font-size="23" fill="#18324f" text-anchor="start">剥叶原入度 [1,1,3,0,0]；初始队列 [4,5]</text><text x="48" y="614" font-size="22" fill="#18324f" text-anchor="start">删4：ind[3] 3→2；删5：2→1；剩 1→2→3→1，环长3。</text><line x1="269.0" y1="704.0" x2="383.92922792280035" y2="759.3469991267661" stroke="#718096" stroke-width="3"/><line x1="383.92922792280035" y1="759.3469991267661" x2="412.3144030907281" y2="883.7105772915783" stroke="#718096" stroke-width="3"/><line x1="412.3144030907281" y1="883.7105772915783" x2="332.78090965028105" y2="983.4424235816556" stroke="#718096" stroke-width="3"/><line x1="332.78090965028105" y1="983.4424235816556" x2="205.21909034971895" y2="983.4424235816556" stroke="#718096" stroke-width="3"/><line x1="205.21909034971895" y1="983.4424235816556" x2="125.68559690927194" y2="883.7105772915783" stroke="#718096" stroke-width="3"/><line x1="125.68559690927194" y1="883.7105772915783" x2="154.0707720771996" y2="759.3469991267661" stroke="#718096" stroke-width="3"/><line x1="154.0707720771996" y1="759.3469991267661" x2="269.0" y2="704.0" stroke="#718096" stroke-width="3"/><circle cx="269.0" cy="704.0" r="31" fill="#d5e7ff" stroke="#2563a6" stroke-width="3"/><text x="269.0" y="712.0" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">1:1</text><circle cx="383.92922792280035" cy="759.3469991267661" r="31" fill="#ffe1aa" stroke="#2563a6" stroke-width="3"/><text x="383.92922792280035" y="767.3469991267661" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">2:2</text><circle cx="412.3144030907281" cy="883.7105772915783" r="31" fill="#e5d9fb" stroke="#2563a6" stroke-width="3"/><text x="412.3144030907281" y="891.7105772915783" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">3:3</text><circle cx="332.78090965028105" cy="983.4424235816556" r="31" fill="#d5e7ff" stroke="#2563a6" stroke-width="3"/><text x="332.78090965028105" y="991.4424235816556" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">4:1</text><circle cx="205.21909034971895" cy="983.4424235816556" r="31" fill="#ffe1aa" stroke="#2563a6" stroke-width="3"/><text x="205.21909034971895" y="991.4424235816556" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">5:2</text><circle cx="125.68559690927194" cy="883.7105772915783" r="31" fill="#e5d9fb" stroke="#2563a6" stroke-width="3"/><text x="125.68559690927194" y="891.7105772915783" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">6:3</text><circle cx="154.0707720771996" cy="759.3469991267661" r="31" fill="#d5f1e4" stroke="#2563a6" stroke-width="3"/><text x="154.0707720771996" y="767.3469991267661" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">7:4</text><text x="514" y="744" font-size="25" fill="#18324f" text-anchor="start" font-weight="700">七环四色：123 | 1234</text><text x="514" y="795" font-size="22" fill="#18324f" text-anchor="start">每块内部距离1、2都不同色。</text><text x="514" y="841" font-size="22" fill="#18324f" text-anchor="start">接缝前两色：2,3 或3,4</text><text x="514" y="887" font-size="22" fill="#18324f" text-anchor="start">接缝后两色：1,2</text><text x="514" y="933" font-size="21" fill="#087f5b" text-anchor="start">包括首尾接缝，距离1、2仍各异。</text><text x="28" y="1047" font-size="23" fill="#18324f" text-anchor="start">环先染好，再向外染树枝；不同连通块复用颜色，取最大值。</text></g></svg>