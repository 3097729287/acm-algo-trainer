<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img"><title>caylex六个原下标，a和e右侧两条切线，三段ca yle x的原首位置零二五分别转成C Y X</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">原姓名caylex：只取真实分段的首字符</text><text x="104" y="88" font-size="18" fill="#20334a" text-anchor="middle">0</text><rect x="70" y="105" width="68" height="52" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="104" y="141" font-size="26" fill="#20334a" text-anchor="middle">c</text><text x="204" y="88" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="170" y="105" width="68" height="52" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="204" y="141" font-size="26" fill="#20334a" text-anchor="middle">a</text><path d="M253 94 V174" stroke="#c2410c" stroke-width="4"/><text x="304" y="88" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="270" y="105" width="68" height="52" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="304" y="141" font-size="26" fill="#20334a" text-anchor="middle">y</text><text x="404" y="88" font-size="18" fill="#20334a" text-anchor="middle">3</text><rect x="370" y="105" width="68" height="52" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="404" y="141" font-size="26" fill="#20334a" text-anchor="middle">l</text><text x="504" y="88" font-size="18" fill="#20334a" text-anchor="middle">4</text><rect x="470" y="105" width="68" height="52" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="504" y="141" font-size="26" fill="#20334a" text-anchor="middle">e</text><path d="M553 94 V174" stroke="#c2410c" stroke-width="4"/><text x="604" y="88" font-size="18" fill="#20334a" text-anchor="middle">5</text><rect x="570" y="105" width="68" height="52" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="604" y="141" font-size="26" fill="#20334a" text-anchor="middle">x</text><text x="154" y="215" font-size="24" fill="#20334a" text-anchor="middle">ca</text><text x="404" y="215" font-size="24" fill="#20334a" text-anchor="middle">yle</text><text x="604" y="215" font-size="24" fill="#20334a" text-anchor="middle">x</text><text x="104" y="285" font-size="20" fill="#20334a" text-anchor="middle">下标0</text><rect x="72" y="310" width="64" height="48" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="104" y="344" font-size="25" fill="#20334a" text-anchor="middle">C</text><text x="304" y="285" font-size="20" fill="#20334a" text-anchor="middle">下标2</text><rect x="272" y="310" width="64" height="48" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="304" y="344" font-size="25" fill="#20334a" text-anchor="middle">Y</text><text x="604" y="285" font-size="20" fill="#20334a" text-anchor="middle">下标5</text><rect x="572" y="310" width="64" height="48" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="604" y="344" font-size="25" fill="#20334a" text-anchor="middle">X</text><text x="22" y="409" font-size="22" fill="#20334a" text-anchor="start">元音右侧是切线：a后接y，e后接x。</text><text x="22" y="453" font-size="20" fill="#20334a" text-anchor="start">原位置0天然为段首；其余段首的左邻才是元音。</text><text x="22" y="500" font-size="20" fill="#20334a" text-anchor="start">依次追加C、Y、X，得到CYX；不是取元音本身。</text></g></svg>