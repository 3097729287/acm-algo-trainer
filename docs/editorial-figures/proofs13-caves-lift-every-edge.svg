<svg xmlns="http://www.w3.org/2000/svg" width="720" height="798" viewBox="0 0 720 798" role="img"><title>八入口链颜色A B C A D C B E，同色缩成五点图含ABC环且B C重边去重；从D的BFS层D零AC一B二E三，实际五到四地面一，四到一地下零，一到二地面一，二到七地下零，七到八地面一，对应D A B E费用三</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">原树是一条真实链，同洞窟入口可相隔很远</text><circle cx="55" cy="105" r="21" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="55" y="112" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="55" y="155" font-size="20" fill="#20334a" text-anchor="middle">A</text><path d="M76 105 L121 105" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="142" cy="105" r="21" fill="#dcfce7" stroke="#285b87" stroke-width="2"/><text x="142" y="112" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="142" y="155" font-size="20" fill="#20334a" text-anchor="middle">B</text><path d="M163 105 L208 105" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="229" cy="105" r="21" fill="#fef3c7" stroke="#285b87" stroke-width="2"/><text x="229" y="112" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="229" y="155" font-size="20" fill="#20334a" text-anchor="middle">C</text><path d="M250 105 L295 105" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="316" cy="105" r="21" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="316" y="112" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="316" y="155" font-size="20" fill="#20334a" text-anchor="middle">A</text><path d="M337 105 L382 105" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="403" cy="105" r="21" fill="#fce7f3" stroke="#285b87" stroke-width="2"/><text x="403" y="112" font-size="21" fill="#20334a" text-anchor="middle">5</text><text x="403" y="155" font-size="20" fill="#20334a" text-anchor="middle">D</text><path d="M424 105 L469 105" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="490" cy="105" r="21" fill="#fef3c7" stroke="#285b87" stroke-width="2"/><text x="490" y="112" font-size="21" fill="#20334a" text-anchor="middle">6</text><text x="490" y="155" font-size="20" fill="#20334a" text-anchor="middle">C</text><path d="M511 105 L556 105" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="577" cy="105" r="21" fill="#dcfce7" stroke="#285b87" stroke-width="2"/><text x="577" y="112" font-size="21" fill="#20334a" text-anchor="middle">7</text><text x="577" y="155" font-size="20" fill="#20334a" text-anchor="middle">B</text><path d="M598 105 L643 105" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="664" cy="105" r="21" fill="#ede9fe" stroke="#285b87" stroke-width="2"/><text x="664" y="112" font-size="21" fill="#20334a" text-anchor="middle">8</text><text x="664" y="155" font-size="20" fill="#20334a" text-anchor="middle">E</text><path d="M179 267 L380 237" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 237 L380 385" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 385 L179 267" stroke="#64748b" stroke-width="3" fill="none"/><path d="M179 267 L179 425" stroke="#64748b" stroke-width="3" fill="none"/><path d="M179 425 L380 385" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 237 L593 237" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="179" cy="267" r="22" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="179" y="274" font-size="21" fill="#20334a" text-anchor="middle">A</text><text x="112" y="274" font-size="19" fill="#20334a" text-anchor="end">距离1</text><circle cx="380" cy="237" r="22" fill="#dcfce7" stroke="#285b87" stroke-width="2"/><text x="380" y="244" font-size="21" fill="#20334a" text-anchor="middle">B</text><text x="414" y="220" font-size="19" fill="#20334a" text-anchor="start">距离2</text><circle cx="380" cy="385" r="22" fill="#fef3c7" stroke="#285b87" stroke-width="2"/><text x="380" y="392" font-size="21" fill="#20334a" text-anchor="middle">C</text><text x="414" y="418" font-size="19" fill="#20334a" text-anchor="start">距离1</text><circle cx="179" cy="425" r="22" fill="#fce7f3" stroke="#285b87" stroke-width="2"/><text x="179" y="432" font-size="21" fill="#20334a" text-anchor="middle">D</text><text x="112" y="432" font-size="19" fill="#20334a" text-anchor="end">距离0</text><circle cx="593" cy="237" r="22" fill="#ede9fe" stroke="#285b87" stroke-width="2"/><text x="593" y="244" font-size="21" fill="#20334a" text-anchor="middle">E</text><text x="593" y="291" font-size="19" fill="#20334a" text-anchor="middle">距离3</text><text x="22" y="533" font-size="20" fill="#20334a" text-anchor="start">缩点A—B—C—A成环；两条B—C道路合成一条</text><text x="22" y="580" font-size="22" fill="#20334a" text-anchor="start">问5→8：实际5→4 ⇝1→2 ⇝7→8</text><text x="22" y="627" font-size="21" fill="#20334a" text-anchor="start">箭头→每次地面费用1；⇝同洞窟费用0</text><text x="22" y="674" font-size="21" fill="#20334a" text-anchor="start">对应D→A→B→E，总费用3；BFS也得3</text><text x="22" y="721" font-size="20" fill="#20334a" text-anchor="start">同一起点洞窟用一趟BFS；例如1和4都属于A</text><text x="22" y="768" font-size="21" fill="#20334a" text-anchor="start">问3→6为0；问1→7为1，均可实际走出</text></g></svg>