<svg xmlns="http://www.w3.org/2000/svg" width="640" height="755" viewBox="0 0 640 755" role="img"><title>AB网格四次实际移动与同格两种未来</title><rect width="640" height="755" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#16867b"/></marker></defs><text x="24" y="35" class="title" text-anchor="start">K=3：四次移动，经过五个字符</text><text x="24" y="75" class="small" text-anchor="start">网格第一行AA、第二行BB；起点在左上角</text><text x="170" y="119" class="small" text-anchor="middle">第1列</text><text x="450" y="119" class="small" text-anchor="middle">第2列</text><text x="24" y="199" class="small" text-anchor="start">行1</text><text x="24" y="419" class="small" text-anchor="start">行2</text><rect x="80" y="140" width="180" height="120" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="170" y="183" class="title" text-anchor="middle">A</text><text x="170" y="228" class="small" text-anchor="middle">起点：A1 → A3</text><rect x="360" y="140" width="180" height="120" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="450" y="183" class="title" text-anchor="middle">A</text><text x="450" y="228" class="small" text-anchor="middle">第1步：A2</text><rect x="80" y="360" width="180" height="120" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="170" y="403" class="title" text-anchor="middle">B</text><text x="170" y="448" class="small" text-anchor="middle">第3步：B1</text><rect x="360" y="360" width="180" height="120" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="450" y="403" class="title" text-anchor="middle">B</text><text x="450" y="448" class="small" text-anchor="middle">第4步：B2 / 终点</text><line x1="269" y1="177" x2="350" y2="177" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="309" y="158" class="small" text-anchor="middle">1 右</text><line x1="350" y1="230" x2="269" y2="230" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="309" y="255" class="small" text-anchor="middle">2 左</text><line x1="170" y1="272" x2="170" y2="349" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="205" y="315" class="small" text-anchor="start">3 下</text><line x1="270" y1="419" x2="350" y2="419" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="310" y="398" class="small" text-anchor="middle">4 右</text><text x="24" y="538" class="" text-anchor="start">实际字符：A1 → A2 → A3 → B1 → B2</text><text x="24" y="583" class="" text-anchor="start">段内下标：0 → 1 → 2 → 0 → 1</text><text x="24" y="628" class="" text-anchor="start">实际编码：0 → 4 → 2 → 6 → 10</text><text x="24" y="678" class="" text-anchor="start">同一左上格：A1后还要A；A3后必须B</text><text x="24" y="720" class="" text-anchor="start">B2已经到终点，不需要再走到B3</text></svg>