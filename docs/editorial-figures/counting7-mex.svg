<svg xmlns="http://www.w3.org/2000/svg" width="640" height="593" viewBox="0 0 640 593" role="img"><title>Mixing MEXes：四个源位置目标三元组与修正项贡献</title><rect width="640" height="593" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">A中两个零位置，各自选择B或C：四次独立操作</text><text x="24" y="75" class="small" text-anchor="start">A=[0,0,1]  MEX2；B=[1,2] MEX0；C=[0,2] MEX1</text><text x="24" y="115" class="small" text-anchor="start">每次从原数组重来；原总和S=3</text><rect x="24" y="143" width="165" height="44" rx="5" fill="#fff1a8" stroke="#7394aa"/><text x="106" y="172" class="" text-anchor="middle">(A,1,B)</text><line x1="196" y1="166" x2="266" y2="166" stroke="#168377" stroke-width="3" stroke-dasharray=""/><text x="287" y="172" class="" text-anchor="start">2 + 3 + 1 = 6</text><rect x="24" y="205" width="165" height="44" rx="5" fill="#fff1a8" stroke="#7394aa"/><text x="106" y="234" class="" text-anchor="middle">(A,1,C)</text><line x1="196" y1="228" x2="266" y2="228" stroke="#168377" stroke-width="3" stroke-dasharray=""/><text x="287" y="234" class="" text-anchor="start">2 + 0 + 1 = 3</text><rect x="24" y="267" width="165" height="44" rx="5" fill="#fff1a8" stroke="#7394aa"/><text x="106" y="296" class="" text-anchor="middle">(A,2,B)</text><line x1="196" y1="290" x2="266" y2="290" stroke="#168377" stroke-width="3" stroke-dasharray=""/><text x="287" y="296" class="" text-anchor="start">2 + 3 + 1 = 6</text><rect x="24" y="329" width="165" height="44" rx="5" fill="#fff1a8" stroke="#7394aa"/><text x="106" y="358" class="" text-anchor="middle">(A,2,C)</text><line x1="196" y1="352" x2="266" y2="352" stroke="#168377" stroke-width="3" stroke-dasharray=""/><text x="287" y="358" class="" text-anchor="start">2 + 0 + 1 = 3</text><text x="24" y="438" class="small" text-anchor="start">corr[0]=3（B补0）；corr[1]=2（C补1）</text><text x="24" y="477" class="small" text-anchor="start">corr[2]=1（A补2）；源A不在corr[0]里</text><text x="24" y="523" class="" text-anchor="start">一个源零：2×(3−2+2)+3 = 9</text><text x="24" y="563" class="" text-anchor="start">两个原位置：c×inner = 2×9 = 18 = 6+3+6+3</text></svg>