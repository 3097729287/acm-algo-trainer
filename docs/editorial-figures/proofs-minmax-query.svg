<svg xmlns="http://www.w3.org/2000/svg" width="720" height="515" viewBox="0 0 720 515" role="img"><title>查询位置二到七的四个真实树区间及每段极值，保存旧值后交换位置二三</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="36" font-size="23" fill="#20334a" text-anchor="start">P=[3,1,8,2,7,4,6,5]；查询位置闭区间 [2,7]</text><rect x="109" y="65" width="76" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="147.0" y="93" font-size="18" fill="#20334a" text-anchor="middle">[2,2]</text><rect x="195" y="65" width="162" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="276.0" y="93" font-size="18" fill="#20334a" text-anchor="middle">[3,4]</text><rect x="367" y="65" width="162" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="448.0" y="93" font-size="18" fill="#20334a" text-anchor="middle">[5,6]</text><rect x="539" y="65" width="76" height="42" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="577.0" y="93" font-size="18" fill="#20334a" text-anchor="middle">[7,7]</text><text x="61" y="138" font-size="18" fill="#20334a" text-anchor="middle">位置1</text><rect x="23" y="154" width="76" height="60" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="61" y="194" font-size="28" fill="#20334a" text-anchor="middle">3</text><text x="147" y="138" font-size="18" fill="#20334a" text-anchor="middle">位置2</text><rect x="109" y="154" width="76" height="60" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="147" y="194" font-size="28" fill="#20334a" text-anchor="middle">1</text><text x="233" y="138" font-size="18" fill="#20334a" text-anchor="middle">位置3</text><rect x="195" y="154" width="76" height="60" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="233" y="194" font-size="28" fill="#20334a" text-anchor="middle">8</text><text x="319" y="138" font-size="18" fill="#20334a" text-anchor="middle">位置4</text><rect x="281" y="154" width="76" height="60" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="319" y="194" font-size="28" fill="#20334a" text-anchor="middle">2</text><text x="405" y="138" font-size="18" fill="#20334a" text-anchor="middle">位置5</text><rect x="367" y="154" width="76" height="60" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="405" y="194" font-size="28" fill="#20334a" text-anchor="middle">7</text><text x="491" y="138" font-size="18" fill="#20334a" text-anchor="middle">位置6</text><rect x="453" y="154" width="76" height="60" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="491" y="194" font-size="28" fill="#20334a" text-anchor="middle">4</text><text x="577" y="138" font-size="18" fill="#20334a" text-anchor="middle">位置7</text><rect x="539" y="154" width="76" height="60" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="577" y="194" font-size="28" fill="#20334a" text-anchor="middle">6</text><text x="663" y="138" font-size="18" fill="#20334a" text-anchor="middle">位置8</text><rect x="625" y="154" width="76" height="60" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="663" y="194" font-size="28" fill="#20334a" text-anchor="middle">5</text><text x="24" y="254" font-size="21" fill="#20334a" text-anchor="start">四段恰好覆盖 [2,7]；1@2 表示“值1在位置2”</text><text x="24" y="299" font-size="23" fill="#087b48" text-anchor="start">最小候选：1@2、2@4、4@6、6@7 → 1@2</text><text x="24" y="342" font-size="23" fill="#2d6db4" text-anchor="start">最大候选：1@2、8@3、7@5、6@7 → 8@3</text><rect x="22" y="370" width="676" height="123" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="40" y="410" font-size="21" fill="#20334a" text-anchor="start">先保存旧值：rmn=1，rmnp=2，rmx=8，rmxp=3</text><text x="40" y="450" font-size="23" fill="#20334a" text-anchor="start">写位置2←8，位置3←1；其它位置不动</text><text x="40" y="481" font-size="22" fill="#06613b" text-anchor="start">结果：[3,8,1,2,7,4,6,5]</text></g></svg>