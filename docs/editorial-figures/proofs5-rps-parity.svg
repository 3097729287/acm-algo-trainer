<svg xmlns="http://www.w3.org/2000/svg" width="720" height="665" viewBox="0 0 720 665" role="img"><title>两组真实首尾相接的手势圆环，奇数九人用三种单赢家块，偶数十二人调低一个两两和容量并把剩余布放在块间，分别达到三和四个赢家</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="21" fill="#20334a" text-anchor="start">R=石头，S=剪刀，P=布；★表示所选赢家，首尾相接</text><text x="22" y="85" font-size="23" fill="#20334a" text-anchor="start">奇数总人数：(a,b,c)=(3,3,3)</text><rect x="22" y="118" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="46" y="148" font-size="23" fill="#20334a" text-anchor="middle">S</text><text x="46" y="175" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="78" y="118" width="49" height="68" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="102" y="148" font-size="23" fill="#20334a" text-anchor="middle">R</text><text x="102" y="175" font-size="18" fill="#20334a" text-anchor="middle">★</text><rect x="134" y="118" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="158" y="148" font-size="23" fill="#20334a" text-anchor="middle">S</text><text x="158" y="175" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="190" y="118" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="214" y="148" font-size="23" fill="#20334a" text-anchor="middle">P</text><text x="214" y="175" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="246" y="118" width="49" height="68" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="270" y="148" font-size="23" fill="#20334a" text-anchor="middle">S</text><text x="270" y="175" font-size="18" fill="#20334a" text-anchor="middle">★</text><rect x="302" y="118" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="326" y="148" font-size="23" fill="#20334a" text-anchor="middle">P</text><text x="326" y="175" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="358" y="118" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="382" y="148" font-size="23" fill="#20334a" text-anchor="middle">R</text><text x="382" y="175" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="414" y="118" width="49" height="68" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="438" y="148" font-size="23" fill="#20334a" text-anchor="middle">P</text><text x="438" y="175" font-size="18" fill="#20334a" text-anchor="middle">★</text><rect x="470" y="118" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="494" y="148" font-size="23" fill="#20334a" text-anchor="middle">R</text><text x="494" y="175" font-size="18" fill="#20334a" text-anchor="middle">·</text><text x="22" y="231" font-size="21" fill="#20334a" text-anchor="start">x=y=z=1，三块各消耗“1名赢家+2名邻居”</text><text x="22" y="307" font-size="23" fill="#20334a" text-anchor="start">偶数总人数：(a,b,c)=(4,4,4)</text><rect x="22" y="340" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="46" y="370" font-size="23" fill="#20334a" text-anchor="middle">S</text><text x="46" y="397" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="78" y="340" width="49" height="68" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="102" y="370" font-size="23" fill="#20334a" text-anchor="middle">R</text><text x="102" y="397" font-size="18" fill="#20334a" text-anchor="middle">★</text><rect x="134" y="340" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="158" y="370" font-size="23" fill="#20334a" text-anchor="middle">S</text><text x="158" y="397" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="190" y="340" width="49" height="68" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="214" y="370" font-size="23" fill="#20334a" text-anchor="middle">R</text><text x="214" y="397" font-size="18" fill="#20334a" text-anchor="middle">★</text><rect x="246" y="340" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="270" y="370" font-size="23" fill="#20334a" text-anchor="middle">S</text><text x="270" y="397" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="302" y="340" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="326" y="370" font-size="23" fill="#20334a" text-anchor="middle">P</text><text x="326" y="397" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="358" y="340" width="49" height="68" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="382" y="370" font-size="23" fill="#20334a" text-anchor="middle">S</text><text x="382" y="397" font-size="18" fill="#20334a" text-anchor="middle">★</text><rect x="414" y="340" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="438" y="370" font-size="23" fill="#20334a" text-anchor="middle">P</text><text x="438" y="397" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="470" y="340" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="494" y="370" font-size="23" fill="#20334a" text-anchor="middle">R</text><text x="494" y="397" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="526" y="340" width="49" height="68" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="550" y="370" font-size="23" fill="#20334a" text-anchor="middle">P</text><text x="550" y="397" font-size="18" fill="#20334a" text-anchor="middle">★</text><rect x="582" y="340" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="606" y="370" font-size="23" fill="#20334a" text-anchor="middle">R</text><text x="606" y="397" font-size="18" fill="#20334a" text-anchor="middle">·</text><rect x="638" y="340" width="49" height="68" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="662" y="370" font-size="23" fill="#20334a" text-anchor="middle">P</text><text x="662" y="397" font-size="18" fill="#20334a" text-anchor="middle">·</text><text x="22" y="453" font-size="21" fill="#20334a" text-anchor="start">x=2,y=1,z=1；余下1个P放在块间，不触碰★邻居</text><text x="22" y="553" font-size="22" fill="#20334a" text-anchor="start">三型：x+z≤a−1，x+y≤b−1，y+z≤c−1</text><text x="22" y="598" font-size="21" fill="#20334a" text-anchor="start">总数9时解得3个赢家；总数12时将第三个容量3降到2</text><text x="22" y="640" font-size="21" fill="#20334a" text-anchor="start">得到 x=2,y=1,z=1，共4=⌊(12−3)/2⌋；具体圆环如上</text></g></svg>