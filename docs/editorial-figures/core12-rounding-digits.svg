<svg xmlns="http://www.w3.org/2000/svg" width="660" height="550" viewBox="0 0 660 550" role="img"><title>四十九点七五乘二后的倒序数组零五九九，小数第一位五触发整数九九逐位进一成一百</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="34" font-size="21" fill="#20334a" text-anchor="start">49.75 ×2 =99.50；D=4975，f=2，X=9950</text><text x="24" y="80" font-size="21" fill="#20334a" text-anchor="start">倒序数组下标向右增加；整数需从高到低读</text><text x="105" y="123" font-size="20" fill="#20334a" text-anchor="middle">a[0]</text><rect x="60" y="139" width="90" height="65" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="105" y="183" font-size="30" fill="#20334a" text-anchor="middle">0</text><text x="251" y="123" font-size="20" fill="#20334a" text-anchor="middle">a[1]</text><rect x="206" y="139" width="90" height="65" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="251" y="183" font-size="30" fill="#20334a" text-anchor="middle">5</text><text x="397" y="123" font-size="20" fill="#20334a" text-anchor="middle">a[2]</text><rect x="352" y="139" width="90" height="65" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="397" y="183" font-size="30" fill="#20334a" text-anchor="middle">9</text><text x="543" y="123" font-size="20" fill="#20334a" text-anchor="middle">a[3]</text><rect x="498" y="139" width="90" height="65" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="543" y="183" font-size="30" fill="#20334a" text-anchor="middle">9</text><text x="24" y="249" font-size="22" fill="#20334a" text-anchor="start">小数第一位a[f−1]=a[1]=5，触发进一。</text><text x="24" y="291" font-size="20" fill="#20334a" text-anchor="start">整数读取a[3]、a[2]，得到99；小数低位全部丢弃。</text><rect x="34" y="325" width="116" height="56" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="92" y="362" font-size="27" fill="#20334a" text-anchor="middle">99</text><text x="171" y="361" font-size="23" fill="#20334a" text-anchor="middle">→</text><rect x="191" y="325" width="116" height="56" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="249" y="362" font-size="27" fill="#20334a" text-anchor="middle">90</text><text x="328" y="361" font-size="23" fill="#20334a" text-anchor="middle">→</text><rect x="348" y="325" width="116" height="56" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="406" y="362" font-size="27" fill="#20334a" text-anchor="middle">00</text><text x="485" y="361" font-size="23" fill="#20334a" text-anchor="middle">→</text><rect x="505" y="325" width="116" height="56" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="563" y="362" font-size="27" fill="#20334a" text-anchor="middle">100</text><text x="24" y="433" font-size="22" fill="#20334a" text-anchor="start">两次尾部九变零，再补最高一，输出100。</text><text x="24" y="477" font-size="20" fill="#20334a" text-anchor="start">0.005×2：f=3却只有两位10，隐含首小数位为0。</text><text x="24" y="519" font-size="20" fill="#20334a" text-anchor="start">0.25×2：位数=f=2，a[1]=5，必须允许等号并进1。</text></g></svg>