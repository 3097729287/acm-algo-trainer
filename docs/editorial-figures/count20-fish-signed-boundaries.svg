<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#718096"/></marker></defs><rect width="1040" height="900" fill="#fbfcff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="28" y="42" font-size="29" fill="#18324f" text-anchor="start" font-weight="700">负数分界按出现位置匹配，不能按数值排序</text><text x="28" y="84" font-size="22" fill="#18324f" text-anchor="start">a 与 b 总和都为2；绿色两处保留，红色一删一插。</text><text x="32" y="175" font-size="25" fill="#18324f" text-anchor="start" font-weight="700">原 a</text><rect x="130" y="130" width="188" height="65" rx="10" fill="#f1f6ff" stroke="#bac9db" stroke-width="2"/><text x="225.0" y="173" font-size="27" fill="#18324f" text-anchor="middle" font-weight="700">2</text><rect x="320" y="130" width="188" height="65" rx="10" fill="#f1f6ff" stroke="#bac9db" stroke-width="2"/><text x="415.0" y="173" font-size="27" fill="#18324f" text-anchor="middle" font-weight="700">-1</text><rect x="510" y="130" width="188" height="65" rx="10" fill="#f1f6ff" stroke="#bac9db" stroke-width="2"/><text x="605.0" y="173" font-size="27" fill="#18324f" text-anchor="middle" font-weight="700">2</text><rect x="700" y="130" width="188" height="65" rx="10" fill="#f1f6ff" stroke="#bac9db" stroke-width="2"/><text x="795.0" y="173" font-size="27" fill="#18324f" text-anchor="middle" font-weight="700">-1</text><line x1="320" y1="127" x2="320" y2="213" stroke="#087f5b" stroke-width="4"/><text x="320" y="245" font-size="22" fill="#087f5b" text-anchor="middle" font-weight="700">A1: 2</text><line x1="510" y1="127" x2="510" y2="213" stroke="#087f5b" stroke-width="4"/><text x="510" y="245" font-size="22" fill="#087f5b" text-anchor="middle" font-weight="700">A2: 1</text><line x1="700" y1="127" x2="700" y2="213" stroke="#bf3348" stroke-width="4"/><text x="700" y="245" font-size="22" fill="#bf3348" text-anchor="middle" font-