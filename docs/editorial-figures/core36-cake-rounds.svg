<svg xmlns="http://www.w3.org/2000/svg" width="760" height="814" viewBox="0 0 760 814" role="img"><title>同一二乘四矩阵零一零一和一零一零，路线零基零一二三沿首行向右，四五六七沿次行向左，先吃三格一颗再吃三格两颗，六号零阻止下一轮</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#153655" font-size="24" text-anchor="start">同一2×4蛋糕，d=3：轮内的0也要吃</text><rect x="58" y="107" width="112" height="94" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="114" y="145" fill="#153655" font-size="20" text-anchor="middle">(1,1)</text><text x="114" y="180" fill="#153655" font-size="25" text-anchor="middle">值0</text><text x="114" y="233" fill="#153655" font-size="20" text-anchor="middle">p=0</text><line x1="175" y1="153" x2="213" y2="153" stroke="#475569" stroke-width="3"/><rect x="221" y="107" width="112" height="94" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="277" y="145" fill="#153655" font-size="20" text-anchor="middle">(1,2)</text><text x="277" y="180" fill="#153655" font-size="25" text-anchor="middle">值1</text><text x="277" y="233" fill="#153655" font-size="20" text-anchor="middle">p=1</text><line x1="338" y1="153" x2="376" y2="153" stroke="#475569" stroke-width="3"/><rect x="384" y="107" width="112" height="94" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="440" y="145" fill="#153655" font-size="20" text-anchor="middle">(1,3)</text><text x="440" y="180" fill="#153655" font-size="25" text-anchor="middle">值0</text><text x="440" y="233" fill="#153655" font-size="20" text-anchor="middle">p=2</text><line x1="501" y1="153" x2="539" y2="153" stroke="#475569" stroke-width="3"/><rect x="547" y="107" width="112" height="94" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="603" y="145" fill="#153655" font-size="20" text-anchor="middle">(1,4)</text><text x="603" y="180" fill="#153655" font-size="25" text-anchor="middle">值1</text><text x="603" y="233" fill="#153655" font-size="20" text-anchor="middle">p=3</text><rect x="58" y="258" width="112" height="94" rx="5" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/><text x="114" y="296" fill="#153655" font-size="20" text-anchor="middle">(2,1)</text><text x="114" y="331" fill="#153655" font-size="25" text-anchor="middle">值1</text><text x="114" y="384" fill="#153655" font-size="20" text-anchor="middle">p=7</text><line x1="175" y1="304" x2="213" y2="304" stroke="#475569" stroke-width="3"/><rect x="221" y="258" width="112" height="94" rx="5" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/><text x="277" y="296" fill="#153655" font-size="20" text-anchor="middle">(2,2)</text><text x="277" y="331" fill="#153655" font-size="25" text-anchor="middle">值0</text><text x="277" y="384" fill="#153655" font-size="20" text-anchor="middle">p=6</text><line x1="338" y1="304" x2="376" y2="304" stroke="#475569" stroke-width="3"/><rect x="384" y="258" width="112" height="94" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="440" y="296" fill="#153655" font-size="20" text-anchor="middle">(2,3)</text><text x="440" y="331" fill="#153655" font-size="25" text-anchor="middle">值1</text><text x="440" y="384" fill="#153655" font-size="20" text-anchor="middle">p=5</text><line x1="501" y1="304" x2="539" y2="304" stroke="#475569" stroke-width="3"/><rect x="547" y="258" width="112" height="94" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="603" y="296" fill="#153655" font-size="20" text-anchor="middle">(2,4)</text><text x="603" y="331" fill="#153655" font-size="25" text-anchor="middle">值0</text><text x="603" y="384" fill="#153655" font-size="20" text-anchor="middle">p=4</text><line x1="658" y1="201" x2="658" y2="258" stroke="#475569" stroke-width="4"/><text x="24" y="462" fill="#153655" font-size="23" text-anchor="start">路线值：0 / 1 / 0 | 1 / 0 / 1 | 0 / 1</text><text x="24" y="524" fill="#153655" font-size="22" text-anchor="start">第一轮p=0..2：无条件开始，吃到1颗。</text><text x="24" y="582" fill="#153655" font-size="21" text-anchor="start">第二轮首p=3的值1：允许吃p=3..5，得2颗。</text><text x="24" y="640" fill="#153655" font-size="22" text-anchor="start">p=4虽为0仍吃；下一轮首p=6为0，才停。</text><text x="24" y="703" fill="#153655" font-size="22" text-anchor="start">最终1+2=3颗；p=7的草莓没有吃到。</text><text x="24" y="768" fill="#153655" font-size="22" text-anchor="start">p=5：商1、余1 → 第2行、第3列。</text></svg>