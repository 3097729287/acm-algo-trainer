<svg xmlns="http://www.w3.org/2000/svg" width="760" height="790" viewBox="0 0 760 790" role="img"><title>角色身份固定的三次合法移牌0一四到一零四到二零三到三零二，与先取乙只到二一二对照</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#12365a" font-size="24" text-anchor="start">自己0，甲1，乙4：每条箭头只移一张牌</text><text x="270" y="85" fill="#12365a" font-size="23" text-anchor="middle">自己</text><text x="444" y="85" fill="#12365a" font-size="23" text-anchor="middle">甲</text><text x="618" y="85" fill="#12365a" font-size="23" text-anchor="middle">乙</text><text x="24" y="152" fill="#12365a" font-size="22" text-anchor="start">开始</text><rect x="210" y="112" width="120" height="65" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="270" y="155" fill="#12365a" font-size="29" text-anchor="middle">0</text><rect x="384" y="112" width="120" height="65" rx="7" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="444" y="155" fill="#12365a" font-size="29" text-anchor="middle">1</text><rect x="558" y="112" width="120" height="65" rx="7" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="618" y="155" fill="#12365a" font-size="29" text-anchor="middle">4</text><text x="260" y="214" fill="#12365a" font-size="20" text-anchor="start">↓ 自己+1；被选者−1</text><text x="24" y="277" fill="#12365a" font-size="22" text-anchor="start">从甲取1</text><rect x="210" y="237" width="120" height="65" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="270" y="280" fill="#12365a" font-size="29" text-anchor="middle">1</text><rect x="384" y="237" width="120" height="65" rx="7" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="444" y="280" fill="#12365a" font-size="29" text-anchor="middle">0</text><rect x="558" y="237" width="120" height="65" rx="7" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="618" y="280" fill="#12365a" font-size="29" text-anchor="middle">4</text><text x="260" y="339" fill="#12365a" font-size="20" text-anchor="start">↓ 自己+1；被选者−1</text><text x="24" y="402" fill="#12365a" font-size="22" text-anchor="start">从乙取1</text><rect x="210" y="362" width="120" height="65" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="270" y="405" fill="#12365a" font-size="29" text-anchor="middle">2</text><rect x="384" y="362" width="120" height="65" rx="7" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="444" y="405" fill="#12365a" font-size="29" text-anchor="middle">0</text><rect x="558" y="362" width="120" height="65" rx="7" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="618" y="405" fill="#12365a" font-size="29" text-anchor="middle">3</text><text x="260" y="464" fill="#12365a" font-size="20" text-anchor="start">↓ 自己+1；被选者−1</text><text x="24" y="527" fill="#12365a" font-size="22" text-anchor="start">再从乙取1</text><rect x="210" y="487" width="120" height="65" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="270" y="530" fill="#12365a" font-size="29" text-anchor="middle">3</text><rect x="384" y="487" width="120" height="65" rx="7" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="444" y="530" fill="#12365a" font-size="29" text-anchor="middle">0</text><rect x="558" y="487" width="120" height="65" rx="7" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="618" y="530" fill="#12365a" font-size="29" text-anchor="middle">2</text><text x="24" y="635" fill="#12365a" font-size="22" text-anchor="start">与乙开始：1对4 → 2对3 → 3对2，恰取2张。</text><text x="24" y="688" fill="#12365a" font-size="22" text-anchor="start">先取乙：0/1/4 → 1/1/3 → 2/1/2，只到2。</text><text x="24" y="741" fill="#12365a" font-size="22" text-anchor="start">先处理甲保住机会，真实最优终态3/0/2。</text></svg>