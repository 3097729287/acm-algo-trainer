<svg xmlns="http://www.w3.org/2000/svg" width="820" height="575" viewBox="0 0 820 575" role="img"><title>三道题通过集合共享六位选手，交集两人，弱选手四人</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="24" fill="#20334a" text-anchor="start">六名选手，同一张榜单满足三题通过人数 4、2、5</text><text x="235" y="88" font-size="18" fill="#20334a" text-anchor="middle">选手1</text><text x="322" y="88" font-size="18" fill="#20334a" text-anchor="middle">选手2</text><text x="409" y="88" font-size="18" fill="#20334a" text-anchor="middle">选手3</text><text x="496" y="88" font-size="18" fill="#20334a" text-anchor="middle">选手4</text><text x="583" y="88" font-size="18" fill="#20334a" text-anchor="middle">选手5</text><text x="670" y="88" font-size="18" fill="#20334a" text-anchor="middle">选手6</text><text x="25" y="146" font-size="21" fill="#20334a" text-anchor="start">第一题：4 人</text><rect x="196" y="115" width="343" height="49" rx="5" fill="#f1f7ff" stroke="#7aa0cd" stroke-width="2"/><circle cx="235" cy="138" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="322" cy="138" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="409" cy="138" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="496" cy="138" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="583" cy="138" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/><circle cx="670" cy="138" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="25" y="236" font-size="21" fill="#20334a" text-anchor="start">第二题：2 人</text><rect x="196" y="205" width="169" height="49" rx="5" fill="#f1f7ff" stroke="#7aa0cd" stroke-width="2"/><circle cx="235" cy="228" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="322" cy="228" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="409" cy="228" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/><circle cx="496" cy="228" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/><circle cx="583" cy="228" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/><circle cx="670" cy="228" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="25" y="326" font-size="21" fill="#20334a" text-anchor="start">第三题：5 人</text><rect x="196" y="295" width="430" height="49" rx="5" fill="#f1f7ff" stroke="#7aa0cd" stroke-width="2"/><circle cx="235" cy="318" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="322" cy="318" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="409" cy="318" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="496" cy="318" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="583" cy="318" r="13" fill="#2563a6" stroke="#64748b" stroke-width="2"/><circle cx="670" cy="318" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="25" y="438" font-size="21" fill="#20334a" text-anchor="start">按选手计数</text><rect x="200" y="406" width="70" height="50" rx="5" fill="#eaf5ec" stroke="#3d7c51" stroke-width="2"/><text x="235" y="438" font-size="20" fill="#20334a" text-anchor="middle">全过</text><rect x="287" y="406" width="70" height="50" rx="5" fill="#eaf5ec" stroke="#3d7c51" stroke-width="2"/><text x="322" y="438" font-size="20" fill="#20334a" text-anchor="middle">全过</text><rect x="374" y="406" width="70" height="50" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="409" y="438" font-size="20" fill="#20334a" text-anchor="middle">弱</text><rect x="461" y="406" width="70" height="50" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="496" y="438" font-size="20" fill="#20334a" text-anchor="middle">弱</text><rect x="548" y="406" width="70" height="50" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="583" y="438" font-size="20" fill="#20334a" text-anchor="middle">弱</text><rect x="635" y="406" width="70" height="50" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="670" y="438" font-size="20" fill="#20334a" text-anchor="middle">弱</text><text x="25" y="505" font-size="22" fill="#20334a" text-anchor="start">蓝色实心点表示通过；交集是选手一、二，共 2 人</text><text x="25" y="546" font-size="22" fill="#20334a" text-anchor="start">选手六缺三道题，但也只算 1 位弱选手；答案 6−2=4</text></g></svg>