<svg xmlns="http://www.w3.org/2000/svg" width="640" height="704" viewBox="0 0 640 704" role="img"><title>摄像头构造的真实树和观测记录</title><rect width="640" height="704" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16867b"/></marker></defs><text x="24" y="34" class="title" text-anchor="start">三条实际边区分四个坝</text><text x="24" y="72" class="small" text-anchor="start">红边=摄像头/切边；绿=坝，黄=特殊坝2</text><line x1="230" y1="120" x2="145" y2="230" stroke="#708599" stroke-width="2" stroke-dasharray=""/><line x1="230" y1="120" x2="340" y2="230" stroke="#708599" stroke-width="2" stroke-dasharray=""/><line x1="145" y1="230" x2="75" y2="350" stroke="#bd5864" stroke-width="4" stroke-dasharray=""/><rect x="97.0" y="280.0" width="26" height="20" rx="5" fill="#f8ced0" stroke="#7394aa"/><text x="110.0" y="296.0" class="small" text-anchor="middle">4</text><line x1="145" y1="230" x2="225" y2="350" stroke="#bd5864" stroke-width="4" stroke-dasharray=""/><rect x="172.0" y="280.0" width="26" height="20" rx="5" fill="#f8ced0" stroke="#7394aa"/><text x="185.0" y="296.0" class="small" text-anchor="middle">5</text><line x1="340" y1="230" x2="380" y2="350" stroke="#708599" stroke-width="2" stroke-dasharray=""/><line x1="75" y1="350" x2="75" y2="465" stroke="#bd5864" stroke-width="4" stroke-dasharray=""/><rect x="62.0" y="397.5" width="26" height="20" rx="5" fill="#f8ced0" stroke="#7394aa"/><text x="75.0" y="413.5" class="small" text-anchor="middle">7</text><rect x="210" y="100" width="40" height="40" rx="20" fill="#d9edf8" stroke="#7394aa"/><text x="230" y="127" class="" text-anchor="middle">1</text><rect x="125" y="210" width="40" height="40" rx="20" fill="#fff0b7" stroke="#7394aa"/><text x="145" y="237" class="" text-anchor="middle">2</text><rect x="320" y="210" width="40" height="40" rx="20" fill="#d9edf8" stroke="#7394aa"/><text x="340" y="237" class="" text-anchor="middle">3</text><rect x="55" y="330" width="40" height="40" rx="20" fill="#b8e2d3" stroke="#7394aa"/><text x="75" y="357" class="" text-anchor="middle">4</text><rect x="205" y="330" width="40" height="40" rx="20" fill="#b8e2d3" stroke="#7394aa"/><text x="225" y="357" class="" text-anchor="middle">5</text><rect x="360" y="330" width="40" height="40" rx="20" fill="#d9edf8" stroke="#7394aa"/><text x="380" y="357" class="" text-anchor="middle">6</text><rect x="55" y="445" width="40" height="40" rx="20" fill="#b8e2d3" stroke="#7394aa"/><text x="75" y="472" class="" text-anchor="middle">7</text><text x="444" y="152" class="" text-anchor="start">坝 / 记录</text><text x="444" y="215" class="" text-anchor="start">2 / 空</text><text x="444" y="278" class="" text-anchor="start">4 / [4]</text><text x="444" y="341" class="" text-anchor="start">5 / [5]</text><text x="444" y="404" class="" text-anchor="start">7 / [4,7]</text><text x="24" y="535" class="" text-anchor="start">切后四块：{1,2,3,6} / {4} / {5} / {7}</text><text x="24" y="580" class="" text-anchor="start">3条边 → 4块，每块恰一个坝</text><text x="24" y="623" class="" text-anchor="start">去7：1→2→4→7，记录先4后7</text><text x="24" y="665" class="" text-anchor="start">错省7：给2/4/5装，坝4和7都记录[2,4]</text></svg>