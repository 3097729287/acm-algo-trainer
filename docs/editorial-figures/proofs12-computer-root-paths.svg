<svg xmlns="http://www.w3.org/2000/svg" width="720" height="837" viewBox="0 0 720 837" role="img"><title>七台电脑真实树的原图度数一三三二一一一，查询五七的两条根路径公共一二权四，前缀八七减八补三得十，真实五三二四七点权和十；倍增同深两步祖先相同不跳一步不同跳后父二</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">七台真实电脑：圈内为编号，旁边为原图度数权值</text><path d="M360 101 L360 210" stroke="#64748b" stroke-width="3" fill="none"/><path d="M360 210 L198 321" stroke="#64748b" stroke-width="3" fill="none"/><path d="M360 210 L519 321" stroke="#64748b" stroke-width="3" fill="none"/><path d="M198 321 L101 440" stroke="#64748b" stroke-width="3" fill="none"/><path d="M198 321 L278 440" stroke="#64748b" stroke-width="3" fill="none"/><path d="M519 321 L614 440" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="360" cy="101" r="23" fill="#fee2e2" stroke="#285b87" stroke-width="2"/><text x="360" y="108" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="360" cy="210" r="23" fill="#fee2e2" stroke="#285b87" stroke-width="2"/><text x="360" y="217" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="198" cy="321" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="198" y="328" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="519" cy="321" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="519" y="328" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="101" cy="440" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="101" y="447" font-size="21" fill="#20334a" text-anchor="middle">5</text><circle cx="278" cy="440" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="278" y="447" font-size="21" fill="#20334a" text-anchor="middle">6</text><circle cx="614" cy="440" r="23" fill="#fef08a" stroke="#285b87" stroke-width="2"/><text x="614" y="447" font-size="21" fill="#20334a" text-anchor="middle">7</text><text x="391" y="108" font-size="18" fill="#20334a" text-anchor="start">权1</text><text x="391" y="217" font-size="18" fill="#20334a" text-anchor="start">权3</text><text x="229" y="328" font-size="18" fill="#20334a" text-anchor="start">权3</text><text x="550" y="328" font-size="18" fill="#20334a" text-anchor="start">权2</text><text x="132" y="447" font-size="18" fill="#20334a" text-anchor="start">权1</text><text x="309" y="447" font-size="18" fill="#20334a" text-anchor="start">权1</text><text x="645" y="447" font-size="18" fill="#20334a" text-anchor="start">权1</text><text x="22" y="511" font-size="21" fill="#20334a" text-anchor="start">公共根路1→2：权1+3=4，在两个前缀中各出现一次</text><text x="22" y="558" font-size="20" fill="#20334a" text-anchor="start">根到5：S5=1+3+3+1=8；根到7：S7=1+3+2+1=7</text><text x="22" y="605" font-size="22" fill="#20334a" text-anchor="start">先减2S2=8，再补权2=3：8+7−8+3=10</text><text x="22" y="652" font-size="21" fill="#20334a" text-anchor="start">真实路径5→3→2→4→7，权1+3+3+2+1=10</text><text x="22" y="713" font-size="20" fill="#20334a" text-anchor="start">求LCA：5和7同深度3，向上2步均到2，不能跳</text><text x="22" y="760" font-size="20" fill="#20334a" text-anchor="start">向上1步分别到3、4，可同时跳；此后共同父亲就是2</text><text x="22" y="807" font-size="21" fill="#20334a" text-anchor="start">同点查询(3,3)只留自身，答案权3=3</text></g></svg>