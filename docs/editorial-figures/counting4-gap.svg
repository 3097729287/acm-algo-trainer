<svg xmlns="http://www.w3.org/2000/svg" width="640" height="526" viewBox="0 0 640 526" role="img"><title>Gap Swap：合法两步与距离和十二到十到零</title><rect width="640" height="526" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">先修正四五，再跨过已就位的中间格</text><text x="24" y="70" class="" text-anchor="start">官方首例；每行上方给出真实位置，绿色已就位</text><text x="24" y="152" class="small" text-anchor="start">初始</text><text x="185" y="109" class="" text-anchor="middle">1</text><rect x="160" y="121" width="51" height="51" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="185" y="155" class="" text-anchor="middle">6</text><text x="244" y="109" class="" text-anchor="middle">2</text><rect x="219" y="121" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="244" y="155" class="" text-anchor="middle">2</text><text x="303" y="109" class="" text-anchor="middle">3</text><rect x="278" y="121" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="303" y="155" class="" text-anchor="middle">3</text><text x="362" y="109" class="" text-anchor="middle">4</text><rect x="337" y="121" width="51" height="51" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="362" y="155" class="" text-anchor="middle">5</text><text x="421" y="109" class="" text-anchor="middle">5</text><rect x="396" y="121" width="51" height="51" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="421" y="155" class="" text-anchor="middle">4</text><text x="480" y="109" class="" text-anchor="middle">6</text><rect x="455" y="121" width="51" height="51" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="480" y="155" class="" text-anchor="middle">1</text><text x="535" y="153" class="small" text-anchor="start">D=12</text><text x="24" y="256" class="small" text-anchor="start">换4、5后</text><rect x="160" y="225" width="51" height="51" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="185" y="259" class="" text-anchor="middle">6</text><rect x="219" y="225" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="244" y="259" class="" text-anchor="middle">2</text><rect x="278" y="225" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="303" y="259" class="" text-anchor="middle">3</text><rect x="337" y="225" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="362" y="259" class="" text-anchor="middle">4</text><rect x="396" y="225" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="421" y="259" class="" text-anchor="middle">5</text><rect x="455" y="225" width="51" height="51" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="480" y="259" class="" text-anchor="middle">1</text><text x="535" y="257" class="small" text-anchor="start">D=10</text><text x="24" y="360" class="small" text-anchor="start">再换1、6</text><rect x="160" y="329" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="185" y="363" class="" text-anchor="middle">1</text><rect x="219" y="329" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="244" y="363" class="" text-anchor="middle">2</text><rect x="278" y="329" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="303" y="363" class="" text-anchor="middle">3</text><rect x="337" y="329" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="362" y="363" class="" text-anchor="middle">4</text><rect x="396" y="329" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="421" y="363" class="" text-anchor="middle">5</text><rect x="455" y="329" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="480" y="363" class="" text-anchor="middle">6</text><text x="535" y="361" class="small" text-anchor="start">D=0</text><text x="24" y="456" class="" text-anchor="start">第一次费用1，D下降2；第二次费用5，D下降10</text><text x="24" y="497" class="" text-anchor="start">合计 1+5=6 = 初始12/2；相邻未就位格可相隔很远</text></svg>