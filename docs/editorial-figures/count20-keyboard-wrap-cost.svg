<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1055" viewBox="0 0 1040 1055" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#718096"/></marker></defs><rect width="1040" height="1055" fill="#fbfcff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="28" y="42" font-size="29" fill="#18324f" text-anchor="start" font-weight="700">下一字符1：先从余数59转到0，再输入</text><text x="28" y="81" font-size="23" fill="#18324f" text-anchor="start">p=1，q=20000，t=1；已输入 (1,2,3) 重复20次。</text><text x="28" y="118" font-size="22" fill="#bf3348" text-anchor="start" font-weight="700">旧层停在“刚输入第60字符”的瞬间，尚未在其后转动。</text><line x1="219" y1="213" x2="451" y2="213" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><line x1="529" y1="213" x2="761" y2="213" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><circle cx="180" cy="213" r="39" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="180" y="221" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">58</text><circle cx="490" cy="213" r="39" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="490" y="221" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">59</text><circle cx="800" cy="213" r="39" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="800" y="221" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">0</text><text x="490" y="286" font-size="24" fill="#2563a6" text-anchor="middle" font-weight="700">旧 dp[59] = 119</text><text x="800" y="286" font-size="24" fill="#087f5b" text-anchor="middle" font-weight="700">这一按花1</text><text x="643" y="174" font-size="22" fill="#087f5b" text-anchor="middle">向前1次</text><path d="M800,302 V338 H180 V266" fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="490" y="367" font-size="20" fill="#718096" text-anchor="middle">余数0之后还依次有1..57，再回到58</text><rect x="24" y="400" width="480" height="324" rx="10" fill="white" stroke="#bac9db" stroke-width="2"/><text x="44" y="440" font-size="23" fill="#18324f" text-anchor="start" font-weight="700">布局余数 59（绿色框为主字符）</text><rect x="69" y="466" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="102.5" y="505" font-size="25" fill="#18324f" text-anchor="middle">1</text><rect x="147" y="466" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="180.5" y="505" font-size="25" fill="#18324f" text-anchor="middle">2</text><rect x="225" y="466" width="67" height="57" rx="10" fill="#dff5e9" stroke="#087f5b" stroke-width="2"/><text x="258.5" y="505" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">3</text><rect x="69" y="546" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="102.5" y="585" font-size="25" fill="#18324f" text-anchor="middle">4</text><rect x="147" y="546" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="180.5" y="585" font-size="25" fill="#18324f" text-anchor="middle">5</text><rect x="225" y="546" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="258.5" y="585" font-size="25" fill="#18324f" text-anchor="middle">6</text><rect x="303" y="546" width="67" height="57" rx="10" fill="#dff5e9" stroke="#087f5b" stroke-width="2"/><text x="336.5" y="585" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">7</text><rect x="69" y="626" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="102.5" y="665" font-size="25" fill="#18324f" text-anchor="middle">8</text><rect x="147" y="626" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="180.5" y="665" font-size="25" fill="#18324f" text-anchor="middle">9</text><rect x="225" y="626" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="258.5" y="665" font-size="25" fill="#18324f" text-anchor="middle">10</text><rect x="303" y="626" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="336.5" y="665" font-size="25" fill="#18324f" text-anchor="middle">11</text><rect x="381" y="626" width="67" height="57" rx="10" fill="#dff5e9" stroke="#087f5b" stroke-width="2"/><text x="414.5" y="665" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">12</text><rect x="536" y="400" width="480" height="324" rx="10" fill="white" stroke="#bac9db" stroke-width="2"/><text x="556" y="440" font-size="23" fill="#18324f" text-anchor="start" font-weight="700">布局余数 0（绿色框为主字符）</text><rect x="581" y="466" width="67" height="57" rx="10" fill="#dff5e9" stroke="#087f5b" stroke-width="2"/><text x="614.5" y="505" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">1</text><rect x="659" y="466" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="692.5" y="505" font-size="25" fill="#18324f" text-anchor="middle">2</text><rect x="737" y="466" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="770.5" y="505" font-size="25" fill="#18324f" text-anchor="middle">3</text><rect x="581" y="546" width="67" height="57" rx="10" fill="#dff5e9" stroke="#087f5b" stroke-width="2"/><text x="614.5" y="585" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">4</text><rect x="659" y="546" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="692.5" y="585" font-size="25" fill="#18324f" text-anchor="middle">5</text><rect x="737" y="546" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="770.5" y="585" font-size="25" fill="#18324f" text-anchor="middle">6</text><rect x="815" y="546" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="848.5" y="585" font-size="25" fill="#18324f" text-anchor="middle">7</text><rect x="581" y="626" width="67" height="57" rx="10" fill="#dff5e9" stroke="#087f5b" stroke-width="2"/><text x="614.5" y="665" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">8</text><rect x="659" y="626" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="692.5" y="665" font-size="25" fill="#18324f" text-anchor="middle">9</text><rect x="737" y="626" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="770.5" y="665" font-size="25" fill="#18324f" text-anchor="middle">10</text><rect x="815" y="626" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="848.5" y="665" font-size="25" fill="#18324f" text-anchor="middle">11</text><rect x="893" y="626" width="67" height="57" rx="10" fill="#f3f6fb" stroke="#bac9db" stroke-width="2"/><text x="926.5" y="665" font-size="25" fill="#18324f" text-anchor="middle">12</text><text x="520" y="777" font-size="27" fill="#087f5b" text-anchor="middle" font-weight="700">119（旧输入）+ 1（特殊键）+ 1（本次输入）= 121</text><rect x="28" y="810" width="984" height="160" rx="10" fill="#f0f5ff" stroke="#bac9db" stroke-width="2"/><text x="48" y="851" font-size="24" fill="#18324f" text-anchor="start">取 y=0：pre[0] = 20121；suf[1] = 119−59 = 60</text><text x="48" y="892" font-size="24" fill="#18324f" text-anchor="start">不绕回候选20121；绕回候选 60 + 60 = 120</text><text x="48" y="933" font-size="24" fill="#087f5b" text-anchor="start" font-weight="700">再加 cost(0,1)=1，选择121；实际旋转只有1次。</text><text x="28" y="1014" font-size="21" fill="#bf3348" text-anchor="start">输入后转到0可费120，但这次转动属于下一转移，不是即时旧 dp[0]。</text></g></svg>