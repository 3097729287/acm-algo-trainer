<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img"><title>披萨真实路径与两个端点的完整转移</title><rect width="640" height="690" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16867b"/></marker></defs><text x="24" y="32" class="title" text-anchor="start">样例二：一条真正长度13的路</text><text x="24" y="65" class="small" text-anchor="start">箭头只向右/上/下；A、B为起终点，方点为房子</text><line x1="100" y1="356" x2="100" y2="100" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="100" y="392" class="small" text-anchor="middle">1</text><line x1="210" y1="356" x2="210" y2="100" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="210" y="392" class="small" text-anchor="middle">2</text><line x1="320" y1="356" x2="320" y2="100" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="320" y="392" class="small" text-anchor="middle">3</text><line x1="430" y1="356" x2="430" y2="100" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="430" y="392" class="small" text-anchor="middle">4</text><line x1="540" y1="356" x2="540" y2="100" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="540" y="392" class="small" text-anchor="middle">5</text><line x1="100" y1="356" x2="540" y2="356" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="65" y="361" class="small" text-anchor="middle">1</text><line x1="100" y1="292" x2="540" y2="292" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="65" y="297" class="small" text-anchor="middle">2</text><line x1="100" y1="228" x2="540" y2="228" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="65" y="233" class="small" text-anchor="middle">3</text><line x1="100" y1="164" x2="540" y2="164" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="65" y="169" class="small" text-anchor="middle">4</text><line x1="100" y1="100" x2="540" y2="100" stroke="#d4dde5" stroke-width="1" stroke-dasharray=""/><text x="65" y="105" class="small" text-anchor="middle">5</text><text x="574" y="392" class="small" text-anchor="start">x</text><text x="65" y="89" class="small" text-anchor="start">y</text><line x1="100" y1="228" x2="100" y2="356" stroke="#16867b" stroke-width="4" stroke-dasharray=""/><line x1="100" y1="228" x2="100.0" y2="292.0" stroke="#16867b" stroke-width="4" marker-end="url(#arrow)"/><line x1="100" y1="356" x2="320" y2="356" stroke="#16867b" stroke-width="4" stroke-dasharray=""/><line x1="100" y1="356" x2="210.0" y2="356.0" stroke="#16867b" stroke-width="4" marker-end="url(#arrow)"/><line x1="320" y1="356" x2="320" y2="100" stroke="#16867b" stroke-width="4" stroke-dasharray=""/><line x1="320" y1="356" x2="320.0" y2="228.0" stroke="#16867b" stroke-width="4" marker-end="url(#arrow)"/><line x1="320" y1="100" x2="430" y2="100" stroke="#16867b" stroke-width="4" stroke-dasharray=""/><line x1="320" y1="100" x2="375.0" y2="100.0" stroke="#16867b" stroke-width="4" marker-end="url(#arrow)"/><line x1="430" y1="100" x2="430" y2="164" stroke="#16867b" stroke-width="4" stroke-dasharray=""/><line x1="430" y1="100" x2="430.0" y2="132.0" stroke="#16867b" stroke-width="4" marker-end="url(#arrow)"/><line x1="430" y1="164" x2="540" y2="164" stroke="#16867b" stroke-width="4" stroke-dasharray=""/><line x1="430" y1="164" x2="485.0" y2="164.0" stroke="#16867b" stroke-width="4" marker-end="url(#arrow)"/><line x1="540" y1="164" x2="540" y2="292" stroke="#16867b" stroke-width="4" stroke-dasharray=""/><line x1="540" y1="164" x2="540.0" y2="228.0" stroke="#16867b" stroke-width="4" marker-end="url(#arrow)"/><rect x="309" y="89" width="22" height="22" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="338" y="85" class="small" text-anchor="start">房1</text><rect x="419" y="153" width="22" height="22" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="448" y="149" class="small" text-anchor="start">房2</text><rect x="309" y="345" width="22" height="22" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="338" y="341" class="small" text-anchor="start">房3</text><circle cx="100" cy="228" r="9" fill="#526b9e"/><text x="82" y="208" class="small" text-anchor="start">A(1,3)</text><circle cx="540" cy="292" r="9" fill="#526b9e"/><text x="522" y="272" class="small" text-anchor="end">B(5,2)</text><text x="24" y="444" class="" text-anchor="start">x=3：停低1，|3−5|+4=6；停高5，|3−1|+4=6</text><text x="24" y="485" class="" text-anchor="start">x=4：从低端来6+|1−4|=9</text><text x="24" y="518" class="" text-anchor="start">          从高端来6+|5−4|=7，取7</text><text x="24" y="565" class="" text-anchor="start">最后到高度2：7+|4−2|=9</text><text x="24" y="610" class="" text-anchor="start">固定横向5−1=4；总计9+4=13</text><text x="24" y="655" class="" text-anchor="start">实际房子访问顺序：原3 → 原1 → 原2 → B</text></svg>