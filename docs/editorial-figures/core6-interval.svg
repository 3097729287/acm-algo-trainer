<svg xmlns="http://www.w3.org/2000/svg" width="620" height="335" viewBox="0 0 620 335" role="img"><title>实际区间一到六中两个禁用二指向同一整数，九在区间外，排除二后留下五个整数</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">区间 [1,6]，禁用输入 2、2、9：只删一个点</text><rect x="40" y="97" width="64" height="64" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="72" y="140" font-size="30" fill="#20334a" text-anchor="middle">1</text><rect x="126" y="97" width="64" height="64" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="158" y="140" font-size="30" fill="#20334a" text-anchor="middle">2</text><line x1="133" y1="104" x2="183" y2="154" stroke="#a32e36" stroke-width="3"/><rect x="212" y="97" width="64" height="64" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="244" y="140" font-size="30" fill="#20334a" text-anchor="middle">3</text><rect x="298" y="97" width="64" height="64" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="330" y="140" font-size="30" fill="#20334a" text-anchor="middle">4</text><rect x="384" y="97" width="64" height="64" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="416" y="140" font-size="30" fill="#20334a" text-anchor="middle">5</text><rect x="470" y="97" width="64" height="64" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="502" y="140" font-size="30" fill="#20334a" text-anchor="middle">6</text><text x="24" y="212" font-size="21" fill="#20334a" text-anchor="start">第一次 2：6 → 5；第二次 2：同一个整数，仍为 5。</text><text x="24" y="257" font-size="21" fill="#20334a" text-anchor="start">9 在区间外，原本没计入，不能再扣。</text><text x="24" y="302" font-size="21" fill="#20334a" text-anchor="start">剩下的真实整数：1、3、4、5、6，共五个。</text></g></svg>