<svg xmlns="http://www.w3.org/2000/svg" width="640" height="485" viewBox="0 0 640 485" role="img"><title>Bomber Mad 官方样例一：网格最短步数与五个合格起点</title><rect width="640" height="485" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">样例：从中心安全格分层走到各起点</text><text x="24" y="65" class="" text-anchor="start">K = 1；数字是最少步数，# 是不可走的炸弹</text><text x="100" y="126" class="" text-anchor="middle">行 1</text><text x="190" y="91" class="" text-anchor="middle">列 1</text><rect x="150" y="102" width="80" height="68" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="190" y="144" class="" text-anchor="middle">#</text><text x="290" y="91" class="" text-anchor="middle">列 2</text><rect x="250" y="102" width="80" height="68" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="290" y="144" class="" text-anchor="middle">1</text><text x="390" y="91" class="" text-anchor="middle">列 3</text><rect x="350" y="102" width="80" height="68" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="390" y="144" class="" text-anchor="middle">2</text><text x="100" y="211" class="" text-anchor="middle">行 2</text><rect x="150" y="187" width="80" height="68" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="190" y="229" class="" text-anchor="middle">1</text><rect x="250" y="187" width="80" height="68" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="290" y="229" class="" text-anchor="middle">0</text><rect x="350" y="187" width="80" height="68" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="390" y="229" class="" text-anchor="middle">1</text><text x="100" y="296" class="" text-anchor="middle">行 3</text><rect x="150" y="272" width="80" height="68" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="190" y="314" class="" text-anchor="middle">2</text><rect x="250" y="272" width="80" height="68" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="290" y="314" class="" text-anchor="middle">1</text><rect x="350" y="272" width="80" height="68" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="390" y="314" class="" text-anchor="middle">#</text><text x="24" y="393" class="" text-anchor="start">安全格 (2,2)：0 步 → 加一</text><text x="24" y="426" class="" text-anchor="start">四个蓝格：1 步 → 各加一；两个白格：2 步 → 不加</text><text x="24" y="460" class="" text-anchor="start">合计 1 + 4 = 5 个起点，每格最多计一次</text></svg>