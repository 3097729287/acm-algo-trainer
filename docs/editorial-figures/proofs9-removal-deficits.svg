<svg xmlns="http://www.w3.org/2000/svg" width="720" height="766" viewBox="0 0 720 766" role="img"><title>原数组一四七十十三在k四时删除四，七减两次十减一次后实际为一五九十三，原下标三四五的W二三四与阈值四完整相减，严格边界和前缀求和得到三</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">k=4，删原下标2的4：只减不增，真实动作共3次</text><text x="22" y="115" font-size="22" fill="#20334a" text-anchor="start">原数组</text><rect x="163" y="80" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="208" y="115" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="271" y="80" width="91" height="51" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="316" y="115" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="379" y="80" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="424" y="115" font-size="24" fill="#20334a" text-anchor="middle">7</text><rect x="487" y="80" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="532" y="115" font-size="24" fill="#20334a" text-anchor="middle">10</text><rect x="595" y="80" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="640" y="115" font-size="24" fill="#20334a" text-anchor="middle">13</text><text x="22" y="191" font-size="22" fill="#20334a" text-anchor="start">删除后</text><rect x="163" y="156" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="208" y="191" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="271" y="156" width="91" height="51" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="316" y="191" font-size="24" fill="#20334a" text-anchor="middle">×</text><rect x="379" y="156" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="424" y="191" font-size="24" fill="#20334a" text-anchor="middle">7</text><rect x="487" y="156" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="532" y="191" font-size="24" fill="#20334a" text-anchor="middle">10</text><rect x="595" y="156" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="640" y="191" font-size="24" fill="#20334a" text-anchor="middle">13</text><text x="22" y="267" font-size="22" fill="#20334a" text-anchor="start">减小后</text><rect x="163" y="232" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="208" y="267" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="271" y="232" width="91" height="51" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="316" y="267" font-size="24" fill="#20334a" text-anchor="middle">—</text><rect x="379" y="232" width="91" height="51" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="424" y="267" font-size="24" fill="#20334a" text-anchor="middle">5</text><rect x="487" y="232" width="91" height="51" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="532" y="267" font-size="24" fill="#20334a" text-anchor="middle">9</text><rect x="595" y="232" width="91" height="51" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="640" y="267" font-size="24" fill="#20334a" text-anchor="middle">13</text><text x="22" y="351" font-size="21" fill="#20334a" text-anchor="start">把7减两次到5，把10减一次到9；最终[1,5,9,13]每差4</text><text x="81" y="410" font-size="22" fill="#20334a" text-anchor="middle">原下标j</text><text x="252" y="410" font-size="22" fill="#20334a" text-anchor="middle">Wⱼ</text><text x="424" y="410" font-size="22" fill="#20334a" text-anchor="middle">T=4</text><text x="603" y="410" font-size="22" fill="#20334a" text-anchor="middle">缺口</text><rect x="22" y="430" width="676" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="81" y="464" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="252" y="464" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="424" y="464" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="603" y="464" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="22" y="487" width="676" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="81" y="521" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="252" y="521" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="424" y="521" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="603" y="521" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="22" y="544" width="676" height="49" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="81" y="578" font-size="24" fill="#20334a" text-anchor="middle">5</text><text x="252" y="578" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="424" y="578" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="603" y="578" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="22" y="641" font-size="22" fill="#20334a" text-anchor="start">严格Wⱼ&lt;T只留下j=3、4；j=5等号处已经不用减</text><text x="22" y="690" font-size="21" fill="#20334a" text-anchor="start">r=4、p=2；P₄=6、P₂=1，代价=(4−2)×4−(6−1)=3</text><text x="22" y="739" font-size="21" fill="#20334a" text-anchor="start">d&gt;0保证第一个后继Wₚ₊₁&lt;T，r&gt;p是重复的保护判断</text></g></svg>