<svg xmlns="http://www.w3.org/2000/svg" width="760" height="868" viewBox="0 0 760 868" role="img"><title>三乘三误差三三三三十二三三三三，右下二乘二用全前缀三十六减上九减左九补交集三得二十一；同一图比较二乘二平均一点七五与整图一点三三，整图更优</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#153655" font-size="24" text-anchor="start">同一3×3图：每格是三个通道平方差之和</text><text x="24" y="83" fill="#153655" font-size="22" text-anchor="start">I全1；K除中间为3，其余全2。</text><rect x="80" y="136" width="99" height="77" rx="5" fill="#ede9fe" stroke="#2563eb" stroke-width="2"/><text x="130" y="186" fill="#153655" font-size="29" text-anchor="middle">3</text><rect x="189" y="136" width="99" height="77" rx="5" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/><text x="239" y="186" fill="#153655" font-size="29" text-anchor="middle">3</text><rect x="298" y="136" width="99" height="77" rx="5" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/><text x="348" y="186" fill="#153655" font-size="29" text-anchor="middle">3</text><rect x="80" y="227" width="99" height="77" rx="5" fill="#ffedd5" stroke="#2563eb" stroke-width="2"/><text x="130" y="277" fill="#153655" font-size="29" text-anchor="middle">3</text><rect x="189" y="227" width="99" height="77" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="239" y="277" fill="#153655" font-size="29" text-anchor="middle">12</text><rect x="298" y="227" width="99" height="77" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="348" y="277" fill="#153655" font-size="29" text-anchor="middle">3</text><rect x="80" y="318" width="99" height="77" rx="5" fill="#ffedd5" stroke="#2563eb" stroke-width="2"/><text x="130" y="368" fill="#153655" font-size="29" text-anchor="middle">3</text><rect x="189" y="318" width="99" height="77" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="239" y="368" fill="#153655" font-size="29" text-anchor="middle">3</text><rect x="298" y="318" width="99" height="77" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="348" y="368" fill="#153655" font-size="29" text-anchor="middle">3</text><text x="439" y="163" fill="#153655" font-size="22" text-anchor="start">整块前缀：36</text><text x="439" y="221" fill="#153655" font-size="22" text-anchor="start">减上面一行：9</text><text x="439" y="279" fill="#153655" font-size="22" text-anchor="start">减左边一列：9</text><text x="439" y="337" fill="#153655" font-size="22" text-anchor="start">补左上交集：3</text><text x="24" y="457" fill="#153655" font-size="23" text-anchor="start">绿色右下2×2：36−9−9+3=21。</text><text x="24" y="511" fill="#153655" font-size="20" text-anchor="start">左上角被两次扣除，所以补一次；绿色格不被扣掉。</text><text x="24" y="582" fill="#153655" font-size="22" text-anchor="start">候选A：右下2×2，S=21，面积4，M=1.75。</text><text x="24" y="635" fill="#153655" font-size="22" text-anchor="start">候选B：整张3×3，S=36，面积9，M约1.33。</text><text x="24" y="700" fill="#153655" font-size="22" text-anchor="start">已有A后看B：36×4=144 &lt; 21×9=189，更新。</text><text x="24" y="762" fill="#153655" font-size="22" text-anchor="start">B总误差更大，平均误差更小，PSNR反而更高。</text><text x="24" y="823" fill="#153655" font-size="21" text-anchor="start">尺寸至少2×2；其他2×2均含中间12，整图最优。</text></svg>