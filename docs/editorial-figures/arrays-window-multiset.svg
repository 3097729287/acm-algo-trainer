<svg xmlns="http://www.w3.org/2000/svg" width="850" height="680" viewBox="0 0 850 680" role="img"><title>同一数组窗口外逐项相同，逐值扣次数后内部多重集相同</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="24" y="36" font-size="25" fill="#20334a" text-anchor="start">N=9，K=6：选起点 2，只排序第 2 到第 7 位</text><text x="205" y="79" font-size="18" fill="#20334a" text-anchor="middle">1</text><text x="270" y="79" font-size="18" fill="#20334a" text-anchor="middle">2</text><text x="335" y="79" font-size="18" fill="#20334a" text-anchor="middle">3</text><text x="400" y="79" font-size="18" fill="#20334a" text-anchor="middle">4</text><text x="465" y="79" font-size="18" fill="#20334a" text-anchor="middle">5</text><text x="530" y="79" font-size="18" fill="#20334a" text-anchor="middle">6</text><text x="595" y="79" font-size="18" fill="#20334a" text-anchor="middle">7</text><text x="660" y="79" font-size="18" fill="#20334a" text-anchor="middle">8</text><text x="725" y="79" font-size="18" fill="#20334a" text-anchor="middle">9</text><text x="24" y="131" font-size="21" fill="#20334a" text-anchor="start">A 原数组</text><rect x="180" y="99" width="50" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="205" y="131" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="245" y="99" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="270" y="131" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="270" y="171" font-size="16" fill="#c2410c" text-anchor="middle">失配</text><rect x="310" y="99" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="335" y="131" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="375" y="99" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="400" y="131" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="400" y="171" font-size="16" fill="#c2410c" text-anchor="middle">失配</text><rect x="440" y="99" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="465" y="131" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="465" y="171" font-size="16" fill="#c2410c" text-anchor="middle">失配</text><rect x="505" y="99" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="530" y="131" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="530" y="171" font-size="16" fill="#c2410c" text-anchor="middle">失配</text><rect x="570" y="99" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="595" y="131" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="595" y="171" font-size="16" fill="#c2410c" text-anchor="middle">失配</text><rect x="635" y="99" width="50" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="660" y="131" font-size="25" fill="#20334a" text-anchor="middle">5</text><rect x="700" y="99" width="50" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="725" y="131" font-size="25" fill="#20334a" text-anchor="middle">6</text><path d="M245,92 V83 H620 V92" fill="none" stroke="#087b48" stroke-width="2"/><text x="24" y="231" font-size="21" fill="#20334a" text-anchor="start">S 排序目标</text><rect x="180" y="199" width="50" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="205" y="231" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="245" y="199" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="270" y="231" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="310" y="199" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="335" y="231" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="375" y="199" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="400" y="231" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="440" y="199" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="465" y="231" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="505" y="199" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="530" y="231" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="570" y="199" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="595" y="231" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="635" y="199" width="50" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="660" y="231" font-size="25" fill="#20334a" text-anchor="middle">5</text><rect x="700" y="199" width="50" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="725" y="231" font-size="25" fill="#20334a" text-anchor="middle">6</text><path d="M245,192 V183 H620 V192" fill="none" stroke="#087b48" stroke-width="2"/><text x="24" y="331" font-size="21" fill="#20334a" text-anchor="start">实际操作后</text><rect x="180" y="299" width="50" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="205" y="331" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="245" y="299" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="270" y="331" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="310" y="299" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="335" y="331" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="375" y="299" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="400" y="331" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="440" y="299" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="465" y="331" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="505" y="299" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="530" y="331" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="570" y="299" width="50" height="48" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="595" y="331" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="635" y="299" width="50" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="660" y="331" font-size="25" fill="#20334a" text-anchor="middle">5</text><rect x="700" y="299" width="50" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="725" y="331" font-size="25" fill="#20334a" text-anchor="middle">6</text><path d="M245,292 V283 H620 V292" fill="none" stroke="#087b48" stroke-width="2"/><text x="24" y="424" font-size="21" fill="#20334a" text-anchor="start">窗口外（位置 1、8、9）：两行都是 [1,5,6]，逐项相同。</text><rect x="24" y="450" width="790" height="130" rx="6" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="42" y="484" font-size="21" fill="#20334a" text-anchor="start">相同的全体次数 − 相同的窗口外次数 = 相同的窗口内次数</text><text x="42" y="521" font-size="21" fill="#20334a" text-anchor="start">数值 1：总 3 次 − 外 1 次 = 内 2 次</text><text x="42" y="557" font-size="21" fill="#20334a" text-anchor="start">数值 4：总 2 次 − 外 0 次 = 内 2 次</text><text x="24" y="615" font-size="21" fill="#20334a" text-anchor="start">窗口内均有：两个 1、一个 2、一个 3、两个 4。</text><text x="24" y="652" font-size="20" fill="#20334a" text-anchor="start">绿框含本已正确的位置 3；覆盖全部失配即可，允许重复值。</text></g></svg>