<svg xmlns="http://www.w3.org/2000/svg" width="480" height="775" viewBox="0 0 480 775"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#26826e"/></marker></defs><rect width="480" height="100%" rx="8" fill="#f7fafc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#17334d"><text x="18" y="28" font-size="16" font-weight="600">一张卡统计一次：不是数可走路线</text><text x="18" y="56">n=3；上排 2 / 3 / 1，下排 1 / 3 / 2</text><text x="18" y="84">卡[2,3]：绿格开放；叉号是值1的关闭格</text><rect x="82" y="105" width="70" height="50" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="90" y="135.0">2</text><rect x="194" y="105" width="70" height="50" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="202" y="135.0">3</text><rect x="306" y="105" width="70" height="50" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="314" y="135.0">1 ×</text><rect x="82" y="170" width="70" height="50" rx="4" fill="#ffe6e9" stroke="#4984bd"/><text x="90" y="200.0">1 ×</text><rect x="194" y="170" width="70" height="50" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="202" y="200.0">3</text><rect x="306" y="170" width="70" height="50" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="314" y="200.0">2</text><line x1="118" y1="130" x2="230" y2="130" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><line x1="230" y1="137" x2="230" y2="190" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><line x1="239" y1="195" x2="341" y2="195" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><text x="18" y="254">实际路径：(1,1)→(1,2)→(2,2)→(2,3)</text><text x="18" y="286">列状态 mask：上开=1，下开=2，两开=3</text><rect x="20" y="305" width="139" height="34" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="28" y="327.0">第1列：1</text><rect x="171" y="305" width="139" height="34" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="179" y="327.0">第2列：3</text><rect x="322" y="305" width="139" height="34" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="330" y="327.0">第3列：2</text><text x="18" y="373">行=上一列入口；列=本列出口；0=上，1=下</text><text x="35" y="405">M0 起点</text><rect x="35" y="417" width="85" height="58" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="53" y="440">1  0</text><text x="53" y="462">0  0</text><text x="191" y="405">M1</text><rect x="191" y="417" width="85" height="58" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="209" y="440">1  1</text><text x="209" y="462">0  0</text><text x="345" y="405">M2</text><rect x="345" y="417" width="85" height="58" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="363" y="440">0  0</text><text x="363" y="462">0  1</text><text x="18" y="508">M0·M1·M2 的[0][1]=1：存在完整通路</text><text x="18" y="540">改第2列：它是M1的目的，也是M2的来源</text><text x="18" y="566">所以 touch(1) 重算 M1 与 M2 两个叶子</text><line x1="18" y1="588" x2="460" y2="588" stroke="#6c8294" stroke-width="2"/><text x="18" y="617">固定l=1：最小r=3，卡(1,3)..(1,6)共4张</text><text x="18" y="646">固定l=2：最小r=3，卡(2,3)..(2,6)共4张</text><text x="18" y="675">l=3时起点值2关闭，连[3,6]也不通，停止</text><text x="18" y="706">ans：0→4→8；同l不同r是不同卡片</text><text x="18" y="739">每张卡由唯一(l,r)确定，不按路径重复计数</text></g></svg>