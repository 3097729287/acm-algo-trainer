<svg xmlns="http://www.w3.org/2000/svg" width="660" height="540" viewBox="0 0 660 540" role="img"><title>四幅价值一二四五与平方一四十六二十五，三个实际选择代价二十四十五二十一，最优三幅单调摆放</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="34" font-size="21" fill="#20334a" text-anchor="start">四幅实际画：价值1、2、4、5；本例选M=3</text><rect x="35" y="65" width="131" height="109" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="100" y="95" font-size="18" fill="#20334a" text-anchor="middle">位置0</text><text x="100" y="128" font-size="23" fill="#20334a" text-anchor="middle">价值1</text><text x="100" y="156" font-size="20" fill="#20334a" text-anchor="middle">平方1</text><rect x="187" y="65" width="131" height="109" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="252" y="95" font-size="18" fill="#20334a" text-anchor="middle">位置1</text><text x="252" y="128" font-size="23" fill="#20334a" text-anchor="middle">价值2</text><text x="252" y="156" font-size="20" fill="#20334a" text-anchor="middle">平方4</text><rect x="339" y="65" width="131" height="109" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="404" y="95" font-size="18" fill="#20334a" text-anchor="middle">位置2</text><text x="404" y="128" font-size="23" fill="#20334a" text-anchor="middle">价值4</text><text x="404" y="156" font-size="20" fill="#20334a" text-anchor="middle">平方16</text><rect x="491" y="65" width="131" height="109" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="556" y="95" font-size="18" fill="#20334a" text-anchor="middle">位置3</text><text x="556" y="128" font-size="23" fill="#20334a" text-anchor="middle">价值5</text><text x="556" y="156" font-size="20" fill="#20334a" text-anchor="middle">平方25</text><rect x="24" y="204" width="608" height="43" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="40" y="233" font-size="20" fill="#20334a" text-anchor="start">跳项选1、4、5</text><text x="300" y="233" font-size="20" fill="#20334a" text-anchor="start">(16−1)+(25−16)=24</text><rect x="24" y="261" width="608" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="40" y="290" font-size="20" fill="#20334a" text-anchor="start">窗口选1、2、4</text><text x="300" y="290" font-size="20" fill="#20334a" text-anchor="start">(4−1)+(16−4)=15</text><rect x="24" y="318" width="608" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="40" y="347" font-size="20" fill="#20334a" text-anchor="start">窗口选2、4、5</text><text x="300" y="347" font-size="20" fill="#20334a" text-anchor="start">(16−4)+(25−16)=21</text><text x="24" y="423" font-size="21" fill="#20334a" text-anchor="start">同三幅1、2、4，换顺序不会改变选中对象：</text><text x="24" y="465" font-size="22" fill="#20334a" text-anchor="start">1→16→4：代价27；1→4→16：代价15。</text><text x="24" y="507" font-size="20" fill="#20334a" text-anchor="start">连续窗口保留三张实体画，升序摆放同时达到端点下界。</text></g></svg>