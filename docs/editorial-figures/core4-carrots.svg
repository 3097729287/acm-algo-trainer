<svg xmlns="http://www.w3.org/2000/svg" width="620" height="535" viewBox="0 0 620 535" role="img"><title>四根原长二三四六在同一刀口二下分别贡献一一二一个目标段，余段四不再重切</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">只切一次，刀口 x=2：绿色每段才是目标二</text><text x="24" y="115" font-size="20" fill="#20334a" text-anchor="start">原长 2</text><rect x="128" y="85" width="119" height="46" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="187.5" y="117" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="24" y="201" font-size="20" fill="#20334a" text-anchor="start">原长 3</text><rect x="128" y="171" width="119" height="46" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="187.5" y="203" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="250" y="171" width="58" height="46" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="279.0" y="203" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="24" y="287" font-size="20" fill="#20334a" text-anchor="start">原长 4</text><rect x="128" y="257" width="119" height="46" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="187.5" y="289" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="250" y="257" width="119" height="46" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="309.5" y="289" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="24" y="373" font-size="20" fill="#20334a" text-anchor="start">原长 6</text><rect x="128" y="343" width="119" height="46" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="187.5" y="375" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="250" y="343" width="241" height="46" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="370.5" y="375" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="24" y="461" font-size="21" fill="#20334a" text-anchor="start">suf[2]=4 已各计一段；cnt[4]=1 只补第二段。</text><text x="24" y="505" font-size="21" fill="#20334a" text-anchor="start">总计 5 段；原长六的余段四，本次不能再切。</text></g></svg>