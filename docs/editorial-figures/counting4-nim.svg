<svg xmlns="http://www.w3.org/2000/svg" width="640" height="574" viewBox="0 0 640 574" role="img"><title>Nim_k：实际三次取石与至多K堆的整体移动</title><rect width="640" height="574" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">K=3：同一堆取三次，完成一整个回合</text><text x="24" y="70" class="" text-anchor="start">初始 [7,3,3,3]；从第一堆依次取1、1、2颗</text><rect x="62" y="363" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><rect x="62" y="329" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><rect x="62" y="295" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><rect x="62" y="261" width="76" height="29" rx="5" fill="#fce4b9" stroke="#7394aa"/><rect x="62" y="227" width="76" height="29" rx="5" fill="#fce4b9" stroke="#7394aa"/><rect x="62" y="193" width="76" height="29" rx="5" fill="#fce4b9" stroke="#7394aa"/><rect x="62" y="159" width="76" height="29" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="100" y="423" class="" text-anchor="middle">堆1</text><rect x="207" y="363" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><rect x="207" y="329" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><rect x="207" y="295" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="245" y="423" class="" text-anchor="middle">堆2</text><rect x="352" y="363" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><rect x="352" y="329" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><rect x="352" y="295" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="390" y="423" class="" text-anchor="middle">堆3</text><rect x="497" y="363" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><rect x="497" y="329" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><rect x="497" y="295" width="76" height="29" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="535" y="423" class="" text-anchor="middle">堆4</text><text x="24" y="467" class="" text-anchor="start">第一堆：7 → 6 → 5 → 3；其余三堆不动</text><text x="24" y="506" class="" text-anchor="start">只改1堆、减少4颗，仍恰好进行了3次正数取石</text><text x="24" y="545" class="" text-anchor="start">目标 [3,3,3,3]：商全1、余数和0，交给对手</text></svg>