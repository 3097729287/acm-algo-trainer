<svg xmlns="http://www.w3.org/2000/svg" width="720" height="547" viewBox="0 0 720 547" role="img"><title>合法二乘二网格的实际人数与两种对角线分组，绿色聚集格的两个一维贡献七和五合成总费六</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="23" y="36" font-size="22" fill="#20334a" text-anchor="start">N=2，M=5，A=[1,2]，B=[1,3]；格内写实际人数</text><rect x="70" y="106" width="116" height="101" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="128" y="140" font-size="20" fill="#20334a" text-anchor="middle">格(1,1)</text><text x="128" y="184" font-size="28" fill="#20334a" text-anchor="middle">1</text><rect x="206" y="106" width="116" height="101" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="264" y="140" font-size="20" fill="#20334a" text-anchor="middle">格(1,2)</text><text x="264" y="184" font-size="28" fill="#20334a" text-anchor="middle">3</text><rect x="70" y="232" width="116" height="101" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="128" y="266" font-size="20" fill="#20334a" text-anchor="middle">格(2,1)</text><text x="128" y="310" font-size="28" fill="#20334a" text-anchor="middle">2</text><rect x="206" y="232" width="116" height="101" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="264" y="266" font-size="20" fill="#20334a" text-anchor="middle">格(2,2)</text><text x="264" y="310" font-size="28" fill="#20334a" text-anchor="middle">1</text><text x="375" y="127" font-size="22" fill="#20334a" text-anchor="start">按 u=s+t 分组：</text><text x="375" y="171" font-size="23" fill="#20334a" text-anchor="start">W[2]=1</text><text x="375" y="215" font-size="23" fill="#20334a" text-anchor="start">W[3]=3+2=5</text><text x="375" y="259" font-size="23" fill="#20334a" text-anchor="start">W[4]=1</text><text x="375" y="310" font-size="21" fill="#20334a" text-anchor="start">按 b=s−t+N 分组：</text><text x="375" y="354" font-size="21" fill="#20334a" text-anchor="start">V[1],V[2],V[3]=3,2,2</text><rect x="22" y="386" width="676" height="137" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="40" y="424" font-size="22" fill="#20334a" text-anchor="start">聚集在绿色格(1,1)：G[2]=5×1+1×2=7</text><text x="40" y="465" font-size="22" fill="#20334a" text-anchor="start">H[2]=3×1+2×1=5；总费(7+5)/2=6</text><text x="40" y="503" font-size="22" fill="#06613b" text-anchor="start">逐格直接计算也为 3+2+1=6</text></g></svg>