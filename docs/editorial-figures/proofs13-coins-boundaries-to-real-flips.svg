<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img"><title>原三行001 010 011，边界一零恢复行翻转零一一得到001 101 100，九格价值每行一四一总十八；滚动DP首行五六，中行下界零十二一下界十一，末强制零十八，中行四种五二六五，平方上下共同贡献四</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">边界(a,b)=(1,0) ⇒真实翻行(0,1,1)</text><text x="80" y="80" font-size="21" fill="#20334a" text-anchor="start">原棋盘</text><rect x="80" y="106" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="107" y="139" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="144" y="106" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="171" y="139" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="208" y="106" width="54" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="235" y="139" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="80" y="164" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="107" y="197" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="144" y="164" width="54" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="171" y="197" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="208" y="164" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="235" y="197" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="80" y="222" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="107" y="255" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="144" y="222" width="54" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="171" y="255" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="208" y="222" width="54" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="235" y="255" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="421" y="80" font-size="21" fill="#20334a" text-anchor="start">翻第2、3行</text><rect x="421" y="106" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="448" y="139" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="485" y="106" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="512" y="139" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="549" y="106" width="54" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="576" y="139" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="421" y="164" width="54" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="448" y="197" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="485" y="164" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="512" y="197" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="549" y="164" width="54" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="576" y="197" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="421" y="222" width="54" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="448" y="255" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="485" y="222" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="512" y="255" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="549" y="222" width="54" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="576" y="255" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="22" y="319" font-size="21" fill="#20334a" text-anchor="start">翻后每行三格的价值均为1、4、1，合计18</text><text x="22" y="366" font-size="21" fill="#20334a" text-anchor="start">中间格有上下两位同面邻居：(0+1+1)²=4</text><rect x="22" y="401" width="676" height="52" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="34" y="435" font-size="20" fill="#20334a" text-anchor="start">结算当前行</text><text x="219" y="435" font-size="20" fill="#20334a" text-anchor="start">下一边界0</text><text x="479" y="435" font-size="20" fill="#20334a" text-anchor="start">下一边界1</text><rect x="22" y="463" width="676" height="52" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="34" y="497" font-size="20" fill="#20334a" text-anchor="start">第1行：dp</text><text x="219" y="497" font-size="20" fill="#20334a" text-anchor="start">5</text><text x="479" y="497" font-size="20" fill="#20334a" text-anchor="start">6</text><rect x="22" y="525" width="676" height="52" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="34" y="559" font-size="17" fill="#20334a" text-anchor="start">第2行：dp</text><text x="219" y="559" font-size="17" fill="#20334a" text-anchor="start">max(5+5,6+6)=12</text><text x="479" y="559" font-size="17" fill="#20334a" text-anchor="start">max(5+2,6+5)=11</text><rect x="22" y="587" width="676" height="52" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="34" y="621" font-size="17" fill="#20334a" text-anchor="start">第3行：最终</text><text x="219" y="621" font-size="17" fill="#20334a" text-anchor="start">max(12+6,11+5)=18</text><text x="479" y="621" font-size="17" fill="#20334a" text-anchor="start">虚拟末边界禁用1</text><text x="22" y="703" font-size="19" fill="#20334a" text-anchor="start">中间行F(0,0)=5，F(0,1)=2，F(1,0)=6，F(1,1)=5</text><text x="22" y="750" font-size="20" fill="#20334a" text-anchor="start">末行只缺下邻居；虚拟边界0并不制造一条同面边</text></g></svg>