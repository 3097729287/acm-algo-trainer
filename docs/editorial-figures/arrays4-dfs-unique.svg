<svg xmlns="http://www.w3.org/2000/svg" width="925" height="560" viewBox="0 0 925 560" role="img"><title>BFS与真正DFS对每点前一层邻居唯一性的区别</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="24" y="36" font-size="24" fill="#20334a" text-anchor="start">同一图的边：1—2、1—3、2—4、3—4</text><text x="24" y="76" font-size="21" fill="#20334a" text-anchor="start">BFS分层：点4有两个前一层邻居</text><line x1="205" y1="152" x2="105" y2="260" stroke="#087b48" stroke-width="4"/><line x1="205" y1="152" x2="305" y2="260" stroke="#087b48" stroke-width="4"/><line x1="105" y1="260" x2="205" y2="368" stroke="#c2410c" stroke-width="4"/><line x1="305" y1="260" x2="205" y2="368" stroke="#c2410c" stroke-width="4"/><circle cx="205" cy="152" r="28" fill="#fff" stroke="#334155" stroke-width="2"/><text x="205" y="160" font-size="19" fill="#20334a" text-anchor="middle">A=0</text><text x="205" y="114" font-size="19" fill="#20334a" text-anchor="middle">点1</text><circle cx="105" cy="260" r="28" fill="#fff" stroke="#334155" stroke-width="2"/><text x="105" y="268" font-size="19" fill="#20334a" text-anchor="middle">A=1</text><text x="105" y="222" font-size="19" fill="#20334a" text-anchor="middle">点2</text><circle cx="305" cy="260" r="28" fill="#fff" stroke="#334155" stroke-width="2"/><text x="305" y="268" font-size="19" fill="#20334a" text-anchor="middle">A=1</text><text x="305" y="222" font-size="19" fill="#20334a" text-anchor="middle">点3</text><circle cx="205" cy="368" r="28" fill="#fff" stroke="#334155" stroke-width="2"/><text x="205" y="376" font-size="19" fill="#20334a" text-anchor="middle">A=2</text><text x="205" y="330" font-size="19" fill="#20334a" text-anchor="middle">点4</text><text x="469" y="76" font-size="21" fill="#20334a" text-anchor="start">真正DFS：1→2→4→3</text><line x1="650" y1="152" x2="550" y2="260" stroke="#087b48" stroke-width="4"/><line x1="650" y1="152" x2="750" y2="260" stroke="#2d6db4" stroke-width="4" stroke-dasharray="8 6"/><line x1="550" y1="260" x2="650" y2="368" stroke="#087b48" stroke-width="4"/><line x1="750" y1="260" x2="650" y2="368" stroke="#087b48" stroke-width="4"/><circle cx="650" cy="152" r="28" fill="#fff" stroke="#334155" stroke-width="2"/><text x="650" y="160" font-size="19" fill="#20334a" text-anchor="middle">A=0</text><text x="650" y="114" font-size="19" fill="#20334a" text-anchor="middle">点1</text><circle cx="550" cy="260" r="28" fill="#fff" stroke="#334155" stroke-width="2"/><text x="550" y="268" font-size="19" fill="#20334a" text-anchor="middle">A=1</text><text x="550" y="222" font-size="19" fill="#20334a" text-anchor="middle">点2</text><circle cx="750" cy="260" r="28" fill="#fff" stroke="#334155" stroke-width="2"/><text x="750" y="268" font-size="19" fill="#20334a" text-anchor="middle">A=3</text><text x="750" y="222" font-size="19" fill="#20334a" text-anchor="middle">点3</text><circle cx="650" cy="368" r="28" fill="#fff" stroke="#334155" stroke-width="2"/><text x="650" y="376" font-size="19" fill="#20334a" text-anchor="middle">A=2</text><text x="650" y="330" font-size="19" fill="#20334a" text-anchor="middle">点4</text><text x="24" y="431" font-size="22" fill="#c2410c" text-anchor="start">左：A₄−1=1，点2和点3都符合。</text><text x="469" y="431" font-size="22" fill="#087b48" text-anchor="start">右：A₄−1=1，仅点2符合。</text><text x="24" y="480" font-size="21" fill="#20334a" text-anchor="start">右图绿线是DFS树边，蓝虚线1—3连接祖先与后代，深度差3。</text><text x="24" y="523" font-size="21" fill="#20334a" text-anchor="start">点3的前一深度邻居仅点4；点2的仅点1。不能用BFS替换。</text></g></svg>