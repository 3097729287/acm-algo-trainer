<svg xmlns="http://www.w3.org/2000/svg" width="780" height="650" viewBox="0 0 780 650" role="img"><title>六块石头真实有向跳跃图，一号到二三再到四六，五号不可达；可达五原身份按权值去重为一二三四</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><text x="24" y="35" font-size="21" fill="#20334a" text-anchor="start">原权值[2,4,3,2,1,1]：从1出发合并所有可能路线</text><path d="M96.60225351200316,198.87664069936028 L233.57535733895958,136.94731184142785" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M95.83755450838055,222.67955027041518 L234.3967007132209,296.3812237836281" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M287.0,125.0 L441.0,125.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M286.21188672108013,131.47587789579626 Q450,-40 656.8464920403213,223.04442744525585" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M286.53400841297,305.00536312226444 L656.5005094823655,235.36460997979003" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M494.2613229316337,136.84855305963504 L658.9415420363935,217.27377634335497" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M492.8660296990328,350.6422604215375 L660.440190323261,245.42127584353378" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><circle cx="72" cy="210" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="72" y="217" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="72" y="265" font-size="18" fill="#20334a" text-anchor="middle">c=2</text><circle cx="260" cy="125" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="260" y="132" font-size="22" fill="#20334a" text-anchor="middle">2</text><text x="260" y="180" font-size="18" fill="#20334a" text-anchor="middle">c=4</text><circle cx="260" cy="310" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="260" y="317" font-size="22" fill="#20334a" text-anchor="middle">3</text><text x="260" y="365" font-size="18" fill="#20334a" text-anchor="middle">c=3</text><circle cx="470" cy="125" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="470" y="132" font-size="22" fill="#20334a" text-anchor="middle">4</text><text x="470" y="180" font-size="18" fill="#20334a" text-anchor="middle">c=2</text><circle cx="470" cy="365" r="27" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="470" y="372" font-size="22" fill="#20334a" text-anchor="middle">5</text><text x="470" y="420" font-size="18" fill="#20334a" text-anchor="middle">c=1</text><circle cx="685" cy="230" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="685" y="237" font-size="22" fill="#20334a" text-anchor="middle">6</text><text x="685" y="285" font-size="18" fill="#20334a" text-anchor="middle">c=1</text><text x="34" y="94" font-size="18" fill="#20334a" text-anchor="start">1→2=2×1；1→3=1+c1</text><text x="530" y="80" font-size="18" fill="#20334a" text-anchor="start">2→6=2+c2</text><text x="330" y="207" font-size="18" fill="#20334a" text-anchor="start">2→4=2×2</text><text x="330" y="245" font-size="18" fill="#20334a" text-anchor="start">3→6两动作重合</text><text x="24" y="447" font-size="21" fill="#20334a" text-anchor="start">可达原编号{1,2,3,4,6}；5不在其中。</text><text x="24" y="490" font-size="22" fill="#20334a" text-anchor="start">F6={1}；F4={2,1}；F3={3,1}。</text><text x="24" y="533" font-size="21" fill="#20334a" text-anchor="start">F2={4,2,1}；F1={2}∪F2∪F3={1,2,3,4}。</text><text x="24" y="576" font-size="21" fill="#20334a" text-anchor="start">五块可达石头只贡献四种值；1与4都写2。</text><text x="24" y="619" font-size="19" fill="#20334a" text-anchor="start">压缩[1,2,3,4] → 第0、1、2、3位，全开后popcount=4。</text></g></svg>