<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>真实三乘三费用网格，三个中心和四个白色稳定格，在起点二一走到中心二二后Bob四种落点都逐一列出，下一回合仍可水平走回指定中心</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">官方3×3费用：选中心列[1,2,1]，绿色格预先涂白</text><rect x="31" y="86" width="100" height="100" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="81" y="125" font-size="21" fill="#20334a" text-anchor="middle">中心</text><text x="81" y="162" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="143" y="86" width="100" height="100" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="193" y="125" font-size="21" fill="#20334a" text-anchor="middle">白格</text><text x="193" y="162" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="255" y="86" width="100" height="100" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="305" y="125" font-size="21" fill="#20334a" text-anchor="middle">黑格</text><text x="305" y="162" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="31" y="198" width="100" height="100" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="81" y="237" font-size="21" fill="#20334a" text-anchor="middle">白格</text><text x="81" y="274" font-size="25" fill="#20334a" text-anchor="middle">8</text><rect x="143" y="198" width="100" height="100" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="193" y="237" font-size="21" fill="#20334a" text-anchor="middle">中心</text><text x="193" y="274" font-size="25" fill="#20334a" text-anchor="middle">9</text><rect x="255" y="198" width="100" height="100" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="305" y="237" font-size="21" fill="#20334a" text-anchor="middle">白格</text><text x="305" y="274" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="31" y="310" width="100" height="100" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="81" y="349" font-size="21" fill="#20334a" text-anchor="middle">中心</text><text x="81" y="386" font-size="25" fill="#20334a" text-anchor="middle">7</text><rect x="143" y="310" width="100" height="100" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="193" y="349" font-size="21" fill="#20334a" text-anchor="middle">白格</text><text x="193" y="386" font-size="25" fill="#20334a" text-anchor="middle">6</text><rect x="255" y="310" width="100" height="100" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="305" y="349" font-size="21" fill="#20334a" text-anchor="middle">黑格</text><text x="305" y="386" font-size="25" fill="#20334a" text-anchor="middle">5</text><text x="404" y="115" font-size="23" fill="#20334a" text-anchor="start">起点(2,1)</text><text x="404" y="158" font-size="21" fill="#20334a" text-anchor="start">Alice：右到(2,2)</text><text x="404" y="203" font-size="22" fill="#20334a" text-anchor="start">Bob四种选择：</text><text x="404" y="247" font-size="21" fill="#20334a" text-anchor="start">上：(1,2)，白</text><text x="404" y="291" font-size="21" fill="#20334a" text-anchor="start">下：(3,2)，白</text><text x="404" y="335" font-size="21" fill="#20334a" text-anchor="start">左：(2,1)，白</text><text x="404" y="379" font-size="21" fill="#20334a" text-anchor="start">右：(2,3)，白</text><text x="22" y="465" font-size="21" fill="#20334a" text-anchor="start">下一回合：从落点水平走到它所在行的蓝框中心，重复</text><text x="22" y="508" font-size="21" fill="#20334a" text-anchor="start">例如落到(1,2)：Alice左到(1,1)，Bob只能到两格白格</text><text x="22" y="551" font-size="22" fill="#20334a" text-anchor="start">涂白费用 2+(8+4)+6=20；中心本身的费用不支付</text><text x="22" y="594" font-size="21" fill="#20334a" text-anchor="start">绿色四格组成稳定集合W；中心是Alice行动后的格子</text></g></svg>