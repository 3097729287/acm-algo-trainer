<svg xmlns="http://www.w3.org/2000/svg" width="640" height="770" viewBox="0 0 640 770" role="img"><title>二维预算内的真实食品组合和转移操作数</title><rect width="640" height="770" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16867b"/></marker></defs><text x="24" y="34" class="title" text-anchor="start">真实消耗平面：体积和质量都要满足</text><text x="24" y="72" class="small" text-anchor="start">点旁为食品身份及热量；蓝框内为允许预算</text><rect x="70" y="170" width="325" height="325" rx="0" fill="#d9edf8" stroke="#7394aa"/><line x1="70" y1="495" x2="70" y2="105" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="495" x2="460" y2="495" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><text x="70" y="522" class="small" text-anchor="middle">0</text><text x="46" y="500" class="small" text-anchor="middle">0</text><line x1="135" y1="495" x2="135" y2="105" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="430" x2="460" y2="430" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><text x="135" y="522" class="small" text-anchor="middle">1</text><text x="46" y="435" class="small" text-anchor="middle">1</text><line x1="200" y1="495" x2="200" y2="105" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="365" x2="460" y2="365" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><text x="200" y="522" class="small" text-anchor="middle">2</text><text x="46" y="370" class="small" text-anchor="middle">2</text><line x1="265" y1="495" x2="265" y2="105" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="300" x2="460" y2="300" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><text x="265" y="522" class="small" text-anchor="middle">3</text><text x="46" y="305" class="small" text-anchor="middle">3</text><line x1="330" y1="495" x2="330" y2="105" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="235" x2="460" y2="235" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><text x="330" y="522" class="small" text-anchor="middle">4</text><text x="46" y="240" class="small" text-anchor="middle">4</text><line x1="395" y1="495" x2="395" y2="105" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="170" x2="460" y2="170" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><text x="395" y="522" class="small" text-anchor="middle">5</text><text x="46" y="175" class="small" text-anchor="middle">5</text><line x1="460" y1="495" x2="460" y2="105" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="105" x2="460" y2="105" stroke="#d3dde6" stroke-width="1" stroke-dasharray=""/><text x="460" y="522" class="small" text-anchor="middle">6</text><text x="46" y="110" class="small" text-anchor="middle">6</text><text x="480" y="521" class="small" text-anchor="start">体积</text><text x="24" y="92" class="small" text-anchor="start">质量</text><circle cx="200" cy="170" r="8" fill="#b8e2d3" stroke="#52677b"/><text x="144" y="153" class="small" text-anchor="start">A：9</text><circle cx="265" cy="235" r="8" fill="#b8e2d3" stroke="#52677b"/><text x="280" y="256" class="small" text-anchor="start">B：8</text><circle cx="200" cy="430" r="8" fill="#fff0b7" stroke="#52677b"/><text x="218" y="455" class="small" text-anchor="start">C：2</text><circle cx="395" cy="170" r="8" fill="#b8e2d3" stroke="#52677b"/><text x="418" y="180" class="small" text-anchor="start">B+C：10</text><circle cx="330" cy="105" r="8" fill="#f8ced0" stroke="#52677b"/><text x="350" y="112" class="small" text-anchor="start">A+C：11 超质量</text><text x="24" y="566" class="" text-anchor="start">处理C前：旧(5,5)=9(A)，旧(3,4)=8(B)</text><rect x="40" y="596" width="230" height="44" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="155" y="625" class="small" text-anchor="middle">旧预算(3,4)：8</text><line x1="275" y1="618" x2="363" y2="618" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="592" class="small" text-anchor="middle">+C(2,1,2)</text><rect x="370" y="596" width="235" height="44" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="487" y="625" class="small" text-anchor="middle">新(5,5)：max(9,8+2)=10</text><text x="24" y="690" class="" text-anchor="start">新方案B+C：体积3+2=5，质量4+1=5</text><text x="24" y="731" class="" text-anchor="start">A+C：体积2+2=4，但质量5+1=6越界</text></svg>