<svg xmlns="http://www.w3.org/2000/svg" width="720" height="821" viewBox="0 0 720 821" role="img"><title>原样例六点带权树左右各画完整原树，左原两段二六五将三四及四六两边走两次总十四，右新二五桥段只走二一三五权四，保留旧最后五一权三，十七减七减七加四得七，跳过访问点不删除原树点</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">原样例：替换两段7+7为一段4，原树始终保留</text><text x="22" y="80" font-size="20" fill="#20334a" text-anchor="start">旧两段2→6→5</text><path d="M137 113 L54 235" stroke="#2563eb" stroke-width="5" fill="none"/><text x="109.5" y="174.0" font-size="18" fill="#20334a" text-anchor="start">1</text><path d="M137 113 L247 235" stroke="#2563eb" stroke-width="5" fill="none"/><text x="206.0" y="174.0" font-size="18" fill="#20334a" text-anchor="start">1</text><path d="M247 235 L187 359" stroke="#2563eb" stroke-width="5" fill="none"/><text x="137.0" y="297.0" font-size="18" fill="#20334a" text-anchor="start">2×2次</text><path d="M247 235 L307 359" stroke="#2563eb" stroke-width="5" fill="none"/><text x="291.0" y="297.0" font-size="18" fill="#20334a" text-anchor="start">2</text><path d="M187 359 L187 473" stroke="#2563eb" stroke-width="5" fill="none"/><text x="201.0" y="416.0" font-size="18" fill="#20334a" text-anchor="start">3×2次</text><circle cx="137" cy="113" r="21" fill="#e2e8f0" stroke="#285b87" stroke-width="2"/><text x="137" y="120" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="54" cy="235" r="21" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="54" y="242" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="247" cy="235" r="21" fill="#e2e8f0" stroke="#285b87" stroke-width="2"/><text x="247" y="242" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="187" cy="359" r="21" fill="#e2e8f0" stroke="#285b87" stroke-width="2"/><text x="187" y="366" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="307" cy="359" r="21" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="307" y="366" font-size="21" fill="#20334a" text-anchor="middle">5</text><circle cx="187" cy="473" r="21" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="187" y="480" font-size="21" fill="#20334a" text-anchor="middle">6</text><text x="387" y="80" font-size="20" fill="#20334a" text-anchor="start">新桥段2→5</text><path d="M502 113 L419 235" stroke="#16a34a" stroke-width="5" fill="none"/><text x="474.5" y="174.0" font-size="18" fill="#20334a" text-anchor="start">1</text><path d="M502 113 L612 235" stroke="#16a34a" stroke-width="5" fill="none"/><text x="571.0" y="174.0" font-size="18" fill="#20334a" text-anchor="start">1</text><path d="M612 235 L552 359" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="596.0" y="297.0" font-size="18" fill="#20334a" text-anchor="start">2</text><path d="M612 235 L672 359" stroke="#16a34a" stroke-width="5" fill="none"/><text x="656.0" y="297.0" font-size="18" fill="#20334a" text-anchor="start">2</text><path d="M552 359 L552 473" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="566.0" y="416.0" font-size="18" fill="#20334a" text-anchor="start">3</text><circle cx="502" cy="113" r="21" fill="#e2e8f0" stroke="#285b87" stroke-width="2"/><text x="502" y="120" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="419" cy="235" r="21" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="419" y="242" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="612" cy="235" r="21" fill="#e2e8f0" stroke="#285b87" stroke-width="2"/><text x="612" y="242" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="552" cy="359" r="21" fill="#e2e8f0" stroke="#285b87" stroke-width="2"/><text x="552" y="366" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="672" cy="359" r="21" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="672" y="366" font-size="21" fill="#20334a" text-anchor="middle">5</text><circle cx="552" cy="473" r="21" fill="#e2e8f0" stroke="#285b87" stroke-width="2"/><text x="552" y="480" font-size="21" fill="#20334a" text-anchor="middle">6</text><text x="22" y="546" font-size="21" fill="#20334a" text-anchor="start">2→6：2—1—3—4—6，费用1+1+2+3=7</text><text x="22" y="593" font-size="21" fill="#20334a" text-anchor="start">6→5：6—4—3—5，费用3+2+2=7</text><text x="22" y="640" font-size="21" fill="#20334a" text-anchor="start">右图2→5只走2—1—3—5，费用1+1+2=4</text><text x="22" y="687" font-size="21" fill="#20334a" text-anchor="start">原最后一段5→1费用3未改：17−7−7+4=7</text><text x="22" y="744" font-size="20" fill="#20334a" text-anchor="start">旧边3—4、4—6各乘两次车，不能先合并为边集合</text><text x="22" y="791" font-size="20" fill="#20334a" text-anchor="start">跳过最后景点1时，2→6仍经过1；删的是必游位置</text></g></svg>