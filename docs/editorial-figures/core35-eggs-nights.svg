nchor="start">第5晚起停产；第4箱到第6天才孵化，已无贡献。</text><text x="24" y="797" fill="#12365a" font-size="22" text-anchor="start">第3、4晚：箱2同时和箱1、箱3各产一枚。</text><text x="24" y="848" fill="#12365a" font-size="22" text-anchor="start">按“相邻对×晚上”分清每枚蛋：3+2+0+0=5。</text></svg>