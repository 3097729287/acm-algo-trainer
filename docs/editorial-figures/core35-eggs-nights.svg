<svg xmlns="http://www.w3.org/2000/svg" width="760" height="891" viewBox="0 0 760 891" role="img"><title>五箱公母公母公孵化日一二三六一，在同一晚数轴上边一二于二三四晚产三枚，边二三于三四晚产两枚，后两边均零，第五晚起停产</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#12365a" font-size="24" text-anchor="start">t=5：公母交替，邻边可以同时产蛋</text><rect x="40" y="72" width="116" height="112" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="98" y="103" fill="#12365a" font-size="21" text-anchor="middle">箱1</text><text x="98" y="141" fill="#12365a" font-size="27" text-anchor="middle">公</text><text x="98" y="170" fill="#12365a" font-size="16" text-anchor="middle">第1天孵化</text><rect x="182" y="72" width="116" height="112" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="240" y="103" fill="#12365a" font-size="21" text-anchor="middle">箱2</text><text x="240" y="141" fill="#12365a" font-size="27" text-anchor="middle">母</text><text x="240" y="170" fill="#12365a" font-size="16" text-anchor="middle">第2天孵化</text><rect x="324" y="72" width="116" height="112" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="382" y="103" fill="#12365a" font-size="21" text-anchor="middle">箱3</text><text x="382" y="141" fill="#12365a" font-size="27" text-anchor="middle">公</text><text x="382" y="170" fill="#12365a" font-size="16" text-anchor="middle">第3天孵化</text><rect x="466" y="72" width="116" height="112" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="524" y="103" fill="#12365a" font-size="21" text-anchor="middle">箱4</text><text x="524" y="141" fill="#12365a" font-size="27" text-anchor="middle">母</text><text x="524" y="170" fill="#12365a" font-size="16" text-anchor="middle">第6天孵化</text><rect x="608" y="72" width="116" height="112" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="666" y="103" fill="#12365a" font-size="21" text-anchor="middle">箱5</text><text x="666" y="141" fill="#12365a"