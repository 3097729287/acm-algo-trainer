<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img"><title>一次原价覆盖一次额外原价补券后再买两种券价商品的真实券流，重复购买没有增加覆盖种类</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="23" y="36" font-size="23" fill="#20334a" text-anchor="start">三种商品：(A,B)=(3,2)、(10,1)、(10,1)</text><text x="23" y="76" font-size="22" fill="#20334a" text-anchor="start">k=1：指定商品1原价覆盖，商品2、3用券覆盖</text><text x="455" y="116" font-size="21" fill="#20334a" text-anchor="start">操作后的券</text><rect x="24" y="136" width="410" height="87" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="40" y="169" font-size="23" fill="#20334a" text-anchor="start">原价买商品1，付3</text><text x="40" y="204" font-size="21" fill="#20334a" text-anchor="start">覆盖商品1；得到一张券</text><rect x="482" y="157" width="72" height="46" rx="8" fill="#fef3c7" stroke="#9a6812" stroke-width="2"/><text x="518" y="188" font-size="24" fill="#835400" text-anchor="middle">券</text><path d="M570,226 L570,242" fill="none" stroke="#9a6812" stroke-width="3"/><polygon points="570,242 565.0,232.0 575.0,232.0" fill="#9a6812"/><rect x="24" y="247" width="410" height="87" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="40" y="280" font-size="23" fill="#20334a" text-anchor="start">再次原价买商品1，付3</text><text x="40" y="315" font-size="21" fill="#20334a" text-anchor="start">只为补券；覆盖范围不增加</text><rect x="482" y="268" width="72" height="46" rx="8" fill="#fef3c7" stroke="#9a6812" stroke-width="2"/><text x="518" y="299" font-size="24" fill="#835400" text-anchor="middle">券</text><rect x="572" y="268" width="72" height="46" rx="8" fill="#fef3c7" stroke="#9a6812" stroke-width="2"/><text x="608" y="299" font-size="24" fill="#835400" text-anchor="middle">券</text><path d="M570,337 L570,353" fill="none" stroke="#9a6812" stroke-width="3"/><polygon points="570,353 565.0,343.0 575.0,343.0" fill="#9a6812"/><rect x="24" y="358" width="410" height="87" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="40" y="391" font-size="23" fill="#20334a" text-anchor="start">用券买商品2，付1</text><text x="40" y="426" font-size="21" fill="#20334a" text-anchor="start">覆盖商品2；消耗一张券</text><rect x="482" y="379" width="72" height="46" rx="8" fill="#fef3c7" stroke="#9a6812" stroke-width="2"/><text x="518" y="410" font-size="24" fill="#835400" text-anchor="middle">券</text><path d="M570,448 L570,464" fill="none" stroke="#9a6812" stroke-width="3"/><polygon points="570,464 565.0,454.0 575.0,454.0" fill="#9a6812"/><rect x="24" y="469" width="410" height="87" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="40" y="502" font-size="23" fill="#20334a" text-anchor="start">用券买商品3，付1</text><text x="40" y="537" font-size="21" fill="#20334a" text-anchor="start">覆盖商品3；消耗最后一张券</text><text x="530" y="521" font-size="24" fill="#20334a" text-anchor="middle">0张</text><rect x="22" y="602" width="676" height="94" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="40" y="639" font-size="22" fill="#20334a" text-anchor="start">券：0→1→2→1→0；商品1、2、3都已经买到</text><text x="40" y="678" font-size="22" fill="#06613b" text-anchor="start">总费 3+3+1+1=8 = 基准4 + 差价1 + 补券3</text></g></svg>