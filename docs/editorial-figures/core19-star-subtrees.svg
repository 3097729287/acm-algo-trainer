<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640" role="img"><title>实际六结点树和中心二选邻居一四五的四颗完整星形子图，加中心一及中心三各一颗得六</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="21" fill="#20334a" text-anchor="start">原树：L=3，R=4；右边画中心2的全部四颗</text><line x1="180" y1="105" x2="100" y2="225" stroke="#94a3b8" stroke-width="3"/><line x1="180" y1="105" x2="280" y2="225" stroke="#94a3b8" stroke-width="3"/><line x1="100" y1="225" x2="45" y2="355" stroke="#94a3b8" stroke-width="3"/><line x1="100" y1="225" x2="160" y2="355" stroke="#94a3b8" stroke-width="3"/><line x1="280" y1="225" x2="335" y2="355" stroke="#94a3b8" stroke-width="3"/><circle cx="180" cy="105" r="21" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="180" y="112" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="100" cy="225" r="21" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="100" y="232" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="280" cy="225" r="21" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="280" y="232" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="45" cy="355" r="21" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="45" y="362" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="160" cy="355" r="21" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="160" y="362" font-size="21" fill="#20334a" text-anchor="middle">5</text><circle cx="335" cy="355" r="21" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="335" y="362" font-size="21" fill="#20334a" text-anchor="middle">6</text><line x1="470" y1="150" x2="422" y2="96" stroke="#059669" stroke-width="3"/><circle cx="422" cy="96" r="17" fill="#bbf7d0" stroke="#059669"/><text x="422" y="102" font-size="18" fill="#20334a" text-anchor="middle">1</text><line x1="470" y1="150" x2="518" y2="96" stroke="#059669" stroke-width="3"/><circle cx="518" cy="96" r="17" fill="#bbf7d0" stroke="#059669"/><text x="518" y="102" font-size="18" fill="#20334a" text-anchor="middle">4</text><circle cx="470" cy="150" r="19" fill="#dbeafe" stroke="#2563eb"/><text x="470" y="157" font-size="21" fill="#20334a" text-anchor="middle">2</text><line x1="660" y1="150" x2="612" y2="96" stroke="#059669" stroke-width="3"/><circle cx="612" cy="96" r="17" fill="#bbf7d0" stroke="#059669"/><text x="612" y="102" font-size="18" fill="#20334a" text-anchor="middle">1</text><line x1="660" y1="150" x2="708" y2="96" stroke="#059669" stroke-width="3"/><circle cx="708" cy="96" r="17" fill="#bbf7d0" stroke="#059669"/><text x="708" y="102" font-size="18" fill="#20334a" text-anchor="middle">5</text><circle cx="660" cy="150" r="19" fill="#dbeafe" stroke="#2563eb"/><text x="660" y="157" font-size="21" fill="#20334a" text-anchor="middle">2</text><line x1="470" y1="340" x2="422" y2="286" stroke="#059669" stroke-width="3"/><circle cx="422" cy="286" r="17" fill="#bbf7d0" stroke="#059669"/><text x="422" y="292" font-size="18" fill="#20334a" text-anchor="middle">4</text><line x1="470" y1="340" x2="518" y2="286" stroke="#059669" stroke-width="3"/><circle cx="518" cy="286" r="17" fill="#bbf7d0" stroke="#059669"/><text x="518" y="292" font-size="18" fill="#20334a" text-anchor="middle">5</text><circle cx="470" cy="340" r="19" fill="#dbeafe" stroke="#2563eb"/><text x="470" y="347" font-size="21" fill="#20334a" text-anchor="middle">2</text><line x1="660" y1="340" x2="612" y2="286" stroke="#059669" stroke-width="3"/><circle cx="612" cy="286" r="17" fill="#bbf7d0" stroke="#059669"/><text x="612" y="292" font-size="18" fill="#20334a" text-anchor="middle">1</text><line x1="660" y1="340" x2="708" y2="286" stroke="#059669" stroke-width="3"/><circle cx="708" cy="286" r="17" fill="#bbf7d0" stroke="#059669"/><text x="708" y="292" font-size="18" fill="#20334a" text-anchor="middle">4</text><line x1="660" y1="340" x2="660" y2="397" stroke="#059669" stroke-width="3"/><circle cx="660" cy="397" r="17" fill="#bbf7d0" stroke="#059669"/><text x="660" y="403" font-size="18" fill="#20334a" text-anchor="middle">5</text><circle cx="660" cy="340" r="19" fill="#dbeafe" stroke="#2563eb"/><text x="660" y="347" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="24" y="465" font-size="21" fill="#20334a" text-anchor="start">中心2：邻居{1,4,5}，三点选2个得3，四点全选得1。</text><text x="24" y="512" font-size="21" fill="#20334a" text-anchor="start">中心1还有{1,2,3}；中心3还有{1,3,6}。</text><text x="24" y="558" font-size="22" fill="#20334a" text-anchor="start">合计3+1+1+1=6；至少三点的中心唯一。</text><text x="24" y="605" font-size="20" fill="#20334a" text-anchor="start">单点6、单边5不在本例范围；不能重复按端点计边。</text></g></svg>