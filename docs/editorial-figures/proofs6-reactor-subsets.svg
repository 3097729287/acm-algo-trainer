<svg xmlns="http://www.w3.org/2000/svg" width="720" height="682" viewBox="0 0 720 682" role="img"><title>四个具体旧粒子及下降数量阈值的每次堆变化，T二为十七、T一为九、T三不可行，购买九十三用前缀最大得到一百零七，另示可以买但不用</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="20" fill="#20334a" text-anchor="start">旧粒子A(9,4)、B(8,2)、C(7,1)、D(100,0)：括号为(x,y)</text><rect x="24" y="69" width="151" height="96" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="99" y="103" font-size="26" fill="#20334a" text-anchor="middle">A</text><text x="99" y="145" font-size="21" fill="#20334a" text-anchor="middle">x=9, y=4</text><rect x="198" y="69" width="151" height="96" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="273" y="103" font-size="26" fill="#20334a" text-anchor="middle">B</text><text x="273" y="145" font-size="21" fill="#20334a" text-anchor="middle">x=8, y=2</text><rect x="372" y="69" width="151" height="96" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="447" y="103" font-size="26" fill="#20334a" text-anchor="middle">C</text><text x="447" y="145" font-size="21" fill="#20334a" text-anchor="middle">x=7, y=1</text><rect x="546" y="69" width="151" height="96" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="621" y="103" font-size="26" fill="#20334a" text-anchor="middle">D</text><text x="621" y="145" font-size="21" fill="#20334a" text-anchor="middle">x=100, y=0</text><text x="48" y="213" font-size="21" fill="#20334a" text-anchor="middle">s</text><text x="155" y="213" font-size="21" fill="#20334a" text-anchor="middle">新合格</text><text x="369" y="213" font-size="21" fill="#20334a" text-anchor="middle">保留的旧粒子</text><text x="623" y="213" font-size="21" fill="#20334a" text-anchor="middle">Tₛ</text><rect x="22" y="235" width="676" height="49" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="48" y="268" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="155" y="268" font-size="21" fill="#20334a" text-anchor="middle">A</text><text x="369" y="268" font-size="21" fill="#20334a" text-anchor="middle">A：不足4个</text><text x="623" y="268" font-size="21" fill="#20334a" text-anchor="middle">不可行</text><rect x="22" y="293" width="676" height="49" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="48" y="326" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="155" y="326" font-size="21" fill="#20334a" text-anchor="middle">无</text><text x="369" y="326" font-size="21" fill="#20334a" text-anchor="middle">A：不足3个</text><text x="623" y="326" font-size="21" fill="#20334a" text-anchor="middle">不可行</text><rect x="22" y="351" width="676" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="48" y="384" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="155" y="384" font-size="21" fill="#20334a" text-anchor="middle">B</text><text x="369" y="384" font-size="21" fill="#20334a" text-anchor="middle">A、B：9+8</text><text x="623" y="384" font-size="21" fill="#20334a" text-anchor="middle">17</text><rect x="22" y="409" width="676" height="49" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="48" y="442" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="155" y="442" font-size="21" fill="#20334a" text-anchor="middle">C</text><text x="369" y="442" font-size="21" fill="#20334a" text-anchor="middle">A：弹掉7与8</text><text x="623" y="442" font-size="21" fill="#20334a" text-anchor="middle">9</text><rect x="22" y="467" width="676" height="49" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="48" y="500" font-size="21" fill="#20334a" text-anchor="middle">0</text><text x="155" y="500" font-size="21" fill="#20334a" text-anchor="middle">D</text><text x="369" y="500" font-size="21" fill="#20334a" text-anchor="middle">空：最后全弹掉</text><text x="623" y="500" font-size="21" fill="#20334a" text-anchor="middle">0</text><text x="22" y="568" font-size="20" fill="#20334a" text-anchor="start">买(90,3)：选A、B与新粒子，三者各有2个同伴，均满足门槛</text><text x="22" y="612" font-size="21" fill="#20334a" text-anchor="start">T₃不可行，但pref[3]=17；使用新粒子得90+17=107</text><text x="22" y="656" font-size="20" fill="#20334a" text-anchor="start">不用新粒子可只选D得100；买(10,4)仍取100，买(101,0)取101</text></g></svg>