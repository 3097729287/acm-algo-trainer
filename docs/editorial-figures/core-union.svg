<svg xmlns="http://www.w3.org/2000/svg" width="620" height="499" viewBox="0 0 620 499" role="img"><title>同一个值的区间先求并集，值一与二独立相加，位置三只有两个不同元素</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="38" font-size="23" fill="#20334a" text-anchor="start">每个不同值，在同一位置最多贡献一次</text><text x="136" y="82" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="216" y="82" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="296" y="82" font-size="20" fill="#20334a" text-anchor="middle">3</text><text x="376" y="82" font-size="20" fill="#20334a" text-anchor="middle">4</text><text x="456" y="82" font-size="20" fill="#20334a" text-anchor="middle">5</text><text x="536" y="82" font-size="20" fill="#20334a" text-anchor="middle">6</text><text x="26" y="126" font-size="18" fill="#20334a" text-anchor="start">1 操作①</text><line x1="136" y1="119" x2="296" y2="119" stroke="#2d6db4" stroke-width="5"/><circle cx="136" cy="119" r="5" fill="#2d6db4"/><circle cx="296" cy="119" r="5" fill="#2d6db4"/><text x="26" y="172" font-size="18" fill="#20334a" text-anchor="start">1 操作②</text><line x1="296" y1="165" x2="456" y2="165" stroke="#2d6db4" stroke-width="5"/><circle cx="296" cy="165" r="5" fill="#2d6db4"/><circle cx="456" cy="165" r="5" fill="#2d6db4"/><text x="26" y="245" font-size="18" fill="#20334a" text-anchor="start">1 并集</text><line x1="136" y1="238" x2="456" y2="238" stroke="#087b48" stroke-width="5"/><circle cx="136" cy="238" r="5" fill="#087b48"/><circle cx="456" cy="238" r="5" fill="#087b48"/><text x="26" y="305" font-size="18" fill="#20334a" text-anchor="start">2 并集</text><line x1="216" y1="298" x2="376" y2="298" stroke="#8555a0" stroke-width="5"/><circle cx="216" cy="298" r="5" fill="#8555a0"/><circle cx="376" cy="298" r="5" fill="#8555a0"/><text x="26" y="369" font-size="20" fill="#20334a" text-anchor="start">大小</text><rect x="107" y="335" width="58" height="51" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="136" y="369" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="187" y="335" width="58" height="51" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="216" y="369" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="267" y="335" width="58" height="51" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="296" y="369" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="347" y="335" width="58" height="51" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="376" y="369" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="427" y="335" width="58" height="51" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="456" y="369" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="507" y="335" width="58" height="51" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="536" y="369" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="26" y="430" font-size="21" fill="#20334a" text-anchor="start">位置 3 虽被值 1 操作两次，集合仍为 {1,2}。</text><text x="26" y="468" font-size="21" fill="#20334a" text-anchor="start">同值先合并，再让不同值的零或一贡献相加。</text></g></svg>