<svg xmlns="http://www.w3.org/2000/svg" width="720" height="768" viewBox="0 0 720 768" role="img"><title>模四固定存储格在偏移变化前后的实际余数，旧零误移到余数三后再移回余数零</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="23" y="36" font-size="23" fill="#20334a" text-anchor="start">只看模4：原数组 [0,1,4]，旧零只有位置1</text><text x="23" y="75" font-size="22" fill="#20334a" text-anchor="start">格子位置固定；每格 R 只存该格人数的奇偶</text><text x="23" y="112" font-size="22" fill="#20334a" text-anchor="start">① 操作前：off=0</text><rect x="30" y="134" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="105" y="161" font-size="18" fill="#20334a" text-anchor="middle">格0：余数0</text><text x="105" y="194" font-size="18" fill="#20334a" text-anchor="middle">位置1=0</text><text x="105" y="224" font-size="18" fill="#20334a" text-anchor="middle">位置3=4</text><text x="105" y="281" font-size="21" fill="#20334a" text-anchor="middle">R[0]=0</text><rect x="200" y="134" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="275" y="161" font-size="18" fill="#20334a" text-anchor="middle">格1：余数1</text><text x="275" y="194" font-size="18" fill="#20334a" text-anchor="middle">位置2=1</text><text x="275" y="281" font-size="21" fill="#20334a" text-anchor="middle">R[1]=1</text><rect x="370" y="134" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="445" y="161" font-size="18" fill="#20334a" text-anchor="middle">格2：余数2</text><text x="445" y="204" font-size="20" fill="#667488" text-anchor="middle">无人</text><text x="445" y="281" font-size="21" fill="#20334a" text-anchor="middle">R[2]=0</text><rect x="540" y="134" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="615" y="161" font-size="18" fill="#20334a" text-anchor="middle">格3：余数3</text><text x="615" y="204" font-size="20" fill="#667488" text-anchor="middle">无人</text><text x="615" y="281" font-size="21" fill="#20334a" text-anchor="middle">R[3]=0</text><text x="23" y="322" font-size="22" fill="#20334a" text-anchor="start">② 只把 off 改为1：旧零被误解释成−1</text><rect x="30" y="344" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="105" y="371" font-size="18" fill="#20334a" text-anchor="middle">格0：余数3</text><text x="105" y="404" font-size="18" fill="#20334a" text-anchor="middle">位置1误当−1</text><text x="105" y="434" font-size="18" fill="#20334a" text-anchor="middle">位置3=3</text><text x="105" y="491" font-size="21" fill="#20334a" text-anchor="middle">R[0]=0</text><rect x="200" y="344" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="275" y="371" font-size="18" fill="#20334a" text-anchor="middle">格1：余数0</text><text x="275" y="404" font-size="18" fill="#20334a" text-anchor="middle">位置2=0</text><text x="275" y="491" font-size="21" fill="#20334a" text-anchor="middle">R[1]=1</text><rect x="370" y="344" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="445" y="371" font-size="18" fill="#20334a" text-anchor="middle">格2：余数1</text><text x="445" y="414" font-size="20" fill="#667488" text-anchor="middle">无人</text><text x="445" y="491" font-size="21" fill="#20334a" text-anchor="middle">R[2]=0</text><rect x="540" y="344" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="615" y="371" font-size="18" fill="#20334a" text-anchor="middle">格3：余数2</text><text x="615" y="414" font-size="20" fill="#667488" text-anchor="middle">无人</text><text x="615" y="491" font-size="21" fill="#20334a" text-anchor="middle">R[3]=0</text><text x="23" y="532" font-size="22" fill="#20334a" text-anchor="start">③ 把旧零从格0移到格1，修正后的真实数组 [0,0,3]</text><rect x="30" y="554" width="150" height="115" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="105" y="581" font-size="18" fill="#20334a" text-anchor="middle">格0：余数3</text><text x="105" y="614" font-size="18" fill="#20334a" text-anchor="middle">位置3=3</text><text x="105" y="701" font-size="21" fill="#20334a" text-anchor="middle">R[0]=1</text><rect x="200" y="554" width="150" height="115" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="275" y="581" font-size="18" fill="#20334a" text-anchor="middle">格1：余数0</text><text x="275" y="614" font-size="18" fill="#20334a" text-anchor="middle">位置1=0</text><text x="275" y="644" font-size="18" fill="#20334a" text-anchor="middle">位置2=0</text><text x="275" y="701" font-size="21" fill="#20334a" text-anchor="middle">R[1]=0</text><rect x="370" y="554" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="445" y="581" font-size="18" fill="#20334a" text-anchor="middle">格2：余数1</text><text x="445" y="624" font-size="20" fill="#667488" text-anchor="middle">无人</text><text x="445" y="701" font-size="21" fill="#20334a" text-anchor="middle">R[2]=0</text><rect x="540" y="554" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="615" y="581" font-size="18" fill="#20334a" text-anchor="middle">格3：余数2</text><text x="615" y="624" font-size="20" fill="#667488" text-anchor="middle">无人</text><text x="615" y="701" font-size="21" fill="#20334a" text-anchor="middle">R[3]=0</text><text x="23" y="744" font-size="22" fill="#20334a" text-anchor="start">两次翻转：R[旧 off=0] ^= 1；R[新 off=1] ^= 1</text></g></svg>