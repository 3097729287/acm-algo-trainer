ll="#20334a" text-anchor="start">值5</text><line x1="248" y1="248" x2="338" y2="248" stroke="#16a34a" stroke-width="3"/><circle cx="338" cy="248" r="4" fill="#16a34a"/><circle cx="248" cy="248" r="4" fill="#16a34a"/><text x="400" y="254" font-size="20" fill="#20334a" text-anchor="start">[2,3] = 05</text><text x="24" y="254" font-size="20" fill="#20334a" text-anchor="start">值5</text><line x1="338" y1="297" x2="338" y2="297" stroke="#16a34a" stroke-width="3"/><circle cx="338" cy="297" r="4" fill="#16a34a"/><circle cx="338" cy="297" r="4" fill="#16a34a"/><text x="400" y="303" font-size="20" fill="#20334a" text-anchor="start">[3,3] = 5</text><text x="24" y="303" font-size="20" fill="#20334a" text-anchor="start">值5</text><text x="24" y="379" font-size="20" fill="#20334a" text-anchor="start">0:4份；1:1份；5:3份；10:1份；51:3份；510:3份。</text><text x="24" y="426" font-size="20" fill="#20334a" text-anchor="start">总数4+1+3+1+3+3=15，等于五格全部区间数。</text><text x="24" y="473" font-size="20" fill="#20334a" text-anchor="start">原4的一只配原4作起点，不能再借前面跨过五的零。</text></g></svg>