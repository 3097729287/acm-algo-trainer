<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635" viewBox="0 0 720 635" role="img"><title>五个不同下标的一二二四四组成十对，四个同组低于四的异或与六个跨组异或，第一轮零零三三五极差从三增到五，第二轮零零三三三清掉最高位，第四轮归零</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="20" fill="#20334a" text-anchor="start">五个有身份的元素：A/B/C为1、2、2，D/E为4，最高位是第2位</text><rect x="39" y="82" width="113" height="54" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="95" y="118" font-size="23" fill="#20334a" text-anchor="middle">A:1</text><rect x="175" y="82" width="113" height="54" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="231" y="118" font-size="23" fill="#20334a" text-anchor="middle">B:2</text><rect x="311" y="82" width="113" height="54" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="367" y="118" font-size="23" fill="#20334a" text-anchor="middle">C:2</text><rect x="447" y="82" width="113" height="54" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="503" y="118" font-size="23" fill="#20334a" text-anchor="middle">D:4</text><rect x="583" y="82" width="113" height="54" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="639" y="118" font-size="23" fill="#20334a" text-anchor="middle">E:4</text><text x="22" y="192" font-size="21" fill="#20334a" text-anchor="start">同组四对AB、AC、BC、DE：值3、3、0、0，全都小于4</text><text x="22" y="239" font-size="20" fill="#20334a" text-anchor="start">跨组六对AD、AE、BD、BE、CD、CE：值5、5、6、6、6、6</text><text x="22" y="286" font-size="21" fill="#20334a" text-anchor="start">十个候选保留最小五个；B和C虽同值，仍是两个不同下标</text><text x="22" y="367" font-size="23" fill="#20334a" text-anchor="start">第一轮</text><rect x="158" y="332" width="89" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="202" y="369" font-size="25" fill="#20334a" text-anchor="middle">0</text><rect x="264" y="332" width="89" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="308" y="369" font-size="25" fill="#20334a" text-anchor="middle">0</text><rect x="370" y="332" width="89" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="414" y="369" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="476" y="332" width="89" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="520" y="369" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="582" y="332" width="89" height="53" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="626" y="369" font-size="25" fill="#20334a" text-anchor="middle">5</text><text x="22" y="420" font-size="20" fill="#20334a" text-anchor="start">四个低位数0、0、3、3有六对低位异或，第二轮足够选满五个</text><text x="22" y="484" font-size="23" fill="#20334a" text-anchor="start">第二轮</text><rect x="158" y="449" width="89" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="202" y="486" font-size="25" fill="#20334a" text-anchor="middle">0</text><rect x="264" y="449" width="89" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="308" y="486" font-size="25" fill="#20334a" text-anchor="middle">0</text><rect x="370" y="449" width="89" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="414" y="486" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="476" y="449" width="89" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="520" y="486" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="582" y="449" width="89" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="626" y="486" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="22" y="561" font-size="20" fill="#20334a" text-anchor="start">查询0、1、2轮的极差为3、5、3；数值可增大，最高位仍按界消去</text><text x="22" y="608" font-size="21" fill="#20334a" text-anchor="start">两轮清掉第2位；再两轮全零，已清掉的更高位不会重新出现</text></g></svg>