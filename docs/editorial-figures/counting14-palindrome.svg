aa"/><text x="217.0" y="586.0" class="" text-anchor="middle">a</text><rect x="255" y="558" width="54" height="42" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="282.0" y="586.0" class="" text-anchor="middle">b</text><rect x="320" y="558" width="54" height="42" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="347.0" y="586.0" class="" text-anchor="middle">a</text><rect x="385" y="558" width="54" height="42" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="412.0" y="586.0" class="" text-anchor="middle">b</text><line x1="203" y1="610" x2="140" y2="666" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="438" y1="610" x2="500" y2="666" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="105" y="638" class="small" text-anchor="start">删首</text><text x="491" y="638" class="small" text-anchor="start">删尾</text><rect x="60" y="683" width="48" height="40" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="84.0" y="710.0" class="" text-anchor="middle">b</text><rect x="118" y="683" width="48" height="40" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="142.0" y="710.0" class="" text-anchor="middle">a</text><rect x="176" y="683" width="48" height="40" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="200.0" y="710.0" class="" text-anchor="middle">b</text><rect x="405" y="683" width="48" height="40" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="429.0" y="710.0" class="" text-anchor="middle">a</text><rect x="463" y="683" width="48" height="40" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="487.0" y="710.0" class="" text-anchor="middle">b</text><rect x="521" y="683" width="48" height="40" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="545.0" y="710.0" class="" text-anchor="middle">a</text><text x="24" y="770" class="" text-anchor="start">两种动作对应同一个abab，要扣一次交集</text><text x="24" y="821" class="" text-anchor="start">N=4，q=26：按首次不匹配层数分类</text><rect x="24" y="851" width="592" height="131" rx="5" fill="#ffdf98" stroke="#7394aa"/><text x="44" y="888" class="" text-anchor="start">k0：16900+16900−650=33150</text><text x="44" y="927" class="" text-anchor="start">k1：26×(650+650−650)=16900</text><text x="44" y="966" class="" text-anchor="start">合计33150+16900=50050</text></svg>