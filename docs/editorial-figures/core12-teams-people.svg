ke-width="2"/><text x="473" y="224" font-size="21" fill="#20334a" text-anchor="middle">位置3 · 选手3b</text><rect x="360" y="247" width="226" height="38" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="473" y="273" font-size="21" fill="#20334a" text-anchor="middle">位置4 · 选手4b</text><rect x="360" y="296" width="226" height="38" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="473" y="322" font-size="21" fill="#20334a" text-anchor="middle">位置6 · 选手6a</text><text x="24" y="396" font-size="21" fill="#20334a" text-anchor="start">位置5给队0之后，位置6继续给队1，指针不重置。</text><text x="24" y="440" font-size="20" fill="#20334a" text-anchor="start">每位选手只在一份名单里；两队各五种位置，全部同时满足。</text></g></svg>