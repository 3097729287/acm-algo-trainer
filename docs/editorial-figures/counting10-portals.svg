<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" viewBox="0 0 640 710" role="img"><title>真实传送门操作与首个较大外部项</title><rect width="640" height="710" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16867b"/></marker></defs><text x="24" y="32" class="title" text-anchor="start">两座门始终跟着实际搬运移动</text><text x="24" y="66" class="small" text-anchor="start">紫线=门；绿=门内；蓝=门外；黄色标本次搬的数</text><text x="24" y="102" class="" text-anchor="start">初始：| 5,3 | 1,4,2</text><line x1="68" y1="113" x2="68" y2="169" stroke="#8954b1" stroke-width="5" stroke-dasharray=""/><rect x="123" y="120" width="46" height="42" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="146.0" y="148.0" class="" text-anchor="middle">5</text><rect x="201" y="120" width="46" height="42" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="224.0" y="148.0" class="" text-anchor="middle">3</text><line x1="302" y1="113" x2="302" y2="169" stroke="#8954b1" stroke-width="5" stroke-dasharray=""/><rect x="357" y="120" width="46" height="42" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="380.0" y="148.0" class="" text-anchor="middle">1</text><rect x="435" y="120" width="46" height="42" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="458.0" y="148.0" class="" text-anchor="middle">4</text><rect x="513" y="120" width="46" height="42" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="536.0" y="148.0" class="" text-anchor="middle">2</text><line x1="610" y1="174" x2="610" y2="231" stroke="#16867b" stroke-width="4" stroke-dasharray=""/><line x1="610" y1="174" x2="610.0" y2="202.5" stroke="#16867b" stroke-width="4" marker-end="url(#arrow)"/><text x="24" y="242" class="" text-anchor="start">门外1从右门右侧搬到左门左侧</text><rect x="45" y="260" width="46" height="42" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="68.0" y="288.0" class="" text-anchor="middle">1</text><line x1="146" y1="253" x2="146" y2="309" stroke="#8954b1" stroke-width="5" stroke-dasharray=""/><rect x="201" y="260" width="46" height="42" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="224.0" y="288.0" class="" text-anchor="middle">5</text><rect x="279" y="260" width="46" height="42" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="302.0" y="288.0" class="" text-anchor="middle">3</text><line x1="380" y1="253" x2="380" y2="309" stroke="#8954b1" stroke-width="5" stroke-dasharray=""/><rect x="435" y="260" width="46" height="42" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="458.0" y="288.0" class="" text-anchor="middle">4</text><rect x="513" y="260" width="46" height="42" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="536.0" y="288.0" class="" text-anchor="middle">2</text><line x1="610" y1="314" x2="610" y2="371" stroke="#16867b" stroke-width="4" stroke-dasharray=""/><line x1="610" y1="314" x2="610.0" y2="342.5" stroke="#16867b" stroke-width="4" marker-end="url(#arrow)"/><text x="24" y="382" class="" text-anchor="start">门内5从左门右侧搬到右门左侧</text><rect x="45" y="400" width="46" height="42" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="68.0" y="428.0" class="" text-anchor="middle">1</text><line x1="146" y1="393" x2="146" y2="449" stroke="#8954b1" stroke-width="5" stroke-dasharray=""/><rect x="201" y="400" width="46" height="42" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="224.0" y="428.0" class="" text-anchor="middle">3</text><rect x="279" y="400" width="46" height="42" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="302.0" y="428.0" class="" text-anchor="middle">5</text><line x1="380" y1="393" x2="380" y2="449" stroke="#8954b1" stroke-width="5" stroke-dasharray=""/><rect x="435" y="400" width="46" height="42" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="458.0" y="428.0" class="" text-anchor="middle">4</text><rect x="513" y="400" width="46" height="42" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="536.0" y="428.0" class="" text-anchor="middle">2</text><text x="24" y="494" class="" text-anchor="start">W始终为1,4,2；门内从5,3旋转为3,5</text><text x="24" y="542" class="small" text-anchor="start">切口0：3,5,1,4,2     第1项3大于1</text><text x="24" y="582" class="small" text-anchor="start">切口1：1,3,5,4,2     最优</text><text x="24" y="622" class="small" text-anchor="start">切口2：1,4,3,5,2     第2项4大于3</text><text x="24" y="675" class="small" text-anchor="start">扫描1&lt;3后停在4&gt;3，不能跳过4去拿后面的2</text></svg>