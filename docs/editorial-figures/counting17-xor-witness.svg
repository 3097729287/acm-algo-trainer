<svg xmlns="http://www.w3.org/2000/svg" width="640" height="901" viewBox="0 0 640 901" role="img"><title>五个原身份的有序公共前缀与同一异或掩码制造的真实中间对象</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247b65"/></marker></defs><rect width="640" height="901" fill="#f7fafc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="36" font-size="24" text-anchor="start" fill="#123750">五个原身份：排序只为查共同前缀</text><text x="24" y="81" font-size="19" text-anchor="start" fill="#123750">排序值1/2/4/5/6；原身份1/4/2/3/5</text><rect x="32" y="127" width="92" height="48" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="78.0" y="159" font-size="22" text-anchor="middle" fill="#123750">1</text><text x="78" y="207" font-size="17" text-anchor="middle" fill="#123750">原身份1</text><text x="78" y="240" font-size="20" text-anchor="middle" fill="#123750">001</text><rect x="152" y="127" width="92" height="48" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="198.0" y="159" font-size="22" text-anchor="middle" fill="#123750">2</text><text x="198" y="207" font-size="17" text-anchor="middle" fill="#123750">原身份4</text><text x="198" y="240" font-size="20" text-anchor="middle" fill="#123750">010</text><rect x="272" y="127" width="92" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="318.0" y="159" font-size="22" text-anchor="middle" fill="#123750">4</text><text x="318" y="207" font-size="17" text-anchor="middle" fill="#123750">原身份2</text><text x="318" y="240" font-size="20" text-anchor="middle" fill="#123750">100</text><rect x="392" y="127" width="92" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="438.0" y="159" font-size="22" text-anchor="middle" fill="#123750">5</text><text x="438" y="207" font-size="17" text-anchor="middle" fill="#123750">原身份3</text><text x="438" y="240" font-size="20" text-anchor="middle" fill="#123750">101</text><rect x="512" y="127" width="92" height="48" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="558.0" y="159" font-size="22" text-anchor="middle" fill="#123750">6</text><text x="558" y="207" font-size="17" text-anchor="middle" fill="#123750">原身份5</text><text x="558" y="240" font-size="20" text-anchor="middle" fill="#123750">110</text><path d="M33 268 L244 268" fill="none" stroke="#3b7898" stroke-width="5"/><text x="140" y="306" font-size="18" text-anchor="middle" fill="#123750">前缀0：只有1/2</text><path d="M272 268 L484 268" fill="none" stroke="#247b65" stroke-width="5"/><text x="378" y="306" font-size="18" text-anchor="middle" fill="#123750">前缀10：只有4/5</text><text x="24" y="365" font-size="19" text-anchor="start" fill="#123750">四五右移一位都为2，外邻居前缀1/3</text><text x="24" y="410" font-size="19" text-anchor="start" fill="#123750">所以四五合法；一二也合法，共两对</text><path d="M20 451 L620 451" fill="none" stroke="#536c7e" stroke-width="2"/><text x="24" y="498" font-size="19" text-anchor="start" fill="#123750">五六的共同前缀1，还包含第三个值四</text><text x="24" y="544" font-size="19" text-anchor="start" fill="#123750">统一异或一，保持原下标先后：</text><text x="106" y="596" font-size="21" text-anchor="middle" fill="#123750">5 XOR 1</text><rect x="46" y="620" width="120" height="48" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="106.0" y="652" font-size="22" text-anchor="middle" fill="#123750">4</text><text x="106" y="707" font-size="18" text-anchor="middle" fill="#123750">较早身份3</text><text x="312" y="596" font-size="21" text-anchor="middle" fill="#123750">4 XOR 1</text><rect x="252" y="620" width="120" height="48" rx="7" fill="#fad2c9" stroke="#91a9be"/><text x="312.0" y="652" font-size="22" text-anchor="middle" fill="#123750">5</text><text x="312" y="707" font-size="18" text-anchor="middle" fill="#123750">第三数身份2</text><text x="518" y="596" font-size="21" text-anchor="middle" fill="#123750">6 XOR 1</text><rect x="458" y="620" width="120" height="48" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="518.0" y="652" font-size="22" text-anchor="middle" fill="#123750">7</text><text x="518" y="707" font-size="18" text-anchor="middle" fill="#123750">较晚身份5</text><text x="224" y="656" font-size="28" text-anchor="middle" fill="#123750">&lt;</text><text x="430" y="656" font-size="28" text-anchor="middle" fill="#123750">&lt;</text><text x="24" y="768" font-size="19" text-anchor="start" fill="#123750">严格4 &lt; 5 &lt; 7：两个或条件同时失败</text><text x="24" y="817" font-size="19" text-anchor="start" fill="#123750">这一个实际掩码足以排除原身份3/5</text><text x="24" y="866" font-size="19" text-anchor="start" fill="#123750">不在同高位前缀的数只能整体在两端外</text></g></svg>