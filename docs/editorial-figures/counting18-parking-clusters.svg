<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1038" viewBox="0 0 640 1038" role="img"><title>同一球目标与真实占位、两种段长、段末下一格和不重复的后缀</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247b65"/></marker></defs><rect width="640" height="1038" fill="#f7fafc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="35" font-size="23" text-anchor="start" fill="#123750">五个带身份的球，目标2/2/4/5/7</text><text x="24" y="78" font-size="19" text-anchor="start" fill="#123750">每球花费一，预算五；身份按A到E</text><text x="76" y="122" font-size="20" text-anchor="middle" fill="#123750">A</text><rect x="24" y="142" width="104" height="48" rx="6" fill="#cfe3f5" stroke="#91a9be"/><text x="76.0" y="173.0" font-size="20" text-anchor="middle" fill="#123750">2</text><text x="198" y="122" font-size="20" text-anchor="middle" fill="#123750">B</text><rect x="146" y="142" width="104" height="48" rx="6" fill="#cfe3f5" stroke="#91a9be"/><text x="198.0" y="173.0" font-size="20" text-anchor="middle" fill="#123750">2</text><text x="320" y="122" font-size="20" text-anchor="middle" fill="#123750">C</text><rect x="268" y="142" width="104" height="48" rx="6" fill="#cfe3f5" stroke="#91a9be"/><text x="320.0" y="173.0" font-size="20" text-anchor="middle" fill="#123750">4</text><text x="442" y="122" font-size="20" text-anchor="middle" fill="#123750">D</text><rect x="390" y="142" width="104" height="48" rx="6" fill="#cfe3f5" stroke="#91a9be"/><text x="442.0" y="173.0" font-size="20" text-anchor="middle" fill="#123750">5</text><text x="564" y="122" font-size="20" text-anchor="middle" fill="#123750">E</text><rect x="512" y="142" width="104" height="48" rx="6" fill="#cfe3f5" stroke="#91a9be"/><text x="564.0" y="173.0" font-size="20" text-anchor="middle" fill="#123750">7</text><text x="24" y="265" font-size="22" text-anchor="start" fill="#123750">L3：只接A/B/C，再选E</text><path d="M75 337 L525 337" fill="none" stroke="#536c7e" stroke-width="2"/><path d="M75 332 L75 342" fill="none" stroke="#536c7e" stroke-width="2"/><text x="75" y="377" font-size="18" text-anchor="middle" fill="#123750">2</text><path d="M165 332 L165 342" fill="none" stroke="#536c7e" stroke-width="2"/><text x="165" y="377" font-size="18" text-anchor="middle" fill="#123750">3</text><path d="M255 332 L255 342" fill="none" stroke="#536c7e" stroke-width="2"/><text x="255" y="377" font-size="18" text-anchor="middle" fill="#123750">4</text><path d="M345 332 L345 342" fill="none" stroke="#536c7e" stroke-width="2"/><text x="345" y="377" font-size="18" text-anchor="middle" fill="#123750">5</text><path d="M435 332 L435 342" fill="none" stroke="#536c7e" stroke-width="2"/><text x="435" y="377" font-size="18" text-anchor="middle" fill="#123750">6</text><path d="M525 332 L525 342" fill="none" stroke="#536c7e" stroke-width="2"/><text x="525" y="377" font-size="18" text-anchor="middle" fill="#123750">7</text><circle cx="75" cy="337" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="75" y="344" font-size="20" text-anchor="middle" fill="#123750">A</text><circle cx="165" cy="337" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="165" y="344" font-size="20" text-anchor="middle" fill="#123750">B</text><circle cx="255" cy="337" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="255" y="344" font-size="20" text-anchor="middle" fill="#123750">C</text><circle cx="525" cy="337" r="22" fill="#cfe3f5" stroke="#7e9cb6"/><text x="525" y="344" font-size="20" text-anchor="middle" fill="#123750">E</text><rect x="321" y="307" width="48" height="60" rx="6" fill="#fad2c9" stroke="#91a9be"/><text x="345" y="345" font-size="17" text-anchor="middle" fill="#123750">D?</text><text x="24" y="425" font-size="19" text-anchor="start" fill="#123750">D若落五，会与二到四连成同一段</text><text x="24" y="474" font-size="21" text-anchor="start" fill="#123750">9+7=16，成本4</text><text x="24" y="545" font-size="22" text-anchor="start" fill="#123750">L4：A/B/C/D，再选E</text><path d="M75 617 L525 617" fill="none" stroke="#536c7e" stroke-width="2"/><path d="M75 612 L75 622" fill="none" stroke="#536c7e" stroke-width="2"/><text x="75" y="657" font-size="18" text-anchor="middle" fill="#123750">2</text><path d="M165 612 L165 622" fill="none" stroke="#536c7e" stroke-width="2"/><text x="165" y="657" font-size="18" text-anchor="middle" fill="#123750">3</text><path d="M255 612 L255 622" fill="none" stroke="#536c7e" stroke-width="2"/><text x="255" y="657" font-size="18" text-anchor="middle" fill="#123750">4</text><path d="M345 612 L345 622" fill="none" stroke="#536c7e" stroke-width="2"/><text x="345" y="657" font-size="18" text-anchor="middle" fill="#123750">5</text><path d="M435 612 L435 622" fill="none" stroke="#536c7e" stroke-width="2"/><text x="435" y="657" font-size="18" text-anchor="middle" fill="#123750">6</text><path d="M525 612 L525 622" fill="none" stroke="#536c7e" stroke-width="2"/><text x="525" y="657" font-size="18" text-anchor="middle" fill="#123750">7</text><circle cx="75" cy="617" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="75" y="624" font-size="20" text-anchor="middle" fill="#123750">A</text><circle cx="165" cy="617" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="165" y="624" font-size="20" text-anchor="middle" fill="#123750">B</text><circle cx="255" cy="617" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="255" y="624" font-size="20" text-anchor="middle" fill="#123750">C</text><circle cx="345" cy="617" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="345" y="624" font-size="20" text-anchor="middle" fill="#123750">D</text><circle cx="525" cy="617" r="22" fill="#cfe3f5" stroke="#7e9cb6"/><text x="525" y="624" font-size="20" text-anchor="middle" fill="#123750">E</text><text x="24" y="705" font-size="19" text-anchor="start" fill="#123750">六号格确实空；七是下一极大连续段</text><text x="24" y="754" font-size="21" text-anchor="start" fill="#123750">14+7=21，成本5</text><text x="24" y="851" font-size="19" text-anchor="start" fill="#123750">固定L3时，后缀必须从目标严格大于五开始</text><text x="24" y="901" font-size="19" text-anchor="start" fill="#123750">D由L4那类负责，严格跳过不漏最优</text><text x="24" y="951" font-size="19" text-anchor="start" fill="#123750">内层目标≤段末，后缀目标&gt;段末+1</text><text x="24" y="997" font-size="19" text-anchor="start" fill="#123750">两边既不重复球，也不会相互挤占</text></g></svg>