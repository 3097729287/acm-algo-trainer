xt><path d="M346 424 L408 424" fill="none" stroke="#3a8097" stroke-width="7"/><circle cx="346" cy="424" r="7" fill="#fff0b3" stroke="#7e9cb6"/><text x="346" y="431" font-size="21" text-anchor="middle" fill="#123750"></text><circle cx="408" cy="424" r="7" fill="#fff0b3" stroke="#7e9cb6"/><text x="408" y="431" font-size="21" text-anchor="middle" fill="#123750"></text><text x="20" y="496" font-size="17" text-anchor="start" fill="#123750">身份6 后段</text><path d="M408 489 L532 489" fill="none" stroke="#3a8097" stroke-width="7"/><circle cx="408" cy="489" r="7" fill="#dfd6ef" stroke="#7e9cb6"/><text x="408" y="496" font-size="21" text-anchor="middle" fill="#123750"></text><circle cx="532" cy="489" r="7" fill="#dfd6ef" stroke="#7e9cb6"/><text x="532" y="496" font-size="21" text-anchor="middle" fill="#123750"></text><text x="20" y="561" font-size="17" text-anchor="start" fill="#123750">身份7 单点</text><path d="M160 554 L160 554" fill="none" stroke="#3a8097" stroke-width="7"/><circle cx="160" cy="554" r="7" fill="#bfe4ce" stroke="#7e9cb6"/><text x="160" y="561" font-size="21" text-anchor="middle" fill="#123750"></text><circle cx="160" cy="554" r="7" fill="#bfe4ce" stroke="#7e9cb6"/><text x="160" y="561" font-size="21" text-anchor="middle" fill="#123750"></text><text x="20" y="626" font-size="17" text-anchor="start" fill="#123750">身份8 舍弃</text><path d="M284 619 L284 619" fill="none" stroke="#3a8097" stroke-width="7"/><circle cx="284" cy="619" r="7" fill="#fad2c9" stroke="#7e9cb6"/><text x="284" y="626" font-size="21" text-anchor="middle" fill="#123750"></text><circle cx="284" cy="619" r="7" fill="#fad2c9" stroke="#7e9cb6"/><text x="284" y="626" font-size="21" text-anchor="middle" fill="#123750"></text><path d="M272 607 L296 631" fill="none" stroke="#b7463c" stroke-width="3"/><path d="M272 631 L296 607" fill="none" stroke="#b7463c" stroke-width="3"/><text x="20" y="691" font-size="17" text-anchor="start" fill="#123750">身份9 单点</text><path d="M408 684 L408 684" fill="none" stroke="#3a8097" stroke-width="7"/><circle cx="408" cy="684" r="7" fill="#bfe4ce" stroke="#7e9cb6"/><text x="408" y="691" font-size="21" text-anchor="middle" fill="#123750"></text><circle cx="408" cy="684" r="7" fill="#bfe4ce" stroke="#7e9cb6"/><text x="408" y="691" font-size="21" text-anchor="middle" fill="#123750"></text><text x="24" y="812" font-size="19" text-anchor="start" fill="#123750">前块x1/Y5/z3：左1、长2、右2共五条</text><text x="24" y="858" font-size="19" text-anchor="start" fill="#123750">内部单点三：扣一次；端点一、五保留</text><text x="24" y="904" font-size="19" text-anchor="start" fill="#123750">后块从五开始：[5,7]仍能选，dp[5]=1</text><text x="24" y="950" font-size="19" text-anchor="start" fill="#123750">增量1+2+2−1+1=5；单点基准3</text><text x="24" y="1000" font-size="21" text-anchor="start" fill="#123750">实际共选八条，仅舍弃身份8的[3,3]</text></g></svg>