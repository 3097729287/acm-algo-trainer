<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1035" viewBox="0 0 640 1035" role="img"><title>同轴九个真实区间的两扇、重复身份、开放内部损失和端点续接</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247b65"/></marker></defs><rect width="640" height="1035" fill="#f7fafc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="36" font-size="24" text-anchor="start" fill="#123750">九个身份：六条弧、三个单点</text><text x="24" y="77" font-size="19" text-anchor="start" fill="#123750">同轴放置；点在严格内部才与长弧冲突</text><path d="M160 112 L532 112" fill="none" stroke="#536c7e" stroke-width="2"/><path d="M160 106 L160 118" fill="none" stroke="#536c7e" stroke-width="2"/><text x="160" y="99" font-size="18" text-anchor="middle" fill="#123750">1</text><path d="M222 106 L222 118" fill="none" stroke="#536c7e" stroke-width="2"/><text x="222" y="99" font-size="18" text-anchor="middle" fill="#123750">2</text><path d="M284 106 L284 118" fill="none" stroke="#536c7e" stroke-width="2"/><text x="284" y="99" font-size="18" text-anchor="middle" fill="#123750">3</text><path d="M346 106 L346 118" fill="none" stroke="#536c7e" stroke-width="2"/><text x="346" y="99" font-size="18" text-anchor="middle" fill="#123750">4</text><path d="M408 106 L408 118" fill="none" stroke="#536c7e" stroke-width="2"/><text x="408" y="99" font-size="18" text-anchor="middle" fill="#123750">5</text><path d="M470 106 L470 118" fill="none" stroke="#536c7e" stroke-width="2"/><text x="470" y="99" font-size="18" text-anchor="middle" fill="#123750">6</text><path d="M532 106 L532 118" fill="none" stroke="#536c7e" stroke-width="2"/><text x="532" y="99" font-size="18" text-anchor="middle" fill="#123750">7</text><path d="M160 130 L160 754" fill="none" stroke="#bdcbd6" stroke-width="1" stroke-dasharray="4 5"/><path d="M284 130 L284 754" fill="none" stroke="#bdcbd6" stroke-width="1" stroke-dasharray="4 5"/><path d="M408 130 L408 754" fill="none" stroke="#bdcbd6" stroke-width="1"