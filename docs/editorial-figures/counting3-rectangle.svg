<svg xmlns="http://www.w3.org/2000/svg" width="640" height="555" viewBox="0 0 640 555" role="img"><title>Rectangle Filling：同一网格上两条边见证与两个合法下边</title><rect width="640" height="555" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">固定列0到2、上边0：哪些行能作下边</text><text x="24" y="70" class="" text-anchor="start">5行3列；行列均从0编号；白格为 .，黑格为 #</text><text x="234" y="108" class="" text-anchor="middle">列0</text><text x="301" y="108" class="" text-anchor="middle">列1</text><text x="368" y="108" class="" text-anchor="middle">列2</text><text x="115" y="162" class="" text-anchor="middle">行0</text><rect x="203" y="127" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="234" y="161" class="" text-anchor="middle">#</text><rect x="270" y="127" width="62" height="52" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="301" y="161" class="" text-anchor="middle">.</text><rect x="337" y="127" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="368" y="161" class="" text-anchor="middle">#</text><text x="438" y="162" class="small" text-anchor="start">rowHas=1</text><text x="115" y="219" class="" text-anchor="middle">行1</text><rect x="203" y="184" width="62" height="52" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="234" y="218" class="" text-anchor="middle">.</text><rect x="270" y="184" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="301" y="218" class="" text-anchor="middle">#</text><rect x="337" y="184" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="368" y="218" class="" text-anchor="middle">#</text><text x="438" y="219" class="small" text-anchor="start">rowHas=1</text><text x="115" y="276" class="" text-anchor="middle">行2</text><rect x="203" y="241" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="234" y="275" class="" text-anchor="middle">#</text><rect x="270" y="241" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="301" y="275" class="" text-anchor="middle">#</text><rect x="337" y="241" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="368" y="275" class="" text-anchor="middle">#</text><text x="438" y="276" class="small" text-anchor="start">rowHas=0</text><text x="115" y="333" class="" text-anchor="middle">行3</text><rect x="203" y="298" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="234" y="332" class="" text-anchor="middle">#</text><rect x="270" y="298" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="301" y="332" class="" text-anchor="middle">#</text><rect x="337" y="298" width="62" height="52" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="368" y="332" class="" text-anchor="middle">.</text><text x="438" y="333" class="small" text-anchor="start">rowHas=1</text><text x="115" y="390" class="" text-anchor="middle">行4</text><rect x="203" y="355" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="234" y="389" class="" text-anchor="middle">#</text><rect x="270" y="355" width="62" height="52" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="301" y="389" class="" text-anchor="middle">.</text><rect x="337" y="355" width="62" height="52" rx="5" fill="#d8dde3" stroke="#7394aa"/><text x="368" y="389" class="" text-anchor="middle">#</text><text x="438" y="390" class="small" text-anchor="start">rowHas=1</text><rect x="202" y="183" width="64" height="54" rx="3" fill="none" stroke="#d68626"/><rect x="336" y="297" width="64" height="54" rx="3" fill="none" stroke="#168377"/><line x1="177" y1="352" x2="600" y2="352" stroke="#168377" stroke-width="3" stroke-dasharray="5,4"/><line x1="177" y1="409" x2="600" y2="409" stroke="#168377" stroke-width="3" stroke-dasharray="5,4"/><text x="24" y="455" class="" text-anchor="start">左边首白 p=1；右边首白 q=3；m=max(p,q)=3</text><text x="24" y="491" class="" text-anchor="start">下边只能取行3或4，各得一个紧矩形：suf[3]=2</text><text x="24" y="527" class="" text-anchor="start">行3右下角的同一白格，同时见证右边与底边</text></svg>