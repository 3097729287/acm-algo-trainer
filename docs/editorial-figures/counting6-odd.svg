<svg xmlns="http://www.w3.org/2000/svg" width="640" height="575" viewBox="0 0 640 575" role="img"><title>A Bit Odd：诱导子序列的内部边与两种实际删除</title><rect width="640" height="575" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">011001：四条真实逆序边与一次合法删除</text><text x="24" y="70" class="small" text-anchor="start">红色D内1；绿色R内1；虚线跨2；位置1、6孤立</text><line x1="180" y1="136" x2="410" y2="136" stroke="#c54c43" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="248" x2="410" y2="248" stroke="#168377" stroke-width="4" stroke-dasharray=""/><line x1="180" y1="136" x2="410" y2="248" stroke="#8871b5" stroke-width="4" stroke-dasharray="7,5"/><line x1="180" y1="248" x2="410" y2="136" stroke="#8871b5" stroke-width="4" stroke-dasharray="7,5"/><circle cx="62" cy="190" r="25" fill="#b8e6d1" stroke="#7394aa"/><text x="62" y="197" class="" text-anchor="middle">1:0</text><text x="62" y="238" class="small" text-anchor="middle">度0</text><circle cx="180" cy="136" r="25" fill="#fce0dc" stroke="#7394aa"/><text x="180" y="143" class="" text-anchor="middle">2:1</text><circle cx="180" cy="248" r="25" fill="#b8e6d1" stroke="#7394aa"/><text x="180" y="255" class="" text-anchor="middle">3:1</text><circle cx="410" cy="136" r="25" fill="#fce0dc" stroke="#7394aa"/><text x="410" y="143" class="" text-anchor="middle">4:0</text><circle cx="410" cy="248" r="25" fill="#b8e6d1" stroke="#7394aa"/><text x="410" y="255" class="" text-anchor="middle">5:0</text><circle cx="558" cy="190" r="25" fill="#b8e6d1" stroke="#7394aa"/><text x="558" y="197" class="" text-anchor="middle">6:1</text><text x="558" y="238" class="small" text-anchor="middle">度0</text><text x="24" y="319" class="" text-anchor="start">总4 = D内1 + R内1 + 跨2；留下0101有一条边</text><line x1="24" y1="344" x2="612" y2="344" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="24" y="380" class="" text-anchor="start">110：保留位置一，删除位置二、三的子序列10</text><path d="M180 435 Q300 355 420 435" fill="none" stroke="#8871b5" stroke-width="3" stroke-dasharray="7,5"/><line x1="300" y1="435" x2="420" y2="435" stroke="#c54c43" stroke-width="4" stroke-dasharray=""/><circle cx="180" cy="435" r="25" fill="#b8e6d1" stroke="#7394aa"/><text x="180" y="442" class="" text-anchor="middle">1:1</text><circle cx="300" cy="435" r="25" fill="#fce0dc" stroke="#7394aa"/><text x="300" y="442" class="" text-anchor="middle">2:1</text><circle cx="420" cy="435" r="25" fill="#fce0dc" stroke="#7394aa"/><text x="420" y="442" class="" text-anchor="middle">3:0</text><text x="24" y="505" class="" text-anchor="start">总边2 − 保留点度数1 = 被删内部边1（奇数）</text><text x="24" y="545" class="" text-anchor="start">留下单字符，无合法子序列，对手失败</text></svg>