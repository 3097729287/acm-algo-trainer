<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1005" viewBox="0 0 640 1005" role="img"><title>三次真实加或操作与五轮按位DP、未操作位的自然进位和最小增量</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247b65"/></marker></defs><rect width="640" height="1005" fill="#f7fafc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="35" font-size="22" text-anchor="start" fill="#123750">真实操作三次；按位表还要传播自然进位</text><text x="24" y="79" font-size="19" text-anchor="start" fill="#123750">x11/y5，依次处理权值一、二、八</text><rect x="26" y="124" width="126" height="48" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="89.0" y="155.0" font-size="20" text-anchor="middle" fill="#123750">(11,5)</text><path d="M154 148 L174 148" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><text x="164" y="205" font-size="18" text-anchor="middle" fill="#123750">+1</text><rect x="179" y="124" width="126" height="48" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="242.0" y="155.0" font-size="20" text-anchor="middle" fill="#123750">(10,6)</text><path d="M307 148 L327 148" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><text x="317" y="205" font-size="18" text-anchor="middle" fill="#123750">+2</text><rect x="332" y="124" width="126" height="48" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="395.0" y="155.0" font-size="20" text-anchor="middle" fill="#123750">(8,8)</text><path d="M460 148 L480 148" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="205" font-size="18" text-anchor="middle" fill="#123750">或8</text><rect x="485" y="124" width="126" height="48" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="548.0" y="155.0" font-size="20" text-anchor="middle" fill="#123750">(0,8)</text><text x="24" y="258" font-size="19" text-anchor="start" fill="#123750">下表dp存增量v，不是当前完整y</text><text x="42" y="307" font-size="19" text-anchor="start" fill="#123750">位b</text><text x="126" y="307" font-size="19" text-anchor="start" fill="#123750">(xb,yb)</text><text x="250" y="307" font-size="18" text-anchor="start" fill="#123750">旧表(进位0/1)</text><text x="438" y="307" font-size="18" text-anchor="start" fill="#123750">新表(进位0/1)</text><rect x="22" y="330" width="596" height="57" rx="6" fill="#e8edf1" stroke="#91a9be"/><text x="52" y="367" font-size="20" text-anchor="start" fill="#123750">0</text><text x="126" y="367" font-size="20" text-anchor="start" fill="#123750">(1,1)</text><text x="285" y="367" font-size="20" text-anchor="start" fill="#123750">(0,∞)</text><text x="466" y="367" font-size="20" text-anchor="start" fill="#123750">(0,1)</text><rect x="22" y="404" width="596" height="57" rx="6" fill="#e8edf1" stroke="#91a9be"/><text x="52" y="441" font-size="20" text-anchor="start" fill="#123750">1</text><text x="126" y="441" font-size="20" text-anchor="start" fill="#123750">(1,0)</text><text x="285" y="441" font-size="20" text-anchor="start" fill="#123750">(0,1)</text><text x="466" y="441" font-size="20" text-anchor="start" fill="#123750">(1,3)</text><rect x="22" y="478" width="596" height="57" rx="6" fill="#fff0b3" stroke="#91a9be"/><text x="52" y="515" font-size="20" text-anchor="start" fill="#123750">2</text><text x="126" y="515" font-size="20" text-anchor="start" fill="#123750">(0,1)</text><text x="285" y="515" font-size="20" text-anchor="start" fill="#123750">(1,3)</text><text x="466" y="515" font-size="20" text-anchor="start" fill="#123750">(1,3)</text><rect x="22" y="552" width="596" height="57" rx="6" fill="#e8edf1" stroke="#91a9be"/><text x="52" y="589" font-size="20" text-anchor="start" fill="#123750">3</text><text x="126" y="589" font-size="20" text-anchor="start" fill="#123750">(1,0)</text><text x="285" y="589" font-size="20" text-anchor="start" fill="#123750">(1,3)</text><text x="466" y="589" font-size="20" text-anchor="start" fill="#123750">(3,11)</text><rect x="22" y="626" width="596" height="57" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="52" y="663" font-size="20" text-anchor="start" fill="#123750">4</text><text x="126" y="663" font-size="20" text-anchor="start" fill="#123750">(0,0)</text><text x="285" y="663" font-size="20" text-anchor="start" fill="#123750">(3,11)</text><text x="466" y="663" font-size="20" text-anchor="start" fill="#123750">(3,∞)</text><text x="24" y="760" font-size="19" text-anchor="start" fill="#123750">位二没有操作：1+1=2仍自然传出进位</text><text x="24" y="811" font-size="19" text-anchor="start" fill="#123750">位三：增量9与3都进到零，只保留3</text><text x="24" y="862" font-size="19" text-anchor="start" fill="#123750">再传播一位，得到最小v3；最终5+3=8</text><text x="24" y="913" font-size="19" text-anchor="start" fill="#123750">yb读原始五；c来自此前选定的低位增量</text><text x="24" y="964" font-size="19" text-anchor="start" fill="#123750">同一进位未来选择相同，较大增量被支配</text></g></svg>