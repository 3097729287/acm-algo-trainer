<svg xmlns="http://www.w3.org/2000/svg" width="870" height="584" viewBox="0 0 870 584" role="img"><title>固定一阻挡、最远端点与最终完整填法</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="23" fill="#20334a" text-anchor="start">a=[-1,0,-1,1,0,-1]：固定一能当端点，不能留在内部</text><text x="216" y="87" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="185" y="109" width="62" height="49" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="216" y="143" font-size="26" fill="#20334a" text-anchor="middle">-1</text><text x="304" y="87" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="273" y="109" width="62" height="49" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="304" y="143" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="392" y="87" font-size="20" fill="#20334a" text-anchor="middle">3</text><rect x="361" y="109" width="62" height="49" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="392" y="143" font-size="26" fill="#20334a" text-anchor="middle">-1</text><text x="480" y="87" font-size="20" fill="#20334a" text-anchor="middle">4</text><rect x="449" y="109" width="62" height="49" rx="4" fill="#fff0d8" stroke="#b26d1b" stroke-width="2"/><text x="480" y="143" font-size="26" fill="#20334a" text-anchor="middle">1</text><text x="568" y="87" font-size="20" fill="#20334a" text-anchor="middle">5</text><rect x="537" y="109" width="62" height="49" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="568" y="143" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="656" y="87" font-size="20" fill="#20334a" text-anchor="middle">6</text><rect x="625" y="109" width="62" height="49" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="656" y="143" font-size="26" fill="#20334a" text-anchor="middle">-1</text><path d="M216,176 L480,176" stroke="#328350" stroke-width="3" fill="none"/><path d="M216,165 L216,187" stroke="#328350" stroke-width="3" fill="none"/><path d="M480,165 L480,187" stroke="#328350" stroke-width="3" fill="none"/><text x="25" y="215" font-size="21" fill="#256a40" text-anchor="start">可选 [1,4]：中间未知填零，得到 1 0 0 1，长四</text><path d="M216,244 L656,244" stroke="#bf4038" stroke-width="3" fill="none"/><path d="M480,231 L480,256" stroke="#bf4038" stroke-width="5" fill="none"/><text x="25" y="286" font-size="21" fill="#a13e35" text-anchor="start">不能选 [1,6]：第四位固定一会落进内部，无法改成零</text><text x="25" y="338" font-size="23" fill="#20334a" text-anchor="start">左端：    1       3       4       6</text><text x="25" y="379" font-size="23" fill="#20334a" text-anchor="start">右端：    4       4       6       6</text><text x="25" y="420" font-size="22" fill="#20334a" text-anchor="start">长度：    4       2       3       1       best 只在第一项更新</text><text x="25" y="478" font-size="22" fill="#20334a" text-anchor="start">完整输出</text><rect x="185" y="450" width="62" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="216" y="482" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="273" y="450" width="62" height="47" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="304" y="482" font-size="25" fill="#20334a" text-anchor="middle">0</text><rect x="361" y="450" width="62" height="47" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="392" y="482" font-size="25" fill="#20334a" text-anchor="middle">0</text><rect x="449" y="450" width="62" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="480" y="482" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="537" y="450" width="62" height="47" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="568" y="482" font-size="25" fill="#20334a" text-anchor="middle">0</text><rect x="625" y="450" width="62" height="47" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="656" y="482" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="25" y="548" font-size="21" fill="#20334a" text-anchor="start">保留固定值；选中端点填一，其余未知位填零；单个一也合法</text></g></svg>