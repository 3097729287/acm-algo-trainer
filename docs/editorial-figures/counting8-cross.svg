<svg xmlns="http://www.w3.org/2000/svg" width="640" height="649" viewBox="0 0 640 649" role="img"><title>Easy Demon：真实删行列的交点容斥及符号交换命中</title><rect width="640" height="649" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">a=[−2,3,−3]，b=[−2,2,−1]</text><text x="24" y="72" class="small" text-anchor="start">删第二行与第一列；交点−6只清零一次</text><text x="228" y="115" class="small" text-anchor="middle">b=-2</text><text x="342" y="115" class="small" text-anchor="middle">b=2</text><text x="456" y="115" class="small" text-anchor="middle">b=-1</text><text x="28" y="175" class="small" text-anchor="start">a=-2</text><rect x="178" y="135" width="100" height="67" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="228" y="178" class="" text-anchor="middle">4</text><line x1="187" y1="144" x2="269" y2="193" stroke="#c54c43" stroke-width="2" stroke-dasharray=""/><rect x="292" y="135" width="100" height="67" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="342" y="178" class="" text-anchor="middle">-4</text><rect x="406" y="135" width="100" height="67" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="456" y="178" class="" text-anchor="middle">2</text><text x="28" y="264" class="small" text-anchor="start">a=3</text><rect x="178" y="224" width="100" height="67" rx="5" fill="#e3d5f2" stroke="#7394aa"/><text x="228" y="267" class="" text-anchor="middle">-6</text><line x1="187" y1="233" x2="269" y2="282" stroke="#c54c43" stroke-width="2" stroke-dasharray=""/><rect x="292" y="224" width="100" height="67" rx="5" fill="#fce0dc" stroke="#7394aa"/><text x="342" y="267" class="" text-anchor="middle">6</text><line x1="301" y1="233" x2="383" y2="282" stroke="#c54c43" stroke-width="2" stroke-dasharray=""/><rect x="406" y="224" width="100" height="67" rx="5" fill="#fce0dc" stroke="#7394aa"/><text x="456" y="267" class="" text-anchor="middle">-3</text><line x1="415" y1="233" x2="497" y2="282" stroke="#c54c43" stroke-width="2" stroke-dasharray=""/><text x="28" y="353" class="small" text-anchor="start">a=-3</text><rect x="178" y="313" width="100" height="67" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="228" y="356" class="" text-anchor="middle">6</text><line x1="187" y1="322" x2="269" y2="371" stroke="#c54c43" stroke-width="2" stroke-dasharray=""/><rect x="292" y="313" width="100" height="67" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="342" y="356" class="" text-anchor="middle">-6</text><rect x="406" y="313" width="100" height="67" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="456" y="356" class="" text-anchor="middle">3</text><text x="24" y="452" class="" text-anchor="start">剩下：−4 + 2 − 6 + 3 = −5</text><text x="24" y="493" class="" text-anchor="start">容斥：2 − (−3) − 4 + (−6) = −5</text><text x="24" y="534" class="" text-anchor="start">删后系数：(−2−3)×(−1−(−2)) = (−5)×1</text><text x="24" y="579" class="small" text-anchor="start">左候选{0,−5,1}；右候选{1,−3,0}</text><text x="24" y="619" class="small" text-anchor="start">x=−5：仅第四支(−e,−sg·d)=(−5,1)命中</text></svg>