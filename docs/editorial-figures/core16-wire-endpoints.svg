<svg xmlns="http://www.w3.org/2000/svg" width="660" height="547" viewBox="0 0 660 547" role="img"><title>六台真实电脑一二三原线连通，三条不同应急边一四二五三六同时使全局连通每台只接一条，另列五台端点不足实例</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="33" font-size="22" fill="#20334a" text-anchor="start">六台、四块：三条新线，最大新负载1</text><line x1="104" y1="107" x2="104" y2="202" stroke="#64748b" stroke-width="4"/><line x1="104" y1="202" x2="104" y2="297" stroke="#64748b" stroke-width="4"/><line x1="104" y1="107" x2="468" y2="107" stroke="#16a34a" stroke-width="4"/><line x1="104" y1="202" x2="468" y2="202" stroke="#16a34a" stroke-width="4"/><line x1="104" y1="297" x2="468" y2="297" stroke="#16a34a" stroke-width="4"/><rect x="81" y="87" width="46" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="104" y="115" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="81" y="182" width="46" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="104" y="210" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="81" y="277" width="46" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="104" y="305" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="445" y="87" width="46" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="468" y="115" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="445" y="182" width="46" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="468" y="210" font-size="24" fill="#20334a" text-anchor="middle">5</text><rect x="445" y="277" width="46" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="468" y="305" font-size="24" fill="#20334a" text-anchor="middle">6</text><text x="188" y="154" font-size="20" fill="#20334a" text-anchor="start">灰为原线；绿为新线</text><text x="188" y="250" font-size="19" fill="#20334a" text-anchor="start">原大块三个接口分给三台</text><text x="24" y="364" font-size="20" fill="#20334a" text-anchor="start">原块{1,2,3}、{4}、{5}、{6}；六端点各用一次。</text><text x="24" y="417" font-size="20" fill="#20334a" text-anchor="start">五台若原线仅1−2，仍四块、需三线六端点。</text><text x="24" y="463" font-size="21" fill="#20334a" text-anchor="start">六端点放不进五台，最多1不可能；</text><text x="24" y="508" font-size="20" fill="#20334a" text-anchor="start">实际新加2−3、3−4、4−5，最大为2可达到。</text></g></svg>