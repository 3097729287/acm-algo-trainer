" height="52" rx="5" fill="#f8fafc" stroke="#a6b2c3" stroke-width="2"/><text x="301" y="314" font-size="23" fill="#20334a" text-anchor="middle">15</text><rect x="344" y="280" width="70" height="52" rx="5" fill="#f8fafc" stroke="#a6b2c3" stroke-width="2"/><text x="379" y="314" font-size="23" fill="#20334a" text-anchor="middle">16</text><text x="450" y="314" font-size="21" fill="#16804c" text-anchor="start">行最小 = 4</text><text x="106" y="380" font-size="22" fill="#b65e1a" text-anchor="start">列最小： 1      2      5      6</text><text x="28" y="426" font-size="24" fill="#20334a" text-anchor="start">R = {1, 2, 3, 4}     C = {1, 2, 5, 6}</text><text x="28" y="466" font-size="23" fill="#20334a" text-anchor="start">共同：{1, 2}      并集：{1, 2, 3, 4, 5, 6}</text><text x="28" y="505" font-size="21" fill="#20334a" text-anchor="start">普通格填 7…16，均大于六个预定最小值</text></g></svg>