<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" viewBox="0 0 640 710" role="img"><title>真实方块右移与后缀最小值下降四</title><rect width="640" height="710" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16867b"/></marker></defs><text x="24" y="32" class="title" text-anchor="start">减掉1块，却新增3块开始移动</text><text x="24" y="66" class="small" text-anchor="start">方块数字=原列；绿=会移动；红叉=准备删除的块</text><text x="45" y="128" class="" text-anchor="start">原来：1,3,3,2,2</text><text x="345" y="128" class="" text-anchor="start">删后向右压紧</text><rect x="45" y="284" width="38" height="38" rx="5" fill="#d9edf8" stroke="#bfd1dc"/><text x="64" y="311" class="" text-anchor="middle">1</text><rect x="45" y="242" width="38" height="38" rx="5" fill="#f8fafc" stroke="#bfd1dc"/><rect x="45" y="200" width="38" height="38" rx="5" fill="#f8fafc" stroke="#bfd1dc"/><text x="64" y="352" class="small" text-anchor="middle">1</text><rect x="87" y="284" width="38" height="38" rx="5" fill="#d9edf8" stroke="#bfd1dc"/><text x="106" y="311" class="" text-anchor="middle">2</text><rect x="87" y="242" width="38" height="38" rx="5" fill="#d9edf8" stroke="#bfd1dc"/><text x="106" y="269" class="" text-anchor="middle">2</text><rect x="87" y="200" width="38" height="38" rx="5" fill="#b8e2d3" stroke="#bfd1dc"/><text x="106" y="227" class="" text-anchor="middle">2</text><text x="106" y="352" class="small" text-anchor="middle">2</text><rect x="129" y="284" width="38" height="38" rx="5" fill="#d9edf8" stroke="#bfd1dc"/><text x="148" y="311" class="" text-anchor="middle">3</text><rect x="129" y="242" width="38" height="38" rx="5" fill="#d9edf8" stroke="#bfd1dc"/><text x="148" y="269" class="" text-anchor="middle">3</text><rect x="129" y="200" width="3