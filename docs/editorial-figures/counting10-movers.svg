ddle">2</text><rect x="429" y="284" width="38" height="38" rx="5" fill="#d9edf8" stroke="#bfd1dc"/><text x="448" y="311" class="" text-anchor="middle">3</text><rect x="429" y="242" width="38" height="38" rx="5" fill="#b8e2d3" stroke="#bfd1dc"/><text x="448" y="269" class="" text-anchor="middle">2</text><rect x="429" y="200" width="38" height="38" rx="5" fill="#f8fafc" stroke="#bfd1dc"/><text x="448" y="352" class="small" text-anchor="middle">3</text><rect x="471" y="284" width="38" height="38" rx="5" fill="#d9edf8" stroke="#bfd1dc"/><text x="490" y="311" class="" text-anchor="middle">4</text><rect x="471" y="242" width="38" height="38" rx="5" fill="#b8e2d3" stroke="#bfd1dc"/><text x="490" y="269" class="" text-anchor="middle">3</text><rect x="471" y="200" width="38" height="38" rx="5" fill="#b8e2d3" stroke="#bfd1dc"/><text x="490" y="227" class="" text-anchor="middle">2</text><text x="490" y="352" class="small" text-anchor="middle">4</text><rect x="513" y="284" width="38" height="38" rx="5" fill="#d9edf8" stroke="#bfd1dc"/><text x="532" y="311" class="" text-anchor="middle">5</text><rect x="513" y="242" width="38" height="38" rx="5" fill="#b8e2d3" stroke="#bfd1dc"/><text x="532" y="269" class="" text-anchor="middle">4</text><rect x="513" y="200" width="38" height="38" rx="5" fill="#b8e2d3" stroke="#bfd1dc"/><text x="532" y="227" class="" text-anchor="middle">3</text><text x="532" y="352" class="small" text-anchor="middle">5</text><text x="24" y="389" class="small" text-anchor="start">原第三层：2→4、3→5，原移动数2</text><text x="24" y="438" class="small" text-anchor="start">删后第二层：2→3、3→4、4→5，新动3块</text><text x="24" y="478" class="small" text-anchor="start">第三层仍有2块移动；被删的方块已不在结果中</text><text x="24" y="533" class="small" text-anchor="start">后缀最小值：1,2,2,2,2 → 1,1,1,1,1</text><text x="24" y="575" class="small" text-anchor="start">不动数9→5降4；总块数11→10少1</text><text x="24" y="621" class="" text-anchor="start">实际移动2→5，净增4−1=3</text><text x="24" y="671" class="small" text-anchor="start">代码i=4、prevLess=0；等高柱不能阻断影响</text></svg>