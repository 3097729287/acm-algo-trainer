#20334a" text-anchor="middle">F</text><rect x="528" y="277" width="58" height="47" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="557" y="309" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="557" y="257" font-size="21" fill="#20334a" text-anchor="middle">F</text><rect x="607" y="277" width="58" height="47" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="636" y="309" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="636" y="257" font-size="21" fill="#20334a" text-anchor="middle">末F</text><text x="22" y="365" font-size="20" fill="#20334a" text-anchor="start">酒量由左往右；S翻倍，F减1</text><text x="22" y="470" font-size="20" fill="#20334a" text-anchor="start">前五步SFFFS、FSSFF：都在(i,j,k)=(2,3,2)，计数2。</text><text x="22" y="521" font-size="21" fill="#20334a" text-anchor="start">再F到(2,4,1)，仍2份；补末F得到2条完整答案。</text><text x="22" y="573" font-size="20" fill="#20334a" text-anchor="start">另例N1,M2的FFS：2→1→0→0，最后是店，不收。</text><text x="22" y="625" font-size="20" fill="#20334a" text-anchor="start">M−j是全部剩余花，含末花；此前仅能用M−1−j朵。</text></g></svg>