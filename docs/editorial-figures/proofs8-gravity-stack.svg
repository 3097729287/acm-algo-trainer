<svg xmlns="http://www.w3.org/2000/svg" width="720" height="755" viewBox="0 0 720 755" role="img"><title>四条真实数组左对齐堆叠，短A负责前两列、C负责三四列、D右三格穿过下方空位落底，实际底行二四五一三二一与三次后缀比较同步</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">真实堆叠（从上到下B、D、C、A），列内只向下落</text><text x="28" y="112" font-size="24" fill="#20334a" text-anchor="start">B</text><rect x="150" y="79" width="64" height="47" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="182" y="112" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="226" y="79" width="64" height="47" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="258" y="112" font-size="23" fill="#20334a" text-anchor="middle">4</text><rect x="302" y="79" width="64" height="47" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="334" y="112" font-size="23" fill="#20334a" text-anchor="middle">6</text><rect x="378" y="79" width="64" height="47" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="410" y="112" font-size="23" fill="#20334a" text-anchor="middle">9</text><rect x="454" y="79" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="530" y="79" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="606" y="79" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="28" y="176" font-size="24" fill="#20334a" text-anchor="start">D</text><rect x="150" y="143" width="64" height="47" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="182" y="176" font-size="23" fill="#20334a" text-anchor="middle">7</text><rect x="226" y="143" width="64" height="47" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="258" y="176" font-size="23" fill="#20334a" text-anchor="middle">6</text><rect x="302" y="143" width="64" height="47" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="334" y="176" font-size="23" fill="#20334a" text-anchor="middle">5</text><rect x="378" y="143" width="64" height="47" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="410" y="176" font-size="23" fill="#20334a" text-anchor="middle">4</text><rect x="454" y="143" width="64" height="47" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="486" y="176" font-size="23" fill="#20334a" text-anchor="middle">3</text><rect x="530" y="143" width="64" height="47" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="562" y="176" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="606" y="143" width="64" height="47" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="638" y="176" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="28" y="240" font-size="24" fill="#20334a" text-anchor="start">C</text><rect x="150" y="207" width="64" height="47" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="182" y="240" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="226" y="207" width="64" height="47" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="258" y="240" font-size="23" fill="#20334a" text-anchor="middle">4</text><rect x="302" y="207" width="64" height="47" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="334" y="240" font-size="23" fill="#20334a" text-anchor="middle">5</text><rect x="378" y="207" width="64" height="47" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="410" y="240" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="454" y="207" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="530" y="207" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="606" y="207" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="28" y="304" font-size="24" fill="#20334a" text-anchor="start">A</text><rect x="150" y="271" width="64" height="47" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="182" y="304" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="226" y="271" width="64" height="47" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="258" y="304" font-size="23" fill="#20334a" text-anchor="middle">4</text><rect x="302" y="271" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="378" y="271" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="454" y="271" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="530" y="271" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="606" y="271" width="64" height="47" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><path d="M334,259 L334,422" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="334,422 329.0,412.0 339.0,412.0" fill="#2d6db4"/><path d="M410,259 L410,422" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="410,422 405.0,412.0 415.0,412.0" fill="#2d6db4"/><path d="M486,195 L486,422" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="486,422 481.0,412.0 491.0,412.0" fill="#2d6db4"/><path d="M562,195 L562,422" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="562,422 557.0,412.0 567.0,412.0" fill="#2d6db4"/><path d="M638,195 L638,422" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="638,422 633.0,412.0 643.0,412.0" fill="#2d6db4"/><text x="22" y="460" font-size="22" fill="#20334a" text-anchor="start">实际底行</text><rect x="150" y="431" width="64" height="49" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="182" y="465" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="226" y="431" width="64" height="49" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="258" y="465" font-size="23" fill="#20334a" text-anchor="middle">4</text><rect x="302" y="431" width="64" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="334" y="465" font-size="23" fill="#20334a" text-anchor="middle">5</text><rect x="378" y="431" width="64" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="410" y="465" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="454" y="431" width="64" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="486" y="465" font-size="23" fill="#20334a" text-anchor="middle">3</text><rect x="530" y="431" width="64" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="562" y="465" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="606" y="431" width="64" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="638" y="465" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="22" y="532" font-size="22" fill="#20334a" text-anchor="start">p=0：A=[2,4]是C的前缀；先取A，仍能接C</text><text x="22" y="581" font-size="21" fill="#20334a" text-anchor="start">p=2：C后缀[5,1]，D后缀[5,4,3,2,1]，第4列1&lt;4</text><text x="22" y="630" font-size="22" fill="#20334a" text-anchor="start">p=4：只有D继续，补[3,2,1]；长度链为2→4→7</text><text x="22" y="679" font-size="21" fill="#20334a" text-anchor="start">B始终在更低的C上方，因此不会贡献底行；同一堆叠实现三段</text><text x="22" y="728" font-size="21" fill="#20334a" text-anchor="start">比较从同一列p开始；每轮收费列位于本轮真正输出的范围内</text></g></svg>