<svg xmlns="http://www.w3.org/2000/svg" width="870" height="530" viewBox="0 0 870 530" role="img"><title>有效剑实际消耗与严格前缀上界的返回位置</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="24" fill="#20334a" text-anchor="start">官方第一例：a=[1,3,4]，b=[2,1,1]，难度三</text><rect x="170" y="86" width="95" height="48" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="217" y="119" font-size="27" fill="#20334a" text-anchor="middle">1</text><text x="217" y="165" font-size="21" fill="#20334a" text-anchor="middle">不能用</text><rect x="340" y="86" width="95" height="48" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="387" y="119" font-size="27" fill="#20334a" text-anchor="middle">3</text><text x="387" y="165" font-size="21" fill="#20334a" text-anchor="middle">有效一击</text><rect x="510" y="86" width="95" height="48" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="557" y="119" font-size="27" fill="#20334a" text-anchor="middle">4</text><text x="557" y="165" font-size="21" fill="#20334a" text-anchor="middle">有效一击</text><text x="25" y="226" font-size="21" fill="#20334a" text-anchor="start">第一关需两击</text><rect x="270" y="193" width="60" height="44" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="300" y="224" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="350" y="193" width="60" height="44" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="380" y="224" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="460" y="224" font-size="22" fill="#20334a" text-anchor="start">两剑用完，第二关未完成</text><text x="262" y="298" font-size="19" fill="#20334a" text-anchor="middle">下标0</text><rect x="225" y="321" width="75" height="46" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="262" y="353" font-size="27" fill="#20334a" text-anchor="middle">0</text><text x="382" y="298" font-size="19" fill="#20334a" text-anchor="middle">下标1</text><rect x="345" y="321" width="75" height="46" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="382" y="353" font-size="27" fill="#20334a" text-anchor="middle">2</text><text x="502" y="298" font-size="19" fill="#20334a" text-anchor="middle">下标2</text><rect x="465" y="321" width="75" height="46" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="502" y="353" font-size="27" fill="#20334a" text-anchor="middle">3</text><text x="622" y="298" font-size="19" fill="#20334a" text-anchor="middle">下标3</text><rect x="585" y="321" width="75" height="46" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="622" y="353" font-size="27" fill="#20334a" text-anchor="middle">4</text><text x="25" y="352" font-size="21" fill="#20334a" text-anchor="start">攻击前缀</text><path d="M502,409 L502,376" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="355" y="441" font-size="21" fill="#20334a" text-anchor="start">upper_bound(2) → 下标2，再减一 → 通关1</text><text x="25" y="493" font-size="22" fill="#20334a" text-anchor="start">难度四/三/一：通关 0/1/2，得分 0/3/2；答案最终为3</text></g></svg>