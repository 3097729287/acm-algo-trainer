<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 720 810" role="img"><title>四个真实机关允许材质001011010110，列顺序石木纸，选011分别交001011010010，按机关2一四三的实际纸组木组顺序只初选一次切一次代价二</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">四个真实机关；选纸木即可实际花费2</text><text x="22" y="78" font-size="20" fill="#20334a" text-anchor="start">列从高位到低位：bit2石 / bit1木 / bit0纸</text><text x="22" y="123" font-size="21" fill="#20334a" text-anchor="start">chosen=011：已选纸、木（数值3，大小2）</text><rect x="20" y="155" width="680" height="54" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="35" y="190" font-size="20" fill="#20334a" text-anchor="start">机关1：纸</text><text x="320" y="190" font-size="21" fill="#20334a" text-anchor="start">001 &amp; 011 = 001</text><rect x="20" y="220" width="680" height="54" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="35" y="255" font-size="20" fill="#20334a" text-anchor="start">机关2：纸木</text><text x="320" y="255" font-size="21" fill="#20334a" text-anchor="start">011 &amp; 011 = 011</text><rect x="20" y="285" width="680" height="54" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="35" y="320" font-size="20" fill="#20334a" text-anchor="start">机关3：木</text><text x="320" y="320" font-size="21" fill="#20334a" text-anchor="start">010 &amp; 011 = 010</text><rect x="20" y="350" width="680" height="54" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="35" y="385" font-size="20" fill="#20334a" text-anchor="start">机关4：木石</text><text x="320" y="385" font-size="21" fill="#20334a" text-anchor="start">110 &amp; 011 = 010</text><text x="22" y="461" font-size="21" fill="#20334a" text-anchor="start">每行交集非零，各分给其中一种材质：</text><text x="22" y="510" font-size="23" fill="#087b48" text-anchor="start">纸组：机关2 → 机关1</text><text x="22" y="559" font-size="23" fill="#1d4ed8" text-anchor="start">木组：机关4 → 机关3</text><text x="22" y="611" font-size="21" fill="#20334a" text-anchor="start">初选纸花1；组间切木花1；组内不切换。</text><text x="22" y="664" font-size="21" fill="#20334a" text-anchor="start">单纸卡机关3；单木、单石都卡机关1。</text><text x="22" y="715" font-size="20" fill="#20334a" text-anchor="start">最少2种且确实花2；无需同一机关同时用两材质。</text><text x="22" y="766" font-size="20" fill="#20334a" text-anchor="start">交集为011也合法：机关2只需任选纸或木。</text></g></svg>