<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1110" viewBox="0 0 640 1110" role="img"><title>三个实际商品、费用倒推、已付款和未付款分界以及恒费全部门槛</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247b65"/></marker></defs><rect width="640" height="1110" fill="#f7fafc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="36" font-size="24" text-anchor="start" fill="#123750">商品2/5/9；先付款，再决定继续</text><text x="24" y="80" font-size="19" text-anchor="start" fill="#123750">费用1起，每次加2；从必停费用9倒推</text><rect x="24" y="118" width="105" height="112" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="76" y="151" font-size="21" text-anchor="middle" fill="#123750">费9</text><text x="76" y="196" font-size="18" text-anchor="middle" fill="#123750">f=−11/3</text><path d="M129 175 L144 175" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="146" y="118" width="105" height="112" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="198" y="151" font-size="21" text-anchor="middle" fill="#123750">费7</text><text x="198" y="196" font-size="18" text-anchor="middle" fill="#123750">f=−5/3</text><path d="M251 175 L266 175" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="268" y="118" width="105" height="112" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="320" y="151" font-size="21" text-anchor="middle" fill="#123750">费5</text><text x="320" y="196" font-size="18" text-anchor="middle" fill="#123750">f=1/3</text><path d="M373 175 L388 175" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="118" width="105" height="112" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="442" y="151" font-size="21" text-anchor="middle" fill="#123750">费3</text><text x="442" y="196" font-size="18" text-anchor="middle" fill="#123750">f=7/3</text><path d="M495 175 L510 175" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="512" y="118" width="105" height="112" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="564" y="151" font-size="21" text-anchor="middle" fill="#123750">费1</text><text x="564" y="196" font-size="18" text-anchor="middle" fill="#123750">f=40/9</text><text x="24" y="280" font-size="19" text-anchor="start" fill="#123750">到费用1这一层：下一轮尚未付款值7/3</text><text x="24" y="325" font-size="19" text-anchor="start" fill="#123750">先付一，再看三个等可能商品：</text><circle cx="125" cy="385" r="29" fill="#fff0b3" stroke="#7e9cb6"/><text x="125" y="392" font-size="21" text-anchor="middle" fill="#123750">2</text><text x="125" y="445" font-size="21" text-anchor="middle" fill="#123750">继续</text><text x="125" y="489" font-size="19" text-anchor="middle" fill="#123750">7/3 &gt; 2</text><text x="125" y="539" font-size="18" text-anchor="middle" fill="#123750">−1+7/3=4/3</text><circle cx="320" cy="385" r="29" fill="#fff0b3" stroke="#7e9cb6"/><text x="320" y="392" font-size="21" text-anchor="middle" fill="#123750">5</text><text x="320" y="445" font-size="21" text-anchor="middle" fill="#123750">接受</text><text x="320" y="489" font-size="19" text-anchor="middle" fill="#123750">5 &gt; 7/3</text><text x="320" y="539" font-size="18" text-anchor="middle" fill="#123750">−1+5=4</text><circle cx="515" cy="385" r="29" fill="#fff0b3" stroke="#7e9cb6"/><text x="515" y="392" font-size="21" text-anchor="middle" fill="#123750">9</text><text x="515" y="445" font-size="21" text-anchor="middle" fill="#123750">接受</text><text x="515" y="489" font-size="19" text-anchor="middle" fill="#123750">9 &gt; 7/3</text><text x="515" y="539" font-size="18" text-anchor="middle" fill="#123750">−1+9=8</text><text x="24" y="592" font-size="21" text-anchor="start" fill="#123750">平均净期望：(4/3+4+8)/3 = 40/9</text><text x="24" y="636" font-size="19" text-anchor="start" fill="#123750">7/3含未来费用三；外面只扣当前费用一</text><path d="M20 678 L620 678" fill="none" stroke="#536c7e" stroke-width="2"/><text x="24" y="723" font-size="19" text-anchor="start" fill="#123750">费用始终一：只接受九，每轮成功率1/3</text><text x="24" y="767" font-size="19" text-anchor="start" fill="#123750">平均付三轮，净期望9−3=6</text><text x="24" y="813" font-size="19" text-anchor="start" fill="#123750">所有三种接受门槛逐项比较：</text><rect x="22" y="842" width="596" height="47" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="40" y="873" font-size="19" text-anchor="start" fill="#123750">只收9</text><text x="225" y="873" font-size="21" text-anchor="start" fill="#123750">(9−3)/1 = 6</text><rect x="22" y="902" width="596" height="47" rx="7" fill="#e8edf1" stroke="#91a9be"/><text x="40" y="933" font-size="19" text-anchor="start" fill="#123750">收5/9</text><text x="225" y="933" font-size="21" text-anchor="start" fill="#123750">(14−3)/2 = 11/2</text><rect x="22" y="962" width="596" height="47" rx="7" fill="#e8edf1" stroke="#91a9be"/><text x="40" y="993" font-size="19" text-anchor="start" fill="#123750">全收</text><text x="225" y="993" font-size="21" text-anchor="start" fill="#123750">(16−3)/3 = 13/3</text><text x="24" y="1072" font-size="19" text-anchor="start" fill="#123750">同样件数选最高价值；三种中选六</text></g></svg>