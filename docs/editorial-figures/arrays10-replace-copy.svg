<svg xmlns="http://www.w3.org/2000/svg" width="870" height="650" viewBox="0 0 870 650" role="img"><title>三个实际位置的右邻复制与查询区间相减</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="23" fill="#20334a" text-anchor="start">a=[2,1,4]，b=[3,6,2]：只向左复制，已完成的右格不动</text><text x="25" y="118" font-size="21" fill="#20334a" text-anchor="start">原数组 a</text><rect x="300" y="87" width="85" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="342" y="119" font-size="26" fill="#20334a" text-anchor="middle">2</text><rect x="425" y="87" width="85" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="467" y="119" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="550" y="87" width="85" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="592" y="119" font-size="26" fill="#20334a" text-anchor="middle">4</text><text x="25" y="213" font-size="21" fill="#20334a" text-anchor="start">固定替换 b</text><rect x="300" y="182" width="85" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="342" y="214" font-size="26" fill="#20334a" text-anchor="middle">3</text><rect x="425" y="182" width="85" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="467" y="214" font-size="26" fill="#20334a" text-anchor="middle">6</text><rect x="550" y="182" width="85" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="592" y="214" font-size="26" fill="#20334a" text-anchor="middle">2</text><text x="25" y="308" font-size="21" fill="#20334a" text-anchor="start">各格先取较大</text><rect x="300" y="277" width="85" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="342" y="309" font-size="26" fill="#20334a" text-anchor="middle">3</text><rect x="425" y="277" width="85" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="467" y="309" font-size="26" fill="#20334a" text-anchor="middle">6</text><rect x="550" y="277" width="85" height="47" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="592" y="309" font-size="26" fill="#20334a" text-anchor="middle">4</text><text x="25" y="403" font-size="21" fill="#20334a" text-anchor="start">最终 M</text><rect x="300" y="372" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="342" y="404" font-size="26" fill="#20334a" text-anchor="middle">6</text><rect x="425" y="372" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="467" y="404" font-size="26" fill="#20334a" text-anchor="middle">6</text><rect x="550" y="372" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="592" y="404" font-size="26" fill="#20334a" text-anchor="middle">4</text><path d="M455,327 L352,363" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="520" y="352" font-size="19" fill="#20334a" text-anchor="start">第二格的6复制到第一格</text><text x="25" y="488" font-size="22" fill="#20334a" text-anchor="start">[2,3]：pre[3]=6+6+4=16，减掉 pre[1]=6</text><rect x="300" y="514" width="85" height="47" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="342" y="546" font-size="25" fill="#8b95a5" text-anchor="middle">6</text><rect x="425" y="514" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#328350" stroke-width="2"/><text x="467" y="546" font-size="25" fill="#20334a" text-anchor="middle">6</text><rect x="550" y="514" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#328350" stroke-width="2"/><text x="592" y="546" font-size="25" fill="#20334a" text-anchor="middle">4</text><path d="M430,576 L632,576" stroke="#328350" stroke-width="3" fill="none"/><text x="680" y="547" font-size="23" fill="#20334a" text-anchor="start">留下 10</text><text x="25" y="616" font-size="22" fill="#20334a" text-anchor="start">单问第一格也能用右边第二格的6；复制不会用掉来源</text></g></svg>