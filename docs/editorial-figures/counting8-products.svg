<svg xmlns="http://www.w3.org/2000/svg" width="640" height="610" viewBox="0 0 640 610" role="img"><title>Product Queries：六个真实可达乘积、首选与重复使用</title><rect width="640" height="610" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">n=12，可用值{2,6}：实际乘法边与最少数量</text><text x="24" y="74" class="small" text-anchor="start">点内为 乘积 / 内部dp；箭头旁是本次选的数</text><line x1="114.0" y1="156.0" x2="200.0" y2="156.0" stroke="#3775a8" stroke-width="3" stroke-dasharray=""/><text x="146" y="130" class="small" text-anchor="middle">×2</text><line x1="280.0" y1="156.0" x2="365.0" y2="156.0" stroke="#3775a8" stroke-width="3" stroke-dasharray=""/><text x="321" y="130" class="small" text-anchor="middle">×2</text><line x1="445.0" y1="156.0" x2="526.0" y2="156.0" stroke="#3775a8" stroke-width="3" stroke-dasharray=""/><text x="485" y="130" class="small" text-anchor="middle">×2</text><line x1="102.2842712474619" y1="184.2842712474619" x2="211.7157287525381" y2="293.7157287525381" stroke="#3775a8" stroke-width="3" stroke-dasharray=""/><text x="124" y="262" class="small" text-anchor="middle">×6</text><line x1="273.07201724313745" y1="178.4998150096755" x2="450.92798275686255" y2="299.5001849903245" stroke="#3775a8" stroke-width="3" stroke-dasharray=""/><text x="390" y="248" class="small" text-anchor="middle">×6</text><line x1="280.0" y1="322.0" x2="444.0" y2="322.0" stroke="#3775a8" stroke-width="3" stroke-dasharray=""/><text x="360" y="298" class="small" text-anchor="middle">×2</text><rect x="35" y="125" width="78" height="62" rx="5" fill="#fff1a8" stroke="#7394aa"/><text x="74" y="163" class="" text-anchor="middle">1 / 0</text><rect x="201" y="125" width="78" height="62" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="240" y="163" class="" text-anchor="middle">2 / 1</text><rect x="366" y="125" width="78" height="62" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="405" y="163" class="" text-anchor="middle">4 / 2</text><rect x="527" y="125" width="78" height="62" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="566" y="163" class="" text-anchor="middle">8 / 3</text><rect x="201" y="291" width="78" height="62" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="240" y="329" class="" text-anchor="middle">6 / 1</text><rect x="445" y="291" width="78" height="62" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="484" y="329" class="" text-anchor="middle">12 / 2</text><text x="24" y="407" class="small" text-anchor="start">十二：1→2→12（2×6）或1→6→12（6×2）</text><text x="24" y="450" class="small" text-anchor="start">八：1→2→4→8，实际选择三个2</text><text x="24" y="493" class="small" text-anchor="start">3、5、7、9、10、11不可达；不可能乘回更小值</text><text x="24" y="538" class="small" text-anchor="start">起点1的0是空积；原数组无1，目标1实际答−1</text><text x="24" y="580" class="small" text-anchor="start">原数组：[6,2,2,2,2,2,2,2,2,2,2,2]</text></svg>