<svg xmlns="http://www.w3.org/2000/svg" width="640" height="569" viewBox="0 0 640 569" role="img"><title>Boneca Ambalabu：同一候选的逐位贡献与不可达拼接</title><rect width="640" height="569" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">固定候选二 (010)，各列贡献相加为九</text><text x="24" y="71" class="" text-anchor="start">原数组 [1,2,4]；列按高位到低位排列</text><text x="295" y="110" class="small" text-anchor="middle">位2 / 权4</text><text x="407" y="110" class="small" text-anchor="middle">位1 / 权2</text><text x="519" y="110" class="small" text-anchor="middle">位0 / 权1</text><text x="24" y="164" class="" text-anchor="start">1 xor 2 = 3</text><rect x="259" y="133" width="72" height="48" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="295" y="166" class="" text-anchor="middle">0</text><rect x="371" y="133" width="72" height="48" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="407" y="166" class="" text-anchor="middle">1</text><rect x="483" y="133" width="72" height="48" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="519" y="166" class="" text-anchor="middle">1</text><text x="24" y="228" class="" text-anchor="start">2 xor 2 = 0</text><rect x="259" y="197" width="72" height="48" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="295" y="230" class="" text-anchor="middle">0</text><rect x="371" y="197" width="72" height="48" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="407" y="230" class="" text-anchor="middle">0</text><rect x="483" y="197" width="72" height="48" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="519" y="230" class="" text-anchor="middle">0</text><text x="24" y="292" class="" text-anchor="start">4 xor 2 = 6</text><rect x="259" y="261" width="72" height="48" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="295" y="294" class="" text-anchor="middle">1</text><rect x="371" y="261" width="72" height="48" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="407" y="294" class="" text-anchor="middle">1</text><rect x="483" y="261" width="72" height="48" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="519" y="294" class="" text-anchor="middle">0</text><text x="24" y="370" class="" text-anchor="start">一的个数</text><text x="295" y="370" class="" text-anchor="middle">1</text><text x="407" y="370" class="" text-anchor="middle">2</text><text x="519" y="370" class="" text-anchor="middle">1</text><text x="24" y="412" class="" text-anchor="start">本列贡献</text><text x="295" y="412" class="small" text-anchor="middle">1×4=4</text><text x="407" y="412" class="small" text-anchor="middle">2×2=4</text><text x="519" y="412" class="small" text-anchor="middle">1×1=1</text><text x="24" y="461" class="" text-anchor="start">cur 按低位到高位：0 → 1 → 5 → 9</text><text x="24" y="501" class="" text-anchor="start">各位都任意选一，会拼成7、虚构14；7不在数组中</text><text x="24" y="540" class="" text-anchor="start">真正候选得分：1得8，2得9，4得11；答案11</text></svg>