<svg xmlns="http://www.w3.org/2000/svg" width="720" height="846" viewBox="0 0 720 846" role="img"><title>三点模树真实操作序列先借孩子临时值一将根推至五再把孩子调至三，最大和九同时达到；固定叶反例中根仅能零二四，不能把叶模数三当增量</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">真实三点链：圆内编号，右侧写初值a和模数b</text><line x1="125" y1="139" x2="125" y2="191" stroke="#94a3b8" stroke-width="3"/><circle cx="125" cy="110" r="29" fill="#dbeafe" stroke="#20334a" stroke-width="2"/><text x="125" y="118" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="181" y="118" font-size="22" fill="#20334a" text-anchor="start">a=0，b=6</text><line x1="125" y1="249" x2="125" y2="301" stroke="#94a3b8" stroke-width="3"/><circle cx="125" cy="220" r="29" fill="#dbeafe" stroke="#20334a" stroke-width="2"/><text x="125" y="228" font-size="23" fill="#20334a" text-anchor="middle">2</text><text x="181" y="228" font-size="22" fill="#20334a" text-anchor="start">a=0，b=4</text><circle cx="125" cy="330" r="29" fill="#dbeafe" stroke="#20334a" stroke-width="2"/><text x="125" y="338" font-size="23" fill="#20334a" text-anchor="middle">3</text><text x="181" y="338" font-size="22" fill="#20334a" text-anchor="start">a=1，b=2</text><text x="417" y="111" font-size="22" fill="#20334a" text-anchor="start">叶3固定为1</text><text x="417" y="163" font-size="22" fill="#20334a" text-anchor="start">g₃=2=b₃</text><text x="417" y="220" font-size="21" fill="#20334a" text-anchor="start">点2可取0、1、2、3</text><text x="417" y="269" font-size="21" fill="#20334a" text-anchor="start">g₂=gcd(4,1)=1</text><text x="417" y="327" font-size="20" fill="#20334a" text-anchor="start">根初始和S=0，但g₁=1</text><rect x="22" y="389" width="676" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="38" y="421" font-size="22" fill="#20334a" text-anchor="start">初始</text><text x="323" y="421" font-size="23" fill="#20334a" text-anchor="start">(0,0,1)</text><rect x="22" y="445" width="676" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="38" y="477" font-size="22" fill="#20334a" text-anchor="start">操作点2一次</text><text x="323" y="477" font-size="23" fill="#20334a" text-anchor="start">(0,1,1)</text><rect x="22" y="501" width="676" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="38" y="533" font-size="22" fill="#20334a" text-anchor="start">操作根5次</text><text x="323" y="533" font-size="23" fill="#20334a" text-anchor="start">(5,1,1)</text><rect x="22" y="557" width="676" height="48" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="38" y="589" font-size="22" fill="#20334a" text-anchor="start">操作点2两次</text><text x="323" y="589" font-size="23" fill="#20334a" text-anchor="start">(5,3,1)，总和9</text><text x="22" y="651" font-size="21" fill="#20334a" text-anchor="start">根到5后，孩子从1变3不会自动改根；各点最大值确能共存</text><text x="22" y="701" font-size="22" fill="#20334a" text-anchor="start">固定孩子的反例：根a=0,b=6；唯一叶a=2,b=3</text><rect x="35" y="728" width="184" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="127" y="761" font-size="21" fill="#20334a" text-anchor="middle">根：0→2→4→0</text><path d="M227,752 L303,752" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="303,752 293.0,757.0 293.0,747.0" fill="#2d6db4"/><rect x="311" y="728" width="168" height="49" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="395" y="761" font-size="22" fill="#20334a" text-anchor="middle">叶固定为2</text><text x="22" y="819" font-size="21" fill="#20334a" text-anchor="start">正确g=gcd(6,2)=2；把固定叶的b=3加入会错判根能到5</text></g></svg>