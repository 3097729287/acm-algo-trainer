<svg xmlns="http://www.w3.org/2000/svg" width="660" height="565" viewBox="0 0 660 565" role="img"><title>原五十一项排列前五项交换第二三位再第一五位，八个实际逆序对逐个列出</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="32" font-size="21" fill="#20334a" text-anchor="start">五十一项中的前五项；后面6…51不动</text><text x="24" y="92" font-size="20" fill="#20334a" text-anchor="start">原排列</text><rect x="180" y="63" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="212" y="92" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="263" y="63" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="295" y="92" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="346" y="63" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="378" y="92" font-size="23" fill="#20334a" text-anchor="middle">3</text><rect x="429" y="63" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="461" y="92" font-size="23" fill="#20334a" text-anchor="middle">4</text><rect x="512" y="63" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="544" y="92" font-size="23" fill="#20334a" text-anchor="middle">5</text><text x="24" y="163" font-size="20" fill="#20334a" text-anchor="start">换2、3位</text><rect x="180" y="134" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="212" y="163" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="263" y="134" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="295" y="163" font-size="23" fill="#20334a" text-anchor="middle">3</text><rect x="346" y="134" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="378" y="163" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="429" y="134" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="461" y="163" font-size="23" fill="#20334a" text-anchor="middle">4</text><rect x="512" y="134" width="64" height="43" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="544" y="163" font-size="23" fill="#20334a" text-anchor="middle">5</text><text x="24" y="234" font-size="20" fill="#20334a" text-anchor="start">再换1、5位</text><rect x="180" y="205" width="64" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="212" y="234" font-size="23" fill="#20334a" text-anchor="middle">5</text><rect x="263" y="205" width="64" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="295" y="234" font-size="23" fill="#20334a" text-anchor="middle">3</text><rect x="346" y="205" width="64" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="378" y="234" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="429" y="205" width="64" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="461" y="234" font-size="23" fill="#20334a" text-anchor="middle">4</text><rect x="512" y="205" width="64" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="544" y="234" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="24" y="305" font-size="22" fill="#20334a" text-anchor="start">原有：(3,2)，保留1对。</text><text x="24" y="348" font-size="22" fill="#20334a" text-anchor="start">端点新增：(5,1)，增加1对。</text><text x="24" y="391" font-size="22" fill="#20334a" text-anchor="start">中间3：(5,3)、(3,1)，增加2对。</text><text x="24" y="434" font-size="22" fill="#20334a" text-anchor="start">中间2：(5,2)、(2,1)，增加2对。</text><text x="24" y="477" font-size="22" fill="#20334a" text-anchor="start">中间4：(5,4)、(4,1)，增加2对。</text><text x="24" y="528" font-size="23" fill="#20334a" text-anchor="start">总数1+1+2+2+2=8；本次change=7。</text></g></svg>