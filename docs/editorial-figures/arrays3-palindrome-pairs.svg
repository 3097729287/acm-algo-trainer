<svg xmlns="http://www.w3.org/2000/svg" width="850" height="595" viewBox="0 0 850 595" role="img"><title>对称字符对各自的最小修改数及其实际位置</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="24" y="36" font-size="25" fill="#20334a" text-anchor="start">s = bcxxda，唯一替换字符 c = a</text><text x="210" y="84" font-size="19" fill="#20334a" text-anchor="middle">位置1</text><text x="310" y="84" font-size="19" fill="#20334a" text-anchor="middle">位置2</text><text x="410" y="84" font-size="19" fill="#20334a" text-anchor="middle">位置3</text><text x="510" y="84" font-size="19" fill="#20334a" text-anchor="middle">位置4</text><text x="610" y="84" font-size="19" fill="#20334a" text-anchor="middle">位置5</text><text x="710" y="84" font-size="19" fill="#20334a" text-anchor="middle">位置6</text><text x="24" y="139" font-size="22" fill="#20334a" text-anchor="start">原字符</text><rect x="175" y="105" width="70" height="55" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="210" y="141" font-size="28" fill="#20334a" text-anchor="middle">b</text><rect x="275" y="105" width="70" height="55" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="310" y="141" font-size="28" fill="#20334a" text-anchor="middle">c</text><rect x="375" y="105" width="70" height="55" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="410" y="141" font-size="28" fill="#20334a" text-anchor="middle">x</text><rect x="475" y="105" width="70" height="55" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="510" y="141" font-size="28" fill="#20334a" text-anchor="middle">x</text><rect x="575" y="105" width="70" height="55" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="610" y="141" font-size="28" fill="#20334a" text-anchor="middle">d</text><rect x="675" y="105" width="70" height="55" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="710" y="141" font-size="28" fill="#20334a" text-anchor="middle">a</text><text x="24" y="406" font-size="22" fill="#20334a" text-anchor="start">修改后</text><rect x="175" y="372" width="70" height="55" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="210" y="408" font-size="28" fill="#20334a" text-anchor="middle">a</text><rect x="275" y="372" width="70" height="55" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="310" y="408" font-size="28" fill="#20334a" text-anchor="middle">a</text><rect x="375" y="372" width="70" height="55" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="410" y="408" font-size="28" fill="#20334a" text-anchor="middle">x</text><rect x="475" y="372" width="70" height="55" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="510" y="408" font-size="28" fill="#20334a" text-anchor="middle">x</text><rect x="575" y="372" width="70" height="55" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="610" y="408" font-size="28" fill="#20334a" text-anchor="middle">a</text><rect x="675" y="372" width="70" height="55" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="710" y="408" font-size="28" fill="#20334a" text-anchor="middle">a</text><path d="M410,165 V197 H510 V165" fill="none" stroke="#64748b" stroke-width="3"/><text x="460.0" y="224" font-size="20" fill="#64748b" text-anchor="middle">这一对：0 枚</text><path d="M310,165 V251 H610 V165" fill="none" stroke="#a26509" stroke-width="3"/><text x="460.0" y="278" font-size="20" fill="#a26509" text-anchor="middle">这一对：2 枚</text><path d="M210,165 V305 H710 V165" fill="none" stroke="#087b48" stroke-width="3"/><text x="460.0" y="332" font-size="20" fill="#087b48" text-anchor="middle">这一对：1 枚</text><text x="24" y="480" font-size="22" fill="#20334a" text-anchor="start">改位置 1：b→a；改位置 2：c→a；改位置 5：d→a。</text><text x="24" y="521" font-size="22" fill="#20334a" text-anchor="start">位置 3、4 原本都是 x，不必变成 a；共 1+2+0=3 枚。</text><text x="24" y="563" font-size="21" fill="#20334a" text-anchor="start">每个位置仅属于一对：三组最低费用能够同时实现。</text></g></svg>