<svg xmlns="http://www.w3.org/2000/svg" width="660" height="445" viewBox="0 0 660 445" role="img"><title>周一至周日实际累计十到九十，目标九十第七天完成，目标九十九跳一周后再过周一共八天</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">每天十题 / 周末二十题：一周共九十题</text><text x="63" y="72" font-size="21" fill="#20334a" text-anchor="middle">周一</text><rect x="24" y="88" width="78" height="78" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="63" y="119" font-size="24" fill="#20334a" text-anchor="middle">+10</text><text x="63" y="152" font-size="17" fill="#20334a" text-anchor="middle">累计10</text><text x="149" y="72" font-size="21" fill="#20334a" text-anchor="middle">周二</text><rect x="110" y="88" width="78" height="78" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="149" y="119" font-size="24" fill="#20334a" text-anchor="middle">+10</text><text x="149" y="152" font-size="17" fill="#20334a" text-anchor="middle">累计20</text><text x="235" y="72" font-size="21" fill="#20334a" text-anchor="middle">周三</text><rect x="196" y="88" width="78" height="78" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="235" y="119" font-size="24" fill="#20334a" text-anchor="middle">+10</text><text x="235" y="152" font-size="17" fill="#20334a" text-anchor="middle">累计30</text><text x="321" y="72" font-size="21" fill="#20334a" text-anchor="middle">周四</text><rect x="282" y="88" width="78" height="78" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="321" y="119" font-size="24" fill="#20334a" text-anchor="middle">+10</text><text x="321" y="152" font-size="17" fill="#20334a" text-anchor="middle">累计40</text><text x="407" y="72" font-size="21" fill="#20334a" text-anchor="middle">周五</text><rect x="368" y="88" width="78" height="78" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="407" y="119" font-size="24" fill="#20334a" text-anchor="middle">+10</text><text x="407" y="152" font-size="17" fill="#20334a" text-anchor="middle">累计50</text><text x="493" y="72" font-size="21" fill="#20334a" text-anchor="middle">周六</text><rect x="454" y="88" width="78" height="78" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="493" y="119" font-size="24" fill="#20334a" text-anchor="middle">+20</text><text x="493" y="152" font-size="17" fill="#20334a" text-anchor="middle">累计70</text><text x="579" y="72" font-size="21" fill="#20334a" text-anchor="middle">周日</text><rect x="540" y="88" width="78" height="78" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="579" y="119" font-size="24" fill="#20334a" text-anchor="middle">+20</text><text x="579" y="152" font-size="17" fill="#20334a" text-anchor="middle">累计90</text><text x="24" y="211" font-size="21" fill="#20334a" text-anchor="start">目标90：q=0，从周一走到周日，第7天首次完成。</text><text x="24" y="253" font-size="21" fill="#20334a" text-anchor="start">目标99：先跳一周，answer=7，remaining=9。</text><rect x="38" y="281" width="227" height="82" rx="8" fill="#fff7d6" stroke="#2d6db4" stroke-width="2"/><text x="58" y="313" font-size="21" fill="#20334a" text-anchor="start">下一周周一：第8天</text><text x="58" y="347" font-size="21" fill="#20334a" text-anchor="start">当天再做十题</text><text x="305" y="308" font-size="22" fill="#20334a" text-anchor="start">remaining：9 → −1</text><text x="305" y="349" font-size="22" fill="#20334a" text-anchor="start">answer：7 → 8</text><text x="24" y="414" font-size="21" fill="#20334a" text-anchor="start">逐日加一只计真正经过的日期，达标便停。</text></g></svg>