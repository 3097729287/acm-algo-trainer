<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img"><title>数轴上检查一个候选人与所有其他人的距离</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="24" y="36" font-size="24" fill="#20334a" text-anchor="start">四人坐标 [1,4,8,12]，要求到每个其他人的距离至少为 4</text><text x="24" y="78" font-size="21" fill="#20334a" text-anchor="start">检查编号3（坐标 8）：开区间 (4,12) 内不能有别人</text><rect x="270" y="117" width="376" height="56" fill="#fef3c7"/><line x1="82" y1="145" x2="834" y2="145" stroke="#64748b" stroke-width="2"/><line x1="82" y1="139" x2="82" y2="151" stroke="#64748b"/><text x="82" y="198" font-size="19" fill="#20334a" text-anchor="middle">0</text><line x1="129" y1="139" x2="129" y2="151" stroke="#64748b"/><text x="129" y="198" font-size="19" fill="#20334a" text-anchor="middle">1</text><line x1="270" y1="139" x2="270" y2="151" stroke="#64748b"/><text x="270" y="198" font-size="19" fill="#20334a" text-anchor="middle">4</text><line x1="458" y1="139" x2="458" y2="151" stroke="#64748b"/><text x="458" y="198" font-size="19" fill="#20334a" text-anchor="middle">8</text><line x1="646" y1="139" x2="646" y2="151" stroke="#64748b"/><text x="646" y="198" font-size="19" fill="#20334a" text-anchor="middle">12</text><line x1="834" y1="139" x2="834" y2="151" stroke="#64748b"/><text x="834" y="198" font-size="19" fill="#20334a" text-anchor="middle">16</text><circle cx="270" cy="145" r="11" fill="#fff" stroke="#a26509" stroke-width="3"/><circle cx="646" cy="145" r="11" fill="#fff" stroke="#a26509" stroke-width="3"/><circle cx="129" cy="145" r="6" fill="#087b48"/><text x="129" y="106" font-size="18" fill="#20334a" text-anchor="middle">编号1</text><circle cx="270" cy="145" r="6" fill="#087b48"/><text x="270" y="106" font-size="18" fill="#20334a" text-anchor="middle">编号2</text><rect x="449" y="136" width="18" height="18" fill="#334155"/><text x="458" y="106" font-size="18" fill="#20334a" text-anchor="middle">编号3：自己</text><circle cx="646" cy="145" r="6" fill="#087b48"/><text x="646" y="106" font-size="18" fill="#20334a" text-anchor="middle">编号4</text><text x="24" y="246" font-size="22" fill="#087b48" text-anchor="start">到其他人的距离：7、4、4 → 全部合格，追加编号 3</text><text x="24" y="323" font-size="21" fill="#20334a" text-anchor="start">检查编号2（坐标 4）：开区间 (0,8) 内不能有别人</text><rect x="82" y="362" width="376" height="56" fill="#fef3c7"/><line x1="82" y1="390" x2="834" y2="390" stroke="#64748b" stroke-width="2"/><line x1="82" y1="384" x2="82" y2="396" stroke="#64748b"/><text x="82" y="443" font-size="19" fill="#20334a" text-anchor="middle">0</text><line x1="129" y1="384" x2="129" y2="396" stroke="#64748b"/><text x="129" y="443" font-size="19" fill="#20334a" text-anchor="middle">1</text><line x1="270" y1="384" x2="270" y2="396" stroke="#64748b"/><text x="270" y="443" font-size="19" fill="#20334a" text-anchor="middle">4</text><line x1="458" y1="384" x2="458" y2="396" stroke="#64748b"/><text x="458" y="443" font-size="19" fill="#20334a" text-anchor="middle">8</text><line x1="646" y1="384" x2="646" y2="396" stroke="#64748b"/><text x="646" y="443" font-size="19" fill="#20334a" text-anchor="middle">12</text><line x1="834" y1="384" x2="834" y2="396" stroke="#64748b"/><text x="834" y="443" font-size="19" fill="#20334a" text-anchor="middle">16</text><circle cx="82" cy="390" r="11" fill="#fff" stroke="#a26509" stroke-width="3"/><circle cx="458" cy="390" r="11" fill="#fff" stroke="#a26509" stroke-width="3"/><circle cx="129" cy="390" r="6" fill="#c2410c"/><text x="129" y="351" font-size="18" fill="#20334a" text-anchor="middle">编号1</text><rect x="261" y="381" width="18" height="18" fill="#334155"/><text x="270" y="351" font-size="18" fill="#20334a" text-anchor="middle">编号2：自己</text><circle cx="458" cy="390" r="6" fill="#087b48"/><text x="458" y="351" font-size="18" fill="#20334a" text-anchor="middle">编号3</text><circle cx="646" cy="390" r="6" fill="#087b48"/><text x="646" y="351" font-size="18" fill="#20334a" text-anchor="middle">编号4</text><text x="24" y="491" font-size="22" fill="#c2410c" text-anchor="start">到其他人的距离：3、4、8 → 编号 1 距离仅 3，不追加编号 2</text><text x="24" y="578" font-size="20" fill="#20334a" text-anchor="start">黄带内部：距离 &lt;4；空心端点：距离 =4，允许有人。</text><text x="24" y="611" font-size="20" fill="#20334a" text-anchor="start">方块为当前候选，按身份跳过自己；其他每个人仍在原坐标。</text></g></svg>