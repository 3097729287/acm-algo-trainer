<svg xmlns="http://www.w3.org/2000/svg" width="640" height="461" viewBox="0 0 640 461" role="img"><title>Whole Product：三个真实差因子与两个余数置换环</title><rect width="640" height="461" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">同一顺序取余，带符号的差仍逐项同余</text><text x="24" y="70" class="" text-anchor="start">N=3；排序后的原数 [1,3,5]；原差积 2×4×2=16</text><text x="252" y="96" class="small" text-anchor="middle">i=0</text><text x="372" y="96" class="small" text-anchor="middle">i=1</text><text x="492" y="96" class="small" text-anchor="middle">i=2</text><text x="24" y="138" class="" text-anchor="start">B 原数</text><rect x="210" y="105" width="85" height="52" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="252" y="139" class="" text-anchor="middle">1</text><rect x="330" y="105" width="85" height="52" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="372" y="139" class="" text-anchor="middle">3</text><rect x="450" y="105" width="85" height="52" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="492" y="139" class="" text-anchor="middle">5</text><text x="24" y="220" class="" text-anchor="start">p 余数</text><rect x="210" y="187" width="85" height="52" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="252" y="221" class="" text-anchor="middle">1</text><rect x="330" y="187" width="85" height="52" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="372" y="221" class="" text-anchor="middle">0</text><rect x="450" y="187" width="85" height="52" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="492" y="221" class="" text-anchor="middle">2</text><text x="24" y="304" class="" text-anchor="start">三个余数差：0−1=−1，2−1=1，2−0=2</text><text x="24" y="345" class="" text-anchor="start">自然顺序乘积 V=1!×2!=2；当前差积为 −2</text><text x="24" y="388" class="" text-anchor="start">映射环：0 → 1 → 0，另有 2 → 2；cycles=2</text><text x="24" y="432" class="" text-anchor="start">N−cycles=1 为奇数，取负：−2 mod 3 = 1</text></svg>