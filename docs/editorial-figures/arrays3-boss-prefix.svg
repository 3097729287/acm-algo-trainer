<svg xmlns="http://www.w3.org/2000/svg" width="850" height="510" viewBox="0 0 850 510" role="img"><title>选出的六张伤害牌与实际首次触发前缀</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="24" y="36" font-size="24" fill="#20334a" text-anchor="start">原牌 [9,9,9,9,9,6,1]：选六张，另排出牌顺序</text><text x="24" y="79" font-size="21" fill="#20334a" text-anchor="start">选牌集：四张 9、一张 6、一张 1；未选的一张 9 留到后面。</text><text x="91" y="128" font-size="19" fill="#20334a" text-anchor="middle">第1张</text><rect x="49" y="147" width="84" height="62" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="91" y="185" font-size="29" fill="#20334a" text-anchor="middle">9</text><text x="91" y="250" font-size="19" fill="#087b48" text-anchor="middle">伤害 9</text><text x="199" y="128" font-size="19" fill="#20334a" text-anchor="middle">第2张</text><rect x="157" y="147" width="84" height="62" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="199" y="185" font-size="29" fill="#20334a" text-anchor="middle">6</text><text x="199" y="250" font-size="19" fill="#087b48" text-anchor="middle">伤害 6</text><text x="307" y="128" font-size="19" fill="#20334a" text-anchor="middle">第3张</text><rect x="265" y="147" width="84" height="62" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="307" y="185" font-size="29" fill="#20334a" text-anchor="middle">9</text><text x="307" y="250" font-size="19" fill="#087b48" text-anchor="middle">伤害 9</text><text x="415" y="128" font-size="19" fill="#20334a" text-anchor="middle">第4张</text><rect x="373" y="147" width="84" height="62" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="415" y="185" font-size="29" fill="#20334a" text-anchor="middle">1</text><text x="415" y="250" font-size="19" fill="#087b48" text-anchor="middle">伤害 1</text><text x="523" y="128" font-size="19" fill="#20334a" text-anchor="middle">第5张</text><rect x="481" y="147" width="84" height="62" rx="6" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="523" y="185" font-size="29" fill="#20334a" text-anchor="middle">9</text><text x="523" y="250" font-size="19" fill="#087b48" text-anchor="middle">伤害 9</text><text x="631" y="128" font-size="19" fill="#20334a" text-anchor="middle">第6张</text><rect x="589" y="147" width="84" height="62" rx="6" fill="#fef3c7" stroke="#a26509" stroke-width="2"/><text x="631" y="185" font-size="29" fill="#20334a" text-anchor="middle">9</text><text x="631" y="250" font-size="19" fill="#087b48" text-anchor="middle">伤害 9</text><text x="739" y="128" font-size="19" fill="#20334a" text-anchor="middle">第7张</text><rect x="697" y="147" width="84" height="62" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="739" y="185" font-size="29" fill="#20334a" text-anchor="middle">9</text><text x="739" y="250" font-size="19" fill="#64748b" text-anchor="middle">伤害 0</text><path d="M491,217 V227 H663 V217" fill="none" stroke="#a26509" stroke-width="3"/><text x="24" y="302" font-size="22" fill="#20334a" text-anchor="start">前五张：9、6、9、1、9，相邻均不同。</text><text x="24" y="344" font-size="22" fill="#20334a" text-anchor="start">第六张：与第五张同为 9，触发护盾，但本张仍伤害 9。</text><text x="24" y="386" font-size="22" fill="#20334a" text-anchor="start">第七张：护盾已触发，剩下的 9 伤害为 0。</text><rect x="24" y="414" width="801" height="65" rx="6" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="42" y="455" font-size="21" fill="#20334a" text-anchor="start">有效伤害 = 9+6+9+1+9+9 = 43；降序扫描不是出牌顺序。</text></g></svg>