<svg xmlns="http://www.w3.org/2000/svg" width="720" height="608" viewBox="0 0 720 608" role="img"><title>字符串abac的重复位置共享字母映射，搜索字母c时跳过占用数字，1012失败撤销后找到1013</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="38" font-size="23" fill="#20334a" text-anchor="start">S=abac：字母编号 [0,1,0,2]；同一 a 共享数字</text><rect x="40" y="68" width="130" height="78" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="105" y="100" font-size="25" fill="#20334a" text-anchor="middle">a</text><text x="105" y="132" font-size="21" fill="#20334a" text-anchor="middle">编号 0</text><rect x="210" y="68" width="130" height="78" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="275" y="100" font-size="25" fill="#20334a" text-anchor="middle">b</text><text x="275" y="132" font-size="21" fill="#20334a" text-anchor="middle">编号 1</text><rect x="380" y="68" width="130" height="78" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="445" y="100" font-size="25" fill="#20334a" text-anchor="middle">a</text><text x="445" y="132" font-size="21" fill="#20334a" text-anchor="middle">编号 0</text><rect x="550" y="68" width="130" height="78" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="615" y="100" font-size="25" fill="#20334a" text-anchor="middle">c</text><text x="615" y="132" font-size="21" fill="#20334a" text-anchor="middle">编号 2</text><text x="25" y="190" font-size="23" fill="#20334a" text-anchor="start">固定 a=1、b=0：dfs(2) 只给字母 c 选数字</text><rect x="24" y="220" width="672" height="93" rx="8" fill="#f1f5f9" stroke="#667488" stroke-width="2"/><text x="40" y="255" font-size="23" fill="#667488" text-anchor="start">c=0 或 1：used 已占用，跳过</text><text x="40" y="292" font-size="21" fill="#20334a" text-anchor="start">a 与 b 的数字不能再次分配给不同字母 c</text><rect x="24" y="332" width="672" height="93" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="40" y="367" font-size="23" fill="#a32e36" text-anchor="start">c=2：1 0 1 2 → 1012 是合数</text><text x="40" y="404" font-size="21" fill="#20334a" text-anchor="start">返回失败，取消 used[2]；再尝试 c 的下一数字</text><rect x="24" y="444" width="672" height="93" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="40" y="479" font-size="23" fill="#087b48" text-anchor="start">c=3：1 0 1 3 → 1013 是素数</text><text x="40" y="516" font-size="21" fill="#20334a" text-anchor="start">保持 a 的两个位置相等，四位数满足全部条件</text><text x="25" y="581" font-size="22" fill="#20334a" text-anchor="start">找到任意一个解即可：沿递归调用链返回 true 并输出 1013</text></g></svg>