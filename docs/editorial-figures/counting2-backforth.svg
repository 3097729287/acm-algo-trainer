<svg xmlns="http://www.w3.org/2000/svg" width="640" height="474" viewBox="0 0 640 474" role="img"><title>Back and Forth Distance：同一行格子上的直接与掉头跳跃</title><rect width="640" height="474" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52677b"/></marker></defs><text x="24" y="34" class="title" text-anchor="start">从二到一：到四掉头，费用比直达更低</text><text x="24" y="67" class="" text-anchor="start">官方样例：L₂=5，R₂=1；右边 L₃=6、L₄=2、L₅=9</text><circle cx="75" cy="180" r="10" fill="#168377"/><text x="75" y="217" class="" text-anchor="middle">1</text><line x1="85" y1="180" x2="185" y2="180" stroke="#a0afbd" stroke-width="2" stroke-dasharray=""/><circle cx="195" cy="180" r="10" fill="#168377"/><text x="195" y="217" class="" text-anchor="middle">2</text><line x1="205" y1="180" x2="305" y2="180" stroke="#a0afbd" stroke-width="2" stroke-dasharray=""/><circle cx="315" cy="180" r="10" fill="#168377"/><text x="315" y="217" class="" text-anchor="middle">3</text><line x1="325" y1="180" x2="425" y2="180" stroke="#a0afbd" stroke-width="2" stroke-dasharray=""/><circle cx="435" cy="180" r="10" fill="#168377"/><text x="435" y="217" class="" text-anchor="middle">4</text><line x1="445" y1="180" x2="545" y2="180" stroke="#a0afbd" stroke-width="2" stroke-dasharray=""/><circle cx="555" cy="180" r="10" fill="#168377"/><text x="555" y="217" class="" text-anchor="middle">5</text><line x1="195" y1="145" x2="75" y2="145" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="24" y="116" class="" text-anchor="start">直接 2 → 1，费用 L₂ = 5</text><line x1="195" y1="255" x2="435" y2="255" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="267" y="285" class="" text-anchor="start">R₂ = 1</text><line x1="435" y1="335" x2="75" y2="335" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="192" y="366" class="" text-anchor="start">L₄ = 2</text><text x="24" y="412" class="" text-anchor="start">先 2 → 4，再 4 → 1：1 + 2 = 3</text><text x="24" y="448" class="" text-anchor="start">格四是后缀最小费用的位置；跨过格三不另收费</text></svg>