<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 365" role="img" aria-labelledby="title"><title id="title">Number of Pairs · 从找一对到数所有对：教学小例</title><rect width="920" height="365" rx="12" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#253340"><text x="24" y="35" font-size="22" fill="#253340">1538C · 教学小例</text><circle cx="265" cy="105" r="24" fill="#e2f3ed" stroke="#257c67"/><text x="258" y="111" font-size="19" fill="#253340">1</text><text x="243" y="69" font-size="13" fill="#253340">位置 1</text><circle cx="397" cy="105" r="24" fill="#e2f3ed" stroke="#257c67"/><text x="390" y="111" font-size="19" fill="#253340">2</text><text x="375" y="69" font-size="13" fill="#253340">位置 2</text><circle cx="529" cy="105" r="24" fill="#e2f3ed" stroke="#257c67"/><text x="522" y="111" font-size="19" fill="#253340">2</text><text x="507" y="69" font-size="13" fill="#253340">位置 3</text><circle cx="661" cy="105" r="24" fill="#e2f3ed" stroke="#257c67"/><text x="654" y="111" font-size="19" fill="#253340">4</text><text x="639" y="69" font-size="13" fill="#253340">位置 4</text><path d="M265,135 Q331.0,188 397,135" stroke="#257c67" stroke-width="3" fill="none"/><path d="M265,135 Q397.0,240 529,135" stroke="#257c67" stroke-width="3" fill="none"/><path d="M397,135 Q463.0,296 529,135" stroke="#257c67" stroke-width="3" fill="none"/><text x="24" y="324" font-size="17" fill="#253340">和在 [3,4] 的三对：(1,2)、(1,3)、(2,3)。重复值仍是不同位置。</text></g></svg>