<svg xmlns="http://www.w3.org/2000/svg" width="850" height="580" viewBox="0 0 850 580" role="img"><title>移到末尾的逐步排列与最后时刻</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="24" y="36" font-size="25" fill="#20334a" text-anchor="start">按值移动 1、3、1：真正的排列变化与 last 记录</text><text x="24" y="107" font-size="20" fill="#20334a" text-anchor="start">初始</text><rect x="245" y="75" width="62" height="49" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="276" y="107" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="320" y="75" width="62" height="49" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="351" y="107" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="395" y="75" width="62" height="49" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="426" y="107" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="470" y="75" width="62" height="49" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="501" y="107" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="566" y="107" font-size="20" fill="#20334a" text-anchor="start">last 全为 0</text><text x="24" y="187" font-size="20" fill="#20334a" text-anchor="start">第 1 次：移值 1</text><rect x="245" y="155" width="62" height="49" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="276" y="187" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="320" y="155" width="62" height="49" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="351" y="187" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="395" y="155" width="62" height="49" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="426" y="187" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="470" y="155" width="62" height="49" rx="6" fill="#fef3c7" stroke="#a26509" stroke-width="2"/><text x="501" y="187" 