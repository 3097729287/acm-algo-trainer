h="800" height="110" rx="6" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="42" y="442" font-size="22" fill="#20334a" text-anchor="start">输出第一段：4、2（last=0，沿原排列）</text><text x="42" y="478" font-size="22" fill="#20334a" text-anchor="start">输出第二段：3、1（记录 (2,3)、(3,1)，按时刻排序）</text><text x="24" y="553" font-size="20" fill="#20334a" text-anchor="start">黄框：本轮移到末尾的值。结果为 [4,2,3,1]，每个值恰好一次。</text></g></svg>