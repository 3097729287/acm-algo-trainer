<svg xmlns="http://www.w3.org/2000/svg" width="720" height="853" viewBox="0 0 720 853" role="img"><title>查询左端二的真实启用冻结事件，位置二于三冻结剩常数一，位置三于五冻结剩常数四，位置五启用三M减十二；M二到六的总斜率一二二三三、总常数负一负三负三负七负七得到S一三五八十一</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">固定查询左端l=2；冻结后仍保留旧前缀贡献</text><text x="22" y="87" font-size="22" fill="#20334a" text-anchor="start">j=2：P=1、R=3，生效左端只有[2,2]</text><text x="22" y="134" font-size="21" fill="#20334a" text-anchor="start">M=2启用：A+=1，B+=−1，贡献M−1=1</text><text x="22" y="181" font-size="21" fill="#20334a" text-anchor="start">M=3冻结：A−=1，B+=2，留下常数1</text><text x="22" y="228" font-size="21" fill="#20334a" text-anchor="start">j=3：P=1、R=5，生效左端[2,3]包含本查询</text><text x="22" y="275" font-size="21" fill="#20334a" text-anchor="start">M=3启用：A+=2，B+=−4，贡献2M−4</text><text x="22" y="322" font-size="21" fill="#20334a" text-anchor="start">M=5冻结：A−=2，B+=8，留下常数4</text><text x="22" y="369" font-size="21" fill="#20334a" text-anchor="start">j=5：P=0、R=7，M=5启用3M−12</text><text x="22" y="448" font-size="20" fill="#20334a" text-anchor="start">扫描M</text><rect x="213" y="415" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="257.0" y="448" font-size="22" fill="#20334a" text-anchor="middle">2</text><rect x="309" y="415" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="353.0" y="448" font-size="22" fill="#20334a" text-anchor="middle">3</text><rect x="405" y="415" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="449.0" y="448" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="501" y="415" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="545.0" y="448" font-size="22" fill="#20334a" text-anchor="middle">5</text><rect x="597" y="415" width="88" height="48" 