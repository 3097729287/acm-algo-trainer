<svg xmlns="http://www.w3.org/2000/svg" width="930" height="555" viewBox="0 0 930 555" role="img"><title>四六七块瓷砖的真实完整共边与单位边计数</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="24" y="36" font-size="25" fill="#20334a" text-anchor="start">每条红色共边，对应两块各一条单位边</text><text x="48" y="80" font-size="23" fill="#20334a" text-anchor="start">N=4</text><rect x="48" y="100" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="48" y="160" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="108" y="100" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="108" y="160" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><line x1="108" y1="160" x2="108" y2="220" stroke="#c2410c" stroke-width="5"/><line x1="108" y1="160" x2="168" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="108" y1="100" x2="108" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="48" y1="160" x2="108" y2="160" stroke="#c2410c" stroke-width="5"/><text x="48" y="329" font-size="22" fill="#20334a" text-anchor="start">e=4 对，P=8 条</text><text x="48" y="371" font-size="22" fill="#20334a" text-anchor="start">16 − 2×4 = 8</text><text x="338" y="80" font-size="23" fill="#20334a" text-anchor="start">N=6</text><rect x="338" y="100" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="338" y="160" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="398" y="100" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="398" y="160" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="458" y="100" width="60" height="60" fill="#dbeafe" stroke="#334155" stroke-width="3"/><rect x="458" y="160" width="60" height="60" fill="#dbeafe" stroke="#334155" stroke-width="3"/><line x1="398" y1="160" x2="398" y2="220" stroke="#c2410c" stroke-width="5"/><line x1="398" y1="100" x2="398" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="338" y1="160" x2="398" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="458" y1="160" x2="458" y2="220" stroke="#c2410c" stroke-width="5"/><line x1="458" y1="160" x2="518" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="458" y1="100" x2="458" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="398" y1="160" x2="458" y2="160" stroke="#c2410c" stroke-width="5"/><text x="338" y="329" font-size="22" fill="#20334a" text-anchor="start">e=7 对，P=10 条</text><text x="338" y="371" font-size="22" fill="#20334a" text-anchor="start">24 − 2×7 = 10</text><text x="628" y="80" font-size="23" fill="#20334a" text-anchor="start">N=7</text><rect x="628" y="100" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="628" y="160" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="628" y="220" width="60" height="60" fill="#fef3c7" stroke="#334155" stroke-width="3"/><rect x="688" y="100" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="688" y="160" width="60" height="60" fill="#dcfce7" stroke="#334155" stroke-width="3"/><rect x="748" y="100" width="60" height="60" fill="#dbeafe" stroke="#334155" stroke-width="3"/><rect x="748" y="160" width="60" height="60" fill="#dbeafe" stroke="#334155" stroke-width="3"/><line x1="688" y1="160" x2="688" y2="220" stroke="#c2410c" stroke-width="5"/><line x1="628" y1="220" x2="688" y2="220" stroke="#c2410c" stroke-width="5"/><line x1="688" y1="100" x2="688" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="628" y1="160" x2="688" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="748" y1="100" x2="748" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="688" y1="160" x2="748" y2="160" stroke="#c2410c" stroke-width="5"/><line x1="748" y1="160" x2="748" y2="220" stroke="#c2410c" stroke-width="5"/><line x1="748" y1="160" x2="808" y2="160" stroke="#c2410c" stroke-width="5"/><text x="628" y="329" font-size="22" fill="#20334a" text-anchor="start">e=8 对，P=12 条</text><text x="628" y="371" font-size="22" fill="#20334a" text-anchor="start">28 − 2×8 = 12</text><text x="24" y="432" font-size="21" fill="#20334a" text-anchor="start">绿色：2×2方阵；蓝色：补满一列；黄色：沿相邻边再补一块。</text><text x="24" y="476" font-size="21" fill="#20334a" text-anchor="start">七块不是3×3满方阵；一共八对完整共边，十二条边未配对。</text><text x="24" y="520" font-size="22" fill="#20334a" text-anchor="start">P = 4N − 2e；最小化未配对边数，才能最大化共边对数。</text></g></svg>