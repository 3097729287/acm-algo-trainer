<svg xmlns="http://www.w3.org/2000/svg" width="760" height="770" viewBox="0 0 760 770" role="img"><title>原根异或候选一一映射，t零一二对应七十四九，数轴实际标出上界十一与两个合法值，解释批量一和边界零一贡献</title><rect width="760" height="770" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="38" font-size="24" fill="#17334d" text-anchor="start">P=7，m=11；q=1；掩码P−1=6</text><text x="65" y="94" font-size="21" fill="#17334d" text-anchor="middle">编号t</text><text x="217" y="94" font-size="21" fill="#17334d" text-anchor="middle">tP+1</text><text x="406" y="94" font-size="21" fill="#17334d" text-anchor="middle">异或6后的真实g</text><text x="622" y="94" font-size="21" fill="#17334d" text-anchor="middle">是否≤11</text><rect x="24" y="126" width="712" height="63" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="65" y="167" font-size="24" fill="#17334d" text-anchor="middle">0</text><text x="217" y="167" font-size="24" fill="#17334d" text-anchor="middle">1</text><text x="406" y="167" font-size="24" fill="#17334d" text-anchor="middle">7</text><text x="622" y="167" font-size="24" fill="#17334d" text-anchor="middle">批量计入</text><rect x="24" y="212" width="712" height="63" rx="7" fill="#fee2e2" stroke="#476986" stroke-width="2"/><text x="65" y="253" font-size="24" fill="#17334d" text-anchor="middle">1</text><text x="217" y="253" font-size="24" fill="#17334d" text-anchor="middle">8</text><text x="406" y="253" font-size="24" fill="#17334d" text-anchor="middle">14</text><text x="622" y="253" font-size="24" fill="#17334d" text-anchor="middle">不加</text><rect x="24" y="298" width="712" height="63" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="65" y="339" font-size="24" fill="#17334d" text-anchor="middle">2</text><text x="217" y="339" font-size="24" fill="#17334d" text-anchor="middle">15</text><text x="406" y="339" font-size="24" fill="#17334d" text-anchor="middle">9</text><text x="622" y="339" font-size="24" fill="#17334d" text-anchor="middle">加1</text><text x="24" y="429" font-size="23" fill="#17334d" text-anchor="start">同一数轴：7、9在范围内，14在11右侧</text><line x1="60" y1="511" x2="700" y2="511" stroke="#476986" stroke-width="2"/><line x1="60" y1="504" x2="60" y2="518" stroke="#476986" stroke-width="2"/><text x="60" y="548" font-size="17" fill="#17334d" text-anchor="middle">0</text><line x1="104" y1="504" x2="104" y2="518" stroke="#476986" stroke-width="2"/><text x="104" y="548" font-size="17" fill="#17334d" text-anchor="middle">1</text><line x1="148" y1="504" x2="148" y2="518" stroke="#476986" stroke-width="2"/><text x="148" y="548" font-size="17" fill="#17334d" text-anchor="middle">2</text><line x1="192" y1="504" x2="192" y2="518" stroke="#476986" stroke-width="2"/><text x="192" y="548" font-size="17" fill="#17334d" text-anchor="middle">3</text><line x1="236" y1="504" x2="236" y2="518" stroke="#476986" stroke-width="2"/><text x="236" y="548" font-size="17" fill="#17334d" text-anchor="middle">4</text><line x1="280" y1="504" x2="280" y2="518" stroke="#476986" stroke-width="2"/><text x="280" y="548" font-size="17" fill="#17334d" text-anchor="middle">5</text><line x1="324" y1="504" x2="324" y2="518" stroke="#476986" stroke-width="2"/><text x="324" y="548" font-size="17" fill="#17334d" text-anchor="middle">6</text><line x1="368" y1="504" x2="368" y2="518" stroke="#476986" stroke-width="2"/><text x="368" y="548" font-size="17" fill="#17334d" text-anchor="middle">7</text><line x1="412" y1="504" x2="412" y2="518" stroke="#476986" stroke-width="2"/><text x="412" y="548" font-size="17" fill="#17334d" text-anchor="middle">8</text><line x1="456" y1="504" x2="456" y2="518" stroke="#476986" stroke-width="2"/><text x="456" y="548" font-size="17" fill="#17334d" text-anchor="middle">9</text><line x1="500" y1="504" x2="500" y2="518" stroke="#476986" stroke-width="2"/><text x="500" y="548" font-size="17" fill="#17334d" text-anchor="middle">10</text><line x1="544" y1="504" x2="544" y2="518" stroke="#476986" stroke-width="2"/><text x="544" y="548" font-size="17" fill="#17334d" text-anchor="middle">11</text><line x1="588" y1="504" x2="588" y2="518" stroke="#476986" stroke-width="2"/><text x="588" y="548" font-size="17" fill="#17334d" text-anchor="middle">12</text><line x1="632" y1="504" x2="632" y2="518" stroke="#476986" stroke-width="2"/><text x="632" y="548" font-size="17" fill="#17334d" text-anchor="middle">13</text><line x1="676" y1="504" x2="676" y2="518" stroke="#476986" stroke-width="2"/><text x="676" y="548" font-size="17" fill="#17334d" text-anchor="middle">14</text><circle cx="368" cy="511" r="10" fill="#16806b"/><circle cx="456" cy="511" r="10" fill="#16806b"/><circle cx="676" cy="511" r="10" fill="#c74b4b"/><line x1="544" y1="468" x2="544" y2="525" stroke="#c74b4b" stroke-width="3"/><text x="544" y="455" font-size="20" fill="#17334d" text-anchor="middle">m=11</text><text x="24" y="611" font-size="22" fill="#17334d" text-anchor="start">8异或6=14，15异或6=9：结果并不单调。</text><text x="24" y="670" font-size="22" fill="#17334d" text-anchor="start">t≥3时下界至少16，已全部超过11。</text><text x="24" y="729" font-size="22" fill="#17334d" text-anchor="start">计数：先记1，再加0、加1，最后得到2。</text></g></svg>