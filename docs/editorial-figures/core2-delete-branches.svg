<svg xmlns="http://www.w3.org/2000/svg" width="620" height="540" viewBox="0 0 620 540" role="img"><title>样例按右上和左上方向分别删除字符，删除数增加时也必须舍弃有利字符以保持固定长度</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">UUDDLRL：从左向右决定删留，不重排字符</text><text x="24" y="82" font-size="21" fill="#20334a" text-anchor="start">右上 RU，k=3：删 3 个不利字符</text><rect x="32" y="98" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="65" y="130" font-size="25" fill="#20334a" text-anchor="middle">U</text><text x="65" y="165" font-size="18" fill="#087b48" text-anchor="middle">留</text><rect x="112" y="98" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="145" y="130" font-size="25" fill="#20334a" text-anchor="middle">U</text><text x="145" y="165" font-size="18" fill="#087b48" text-anchor="middle">留</text><rect x="192" y="98" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="225" y="130" font-size="25" fill="#20334a" text-anchor="middle">D</text><text x="225" y="165" font-size="18" fill="#a32e36" text-anchor="middle">删</text><rect x="272" y="98" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="305" y="130" font-size="25" fill="#20334a" text-anchor="middle">D</text><text x="305" y="165" font-size="18" fill="#a32e36" text-anchor="middle">删</text><rect x="352" y="98" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="385" y="130" font-size="25" fill="#20334a" text-anchor="middle">L</text><text x="385" y="165" font-size="18" fill="#a32e36" text-anchor="middle">删</text><rect x="432" y="98" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="465" y="130" font-size="25" fill="#20334a" text-anchor="middle">R</text><text x="465" y="165" font-size="18" fill="#087b48" text-anchor="middle">留</text><rect x="512" y="98" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="545" y="130" font-size="25" fill="#20334a" text-anchor="middle">L</text><text x="545" y="165" font-size="18" fill="#087b48" text-anchor="middle">留</text><text x="24" y="200" font-size="21" fill="#20334a" text-anchor="start">输出 UURL，距离 2</text><text x="24" y="237" font-size="21" fill="#20334a" text-anchor="start">左上 LU，k=3：恰好删完不利字符</text><rect x="32" y="253" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="65" y="285" font-size="25" fill="#20334a" text-anchor="middle">U</text><text x="65" y="320" font-size="18" fill="#087b48" text-anchor="middle">留</text><rect x="112" y="253" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="145" y="285" font-size="25" fill="#20334a" text-anchor="middle">U</text><text x="145" y="320" font-size="18" fill="#087b48" text-anchor="middle">留</text><rect x="192" y="253" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="225" y="285" font-size="25" fill="#20334a" text-anchor="middle">D</text><text x="225" y="320" font-size="18" fill="#a32e36" text-anchor="middle">删</text><rect x="272" y="253" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="305" y="285" font-size="25" fill="#20334a" text-anchor="middle">D</text><text x="305" y="320" font-size="18" fill="#a32e36" text-anchor="middle">删</text><rect x="352" y="253" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="385" y="285" font-size="25" fill="#20334a" text-anchor="middle">L</text><text x="385" y="320" font-size="18" fill="#087b48" text-anchor="middle">留</text><rect x="432" y="253" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="465" y="285" font-size="25" fill="#20334a" text-anchor="middle">R</text><text x="465" y="320" font-size="18" fill="#a32e36" text-anchor="middle">删</text><rect x="512" y="253" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="545" y="285" font-size="25" fill="#20334a" text-anchor="middle">L</text><text x="545" y="320" font-size="18" fill="#087b48" text-anchor="middle">留</text><text x="24" y="355" font-size="21" fill="#20334a" text-anchor="start">输出 UULL，距离 4</text><text x="24" y="392" font-size="21" fill="#20334a" text-anchor="start">左上 LU，k=4：还须补删一个有利字符</text><rect x="32" y="408" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="65" y="440" font-size="25" fill="#20334a" text-anchor="middle">U</text><text x="65" y="475" font-size="18" fill="#087b48" text-anchor="middle">留</text><rect x="112" y="408" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="145" y="440" font-size="25" fill="#20334a" text-anchor="middle">U</text><text x="145" y="475" font-size="18" fill="#087b48" text-anchor="middle">留</text><rect x="192" y="408" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="225" y="440" font-size="25" fill="#20334a" text-anchor="middle">D</text><text x="225" y="475" font-size="18" fill="#a32e36" text-anchor="middle">删</text><rect x="272" y="408" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="305" y="440" font-size="25" fill="#20334a" text-anchor="middle">D</text><text x="305" y="475" font-size="18" fill="#a32e36" text-anchor="middle">删</text><rect x="352" y="408" width="66" height="47" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="385" y="440" font-size="25" fill="#20334a" text-anchor="middle">L</text><text x="385" y="475" font-size="18" fill="#087b48" text-anchor="middle">留</text><rect x="432" y="408" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="465" y="440" font-size="25" fill="#20334a" text-anchor="middle">R</text><text x="465" y="475" font-size="18" fill="#a32e36" text-anchor="middle">删</text><rect x="512" y="408" width="66" height="47" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="545" y="440" font-size="25" fill="#20334a" text-anchor="middle">L</text><text x="545" y="475" font-size="18" fill="#a32e36" text-anchor="middle">删</text><text x="24" y="510" font-size="21" fill="#20334a" text-anchor="start">输出 UUL，距离 3</text></g></svg>