<svg xmlns="http://www.w3.org/2000/svg" width="870" height="647" viewBox="0 0 870 647" role="img"><title>真实位置的单次前缀影响及多组操作叠加构造</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="23" fill="#20334a" text-anchor="start">一次 [2,4] 操作：单点可减，任意前缀累计却只增零或一</text><text x="25" y="126" font-size="21" fill="#20334a" text-anchor="start">单点增量</text><rect x="260" y="95" width="67" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="293" y="126" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="355" y="95" width="67" height="44" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="388" y="126" font-size="24" fill="#20334a" text-anchor="middle">+1</text><rect x="450" y="95" width="67" height="44" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="483" y="126" font-size="24" fill="#20334a" text-anchor="middle">-1</text><rect x="545" y="95" width="67" height="44" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="578" y="126" font-size="24" fill="#20334a" text-anchor="middle">+1</text><rect x="640" y="95" width="67" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="673" y="126" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="25" y="196" font-size="21" fill="#20334a" text-anchor="start">前缀累计</text><rect x="260" y="165" width="67" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="293" y="196" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="355" y="165" width="67" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="388" y="196" font-size="24" fill="#20334a" text-anchor="middle">+1</text><rect x="450" y="165" width="67" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="483" y="196" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="545" y="165" width="67" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="578" y="196" font-size="24" fill="#20334a" text-anchor="middle">+1</text><rect x="640" y="165" width="67" height="44" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="673" y="196" font-size="24" fill="#20334a" text-anchor="middle">+1</text><text x="25" y="282" font-size="23" fill="#20334a" text-anchor="start">构造：a=[3,3,3]，目标 b=[5,2,4]，S=[2,1,2]</text><text x="25" y="351" font-size="21" fill="#20334a" text-anchor="start">初始</text><rect x="310" y="321" width="75" height="42" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="347" y="350" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="420" y="321" width="75" height="42" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="457" y="350" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="530" y="321" width="75" height="42" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="567" y="350" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="25" y="412" font-size="21" fill="#20334a" text-anchor="start">[1,2] 两次</text><rect x="310" y="382" width="75" height="42" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="347" y="411" font-size="25" fill="#20334a" text-anchor="middle">5</text><rect x="420" y="382" width="75" height="42" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="457" y="411" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="530" y="382" width="75" height="42" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="567" y="411" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="25" y="473" font-size="21" fill="#20334a" text-anchor="start">[2,3] 一次</text><rect x="310" y="443" width="75" height="42" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="347" y="472" font-size="25" fill="#20334a" text-anchor="middle">5</text><rect x="420" y="443" width="75" height="42" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="457" y="472" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="530" y="443" width="75" height="42" rx="4" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="567" y="472" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="25" y="534" font-size="21" fill="#20334a" text-anchor="start">[3,3] 两次</text><rect x="310" y="504" width="75" height="42" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="347" y="533" font-size="25" fill="#20334a" text-anchor="middle">5</text><rect x="420" y="504" width="75" height="42" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="457" y="533" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="530" y="504" width="75" height="42" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="567" y="533" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="25" y="610" font-size="22" fill="#20334a" text-anchor="start">中间位净增：-2+1=-1；最后位净增：-1+2=1</text></g></svg>