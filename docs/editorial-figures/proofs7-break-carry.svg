<svg xmlns="http://www.w3.org/2000/svg" width="720" height="704" viewBox="0 0 720 704" role="img"><title>真实七天一一一零一一一与全工作比较，奖励轴显示位置六奖励在周期总和内但不在窗口内，重置后的两段三天各得十四分，进位式纯奖励差八扣三净胜五</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">进位例：n=6、d=3；位置2..6的奖励为5、9、1、3、2</text><text x="88" y="80" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="45" y="96" width="86" height="54" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="88" y="133" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="196" y="80" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="153" y="96" width="86" height="54" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="196" y="133" font-size="24" fill="#20334a" text-anchor="middle">5</text><text x="304" y="80" font-size="20" fill="#20334a" text-anchor="middle">3</text><rect x="261" y="96" width="86" height="54" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="304" y="133" font-size="24" fill="#20334a" text-anchor="middle">9</text><text x="412" y="80" font-size="20" fill="#20334a" text-anchor="middle">4</text><rect x="369" y="96" width="86" height="54" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="412" y="133" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="520" y="80" font-size="20" fill="#20334a" text-anchor="middle">5</text><rect x="477" y="96" width="86" height="54" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="520" y="133" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="628" y="80" font-size="20" fill="#20334a" text-anchor="middle">6</text><rect x="585" y="96" width="86" height="54" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="628" y="133" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="22" y="197" font-size="21" fill="#20334a" text-anchor="start">窗口[2,3]长2，和14；前缀[1,3]和14，整周期R=20</text><text x="22" y="241" font-size="22" fill="#20334a" text-anchor="start">s₁=s₂=3，ℓ=6−1−3=2；V_B=14+14−20=8</text><text x="22" y="319" font-size="20" fill="#20334a" text-anchor="start">a</text><rect x="124" y="285" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="158" y="319" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="205" y="285" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="239" y="319" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="286" y="285" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="320" y="319" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="367" y="285" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="401" y="319" font-size="22" fill="#20334a" text-anchor="middle">0</text><rect x="448" y="285" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="482" y="319" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="529" y="285" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="563" y="319" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="610" y="285" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="644" y="319" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="22" y="385" font-size="20" fill="#20334a" text-anchor="start">计数</text><rect x="124" y="351" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="158" y="385" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="205" y="351" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="239" y="385" font-size="22" fill="#20334a" text-anchor="middle">2</text><rect x="286" y="351" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="320" y="385" font-size="22" fill="#20334a" text-anchor="middle">3</text><rect x="367" y="351" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="401" y="385" font-size="22" fill="#20334a" text-anchor="middle">0</text><rect x="448" y="351" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="482" y="385" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="529" y="351" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="563" y="385" font-size="22" fill="#20334a" text-anchor="middle">2</text><rect x="610" y="351" width="69" height="49" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="644" y="385" font-size="22" fill="#20334a" text-anchor="middle">3</text><text x="22" y="451" font-size="20" fill="#20334a" text-anchor="start">I的计数</text><rect x="124" y="417" width="69" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="158" y="451" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="205" y="417" width="69" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="239" y="451" font-size="22" fill="#20334a" text-anchor="middle">2</text><rect x="286" y="417" width="69" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="320" y="451" font-size="22" fill="#20334a" text-anchor="middle">3</text><rect x="367" y="417" width="69" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="401" y="451" font-size="22" fill="#20334a" text-anchor="middle">4</text><rect x="448" y="417" width="69" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="482" y="451" font-size="22" fill="#20334a" text-anchor="middle">5</text><rect x="529" y="417" width="69" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="563" y="451" font-size="22" fill="#20334a" text-anchor="middle">6</text><rect x="610" y="417" width="69" height="49" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="644" y="451" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="22" y="535" font-size="20" fill="#20334a" text-anchor="start">a的奖励14+14=28；I的奖励是一周期20；基础分分别18和21</text><text x="22" y="581" font-size="22" fill="#20334a" text-anchor="start">f(a)=46，f(I)=41；净胜8−3=5，因此确有合法见证</text><text x="22" y="630" font-size="22" fill="#20334a" text-anchor="start">第6位置的奖励2不在[1,5]窗口里，却必须计入R</text><text x="22" y="678" font-size="20" fill="#20334a" text-anchor="start">每个合法窗口都可反推两段余数，窗口最优值并非无法执行的上界</text></g></svg>