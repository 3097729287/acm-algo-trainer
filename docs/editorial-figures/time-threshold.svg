<svg xmlns="http://www.w3.org/2000/svg" width="620" height="716" viewBox="0 0 620 716" role="img"><title>四点环随时差上限放开的允许子图：一不可行，二可行</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="38" font-size="23" fill="#20334a" text-anchor="start">四点环：塔在 1、3；起点 2，终点 4</text><text x="26" y="90" font-size="21" fill="#20334a" text-anchor="start">上限 D=1：仅允许两个孤立点，不能到达</text><line x1="300" y1="134" x2="164" y2="210" stroke="#a0aab7" stroke-width="4" stroke-dasharray="7 5"/><line x1="164" y1="210" x2="300" y2="286" stroke="#a0aab7" stroke-width="4" stroke-dasharray="7 5"/><line x1="300" y1="286" x2="436" y2="210" stroke="#a0aab7" stroke-width="4" stroke-dasharray="7 5"/><line x1="436" y1="210" x2="300" y2="134" stroke="#a0aab7" stroke-width="4" stroke-dasharray="7 5"/><circle cx="300" cy="134" r="26" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="300" y="142" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="340" y="141" font-size="19" fill="#20334a" text-anchor="start">塔 A，w=2</text><circle cx="164" cy="210" r="26" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="164" y="218" font-size="22" fill="#20334a" text-anchor="middle">2</text><text x="164" y="259" font-size="19" fill="#20334a" text-anchor="middle">s，w=0</text><circle cx="300" cy="286" r="26" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="300" y="294" font-size="22" fill="#20334a" text-anchor="middle">3</text><text x="340" y="293" font-size="19" fill="#20334a" text-anchor="start">塔 B，w=2</text><circle cx="436" cy="210" r="26" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="436" y="218" font-size="22" fill="#20334a" text-anchor="middle">4</text><text x="436" y="259" font-size="19" fill="#20334a" text-anchor="middle">t，w=0</text><text x="26" y="376" font-size="21" fill="#20334a" text-anchor="start">上限 D=2：允许经过塔点，出现完整路径</text><line x1="300" y1="420" x2="164" y2="496" stroke="#087b48" stroke-width="4"/><line x1="164" y1="496" x2="300" y2="572" stroke="#a0aab7" stroke-width="4"/><line x1="300" y1="572" x2="436" y2="496" stroke="#a0aab7" stroke-width="4"/><line x1="436" y1="496" x2="300" y2="420" stroke="#087b48" stroke-width="4"/><circle cx="300" cy="420" r="26" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="300" y="428" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="340" y="427" font-size="19" fill="#20334a" text-anchor="start">塔 A，w=2</text><circle cx="164" cy="496" r="26" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="164" y="504" font-size="22" fill="#20334a" text-anchor="middle">2</text><text x="164" y="545" font-size="19" fill="#20334a" text-anchor="middle">s，w=0</text><circle cx="300" cy="572" r="26" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="300" y="580" font-size="22" fill="#20334a" text-anchor="middle">3</text><text x="340" y="579" font-size="19" fill="#20334a" text-anchor="start">塔 B，w=2</text><circle cx="436" cy="496" r="26" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="436" y="504" font-size="22" fill="#20334a" text-anchor="middle">4</text><text x="436" y="545" font-size="19" fill="#20334a" text-anchor="middle">t，w=0</text><text x="26" y="653" font-size="18" fill="#20334a" text-anchor="start">绿色点：允许；灰色点：超限；下图绿边：路径 2→1→4</text><text x="26" y="688" font-size="21" fill="#20334a" text-anchor="start">端点时差都是 0，途中最大时差仍为 2。</text></g></svg>