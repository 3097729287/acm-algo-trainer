<svg xmlns="http://www.w3.org/2000/svg" width="640" height="686" viewBox="0 0 640 686" role="img"><title>真实装箱与不同容量状态的旧新读写</title><rect width="640" height="686" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16867b"/></marker></defs><text x="24" y="34" class="title" text-anchor="start">真实箱子容量10：不是给旧最佳直接加C</text><text x="24" y="72" class="small" text-anchor="start">A体积6 / B体积3 / C体积2；空白表示没占用</text><text x="24" y="115" class="" text-anchor="start">不取C：A+B=9，剩1</text><rect x="40" y="132" width="330" height="40" rx="0" fill="#b8e2d3" stroke="#7394aa"/><text x="205.0" y="159" class="" text-anchor="middle">A：6</text><rect x="370" y="132" width="165" height="40" rx="0" fill="#d9edf8" stroke="#7394aa"/><text x="452.5" y="159" class="" text-anchor="middle">B：3</text><rect x="535" y="132" width="55" height="40" rx="0" fill="#edf0f4" stroke="#7394aa"/><text x="562.5" y="159" class="" text-anchor="middle">空</text><text x="24" y="221" class="" text-anchor="start">取C：先只挑A，再加C得8，剩2</text><rect x="40" y="238" width="330" height="40" rx="0" fill="#b8e2d3" stroke="#7394aa"/><text x="205.0" y="265" class="" text-anchor="middle">A：6</text><rect x="370" y="238" width="110" height="40" rx="0" fill="#fff0b7" stroke="#7394aa"/><text x="425.0" y="265" class="" text-anchor="middle">C：2</text><rect x="480" y="238" width="110" height="40" rx="0" fill="#edf0f4" stroke="#7394aa"/><text x="535.0" y="265" class="" text-anchor="middle">空：2</text><text x="24" y="329" class="" text-anchor="start">旧轮只允许A/B；每个容量是独立问题</text><rect x="45" y="360" width="150" height="42" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="120.0" y="388.0" class="" text-anchor="middle">旧c6=6</text><rect x="245" y="360" width="150" height="42" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="320.0" y="388.0" class="" text-anchor="middle">旧c8=6</text><rect x="445" y="360" width="150" height="42" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="520.0" y="388.0" class="" text-anchor="middle">旧c10=9</text><line x1="120" y1="405" x2="150" y2="470" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="320" y1="405" x2="435" y2="470" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="320" y1="405" x2="230" y2="470" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="520" y1="405" x2="535" y2="470" stroke="#16867b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="39" y="441" class="small" text-anchor="start">+ C2</text><text x="342" y="441" class="small" text-anchor="start">+ C2</text><rect x="35" y="476" width="252" height="76" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="161" y="503" class="small" text-anchor="middle">新c8=max(6,6+2)</text><text x="161" y="535" class="small" text-anchor="middle">=8，能装A+C</text><rect x="330" y="476" width="278" height="76" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="469" y="503" class="small" text-anchor="middle">新c10=max(9,6+2)</text><text x="469" y="535" class="small" text-anchor="middle">=9，仍选A+B</text><text x="24" y="603" class="" text-anchor="start">倒序：写c10时旧c8还没变；写c8时旧c6还没变</text><text x="24" y="647" class="" text-anchor="start">最终输出剩余10−9=1，不是已装体积9</text></svg>