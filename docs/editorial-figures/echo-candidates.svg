<svg xmlns="http://www.w3.org/2000/svg" width="620" height="526" viewBox="0 0 620 526" role="img"><title>两个反查命中的比较：值相符的合法候选与值不符的错误候选</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="40" font-size="23" fill="#20334a" text-anchor="start">固定 r=4：查表命中，还要检查真实值</text><text x="26" y="78" font-size="21" fill="#20334a" text-anchor="start">a = [1,2,2,1]；S₃=5，a₄=1</text><rect x="26" y="110" width="568" height="140" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="44" y="145" font-size="21" fill="#20334a" text-anchor="start">猜 v=2 → wanted=3 → l=2</text><text x="44" y="186" font-size="21" fill="#20334a" text-anchor="start">[2,4]：左端实际值 a₂=2，猜对</text><text x="44" y="225" font-size="20" fill="#087b48" text-anchor="start">首尾 2×1=2；内部 a₃=2 → 加一</text><rect x="26" y="274" width="568" height="140" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="44" y="309" font-size="21" fill="#20334a" text-anchor="start">猜 v=4 → wanted=1 → l=1</text><text x="44" y="350" font-size="21" fill="#20334a" text-anchor="start">[1,4]：左端实际值 a₁=1，猜错</text><text x="44" y="389" font-size="20" fill="#a32e36" text-anchor="start">首尾 1×1=1；内部 2+2=4 → 舍去</text><text x="26" y="458" font-size="21" fill="#20334a" text-anchor="start">命中只说明“用猜的 v 解方程能成立”。</text><text x="26" y="495" font-size="21" fill="#20334a" text-anchor="start">a[l] == v 才说明它对应真实数组。</text></g></svg>