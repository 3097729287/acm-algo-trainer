<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img"><title>合法八字符串查询前七位时，迭代线段树依次取得B、AA、ABAB，右累加器前插后才恢复真实顺序，错误后接会使答案翻转</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">S=ABABAABA，询问[1,7]；size=8，实际查询[0,7)</text><text x="62" y="79" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="26" y="93" width="72" height="57" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="62" y="132" font-size="27" fill="#20334a" text-anchor="middle">A</text><text x="147" y="79" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="111" y="93" width="72" height="57" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="147" y="132" font-size="27" fill="#20334a" text-anchor="middle">B</text><text x="232" y="79" font-size="20" fill="#20334a" text-anchor="middle">3</text><rect x="196" y="93" width="72" height="57" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="232" y="132" font-size="27" fill="#20334a" text-anchor="middle">A</text><text x="317" y="79" font-size="20" fill="#20334a" text-anchor="middle">4</text><rect x="281" y="93" width="72" height="57" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="317" y="132" font-size="27" fill="#20334a" text-anchor="middle">B</text><text x="402" y="79" font-size="20" fill="#20334a" text-anchor="middle">5</text><rect x="366" y="93" width="72" height="57" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="402" y="132" font-size="27" fill="#20334a" text-anchor="middle">A</text><text x="487" y="79" font-size="20" fill="#20334a" text-anchor="middle">6</text><rect x="451" y="93" width="72" height="57" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="487" y="132" font-size="27" fill="#20334a" text-anchor="middle">A</text><text x="572" y="79" font-size="20" fill="#20334a" text-anchor="middle">7</text><rect x="536" y="93" width="72" height="57" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="572" y="132" font-size="27" fill="#20334a" text-anchor="middle">B</text><text x="657" y="79" font-size="20" fill="#20334a" text-anchor="middle">8</text><rect x="621" y="93" width="72" height="57" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="657" y="132" font-size="27" fill="#20334a" text-anchor="middle">A</text><text x="22" y="196" font-size="23" fill="#20334a" text-anchor="start">查询从右侧先取出最靠右的小块，必须依次前插</text><rect x="22" y="221" width="676" height="105" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="40" y="254" font-size="22" fill="#20334a" text-anchor="start">节点14：位置7，B</text><text x="40" y="297" font-size="24" fill="#20334a" text-anchor="start">B</text><text x="680" y="297" font-size="21" fill="#20334a" text-anchor="end">(sum,mn)=(−1,−1)</text><rect x="22" y="343" width="676" height="105" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="40" y="376" font-size="22" fill="#20334a" text-anchor="start">节点6：位置5..6，AA</text><text x="40" y="419" font-size="24" fill="#20334a" text-anchor="start">AA+B=AAB</text><text x="680" y="419" font-size="21" fill="#20334a" text-anchor="end">(sum,mn)=(1,1)</text><rect x="22" y="465" width="676" height="105" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="40" y="498" font-size="22" fill="#20334a" text-anchor="start">节点2：位置1..4，ABAB</text><text x="40" y="541" font-size="24" fill="#20334a" text-anchor="start">ABAB+AAB=ABABAAB</text><text x="680" y="541" font-size="21" fill="#20334a" text-anchor="end">(sum,mn)=(1,0)</text><text x="22" y="630" font-size="22" fill="#20334a" text-anchor="start">最终mn=0，因此Yes；总和1允许留下一个未配对A</text><text x="22" y="674" font-size="22" fill="#a32e36" text-anchor="start">若按取出顺序后接，将得到BAAABAB，首项就为−1</text></g></svg>