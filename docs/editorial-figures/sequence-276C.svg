<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 365" role="img" aria-labelledby="title"><title id="title">Little Girl and Maximum Sum · 谁值得放在热门位置：教学小例</title><rect width="920" height="365" rx="12" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#253340"><text x="24" y="35" font-size="22" fill="#253340">276C · 教学小例</text><text x="24" y="102" font-size="15" fill="#253340">固定的位置覆盖次数</text><rect x="244" y="74" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="261" y="104" font-size="19" fill="#253340">1</text><text x="266" y="140" font-size="12" fill="#657586">1</text><rect x="320" y="74" width="68" height="49" rx="6" fill="#e2f3ed" stroke="#257c67"/><text x="337" y="104" font-size="19" fill="#253340">2</text><text x="342" y="140" font-size="12" fill="#657586">2</text><rect x="396" y="74" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="413" y="104" font-size="19" fill="#253340">1</text><text x="418" y="140" font-size="12" fill="#657586">3</text><text x="24" y="207" font-size="15" fill="#253340">把大数放高次数位置</text><rect x="244" y="179" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="261" y="209" font-size="19" fill="#253340">1</text><text x="266" y="245" font-size="12" fill="#657586">1</text><rect x="320" y="179" width="68" height="49" rx="6" fill="#e2f3ed" stroke="#257c67"/><text x="337" y="209" font-size="19" fill="#253340">5</text><text x="342" y="245" font-size="12" fill="#657586">2</text><rect x="396" y="179" width="68" height="49" rx="6" fill="#f1f4f7" stroke="#a6b4c0"/><text x="413" y="209" font-size="19" fill="#253340">3</text><text x="418" y="245" font-size="12" fill="#657586">3</text><text x="24" y="305" font-size="17" fill="#253340">两问 [1,2]、[2,3]：1+5 + 5+3 = 14。位置 2 的数贡献两次。</text></g></svg>