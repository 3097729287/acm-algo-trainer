<svg xmlns="http://www.w3.org/2000/svg" width="720" height="775" viewBox="0 0 720 775" role="img"><title>x等于一的真实长除法轨迹，每步展开十乘旧余数等于七乘本位商加新余数并累积字符串</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="36" font-size="24" fill="#20334a" text-anchor="start">x=1：每一位都从当前余数生成</text><rect x="20" y="66" width="680" height="91" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="37" y="97" font-size="24" fill="#20334a" text-anchor="start">第1位：10×1 = 10 = 7×1 + 3</text><text x="37" y="132" font-size="23" fill="#20334a" text-anchor="start">本位写入1；新余数3；t = &quot;1&quot;</text><path d="M360 158v12m-5-5 5 5 5-5" fill="none" stroke="#475569" stroke-width="2"/><rect x="20" y="174" width="680" height="91" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="37" y="205" font-size="24" fill="#20334a" text-anchor="start">第2位：10×3 = 30 = 7×4 + 2</text><text x="37" y="240" font-size="23" fill="#20334a" text-anchor="start">本位写入4；新余数2；t = &quot;14&quot;</text><path d="M360 266v12m-5-5 5 5 5-5" fill="none" stroke="#475569" stroke-width="2"/><rect x="20" y="282" width="680" height="91" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="37" y="313" font-size="24" fill="#20334a" text-anchor="start">第3位：10×2 = 20 = 7×2 + 6</text><text x="37" y="348" font-size="23" fill="#20334a" text-anchor="start">本位写入2；新余数6；t = &quot;142&quot;</text><path d="M360 374v12m-5-5 5 5 5-5" fill="none" stroke="#475569" stroke-width="2"/><rect x="20" y="390" width="680" height="91" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="37" y="421" font-size="24" fill="#20334a" text-anchor="start">第4位：10×6 = 60 = 7×8 + 4</text><text x="37" y="456" font-size="23" fill="#20334a" text-anchor="start">本位写入8；新余数4；t = &quot;1428&quot;</text><path d="M360 482v12m-5-5 5 5 5-5" fill="none" stroke="#475569" stroke-width="2"/><rect x="20" y="498" width="680" height="91" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="37" y="529" font-size="24" fill="#20334a" text-anchor="start">第5位：10×4 = 40 = 7×5 + 5</text><text x="37" y="564" font-size="23" fill="#20334a" text-anchor="start">本位写入5；新余数5；t = &quot;14285&quot;</text><path d="M360 590v12m-5-5 5 5 5-5" fill="none" stroke="#475569" stroke-width="2"/><rect x="20" y="606" width="680" height="91" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="37" y="637" font-size="24" fill="#20334a" text-anchor="start">第6位：10×5 = 50 = 7×7 + 1</text><text x="37" y="672" font-size="23" fill="#20334a" text-anchor="start">本位写入7；新余数1；t = &quot;142857&quot;</text><text x="22" y="747" font-size="22" fill="#20334a" text-anchor="start">余数回到1，下一位又从第一步开始。</text></g></svg>