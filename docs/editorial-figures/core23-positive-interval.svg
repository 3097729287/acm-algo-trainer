<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img"><title>同一数轴负二到六，闭区间一到四绿色并含两个实心端点，选中四个正整数，零和五为灰色未选</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="36" font-size="23" fill="#20334a" text-anchor="start">x=4：闭区间[1,4]选中四个正整数</text><path d="M45 185H650" fill="none" stroke="#64748b" stroke-width="2"/><path d="M272 185H476" stroke="#86efac" stroke-width="14"/><path d="M68 176V194" stroke="#64748b"/><text x="68" y="224" font-size="19" fill="#20334a" text-anchor="middle">-2</text><circle cx="68" cy="185" r="4" fill="#94a3b8"/><path d="M136 176V194" stroke="#64748b"/><text x="136" y="224" font-size="19" fill="#20334a" text-anchor="middle">-1</text><circle cx="136" cy="185" r="4" fill="#94a3b8"/><path d="M204 176V194" stroke="#64748b"/><text x="204" y="224" font-size="19" fill="#20334a" text-anchor="middle">0</text><circle cx="204" cy="185" r="4" fill="#94a3b8"/><path d="M272 176V194" stroke="#64748b"/><text x="272" y="224" font-size="19" fill="#20334a" text-anchor="middle">1</text><circle cx="272" cy="185" r="8" fill="#0f766e"/><path d="M340 176V194" stroke="#64748b"/><text x="340" y="224" font-size="19" fill="#20334a" text-anchor="middle">2</text><circle cx="340" cy="185" r="8" fill="#0f766e"/><path d="M408 176V194" stroke="#64748b"/><text x="408" y="224" font-size="19" fill="#20334a" text-anchor="middle">3</text><circle cx="408" cy="185" r="8" fill="#0f766e"/><path d="M476 176V194" stroke="#64748b"/><text x="476" y="224" font-size="19" fill="#20334a" text-anchor="middle">4</text><circle cx="476" cy="185" r="8" fill="#0f766e"/><path d="M544 176V194" stroke="#64748b"/><text x="544" y="224" font-size="19" fill="#20334a" text-anchor="middle">5</text><circle cx="544" cy="185" r="4" fill="#94a3b8"/><path d="M612 176V194" stroke="#64748b"/><text x="612" y="224" font-size="19" fill="#20334a" text-anchor="middle">6</text><circle cx="612" cy="185" r="4" fill="#94a3b8"/><path d="M272 153V137H476V153" fill="none" stroke="#0f766e" stroke-width="3"/><text x="374.0" y="114" font-size="21" fill="#0f766e" text-anchor="middle">两个实心端点也都计入</text><text x="272" y="268" font-size="22" fill="#0f766e" text-anchor="middle">l=1</text><text x="476" y="268" font-size="22" fill="#0f766e" text-anchor="middle">r=4</text><text x="28" y="319" font-size="22" fill="#20334a" text-anchor="start">选中的整数：1、2、3、4，恰好四个。</text><text x="28" y="364" font-size="21" fill="#20334a" text-anchor="start">三个单位间隔 + 左端点一个整数 = 四个整数。</text><text x="28" y="409" font-size="20" fill="#20334a" text-anchor="start">0与5都在区间外；0本身也不是正整数。</text><text x="28" y="454" font-size="20" fill="#20334a" text-anchor="start">一般输出[1,x]，无需逐个输出区间中的整数。</text></g></svg>