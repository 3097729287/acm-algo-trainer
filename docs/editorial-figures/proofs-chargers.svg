<svg xmlns="http://www.w3.org/2000/svg" width="720" height="625" viewBox="0 0 720 625" role="img"><title>两块电池实际电量随时间增长并封顶，较大固定键始终提供最大电量，封顶后允许并列</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="25" y="37" font-size="21" fill="#20334a" text-anchor="start">V=10；A 在 t=1 以 w=4 插入，B 在 t=3 以 w=4 插入</text><text x="25" y="73" font-size="22" fill="#20334a" text-anchor="start">均未取出：A 键3，B 键1；横轴时间 t，纵轴电量</text><path d="M75,405 L660,405" fill="none" stroke="#667488" stroke-width="3"/><polygon points="660,405 650.0,410.0 650.0,400.0" fill="#667488"/><path d="M75,405 L75,112" fill="none" stroke="#667488" stroke-width="3"/><polygon points="75,112 80.0,122.0 70.0,122.0" fill="#667488"/><text x="130" y="436" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="240" y="436" font-size="20" fill="#20334a" text-anchor="middle">3</text><text x="295" y="436" font-size="20" fill="#20334a" text-anchor="middle">4</text><text x="460" y="436" font-size="20" fill="#20334a" text-anchor="middle">7</text><text x="515" y="436" font-size="20" fill="#20334a" text-anchor="middle">8</text><text x="570" y="436" font-size="20" fill="#20334a" text-anchor="middle">9</text><text x="625" y="436" font-size="20" fill="#20334a" text-anchor="middle">10</text><text x="59" y="412" font-size="19" fill="#20334a" text-anchor="end">0</text><text x="59" y="308" font-size="19" fill="#20334a" text-anchor="end">4</text><text x="59" y="230" font-size="19" fill="#20334a" text-anchor="end">7</text><text x="59" y="178" font-size="19" fill="#20334a" text-anchor="end">9</text><text x="59" y="152" font-size="19" fill="#20334a" text-anchor="end">10</text><path d="M130,301 L460,145 L625,145" stroke="#2d6db4" fill="none" stroke-width="5"/><path d="M240,301 L570,145 L625,145" stroke="#087b48" fill="none" stroke-width="3" stroke-dasharray="8 5"/><text x="480" y="118" font-size="21" fill="#20334a" text-anchor="start">容量上限 10</text><text x="100" y="123" font-size="21" fill="#2d6db4" text-anchor="start">实线 A：min(10,t+3)</text><text x="320" y="343" font-size="21" fill="#087b48" text-anchor="start">虚线 B：min(10,t+1)</text><rect x="22" y="465" width="676" height="139" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="40" y="503" font-size="23" fill="#20334a" text-anchor="start">t=4：A=7，B=5；t=8：A=10，B=9</text><text x="40" y="545" font-size="22" fill="#20334a" text-anchor="start">t=9：A=B=10；取键较大的 A 仍符合“最高”</text><text x="40" y="583" font-size="22" fill="#06613b" text-anchor="start">剩下的 B 已满电，以后也一直是 10</text></g></svg>