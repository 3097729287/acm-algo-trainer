<svg xmlns="http://www.w3.org/2000/svg" width="640" height="439" viewBox="0 0 640 439" role="img"><title>K Spanning Tree：原图、零块与真实选中生成树</title><rect width="640" height="439" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">K=2：辅助零边合并，不等于实际选边</text><text x="24" y="70" class="" text-anchor="start">官方首例：左边是原图，右边是选边号 4、5、1 的树</text><text x="135" y="102" class="" text-anchor="middle">边标记：编号:权重</text><line x1="35" y1="194" x2="142" y2="123" stroke="#8c9aa6" stroke-width="4" stroke-dasharray="5,4"/><text x="88.5" y="149.5" class="small" text-anchor="middle">1:0</text><line x1="35" y1="194" x2="142" y2="267" stroke="#8c9aa6" stroke-width="4" stroke-dasharray="5,4"/><text x="88.5" y="221.5" class="small" text-anchor="middle">2:0</text><line x1="142" y1="123" x2="142" y2="267" stroke="#8c9aa6" stroke-width="4" stroke-dasharray="5,4"/><text x="112.0" y="196.0" class="small" text-anchor="middle">3:0</text><line x1="250" y1="194" x2="142" y2="123" stroke="#168377" stroke-width="4" stroke-dasharray=""/><text x="196.0" y="149.5" class="small" text-anchor="middle">4:1</text><line x1="250" y1="194" x2="142" y2="267" stroke="#168377" stroke-width="4" stroke-dasharray=""/><text x="196.0" y="221.5" class="small" text-anchor="middle">5:1</text><circle cx="35" cy="194" r="18" fill="#d8edf9" stroke="#7394aa"/><text x="35" y="201" class="" text-anchor="middle">1</text><circle cx="142" cy="123" r="18" fill="#d8edf9" stroke="#7394aa"/><text x="142" y="130" class="" text-anchor="middle">2</text><circle cx="142" cy="267" r="18" fill="#d8edf9" stroke="#7394aa"/><text x="142" y="274" class="" text-anchor="middle">3</text><circle cx="250" cy="194" r="18" fill="#d8edf9" stroke="#7394aa"/><text x="250" y="201" class="" text-anchor="middle">4</text><text x="461" y="102" class="" text-anchor="middle">实际树：两条一边，一条零边</text><line x1="576" y1="194" x2="468" y2="123" stroke="#168377" stroke-width="4" stroke-dasharray=""/><text x="522.0" y="149.5" class="small" text-anchor="middle">4:1</text><line x1="576" y1="194" x2="468" y2="267" stroke="#168377" stroke-width="4" stroke-dasharray=""/><text x="522.0" y="221.5" class="small" text-anchor="middle">5:1</text><line x1="361" y1="194" x2="468" y2="123" stroke="#8c9aa6" stroke-width="4" stroke-dasharray="5,4"/><text x="414.5" y="149.5" class="small" text-anchor="middle">1:0</text><circle cx="361" cy="194" r="18" fill="#d8edf9" stroke="#7394aa"/><text x="361" y="201" class="" text-anchor="middle">1</text><circle cx="468" cy="123" r="18" fill="#d8edf9" stroke="#7394aa"/><text x="468" y="130" class="" text-anchor="middle">2</text><circle cx="468" cy="267" r="18" fill="#d8edf9" stroke="#7394aa"/><text x="468" y="274" class="" text-anchor="middle">3</text><circle cx="576" cy="194" r="18" fill="#d8edf9" stroke="#7394aa"/><text x="576" y="201" class="" text-anchor="middle">4</text><text x="24" y="328" class="" text-anchor="start">dA 初始零块：{1,2,3} | {4}；先选一边4，连通零块</text><text x="24" y="369" class="" text-anchor="start">此时 dB 真实分量：{1} | {2,4} | {3}，还能选一边5</text><text x="24" y="410" class="" text-anchor="start">选够K=2后，加零边1，得到 N−1=3 条真实无环边</text></svg>