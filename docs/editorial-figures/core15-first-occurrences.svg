chor="middle">·</text><rect x="203" y="271" width="51" height="43" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="228" y="300" font-size="24" fill="#20334a" text-anchor="middle">·</text><rect x="275" y="271" width="51" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="300" y="300" font-size="24" fill="#20334a" text-anchor="middle">b</text><rect x="347" y="271" width="51" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="372" y="300" font-size="24" fill="#20334a" text-anchor="middle">c</text><rect x="419" y="271" width="51" height="43" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="444" y="300" font-size="24" fill="#20334a" text-anchor="middle">·</text><rect x="491" y="271" width="51" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="516" y="300" font-size="24" fill="#20334a" text-anchor="middle">a</text><rect x="563" y="271" width="51" height="43" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="588" y="300" font-size="24" fill="#20334a" text-anchor="middle">·</text><text x="155" y="341" font-size="20" fill="#20334a" text-anchor="start">按原位置先后读出：bca</text><text x="24" y="413" font-size="21" fill="#20334a" text-anchor="start">比较abc / bca：a≠b，b≠c，c≠a，答案3。</text><text x="24" y="460" font-size="20" fill="#20334a" text-anchor="start">比较a / abc：首位相同，后两位只有长串有，答案2。</text><text x="24" y="507" font-size="20" fill="#20334a" text-anchor="start">每种字符只留子串内第一份，仍保留这些原位置的顺序。</text></g></svg>