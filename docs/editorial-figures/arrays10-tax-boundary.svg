<svg xmlns="http://www.w3.org/2000/svg" width="870" height="458" viewBox="0 0 870 458" role="img"><title>真实b位置、门槛与变换候选的对应</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="36" font-size="25" fill="#20334a" text-anchor="start">前一值 v=3，当前 a=7：需要 b ≥ 10</text><text x="210" y="88" font-size="20" fill="#20334a" text-anchor="middle">下标 0</text><rect x="160" y="110" width="100" height="58" rx="4" fill="#f0f3f7" stroke="#6d86a6" stroke-width="2"/><text x="210" y="150" font-size="28" fill="#20334a" text-anchor="middle">5</text><path d="M210,183 L210,232" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="210" y="272" font-size="24" fill="#20334a" text-anchor="middle">5-7=-2</text><text x="210" y="317" font-size="19" fill="#20334a" text-anchor="middle">小于三，不可用</text><text x="415" y="88" font-size="20" fill="#20334a" text-anchor="middle">下标 1</text><rect x="365" y="110" width="100" height="58" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="415" y="150" font-size="28" fill="#20334a" text-anchor="middle">10</text><path d="M415,183 L415,232" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="415" y="272" font-size="24" fill="#20334a" text-anchor="middle">10-7=3</text><text x="415" y="317" font-size="19" fill="#20334a" text-anchor="middle">等于三，最小可用</text><text x="620" y="88" font-size="20" fill="#20334a" text-anchor="middle">下标 2</text><rect x="570" y="110" width="100" height="58" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="620" y="150" font-size="28" fill="#20334a" text-anchor="middle">13</text><path d="M620,183 L620,232" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="620" y="272" font-size="24" fill="#20334a" text-anchor="middle">13-7=6</text><text x="620" y="317" font-size="19" fill="#20334a" text-anchor="middle">大于三，可用但更大</text><path d="M335,97 L335,175" stroke="#328350" stroke-width="3" fill="none"/><text x="344" y="103" font-size="18" fill="#328350" text-anchor="start">门槛十</text><text x="25" y="376" font-size="21" fill="#20334a" text-anchor="start">lower_bound → 下标1的10；变换结果3，与保持原值7取小</text><text x="25" y="423" font-size="21" fill="#20334a" text-anchor="start">门槛十四 → end()，取消变换候选；原值仍独立判断</text></g></svg>