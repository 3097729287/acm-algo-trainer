<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img"><title>共同评分数轴从零到三千一百，七个段位左闭右开；初始一千不计，赛后一千一百蓝加一，再六百九十九灰加一</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="36" font-size="24" fill="#20334a" text-anchor="start">每场先更新，再记录一个段位</text><rect x="45.0" y="95" width="140.0" height="46" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="115.0" y="124" font-size="21" fill="#20334a" text-anchor="middle">灰</text><rect x="185.0" y="95" width="80.0" height="46" rx="8" fill="#e9d5ff" stroke="#2d6db4" stroke-width="2"/><text x="225.0" y="124" font-size="21" fill="#20334a" text-anchor="middle">紫</text><rect x="265.0" y="95" width="80.0" height="46" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="305.0" y="124" font-size="21" fill="#20334a" text-anchor="middle">蓝</text><rect x="345.0" y="95" width="100.0" height="46" rx="8" fill="#a5f3fc" stroke="#2d6db4" stroke-width="2"/><text x="395.0" y="124" font-size="21" fill="#20334a" text-anchor="middle">青</text><rect x="445.0" y="95" width="80.0" height="46" rx="8" fill="#fef08a" stroke="#2d6db4" stroke-width="2"/><text x="485.0" y="124" font-size="21" fill="#20334a" text-anchor="middle">黄</text><rect x="525.0" y="95" width="80.0" height="46" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><text x="565.0" y="124" font-size="21" fill="#20334a" text-anchor="middle">橙</text><rect x="605.0" y="95" width="60.0" height="46" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="635.0" y="124" font-size="21" fill="#20334a" text-anchor="middle">红</text><text x="676" y="124" font-size="22" fill="#20334a" text-anchor="start">→</text><path d="M45.0 145v285" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="45.0" y="173" font-size="17" fill="#20334a" text-anchor="middle">0</text><path d="M185.0 145v285" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="185.0" y="173" font-size="17" fill="#20334a" text-anchor="middle">700</text><path d="M265.0 145v285" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="265.0" y="173" font-size="17" fill="#20334a" text-anchor="middle">1100</text><path d="M345.0 145v285" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="345.0" y="173" font-size="17" fill="#20334a" text-anchor="middle">1500</text><path d="M445.0 145v285" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="445.0" y="173" font-size="17" fill="#20334a" text-anchor="middle">2000</text><path d="M525.0 145v285" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="525.0" y="173" font-size="17" fill="#20334a" text-anchor="middle">2400</text><path d="M605.0 145v285" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="605.0" y="173" font-size="17" fill="#20334a" text-anchor="middle">2800</text><path d="M45 234H665" stroke="#94a3b8"/><path d="M45 319H665" stroke="#94a3b8"/><path d="M45 404H665" stroke="#94a3b8"/><circle cx="245.0" cy="234" r="7" fill="#7e22ce"/><text x="260.0" y="215" font-size="22" fill="#7e22ce" text-anchor="start">初始1000：不计数</text><circle cx="265.0" cy="319" r="7" fill="#1d4ed8"/><text x="280.0" y="300" font-size="22" fill="#1d4ed8" text-anchor="start">+100 → 1100：蓝名+1</text><circle cx="184.8" cy="404" r="7" fill="#334155"/><text x="199.8" y="385" font-size="22" fill="#334155" text-anchor="start">−401 → 699：灰名+1</text><text x="22" y="472" font-size="22" fill="#20334a" text-anchor="start">699&lt;700；1100已达到紫名的右边界，归蓝名。</text><text x="22" y="518" font-size="21" fill="#20334a" text-anchor="start">两场记录：灰1、紫0、蓝1、青0、黄0、橙0、红0。</text><text x="22" y="560" font-size="21" fill="#20334a" text-anchor="start">色块为左含右不含；红名从2800起没有上界。</text></g></svg>