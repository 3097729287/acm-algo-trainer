<svg xmlns="http://www.w3.org/2000/svg" width="640" height="503" viewBox="0 0 640 503" role="img"><title>K-Divisible Swaps：固定段、空隙编号与交错/多重集计数</title><rect width="640" height="503" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">类键序列不变：两个类一段不能合并</text><text x="24" y="70" class="" text-anchor="start">K=5；位置从0编号；不同底色表示固定的连续段</text><text x="112" y="113" class="" text-anchor="middle">0</text><rect x="87" y="130" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="112" y="164" class="" text-anchor="middle">1</text><text x="112" y="218" class="" text-anchor="middle">1</text><text x="171" y="113" class="" text-anchor="middle">1</text><rect x="146" y="130" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="171" y="164" class="" text-anchor="middle">4</text><text x="171" y="218" class="" text-anchor="middle">1</text><text x="230" y="113" class="" text-anchor="middle">2</text><rect x="205" y="130" width="51" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="230" y="164" class="" text-anchor="middle">6</text><text x="230" y="218" class="" text-anchor="middle">1</text><text x="289" y="113" class="" text-anchor="middle">3</text><rect x="264" y="130" width="51" height="51" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="289" y="164" class="" text-anchor="middle">2</text><text x="289" y="218" class="" text-anchor="middle">2</text><text x="348" y="113" class="" text-anchor="middle">4</text><rect x="323" y="130" width="51" height="51" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="348" y="164" class="" text-anchor="middle">9</text><text x="348" y="218" class="" text-anchor="middle">1</text><text x="407" y="113" class="" text-anchor="middle">5</text><rect x="382" y="130" width="51" height="51" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="407" y="164" class="" text-anchor="middle">11</text><text x="407" y="218" class="" text-anchor="middle">1</text><text x="466" y="113" class="" text-anchor="middle">6</text><rect x="441" y="130" width="51" height="51" rx="5" fill="#e0d9f4" stroke="#7394aa"/><text x="466" y="164" class="" text-anchor="middle">5</text><text x="466" y="218" class="" text-anchor="middle">0</text><text x="525" y="113" class="" text-anchor="middle">7</text><rect x="500" y="130" width="51" height="51" rx="5" fill="#e0d9f4" stroke="#7394aa"/><text x="525" y="164" class="" text-anchor="middle">10</text><text x="525" y="218" class="" text-anchor="middle">0</text><text x="584" y="113" class="" text-anchor="middle">8</text><rect x="559" y="130" width="51" height="51" rx="5" fill="#e0d9f4" stroke="#7394aa"/><text x="584" y="164" class="" text-anchor="middle">5</text><text x="584" y="218" class="" text-anchor="middle">0</text><text x="24" y="164" class="small" text-anchor="start">值</text><text x="24" y="218" class="small" text-anchor="start">类键</text><text x="24" y="266" class="" text-anchor="start">类一位置：0,1,2,4,5；pⱼ−j：0,0,0,1,1</text><text x="24" y="305" class="" text-anchor="start">首段两列 [1,6] 与 [4]，内部顺序固定，交错有3种：</text><text x="48" y="346" class="" text-anchor="start">1,6,4     1,4,6     4,1,6</text><text x="24" y="389" class="" text-anchor="start">第二个类一段 [9,11]：2种；中间单点：1种</text><text x="24" y="430" class="" text-anchor="start">零类 [5,10,5]：3!/2!=3种，重复五不另算</text><text x="24" y="475" class="" text-anchor="start">独立段相乘：3 × 1 × 2 × 3 = 18</text></svg>