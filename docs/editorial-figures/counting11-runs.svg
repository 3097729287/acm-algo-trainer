" height="32" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="355.0" y="396.0" class="" text-anchor="middle">5</text><text x="430" y="397" class="" text-anchor="start">→ 000</text><text x="24" y="450" class="small" text-anchor="start">取</text><rect x="65" y="426" width="44" height="32" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="87.0" y="449.0" class="" text-anchor="middle">1</text><rect x="132" y="426" width="44" height="32" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="154.0" y="449.0" class="" text-anchor="middle">2</text><rect x="199" y="426" width="44" height="32" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="221.0" y="449.0" class="" text-anchor="middle">3</text><rect x="266" y="426" width="44" height="32" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="288.0" y="449.0" class="" text-anchor="middle">4</text><rect x="333" y="426" width="44" height="32" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="355.0" y="449.0" class="" text-anchor="middle">5</text><text x="430" y="450" class="" text-anchor="start">→ 001</text><text x="24" y="503" class="small" text-anchor="start">取</text><rect x="65" y="479" width="44" height="32" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="87.0" y="502.0" class="" text-anchor="middle">1</text><rect x="132" y="479" width="44" height="32" rx="5" fill="#edf0f4" stroke="#7394aa"/><text x="154.0" y="502.0" class="" text-anchor="middle">2</text><rect x="199" y="479" width="44" height="32" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="221.0" y="502.0" class="" text-anchor="middle">3</text><rect x="266" y="479" width="44" height="32" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="288.0" y="502.0" class="" text-anchor="middle">4</text><rect x="333" y="479" width="44" height="32" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="355.0" y="502.0" class="" text-anchor="middle">5</text><text x="430" y="503" class="" text-anchor="start">→ 0001</text><text x="24" y="558" class="" text-anchor="start">(1,3)相邻：跳过2，左右任取，共4种</text><text x="24" y="599" class="" text-anchor="start">初始 B=4+2+8+2=16，80−16=64</text><text x="24" y="637" class="" text-anchor="start">翻3：ΔB=+8−4−8+4=0，答案64</text><text x="24" y="675" class="" text-anchor="start">再翻4：ΔB=2(6−1)+8(1−0)=18</text><text x="24" y="713" class="" text-anchor="start">更新串01111，B=34，80−34=46</text></svg>