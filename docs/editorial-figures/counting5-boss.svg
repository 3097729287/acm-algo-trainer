r="20" fill="#b8e6d1" stroke="#168377"/><text x="160" y="255" class="small" text-anchor="middle">+4</text><text x="225" y="254" class="" text-anchor="middle">·</text><text x="290" y="254" class="" text-anchor="middle">·</text><circle cx="355" cy="248" r="20" fill="#b8e6d1" stroke="#168377"/><text x="355" y="255" class="small" text-anchor="middle">+4</text><text x="420" y="254" class="" text-anchor="middle">·</text><text x="485" y="254" class="" text-anchor="middle">·</text><circle cx="550" cy="248" r="20" fill="#b8e6d1" stroke="#168377"/><text x="550" y="255" class="small" text-anchor="middle">+4</text><text x="24" y="331" class="small" text-anchor="start">累计伤害</text><text x="160" y="331" class="" text-anchor="middle">7</text><text x="225" y="331" class="" text-anchor="middle">7</text><text x="290" y="331" class="" text-anchor="middle">10</text><text x="355" y="331" class="" text-anchor="middle">14</text><text x="420" y="331" class="" text-anchor="middle">17</text><text x="485" y="331" class="" text-anchor="middle">17</text><text x="550" y="331" class="" text-anchor="middle">24</text><rect x="330" y="91" width="50" height="261" rx="5" fill="none" stroke="#b16415"/><text x="24" y="384" class="" text-anchor="start">T=3：2次×3 + 1次×4 = 10，不足十一</text><text x="24" y="422" class="" text-anchor="start">T=4：2次×3 + 2次×4 = 14，首次足够</text><text x="24" y="461" class="" text-anchor="start">第1回合不是回合零；同回合不用排队选技能</text></svg>