" font-size="19" fill="#20334a" text-anchor="middle">选[5]：2</text><text x="24" y="422" font-size="22" fill="#20334a" text-anchor="start">第5位处理j=2，读的都是前4位的旧状态：</text><text x="24" y="468" font-size="22" fill="#20334a" text-anchor="start">延续：旧ending[2]=1，加2 → 3。</text><text x="24" y="512" font-size="22" fill="#20334a" text-anchor="start">新开：旧best[1]=7，加2 → 9，选择此候选。</text><text x="24" y="558" font-size="21" fill="#20334a" text-anchor="start">原和51；收益9；最终60。负收益−1被留在左段。</text><text x="24" y="603" font-size="20" fill="#20334a" text-anchor="start">第3位曾有两段收益8，但不能据此丢掉一段收益7。</text></g></svg>