0334a" text-anchor="middle">5</text><circle cx="345" cy="155" r="29" fill="#dbeafe" stroke="#20334a" stroke-width="2"/><text x="345" y="163" font-size="23" fill="#20334a" text-anchor="middle">3</text><circle cx="510" cy="155" r="29" fill="#fef3c7" stroke="#20334a" stroke-width="2"/><text x="510" y="163" font-size="23" fill="#20334a" text-anchor="middle">1</text><circle cx="645" cy="155" r="29" fill="#fef3c7" stroke="#20334a" stroke-width="2"/><text x="645" y="163" font-size="23" fill="#20334a" text-anchor="middle">2</text><text x="303" y="235" font-size="22" fill="#20334a" text-anchor="start">L₃=1+L₄+L₅=1+2+1=4</text><text x="22" y="290" font-size="21" fill="#20334a" text-anchor="start">每行是当年交换前库存；使用上一行统一决定所有发送者</text><text x="70" y="337" font-size="21" fill="#20334a" text-anchor="middle">年初</text><text x="210" y="337" font-size="21" fill="#20334a" text-anchor="middle">点1</text><text x="300" y="337" font-size="21" fill="#20334a" text-anchor="middle">点2</text><text x="390" y="337" font-size="21" fill="#20334a" text-anchor="middle">点3</text><text x="480" y="337" font-size="21" fill="#20334a" text-anchor="middle">点4</text><text x="570" y="337" font-size="21" fill="#20334a" text-anchor="middle">点5</text><text x="660" y="337" font-size="21" fill="#20334a" text-anchor="middle">点6</text><rect x="22" y="359" width="676" height="42" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="70" y="389" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="210" y="389" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="300" y="389" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="390" y="389" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="480" y="389" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="570" y="389" font-size="22" fill="#20334a" text-anchor="middle">1</text><text x="660" y="389" font-size="22" fill="#20334a" text-anchor="middle">1</text><rect x="22" y="408" width="676