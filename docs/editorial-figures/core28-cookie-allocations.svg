<svg xmlns="http://www.w3.org/2000/svg" width="720" height="885" viewBox="0 0 720 885" role="img"><title>四块身份固定饼干逐轮进入Alice与Bob的容器，A五十B零到A五十B九十到两侧九十到A一百九十B九十，最终差一百</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">四块原饼干：每一轮都保留之前的分配</text><text x="22" y="78" font-size="20" fill="#20334a" text-anchor="start">身份1/2/3/4，重量50/90/40/100；同重给A</text><text x="22" y="133" font-size="20" fill="#20334a" text-anchor="start">第1块分完；差50</text><rect x="56" y="152" width="285" height="66" rx="8" fill="#f8fafc" stroke="#2d6db4" stroke-width="2"/><text x="56" y="246" font-size="20" fill="#20334a" text-anchor="start">A总重50</text><rect x="65" y="162" width="58" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="94.0" y="191" font-size="17" fill="#20334a" text-anchor="middle">1:50</text><rect x="390" y="152" width="285" height="66" rx="8" fill="#f8fafc" stroke="#2d6db4" stroke-width="2"/><text x="390" y="246" font-size="20" fill="#20334a" text-anchor="start">B总重0</text><text x="532" y="194" font-size="18" fill="#20334a" text-anchor="middle">尚未拿饼干</text><text x="22" y="283" font-size="20" fill="#20334a" text-anchor="start">第2块分完；差40</text><rect x="56" y="302" width="285" height="66" rx="8" fill="#f8fafc" stroke="#2d6db4" stroke-width="2"/><text x="56" y="396" font-size="20" fill="#20334a" text-anchor="start">A总重50</text><rect x="65" y="312" width="58" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="94.0" y="341" font-size="17" fill="#20334a" text-anchor="middle">1:50</text><rect x="390" y="302" width="285" height="66" rx="8" fill="#f8fafc" stroke="#2d6db4" stroke-width="2"/><text x="390" y="396" font-size="20" fill="#20334a" text-anchor="start">B总重90</text><rect x="399" y="312" width="73.8" height="45" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="435.9" y="3