e="#2d6db4" stroke-width="2"/><text x="390" y="696" font-size="20" fill="#20334a" text-anchor="start">B总重90</text><rect x="399" y="612" width="73.8" height="45" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="435.9" y="641" font-size="17" fill="#20334a" text-anchor="middle">2:90</text><text x="22" y="798" font-size="20" fill="#20334a" text-anchor="start">每块整块出现一次，最终A拿1/3/4，B拿2：ABAA。</text><text x="22" y="845" font-size="20" fill="#20334a" text-anchor="start">190−90=100允许；不要求找到差距最小的分法。</text></g></svg>