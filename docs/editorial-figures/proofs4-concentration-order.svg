<svg xmlns="http://www.w3.org/2000/svg" width="720" height="537" viewBox="0 0 720 537" role="img"><title>期望状态的实际依赖，当前生命层只向更小的单张数或未知对数转移，更多单张的转移只读取上一层</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="35" font-size="24" fill="#20334a" text-anchor="start">计算 F(k,z,ℓ) 时，箭头指向已算好的依赖</text><rect x="240" y="86" width="243" height="65" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="362" y="128" font-size="23" fill="#20334a" text-anchor="middle">当前 (k,z,ℓ)</text><rect x="30" y="242" width="300" height="135" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="180" y="279" font-size="22" fill="#20334a" text-anchor="middle">同一生命层 ℓ</text><text x="180" y="319" font-size="23" fill="#20334a" text-anchor="middle">(k−1,z)：k更小</text><text x="180" y="357" font-size="22" fill="#20334a" text-anchor="middle">(k,z−1)：同k、z更小</text><rect x="381" y="242" width="309" height="135" rx="8" fill="#fef3c7" stroke="#b36b16" stroke-width="2"/><text x="535" y="279" font-size="22" fill="#20334a" text-anchor="middle">完整上一层 ℓ−1</text><text x="535" y="319" font-size="23" fill="#20334a" text-anchor="middle">(k,z−1)</text><text x="535" y="357" font-size="23" fill="#20334a" text-anchor="middle">(k+2,z−2)</text><path d="M280,151 L180,236" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="180,236 184.3811510771169,225.7138192102473 190.85763527807228,233.33321238784188" fill="#087b48"/><path d="M443,151 L535,236" fill="none" stroke="#b36b16" stroke-width="3"/><polygon points="535,236 524.2619690141776,232.88637019741952 531.0480852505709,225.54139732979377" fill="#b36b16"/><text x="22" y="423" font-size="22" fill="#20334a" text-anchor="start">k升序，内部z升序：左框两项均已计算；右框读取pre</text><text x="22" y="467" font-size="22" fill="#20334a" text-anchor="start">k+2并非当前层的前向依赖，而是上一条命的完整状态</text><text x="22" y="511" font-size="22" fill="#20334a" text-anchor="start">life=1时没有右框收益；u=0时已无剩余牌，期望为零</text></g></svg>