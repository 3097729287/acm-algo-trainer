<svg xmlns="http://www.w3.org/2000/svg" width="640" height="524" viewBox="0 0 640 524" role="img"><title>Prime Destruction：真实拆分树的每份物品与每次操作</title><rect width="640" height="524" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">阈值3，从一份12开始；每个内部结点花一步</text><text x="24" y="77" class="" text-anchor="start">首刀p=2：两件6</text><text x="340" y="77" class="" text-anchor="start">首刀p=3：三件4</text><rect x="129" y="100" width="42" height="40" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="150" y="127" class="" text-anchor="middle">12</text><rect x="454" y="100" width="42" height="40" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="475" y="127" class="" text-anchor="middle">12</text><line x1="150" y1="140" x2="75" y2="181" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="54" y="181" width="42" height="40" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="75" y="208" class="" text-anchor="middle">6</text><line x1="75" y1="221" x2="31" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="10" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="31" y="306" class="" text-anchor="middle">2</text><line x1="75" y1="221" x2="75" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="54" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="75" y="306" class="" text-anchor="middle">2</text><line x1="75" y1="221" x2="119" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="98" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="119" y="306" class="" text-anchor="middle">2</text><line x1="150" y1="140" x2="225" y2="181" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="204" y="181" width="42" height="40" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="225" y="208" class="" text-anchor="middle">6</text><line x1="225" y1="221" x2="181" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="160" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="181" y="306" class="" text-anchor="middle">2</text><line x1="225" y1="221" x2="225" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="204" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="225" y="306" class="" text-anchor="middle">2</text><line x1="225" y1="221" x2="269" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="248" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="269" y="306" class="" text-anchor="middle">2</text><line x1="475" y1="140" x2="371" y2="181" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="350" y="181" width="42" height="40" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="371" y="208" class="" text-anchor="middle">4</text><line x1="371" y1="221" x2="348" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="327" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="348" y="306" class="" text-anchor="middle">2</text><line x1="371" y1="221" x2="394" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="373" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="394" y="306" class="" text-anchor="middle">2</text><line x1="475" y1="140" x2="475" y2="181" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="454" y="181" width="42" height="40" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="475" y="208" class="" text-anchor="middle">4</text><line x1="475" y1="221" x2="452" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="431" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="452" y="306" class="" text-anchor="middle">2</text><line x1="475" y1="221" x2="498" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="477" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="498" y="306" class="" text-anchor="middle">2</text><line x1="475" y1="140" x2="579" y2="181" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="558" y="181" width="42" height="40" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="579" y="208" class="" text-anchor="middle">4</text><line x1="579" y1="221" x2="556" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="535" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="556" y="306" class="" text-anchor="middle">2</text><line x1="579" y1="221" x2="602" y2="279" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><rect x="581" y="279" width="42" height="40" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="602" y="306" class="" text-anchor="middle">2</text><text x="24" y="365" class="" text-anchor="start">1 + 2×dp[6] = 1+2×1 = 3</text><text x="24" y="405" class="" text-anchor="start">1 + 3×dp[4] = 1+3×1 = 4</text><text x="24" y="454" class="small" text-anchor="start">可执行左边：12 → 6,6 → 2,2,2,6 → 六件2</text><text x="24" y="494" class="" text-anchor="start">复用dp[6]的数值，不能省去第二件6的那次动作</text></svg>