<svg xmlns="http://www.w3.org/2000/svg" width="640" height="501" viewBox="0 0 640 501" role="img"><title>Trulimero Trulicina：同时满足频次与邻接的两份真实网格</title><rect width="640" height="501" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">两份实际网格：编号顺序与输出顺序分开</text><text x="24" y="79" class="" text-anchor="start">2×3，k=3</text><text x="310" y="79" class="" text-anchor="start">4×6，k=8</text><text x="24" y="110" class="small" text-anchor="start">颜色=(i+j)%3+1</text><text x="310" y="110" class="small" text-anchor="start">颜色=(4j+i)%8+1</text><rect x="28" y="130" width="54" height="51" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="55" y="164" class="" text-anchor="middle">1</text><rect x="90" y="130" width="54" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="117" y="164" class="" text-anchor="middle">2</text><rect x="152" y="130" width="54" height="51" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="179" y="164" class="" text-anchor="middle">3</text><rect x="28" y="190" width="54" height="51" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="55" y="224" class="" text-anchor="middle">2</text><rect x="90" y="190" width="54" height="51" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="117" y="224" class="" text-anchor="middle">3</text><rect x="152" y="190" width="54" height="51" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="179" y="224" class="" text-anchor="middle">1</text><text x="24" y="289" class="" text-anchor="start">每色出现两次</text><text x="24" y="326" class="small" text-anchor="start">每行一个完整周期</text><rect x="310" y="130" width="43" height="51" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="331.5" y="154" class="" text-anchor="middle">1</text><text x="331.5" y="174" class="small" text-anchor="middle">#0</text><rect x="358" y="130" width="43" height="51"