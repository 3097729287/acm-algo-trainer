<svg xmlns="http://www.w3.org/2000/svg" width="720" height="778" viewBox="0 0 720 778" role="img"><title>aab、aab、abb、abb四字符串，将第一串下标一a改b得到abb，与另三串旧新LCP三到一减二、一到三加二、一到三加二，其他三对不变，六无序对总分十到十二；所有可能位置替换对称分析最优净增二</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="20" fill="#20334a" text-anchor="start">四个字符串：S1=aab，S2=aab，S3=abb，S4=abb</text><text x="22" y="86" font-size="22" fill="#20334a" text-anchor="start">只改S1的下标1：a→b，得到abb</text><rect x="22" y="124" width="676" height="47" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="40" y="156" font-size="20" fill="#20334a" text-anchor="start">与S1成对</text><text x="302" y="156" font-size="20" fill="#20334a" text-anchor="start">旧LCP</text><text x="444" y="156" font-size="20" fill="#20334a" text-anchor="start">新LCP</text><text x="583" y="156" font-size="20" fill="#20334a" text-anchor="start">变化</text><rect x="22" y="180" width="676" height="47" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="40" y="212" font-size="20" fill="#20334a" text-anchor="start">S2=aab</text><text x="302" y="212" font-size="20" fill="#20334a" text-anchor="start">3</text><text x="444" y="212" font-size="20" fill="#20334a" text-anchor="start">1</text><text x="583" y="212" font-size="20" fill="#20334a" text-anchor="start">−2</text><rect x="22" y="236" width="676" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="40" y="268" font-size="20" fill="#20334a" text-anchor="start">S3=abb</text><text x="302" y="268" font-size="20" fill="#20334a" text-anchor="start">1</text><text x="444" y="268" font-size="20" fill="#20334a" text-anchor="start">3</text><text x="583" y="268" font-size="20" fill="#20334a" text-anchor="start">+2</text><rect x="22" y="292" width="676" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="40" y="324" font-size="20" fill="#20334a" text-anchor="start">S4=abb</text><text x="302" y="324" font-size="20" fill="#20334a" text-anchor="start">1</text><text x="444" y="324" font-size="20" fill="#20334a" text-anchor="start">3</text><text x="583" y="324" font-size="20" fill="#20334a" text-anchor="start">+2</text><text x="22" y="399" font-size="20" fill="#20334a" text-anchor="start">另外三对(S2,S3)、(S2,S4)、(S3,S4)仍为1、1、3</text><text x="22" y="446" font-size="22" fill="#20334a" text-anchor="start">旧总分3+1+1+1+1+3=10</text><text x="22" y="493" font-size="22" fill="#20334a" text-anchor="start">收益4−损失2=净增2，新总分12</text><text x="22" y="548" font-size="20" fill="#20334a" text-anchor="start">若改下标0，会破坏另外三对各至少1位</text><text x="22" y="595" font-size="20" fill="#20334a" text-anchor="start">若改下标2，也会破坏原来的相同串配对</text><text x="22" y="642" font-size="20" fill="#20334a" text-anchor="start">改下标1为其他字母：损失2，却没有收益</text><text x="22" y="689" font-size="20" fill="#20334a" text-anchor="start">四串对称，故所有候选中最优净增确为2</text><text x="22" y="748" font-size="20" fill="#20334a" text-anchor="start">同一对只算一次；改谁就只重算与它相连的三对</text></g></svg>