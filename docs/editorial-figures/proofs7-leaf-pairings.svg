<svg xmlns="http://www.w3.org/2000/svg" width="720" height="778" viewBox="0 0 720 778" role="img"><title>两棵真实树的实际配对路径，偶数叶例根自身是叶并以五条边同时达到下界，奇数叶例留下二配四五距离二，留下四或五的路径修正包含偶边加一</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">偶数叶例：原始叶{1,4,6,7}；粗蓝边恰好各经过一次</text><line x1="46" y1="131" x2="159" y2="131" stroke="#2d6db4" stroke-width="6"/><line x1="159" y1="131" x2="265" y2="88" stroke="#2d6db4" stroke-width="6"/><line x1="265" y1="88" x2="365" y2="88" stroke="#2d6db4" stroke-width="6"/><line x1="159" y1="131" x2="265" y2="238" stroke="#94a3b8" stroke-width="3"/><line x1="265" y1="238" x2="365" y2="204" stroke="#2d6db4" stroke-width="6"/><line x1="265" y1="238" x2="365" y2="288" stroke="#2d6db4" stroke-width="6"/><circle cx="46" cy="131" r="21" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="46" y="138" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="159" cy="131" r="21" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="159" y="138" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="265" cy="88" r="21" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="265" y="95" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="365" cy="88" r="21" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="365" y="95" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="265" cy="238" r="21" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="265" y="245" font-size="21" fill="#20334a" text-anchor="middle">5</text><circle cx="365" cy="204" r="21" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="365" y="211" font-size="21" fill="#20334a" text-anchor="middle">6</text><circle cx="365" cy="288" r="21" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="365" y="295" font-size="21" fill="#20334a" text-anchor="middle">7</text><text x="422" y="104" font-size="21" fill="#20334a" text-anchor="start">配1与4：距离3</text><text x="422" y="151" font-size="21" fill="#20334a" text-anchor="start">配6与7：距离2</text><text x="422" y="198" font-size="20" fill="#20334a" text-anchor="start">全部边下界同时达到</text><text x="422" y="245" font-size="21" fill="#20334a" text-anchor="start">B=5，未走边2—5</text><text x="22" y="346" font-size="21" fill="#20334a" text-anchor="start">根1的原度数为1，仍是原始叶子；定根不能把它漏掉</text><text x="22" y="401" font-size="22" fill="#20334a" text-anchor="start">奇数叶例：原始叶{2,4,5}；选择留下2</text><line x1="130" y1="474" x2="48" y2="574" stroke="#94a3b8" stroke-width="3"/><line x1="130" y1="474" x2="262" y2="574" stroke="#94a3b8" stroke-width="3"/><line x1="262" y1="574" x2="202" y2="682" stroke="#2d6db4" stroke-width="6"/><line x1="262" y1="574" x2="333" y2="682" stroke="#2d6db4" stroke-width="6"/><circle cx="130" cy="474" r="22" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="130" y="482" font-size="22" fill="#20334a" text-anchor="middle">1</text><circle cx="48" cy="574" r="22" fill="#fee2e2" stroke="#20334a" stroke-width="2"/><text x="48" y="582" font-size="22" fill="#20334a" text-anchor="middle">2</text><circle cx="262" cy="574" r="22" fill="#e2e8f0" stroke="#20334a" stroke-width="2"/><text x="262" y="582" font-size="22" fill="#20334a" text-anchor="middle">3</text><circle cx="202" cy="682" r="22" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="202" y="690" font-size="22" fill="#20334a" text-anchor="middle">4</text><circle cx="333" cy="682" r="22" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="333" y="690" font-size="22" fill="#20334a" text-anchor="middle">5</text><text x="418" y="480" font-size="22" fill="#20334a" text-anchor="start">原B=3</text><text x="418" y="526" font-size="21" fill="#20334a" text-anchor="start">留2：g=−1，代价2</text><text x="418" y="572" font-size="21" fill="#20334a" text-anchor="start">留4：g=+1−1=0</text><text x="418" y="614" font-size="21" fill="#20334a" text-anchor="start">留5：g=+1−1=0</text><text x="418" y="659" font-size="21" fill="#20334a" text-anchor="start">最优配4与5，距离2</text><text x="22" y="752" font-size="21" fill="#20334a" text-anchor="start">留下4时，边1—3原为偶数，必须+1；不能只沿路径减一</text></g></svg>