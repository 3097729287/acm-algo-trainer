<svg xmlns="http://www.w3.org/2000/svg" width="720" height="389" viewBox="0 0 720 389" role="img"><title>按实际长度画出的二三四木棍和两个刻痕，第二刻痕分成五与四而非任意中点</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="23" y="37" font-size="23" fill="#20334a" text-anchor="start">小段长 [2,3,4]，总长9；只能在两个实际刻痕处折</text><rect x="45" y="128" width="140" height="70" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="115.0" y="172" font-size="27" fill="#20334a" text-anchor="middle">2</text><rect x="185" y="128" width="210" height="70" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="290.0" y="172" font-size="27" fill="#20334a" text-anchor="middle">3</text><rect x="395" y="128" width="280" height="70" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="535.0" y="172" font-size="27" fill="#20334a" text-anchor="middle">4</text><text x="185" y="104" font-size="21" fill="#20334a" text-anchor="middle">刻痕1</text><text x="395" y="104" font-size="21" fill="#20334a" text-anchor="middle">刻痕2（选这里）</text><line x1="395" y1="114" x2="395" y2="224" stroke="#a32e36" stroke-width="3" stroke-dasharray="7 5"/><path d="M50,235 L390,235" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="390,235 380.0,240.0 380.0,230.0" fill="#2d6db4"/><path d="M400,235 L670,235" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="670,235 660.0,240.0 660.0,230.0" fill="#087b48"/><text x="218" y="269" font-size="23" fill="#2d6db4" text-anchor="middle">左长 2+3=5</text><text x="535" y="269" font-size="23" fill="#087b48" text-anchor="middle">右长 4</text><text x="24" y="319" font-size="23" fill="#20334a" text-anchor="start">刻痕2：|5−4|=1；刻痕1：|2−(3+4)|=5</text><text x="24" y="364" font-size="22" fill="#20334a" text-anchor="start">枚举恰好两个刻痕，最小值为1；两端都不是刻痕</text></g></svg>