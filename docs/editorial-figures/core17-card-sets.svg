<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img"><title>三套实际卡牌和剩下的原牌空白牌</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="38" font-size="26" fill="#20334a" text-anchor="start">目标 3 套：每一行是一套四种牌，原牌与手写牌不复用</text><text x="35" y="79" font-size="22" fill="#20334a" text-anchor="start">原张数 [1,2,3,4]；空白 5 张；单种手写上限均 4</text><text x="265" y="123" font-size="23" fill="#20334a" text-anchor="middle">类型 1</text><text x="410" y="123" font-size="23" fill="#20334a" text-anchor="middle">类型 2</text><text x="555" y="123" font-size="23" fill="#20334a" text-anchor="middle">类型 3</text><text x="700" y="123" font-size="23" fill="#20334a" text-anchor="middle">类型 4</text><text x="45" y="181" font-size="23" fill="#20334a" text-anchor="start">第 1 套</text><rect x="200" y="150" width="130" height="50" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="265" y="183" font-size="22" fill="#20334a" text-anchor="middle">1 原1</text><rect x="345" y="150" width="130" height="50" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="410" y="183" font-size="22" fill="#20334a" text-anchor="middle">2 原1</text><rect x="490" y="150" width="130" height="50" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="555" y="183" font-size="22" fill="#20334a" text-anchor="middle">3 原1</text><rect x="635" y="150" width="130" height="50" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="700" y="183" font-size="22" fill="#20334a" text-anchor="middle">4 原1</text><text x="45" y="261" font-size="23" fill="#20334a" text-anchor="start">第 2 套</text><rect x="200" y="230" width="130" height="50" rx="5" fill="#fff0ce" stroke="#6d86a6" stroke-width="2"/><text x="265" y="263" font-size="22" fill="#20334a" text-anchor="middle">1 写1</text><rect x="345" y="230" width="130" height="50" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="410" y="263" font-size="22" fill="#20334a" text-anchor="middle">2 原2</text><rect x="490" y="230" width="130" height="50" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="555" y="263" font-size="22" fill="#20334a" text-anchor="middle">3 原2</text><rect x="635" y="230" width="130" height="50" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="700" y="263" font-size="22" fill="#20334a" text-anchor="middle">4 原2</text><text x="45" y="341" font-size="23" fill="#20334a" text-anchor="start">第 3 套</text><rect x="200" y="310" width="130" height="50" rx="5" fill="#fff0ce" stroke="#6d86a6" stroke-width="2"/><text x="265" y="343" font-size="22" fill="#20334a" text-anchor="middle">1 写2</text><rect x="345" y="310" width="130" height="50" rx="5" fill="#fff0ce" stroke="#6d86a6" stroke-width="2"/><text x="410" y="343" font-size="22" fill="#20334a" text-anchor="middle">2 写1</text><rect x="490" y="310" width="130" height="50" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="555" y="343" font-size="22" fill="#20334a" text-anchor="middle">3 原3</text><rect x="635" y="310" width="130" height="50" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="700" y="343" font-size="22" fill="#20334a" text-anchor="middle">4 原3</text><rect x="810" y="224" width="145" height="58" rx="5" fill="#f1f2f4" stroke="#6d86a6" stroke-width="2"/><text x="882" y="260" font-size="23" fill="#20334a" text-anchor="middle">4 原4</text><text x="810" y="316" font-size="20" fill="#20334a" text-anchor="start">多余原牌不使用</text><rect x="200" y="405" width="150" height="55" rx="5" fill="#f1f2f4" stroke="#6d86a6" stroke-width="2"/><text x="275" y="440" font-size="21" fill="#20334a" text-anchor="middle">剩余空白 1</text><rect x="385" y="405" width="150" height="55" rx="5" fill="#f1f2f4" stroke="#6d86a6" stroke-width="2"/><text x="460" y="440" font-size="21" fill="#20334a" text-anchor="middle">剩余空白 2</text><text x="35" y="510" font-size="23" fill="#286b4d" text-anchor="start">目标 3：手写 [2,1,0,0]，总数 3 ≤ 5；三套同时完成。</text><text x="35" y="553" font-size="23" fill="#a23b34" text-anchor="start">目标 4：手写 [3,2,1,0]，总数 6 &gt; 5，不能再多配一套。</text></g></svg>