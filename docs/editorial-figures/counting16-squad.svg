<svg xmlns="http://www.w3.org/2000/svg" width="640" height="835" viewBox="0 0 640 835" role="img"><title>九个真实位置、两条合法小队和部分同值批的反例</title><rect width="640" height="835" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="35" class="title" text-anchor="start">九位勇士：标记不是选进小队</text><text x="24" y="77" class="small" text-anchor="start">绿色真正选入；标字表示已达到当前阈值</text><text x="50" y="113" class="small" text-anchor="middle">1</text><rect x="24" y="128" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="50.0" y="157.0" class="" text-anchor="middle">5</text><text x="115" y="113" class="small" text-anchor="middle">2</text><rect x="89" y="128" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="115.0" y="157.0" class="" text-anchor="middle">8</text><text x="180" y="113" class="small" text-anchor="middle">3</text><rect x="154" y="128" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="180.0" y="157.0" class="" text-anchor="middle">2</text><text x="245" y="113" class="small" text-anchor="middle">4</text><rect x="219" y="128" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="245.0" y="157.0" class="" text-anchor="middle">5</text><text x="310" y="113" class="small" text-anchor="middle">5</text><rect x="284" y="128" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="310.0" y="157.0" class="" text-anchor="middle">3</text><text x="375" y="113" class="small" text-anchor="middle">6</text><rect x="349" y="128" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="375.0" y="157.0" class="" text-anchor="middle">8</text><text x="440" y="113" class="small" text-anchor="middle">7</text><rect x="414" y="128" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="440.0" y="157.0" class="" text-anc