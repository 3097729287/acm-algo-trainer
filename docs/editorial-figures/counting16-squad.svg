"570" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="24" y="609" class="small" text-anchor="start">若同值五只加入位置九，就查询：</text><rect x="24" y="658" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="50.0" y="687.0" class="" text-anchor="middle">5</text><text x="115" y="642" class="small" text-anchor="middle">标</text><rect x="89" y="658" width="52" height="44" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="115.0" y="687.0" class="" text-anchor="middle">8</text><rect x="154" y="658" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="180.0" y="687.0" class="" text-anchor="middle">2</text><rect x="219" y="658" width="52" height="44" rx="5" fill="#ffd1ca" stroke="#7394aa"/><text x="245.0" y="687.0" class="" text-anchor="middle">5</text><rect x="284" y="658" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="310.0" y="687.0" class="" text-anchor="middle">3</text><text x="375" y="642" class="small" text-anchor="middle">标</text><rect x="349" y="658" width="52" height="44" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="375.0" y="687.0" class="" text-anchor="middle">8</text><rect x="414" y="658" width="52" height="44" rx="5" fill="#ffd1ca" stroke="#7394aa"/><text x="440.0" y="687.0" class="" text-anchor="middle">5</text><rect x="479" y="658" width="52" height="44" rx="5" fill="#e7ebef" stroke="#7394aa"/><text x="505.0" y="687.0" class="" text-anchor="middle">1</text><text x="570" y="642" class="small" text-anchor="middle">标</text><rect x="544" y="658" width="52" height="44" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="570.0" y="687.0" class="" text-anchor="middle">5</text><text x="24" y="753" class="" text-anchor="start">区间2..9：8−3+2=7，错误！同值五被算进来</text><text x="24" y="798" class="" text-anchor="start">必须等五这一批全部标记，真实最大仍为5</text></svg>