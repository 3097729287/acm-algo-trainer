<svg xmlns="http://www.w3.org/2000/svg" width="720" height="522" viewBox="0 0 720 522" role="img"><title>带人数的真实一维坐标在目标二处左右分组，左侧包含坐标等于目标的零贡献人群，各减项消去实际多算的坐标</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="23" y="36" font-size="22" fill="#20334a" text-anchor="start">差坐标分布 V=[3,2,2]，目标 b=2；坐标已统一加N</text><rect x="58" y="92" width="385" height="147" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><rect x="491" y="92" width="171" height="147" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><line x1="82" y1="171" x2="647" y2="171" stroke="#667488" stroke-width="3"/><line x1="360" y1="70" x2="360" y2="259" stroke="#a32e36" stroke-width="2" stroke-dasharray="7 5"/><circle cx="140" cy="171" r="7" fill="#20334a"/><text x="140" y="138" font-size="23" fill="#20334a" text-anchor="middle">3人</text><text x="140" y="215" font-size="22" fill="#20334a" text-anchor="middle">坐标1</text><circle cx="360" cy="171" r="7" fill="#20334a"/><text x="360" y="138" font-size="23" fill="#20334a" text-anchor="middle">2人</text><text x="360" y="215" font-size="22" fill="#20334a" text-anchor="middle">坐标2</text><circle cx="580" cy="171" r="7" fill="#20334a"/><text x="580" y="138" font-size="23" fill="#20334a" text-anchor="middle">2人</text><text x="580" y="215" font-size="22" fill="#20334a" text-anchor="middle">坐标3</text><path d="M140,281 L349,281" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="349,281 339.0,286.0 339.0,276.0" fill="#087b48"/><path d="M580,281 L371,281" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="371,281 381.0,276.0 381.0,286.0" fill="#2d6db4"/><text x="239" y="320" font-size="22" fill="#087b48" text-anchor="middle">1步×3人=3</text><text x="480" y="320" font-size="22" fill="#2d6db4" text-anchor="middle">1步×2人=2</text><text x="23" y="366" font-size="22" fill="#20334a" text-anchor="start">左侧含目标点：Cᴸ=3+2=5，Sᴸ=1×3+2×2=7</text><text x="23" y="408" font-size="23" fill="#087b48" text-anchor="start">左贡献 bCᴸ−Sᴸ=2×5−7=3</text><text x="23" y="452" font-size="22" fill="#2d6db4" text-anchor="start">右侧：Cᴿ=2，Sᴿ=3×2=6；右贡献6−2×2=2</text><text x="23" y="496" font-size="23" fill="#20334a" text-anchor="start">H[2]=3+2=5；目标点上的两人各走0步</text></g></svg>