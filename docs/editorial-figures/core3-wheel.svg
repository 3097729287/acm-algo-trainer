<svg xmlns="http://www.w3.org/2000/svg" width="620" height="625" viewBox="0 0 620 625" role="img"><title>四点轮子图的环边全十，辐条依次一一百一一百，两条便宜路线真实经过点一或三</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">点 4 到中心：先去便宜辐条，11 优于直接 100</text><line x1="140" y1="130" x2="480" y2="130" stroke="#8995a5" stroke-width="4"/><line x1="140" y1="130" x2="310" y2="275" stroke="#087b48" stroke-width="3"/><line x1="480" y1="130" x2="480" y2="420" stroke="#8995a5" stroke-width="4"/><line x1="480" y1="130" x2="310" y2="275" stroke="#8995a5" stroke-width="3"/><line x1="480" y1="420" x2="140" y2="420" stroke="#2d6db4" stroke-width="4"/><line x1="480" y1="420" x2="310" y2="275" stroke="#2d6db4" stroke-width="3"/><line x1="140" y1="420" x2="140" y2="130" stroke="#087b48" stroke-width="4"/><line x1="140" y1="420" x2="310" y2="275" stroke="#8995a5" stroke-width="3"/><rect x="280" y="77" width="60" height="32" rx="5" fill="#fff"/><text x="310" y="102" font-size="23" fill="#20334a" text-anchor="middle">10</text><rect x="517" y="256" width="60" height="32" rx="5" fill="#fff"/><text x="547" y="281" font-size="23" fill="#20334a" text-anchor="middle">10</text><rect x="280" y="440" width="60" height="32" rx="5" fill="#fff"/><text x="310" y="465" font-size="23" fill="#20334a" text-anchor="middle">10</text><rect x="43" y="256" width="60" height="32" rx="5" fill="#fff"/><text x="73" y="281" font-size="23" fill="#20334a" text-anchor="middle">10</text><rect x="184" y="176" width="60" height="32" rx="5" fill="#fff"/><text x="214" y="201" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="380" y="176" width="60" height="32" rx="5" fill="#fff"/><text x="410" y="201" font-size="23" fill="#20334a" text-anchor="middle">100</text><rect x="380" y="348" width="60" height="32" rx="5" fill="#fff"/><text x="410" y="373" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="180" y="348" width="60" height="32" rx="5" fill="#fff"/><text x="210" y="373" font-size="23" fill="#20334a" text-anchor="middle">100</text><circle cx="140" cy="130" r="23" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="140" y="138" font-size="25" fill="#20334a" text-anchor="middle">1</text><circle cx="480" cy="130" r="23" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="480" y="138" font-size="25" fill="#20334a" text-anchor="middle">2</text><circle cx="480" cy="420" r="23" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="480" y="428" font-size="25" fill="#20334a" text-anchor="middle">3</text><circle cx="140" cy="420" r="23" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="140" y="428" font-size="25" fill="#20334a" text-anchor="middle">4</text><circle cx="310" cy="275" r="25" fill="#eff6ff" stroke="#20334a" stroke-width="2"/><text x="310" y="284" font-size="25" fill="#20334a" text-anchor="middle">5</text><rect x="24" y="500" width="572" height="98" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="42" y="537" font-size="22" fill="#20334a" text-anchor="start">4→1→5 与 4→3→5：均为 10+1=11</text><text x="42" y="577" font-size="22" fill="#20334a" text-anchor="start">1→5→3 只要 2；纯沿环则至少为 20。</text></g></svg>