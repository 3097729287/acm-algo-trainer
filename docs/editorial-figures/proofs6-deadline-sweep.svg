<svg xmlns="http://www.w3.org/2000/svg" width="720" height="755" viewBox="0 0 720 755" role="img"><title>同一五个作业位置上的等待闭区间、i五查询的绿色位置前缀和五步DP运算，j一到四仍不能激活，五才激活，而当前权值限制只准位置一，得到六</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">a=[3,1,1,1,3]；绿色竖带是在i=5查询的位置前缀[1,1]</text><text x="155" y="80" font-size="21" fill="#20334a" text-anchor="middle">i=1</text><rect x="114" y="96" width="82" height="54" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="155" y="132" font-size="22" fill="#20334a" text-anchor="middle">a=3</text><text x="271" y="80" font-size="21" fill="#20334a" text-anchor="middle">i=2</text><rect x="230" y="96" width="82" height="54" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="271" y="132" font-size="22" fill="#20334a" text-anchor="middle">a=1</text><text x="387" y="80" font-size="21" fill="#20334a" text-anchor="middle">i=3</text><rect x="346" y="96" width="82" height="54" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="387" y="132" font-size="22" fill="#20334a" text-anchor="middle">a=1</text><text x="503" y="80" font-size="21" fill="#20334a" text-anchor="middle">i=4</text><rect x="462" y="96" width="82" height="54" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="503" y="132" font-size="22" fill="#20334a" text-anchor="middle">a=1</text><text x="619" y="80" font-size="21" fill="#20334a" text-anchor="middle">i=5</text><rect x="578" y="96" width="82" height="54" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="619" y="132" font-size="22" fill="#20334a" text-anchor="middle">a=3</text><rect x="114" y="154" width="82" height="158" fill="#dcfce7" opacity="0.65"/><line x1="155" y1="183" x2="503" y2="183" stroke="#a32e36" stroke-width="5"/><circle cx="503" cy="183" r="5" fill="#a32e36"/><text x="22" y="212" font-size="18" fill="#a32e36" text-anchor="start">j=1：到4仍不激活，5才激活</text><line x1="271" y1="237" x2="387" y2="237" stroke="#2d6db4" stroke-width="5"/><circle cx="387" cy="237" r="5" fill="#2d6db4"/><text x="22" y="266" font-size="18" fill="#2d6db4" text-anchor="start">j=2：4起激活</text><line x1="387" y1="291" x2="503" y2="291" stroke="#b36b16" stroke-width="5"/><circle cx="503" cy="291" r="5" fill="#b36b16"/><text x="22" y="320" font-size="18" fill="#b36b16" text-anchor="start">j=3：5起激活</text><text x="48" y="379" font-size="21" fill="#20334a" text-anchor="middle">i</text><text x="181" y="379" font-size="21" fill="#20334a" text-anchor="middle">本轮新增激活</text><text x="355" y="379" font-size="21" fill="#20334a" text-anchor="middle">lim</text><text x="485" y="379" font-size="21" fill="#20334a" text-anchor="middle">best</text><text x="638" y="379" font-size="21" fill="#20334a" text-anchor="middle">dpᵢ</text><rect x="22" y="399" width="676" height="43" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="48" y="428" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="181" y="428" font-size="21" fill="#20334a" text-anchor="middle">无</text><text x="355" y="428" font-size="21" fill="#20334a" text-anchor="middle">−3</text><text x="485" y="428" font-size="21" fill="#20334a" text-anchor="middle">0</text><text x="638" y="428" font-size="21" fill="#20334a" text-anchor="middle">3</text><rect x="22" y="448" width="676" height="43" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="48" y="477" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="181" y="477" font-size="21" fill="#20334a" text-anchor="middle">无</text><text x="355" y="477" font-size="21" fill="#20334a" text-anchor="middle">0</text><text x="485" y="477" font-size="21" fill="#20334a" text-anchor="middle">0</text><text x="638" y="477" font-size="21" fill="#20334a" text-anchor="middle">1</text><rect x="22" y="497" width="676" height="43" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="48" y="526" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="181" y="526" font-size="21" fill="#20334a" text-anchor="middle">无</text><text x="355" y="526" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="485" y="526" font-size="21" fill="#20334a" text-anchor="middle">0</text><text x="638" y="526" font-size="21" fill="#20334a" text-anchor="middle">1</text><rect x="22" y="546" width="676" height="43" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="48" y="575" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="181" y="575" font-size="21" fill="#20334a" text-anchor="middle">j=2</text><text x="355" y="575" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="485" y="575" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="638" y="575" font-size="21" fill="#20334a" text-anchor="middle">2</text><rect x="22" y="595" width="676" height="43" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="48" y="624" font-size="21" fill="#20334a" text-anchor="middle">5</text><text x="181" y="624" font-size="21" fill="#20334a" text-anchor="middle">j=1、3</text><text x="355" y="624" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="485" y="624" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="638" y="624" font-size="21" fill="#20334a" text-anchor="middle">6</text><text x="22" y="689" font-size="21" fill="#20334a" text-anchor="start">i=5时已激活{1,2,3}，但当前a₅=3只允许j≤1；3+3=6</text><text x="22" y="729" font-size="21" fill="#20334a" text-anchor="start">i=4时距离4−1=3等于a₁，严格不等式排除j=1</text></g></svg>