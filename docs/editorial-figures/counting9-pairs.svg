<svg xmlns="http://www.w3.org/2000/svg" width="640" height="764" viewBox="0 0 640 764" role="img"><title>Good Pair：实际查询范围、原配对身份与三次合法删除</title><rect width="640" height="764" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">完整双串：只询问原位置3..7</text><text x="24" y="74" class="small" text-anchor="start">A=00，B=01，C=10，D=11；原身份始终保留</text><text x="69" y="112" class="small" text-anchor="middle">1</text><rect x="44" y="128" width="50" height="68" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="69" y="153" class="" text-anchor="middle">0</text><text x="69" y="184" class="" text-anchor="middle">1</text><text x="142" y="112" class="small" text-anchor="middle">2</text><rect x="117" y="128" width="50" height="68" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="142" y="153" class="" text-anchor="middle">1</text><text x="142" y="184" class="" text-anchor="middle">0</text><text x="215" y="112" class="small" text-anchor="middle">3</text><rect x="190" y="128" width="50" height="68" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="215" y="153" class="" text-anchor="middle">0</text><text x="215" y="184" class="" text-anchor="middle">0</text><text x="288" y="112" class="small" text-anchor="middle">4</text><rect x="263" y="128" width="50" height="68" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="288" y="153" class="" text-anchor="middle">0</text><text x="288" y="184" class="" text-anchor="middle">1</text><text x="361" y="112" class="small" text-anchor="middle">5</text><rect x="336" y="128" width="50" height="68" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="361" y="153" class="" text-anchor="middle">0</text><text x="361" y="184" class="" text-anchor="middle">1</text><text x="434" y="112" class="small" text-anchor="middle">6</text><rect x="409" y="128" width="50" height="68" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="434" y="153" class="" text-anchor="middle">1</text><text x="434" y="184" class="" text-anchor="middle">1</text><text x="507" y="112" class="small" text-anchor="middle">7</text><rect x="482" y="128" width="50" height="68" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="507" y="153" class="" text-anchor="middle">1</text><text x="507" y="184" class="" text-anchor="middle">1</text><text x="580" y="112" class="small" text-anchor="middle">8</text><rect x="555" y="128" width="50" height="68" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="580" y="153" class="" text-anchor="middle">1</text><text x="580" y="184" class="" text-anchor="middle">0</text><line x1="190" y1="210" x2="532" y2="210" stroke="#168377" stroke-width="4" stroke-dasharray=""/><text x="24" y="249" class="small" text-anchor="start">B：3−1=2；C：1−1=0；len=5</text><rect x="24" y="284" width="588" height="112" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="42" y="312" class="small" text-anchor="start">原4、6 = 当前2、4</text><text x="42" y="347" class="" text-anchor="start">选1：x=01，y=11</text><text x="42" y="380" class="small" text-anchor="start">余原3、5、7：001 / 011</text><rect x="24" y="419" width="588" height="112" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="42" y="447" class="small" text-anchor="start">原3、5 = 当前1、2</text><text x="42" y="482" class="" text-anchor="start">选0：x=00，y=01</text><text x="42" y="515" class="small" text-anchor="start">余原7：1 / 1</text><rect x="24" y="554" width="588" height="112" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="42" y="582" class="small" text-anchor="start">原7 = 当前1</text><text x="42" y="617" class="" text-anchor="start">选1：x=1，y=1</text><text x="42" y="650" class="small" text-anchor="start">两串均空</text><text x="24" y="734" class="small" text-anchor="start">整段00011 / 01111不能一次删，却能按这三组删空</text></svg>