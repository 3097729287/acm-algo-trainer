<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="583" viewBox="0 0 1000 583" role="img"><title>二维怪物官方第一例的精确行缓存及第三次查询</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="26" y="38" font-size="25" fill="#20334a" text-anchor="start">第三次事件查询 (4,5) 前：只画 rb 的四个查询列</text><text x="26" y="78" font-size="19" fill="#20334a" text-anchor="start">历史候选：原点 (0,0), g=0；事件一 (0,4), g=-12；事件二 (2,9), g=6</text><text x="28" y="130" font-size="19" fill="#20334a" text-anchor="start">横坐标分组</text><rect x="150" y="104" width="120" height="40" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="210" y="131" font-size="19" fill="#20334a" text-anchor="middle">列 Y=0</text><rect x="305" y="104" width="120" height="40" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="365" y="131" font-size="19" fill="#20334a" text-anchor="middle">列 Y=4</text><rect x="460" y="104" width="120" height="40" rx="5" fill="#fff2cf" stroke="#2d6db4" stroke-width="2"/><text x="520" y="131" font-size="19" fill="#20334a" text-anchor="middle">列 Y=5</text><rect x="615" y="104" width="120" height="40" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="675" y="131" font-size="19" fill="#20334a" text-anchor="middle">列 Y=9</text><text x="35" y="190" font-size="22" fill="#20334a" text-anchor="start">x = 0</text><rect x="150" y="162" width="120" height="42" rx="5" fill="#ffffff" stroke="#2d6db4" stroke-width="2"/><text x="210" y="191" font-size="22" fill="#20334a" text-anchor="middle">0</text><rect x="305" y="162" width="120" height="42" rx="5" fill="#ffffff" stroke="#2d6db4" stroke-width="2"/><text x="365" y="191" font-size="22" fill="#20334a" text-anchor="middle">-12</text><rect x="460" y="162" width="120" height="42" rx="5" fill="#fff2cf" stroke="#2d6db4" stroke-width="2"/><text x="520" y="191" font-size="22" fill="#20334a" text-anchor="middle">-11</text><rect x="615" y="162" width="120" height="42" rx="5" fill="#ffffff" stroke="#2d6db4" stroke-width="2"/><text x="675" y="191" font-size="22" fill="#20334a" text-anchor="middle">13</text><text x="35" y="253" font-size="22" fill="#20334a" text-anchor="start">x = 2</text><rect x="150" y="225" width="120" height="42" rx="5" fill="#ffffff" stroke="#2d6db4" stroke-width="2"/><text x="210" y="254" font-size="22" fill="#20334a" text-anchor="middle">87</text><rect x="305" y="225" width="120" height="42" rx="5" fill="#ffffff" stroke="#2d6db4" stroke-width="2"/><text x="365" y="254" font-size="22" fill="#20334a" text-anchor="middle">31</text><rect x="460" y="225" width="120" height="42" rx="5" fill="#fff2cf" stroke="#2d6db4" stroke-width="2"/><text x="520" y="254" font-size="22" fill="#20334a" text-anchor="middle">22</text><rect x="615" y="225" width="120" height="42" rx="5" fill="#ffffff" stroke="#2d6db4" stroke-width="2"/><text x="675" y="254" font-size="22" fill="#20334a" text-anchor="middle">6</text><text x="26" y="329" font-size="21" fill="#20334a" text-anchor="start">查询只读列 Y=5，再补同一候选组的横向代价：</text><text x="55" y="374" font-size="23" fill="#14876d" text-anchor="start">x=0：−11 + (4−0)² = 5</text><text x="55" y="418" font-size="23" fill="#20334a" text-anchor="start">x=2： 22 + (4−2)² = 26</text><text x="55" y="462" font-size="22" fill="#20334a" text-anchor="start">其他横坐标组为空；q=5，g₃=5−26=−21。</text><text x="26" y="511" font-size="20" fill="#20334a" text-anchor="start">零行列 0 取原点；列 5 取事件一，并非每列共用同一个历史点。</text><text x="26" y="551" font-size="20" fill="#20334a" text-anchor="start">真实动作：剑到 (0,4) → 魔法且不移动 → 剑到 (4,5)，费用 16+11+17=44。</text></g></svg>