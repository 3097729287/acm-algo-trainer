<svg xmlns="http://www.w3.org/2000/svg" width="720" height="856" viewBox="0 0 720 856" role="img"><title>修改后四位选手沿真实Trie节点分成晋级淘汰与继续未定，明确q加c以及留下路径零一零</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="23" y="36" font-size="22" fill="#20334a" text-anchor="start">修改后正确性串：A=110，B=101，C=010，D=001</text><text x="23" y="76" font-size="21" fill="#20334a" text-anchor="start">N=4，M=2，K=3；蓝色为未定路径，已定分支不再展开</text><path d="M360,183 L210,260" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="210,260 216.61293228484297,250.98506092111091 221.17971063401703,259.8813823805409" fill="#2d6db4"/><text x="298.0" y="221.5" font-size="22" fill="#2d6db4" text-anchor="start">0</text><path d="M360,183 L565,260" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="565,260 553.8804670506145,261.1644685429541 557.3967053960055,251.80305476626407" fill="#087b48"/><text x="475.5" y="221.5" font-size="22" fill="#087b48" text-anchor="start">1</text><path d="M210,318 L95,411" fill="none" stroke="#a32e36" stroke-width="3"/><polygon points="95,411 99.63155118114916,400.8241101786431 105.91964256577505,408.59970705210515" fill="#a32e36"/><text x="165.5" y="364.5" font-size="22" fill="#a32e36" text-anchor="start">0</text><path d="M210,318 L330,411" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="330,411 319.0329911510685,408.82635860651806 325.1587078054266,400.92220808476566" fill="#2d6db4"/><text x="283.0" y="364.5" font-size="22" fill="#2d6db4" text-anchor="start">1</text><path d="M330,469 L235,566" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="235,566 238.424862665721,555.3571472000713 245.56919983937556,562.3541784526196" fill="#2d6db4"/><text x="295.5" y="517.5" font-size="22" fill="#2d6db4" text-anchor="start">0</text><path d="M330,469 L495,566" fill="none" stroke="#8995a5" stroke-width="3"/><polygon points="495,566 483.8453561420282,565.2424246560159 488.9132739604041,556.6217397072322" fill="#8995a5"/><text x="425.5" y="517.5" font-size="22" fill="#8995a5" text-anchor="start">1</text><rect x="277" y="125" width="166" height="58" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="360" y="162" font-size="21" fill="#2d6db4" text-anchor="middle">根：4人</text><rect x="127" y="260" width="166" height="58" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="210" y="297" font-size="21" fill="#2d6db4" text-anchor="middle">0：2人 C,D</text><rect x="482" y="260" width="166" height="58" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="565" y="297" font-size="21" fill="#087b48" text-anchor="middle">1：2人 A,B</text><rect x="12" y="411" width="166" height="58" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="95" y="448" font-size="21" fill="#a32e36" text-anchor="middle">00：1人 D</text><rect x="247" y="411" width="166" height="58" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="330" y="448" font-size="21" fill="#2d6db4" text-anchor="middle">01：1人 C</text><rect x="152" y="566" width="166" height="58" rx="8" fill="#f1f5f9" stroke="#667488" stroke-width="2"/><text x="235" y="603" font-size="21" fill="#667488" text-anchor="middle">010：1人 C</text><rect x="412" y="566" width="166" height="58" rx="8" fill="#f1f5f9" stroke="#667488" stroke-width="2"/><text x="495" y="603" font-size="21" fill="#667488" text-anchor="middle">011：0人</text><text x="565" y="348" font-size="21" fill="#087b48" text-anchor="middle">第1题全体晋级</text><text x="95" y="499" font-size="20" fill="#a32e36" text-anchor="middle">第2题淘汰</text><text x="235" y="654" font-size="20" fill="#667488" text-anchor="middle">最后仍未定 → 淘汰</text><text x="23" y="704" font-size="22" fill="#20334a" text-anchor="start">题1：q=0，c₁=2，0+2≤2 → p₁=0，q变2</text><text x="23" y="747" font-size="22" fill="#20334a" text-anchor="start">题2：q=2，c₁=1，2+1&gt;2 → p₂=1，q仍2</text><text x="23" y="790" font-size="22" fill="#20334a" text-anchor="start">题3：q=2，c₁=0，2+0≤2 → p₃=0，q仍2</text><text x="23" y="833" font-size="22" fill="#20334a" text-anchor="start">p=010 是留下的路径；C 与它全同也不会晋级</text></g></svg>