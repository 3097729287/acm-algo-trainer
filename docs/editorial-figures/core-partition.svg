<svg xmlns="http://www.w3.org/2000/svg" width="620" height="543" viewBox="0 0 620 543" role="img"><title>最佳分割的两个不重叠整除段，与两个重叠整除段无法同时入选的对比</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="38" font-size="23" fill="#20334a" text-anchor="start">K=3：整除子段有 4 个，最佳分割得 2 分</text><text x="156" y="82" font-size="18" fill="#20334a" text-anchor="middle">位置 1</text><rect x="110" y="96" width="92" height="60" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="156" y="135" font-size="28" fill="#20334a" text-anchor="middle">1</text><text x="266" y="82" font-size="18" fill="#20334a" text-anchor="middle">位置 2</text><rect x="220" y="96" width="92" height="60" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="266" y="135" font-size="28" fill="#20334a" text-anchor="middle">2</text><text x="376" y="82" font-size="18" fill="#20334a" text-anchor="middle">位置 3</text><rect x="330" y="96" width="92" height="60" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="376" y="135" font-size="28" fill="#20334a" text-anchor="middle">1</text><text x="486" y="82" font-size="18" fill="#20334a" text-anchor="middle">位置 4</text><rect x="440" y="96" width="92" height="60" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="486" y="135" font-size="28" fill="#20334a" text-anchor="middle">2</text><text x="26" y="192" font-size="20" fill="#087b48" text-anchor="start">合法分割</text><rect x="110" y="210" width="202" height="53" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="211" y="244" font-size="21" fill="#087b48" text-anchor="middle">[1,2]，和 3</text><rect x="330" y="210" width="202" height="53" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="431" y="244" font-size="21" fill="#087b48" text-anchor="middle">[3,4]，和 3</text><text x="26" y="305" font-size="20" fill="#a32e36" text-anchor="start">不能并选</text><rect x="110" y="323" width="202" height="48" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="211" y="355" font-size="20" fill="#a32e36" text-anchor="middle">[1,2]，和 3</text><rect x="220" y="387" width="202" height="48" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="321" y="419" font-size="20" fill="#a32e36" text-anchor="middle">[2,3]，和 3</text><text x="26" y="477" font-size="21" fill="#20334a" text-anchor="start">下面两段都占用位置 2，不能同时作为分割。</text><text x="26" y="514" font-size="21" fill="#20334a" text-anchor="start">每次 best+1：接在旧前缀后，新加一个得分段。</text></g></svg>