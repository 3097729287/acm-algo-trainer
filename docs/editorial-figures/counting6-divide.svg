<svg xmlns="http://www.w3.org/2000/svg" width="640" height="525" viewBox="0 0 640 525" role="img"><title>La Vaca Saturno Saturnita：查询线、二分位置与每格贡献</title><rect width="640" height="525" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">k=18，查询 [2,6]：先找到真实变化下标</text><text x="24" y="70" class="" text-anchor="start">每格下方是本次贡献；灰格不在查询区间</text><text x="106" y="109" class="small" text-anchor="middle">1</text><rect x="76" y="120" width="60" height="47" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="106" y="152" class="" text-anchor="middle">3</text><text x="106" y="192" class="" text-anchor="middle">—</text><text x="178" y="109" class="small" text-anchor="middle">2</text><rect x="148" y="120" width="60" height="47" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="178" y="152" class="" text-anchor="middle">5</text><text x="178" y="192" class="" text-anchor="middle">18</text><text x="250" y="109" class="small" text-anchor="middle">3</text><rect x="220" y="120" width="60" height="47" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="250" y="152" class="" text-anchor="middle">7</text><text x="250" y="192" class="" text-anchor="middle">18</text><text x="322" y="109" class="small" text-anchor="middle">4</text><rect x="292" y="120" width="60" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="322" y="152" class="" text-anchor="middle">3</text><text x="322" y="192" class="" text-anchor="middle">2</text><text x="394" y="109" class="small" text-anchor="middle">5</text><rect x="364" y="120" width="60" height="47" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="394" y="152" class="" text-anchor="middle">4</text><text x="394" y="192" class="" text-anchor="middle">2</text><text x="466" y="109" class="small" text-anchor="middle">6</text><rect x="436" y="120" width="60" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="466" y="152" class="" text-anchor="middle">2</text><text x="466" y="192" class="" text-anchor="middle">1</text><text x="538" y="109" class="small" text-anchor="middle">7</text><rect x="508" y="120" width="60" height="47" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="538" y="152" class="" text-anchor="middle">3</text><text x="538" y="192" class="" text-anchor="middle">—</text><line x1="148" y1="211" x2="496" y2="211" stroke="#168377" stroke-width="3" stroke-dasharray=""/><line x1="148" y1="203" x2="148" y2="219" stroke="#168377" stroke-width="2" stroke-dasharray=""/><line x1="496" y1="203" x2="496" y2="219" stroke="#168377" stroke-width="2" stroke-dasharray=""/><text x="24" y="258" class="" text-anchor="start">pos[3]</text><rect x="170" y="231" width="68" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="204" y="261" class="" text-anchor="middle">1</text><rect x="262" y="231" width="68" height="45" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="296" y="261" class="" text-anchor="middle">4</text><rect x="354" y="231" width="68" height="45" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="388" y="261" class="" text-anchor="middle">7</text><text x="24" y="312" class="" text-anchor="start">lower_bound(p=2) 跳过1，指向4；不是数值四</text><text x="24" y="360" class="" text-anchor="start">pos[2]</text><rect x="262" y="332" width="68" height="45" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="296" y="362" class="" text-anchor="middle">6</text><text x="24" y="417" class="" text-anchor="start">取最早4：先加18×2，再把18→6→2后加2</text><text x="24" y="456" class="" text-anchor="start">p=5,cur=2：命中6，先加2×1，再除成1后加1</text><text x="24" y="495" class="" text-anchor="start">总和36+2+2+1=41；命中格在除干净后才计入</text></svg>