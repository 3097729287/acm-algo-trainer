<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 365" role="img" aria-labelledby="title"><title id="title">Sereja and Dima · 两端取牌：教学小例</title><rect width="920" height="365" rx="12" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#253340"><text x="24" y="35" font-size="22" fill="#253340">381A · 教学小例</text><text x="24" y="102" font-size="15" fill="#253340">初始剩余区间</text><rect x="244" y="74" width="68" height="49" rx="6" fill="#e2f3ed" stroke="#257c67"/><text x="261" y="104" font-size="19" fill="#253340">4</text><text x="266" y="140" font-size="12" fill="#657586">1</text><rect x="320" y="74" width="68" height="49" rx="6" fill="#e2f3ed" stroke="#257c67"/><text x="337" y="104" font-size="19" fill="#253340">1</text><text x="342" y="140" font-size="12" fill="#657586">2</text><rect x="396" y="74" width="68" height="49" rx="6" fill="#e2f3ed" stroke="#257c67"/><text x="413" y="104" font-size="19" fill="#253340">2</text><text x="418" y="140" font-size="12" fill="#657586">3</text><rect x="472" y="74" width="68" height="49" rx="6" fill="#e2f3ed" stroke="#257c67"/><text x="489" y="104" font-size="19" fill="#253340">10</text><text x="494" y="140" font-size="12" fill="#657586">4</text><path d="M244,157 V164 H540 V157" stroke="#257c67" stroke-width="2" fill="none"/><text x="244" y="188" font-size="15" fill="#257c67">从两端取较大者，先手取 10</text><text x="24" y="237" font-size="18" fill="#253340">取牌顺序：先手 10 → 后手 4 → 先手 2 → 后手 1。</text><text x="24" y="290" font-size="17" fill="#253340">得分 12 与 5；最后一张牌仍在区间内，循环要允许 l=r。</text></g></svg>