<svg xmlns="http://www.w3.org/2000/svg" width="660" height="474" viewBox="0 0 660 474" role="img"><title>八位有身份学生前三四八改编号二三四，其他五位保留，最终四种编号各两位</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="34" font-size="21" fill="#20334a" text-anchor="start">八名学生不换位置；每个最终编号恰出现两次</text><text x="54" y="88" font-size="16" fill="#20334a" text-anchor="middle">学生1</text><rect x="24" y="105" width="60" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="54" y="137" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="54" y="187" font-size="19" fill="#15803d" text-anchor="middle">↓留</text><rect x="24" y="211" width="60" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="54" y="243" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="132" y="88" font-size="16" fill="#20334a" text-anchor="middle">学生2</text><rect x="102" y="105" width="60" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="132" y="137" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="132" y="187" font-size="19" fill="#15803d" text-anchor="middle">↓留</text><rect x="102" y="211" width="60" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="132" y="243" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="210" y="88" font-size="16" fill="#20334a" text-anchor="middle">学生3</text><rect x="180" y="105" width="60" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="210" y="137" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="210" y="187" font-size="19" fill="#c2410c" text-anchor="middle">↓改</text><rect x="180" y="211" width="60" height="47" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="210" y="243" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="288" y="88" font-size="16" fill="#20334a" text-anchor="middle">学生4</text><rect x="258" y="105" width="60" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="288" y="137" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="288" y="187" font-size="19" fill="#c2410c" text-anchor="middle">↓改</text><rect x="258" y="211" width="60" height="47" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="288" y="243" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="366" y="88" font-size="16" fill="#20334a" text-anchor="middle">学生5</text><rect x="336" y="105" width="60" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="366" y="137" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="366" y="187" font-size="19" fill="#15803d" text-anchor="middle">↓留</text><rect x="336" y="211" width="60" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="366" y="243" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="444" y="88" font-size="16" fill="#20334a" text-anchor="middle">学生6</text><rect x="414" y="105" width="60" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="444" y="137" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="444" y="187" font-size="19" fill="#15803d" text-anchor="middle">↓留</text><rect x="414" y="211" width="60" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="444" y="243" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="522" y="88" font-size="16" fill="#20334a" text-anchor="middle">学生7</text><rect x="492" y="105" width="60" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="522" y="137" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="522" y="187" font-size="19" fill="#15803d" text-anchor="middle">↓留</text><rect x="492" y="211" width="60" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="522" y="243" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="600" y="88" font-size="16" fill="#20334a" text-anchor="middle">学生8</text><rect x="570" y="105" width="60" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="600" y="137" font-size="25" fill="#20334a" text-anchor="middle">5</text><text x="600" y="187" font-size="19" fill="#c2410c" text-anchor="middle">↓改</text><rect x="570" y="211" width="60" height="47" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="600" y="243" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="24" y="307" font-size="20" fill="#20334a" text-anchor="start">编号1最多留2人，占1个编号名额；另有4个单人编号。</text><text x="24" y="350" font-size="21" fill="#20334a" text-anchor="start">剩3个名额留3人：最多保留2+3=5，修改8−5=3。</text><text x="24" y="395" font-size="21" fill="#20334a" text-anchor="start">实际改学生3→编号2、4→编号3、8→编号4。</text><text x="24" y="439" font-size="21" fill="#20334a" text-anchor="start">最终四个对子同时成立，三次修改达到下界。</text></g></svg>