<svg xmlns="http://www.w3.org/2000/svg" width="620" height="600" viewBox="0 0 620 600" role="img"><title>三个真实好字符串中一的位置取中位数得到一零一零，原串分别花一零三次相邻交换达到下界四</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">官方样例：对齐第几个 1，不对齐原下标</text><text x="24" y="109" font-size="24" fill="#20334a" text-anchor="start">A</text><rect x="77" y="80" width="64" height="43" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="109" y="109" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="155" y="80" width="64" height="43" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="187" y="109" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="233" y="80" width="64" height="43" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="265" y="109" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="311" y="80" width="64" height="43" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="343" y="109" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="415" y="109" font-size="20" fill="#20334a" text-anchor="start">1的位置 1,2</text><text x="24" y="174" font-size="24" fill="#20334a" text-anchor="start">B</text><rect x="77" y="145" width="64" height="43" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="109" y="174" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="155" y="145" width="64" height="43" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="187" y="174" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="233" y="145" width="64" height="43" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="265" y="174" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="311" y="145" width="64" height="43" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="343" y="174" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="415" y="174" font-size="20" fill="#20334a" text-anchor="start">1的位置 1,3</text><text x="24" y="239" font-size="24" fill="#20334a" text-anchor="start">C</text><rect x="77" y="210" width="64" height="43" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="109" y="239" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="155" y="210" width="64" height="43" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="187" y="239" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="233" y="210" width="64" height="43" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="265" y="239" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="311" y="210" width="64" height="43" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="343" y="239" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="415" y="239" font-size="20" fill="#20334a" text-anchor="start">1的位置 3,4</text><text x="24" y="304" font-size="24" fill="#20334a" text-anchor="start">X</text><rect x="77" y="275" width="64" height="43" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="109" y="304" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="155" y="275" width="64" height="43" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="187" y="304" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="233" y="275" width="64" height="43" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="265" y="304" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="311" y="275" width="64" height="43" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="343" y="304" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="415" y="304" font-size="20" fill="#20334a" text-anchor="start">1的位置 1,3</text><text x="24" y="379" font-size="21" fill="#20334a" text-anchor="start">两列各贡献 2，总代价 4；对应实际交换：</text><text x="24" y="426" font-size="21" fill="#20334a" text-anchor="start">A：1100 → 1010，1 次；B 不变，0 次</text><rect x="24" y="456" width="572" height="73" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="42" y="500" font-size="21" fill="#20334a" text-anchor="start">C：0011 → 0101 → 1001 → 1010，3 次</text><text x="24" y="572" font-size="21" fill="#20334a" text-anchor="start">每个箭头只交换一对相邻字符，合计 1+0+3=4。</text></g></svg>