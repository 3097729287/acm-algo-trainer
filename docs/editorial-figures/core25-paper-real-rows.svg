<svg xmlns="http://www.w3.org/2000/svg" width="720" height="602" viewBox="0 0 720 602" role="img"><title>两张真实每页四行每行五格的纸，A十九字跨页续行首格写第十九字不缩进，B一字及C八字从新行缩进，总行八恰好两页</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">x=5、y=4；三段A19字、B1字、C8字</text><text x="171" y="82" font-size="22" fill="#20334a" text-anchor="middle">第1页</text><text x="41" y="136" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="66" y="111" width="40" height="42" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="86" y="138" font-size="15" fill="#20334a" text-anchor="middle">空</text><rect x="109" y="111" width="40" height="42" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="129" y="138" font-size="15" fill="#20334a" text-anchor="middle">空</text><rect x="152" y="111" width="40" height="42" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="172" y="138" font-size="15" fill="#20334a" text-anchor="middle">A1</text><rect x="195" y="111" width="40" height="42" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="215" y="138" font-size="15" fill="#20334a" text-anchor="middle">A2</text><rect x="238" y="111" width="40" height="42" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="258" y="138" font-size="15" fill="#20334a" text-anchor="middle">A3</text><text x="41" y="202" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="66" y="177" width="40" height="42" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="86" y="204" font-size="15" fill="#20334a" text-anchor="middle">A4</text><rect x="109" y="177" width="40" height="42" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="129" y="204" font-size="15" fill="#20334a" text-anchor="middle">A5</text><rect x="152" y="177" width="40" height="42" rx="8" fill="#bfdbfe" stroke="#2d