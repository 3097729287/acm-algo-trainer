t><rect x="507" y="177" width="40" height="42" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="527" y="204" font-size="15" fill="#20334a" text-anchor="middle">B1</text><rect x="550" y="177" width="40" height="42" rx="8" fill="#ffffff" stroke="#2d6db4" stroke-width="2"/><text x="570" y="204" font-size="15" fill="#20334a" text-anchor="middle"></text><rect x="593" y="177" width="40" height="42" rx="8" fill="#ffffff" stroke="#2d6db4" stroke-width="2"/><text x="613" y="204" font-size="15" fill="#20334a" text-anchor="middle"></text><text x="396" y="268" font-size="18" fill="#20334a" text-anchor="middle">7</text><rect x="421" y="243" width="40" height="42" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="441" y="270" font-size="15" fill="#20334a" text-anchor="middle">空</text><rect x="464" y="243" width="40" height="42" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="484" y="270" font-size="15" fill="#20334a" text-anchor="middle">空</text><rect x="507" y="243" width="40" height="42" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="527" y="270" font-size="15" fill="#20334a" text-anchor="middle">C1</text><rect x="550" y="243" width="40" height="42" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="570" y="270" font-size="15" fill="#20334a" text-anchor="middle">C2</text><rect x="593" y="243" width="40" height="42" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="613" y="270" font-size="15" fill="#20334a" text-anchor="middle">C3</text><text x="396" y="334" font-size="18" fill="#20334a" text-anchor="middle">8</text><rect x="421" y="309" width="40" height="42" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="441" y="336" font-size="15" fill="#20334a" text-anchor="middle">C4</text><rect x="464" y="309" width="40" height="42" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="484" y="336" font-size="15" fill="#20334a" text-anchor="middle">C5</text><rect x="507" y="309" width="40" height="42" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="527" y="336" font-size="15" fill="#20334a" text-anchor="middle">C6</text><rect x="550" y="309" width="40" height="42" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="570" y="336" font-size="15" fill="#20334a" text-anchor="middle">C7</text><rect x="593" y="309" width="40" height="42" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="613" y="336" font-size="15" fill="#20334a" text-anchor="middle">C8</text><text x="22" y="424" font-size="21" fill="#20334a" text-anchor="start">A的第5行跨页续写：A19在第一格，不重新缩进。</text><text x="22" y="471" font-size="21" fill="#20334a" text-anchor="start">B首行结束后余两格，C仍须从下一行开始。</text><text x="22" y="518" font-size="21" fill="#20334a" text-anchor="start">段行数5+1+2=8；每页4行，恰好写满两页。</text><text x="22" y="566" font-size="20" fill="#20334a" text-anchor="start">灰格是缩进；白格是未写满，不能给下一段接写。</text></g></svg>