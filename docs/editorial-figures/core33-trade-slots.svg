<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img"><title>四家商店14次带身份额度，便宜买贵价卖分别匹配1、1、4件，B余两格不用，实际六次买入六次卖出达利润100</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="24" fill="#20334a" text-anchor="start">一格是一次额度：买和卖各用一格</text><text x="22" y="78" font-size="20" fill="#20334a" text-anchor="start">原输入：A(10,2) B(30,7) C(20,4) D(50,1)</text><text x="22" y="156" font-size="22" fill="#20334a" text-anchor="start">A价10</text><rect x="152" y="122" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="183" y="155" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="222" y="122" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="253" y="155" font-size="20" fill="#20334a" text-anchor="middle">2</text><text x="22" y="248" font-size="22" fill="#20334a" text-anchor="start">C价20</text><rect x="152" y="214" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="183" y="247" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="222" y="214" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="253" y="247" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="292" y="214" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="323" y="247" font-size="20" fill="#20334a" text-anchor="middle">3</text><rect x="362" y="214" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="393" y="247" font-size="20" fill="#20334a" text-anchor="middle">4</text><text x="22" y="340" font-size="22" fill="#20334a" text-anchor="start">B价30</text><rect x="152" y="306" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="183" y="339" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="222" y="306" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="253" y="339" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="292" y="306" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="323" y="339" font-size="20" fill="#20334a" text-anchor="middle">3</text><rect x="362" y="306" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="393" y="339" font-size="20" fill="#20334a" text-anchor="middle">4</text><rect x="432" y="306" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="463" y="339" font-size="20" fill="#20334a" text-anchor="middle">5</text><rect x="502" y="306" width="62" height="50" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="533" y="339" font-size="20" fill="#20334a" text-anchor="middle">6</text><rect x="572" y="306" width="62" height="50" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="603" y="339" font-size="20" fill="#20334a" text-anchor="middle">7</text><text x="22" y="432" font-size="22" fill="#20334a" text-anchor="start">D价50</text><rect x="152" y="398" width="62" height="50" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="183" y="431" font-size="20" fill="#20334a" text-anchor="middle">1</text><text x="22" y="532" font-size="22" fill="#20334a" text-anchor="start">① A买1 / D卖1：1×(50−10)=40</text><text x="22" y="583" font-size="22" fill="#20334a" text-anchor="start">② A买1 / B卖1：1×(30−10)=20</text><text x="22" y="634" font-size="22" fill="#20334a" text-anchor="start">③ C买4 / B卖4：4×(30−20)=40</text><text x="22" y="685" font-size="22" fill="#20334a" text-anchor="start">总利润100；B剩2次额度，不必使用。</text><text x="22" y="736" font-size="20" fill="#20334a" text-anchor="start">实际先买6件再卖6件，同一额度只用一次。</text></g></svg>