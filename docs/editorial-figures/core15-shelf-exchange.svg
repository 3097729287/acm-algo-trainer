<svg xmlns="http://www.w3.org/2000/svg" width="660" height="564" viewBox="0 0 660 564" role="img"><title>六个原货架位置前二和末二片段各含一个一合法交换，保留一的个数三与位置和十得到零一一零一零</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="33" font-size="21" fill="#20334a" text-anchor="start">101001：交换两个等长、各含一个1的片段</text><text x="24" y="120" font-size="21" fill="#20334a" text-anchor="start">原串</text><rect x="159" y="91" width="54" height="47" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="186" y="123" font-size="26" fill="#20334a" text-anchor="middle">1</text><text x="186" y="76" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="236" y="91" width="54" height="47" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="263" y="123" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="263" y="76" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="313" y="91" width="54" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="340" y="123" font-size="26" fill="#20334a" text-anchor="middle">1</text><text x="340" y="76" font-size="18" fill="#20334a" text-anchor="middle">3</text><rect x="390" y="91" width="54" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="417" y="123" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="417" y="76" font-size="18" fill="#20334a" text-anchor="middle">4</text><rect x="467" y="91" width="54" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="494" y="123" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="494" y="76" font-size="18" fill="#20334a" text-anchor="middle">5</text><rect x="544" y="91" width="54" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="571" y="123" font-size="26" fill="#20334a" text-anchor="middle">1</text><text x="571" y="76" font-size="18" fill="#20334a" text-anchor="middle">6</text><text x="159" y="176" font-size="20" fill="#20334a" text-anchor="start">片段10 ↔ 片段01；中间10保持</text><text x="24" y="267" font-size="21" fill="#20334a" text-anchor="start">交换后</text><rect x="159" y="238" width="54" height="47" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="186" y="270" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="236" y="238" width="54" height="47" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="263" y="270" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="313" y="238" width="54" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="340" y="270" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="390" y="238" width="54" height="47" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="417" y="270" font-size="26" fill="#20334a" text-anchor="middle">0</text><rect x="467" y="238" width="54" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="494" y="270" font-size="26" fill="#20334a" text-anchor="middle">1</text><rect x="544" y="238" width="54" height="47" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="571" y="270" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="159" y="323" font-size="20" fill="#20334a" text-anchor="start">一的位置2、3、5，仍和为10</text><text x="24" y="436" font-size="21" fill="#20334a" text-anchor="start">原一的位置1、3、6：w=3，T=10。</text><text x="24" y="481" font-size="22" fill="#20334a" text-anchor="start">基准T₀=6；E=4=1×3+1。</text><text x="24" y="526" font-size="20" fill="#20334a" text-anchor="start">前导0×1、1×2、内0、1×1、尾0 → 011010。</text></g></svg>