<svg xmlns="http://www.w3.org/2000/svg" width="760" height="884" viewBox="0 0 760 884" role="img"><title>上界四三种实际背包装法，容量二贪心重一价值四输重二价值五，容量三贪心一二得九输重三十，容量四贪心一三十四输重四十五</title><rect width="760" height="884" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="38" font-size="23" fill="#17334d" text-anchor="start">上界4：重量1、2、3、4；价值4、5、10、15</text><text x="24" y="86" font-size="22" fill="#17334d" text-anchor="start">按密度检查：1 → 4 → 3 → 2；每种容量重新装包</text><text x="24" y="145" font-size="24" fill="#17334d" text-anchor="start">容量2</text><rect x="139" y="163" width="204" height="56" rx="7" fill="#f1f5f9" stroke="#476986" stroke-width="2"/><rect x="139" y="163" width="102" height="56" rx="7" fill="#ffedd5" stroke="#476986" stroke-width="2"/><text x="190" y="200" font-size="22" fill="#17334d" text-anchor="middle">重1</text><text x="30" y="199" font-size="20" fill="#17334d" text-anchor="start">贪心</text><text x="565" y="200" font-size="23" fill="#17334d" text-anchor="start">价值4</text><rect x="139" y="235" width="204" height="56" rx="7" fill="#f1f5f9" stroke="#476986" stroke-width="2"/><rect x="139" y="235" width="204" height="56" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="241" y="272" font-size="22" fill="#17334d" text-anchor="middle">重2</text><text x="30" y="271" font-size="20" fill="#17334d" text-anchor="start">可行替代</text><text x="565" y="272" font-size="23" fill="#17334d" text-anchor="start">价值5</text><text x="24" y="350" font-size="24" fill="#17334d" text-anchor="start">容量3</text><rect x="139" y="368" width="306" height="56" rx="7" fill="#f1f5f9" stroke="#476986" stroke-width="2"/><rect x="139" y="368" width="102" height="56" rx="7" fill="#ffedd5" stroke="#476986" stroke-width="2"/><text x="190" y="405" font-size="22" fill="#17334d" text-anchor="middle">重1</text><rect x="241" y="368" width="204" height="56" rx="7" fill="#ffedd5" stroke="#476986" stroke-width="2"/><text x="343" y="405" font-size="22" fill="#17334d" text-anchor="middle">重2</text><text x="30" y="404" font-size="20" fill="#17334d" text-anchor="start">贪心</text><text x="565" y="405" font-size="23" fill="#17334d" text-anchor="start">价值9</text><rect x="139" y="440" width="306" height="56" rx="7" fill="#f1f5f9" stroke="#476986" stroke-width="2"/><rect x="139" y="440" width="306" height="56" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="292" y="477" font-size="22" fill="#17334d" text-anchor="middle">重3</text><text x="30" y="476" font-size="20" fill="#17334d" text-anchor="start">可行替代</text><text x="565" y="477" font-size="23" fill="#17334d" text-anchor="start">价值10</text><text x="24" y="555" font-size="24" fill="#17334d" text-anchor="start">容量4</text><rect x="139" y="573" width="408" height="56" rx="7" fill="#f1f5f9" stroke="#476986" stroke-width="2"/><rect x="139" y="573" width="102" height="56" rx="7" fill="#ffedd5" stroke="#476986" stroke-width="2"/><text x="190" y="610" font-size="22" fill="#17334d" text-anchor="middle">重1</text><rect x="241" y="573" width="306" height="56" rx="7" fill="#ffedd5" stroke="#476986" stroke-width="2"/><text x="394" y="610" font-size="22" fill="#17334d" text-anchor="middle">重3</text><text x="30" y="609" font-size="20" fill="#17334d" text-anchor="start">贪心</text><text x="565" y="610" font-size="23" fill="#17334d" text-anchor="start">价值14</text><rect x="139" y="645" width="408" height="56" rx="7" fill="#f1f5f9" stroke="#476986" stroke-width="2"/><rect x="139" y="645" width="408" height="56" rx="7" fill="#dcfce7" stroke="#476986" stroke-width="2"/><text x="343" y="682" font-size="22" fill="#17334d" text-anchor="middle">重4</text><text x="30" y="681" font-size="20" fill="#17334d" text-anchor="start">可行替代</text><text x="565" y="682" font-size="23" fill="#17334d" text-anchor="start">价值15</text><text x="24" y="793" font-size="22" fill="#17334d" text-anchor="start">灰色格是剩余容量；跳过装不下的物品后继续检查。</text><text x="24" y="842" font-size="22" fill="#17334d" text-anchor="start">每个替代方案都比贪心多1，足以证明贪心失败。</text></g></svg>