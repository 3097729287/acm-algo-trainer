<svg xmlns="http://www.w3.org/2000/svg" width="660" height="540" viewBox="0 0 660 540" role="img"><title>两个数的同一混合进制q，十时二十减十九等一，十一时二十二减二十等二，低位负差不改变进制单调性</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="34" font-size="22" fill="#20334a" text-anchor="start">N=10；A数字(2,0)，B数字(1,9)</text><text x="24" y="82" font-size="20" fill="#20334a" text-anchor="start">同一个位进制q可取10或11；高位权q、低位权1</text><rect x="24" y="114" width="610" height="103" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="42" y="146" font-size="23" fill="#20334a" text-anchor="start">q=10</text><text x="170" y="146" font-size="21" fill="#20334a" text-anchor="start">A=2×10+0=20</text><text x="170" y="179" font-size="21" fill="#20334a" text-anchor="start">B=1×10+9=19</text><text x="42" y="195" font-size="24" fill="#20334a" text-anchor="start">差1</text><rect x="24" y="246" width="610" height="103" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="42" y="278" font-size="23" fill="#20334a" text-anchor="start">q=11</text><text x="170" y="278" font-size="21" fill="#20334a" text-anchor="start">A=2×11+0=22</text><text x="170" y="311" font-size="21" fill="#20334a" text-anchor="start">B=1×11+9=20</text><text x="42" y="327" font-size="24" fill="#20334a" text-anchor="start">差2</text><text x="24" y="414" font-size="22" fill="#20334a" text-anchor="start">差=q−9；负的个位差−9不随q改变。</text><text x="24" y="460" font-size="21" fill="#20334a" text-anchor="start">q增加1，只让高位前缀差1多乘1，总差增加1。</text><text x="24" y="506" font-size="21" fill="#20334a" text-anchor="start">先最小化真实差，最后取模；不能最小化余数。</text></g></svg>