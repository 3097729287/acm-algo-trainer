<svg xmlns="http://www.w3.org/2000/svg" width="660" height="528" viewBox="0 0 660 528" role="img"><title>派生码一一二的三个真实删除下标得到十二十二十一，两个状态取并集而不是按生成方式计数</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="33" font-size="21" fill="#20334a" text-anchor="start">缩小上界N=12：派生码112只有一个身份</text><text x="121" y="89" font-size="20" fill="#20334a" text-anchor="middle">删原第1位</text><rect x="51" y="108" width="140" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="121" y="144" font-size="27" fill="#20334a" text-anchor="middle">12</text><text x="121" y="200" font-size="18" fill="#20334a" text-anchor="middle">编号2：已删、等于</text><text x="333" y="89" font-size="20" fill="#20334a" text-anchor="middle">删原第2位</text><rect x="263" y="108" width="140" height="53" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="333" y="144" font-size="27" fill="#20334a" text-anchor="middle">12</text><text x="333" y="200" font-size="18" fill="#20334a" text-anchor="middle">编号2：已删、等于</text><text x="545" y="89" font-size="20" fill="#20334a" text-anchor="middle">删原第3位</text><rect x="475" y="108" width="140" height="53" rx="8" fill="#fff0d9" stroke="#2d6db4" stroke-width="2"/><text x="545" y="144" font-size="27" fill="#20334a" text-anchor="middle">11</text><text x="545" y="200" font-size="18" fill="#20334a" text-anchor="middle">编号3：已删、小于</text><text x="24" y="259" font-size="22" fill="#20334a" text-anchor="start">前两条见证设同一位4；第三条设位8。</text><text x="24" y="304" font-size="22" fill="#20334a" text-anchor="start">集合mask=4 | 8=12，接受这个数字一次。</text><text x="24" y="354" font-size="22" fill="#20334a" text-anchor="start">读入前缀：空 → 1 → 11 → 112</text><text x="24" y="398" font-size="22" fill="#20334a" text-anchor="start">对应mask：1 → 5 → 6 → 12</text><text x="24" y="450" font-size="21" fill="#20334a" text-anchor="start">101删首位会成01，拒绝这一条见证；</text><text x="24" y="491" font-size="21" fill="#20334a" text-anchor="start">另两条得到11、10合法，整个101仍能通过。</text></g></svg>