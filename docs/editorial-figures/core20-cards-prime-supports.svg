<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img"><title>原范围2024个质数组各取一幂，二有十四三有八五有六七有五选项；实际集合一四九二十五和其余质数达2025张，六占两种质数会少一个位置</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">17600以内2024个质数：每组必须恰选一张</text><rect x="22" y="84" width="676" height="74" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="42" y="113" font-size="19" fill="#20334a" text-anchor="start">质数2的幂：2/4/8/…/16384，共14张</text><text x="42" y="145" font-size="21" fill="#20334a" text-anchor="start">示例在本组选 4</text><rect x="22" y="180" width="676" height="74" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="42" y="209" font-size="19" fill="#20334a" text-anchor="start">质数3的幂：3/9/27/…/6561，共8张</text><text x="42" y="241" font-size="21" fill="#20334a" text-anchor="start">示例在本组选 9</text><rect x="22" y="276" width="676" height="74" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="42" y="305" font-size="19" fill="#20334a" text-anchor="start">质数5的幂：5/25/125/…/15625，共6张</text><text x="42" y="337" font-size="21" fill="#20334a" text-anchor="start">示例在本组选 25</text><rect x="22" y="372" width="676" height="74" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="42" y="401" font-size="19" fill="#20334a" text-anchor="start">质数7的幂：7/49/343/2401/16807，共5张</text><text x="42" y="433" font-size="21" fill="#20334a" text-anchor="start">示例在本组选 7</text><text x="22" y="510" font-size="21" fill="#20334a" text-anchor="start">再选其他2020个质数本身，加上1。</text><text x="22" y="556" font-size="21" fill="#20334a" text-anchor="start">真实集合 {1,4,9,25,7,11,13,…} 共2025张。</text><text x="22" y="602" font-size="20" fill="#20334a" text-anchor="start">各非1卡只占一个不同质数，全部选择可同时满足。</text><rect x="22" y="636" width="676" height="74" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="40" y="666" font-size="21" fill="#20334a" text-anchor="start">若选6，它同时占2和3两种质数，</text><text x="40" y="695" font-size="20" fill="#20334a" text-anchor="start">至少挤掉一个非1卡的位置，不能达到2025张。</text><text x="22" y="761" font-size="21" fill="#20334a" text-anchor="start">每组选择由最终卡片的质因数唯一还原。</text><text x="22" y="808" font-size="21" fill="#20334a" text-anchor="start">乘各组可选数量；不乘排列数，不重复选1。</text></g></svg>