<svg xmlns="http://www.w3.org/2000/svg" width="720" height="663" viewBox="0 0 720 663" role="img"><title>三栋楼的全部七份真实楼层合同及资本条件，目标楼前两层合并最低资本七净赚二，六元会在中途失败，亏损第三层对帮手无用但对目标高度有用</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">初始资本2；每张楼层卡写“先付a，再收b”</text><text x="22" y="116" font-size="20" fill="#20334a" text-anchor="start">楼1（目标）</text><rect x="201" y="81" width="151" height="78" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="276" y="111" font-size="20" fill="#20334a" text-anchor="middle">第1层</text><text x="276" y="144" font-size="22" fill="#20334a" text-anchor="middle">付4，收2</text><rect x="369" y="81" width="151" height="78" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="444" y="111" font-size="20" fill="#20334a" text-anchor="middle">第2层</text><text x="444" y="144" font-size="22" fill="#20334a" text-anchor="middle">付5，收9</text><rect x="537" y="81" width="151" height="78" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="612" y="111" font-size="20" fill="#20334a" text-anchor="middle">第3层</text><text x="612" y="144" font-size="22" fill="#20334a" text-anchor="middle">付12，收0</text><text x="22" y="227" font-size="20" fill="#20334a" text-anchor="start">楼2</text><rect x="201" y="192" width="151" height="78" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="276" y="222" font-size="20" fill="#20334a" text-anchor="middle">第1层</text><text x="276" y="255" font-size="22" fill="#20334a" text-anchor="middle">付3，收5</text><rect x="369" y="192" width="151" height="78" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="444" y="222" font-size="20" fill="#20334a" text-anchor="middle">第2层</text><text x="444" y="255" font-size="22" fill="#20334a" text-anchor="middle">付8，收11</text><text x="22" y="338" font-size="20" fill="#20334a" text-anchor="start">楼3</text><rect x="201" y="303" width="151" height="78" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="276" y="333" font-size="20" fill="#20334a" text-anchor="middle">第1层</text><text x="276" y="366" font-size="22" fill="#20334a" text-anchor="middle">付2，收3</text><rect x="369" y="303" width="151" height="78" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="444" y="333" font-size="20" fill="#20334a" text-anchor="middle">第2层</text><text x="444" y="366" font-size="22" fill="#20334a" text-anchor="middle">付5，收7</text><text x="22" y="452" font-size="20" fill="#20334a" text-anchor="start">楼1前两层：r=max(4,5−(2−4))=7，g=(2−4)+(9−5)=2</text><text x="22" y="497" font-size="22" fill="#20334a" text-anchor="start">从7开始：7→5→9；从6开始：6→4，付不起第二层的5</text><text x="22" y="542" font-size="21" fill="#20334a" text-anchor="start">第一层只亏2，不能作为帮手提前提供资金；完成两层才净赚2</text><text x="22" y="588" font-size="20" fill="#20334a" text-anchor="start">楼1第三层净亏12：当帮手时丢掉，当目标时仍可让高度从2增到3</text><text x="22" y="635" font-size="21" fill="#20334a" text-anchor="start">楼2两块分别(3,+2)、(8,+3)；楼3两块分别(2,+1)、(5,+2)</text></g></svg>