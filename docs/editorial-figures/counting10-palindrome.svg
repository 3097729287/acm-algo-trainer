<svg xmlns="http://www.w3.org/2000/svg" width="640" height="730" viewBox="0 0 640 730" role="img"><title>成对位置和与真实回文必要充分的对照</title><rect width="640" height="730" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16867b"/></marker></defs><text x="24" y="32" class="title" text-anchor="start">真正中心、最小区间与半径</text><text x="24" y="65" class="small" text-anchor="start">本图全部为零基下标；弧线连接相同值的两份</text><line x1="354" y1="95" x2="354" y2="245" stroke="#ad7830" stroke-width="2" stroke-dasharray="5 4"/><rect x="150" y="148" width="402" height="52" rx="5" fill="#f0fbf7" stroke="#16867b"/><path d="M182,152 Q354,85 526,152" fill="none" stroke="#497db0" stroke-width="3"/><path d="M268,152 Q354,119 440,152" fill="none" stroke="#497db0" stroke-width="3"/><rect x="70" y="155" width="52" height="40" rx="5" fill="#eef2f5" stroke="#7394aa"/><text x="96.0" y="182.0" class="" text-anchor="middle">2</text><text x="96" y="220" class="small" text-anchor="middle">0</text><rect x="156" y="155" width="52" height="40" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="182.0" y="182.0" class="" text-anchor="middle">0</text><text x="182" y="220" class="small" text-anchor="middle">1</text><rect x="242" y="155" width="52" height="40" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="268.0" y="182.0" class="" text-anchor="middle">1</text><text x="268" y="220" class="small" text-anchor="middle">2</text><rect x="328" y="155" width="52" height="40" rx="5" fill="#fff0b7" stroke="#7394aa"/><text x="354.0" y="182.0" class="" text-anchor="middle">2</text><text x="354" y="220" class="small" text-anchor="middle">3</text><rect x="414" y="155" width="52" height="40" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="440.0" y="182.0" class="" text-anchor="middle">1</text><text x="440" y="220" class="small" text-anchor="middle">4</text><rect x="500" y="155" width="52" height="40" rx="5" fill="#b8e2d3" stroke="#7394aa"/><text x="526.0" y="182.0" class="" text-anchor="middle">0</text><text x="526" y="220" class="small" text-anchor="middle">5</text><text x="96" y="248" class="small" text-anchor="middle">外侧2</text><text x="354" y="253" class="small" text-anchor="middle">中心c=3；L=1，R=5</text><text x="24" y="298" class="small" text-anchor="start">零：(1,5)和6；一：(2,4)和6；二：(0,3)和3</text><text x="24" y="335" class="small" text-anchor="start">排除中心值2的首次0，改取minP2=1</text><text x="24" y="372" class="small" text-anchor="start">d1[3]=3，覆盖[1,5]=0,1,2,1,0，MEX=3</text><text x="24" y="426" class="" text-anchor="start">位置和相同，却不是回文：</text><path d="M68,500 Q313.0,440 558,500" fill="none" stroke="#497db0" stroke-width="3"/><path d="M208,500 Q313.0,469 418,500" fill="none" stroke="#497db0" stroke-width="3"/><rect x="45" y="503" width="46" height="40" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="68.0" y="530.0" class="" text-anchor="middle">0</text><text x="68" y="567" class="small" text-anchor="middle">0</text><rect x="115" y="503" width="46" height="40" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="138.0" y="530.0" class="" text-anchor="middle">2</text><text x="138" y="567" class="small" text-anchor="middle">1</text><rect x="185" y="503" width="46" height="40" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="208.0" y="530.0" class="" text-anchor="middle">1</text><text x="208" y="567" class="small" text-anchor="middle">2</text><rect x="255" y="503" width="46" height="40" rx="5" fill="#f8ced0" stroke="#7394aa"/><text x="278.0" y="530.0" class="" text-anchor="middle">2</text><text x="278" y="567" class="small" text-anchor="middle">3</text><rect x="325" y="503" width="46" height="40" rx="5" fill="#f8ced0" stroke="#7394aa"/><text x="348.0" y="530.0" class="" text-anchor="middle">3</text><text x="348" y="567" class="small" text-anchor="middle">4</text><rect x="395" y="503" width="46" height="40" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="418.0" y="530.0" class="" text-anchor="middle">1</text><text x="418" y="567" class="small" text-anchor="middle">5</text><rect x="465" y="503" width="46" height="40" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="488.0" y="530.0" class="" text-anchor="middle">3</text><text x="488" y="567" class="small" text-anchor="middle">6</text><rect x="535" y="503" width="46" height="40" rx="5" fill="#d9edf8" stroke="#7394aa"/><text x="558.0" y="530.0" class="" text-anchor="middle">0</text><text x="558" y="567" class="small" text-anchor="middle">7</text><text x="24" y="611" class="small" text-anchor="start">零：0+7=7；一：2+5=7，但中央2 ≠ 3</text><text x="24" y="650" class="small" text-anchor="start">候选[0,7]失败：d2[4]=0 &lt; 所需4</text><text x="24" y="698" class="small" text-anchor="start">位置和只确定中心，半径核实区间的全部值</text></svg>