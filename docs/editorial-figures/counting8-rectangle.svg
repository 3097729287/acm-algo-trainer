<svg xmlns="http://www.w3.org/2000/svg" width="640" height="706" viewBox="0 0 640 706" role="img"><title>Hard Demon：四角真实区域与查询局部编号对应同一格</title><rect width="640" height="706" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">四阶矩阵，查询行2..3、列3..4</text><text x="24" y="71" class="small" text-anchor="start">上方橙、左方蓝、两者重叠紫；绿色为查询</text><text x="129" y="111" class="small" text-anchor="middle">列1</text><text x="220" y="111" class="small" text-anchor="middle">列2</text><text x="311" y="111" class="small" text-anchor="middle">列3</text><text x="402" y="111" class="small" text-anchor="middle">列4</text><text x="24" y="166" class="small" text-anchor="start">行1</text><rect x="89" y="130" width="80" height="58" rx="5" fill="#e3d5f2" stroke="#7394aa"/><text x="129" y="167" class="" text-anchor="middle">1</text><rect x="180" y="130" width="80" height="58" rx="5" fill="#e3d5f2" stroke="#7394aa"/><text x="220" y="167" class="" text-anchor="middle">1</text><rect x="271" y="130" width="80" height="58" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="311" y="167" class="" text-anchor="middle">1</text><rect x="362" y="130" width="80" height="58" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="402" y="167" class="" text-anchor="middle">1</text><text x="24" y="236" class="small" text-anchor="start">行2</text><rect x="89" y="200" width="80" height="58" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="129" y="237" class="" text-anchor="middle">1</text><rect x="180" y="200" width="80" height="58" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="220" y="237" class="" text-anchor="middle">1</text><rect x="271" y="200" width="80" height="58" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="311" y="237" class="" text-anchor="middle">2</text><text x="340" y="215" class="small" text-anchor="middle">#1</text><rect x="362" y="200" width="80" height="58" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="402" y="237" class="" text-anchor="middle">3</text><text x="431" y="215" class="small" text-anchor="middle">#2</text><text x="24" y="306" class="small" text-anchor="start">行3</text><rect x="89" y="270" width="80" height="58" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="129" y="307" class="" text-anchor="middle">1</text><rect x="180" y="270" width="80" height="58" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="220" y="307" class="" text-anchor="middle">1</text><rect x="271" y="270" width="80" height="58" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="311" y="307" class="" text-anchor="middle">5</text><text x="340" y="285" class="small" text-anchor="middle">#3</text><rect x="362" y="270" width="80" height="58" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="402" y="307" class="" text-anchor="middle">7</text><text x="431" y="285" class="small" text-anchor="middle">#4</text><text x="24" y="376" class="small" text-anchor="start">行4</text><rect x="89" y="340" width="80" height="58" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="129" y="377" class="" text-anchor="middle">1</text><rect x="180" y="340" width="80" height="58" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="220" y="377" class="" text-anchor="middle">1</text><rect x="271" y="340" width="80" height="58" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="311" y="377" class="" text-anchor="middle">1</text><rect x="362" y="340" width="80" height="58" rx="5" fill="#eef1f4" stroke="#7394aa"/><text x="402" y="377" class="" text-anchor="middle">1</text><text x="478" y="161" class="small" text-anchor="start">绿色展开：</text><rect x="476" y="182" width="116" height="39" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="534" y="208" class="small" text-anchor="middle">#1：2</text><rect x="476" y="231" width="116" height="39" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="534" y="257" class="small" text-anchor="middle">#2：3</text><rect x="476" y="280" width="116" height="39" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="534" y="306" class="small" text-anchor="middle">#3：5</text><rect x="476" y="329" width="116" height="39" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="534" y="355" class="small" text-anchor="middle">#4：7</text><text x="24" y="452" class="small" text-anchor="start">T：大前缀25 − 上方4 − 左方6 + 重叠2 = 17</text><text x="24" y="495" class="small" text-anchor="start">U：77−10−9+3 = 61；V：60−4−12+2 = 46</text><text x="24" y="541" class="small" text-anchor="start">w=2；行偏移和V−2T=12，列偏移和U−3T=10</text><text x="24" y="586" class="" text-anchor="start">答案：2×12 + 10 + 17 = 51</text><text x="24" y="631" class="" text-anchor="start">直接：2×1 + 3×2 + 5×3 + 7×4 = 51</text><text x="24" y="676" class="small" text-anchor="start">值7编号：(3−2)×2 + (4−3)+1 = 4</text></svg>