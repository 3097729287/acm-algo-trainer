<svg xmlns="http://www.w3.org/2000/svg" width="760" height="833" viewBox="0 0 760 833" role="img"><title>三位实际数a零一一x一零一按低位到高位查两张标准表，B在中间位失败A在最高位失败；自定义A零零项一不允许在有限位宽之外生成新高位</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="38" fill="#17324d" font-size="24" text-anchor="start">标准二进制表：a=3，x=y=5；从低位读</text><text x="28" y="122" fill="#17324d" font-size="22" text-anchor="start">位p</text><rect x="218" y="90" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="274" y="121" fill="#17324d" font-size="25" text-anchor="middle">0</text><rect x="369" y="90" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="425" y="121" fill="#17324d" font-size="25" text-anchor="middle">1</text><rect x="520" y="90" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="576" y="121" fill="#17324d" font-size="25" text-anchor="middle">2</text><text x="28" y="185" fill="#17324d" font-size="22" text-anchor="start">a=011</text><rect x="218" y="153" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="274" y="184" fill="#17324d" font-size="25" text-anchor="middle">1</text><rect x="369" y="153" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="425" y="184" fill="#17324d" font-size="25" text-anchor="middle">1</text><rect x="520" y="153" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="576" y="184" fill="#17324d" font-size="25" text-anchor="middle">0</text><text x="28" y="248" fill="#17324d" font-size="22" text-anchor="start">x=101</text><rect x="218" y="216" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="274" y="247" fill="#17324d" font-size="25" text-anchor="middle">1</text><rect x="369" y="216" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="425" y="247" fill="#17324d" font-size="25" text-anchor="middle">0</text><rect x="520" y="216" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="576" y="247" fill="#17324d" font-size="25" text-anchor="middle">1</text><text x="28" y="311" fill="#17324d" font-size="22" text-anchor="start">目标y</text><rect x="218" y="279" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="274" y="310" fill="#17324d" font-size="25" text-anchor="middle">1</text><rect x="369" y="279" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="425" y="310" fill="#17324d" font-size="25" text-anchor="middle">0</text><rect x="520" y="279" width="112" height="45" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="576" y="310" fill="#17324d" font-size="25" text-anchor="middle">1</text><text x="28" y="374" fill="#17324d" font-size="22" text-anchor="start">A结果</text><rect x="218" y="342" width="112" height="45" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="274" y="373" fill="#17324d" font-size="25" text-anchor="middle">1</text><rect x="369" y="342" width="112" height="45" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="425" y="373" fill="#17324d" font-size="25" text-anchor="middle">0</text><rect x="520" y="342" width="112" height="45" rx="4" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="576" y="373" fill="#17324d" font-size="25" text-anchor="middle">0</text><text x="28" y="437" fill="#17324d" font-size="22" text-anchor="start">B结果</text><rect x="218" y="405" width="112" height="45" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="274" y="436" fill="#17324d" font-size="25" text-anchor="middle">1</text><rect x="369" y="405" width="112" height="45" rx="4" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="425" y="436" fill="#17324d" font-size="25" text-anchor="middle">1</text><rect x="520" y="405" width="112" height="45" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="576" y="436" fill="#17324d" font-size="25" text-anchor="middle">1</text><text x="24" y="512" fill="#17324d" font-size="22" text-anchor="start">p=0：两个真 → p=1：仅A真 → p=2：全假。</text><text x="24" y="558" fill="#17324d" font-size="22" text-anchor="start">不能让每一位换一张表；本次ans不变。</text><line x1="24" y1="587" x2="730" y2="587" stroke="#64748b" stroke-width="3"/><text x="24" y="630" fill="#17324d" font-size="21" text-anchor="start">另取自定义A=[[1,0],[0,0]]，a=x=1、y=10。</text><text x="24" y="681" fill="#17324d" font-size="21" text-anchor="start">实际只运算P=1位：A[1][1]=0，结果就是0。</text><text x="24" y="732" fill="#17324d" font-size="22" text-anchor="start">高位结果为0，不可再查A[0][0]=1造出10。</text><text x="24" y="787" fill="#17324d" font-size="22" text-anchor="start">存储可有L=2位，不等于运算也有2位。</text></svg>