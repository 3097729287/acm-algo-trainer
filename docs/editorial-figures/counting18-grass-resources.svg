<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1005" viewBox="0 0 640 1005" role="img"><title>带身份草的真实分配、两类旧残值和四个转移候选的可实现轨迹</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247b65"/></marker></defs><rect width="640" height="1005" fill="#f7fafc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="35" font-size="24" text-anchor="start" fill="#123750">一株有身份的草，只能给一朵花</text><text x="24" y="78" font-size="19" text-anchor="start" fill="#123750">三朵原值均一；三草按输入顺序为4/3/5</text><circle cx="80" cy="150" r="28" fill="#cfe3f5" stroke="#7e9cb6"/><text x="80" y="157" font-size="20" text-anchor="middle" fill="#123750">1</text><text x="80" y="205" font-size="19" text-anchor="middle" fill="#123750">花1</text><circle cx="320" cy="150" r="28" fill="#cfe3f5" stroke="#7e9cb6"/><text x="320" y="157" font-size="20" text-anchor="middle" fill="#123750">1</text><text x="320" y="205" font-size="19" text-anchor="middle" fill="#123750">花2</text><circle cx="560" cy="150" r="28" fill="#cfe3f5" stroke="#7e9cb6"/><text x="560" y="157" font-size="20" text-anchor="middle" fill="#123750">1</text><text x="560" y="205" font-size="19" text-anchor="middle" fill="#123750">花3</text><circle cx="170" cy="285" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="170" y="292" font-size="20" text-anchor="middle" fill="#123750">4</text><text x="170" y="336" font-size="18" text-anchor="middle" fill="#123750">草1</text><circle cx="230" cy="285" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="230" y="292" font-size="20" text-anchor="middle" fill="#123750">3</text><text x="230" y="336" font-size="18" text-anchor="middle" fill="#123750">草2</text><circle cx="440" cy="285" r="22" fill="#bfe4ce" stroke="#7e9cb6"/><text x="440" y="292" font-size="20" text-anchor="middle" fill="#123750">5</text><text x="440" y="336" font-size="18" text-anchor="middle" fill="#123750">草3</text><path d="M160 265 L93 175" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M242 265 L308 175" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 265 L547 175" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="386" font-size="19" text-anchor="start" fill="#123750">四给第一朵、三给第二朵、五给第三朵</text><rect x="28" y="428" width="270" height="48" rx="6" fill="#cfe3f5" stroke="#91a9be"/><text x="163.0" y="459.0" font-size="20" text-anchor="middle" fill="#123750">旧A=3，余4</text><rect x="342" y="428" width="270" height="48" rx="6" fill="#dfd6ef" stroke="#91a9be"/><text x="477.0" y="459.0" font-size="20" text-anchor="middle" fill="#123750">旧B=4，余3</text><text x="24" y="530" font-size="19" text-anchor="start" fill="#123750">处理花2：保留右缝五，或只留下零</text><text x="42" y="577" font-size="19" text-anchor="start" fill="#123750">来源</text><text x="270" y="577" font-size="19" text-anchor="middle" fill="#123750">留五的A</text><text x="492" y="577" font-size="19" text-anchor="middle" fill="#123750">留零的B</text><text x="42" y="641" font-size="19" text-anchor="start" fill="#123750">旧A</text><rect x="178" y="610" width="184" height="48" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="270.0" y="641.0" font-size="20" text-anchor="middle" fill="#123750">3+4=7</text><rect x="400" y="610" width="184" height="48" rx="6" fill="#fff0b3" stroke="#91a9be"/><text x="492.0" y="641.0" font-size="20" text-anchor="middle" fill="#123750">3+5=8</text><text x="42" y="708" font-size="19" text-anchor="start" fill="#123750">旧B</text><rect x="178" y="677" width="184" height="48" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="270.0" y="708.0" font-size="20" text-anchor="middle" fill="#123750">4+3=7</text><rect x="400" y="677" width="184" height="48" rx="6" fill="#fff0b3" stroke="#91a9be"/><text x="492.0" y="708.0" font-size="20" text-anchor="middle" fill="#123750">4+5=9</text><text x="24" y="791" font-size="19" text-anchor="start" fill="#123750">新A=7、余5；新B=9、余0</text><rect x="28" y="827" width="270" height="48" rx="6" fill="#bfe4ce" stroke="#91a9be"/><text x="163.0" y="858.0" font-size="20" text-anchor="middle" fill="#123750">A：7+5=12</text><rect x="342" y="827" width="270" height="48" rx="6" fill="#e8edf1" stroke="#91a9be"/><text x="477.0" y="858.0" font-size="20" text-anchor="middle" fill="#123750">B：9+1=10</text><text x="24" y="922" font-size="19" text-anchor="start" fill="#123750">最终(4,3,5)按原输入三次执行即可实现</text><text x="24" y="965" font-size="19" text-anchor="start" fill="#123750">四个候选都带着自己的旧总分和旧残值</text></g></svg>