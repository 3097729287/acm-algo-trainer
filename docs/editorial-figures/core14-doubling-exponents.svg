<svg xmlns="http://www.w3.org/2000/svg" width="660" height="612" viewBox="0 0 660 612" role="img"><title>官方六项原始值与指数差及继承后的实际翻倍次数完整对照，三十二例说明负指数必须截零</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="32" font-size="21" fill="#20334a" text-anchor="start">原值a不写成最终值；e是之前累积的指数</text><text x="110" y="80" font-size="18" fill="#20334a" text-anchor="middle">本项原值b</text><text x="277" y="80" font-size="18" fill="#20334a" text-anchor="middle">相邻原值差d</text><text x="443" y="80" font-size="18" fill="#20334a" text-anchor="middle">本项次数f</text><text x="570" y="80" font-size="18" fill="#20334a" text-anchor="middle">实际最终值</text><rect x="24" y="98" width="610" height="34" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="110" y="122" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="277" y="122" font-size="21" fill="#20334a" text-anchor="middle">首项</text><text x="443" y="122" font-size="21" fill="#20334a" text-anchor="middle">0</text><text x="570" y="122" font-size="21" fill="#20334a" text-anchor="middle">4</text><rect x="24" y="141" width="610" height="34" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="110" y="165" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="277" y="165" font-size="21" fill="#20334a" text-anchor="middle">+1</text><text x="443" y="165" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="570" y="165" font-size="21" fill="#20334a" text-anchor="middle">6</text><rect x="24" y="184" width="610" height="34" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="110" y="208" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="277" y="208" font-size="21" fill="#20334a" text-anchor="middle">+1</text><text x="443" y="208" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="570" y="208" font-size="21" fill="#20334a" text-anchor="middle">8</text><rect x="24" y="227" width="610" height="34" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="110" y="251" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="277" y="251" font-size="21" fill="#20334a" text-anchor="middle">+1</text><text x="443" y="251" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="570" y="251" font-size="21" fill="#20334a" text-anchor="middle">8</text><rect x="24" y="270" width="610" height="34" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="110" y="294" font-size="21" fill="#20334a" text-anchor="middle">7</text><text x="277" y="294" font-size="21" fill="#20334a" text-anchor="middle">−2</text><text x="443" y="294" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="570" y="294" font-size="21" fill="#20334a" text-anchor="middle">14</text><rect x="24" y="313" width="610" height="34" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="110" y="337" font-size="21" fill="#20334a" text-anchor="middle">9</text><text x="277" y="337" font-size="21" fill="#20334a" text-anchor="middle">0</text><text x="443" y="337" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="570" y="337" font-size="21" fill="#20334a" text-anchor="middle">18</text><text x="24" y="401" font-size="21" fill="#20334a" text-anchor="start">到7时：a=1，e=3；d=−2，f=1，得到14。</text><text x="24" y="444" font-size="21" fill="#20334a" text-anchor="start">总操作0+1+2+3+1+1=8；相等也允许。</text><text x="24" y="491" font-size="20" fill="#20334a" text-anchor="start">再看原值[8,1,32,1]，实际次数[0,3,0,5]：</text><text x="24" y="534" font-size="20" fill="#20334a" text-anchor="start">到32时e+d=3−5=−2，只能取0，禁止除四。</text><text x="24" y="577" font-size="20" fill="#20334a" text-anchor="start">最终[8,8,32,32]；原current和指数分别保存。</text></g></svg>