<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620" role="img"><title>六乘四平面上横高一三竖横坐标二五的四条激光与L形路线四个穿越点，单横单竖的交点对照仍计两次</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="34" font-size="22" fill="#20334a" text-anchor="start">两横两竖：L 形路线各穿一次，合计四次</text><rect x="54" y="70" width="366" height="230" rx="8" fill="#f8fafc" stroke="#8995a5" stroke-width="2"/><line x1="54" y1="242.5" x2="420" y2="242.5" stroke="#2563eb" stroke-width="3"/><text x="444" y="249.5" font-size="20" fill="#20334a" text-anchor="start">横 y=1</text><line x1="54" y1="127.5" x2="420" y2="127.5" stroke="#2563eb" stroke-width="3"/><text x="444" y="134.5" font-size="20" fill="#20334a" text-anchor="start">横 y=3</text><line x1="176" y1="70" x2="176" y2="300" stroke="#087b48" stroke-width="3"/><text x="176" y="59" font-size="18" fill="#20334a" text-anchor="middle">竖 x=2</text><line x1="359" y1="70" x2="359" y2="300" stroke="#087b48" stroke-width="3"/><text x="359" y="59" font-size="18" fill="#20334a" text-anchor="middle">竖 x=5</text><polyline points="54,300 420,300 420,70" fill="none" stroke="#b4235e" stroke-width="4"/><circle cx="176" cy="300" r="7" fill="#fff7d6" stroke="#b4235e" stroke-width="2"/><circle cx="359" cy="300" r="7" fill="#fff7d6" stroke="#b4235e" stroke-width="2"/><circle cx="420" cy="242.5" r="7" fill="#fff7d6" stroke="#b4235e" stroke-width="2"/><circle cx="420" cy="127.5" r="7" fill="#fff7d6" stroke="#b4235e" stroke-width="2"/><text x="24" y="335" font-size="19" fill="#20334a" text-anchor="start">起点 (0,0)</text><text x="440" y="91" font-size="19" fill="#20334a" text-anchor="start">终点 (6,4)</text><text x="24" y="376" font-size="21" fill="#20334a" text-anchor="start">交点的对照例：x=y=2，只有一横一竖</text><rect x="64" y="402" width="140" height="140" rx="8" fill="#f8fafc" stroke="#8995a5" stroke-width="2"/><line x1="64" y1="472" x2="204" y2="472" stroke="#2563eb" stroke-width="3"/><line x1="134" y1="402" x2="134" y2="542" stroke="#087b48" stroke-width="3"/><line x1="64" y1="542" x2="204" y2="402" stroke="#b4235e" stroke-width="3"/><circle cx="134" cy="472" r="8" fill="#fff7d6" stroke="#b4235e" stroke-width="2"/><text x="238" y="449" font-size="21" fill="#20334a" text-anchor="start">同一地点遇到两条激光，</text><text x="238" y="491" font-size="21" fill="#20334a" text-anchor="start">仍算 2 次，不能合成 1 次。</text><text x="24" y="588" font-size="21" fill="#20334a" text-anchor="start">每条线都隔开起终点；实际路线又同时达到下界。</text></g></svg>