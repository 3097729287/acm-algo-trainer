<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img"><title>旧最小值和旧最大值交叉写入两个固定位置，第一写后的临时重复值不会被再次查询</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="37" font-size="22" fill="#20334a" text-anchor="start">同一次交换的写入依赖：必须使用查询时保存的两个值</text><rect x="30" y="67" width="300" height="80" rx="8" fill="#eff6ff" stroke="#087b48" stroke-width="2"/><text x="180" y="98" font-size="22" fill="#087b48" text-anchor="middle">旧最小值 rmn</text><text x="180" y="132" font-size="25" fill="#20334a" text-anchor="middle">1</text><rect x="390" y="67" width="300" height="80" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="540" y="98" font-size="22" fill="#2d6db4" text-anchor="middle">旧最大值 rmx</text><text x="540" y="132" font-size="25" fill="#20334a" text-anchor="middle">8</text><path d="M540,150 L180,205" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="180,205 189.13017183300965,198.54709659922628 190.64042582042478,208.43239542594347" fill="#2d6db4"/><path d="M180,150 L540,205" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="540,205 529.3595741795752,208.43239542594347 530.8698281669904,198.54709659922628" fill="#087b48"/><rect x="30" y="211" width="300" height="80" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="180" y="242" font-size="21" fill="#20334a" text-anchor="middle">位置2：写入旧最大值</text><text x="180" y="276" font-size="25" fill="#20334a" text-anchor="middle">8</text><rect x="390" y="211" width="300" height="80" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="540" y="242" font-size="21" fill="#20334a" text-anchor="middle">位置3：写入旧最小值</text><text x="540" y="276" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="25" y="338" font-size="22" fill="#20334a" text-anchor="start">第一次 update 后：叶子值 [3,8,8,2,7,4,6,5]</text><text x="25" y="381" font-size="22" fill="#20334a" text-anchor="start">第二次 update 后：叶子值 [3,8,1,2,7,4,6,5]</text><text x="25" y="424" font-size="21" fill="#20334a" text-anchor="start">两次写入之间不再查询，暂时出现两个 8 不改变本轮目标</text><text x="25" y="466" font-size="22" fill="#20334a" text-anchor="start">全部写完再同步 val；下一轮读取完整交换后的排列</text></g></svg>