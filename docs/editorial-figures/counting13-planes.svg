<svg xmlns="http://www.w3.org/2000/svg" width="640" height="873" viewBox="0 0 640 873" role="img"><title>真实飞机开始窗口、占用和集合状态更新</title><rect width="640" height="873" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#16867b"/></marker></defs><text x="24" y="35" class="title" text-anchor="start">开始窗口与真实跑道占用用同一时间轴</text><text x="24" y="73" class="small" text-anchor="start">A(0,8,2) / B(2,2,2) / C(0,0,4)</text><line x1="110" y1="98" x2="110" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="110" y="118" class="small" text-anchor="middle">0</text><line x1="153" y1="98" x2="153" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="153" y="118" class="small" text-anchor="middle">1</text><line x1="196" y1="98" x2="196" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="196" y="118" class="small" text-anchor="middle">2</text><line x1="239" y1="98" x2="239" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="239" y="118" class="small" text-anchor="middle">3</text><line x1="282" y1="98" x2="282" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="282" y="118" class="small" text-anchor="middle">4</text><line x1="325" y1="98" x2="325" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="325" y="118" class="small" text-anchor="middle">5</text><line x1="368" y1="98" x2="368" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="368" y="118" class="small" text-anchor="middle">6</text><line x1="411" y1="98" x2="411" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="411" y="118" class="small" text-anchor="middle">7</text><line x1="454" y1="98" x2="454" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="454" y="118" class="small" text-anchor="middle">8</text><line x1="497" y1="98" x2="497" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="497" y="118" class="small" text-anchor="middle">9</text><line x1="540" y1="98" x2="540" y2="300" stroke="#d4dfe7" stroke-width="1" stroke-dasharray=""/><text x="540" y="118" class="small" text-anchor="middle">10</text><text x="24" y="161" class="" text-anchor="start">A开始</text><rect x="110" y="144" width="344" height="18" rx="1" fill="#ffdf98" stroke="#7394aa"/><text x="464" y="161" class="small" text-anchor="start">最晚8</text><text x="24" y="216" class="" text-anchor="start">B开始</text><rect x="196" y="199" width="86" height="18" rx="1" fill="#ffdf98" stroke="#7394aa"/><text x="292" y="216" class="small" text-anchor="start">最晚4</text><text x="24" y="271" class="" text-anchor="start">C开始</text><circle cx="110" cy="263" r="7" fill="#ffdf98" stroke="#52677b"/><text x="120" y="271" class="small" text-anchor="start">最晚0</text><text x="24" y="339" class="" text-anchor="start">选择顺序C → B → A，无同时占用</text><rect x="110" y="367" width="172" height="50" rx="5" fill="#bfe8d5" stroke="#7394aa"/><text x="196.0" y="399.0" class="" text-anchor="middle">C：0..4</text><rect x="282" y="367" width="86" height="50" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="325.0" y="399.0" class="" text-anchor="middle">B：4..6</text><rect x="368" y="367" width="86" height="50" rx="5" fill="#dfd1ef" stroke="#7394aa"/><text x="411.0" y="399.0" class="" text-anchor="middle">A：6..8</text><line x1="110" y1="423" x2="110" y2="434" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="110" y="458" class="small" text-anchor="middle">0</text><line x1="282" y1="423" x2="282" y2="434" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="282" y="458" class="small" text-anchor="middle">4</text><line x1="368" y1="423" x2="368" y2="434" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="368" y="458" class="small" text-anchor="middle">6</text><line x1="454" y1="423" x2="454" y2="434" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="454" y="458" class="small" text-anchor="middle">8</text><line x1="540" y1="423" x2="540" y2="434" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="540" y="458" class="small" text-anchor="middle">10</text><text x="24" y="506" class="" text-anchor="start">集合：000 → 100(C) → 110(C/B) → 111</text><text x="24" y="550" class="" text-anchor="start">最早结束：0 → 4 → 6 → 8</text><rect x="24" y="579" width="592" height="123" rx="5" fill="#c8dff4" stroke="#7394aa"/><text x="44" y="613" class="" text-anchor="start">加B：start=max(f100=4, TB=2)=4</text><text x="44" y="648" class="" text-anchor="start">检查4≤2+2；更新f110=min(旧值,4+2)=6</text><text x="44" y="681" class="small" text-anchor="start">开始4合格；结束6超过截止4也允许</text><text x="24" y="750" class="" text-anchor="start">同集合AB：A后B结束4；B后A结束6</text><text x="24" y="793" class="" text-anchor="start">保留4可等到6，再照搬任何后续</text><text x="24" y="836" class="" text-anchor="start">先做A再做C：start=max(2,0)=2&gt;0，剪枝</text></svg>