nt-size="18" fill="#20334a" text-anchor="start">红：同坐标；橙：中心对称</text><text x="22" y="494" font-size="21" fill="#20334a" text-anchor="start">10−1−3=6个真实底点对；顶点有2选，贡献12。</text><text x="22" y="543" font-size="21" fill="#20334a" text-anchor="start">保留：Q1S、Q2S、Q1T、Q2T、RS、RT。</text><text x="22" y="592" font-size="20" fill="#20334a" text-anchor="start">全例按顶点P/Q/R/S/T贡献12/2/1/2/2，合计19。</text><text x="22" y="641" font-size="20" fill="#20334a" text-anchor="start">所有扣掉的对都在先数的等距组内，且两类不相交。</text></g></svg>