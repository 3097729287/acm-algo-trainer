<svg xmlns="http://www.w3.org/2000/svg" width="720" height="681" viewBox="0 0 720 681" role="img"><title>实际七原点P与Q各两份的十字坐标，固定P等距底点Q一Q二RST的十无序身份对矩阵，扣同坐标一对和中心对称三对，六合法对乘P两身份得十二，全例十九</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">固定顶点P：等距的五个底点身份产生10对</text><circle cx="195" cy="230" r="100" fill="none" stroke="#94a3b8" stroke-width="2"/><circle cx="195" cy="230" r="7" fill="#0f172a"/><text x="195" y="211" font-size="22" fill="#20334a" text-anchor="middle">P×2</text><circle cx="95" cy="230" r="7" fill="#0f172a"/><text x="95" y="211" font-size="22" fill="#20334a" text-anchor="middle">Q×2</text><circle cx="295" cy="230" r="7" fill="#0f172a"/><text x="295" y="211" font-size="22" fill="#20334a" text-anchor="middle">R</text><circle cx="195" cy="130" r="7" fill="#0f172a"/><text x="195" y="111" font-size="22" fill="#20334a" text-anchor="middle">S</text><circle cx="195" cy="330" r="7" fill="#0f172a"/><text x="195" y="311" font-size="22" fill="#20334a" text-anchor="middle">T</text><text x="22" y="392" font-size="20" fill="#20334a" text-anchor="start">P(2,2)×2，Q(1,2)×2；</text><text x="22" y="431" font-size="20" fill="#20334a" text-anchor="start">R(3,2)，S(2,3)，T(2,1)。</text><text x="401" y="93" font-size="18" fill="#20334a" text-anchor="middle">Q1</text><text x="458" y="93" font-size="18" fill="#20334a" text-anchor="middle">Q2</text><text x="515" y="93" font-size="18" fill="#20334a" text-anchor="middle">R</text><text x="572" y="93" font-size="18" fill="#20334a" text-anchor="middle">S</text><text x="629" y="93" font-size="18" fill="#20334a" text-anchor="middle">T</text><text x="353" y="129" font-size="18" fill="#20334a" text-anchor="middle">Q1</text><rect x="435" y="106" width="47" height="43" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="458" y="135" font-size="23" fill="#20334a" text-anchor="middle">×</t