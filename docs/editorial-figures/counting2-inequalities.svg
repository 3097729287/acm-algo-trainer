<svg xmlns="http://www.w3.org/2000/svg" width="640" height="473" viewBox="0 0 640 473" role="img"><title>lt and le：零边缩点后各组增量的完整来源</title><rect width="640" height="473" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52677b"/></marker></defs><text x="24" y="34" class="title" text-anchor="start">缩一二为同组：每条入边都必须满足</text><text x="24" y="67" class="" text-anchor="start">N=5，七条约束；一二之间有两条非严格边</text><line x1="165" y1="188" x2="275" y2="125" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="203" y="136" class="" text-anchor="start">+1</text><line x1="165" y1="208" x2="334" y2="281" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="220" y="266" class="" text-anchor="start">+0</text><line x1="165" y1="198" x2="501" y2="198" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="316" y="186" class="" text-anchor="start">+0</text><line x1="315" y1="139" x2="363" y2="264" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="387" y="240" class="" text-anchor="start">+0</text><line x1="401" y1="281" x2="515" y2="213" stroke="#52677b" stroke-width="2" stroke-dasharray="" marker-end="url(#arr)"/><text x="456" y="268" class="" text-anchor="start">+1</text><rect x="40" y="170" width="125" height="63" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="102.5" y="196" class="" text-anchor="middle">组 {1,2}</text><text x="102.5" y="221" class="" text-anchor="middle">d = 0</text><rect x="275" y="94" width="90" height="63" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="320.0" y="120" class="" text-anchor="middle">组 {3}</text><text x="320.0" y="145" class="" text-anchor="middle">d = 1</text><rect x="334" y="264" width="90" height="63" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="379.0" y="290" class="" text-anchor="middle">组 {4}</text><text x="379.0" y="315" class="" text-anchor="middle">d = 1</text><rect x="501" y="170" width="104" height="63" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="553.0" y="196" class="" text-anchor="middle">组 {5}</text><text x="553.0" y="221" class="" text-anchor="middle">d = 2</text><text x="24" y="375" class="" text-anchor="start">组四：max(0 + 0, 1 + 0) = 1</text><text x="24" y="411" class="" text-anchor="start">组五：max(0 + 0, 1 + 1) = 2</text><text x="24" y="447" class="" text-anchor="start">组内共值，再全部加一：A = [1, 1, 2, 2, 3]</text></svg>