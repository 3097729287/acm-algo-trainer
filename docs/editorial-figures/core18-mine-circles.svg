<svg xmlns="http://www.w3.org/2000/svg" width="720" height="694" viewBox="0 0 720 694" role="img"><title>真实整数平面上火箭零一半径一触及一一的两颗同心雷，最大圆三触四一边界雷再链传五一六一，七二雷在末圆外，两个重复火箭只发现A一次</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">原六颗雷：A有两颗；两火箭覆盖A的同一个坐标</text><path d="M84 85 V405" stroke="#e2e8f0"/><path d="M132 85 V405" stroke="#e2e8f0"/><path d="M180 85 V405" stroke="#e2e8f0"/><text x="180" y="429" font-size="17" fill="#20334a" text-anchor="middle">0</text><path d="M228 85 V405" stroke="#e2e8f0"/><text x="228" y="429" font-size="17" fill="#20334a" text-anchor="middle">1</text><path d="M276 85 V405" stroke="#e2e8f0"/><text x="276" y="429" font-size="17" fill="#20334a" text-anchor="middle">2</text><path d="M324 85 V405" stroke="#e2e8f0"/><text x="324" y="429" font-size="17" fill="#20334a" text-anchor="middle">3</text><path d="M372 85 V405" stroke="#e2e8f0"/><text x="372" y="429" font-size="17" fill="#20334a" text-anchor="middle">4</text><path d="M420 85 V405" stroke="#e2e8f0"/><text x="420" y="429" font-size="17" fill="#20334a" text-anchor="middle">5</text><path d="M468 85 V405" stroke="#e2e8f0"/><text x="468" y="429" font-size="17" fill="#20334a" text-anchor="middle">6</text><path d="M516 85 V405" stroke="#e2e8f0"/><text x="516" y="429" font-size="17" fill="#20334a" text-anchor="middle">7</text><path d="M564 85 V405" stroke="#e2e8f0"/><text x="564" y="429" font-size="17" fill="#20334a" text-anchor="middle">8</text><path d="M84 399 H590" stroke="#e2e8f0"/><path d="M84 351 H590" stroke="#e2e8f0"/><path d="M84 303 H590" stroke="#e2e8f0"/><path d="M84 255 H590" stroke="#e2e8f0"/><path d="M84 207 H590" stroke="#e2e8f0"/><path d="M84 159 H590" stroke="#e2e8f0"/><path d="M84 111 H590" stroke="#e2e8f0"/><circle cx="180" cy="255" r="48" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="228" cy="255" r="144" fill="none" stroke="#16a34a" stroke-width="2"/><circle cx="372" cy="255" r="48" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="420" cy="255" r="48" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="468" cy="255" r="48" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="180" cy="255" r="6" fill="#0f172a"/><text x="180" y="289" font-size="19" fill="#20334a" text-anchor="middle">火箭×2</text><circle cx="228" cy="255" r="6" fill="#0f172a"/><text x="228" y="238" font-size="19" fill="#20334a" text-anchor="middle">A×2</text><circle cx="372" cy="255" r="6" fill="#0f172a"/><text x="372" y="238" font-size="19" fill="#20334a" text-anchor="middle">B</text><circle cx="420" cy="255" r="6" fill="#0f172a"/><text x="420" y="238" font-size="19" fill="#20334a" text-anchor="middle">C</text><circle cx="468" cy="255" r="6" fill="#0f172a"/><text x="468" y="238" font-size="19" fill="#20334a" text-anchor="middle">D</text><circle cx="516" cy="207" r="6" fill="#0f172a"/><text x="516" y="190" font-size="19" fill="#20334a" text-anchor="middle">E</text><text x="22" y="475" font-size="20" fill="#20334a" text-anchor="start">火箭(0,1),r1；A(1,1),r1和r3；B(4,1),r1。</text><text x="22" y="520" font-size="20" fill="#20334a" text-anchor="start">C(5,1),r1；D(6,1),r1；E(7,2),r1。</text><text x="22" y="565" font-size="21" fill="#20334a" text-anchor="start">首次A：加2并删A；重复火箭再查A：不存在。</text><text x="22" y="610" font-size="21" fill="#20334a" text-anchor="start">A→B→C→D，答案2→3→4→5；圆周也触发。</text><text x="22" y="655" font-size="20" fill="#20334a" text-anchor="start">D到E的平方距离2&gt;1，E仍未爆；灰格仅作坐标。</text></g></svg>