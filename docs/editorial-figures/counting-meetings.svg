<svg xmlns="http://www.w3.org/2000/svg" width="640" height="495" viewBox="0 0 640 495" role="img"><title>Meeting Division：官方样例一的真实半开区间与扫描覆盖数</title><rect width="640" height="495" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">样例：A、B 接成一块，C 另开一块</text><text x="24" y="68" class="" text-anchor="start">开始端实心，结束端空心；结束时刻已不占人</text><line x1="104" y1="105" x2="104" y2="352" stroke="#c6d1dc" stroke-width="1" stroke-dasharray="4,4"/><text x="104" y="99" class="" text-anchor="middle">1</text><line x1="197" y1="105" x2="197" y2="352" stroke="#c6d1dc" stroke-width="1" stroke-dasharray="4,4"/><text x="197" y="99" class="" text-anchor="middle">2</text><line x1="290" y1="105" x2="290" y2="352" stroke="#c6d1dc" stroke-width="1" stroke-dasharray="4,4"/><text x="290" y="99" class="" text-anchor="middle">3</text><line x1="383" y1="105" x2="383" y2="352" stroke="#c6d1dc" stroke-width="1" stroke-dasharray="4,4"/><text x="383" y="99" class="" text-anchor="middle">4</text><line x1="476" y1="105" x2="476" y2="352" stroke="#c6d1dc" stroke-width="1" stroke-dasharray="4,4"/><text x="476" y="99" class="" text-anchor="middle">5</text><line x1="569" y1="105" x2="569" y2="352" stroke="#c6d1dc" stroke-width="1" stroke-dasharray="4,4"/><text x="569" y="99" class="" text-anchor="middle">6</text><text x="24" y="149" class="" text-anchor="start">A</text><line x1="104" y1="142" x2="290" y2="142" stroke="#168377" stroke-width="7" stroke-dasharray=""/><circle cx="104" cy="142" r="7" fill="#168377"/><circle cx="290" cy="142" r="7" fill="#f8fafc" stroke="#168377" stroke-width="3"/><text x="24" y="207" class="" text-anchor="start">B</text><line x1="197" y1="200" x2="383" y2="200" stroke="#3975a5" stroke-width="7" stroke-dasharray=""/><circle cx="197" cy="200" r="7" fill="#3975a5"/><circle cx="383" cy="200" r="7" fill="#f8fafc" stroke="#3975a5" stroke-width="3"/><text x="24" y="265" class="" text-anchor="start">C</text><line x1="476" y1="258" x2="569" y2="258" stroke="#b27628" stroke-width="7" stroke-dasharray=""/><circle cx="476" cy="258" r="7" fill="#b27628"/><circle cx="569" cy="258" r="7" fill="#f8fafc" stroke="#b27628" stroke-width="3"/><text x="24" y="315" class="small" text-anchor="start">cover</text><text x="24" y="347" class="small" text-anchor="start">块数 c</text><text x="104" y="315" class="" text-anchor="middle">1</text><text x="104" y="347" class="" text-anchor="middle">1</text><text x="197" y="315" class="" text-anchor="middle">2</text><text x="197" y="347" class="" text-anchor="middle">1</text><text x="290" y="315" class="" text-anchor="middle">1</text><text x="290" y="347" class="" text-anchor="middle">1</text><text x="383" y="315" class="" text-anchor="middle">0</text><text x="383" y="347" class="" text-anchor="middle">1</text><text x="476" y="315" class="" text-anchor="middle">1</text><text x="476" y="347" class="" text-anchor="middle">2</text><text x="569" y="315" class="" text-anchor="middle">0</text><text x="569" y="347" class="" text-anchor="middle">2</text><text x="24" y="397" class="" text-anchor="start">t=1：0→1，新块，任选负责人；t=2：1→2，只能另一个人</text><text x="24" y="432" class="" text-anchor="start">t=3：2→1，B 仍在；t=4：1→0，这一块才结束</text><text x="24" y="467" class="" text-anchor="start">t=5：0→1，C 开新块，再任选负责人：2 × 2 = 4</text></svg>