<svg xmlns="http://www.w3.org/2000/svg" width="660" height="570" viewBox="0 0 660 570" role="img"><title>两行四列原矩阵压出列和二零三四，逐个列出五个和不超过三的双行矩形及所有行对总数二十一</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="32" font-size="22" fill="#20334a" text-anchor="start">真实矩阵，K=3；本轮固定上、下两行</text><text x="24" y="92" font-size="20" fill="#20334a" text-anchor="start">上行</text><rect x="160" y="65" width="84" height="40" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="202" y="93" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="272" y="65" width="84" height="40" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="314" y="93" font-size="23" fill="#20334a" text-anchor="middle">0</text><rect x="384" y="65" width="84" height="40" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="426" y="93" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="496" y="65" width="84" height="40" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="538" y="93" font-size="23" fill="#20334a" text-anchor="middle">4</text><text x="24" y="149" font-size="20" fill="#20334a" text-anchor="start">下行</text><rect x="160" y="122" width="84" height="40" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="202" y="150" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="272" y="122" width="84" height="40" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="314" y="150" font-size="23" fill="#20334a" text-anchor="middle">0</text><rect x="384" y="122" width="84" height="40" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="426" y="150" font-size="23" fill="#20334a" text-anchor="middle">1</text><rect x="496" y="122" width="84" height="40" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="538" y="150" font-size="23" fill="#20334a" text-anchor="middle">0</text><text x="24" y="206" font-size="20" fill="#20334a" text-anchor="start">列和</text><rect x="160" y="179" width="84" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="202" y="207" font-size="23" fill="#20334a" text-anchor="middle">2</text><rect x="272" y="179" width="84" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="314" y="207" font-size="23" fill="#20334a" text-anchor="middle">0</text><rect x="384" y="179" width="84" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="426" y="207" font-size="23" fill="#20334a" text-anchor="middle">3</text><rect x="496" y="179" width="84" height="40" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="538" y="207" font-size="23" fill="#20334a" text-anchor="middle">4</text><text x="24" y="261" font-size="21" fill="#20334a" text-anchor="start">右端1：列[1,1]，和2，贡献1。</text><text x="24" y="304" font-size="21" fill="#20334a" text-anchor="start">右端2：列[1,2]、[2,2]，和2、0，贡献2。</text><text x="24" y="347" font-size="21" fill="#20334a" text-anchor="start">右端3：列[2,3]、[3,3]，和3、3，贡献2。</text><text x="24" y="390" font-size="21" fill="#20334a" text-anchor="start">右端4：4单独也超3，窗口清空，贡献0。</text><text x="24" y="440" font-size="21" fill="#20334a" text-anchor="start">这五块都是上下两行的矩形，位置身份不同。</text><text x="24" y="488" font-size="21" fill="#20334a" text-anchor="start">只上行6块；只下行10块；双行5块，总21。</text><text x="24" y="533" font-size="21" fill="#20334a" text-anchor="start">每块有唯一的上下边界、右端点与左起点。</text></g></svg>