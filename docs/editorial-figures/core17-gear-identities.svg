<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img"><title>五只不同身份齿轮的两份完整传动链</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="38" font-size="27" fill="#20334a" text-anchor="start">五个原身份全部在链里；接触的圆半径按同一比例</text><text x="35" y="78" font-size="22" fill="#20334a" text-anchor="start">第一条链：A → B → C → D → E，左端转速大小设为 1</text><circle cx="166" cy="200" r="96" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="166" y="208" font-size="25" fill="#20334a" text-anchor="middle">A</text><text x="166" y="312" font-size="21" fill="#20334a" text-anchor="middle">r=4</text><text x="166" y="353" font-size="22" fill="#286b4d" text-anchor="middle">ω=1</text><circle cx="310" cy="200" r="48" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="310" y="208" font-size="25" fill="#20334a" text-anchor="middle">B</text><text x="310" y="312" font-size="21" fill="#20334a" text-anchor="middle">r=2</text><text x="310" y="353" font-size="22" fill="#286b4d" text-anchor="middle">ω=2</text><circle cx="430" cy="200" r="72" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="430" y="208" font-size="25" fill="#20334a" text-anchor="middle">C</text><text x="430" y="312" font-size="21" fill="#20334a" text-anchor="middle">r=3</text><text x="430" y="353" font-size="22" fill="#286b4d" text-anchor="middle">ω=4/3</text><circle cx="574" cy="200" r="72" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="574" y="208" font-size="25" fill="#20334a" text-anchor="middle">D</text><text x="574" y="312" font-size="21" fill="#20334a" text-anchor="middle">r=3</text><text x="574" y="353" font-size="22" fill="#286b4d" text-anchor="middle">ω=4/3</text><circle cx="670" cy="200" r="24" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="670" y="208" font-size="25" fill="#20334a" text-anchor="middle">E</text><text x="670" y="312" font-size="21" fill="#20334a" text-anchor="middle">r=1</text><text x="670" y="353" font-size="22" fill="#286b4d" text-anchor="middle">ω=4</text><text x="750" y="190" font-size="28" fill="#286b4d" text-anchor="start">倍率 = 4</text><text x="750" y="238" font-size="23" fill="#20334a" text-anchor="start">中间齿轮</text><text x="750" y="272" font-size="23" fill="#20334a" text-anchor="start">都仍在转动</text><text x="35" y="408" font-size="23" fill="#20334a" text-anchor="start">倍率一的另一份完整排列：C → A → B → E → D</text><circle cx="130" cy="525" r="60" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="130" y="533" font-size="25" fill="#20334a" text-anchor="middle">C</text><text x="130" y="637" font-size="21" fill="#20334a" text-anchor="middle">r=3</text><circle cx="270" cy="525" r="80" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="270" y="533" font-size="25" fill="#20334a" text-anchor="middle">A</text><text x="270" y="637" font-size="21" fill="#20334a" text-anchor="middle">r=4</text><circle cx="390" cy="525" r="40" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="390" y="533" font-size="25" fill="#20334a" text-anchor="middle">B</text><text x="390" y="637" font-size="21" fill="#20334a" text-anchor="middle">r=2</text><circle cx="450" cy="525" r="20" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="450" y="533" font-size="25" fill="#20334a" text-anchor="middle">E</text><text x="450" y="637" font-size="21" fill="#20334a" text-anchor="middle">r=1</text><circle cx="530" cy="525" r="60" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="530" y="533" font-size="25" fill="#20334a" text-anchor="middle">D</text><text x="530" y="637" font-size="21" fill="#20334a" text-anchor="middle">r=3</text><text x="730" y="506" font-size="23" fill="#20334a" text-anchor="start">首尾 C 与 D</text><text x="730" y="545" font-size="23" fill="#20334a" text-anchor="start">半径同为 3</text><text x="730" y="584" font-size="23" fill="#20334a" text-anchor="start">但身份不同</text><text x="35" y="686" font-size="23" fill="#20334a" text-anchor="start">中间半径在乘积中约掉；没有把中间三只齿轮丢弃。</text></g></svg>