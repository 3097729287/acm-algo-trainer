<svg xmlns="http://www.w3.org/2000/svg" width="720" height="792" viewBox="0 0 720 792" role="img"><title>实际置换二六五四三一七分成环一二六、三五、四、七，物理编号一到七映射AABC BAD；真实一二六一二后用唯一魔法二到三再传五，访问五个不同入口，物理相邻一二同环不能重复算六，五六也是同一双环候选五</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><defs><marker id="portal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">七个真实入口：a=[2,6,5,4,3,1,7]</text><path d="M129.0 120.0 L236.0 120.0" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#portal-arrow)"/><path d="M249.1665976251669 139.72233729138853 L195.86239388568816 228.5626768571864" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#portal-arrow)"/><path d="M171.27871793347225 230.21082248508304 L118.74052398535625 141.50997555969235" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#portal-arrow)"/><path d="M465 110 Q519 65 574 110" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#portal-arrow)"/><path d="M574 132 Q519 177 465 132" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#portal-arrow)"/><circle cx="106" cy="120" r="22" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="106" y="127" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="261" cy="120" r="22" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="261" y="127" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="183" cy="250" r="22" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="183" y="257" font-size="21" fill="#20334a" text-anchor="middle">6</text><circle cx="442" cy="120" r="22" fill="#dcfce7" stroke="#285b87" stroke-width="2"/><text x="442" y="127" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="597" cy="120" r="22" fill="#dcfce7" stroke="#285b87" stroke-width="2"/><text x="597" y="127" font-size="21" fill="#20334a" text-anchor="middle">5</text><circle cx="440" cy="250" r="22" fill="#fef3c7" stroke="#285b87" stroke-width="2"/><text x="440" y="257" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="596" cy="250" r="22" fill="#fef3c7" stroke="#285b87" stroke-width="2"/><text x="596" y="257" font-size="21" fill="#20334a" text-anchor="middle">7</text><text x="62" y="303" font-size="20" fill="#20334a" text-anchor="start">环A：3点</text><text x="450" y="183" font-size="20" fill="#20334a" text-anchor="start">环B：2点</text><text x="402" y="303" font-size="20" fill="#20334a" text-anchor="start">4、7各为单点环</text><text x="22" y="359" font-size="21" fill="#20334a" text-anchor="start">下方按物理编号排列，不是传送指向顺序：</text><circle cx="62" cy="412" r="22" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="62" y="419" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="62" y="464" font-size="21" fill="#20334a" text-anchor="middle">A</text><circle cx="161" cy="412" r="22" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="161" y="419" font-size="21" fill="#20334a" text-anchor="middle">2</text><text x="161" y="464" font-size="21" fill="#20334a" text-anchor="middle">A</text><path d="M85 412 L138 412" stroke="#94a3b8" stroke-width="3" fill="none"/><circle cx="260" cy="412" r="22" fill="#dcfce7" stroke="#285b87" stroke-width="2"/><text x="260" y="419" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="260" y="464" font-size="21" fill="#20334a" text-anchor="middle">B</text><path d="M184 412 L237 412" stroke="#16a34a" stroke-width="3" fill="none"/><circle cx="359" cy="412" r="22" fill="#fef3c7" stroke="#285b87" stroke-width="2"/><text x="359" y="419" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="359" y="464" font-size="21" fill="#20334a" text-anchor="middle">C</text><path d="M283 412 L336 412" stroke="#94a3b8" stroke-width="3" fill="none"/><circle cx="458" cy="412" r="22" fill="#dcfce7" stroke="#285b87" stroke-width="2"/><text x="458" y="419" font-size="21" fill="#20334a" text-anchor="middle">5</text><text x="458" y="464" font-size="21" fill="#20334a" text-anchor="middle">B</text><path d="M382 412 L435 412" stroke="#94a3b8" stroke-width="3" fill="none"/><circle cx="557" cy="412" r="22" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="557" y="419" font-size="21" fill="#20334a" text-anchor="middle">6</text><text x="557" y="464" font-size="21" fill="#20334a" text-anchor="middle">A</text><path d="M481 412 L534 412" stroke="#94a3b8" stroke-width="3" fill="none"/><circle cx="656" cy="412" r="22" fill="#fef3c7" stroke="#285b87" stroke-width="2"/><text x="656" y="419" font-size="21" fill="#20334a" text-anchor="middle">7</text><text x="656" y="464" font-size="21" fill="#20334a" text-anchor="middle">D</text><path d="M580 412 L633 412" stroke="#94a3b8" stroke-width="3" fill="none"/><text x="22" y="519" font-size="20" fill="#20334a" text-anchor="start">边界1/2：同环，只能计3；边界2/3：可计3+2=5</text><text x="22" y="566" font-size="21" fill="#20334a" text-anchor="start">从1实际走：1→2→6→1→2 ⇒魔法3→5</text><text x="22" y="613" font-size="21" fill="#20334a" text-anchor="start">先取满A再回到2，魔法只走相邻编号2→3</text><text x="22" y="660" font-size="21" fill="#20334a" text-anchor="start">访问集合{1,2,6,3,5}共5点，重复1和2不加数</text><text x="22" y="707" font-size="21" fill="#20334a" text-anchor="start">5/6也连同一对环，仍是候选5，不再累加</text><text x="22" y="762" font-size="21" fill="#20334a" text-anchor="start">魔法用完只能留在B；无法再取第三个环</text></g></svg>