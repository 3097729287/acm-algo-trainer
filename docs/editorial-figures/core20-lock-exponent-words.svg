<svg xmlns="http://www.w3.org/2000/svg" width="720" height="872" viewBox="0 0 720 872" role="img"><title>实际原锁81 25 81的3指数404和5指数020，两种最大值条件均满足；上限4的长度2全部九个指数词逐个列出，追加4得9追加低指数四选得20</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">原锁合法前三格：81、25、81</text><text x="22" y="122" font-size="20" fill="#20334a" text-anchor="start">原数</text><rect x="145" y="87" width="120" height="55" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="205" y="124" font-size="25" fill="#20334a" text-anchor="middle">81</text><rect x="315" y="87" width="120" height="55" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="375" y="124" font-size="25" fill="#20334a" text-anchor="middle">25</text><rect x="485" y="87" width="120" height="55" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="545" y="124" font-size="25" fill="#20334a" text-anchor="middle">81</text><text x="22" y="205" font-size="20" fill="#20334a" text-anchor="start">3指数</text><rect x="145" y="170" width="120" height="55" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="205" y="207" font-size="25" fill="#20334a" text-anchor="middle">4</text><rect x="315" y="170" width="120" height="55" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="375" y="207" font-size="25" fill="#20334a" text-anchor="middle">0</text><rect x="485" y="170" width="120" height="55" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="545" y="207" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="22" y="288" font-size="20" fill="#20334a" text-anchor="start">5指数</text><rect x="145" y="253" width="120" height="55" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="205" y="290" font-size="25" fill="#20334a" text-anchor="middle">0</text><rect x="315" y="253" width="120" height="55" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="375" y="290" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="485" y="253" width="120" height="55" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="545" y="290" font-size="25" fill="#20334a" text-anchor="middle">0</text><text x="22" y="377" font-size="20" fill="#20334a" text-anchor="start">相邻两数LCM都为2025，两个指数条件同时成立。</text><text x="22" y="430" font-size="21" fill="#20334a" text-anchor="start">看3的指数上限4，长度2的全部合法旧词：</text><text x="22" y="478" font-size="22" fill="#20334a" text-anchor="start">高结尾5条：04、14、24、34、44</text><text x="22" y="526" font-size="22" fill="#20334a" text-anchor="start">低结尾4条：40、41、42、43</text><rect x="22" y="566" width="676" height="64" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="40" y="606" font-size="20" fill="#20334a" text-anchor="start">追加4：以上9条都能接，next_high=5+4=9。</text><rect x="22" y="648" width="676" height="80" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="40" y="683" font-size="20" fill="#20334a" text-anchor="start">追加0/1/2/3：只能从5条高结尾接。</text><text x="40" y="713" font-size="20" fill="#20334a" text-anchor="start">每条4选，next_low=5×4=20。</text><text x="22" y="783" font-size="20" fill="#20334a" text-anchor="start">先同时读旧5/4，再写新9/20；新词可唯一还原。</text><text x="22" y="831" font-size="20" fill="#20334a" text-anchor="start">两质数的整条指数词逐位拼数，计数相乘。</text></g></svg>