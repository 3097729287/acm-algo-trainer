<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="875" viewBox="0 0 1040 875" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#718096"/></marker></defs><rect width="1040" height="875" fill="#fbfcff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="28" y="42" font-size="28" fill="#18324f" text-anchor="start" font-weight="700">中序、预算1：首项比较与实际花费必须同时保留</text><text x="28" y="81" font-size="22" fill="#18324f" text-anchor="start">原树固定；候选之间可以重新决定内部交换。</text><line x1="520" y1="145" x2="260" y2="245" stroke="#718096" stroke-width="3"/><line x1="520" y1="145" x2="780" y2="245" stroke="#718096" stroke-width="3"/><line x1="260" y1="245" x2="145" y2="355" stroke="#718096" stroke-width="3"/><line x1="260" y1="245" x2="375" y2="355" stroke="#718096" stroke-width="3"/><line x1="780" y1="245" x2="665" y2="355" stroke="#718096" stroke-width="3"/><line x1="780" y1="245" x2="895" y2="355" stroke="#718096" stroke-width="3"/><circle cx="520" cy="145" r="31" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="520" y="153" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">7</text><circle cx="260" cy="245" r="31" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="260" y="253" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">3</text><circle cx="780" cy="245" r="31" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="780" y="253" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">6</text><circle cx="145" cy="355" r="31" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="145" y="363" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">2</text><circle cx="375" cy="355" r="31" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="375" y="363" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">4</text><circle cx="665" cy="355" r="31" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="665" y="363" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">5</text><circle cx="895" cy="355" r="31" fill="#e9f2ff" stroke="#2563a6" stroke-width="3"/><text x="895" y="363" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">1</text><text x="520" y="421" font-size="25" fill="#18324f" text-anchor="middle" font-weight="700">原中序：2 3 4 | 7 | 5 6 1</text><rect x="24" y="465" width="485" height="189" rx="10" fill="#e9f7f1" stroke="#087f5b" stroke-width="2"/><text x="44" y="505" font-size="25" fill="#087f5b" text-anchor="start" font-weight="700">候选：不换根的孩子</text><text x="44" y="543" font-size="21" fill="#18324f" text-anchor="start">第一块 [2,3,4]：允许1，实际花0</text><text x="44" y="578" font-size="21" fill="#18324f" text-anchor="start">首项 = 2；剩下1次留给右子树</text><text x="44" y="615" font-size="20" fill="#18324f" text-anchor="start">左块已完全最优，不能假装已花1。</text><rect x="531" y="465" width="485" height="189" rx="10" fill="#fff1f2" stroke="#bf3348" stroke-width="2"/><text x="551" y="505" font-size="25" fill="#bf3348" text-anchor="start" font-weight="700">候选：先交换根的孩子</text><text x="551" y="543" font-size="21" fill="#18324f" text-anchor="start">先花1 → 第一块 [5,6,1] 只剩0</text><text x="551" y="578" font-size="20" fill="#18324f" text-anchor="start">首项 = 5；此时到不了无限最优首项1</text><text x="551" y="615" font-size="20" fill="#18324f" text-anchor="start">2 &lt; 5，所以本候选输在第一个位置。</text><text x="28" y="702" font-size="24" fill="#087f5b" text-anchor="start" font-weight="700">选不换根 → 右子树拿到余下1次，交换叶子5与1。</text><rect x="28" y="727" width="984" height="70" rx="10" fill="#f2f7ff" stroke="#bac9db" stroke-width="2"/><text x="520" y="773" font-size="27" fill="#18324f" text-anchor="middle" font-weight="700">预算1的最优中序：2 3 4 | 7 | 1 6 5</text><text x="28" y="838" font-size="22" fill="#18324f" text-anchor="start">预算2才可：根处交换 + 原右子树内部交换 → 1 6 5 | 7 | 2 3 4</text></g></svg>