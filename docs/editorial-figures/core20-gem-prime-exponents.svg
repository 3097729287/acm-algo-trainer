<svg xmlns="http://www.w3.org/2000/svg" width="720" height="846" viewBox="0 0 720 846" role="img"><title>实际亮度六十二十八对质数二和三的指数4加2减5各余1，五原宝石按公约数六分组，两个六和十二是合法且字典序最小三件</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">原三枚6、12、18：逐质数抵消指数</text><text x="22" y="85" font-size="21" fill="#20334a" text-anchor="start">2的指数：1、2、1；3的指数：1、1、2。</text><text x="22" y="132" font-size="21" fill="#20334a" text-anchor="start">两种质数都排成 α=1、β=1、γ=2。</text><text x="22" y="214" font-size="20" fill="#20334a" text-anchor="start">原三数乘积</text><rect x="210" y="181" width="55" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="237" y="214" font-size="23" fill="#20334a" text-anchor="middle">p</text><rect x="277" y="181" width="55" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="304" y="214" font-size="23" fill="#20334a" text-anchor="middle">p</text><rect x="344" y="181" width="55" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="371" y="214" font-size="23" fill="#20334a" text-anchor="middle">p</text><rect x="411" y="181" width="55" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="438" y="214" font-size="23" fill="#20334a" text-anchor="middle">p</text><text x="22" y="292" font-size="20" fill="#20334a" text-anchor="start">三数LCM再加</text><rect x="210" y="259" width="55" height="48" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="237" y="292" font-size="23" fill="#20334a" text-anchor="middle">p</text><rect x="277" y="259" width="55" height="48" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="304" y="292" font-size="23" fill="#20334a" text-anchor="middle">p</text><text x="22" y="370" font-size="20" fill="#20334a" text-anchor="start">两两LCM要减</text><rect x="210" y="337" width="55" height="48" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="237" y="370" font-size="23" fill="#20334a" text-anchor="middle">p</text><rect x="277" y="337" width="55" height="48" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="304" y="370" font-size="23" fill="#20334a" text-anchor="middle">p</text><rect x="344" y="337" width="55" height="48" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="371" y="370" font-size="23" fill="#20334a" text-anchor="middle">p</text><rect x="411" y="337" width="55" height="48" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="438" y="370" font-size="23" fill="#20334a" text-anchor="middle">p</text><rect x="478" y="337" width="55" height="48" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="505" y="370" font-size="23" fill="#20334a" text-anchor="middle">p</text><text x="22" y="451" font-size="20" fill="#20334a" text-anchor="start">指数4+2−5=1；每种质数都只留共有的最少一份。</text><text x="22" y="498" font-size="22" fill="#20334a" text-anchor="start">因此原式=GCD(6,12,18)=6。</text><text x="22" y="555" font-size="21" fill="#20334a" text-anchor="start">五个真实身份A6、B12、C18、D20、E6</text><rect x="30" y="591" width="112" height="71" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="86" y="617" font-size="20" fill="#20334a" text-anchor="middle">A</text><text x="86" y="649" font-size="24" fill="#20334a" text-anchor="middle">6</text><rect x="165" y="591" width="112" height="71" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="221" y="617" font-size="20" fill="#20334a" text-anchor="middle">E</text><text x="221" y="649" font-size="24" fill="#20334a" text-anchor="middle">6</text><rect x="300" y="591" width="112" height="71" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="356" y="617" font-size="20" fill="#20334a" text-anchor="middle">B</text><text x="356" y="649" font-size="24" fill="#20334a" text-anchor="middle">12</text><rect x="435" y="591" width="112" height="71" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="491" y="617" font-size="20" fill="#20334a" text-anchor="middle">C</text><text x="491" y="649" font-size="24" fill="#20334a" text-anchor="middle">18</text><rect x="570" y="591" width="112" height="71" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="626" y="617" font-size="20" fill="#20334a" text-anchor="middle">D</text><text x="626" y="649" font-size="24" fill="#20334a" text-anchor="middle">20</text><text x="22" y="711" font-size="21" fill="#20334a" text-anchor="start">g=6的倍数有四件：6、6、12、18。</text><text x="22" y="758" font-size="20" fill="#20334a" text-anchor="start">取前三件6、6、12；两个6有不同身份，均可使用。</text><text x="22" y="805" font-size="20" fill="#20334a" text-anchor="start">d6真、d5假、d3真：逐个降序查，不能二分。</text></g></svg>