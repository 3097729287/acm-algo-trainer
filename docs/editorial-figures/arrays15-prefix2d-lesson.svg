<svg xmlns="http://www.w3.org/2000/svg" width="760" height="866" viewBox="0 0 760 866" role="img"><title>实际四乘四一到十六数表，首行上方红首列左方橙交集紫左上一目标右下三乘三绿，前缀一百三十六减十减二十八加一等九十九</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="38" fill="#17324d" font-size="23" text-anchor="start">查询第2..4行、第2..4列：绿色格总和99</text><rect x="109" y="117" width="110" height="78" rx="4" fill="#ede9fe" stroke="#64748b" stroke-width="2"/><text x="164" y="169" fill="#17324d" font-size="29" text-anchor="middle">1</text><rect x="244" y="117" width="110" height="78" rx="4" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="299" y="169" fill="#17324d" font-size="29" text-anchor="middle">2</text><rect x="379" y="117" width="110" height="78" rx="4" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="434" y="169" fill="#17324d" font-size="29" text-anchor="middle">3</text><rect x="514" y="117" width="110" height="78" rx="4" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="569" y="169" fill="#17324d" font-size="29" text-anchor="middle">4</text><rect x="109" y="219" width="110" height="78" rx="4" fill="#ffedd5" stroke="#64748b" stroke-width="2"/><text x="164" y="271" fill="#17324d" font-size="29" text-anchor="middle">5</text><rect x="244" y="219" width="110" height="78" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="299" y="271" fill="#17324d" font-size="29" text-anchor="middle">6</text><rect x="379" y="219" width="110" height="78" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="434" y="271" fill="#17324d" font-size="29" text-anchor="middle">7</text><rect x="514" y="219" width="110" height="78" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="569" y="271" fill="#17324d" font-size="29" text-anchor="middle">8</text><rect x="109" y="321" width="110" height="78" rx="4" fill="#ffedd5" stroke="#64748b" stroke-width="2"/><text x="164" y="373" fill="#17324d" font-size="29" text-anchor="middle">9</text><rect x="244" y="321" width="110" height="78" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="299" y="373" fill="#17324d" font-size="29" text-anchor="middle">10</text><rect x="379" y="321" width="110" height="78" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="434" y="373" fill="#17324d" font-size="29" text-anchor="middle">11</text><rect x="514" y="321" width="110" height="78" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="569" y="373" fill="#17324d" font-size="29" text-anchor="middle">12</text><rect x="109" y="423" width="110" height="78" rx="4" fill="#ffedd5" stroke="#64748b" stroke-width="2"/><text x="164" y="475" fill="#17324d" font-size="29" text-anchor="middle">13</text><rect x="244" y="423" width="110" height="78" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="299" y="475" fill="#17324d" font-size="29" text-anchor="middle">14</text><rect x="379" y="423" width="110" height="78" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="434" y="475" fill="#17324d" font-size="29" text-anchor="middle">15</text><rect x="514" y="423" width="110" height="78" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="569" y="475" fill="#17324d" font-size="29" text-anchor="middle">16</text><text x="24" y="598" fill="#17324d" font-size="21" text-anchor="start">整个前缀136：包含绿色目标和上、左多余部分。</text><text x="24" y="652" fill="#17324d" font-size="23" text-anchor="start">减上面一行10；减左边一列28。</text><text x="24" y="706" fill="#17324d" font-size="23" text-anchor="start">紫色左上角1被减两次，补回1次。</text><text x="24" y="765" fill="#17324d" font-size="22" text-anchor="start">136−10−28+1=99；四个边界是(1,4,1,4)。</text><text x="24" y="820" fill="#17324d" font-size="21" text-anchor="start">绿色九格：6+7+8+10+11+12+14+15+16=99。</text></svg>