<svg xmlns="http://www.w3.org/2000/svg" width="850" height="650" viewBox="0 0 850 650" role="img"><title>滑动窗口的今日判断与为次日移出旧日</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="24" y="36" font-size="25" fill="#20334a" text-anchor="start">M=3，K=7，原热量 A=[4,6,3,5,2,4]</text><text x="264" y="83" font-size="18" fill="#20334a" text-anchor="middle">第1天</text><rect x="230" y="100" width="68" height="48" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="264" y="132" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="357" y="83" font-size="18" fill="#20334a" text-anchor="middle">第2天</text><rect x="323" y="100" width="68" height="48" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="357" y="132" font-size="25" fill="#20334a" text-anchor="middle">6</text><text x="450" y="83" font-size="18" fill="#20334a" text-anchor="middle">第3天</text><rect x="416" y="100" width="68" height="48" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="450" y="132" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="543" y="83" font-size="18" fill="#20334a" text-anchor="middle">第4天</text><rect x="509" y="100" width="68" height="48" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="543" y="132" font-size="25" fill="#20334a" text-anchor="middle">5</text><text x="636" y="83" font-size="18" fill="#20334a" text-anchor="middle">第5天</text><rect x="602" y="100" width="68" height="48" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="636" y="132" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="729" y="83" font-size="18" fill="#20334a" text-anchor="middle">第6天</text><rect x="695" y="100" width="68" height="48" rx="5" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="729" y="132" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="24" y="132" font-size="21" fill="#20334a" text-anchor="start">原热量</text><text x="24" y="238" font-size="21" fill="#20334a" text-anchor="start">第三天：若吃</text><rect x="230" y="205" width="68" height="48" rx="5" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="264" y="237" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="323" y="205" width="68" height="48" rx="5" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="357" y="237" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="416" y="205" width="68" height="48" rx="5" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="450" y="237" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="509" y="205" width="68" height="48" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="543" y="237" font-size="16" fill="#20334a" text-anchor="middle">未决定</text><rect x="602" y="205" width="68" height="48" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="636" y="237" font-size="16" fill="#20334a" text-anchor="middle">未决定</text><rect x="695" y="205" width="68" height="48" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="729" y="237" font-size="16" fill="#20334a" text-anchor="middle">未决定</text><text x="24" y="291" font-size="21" fill="#20334a" text-anchor="start">实际贡献 4+0+3=7 → 今天吃；移出第1天贡献4 → window=3</text><text x="24" y="418" font-size="21" fill="#20334a" text-anchor="start">第四天：跳过</text><rect x="230" y="385" width="68" height="48" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="264" y="417" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="323" y="385" width="68" height="48" rx="5" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="357" y="417" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="416" y="385" width="68" height="48" rx="5" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="450" y="417" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="509" y="385" width="68" height="48" rx="5" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="543" y="417" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="602" y="385" width="68" height="48" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="636" y="417" font-size="16" fill="#20334a" text-anchor="middle">未决定</text><rect x="695" y="385" width="68" height="48" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="729" y="417" font-size="16" fill="#20334a" text-anchor="middle">未决定</text><text x="24" y="471" font-size="21" fill="#20334a" text-anchor="start">假设 0+3+5=8&gt;7 → 今天不吃；第2天未吃，不减原热量6</text><text x="24" y="513" font-size="21" fill="#20334a" text-anchor="start">下一天读入前：第3、4天实际贡献 3+0=3。</text><text x="24" y="584" font-size="20" fill="#20334a" text-anchor="start">绿框：本轮最近三天；数值是实际吃掉的贡献，非原热量。</text><text x="24" y="622" font-size="20" fill="#20334a" text-anchor="start">代码第三、四天的 out 分别为 0、1；先决定今天，再移出旧日。</text></g></svg>