<svg xmlns="http://www.w3.org/2000/svg" width="760" height="899" viewBox="0 0 760 899" role="img"><title>同一零到六数轴上原四人位置零一四六，固定两端后唯一目标零二四六，只有二号移动；另以五人零二五六八变零二点五五六点五八说明分数目标</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#12365a" font-size="24" text-anchor="start">固定1、4号人：三段总长6，只能各长2</text><text x="24" y="96" fill="#12365a" font-size="22" text-anchor="start">原位置</text><line x1="90" y1="166" x2="690" y2="166" stroke="#64748b" stroke-width="3"/><line x1="90" y1="159" x2="90" y2="173" stroke="#64748b" stroke-width="3"/><text x="90" y="202" fill="#12365a" font-size="19" text-anchor="middle">0</text><line x1="190" y1="159" x2="190" y2="173" stroke="#64748b" stroke-width="3"/><text x="190" y="202" fill="#12365a" font-size="19" text-anchor="middle">1</text><line x1="290" y1="159" x2="290" y2="173" stroke="#64748b" stroke-width="3"/><text x="290" y="202" fill="#12365a" font-size="19" text-anchor="middle">2</text><line x1="390" y1="159" x2="390" y2="173" stroke="#64748b" stroke-width="3"/><text x="390" y="202" fill="#12365a" font-size="19" text-anchor="middle">3</text><line x1="490" y1="159" x2="490" y2="173" stroke="#64748b" stroke-width="3"/><text x="490" y="202" fill="#12365a" font-size="19" text-anchor="middle">4</text><line x1="590" y1="159" x2="590" y2="173" stroke="#64748b" stroke-width="3"/><text x="590" y="202" fill="#12365a" font-size="19" text-anchor="middle">5</text><line x1="690" y1="159" x2="690" y2="173" stroke="#64748b" stroke-width="3"/><text x="690" y="202" fill="#12365a" font-size="19" text-anchor="middle">6</text><circle cx="90" cy="137" r="23" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="90" y="144" fill="#12365a" font-size="21" text-anchor="middle">1</text><text x="90" y="237" fill="#12365a" font-size="18" text-anchor="middle">固定</text><circle cx="190" cy="137" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="190" y="144" fill="#12365a" font-size="21" text-anchor="middle">2</text><text x="190" y="237" fill="#12365a" font-size="18" text-anchor="middle">可动</text><circle cx="490" cy="137" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="490" y="144" fill="#12365a" font-size="21" text-anchor="middle">3</text><text x="490" y="237" fill="#12365a" font-size="18" text-anchor="middle">可动</text><circle cx="690" cy="137" r="23" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="690" y="144" fill="#12365a" font-size="21" text-anchor="middle">4</text><text x="690" y="237" fill="#12365a" font-size="18" text-anchor="middle">固定</text><text x="24" y="321" fill="#12365a" font-size="22" text-anchor="start">唯一目标</text><line x1="90" y1="391" x2="690" y2="391" stroke="#64748b" stroke-width="3"/><line x1="90" y1="384" x2="90" y2="398" stroke="#64748b" stroke-width="3"/><text x="90" y="427" fill="#12365a" font-size="19" text-anchor="middle">0</text><line x1="190" y1="384" x2="190" y2="398" stroke="#64748b" stroke-width="3"/><text x="190" y="427" fill="#12365a" font-size="19" text-anchor="middle">1</text><line x1="290" y1="384" x2="290" y2="398" stroke="#64748b" stroke-width="3"/><text x="290" y="427" fill="#12365a" font-size="19" text-anchor="middle">2</text><line x1="390" y1="384" x2="390" y2="398" stroke="#64748b" stroke-width="3"/><text x="390" y="427" fill="#12365a" font-size="19" text-anchor="middle">3</text><line x1="490" y1="384" x2="490" y2="398" stroke="#64748b" stroke-width="3"/><text x="490" y="427" fill="#12365a" font-size="19" text-anchor="middle">4</text><line x1="590" y1="384" x2="590" y2="398" stroke="#64748b" stroke-width="3"/><text x="590" y="427" fill="#12365a" font-size="19" text-anchor="middle">5</text><line x1="690" y1="384" x2="690" y2="398" stroke="#64748b" stroke-width="3"/><text x="690" y="427" fill="#12365a" font-size="19" text-anchor="middle">6</text><circle cx="90" cy="362" r="23" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="90" y="369" fill="#12365a" font-size="21" text-anchor="middle">1</text><text x="90" y="462" fill="#12365a" font-size="18" text-anchor="middle">固定</text><circle cx="290" cy="362" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="290" y="369" fill="#12365a" font-size="21" text-anchor="middle">2</text><text x="290" y="462" fill="#12365a" font-size="18" text-anchor="middle">可动</text><circle cx="490" cy="362" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="490" y="369" fill="#12365a" font-size="21" text-anchor="middle">3</text><text x="490" y="462" fill="#12365a" font-size="18" text-anchor="middle">可动</text><circle cx="690" cy="362" r="23" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="690" y="369" fill="#12365a" font-size="21" text-anchor="middle">4</text><text x="690" y="462" fill="#12365a" font-size="18" text-anchor="middle">固定</text><line x1="190" y1="218" x2="290" y2="330" stroke="#dc2626" stroke-width="4"/><text x="253" y="271" fill="#12365a" font-size="20" text-anchor="start">2号：1→2，必须动</text><text x="435" y="293" fill="#12365a" font-size="20" text-anchor="start">3号：4→4，不动</text><text x="24" y="509" fill="#12365a" font-size="23" text-anchor="start">最终相邻距离：2 / 2 / 2；只计1个人。</text><text x="24" y="575" fill="#12365a" font-size="22" text-anchor="start">另一个合法例子：固定点在0、5、8。</text><text x="24" y="650" fill="#12365a" font-size="21" text-anchor="start">原位置</text><rect x="155" y="620" width="99" height="47" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="204" y="651" fill="#12365a" font-size="22" text-anchor="middle">0</text><rect x="270" y="620" width="99" height="47" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="319" y="651" fill="#12365a" font-size="22" text-anchor="middle">2</text><rect x="385" y="620" width="99" height="47" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="434" y="651" fill="#12365a" font-size="22" text-anchor="middle">5</text><rect x="500" y="620" width="99" height="47" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="549" y="651" fill="#12365a" font-size="22" text-anchor="middle">6</text><rect x="615" y="620" width="99" height="47" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="664" y="651" fill="#12365a" font-size="22" text-anchor="middle">8</text><text x="24" y="731" fill="#12365a" font-size="21" text-anchor="start">目标</text><rect x="155" y="701" width="99" height="47" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="204" y="732" fill="#12365a" font-size="22" text-anchor="middle">0</text><rect x="270" y="701" width="99" height="47" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="319" y="732" fill="#12365a" font-size="22" text-anchor="middle">2.5</text><rect x="385" y="701" width="99" height="47" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="434" y="732" fill="#12365a" font-size="22" text-anchor="middle">5</text><rect x="500" y="701" width="99" height="47" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="549" y="732" fill="#12365a" font-size="22" text-anchor="middle">6.5</text><rect x="615" y="701" width="99" height="47" rx="6" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="664" y="732" fill="#12365a" font-size="22" text-anchor="middle">8</text><text x="24" y="805" fill="#12365a" font-size="22" text-anchor="start">2号与4号各动一次；目标可以不是整数。</text><text x="24" y="855" fill="#12365a" font-size="22" text-anchor="start">相等比较用正倍数叉乘，不截断小数位置。</text></svg>