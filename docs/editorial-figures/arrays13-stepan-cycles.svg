<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img"><title>有限位置轴上的两个合法同余环</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="28" y="36" font-size="24" fill="#20334a" text-anchor="start">n=12，x=4，y=6：在同一位置轴上连合法边</text><rect x="45" y="112" width="40" height="39" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="65" y="139" font-size="19" fill="#20334a" text-anchor="middle">1</text><rect x="101" y="112" width="40" height="39" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="121" y="139" font-size="19" fill="#20334a" text-anchor="middle">2</text><rect x="157" y="112" width="40" height="39" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="177" y="139" font-size="19" fill="#20334a" text-anchor="middle">3</text><rect x="213" y="112" width="40" height="39" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="233" y="139" font-size="19" fill="#20334a" text-anchor="middle">4</text><rect x="269" y="112" width="40" height="39" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="289" y="139" font-size="19" fill="#20334a" text-anchor="middle">5</text><rect x="325" y="112" width="40" height="39" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="345" y="139" font-size="19" fill="#20334a" text-anchor="middle">6</text><rect x="381" y="112" width="40" height="39" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="401" y="139" font-size="19" fill="#20334a" text-anchor="middle">7</text><rect x="437" y="112" width="40" height="39" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="457" y="139" font-size="19" fill="#20334a" text-anchor="middle">8</text><rect x="493" y="112" width="40" height="39" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="513" y="139" font-size="19" fill="#20334a" text-anchor="middle">9</text><rect x="549" y="112" width="40" height="39" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="569" y="139" font-size="19" fill="#20334a" text-anchor="middle">10</text><rect x="605" y="112" width="40" height="39" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="625" y="139" font-size="19" fill="#20334a" text-anchor="middle">11</text><rect x="661" y="112" width="40" height="39" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="681" y="139" font-size="19" fill="#20334a" text-anchor="middle">12</text><path d="M65,112 V97 H289 V112" fill="none" stroke="#16804c" stroke-width="2"/><path d="M289,112 V88 H513 V112" fill="none" stroke="#16804c" stroke-width="2"/><path d="M513,112 V79 H177 V112" fill="none" stroke="#16804c" stroke-width="2"/><path d="M177,112 V70 H401 V112" fill="none" stroke="#16804c" stroke-width="2"/><path d="M401,112 V61 H65 V112" fill="none" stroke="#16804c" stroke-width="2"/><path d="M121,151 V178 H345 V151" fill="none" stroke="#b65e1a" stroke-width="2"/><path d="M345,151 V193 H569 V151" fill="none" stroke="#b65e1a" stroke-width="2"/><path d="M569,151 V208 H233 V151" fill="none" stroke="#b65e1a" stroke-width="2"/><path d="M233,151 V223 H457 V151" fill="none" stroke="#b65e1a" stroke-width="2"/><path d="M457,151 V238 H121 V151" fill="none" stroke="#b65e1a" stroke-width="2"/><path d="M625,151 V255 H401 V151" fill="none" stroke="#66758b" stroke-width="2" stroke-dasharray="5 4"/><path d="M681,151 V273 H457 V151" fill="none" stroke="#66758b" stroke-width="2" stroke-dasharray="5 4"/><text x="28" y="311" font-size="23" fill="#16804c" text-anchor="start">奇数环：1 → 5 → 9 → 3 → 7 → 1</text><text x="28" y="353" font-size="23" fill="#b65e1a" text-anchor="start">偶数环：2 → 6 → 10 → 4 → 8 → 2</text><text x="28" y="398" font-size="21" fill="#20334a" text-anchor="start">每步：当前位置 ≤6 就 +4，否则 −6，始终在 [1,10]</text><text x="28" y="441" font-size="22" fill="#20334a" text-anchor="start">虚线接入：11 → 7（−4），12 → 8（−4）</text><text x="28" y="484" font-size="22" fill="#20334a" text-anchor="start">交换路径 1—5—9：依次 (1,5)、(5,9)、(1,5)</text><text x="28" y="527" font-size="21" fill="#20334a" text-anchor="start">只对换位置1与9，位置5复原；奇偶两块独立排好</text></g></svg>