<svg xmlns="http://www.w3.org/2000/svg" width="760" height="632" viewBox="0 0 760 632" role="img"><title>原身份、当前异或读值与删除的实际状态</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="28" y="36" font-size="24" fill="#20334a" text-anchor="start">原值身份不变；下一轮必须读取当前显示值</text><text x="28" y="118" font-size="21" fill="#20334a" text-anchor="start">初始</text><rect x="255" y="92" width="120" height="67" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="315" y="115" font-size="18" fill="#20334a" text-anchor="middle">A 原1</text><text x="315" y="145" font-size="23" fill="#20334a" text-anchor="middle">当前 1</text><rect x="400" y="92" width="120" height="67" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="460" y="115" font-size="18" fill="#20334a" text-anchor="middle">B 原2</text><text x="460" y="145" font-size="23" fill="#20334a" text-anchor="middle">当前 2</text><rect x="545" y="92" width="120" height="67" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="605" y="115" font-size="18" fill="#20334a" text-anchor="middle">C 原4</text><text x="605" y="145" font-size="23" fill="#20334a" text-anchor="middle">当前 4</text><text x="28" y="203" font-size="22" fill="#20334a" text-anchor="start">读 A 当前值1，异或后删除 A</text><text x="28" y="273" font-size="21" fill="#20334a" text-anchor="start">第一次后</text><rect x="255" y="247" width="120" height="67" rx="5" fill="#f1f5f9" stroke="#6d86a6" stroke-width="2"/><text x="315" y="270" font-size="18" fill="#20334a" text-anchor="middle">A 原1</text><text x="315" y="300" font-size="23" fill="#20334a" text-anchor="middle">已删除</text><rect x="400" y="247" width="120" height="67" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="460" y="270" font-size="18" fill="#20334a" text-anchor="middle">B 原2</text><text x="460" y="300" font-size="23" fill="#20334a" text-anchor="middle">当前 3</text><rect x="545" y="247" width="120" height="67" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="605" y="270" font-size="18" fill="#20334a" text-anchor="middle">C 原4</text><text x="605" y="300" font-size="23" fill="#20334a" text-anchor="middle">当前 5</text><text x="28" y="358" font-size="22" fill="#20334a" text-anchor="start">读 B 当前值3，异或后删除 B</text><text x="28" y="428" font-size="21" fill="#20334a" text-anchor="start">第二次后</text><rect x="255" y="402" width="120" height="67" rx="5" fill="#f1f5f9" stroke="#6d86a6" stroke-width="2"/><text x="315" y="425" font-size="18" fill="#20334a" text-anchor="middle">A 原1</text><text x="315" y="455" font-size="23" fill="#20334a" text-anchor="middle">已删除</text><rect x="400" y="402" width="120" height="67" rx="5" fill="#f1f5f9" stroke="#6d86a6" stroke-width="2"/><text x="460" y="425" font-size="18" fill="#20334a" text-anchor="middle">B 原2</text><text x="460" y="455" font-size="23" fill="#20334a" text-anchor="middle">已删除</text><rect x="545" y="402" width="120" height="67" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="605" y="425" font-size="18" fill="#20334a" text-anchor="middle">C 原4</text><text x="605" y="455" font-size="23" fill="#20334a" text-anchor="middle">当前 6</text><text x="28" y="513" font-size="22" fill="#20334a" text-anchor="start">C 最终6 = 原B的2 ⊕ 原C的4</text><text x="28" y="601" font-size="22" fill="#20334a" text-anchor="start">数对 AB、AC、BC → 3、5、6；best：0 → 3 → 5 → 6</text></g></svg>