<svg xmlns="http://www.w3.org/2000/svg" width="760" height="827" viewBox="0 0 760 827" role="img"><title>顺时针NESW四向罗盘与真实南二东一北一折线，面南左手东，面东左手北，五条相对指令到同一终点</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#12365a" font-size="24" text-anchor="start">NESW顺时针：面南左转，才会朝东</text><text x="180" y="92" fill="#12365a" font-size="22" text-anchor="middle">N=0</text><text x="316" y="212" fill="#12365a" font-size="22" text-anchor="middle">E=1</text><text x="180" y="340" fill="#12365a" font-size="22" text-anchor="middle">S=2</text><text x="48" y="212" fill="#12365a" font-size="22" text-anchor="middle">W=3</text><path d="M180 110 V298 M72 205 H288" stroke="#64748b" stroke-width="3" fill="none"/><path d="M234 121 Q296 140 284 183" fill="none" stroke="#dc2626" stroke-width="4"/><text x="400" y="121" fill="#12365a" font-size="23" text-anchor="start">输入：S 2，E 1，N 1</text><text x="400" y="172" fill="#12365a" font-size="22" text-anchor="start">初始面南</text><text x="400" y="223" fill="#12365a" font-size="21" text-anchor="start">Z 2 → L → Z 1 → L → Z 1</text><text x="400" y="274" fill="#12365a" font-size="22" text-anchor="start">2→1：余数3，左转</text><text x="400" y="325" fill="#12365a" font-size="22" text-anchor="start">1→0：余数3，左转</text><path d="M185 426 V650 H297 V538" fill="none" stroke="#2563eb" stroke-width="7"/><circle cx="185" cy="426" r="8" fill="#15803d"/><circle cx="297" cy="538" r="8" fill="#dc2626"/><text x="205" y="432" fill="#12365a" font-size="21" text-anchor="start">起点(0,0)，面南</text><text x="29" y="550" fill="#12365a" font-size="23" text-anchor="start">南2</text><text x="215" y="689" fill="#12365a" font-size="23" text-anchor="start">东1</text><text x="314" y="604" fill="#12365a" font-size="23" text-anchor="start">北1</text><text x="173" y="726" fill="#12365a" font-size="21" text-anchor="start">(0,−2)</text><text x="315" y="666" fill="#12365a" font-size="21" text-anchor="start">(1,−2)</text><text x="316" y="532" fill="#12365a" font-size="21" text-anchor="start">终点(1,−1)</text><text x="24" y="781" fill="#12365a" font-size="21" text-anchor="start">两处左转只改朝向；三段路长度与原路线相同。</text></svg>