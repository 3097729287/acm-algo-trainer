<svg xmlns="http://www.w3.org/2000/svg" width="720" height="822" viewBox="0 0 720 822" role="img"><title>原样例五点满二叉树从点三出发先三四三五三一五步，点三依次空L R空，然后点一全空再走九步含第二次进入点三，总计十四步，具体标记与两项五加九同步</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">原样例五点树，从3开始；每次移动耗时1</text><path d="M110 107 L110 208" stroke="#64748b" stroke-width="3" fill="none"/><path d="M110 208 L46 316" stroke="#64748b" stroke-width="3" fill="none"/><path d="M110 208 L240 316" stroke="#64748b" stroke-width="3" fill="none"/><path d="M240 316 L180 420" stroke="#64748b" stroke-width="3" fill="none"/><path d="M240 316 L311 420" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="110" cy="107" r="23" fill="#e2e8f0" stroke="#285b87" stroke-width="2"/><text x="110" y="114" font-size="21" fill="#20334a" text-anchor="middle">0</text><circle cx="110" cy="208" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="110" y="215" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="46" cy="316" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="46" y="323" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="240" cy="316" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="240" y="323" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="180" cy="420" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="180" y="427" font-size="21" fill="#20334a" text-anchor="middle">4</text><circle cx="311" cy="420" r="23" fill="#dbeafe" stroke="#285b87" stroke-width="2"/><text x="311" y="427" font-size="21" fill="#20334a" text-anchor="middle">5</text><text x="393" y="111" font-size="20" fill="#20334a" text-anchor="start">内部点的三次离开</text><text x="393" y="161" font-size="20" fill="#20334a" text-anchor="start">空 → 写L → 左儿子</text><text x="393" y="211" font-size="20" fill="#20334a" text-anchor="start">L → 改R → 右儿子</text><text x="393" y="261" font-size="20" fill="#20334a" text-anchor="start">R → 擦空 → 父亲</text><text x="393" y="323" font-size="20" fill="#20334a" text-anchor="start">叶子直接去父亲</text><text x="393" y="386" font-size="20" fill="#20334a" text-anchor="start">标记属于点，</text><text x="393" y="421" font-size="20" fill="#20334a" text-anchor="start">不是来时方向</text><text x="22" y="491" font-size="22" fill="#20334a" text-anchor="start">第一趟：3 → 4 → 3 → 5 → 3 → 1，共5步</text><rect x="22" y="521" width="159" height="75" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="101" y="548" font-size="18" fill="#20334a" text-anchor="middle">初始</text><text x="101" y="580" font-size="19" fill="#20334a" text-anchor="middle">点3：空</text><rect x="197" y="521" width="159" height="75" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="276" y="548" font-size="18" fill="#20334a" text-anchor="middle">第一次离开3</text><text x="276" y="580" font-size="19" fill="#20334a" text-anchor="middle">点3：L</text><rect x="372" y="521" width="159" height="75" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="451" y="548" font-size="18" fill="#20334a" text-anchor="middle">第二次离开3</text><text x="451" y="580" font-size="19" fill="#20334a" text-anchor="middle">点3：R</text><rect x="547" y="521" width="159" height="75" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="626" y="548" font-size="18" fill="#20334a" text-anchor="middle">第三次离开3</text><text x="626" y="580" font-size="19" fill="#20334a" text-anchor="middle">点3：空</text><text x="22" y="645" font-size="21" fill="#20334a" text-anchor="start">到1时全树仍为空；1的完整一趟再走进3：</text><text x="22" y="694" font-size="21" fill="#20334a" text-anchor="start">1 → 2 → 1 → 3 → 4 → 3 → 5 → 3 → 1 → 0</text><text x="22" y="743" font-size="21" fill="#20334a" text-anchor="start">第二趟9步，3又经历L、R、空；总计5+9=14</text><text x="22" y="792" font-size="21" fill="#20334a" text-anchor="start">sz3=3，sz1=5；T3=(2×3−1)+(2×5−1)=14</text></g></svg>