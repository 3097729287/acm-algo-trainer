<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img"><title>一位改答后整条旧前缀人数扣除并沿新前缀加回，根和零前缀净计数不变而旧新后缀改变</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="23" y="36" font-size="23" fill="#20334a" text-anchor="start">T=ooo；D 的回答 xoo→xxo，即正确性 011→001</text><text x="23" y="76" font-size="22" fill="#20334a" text-anchor="start">其它三人仍为 A=110、B=101、C=010</text><text x="23" y="120" font-size="22" fill="#a32e36" text-anchor="start">① 删除 D 的旧路径</text><rect x="25" y="150" width="130" height="108" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="90" y="186" font-size="24" fill="#20334a" text-anchor="middle">根</text><text x="90" y="229" font-size="25" fill="#a32e36" text-anchor="middle">4→3</text><path d="M159,202 L199,202" fill="none" stroke="#a32e36" stroke-width="3"/><polygon points="199,202 189.0,207.0 189.0,197.0" fill="#a32e36"/><rect x="205" y="150" width="130" height="108" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="270" y="186" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="270" y="229" font-size="25" fill="#a32e36" text-anchor="middle">2→1</text><path d="M339,202 L379,202" fill="none" stroke="#a32e36" stroke-width="3"/><polygon points="379,202 369.0,207.0 369.0,197.0" fill="#a32e36"/><rect x="385" y="150" width="130" height="108" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="450" y="186" font-size="24" fill="#20334a" text-anchor="middle">01</text><text x="450" y="229" font-size="25" fill="#a32e36" text-anchor="middle">2→1</text><path d="M519,202 L559,202" fill="none" stroke="#a32e36" stroke-width="3"/><polygon points="559,202 549.0,207.0 549.0,197.0" fill="#a32e36"/><rect x="565" y="150" width="130" height="108" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="630" y="186" font-size="24" fill="#20334a" text-anchor="middle">011</text><text x="630" y="229" font-size="25" fill="#a32e36" text-anchor="middle">1→0</text><text x="23" y="330" font-size="22" fill="#087b48" text-anchor="start">② 翻转第2位后，加入新路径</text><rect x="25" y="360" width="130" height="108" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="90" y="396" font-size="24" fill="#20334a" text-anchor="middle">根</text><text x="90" y="439" font-size="25" fill="#087b48" text-anchor="middle">3→4</text><path d="M159,412 L199,412" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="199,412 189.0,417.0 189.0,407.0" fill="#087b48"/><rect x="205" y="360" width="130" height="108" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="270" y="396" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="270" y="439" font-size="25" fill="#087b48" text-anchor="middle">1→2</text><path d="M339,412 L379,412" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="379,412 369.0,417.0 369.0,407.0" fill="#087b48"/><rect x="385" y="360" width="130" height="108" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="450" y="396" font-size="24" fill="#20334a" text-anchor="middle">00</text><text x="450" y="439" font-size="25" fill="#087b48" text-anchor="middle">0→1</text><path d="M519,412 L559,412" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="559,412 549.0,417.0 549.0,407.0" fill="#087b48"/><rect x="565" y="360" width="130" height="108" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="630" y="396" font-size="24" fill="#20334a" text-anchor="middle">001</text><text x="630" y="439" font-size="25" fill="#087b48" text-anchor="middle">0→1</text><text x="23" y="514" font-size="22" fill="#20334a" text-anchor="start">第2位改变，后面的整个前缀也改变：011 不再计入 D</text><text x="23" y="556" font-size="21" fill="#20334a" text-anchor="start">共同前缀“根、0”先减后加，净人数不变；新分支建点</text></g></svg>