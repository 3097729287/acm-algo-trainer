<svg xmlns="http://www.w3.org/2000/svg" width="620" height="399" viewBox="0 0 620 399" role="img"><title>互不相邻的两批订单在空位四处分割，左侧最小费用三右侧最小费用三</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="40" font-size="23" fill="#20334a" text-anchor="start">两批各选 2 份：中间位置 4 必须留空</text><text x="63" y="83" font-size="17" fill="#20334a" text-anchor="middle">编号 1</text><rect x="29" y="99" width="68" height="64" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="63" y="138" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="63" y="195" font-size="19" fill="#2d6db4" text-anchor="middle">a=1</text><text x="145" y="83" font-size="17" fill="#20334a" text-anchor="middle">编号 2</text><rect x="111" y="99" width="68" height="64" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="145" y="138" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="145" y="195" font-size="19" fill="#8995a5" text-anchor="middle">不选</text><text x="227" y="83" font-size="17" fill="#20334a" text-anchor="middle">编号 3</text><rect x="193" y="99" width="68" height="64" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="227" y="138" font-size="25" fill="#20334a" text-anchor="middle">3</text><text x="227" y="195" font-size="19" fill="#2d6db4" text-anchor="middle">a=2</text><text x="309" y="83" font-size="17" fill="#20334a" text-anchor="middle">编号 4</text><rect x="275" y="99" width="68" height="64" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="309" y="138" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="309" y="195" font-size="19" fill="#8995a5" text-anchor="middle">留空</text><text x="391" y="83" font-size="17" fill="#20334a" text-anchor="middle">编号 5</text><rect x="357" y="99" width="68" height="64" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="391" y="138" font-size="25" fill="#20334a" text-anchor="middle">5</text><text x="391" y="195" font-size="19" fill="#087b48" text-anchor="middle">b=2</text><text x="473" y="83" font-size="17" fill="#20334a" text-anchor="middle">编号 6</text><rect x="439" y="99" width="68" height="64" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="473" y="138" font-size="25" fill="#20334a" text-anchor="middle">6</text><text x="473" y="195" font-size="19" fill="#8995a5" text-anchor="middle">不选</text><text x="555" y="83" font-size="17" fill="#20334a" text-anchor="middle">编号 7</text><rect x="521" y="99" width="68" height="64" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="555" y="138" font-size="25" fill="#20334a" text-anchor="middle">7</text><text x="555" y="195" font-size="19" fill="#087b48" text-anchor="middle">b=1</text><text x="26" y="247" font-size="21" fill="#2d6db4" text-anchor="start">左侧 [1,3]：P[3][2] = a₁+a₃ = 1+2 = 3</text><text x="26" y="289" font-size="21" fill="#087b48" text-anchor="start">右侧 [5,7]：Q[5][2] = b₅+b₇ = 2+1 = 3</text><rect x="26" y="315" width="568" height="58" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="44" y="353" font-size="22" fill="#06613b" text-anchor="start">两边可同时选择：最小总费用 3+3=6</text></g></svg>