<svg xmlns="http://www.w3.org/2000/svg" width="720" height="695" viewBox="0 0 720 695" role="img"><title>真实二乘三五种铺法，前两幅末列竖第三幅两横后两幅L封口，缺右上宽二棋盘只有一块L的唯一铺法</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">同色为同一块；三列五种铺法按实际封口分三类</text><rect x="38" y="104" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="38" y="157" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="100" y="104" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="100" y="157" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="162" y="104" width="62" height="53" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><rect x="162" y="157" width="62" height="53" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><text x="38" y="87" font-size="20" fill="#20334a" text-anchor="start">末列竖：F2之一</text><rect x="378" y="104" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="440" y="104" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="502" y="104" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="502" y="157" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="378" y="157" width="62" height="53" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><rect x="440" y="157" width="62" height="53" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><text x="378" y="87" font-size="20" fill="#20334a" text-anchor="start">末列竖：F2之二</text><rect x="38" y="275" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="38" y="328" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="100" y="275" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="162" y="275" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="100" y="328" width="62" height="53" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><rect x="162" y="328" width="62" height="53" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><text x="38" y="258" font-size="20" fill="#20334a" text-anchor="start">末两列横：F1</text><rect x="378" y="275" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="440" y="275" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="378" y="328" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="502" y="275" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="440" y="328" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="502" y="328" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="378" y="258" font-size="20" fill="#20334a" text-anchor="start">L封口：一个方向</text><rect x="38" y="446" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="38" y="499" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="100" y="499" width="62" height="53" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="100" y="446" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="162" y="446" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><rect x="162" y="499" width="62" height="53" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="38" y="429" font-size="20" fill="#20334a" text-anchor="start">L封口：另一方向</text><text x="378" y="453" font-size="20" fill="#20334a" text-anchor="start">右上缺格的宽二：</text><rect x="395" y="481" width="60" height="5