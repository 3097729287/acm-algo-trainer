<svg xmlns="http://www.w3.org/2000/svg" width="640" height="489" viewBox="0 0 640 489" role="img"><title>Masking Tape：官方样例一的逆序链表状态</title><rect width="640" height="489" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">倒着看：只维护尚未定色格的贴纸</text><text x="24" y="66" class="" text-anchor="start">官方样例一：有贴纸 / 待定无贴纸 / 已定色 三种标记</text><text x="340" y="102" class="" text-anchor="middle">格1</text><text x="440" y="102" class="" text-anchor="middle">格2</text><text x="540" y="102" class="" text-anchor="middle">格3</text><text x="24" y="153" class="" text-anchor="start">倒扫起点</text><rect x="295" y="120" width="90" height="52" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="340" y="153" class="" text-anchor="middle">有贴纸</text><rect x="395" y="120" width="90" height="52" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="440" y="153" class="" text-anchor="middle">待定</text><rect x="495" y="120" width="90" height="52" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="540" y="153" class="" text-anchor="middle">待定</text><text x="24" y="232" class="" text-anchor="start">处理5：染 c</text><rect x="295" y="199" width="90" height="52" rx="5" fill="#fce4b9" stroke="#7394aa"/><text x="340" y="232" class="" text-anchor="middle">有贴纸</text><rect x="395" y="199" width="90" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="440" y="232" class="" text-anchor="middle">c 已定</text><rect x="495" y="199" width="90" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="540" y="232" class="" text-anchor="middle">c 已定</text><text x="24" y="311" class="" text-anchor="start">撤销3：翻格一</text><rect x="295" y="278" width="90" height="52" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="340" y="311" class="" text-anchor="middle">待定</text><rect x="395" y="278" width="90" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="440" y="311" class="" text-anchor="middle">c 已定</text><rect x="495" y="278" width="90" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="540" y="311" class="" text-anchor="middle">c 已定</text><text x="24" y="390" class="" text-anchor="start">处理2：染 b</text><rect x="295" y="357" width="90" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="340" y="390" class="" text-anchor="middle">b 已定</text><rect x="395" y="357" width="90" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="440" y="390" class="" text-anchor="middle">c 已定</text><rect x="495" y="357" width="90" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="540" y="390" class="" text-anchor="middle">c 已定</text><text x="24" y="463" class="" text-anchor="start">操作4、1翻格二时，它已定色，直接跳过；最终 bcc</text></svg>