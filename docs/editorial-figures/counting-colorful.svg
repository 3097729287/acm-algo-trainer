<svg xmlns="http://www.w3.org/2000/svg" width="640" height="415" viewBox="0 0 640 415" role="img"><title>Colorful Intervals：周期三、跨界三格区间及相同值所需四格跨度</title><rect width="640" height="415" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">K = 3：跨过周期边界，区间仍无重复</text><text x="24" y="68" class="" text-anchor="start">N = 8；给定 [2,4]、[3,5]、[4,6]，最长长度均为三</text><text x="69" y="113" class="" text-anchor="middle">1</text><rect x="40" y="131" width="58" height="53" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="69" y="166" class="" text-anchor="middle">1</text><text x="142" y="113" class="" text-anchor="middle">2</text><rect x="113" y="131" width="58" height="53" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="142" y="166" class="" text-anchor="middle">2</text><text x="215" y="113" class="" text-anchor="middle">3</text><rect x="186" y="131" width="58" height="53" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="215" y="166" class="" text-anchor="middle">3</text><text x="288" y="113" class="" text-anchor="middle">4</text><rect x="259" y="131" width="58" height="53" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="288" y="166" class="" text-anchor="middle">1</text><text x="361" y="113" class="" text-anchor="middle">5</text><rect x="332" y="131" width="58" height="53" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="361" y="166" class="" text-anchor="middle">2</text><text x="434" y="113" class="" text-anchor="middle">6</text><rect x="405" y="131" width="58" height="53" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="434" y="166" class="" text-anchor="middle">3</text><text x="507" y="113" class="" text-anchor="middle">7</text><rect x="478" y="131" width="58" height="53" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="507" y="166" class="" text-anchor="middle">1</text><text x="580" y="113" class="" text-anchor="middle">8</text><rect x="551" y="131" width="58" height="53" rx="5" fill="#ffffff" stroke="#7394aa"/><text x="580" y="166" class="" text-anchor="middle">2</text><text x="24" y="215" class="" text-anchor="start">上排是位置，下排是输出的值；绿色区间 [3,5] = 3,1,2</text><line x1="40" y1="265" x2="317" y2="265" stroke="#b75b36" stroke-width="4" stroke-dasharray=""/><line x1="40" y1="249" x2="40" y2="280" stroke="#b75b36" stroke-width="2" stroke-dasharray=""/><line x1="317" y1="249" x2="317" y2="280" stroke="#b75b36" stroke-width="2" stroke-dasharray=""/><text x="24" y="319" class="" text-anchor="start">位置一、四都填一：相差 3 个下标</text><text x="24" y="354" class="" text-anchor="start">但要同时包含它们，最短区间 [1,4] 需要 4 个位置</text><text x="24" y="389" class="" text-anchor="start">给定区间至多 3 格，不能同时装进这两个相同值</text></svg>