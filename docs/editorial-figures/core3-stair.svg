<svg xmlns="http://www.w3.org/2000/svg" width="620" height="540" viewBox="0 0 620 540" role="img"><title>三项加权序列总额八的两行真实后缀计数，首项零有两个后缀，首项七没有后缀</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">N=3，K=8：有完整后缀才进入，零个才剪枝</text><text x="24" y="89" font-size="18" fill="#20334a" text-anchor="start">额度 s</text><rect x="105" y="60" width="49" height="39" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="129" y="89" font-size="20" fill="#20334a" text-anchor="middle">0</text><rect x="158" y="60" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="182" y="89" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="211" y="60" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="235" y="89" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="264" y="60" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="288" y="89" font-size="20" fill="#20334a" text-anchor="middle">3</text><rect x="317" y="60" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="341" y="89" font-size="20" fill="#20334a" text-anchor="middle">4</text><rect x="370" y="60" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="394" y="89" font-size="20" fill="#20334a" text-anchor="middle">5</text><rect x="423" y="60" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="447" y="89" font-size="20" fill="#20334a" text-anchor="middle">6</text><rect x="476" y="60" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="500" y="89" font-size="20" fill="#20334a" text-anchor="middle">7</text><rect x="529" y="60" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="553" y="89" font-size="20" fill="#20334a" text-anchor="middle">8</text><text x="24" y="136" font-size="18" fill="#20334a" text-anchor="start">f[3][s]</text><rect x="105" y="107" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="129" y="136" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="158" y="107" width="49" height="39" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="182" y="136" font-size="20" fill="#20334a" text-anchor="middle">0</text><rect x="211" y="107" width="49" height="39" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="235" y="136" font-size="20" fill="#20334a" text-anchor="middle">0</text><rect x="264" y="107" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="288" y="136" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="317" y="107" width="49" height="39" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="341" y="136" font-size="20" fill="#20334a" text-anchor="middle">0</text><rect x="370" y="107" width="49" height="39" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="394" y="136" font-size="20" fill="#20334a" text-anchor="middle">0</text><rect x="423" y="107" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="447" y="136" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="476" y="107" width="49" height="39" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="500" y="136" font-size="20" fill="#20334a" text-anchor="middle">0</text><rect x="529" y="107" width="49" height="39" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="553" y="136" font-size="20" fill="#20334a" text-anchor="middle">0</text><text x="24" y="183" font-size="18" fill="#20334a" text-anchor="start">f[2][s]</text><rect x="105" y="154" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="129" y="183" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="158" y="154" width="49" height="39" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="182" y="183" font-size="20" fill="#20334a" text-anchor="middle">0</text><rect x="211" y="154" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="235" y="183" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="264" y="154" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="288" y="183" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="317" y="154" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="341" y="183" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="370" y="154" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="394" y="183" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="423" y="154" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="447" y="183" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="476" y="154" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="500" y="183" font-size="20" fill="#20334a" text-anchor="middle">1</text><rect x="529" y="154" width="49" height="39" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="553" y="183" font-size="20" fill="#20334a" text-anchor="middle">2</text><rect x="24" y="229" width="572" height="113" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="42" y="261" font-size="21" fill="#20334a" text-anchor="start">A₁=0：还需 2A₂+3A₃=8，恰有两种后缀</text><text x="42" y="296" font-size="21" fill="#20334a" text-anchor="start">按 A₂ 递增，先输出 (0,1,2)，再输出 (0,4,0)</text><text x="42" y="328" font-size="20" fill="#20334a" text-anchor="start">每次输出的三项，都已在当前路径完整确定。</text><rect x="24" y="372" width="572" height="92" rx="8" fill="#fff1f2" stroke="#a32e36" stroke-width="2"/><text x="42" y="407" font-size="22" fill="#20334a" text-anchor="start">A₁=7：还需 2A₂+3A₃=1，无解</text><text x="42" y="443" font-size="21" fill="#20334a" text-anchor="start">f[2][1]=0，所以跳过整个前缀，不输出。</text><text x="24" y="511" font-size="21" fill="#20334a" text-anchor="start">A₁=8：剩余为 0，末尾全零仍是一种合法填法。</text></g></svg>