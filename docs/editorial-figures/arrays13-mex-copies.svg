<svg xmlns="http://www.w3.org/2000/svg" width="760" height="545" viewBox="0 0 760 545" role="img"><title>独立原副本与三个MEX目标同时成立</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="28" y="36" font-size="24" fill="#20334a" text-anchor="start">六个原副本各用一次；目标 MEX 为 [0,2,2]</text><text x="197" y="78" font-size="18" fill="#20334a" text-anchor="middle">原1</text><rect x="165" y="91" width="64" height="48" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="197" y="123" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="197" y="175" font-size="23" fill="#20334a" text-anchor="middle">B</text><path d="M197,141 L197,151" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="285" y="78" font-size="18" fill="#20334a" text-anchor="middle">原2</text><rect x="253" y="91" width="64" height="48" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="285" y="123" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="285" y="175" font-size="23" fill="#20334a" text-anchor="middle">C</text><path d="M285,141 L285,151" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="373" y="78" font-size="18" fill="#20334a" text-anchor="middle">原3</text><rect x="341" y="91" width="64" height="48" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="373" y="123" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="373" y="175" font-size="23" fill="#20334a" text-anchor="middle">B</text><path d="M373,141 L373,151" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="461" y="78" font-size="18" fill="#20334a" text-anchor="middle">原4</text><rect x="429" y="91" width="64" height="48" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="461" y="123" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="461" y="175" font-size="23" fill="#20334a" text-anchor="middle">C</text><path d="M461,141 L461,151" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="549" y="78" font-size="18" fill="#20334a" text-anchor="middle">原5</text><rect x="517" y="91" width="64" height="48" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="549" y="123" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="549" y="175" font-size="23" fill="#20334a" text-anchor="middle">A</text><path d="M549,141 L549,151" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="637" y="78" font-size="18" fill="#20334a" text-anchor="middle">原6</text><rect x="605" y="91" width="64" height="48" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="637" y="123" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="637" y="175" font-size="23" fill="#20334a" text-anchor="middle">A</text><path d="M637,141 L637,151" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="30" y="225" width="220" height="146" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="140" y="260" font-size="23" fill="#20334a" text-anchor="middle">A：目标 0</text><text x="140" y="305" font-size="26" fill="#20334a" text-anchor="middle">[1, 2]</text><text x="140" y="343" font-size="19" fill="#20334a" text-anchor="middle">缺 0，实际 MEX=0</text><rect x="275" y="225" width="220" height="146" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="385" y="260" font-size="23" fill="#20334a" text-anchor="middle">B：目标 2</text><text x="385" y="305" font-size="26" fill="#20334a" text-anchor="middle">[0, 1]</text><text x="385" y="343" font-size="19" fill="#20334a" text-anchor="middle">缺 2，实际 MEX=2</text><rect x="520" y="225" width="220" height="146" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="630" y="260" font-size="23" fill="#20334a" text-anchor="middle">C：目标 2</text><text x="630" y="305" font-size="26" fill="#20334a" text-anchor="middle">[0, 1]</text><text x="630" y="343" font-size="19" fill="#20334a" text-anchor="middle">缺 2，实际 MEX=2</text><text x="28" y="424" font-size="21" fill="#20334a" text-anchor="start">0：两份给 B、C；1：两份给 B、C，余下一份给 A</text><text x="28" y="467" font-size="22" fill="#20334a" text-anchor="start">2：B、C 必须缺二，余量只给目标不同的 A</text><text x="28" y="510" font-size="23" fill="#20334a" text-anchor="start">原下标1…6 → B C B C A A；0 + 2 = 2</text></g></svg>