<svg xmlns="http://www.w3.org/2000/svg" width="640" height="472" viewBox="0 0 640 472" role="img"><title>Min-First Search：具体树边、候选集合与八种父亲组合</title><rect width="640" height="472" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">一棵真实树，按 1、3、4、2、5 输出</text><text x="24" y="70" class="" text-anchor="start">边：1—3、3—4、4—2、1—5；点2由4发现</text><line x1="90" y1="161" x2="244" y2="126" stroke="#168377" stroke-width="4" stroke-dasharray=""/><line x1="244" y1="126" x2="397" y2="126" stroke="#168377" stroke-width="4" stroke-dasharray=""/><line x1="397" y1="126" x2="550" y2="126" stroke="#168377" stroke-width="4" stroke-dasharray=""/><line x1="90" y1="161" x2="244" y2="239" stroke="#168377" stroke-width="4" stroke-dasharray=""/><circle cx="90" cy="161" r="24" fill="#d8edf9" stroke="#7394aa"/><text x="90" y="168" class="" text-anchor="middle">1</text><circle cx="244" cy="126" r="24" fill="#d8edf9" stroke="#7394aa"/><text x="244" y="133" class="" text-anchor="middle">3</text><circle cx="397" cy="126" r="24" fill="#d8edf9" stroke="#7394aa"/><text x="397" y="133" class="" text-anchor="middle">4</text><circle cx="550" cy="126" r="24" fill="#fce4b9" stroke="#7394aa"/><text x="550" y="133" class="" text-anchor="middle">2</text><circle cx="244" cy="239" r="24" fill="#d8edf9" stroke="#7394aa"/><text x="244" y="246" class="" text-anchor="middle">5</text><text x="24" y="316" class="" text-anchor="start">输出1后 {3,5} → 输出3后 {4,5}</text><text x="24" y="354" class="" text-anchor="start">输出4后 {2,5} → 输出2后 {5} → 输出5</text><text x="24" y="402" class="" text-anchor="start">Q 中父亲选项数：点3有1，点4有2，点2有1，点5有4</text><text x="24" y="443" class="" text-anchor="start">总数 1 × 2 × 1 × 4 = 8；图只是其中一棵</text></svg>