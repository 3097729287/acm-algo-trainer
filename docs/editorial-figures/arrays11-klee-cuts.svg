<svg xmlns="http://www.w3.org/2000/svg" width="870" height="564" viewBox="0 0 870 564" role="img"><title>两个真实切点与单调差值跨零的二分边界</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="24" fill="#20334a" text-anchor="start">[2,3,4,5]：总和14，两个相邻切点都得到绝对差4</text><text x="25" y="137" font-size="22" fill="#20334a" text-anchor="start">切点 2</text><rect x="240" y="105" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="282" y="138" font-size="27" fill="#20334a" text-anchor="middle">2</text><rect x="352" y="105" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="394" y="138" font-size="27" fill="#20334a" text-anchor="middle">3</text><rect x="464" y="105" width="85" height="47" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="506" y="138" font-size="27" fill="#20334a" text-anchor="middle">4</text><rect x="576" y="105" width="85" height="47" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="618" y="138" font-size="27" fill="#20334a" text-anchor="middle">5</text><path d="M450,95 L450,165" stroke="#a15b28" stroke-width="3" fill="none"/><text x="730" y="139" font-size="22" fill="#20334a" text-anchor="start">5 - 9</text><text x="25" y="249" font-size="22" fill="#20334a" text-anchor="start">切点 3</text><rect x="240" y="217" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="282" y="250" font-size="27" fill="#20334a" text-anchor="middle">2</text><rect x="352" y="217" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="394" y="250" font-size="27" fill="#20334a" text-anchor="middle">3</text><rect x="464" y="217" width="85" height="47" rx="4" fill="#eaf5ec" stroke="#6d86a6" stroke-width="2"/><text x="506" y="250" font-size="27" fill="#20334a" text-anchor="middle">4</text><rect x="576" y="217" width="85" height="47" rx="4" fill="#fff0d8" stroke="#6d86a6" stroke-width="2"/><text x="618" y="250" font-size="27" fill="#20334a" text-anchor="middle">5</text><path d="M562,207 L562,277" stroke="#a15b28" stroke-width="3" fill="none"/><text x="730" y="251" font-size="22" fill="#20334a" text-anchor="start">9 - 5</text><text x="25" y="358" font-size="22" fill="#20334a" text-anchor="start">i</text><text x="25" y="405" font-size="22" fill="#20334a" text-anchor="start">2P(i)-S</text><text x="300" y="358" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="300" y="405" font-size="25" fill="#a15b28" text-anchor="middle">-10</text><text x="420" y="358" font-size="23" fill="#20334a" text-anchor="middle">2</text><text x="420" y="405" font-size="25" fill="#a15b28" text-anchor="middle">-4</text><text x="540" y="358" font-size="23" fill="#20334a" text-anchor="middle">3</text><text x="540" y="405" font-size="25" fill="#256a40" text-anchor="middle">4</text><text x="660" y="358" font-size="23" fill="#20334a" text-anchor="middle">4</text><text x="660" y="405" font-size="25" fill="#256a40" text-anchor="middle">14</text><path d="M480,338 L480,420" stroke="#2563a6" stroke-width="2" fill="none"/><text x="25" y="475" font-size="21" fill="#20334a" text-anchor="start">二分：mid=2，10&lt;14 → lo=3；mid=3，18≥14 → hi=3</text><text x="25" y="526" font-size="22" fill="#20334a" text-anchor="start">首次非负 i=3，再比较合法前一位 i=2；更远位置不会更近</text></g></svg>