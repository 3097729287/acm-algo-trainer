<svg xmlns="http://www.w3.org/2000/svg" width="720" height="728" viewBox="0 0 720 728" role="img"><title>固定原串abcd的下标零一二三，每声取原前缀正序或原后缀倒序，四到一长度依次输出abcd dcb ab d而非不断裁剪上一声</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">原串abcd始终不改；每声重新按原位置读取</text><text x="22" y="124" font-size="19" fill="#20334a" text-anchor="start">1声</text><text x="156" y="84" font-size="18" fill="#20334a" text-anchor="middle">0</text><rect x="118" y="95" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="156" y="126" font-size="25" fill="#20334a" text-anchor="middle">a</text><text x="259" y="84" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="221" y="95" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="259" y="126" font-size="25" fill="#20334a" text-anchor="middle">b</text><text x="362" y="84" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="324" y="95" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="362" y="126" font-size="25" fill="#20334a" text-anchor="middle">c</text><text x="465" y="84" font-size="18" fill="#20334a" text-anchor="middle">3</text><rect x="427" y="95" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="465" y="126" font-size="25" fill="#20334a" text-anchor="middle">d</text><path d="M156 161 H465" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M455 156 L465 161 L455 166" fill="none" stroke="#0f766e" stroke-width="3"/><text x="560" y="109" font-size="20" fill="#20334a" text-anchor="start">len=4</text><text x="560" y="140" font-size="22" fill="#20334a" text-anchor="start">abcd</text><text x="22" y="252" font-size="19" fill="#20334a" text-anchor="start">2声</text><text x="156" y="212" font-size="18" fill="#20334a" text-anchor="middle">0</text><rect x="118" y="223" width="77" height="45" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="156" y="254" font-size="25" fill="#20334a" text-anchor="middle">a</text><text x="259" y="212" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="221" y="223" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="259" y="254" font-size="25" fill="#20334a" text-anchor="middle">b</text><text x="362" y="212" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="324" y="223" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="362" y="254" font-size="25" fill="#20334a" text-anchor="middle">c</text><text x="465" y="212" font-size="18" fill="#20334a" text-anchor="middle">3</text><rect x="427" y="223" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="465" y="254" font-size="25" fill="#20334a" text-anchor="middle">d</text><path d="M465 289 H259" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M269 284 L259 289 L269 294" fill="none" stroke="#0f766e" stroke-width="3"/><text x="560" y="237" font-size="20" fill="#20334a" text-anchor="start">len=3</text><text x="560" y="268" font-size="22" fill="#20334a" text-anchor="start">dcb</text><text x="22" y="380" font-size="19" fill="#20334a" text-anchor="start">3声</text><text x="156" y="340" font-size="18" fill="#20334a" text-anchor="middle">0</text><rect x="118" y="351" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="156" y="382" font-size="25" fill="#20334a" text-anchor="middle">a</text><text x="259" y="340" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="221" y="351" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="259" y="382" font-size="25" fill="#20334a" text-anchor="middle">b</text><text x="362" y="340" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="324" y="351" width="77" height="45" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="362" y="382" font-size="25" fill="#20334a" text-anchor="middle">c</text><text x="465" y="340" font-size="18" fill="#20334a" text-anchor="middle">3</text><rect x="427" y="351" width="77" height="45" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="465" y="382" font-size="25" fill="#20334a" text-anchor="middle">d</text><path d="M156 417 H259" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M249 412 L259 417 L249 422" fill="none" stroke="#0f766e" stroke-width="3"/><text x="560" y="365" font-size="20" fill="#20334a" text-anchor="start">len=2</text><text x="560" y="396" font-size="22" fill="#20334a" text-anchor="start">ab</text><text x="22" y="508" font-size="19" fill="#20334a" text-anchor="start">4声</text><text x="156" y="468" font-size="18" fill="#20334a" text-anchor="middle">0</text><rect x="118" y="479" width="77" height="45" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="156" y="510" font-size="25" fill="#20334a" text-anchor="middle">a</text><text x="259" y="468" font-size="18" fill="#20334a" text-anchor="middle">1</text><rect x="221" y="479" width="77" height="45" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="259" y="510" font-size="25" fill="#20334a" text-anchor="middle">b</text><text x="362" y="468" font-size="18" fill="#20334a" text-anchor="middle">2</text><rect x="324" y="479" width="77" height="45" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="362" y="510" font-size="25" fill="#20334a" text-anchor="middle">c</text><text x="465" y="468" font-size="18" fill="#20334a" text-anchor="middle">3</text><rect x="427" y="479" width="77" height="45" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="465" y="510" font-size="25" fill="#20334a" text-anchor="middle">d</text><text x="560" y="493" font-size="20" fill="#20334a" text-anchor="start">len=1</text><text x="560" y="524" font-size="22" fill="#20334a" text-anchor="start">d</text><text x="115" y="564" font-size="20" fill="#20334a" text-anchor="start">末声仍是原下标3的d，不是上一声ab中的字符。</text><text x="22" y="643" font-size="21" fill="#20334a" text-anchor="start">顺序拼接：abcd | dcb | ab | d = abcddcbabd</text><text x="22" y="688" font-size="20" fill="#20334a" text-anchor="start">4+3+2+1=10个输出字符；重复读取同一原位置合法。</text></g></svg>