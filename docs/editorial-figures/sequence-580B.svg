<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 365" role="img" aria-labelledby="title"><title id="title">Kefa and Company · 财富管边界，友谊管答案：教学小例</title><rect width="920" height="365" rx="12" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#253340"><text x="24" y="35" font-size="22" fill="#253340">580B · 教学小例</text><text x="24" y="82" font-size="17" fill="#253340">财富轴（友谊值标在点下）</text><line x1="240" y1="145" x2="780" y2="145" stroke="#708090" stroke-width="2"/><circle cx="280" cy="145" r="8" fill="#257c67"/><text x="272" y="123" font-size="19" fill="#253340">1</text><text x="242" y="185" font-size="17" fill="#253340">友谊 4</text><circle cx="490" cy="145" r="8" fill="#257c67"/><text x="482" y="123" font-size="19" fill="#253340">3</text><text x="452" y="185" font-size="17" fill="#253340">友谊 2</text><circle cx="700" cy="145" r="8" fill="#257c67"/><text x="692" y="123" font-size="19" fill="#253340">5</text><text x="662" y="185" font-size="17" fill="#253340">友谊 10</text><path d="M490,206 V218 H700 V206" fill="none" stroke="#257c67" stroke-width="3"/><text x="460" y="249" font-size="17" fill="#257c67">财富差 2&lt;4，友谊 2+10=12</text><text x="24" y="310" font-size="18" fill="#253340">三人全部选择时财富差 5−1=4，等于 d，已经不合法。</text></g></svg>