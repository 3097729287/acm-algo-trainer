<svg xmlns="http://www.w3.org/2000/svg" width="620" height="542" viewBox="0 0 620 542" role="img"><title>四格岛的队列依次为A、BC、CD、D、空，右下格虽有两个前驱但只计一次面积</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="21" fill="#20334a" text-anchor="start">同一座四格岛：发现一次，入队一次，出队才数面积</text><rect x="66" y="65" width="104" height="71" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="118" y="110" font-size="24" fill="#20334a" text-anchor="middle">A = 1</text><rect x="182" y="65" width="104" height="71" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="234" y="110" font-size="24" fill="#20334a" text-anchor="middle">B = 1</text><rect x="66" y="149" width="104" height="71" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="118" y="194" font-size="24" fill="#20334a" text-anchor="middle">C = 1</text><rect x="182" y="149" width="104" height="71" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="234" y="194" font-size="24" fill="#20334a" text-anchor="middle">D = 1</text><text x="340" y="103" font-size="21" fill="#20334a" text-anchor="start">只从 A 启动搜索</text><text x="340" y="145" font-size="25" fill="#087b48" text-anchor="start">cnt：0 → 1</text><text x="340" y="193" font-size="21" fill="#20334a" text-anchor="start">area 初始为 0</text><text x="24" y="278" font-size="21" fill="#20334a" text-anchor="start">处理 A：入队 B、C；队列 [B,C]；area=1</text><text x="24" y="321" font-size="21" fill="#20334a" text-anchor="start">处理 B：入队并标记 D；队列 [C,D]；area=2</text><text x="24" y="364" font-size="21" fill="#20334a" text-anchor="start">处理 C：D 已标记，跳过；队列 [D]；area=3</text><text x="24" y="407" font-size="21" fill="#20334a" text-anchor="start">处理 D：没有新格；队列空；area=4</text><rect x="24" y="438" width="572" height="81" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="42" y="470" font-size="21" fill="#20334a" text-anchor="start">D 有两条进入路径，但仍然只出队一次。</text><text x="42" y="503" font-size="21" fill="#20334a" text-anchor="start">否则同一格重复入队，就会被重复计入面积。</text></g></svg>