20334a" text-anchor="start">首次通过，加1</text><rect x="24" y="292" width="608" height="39" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="48" y="319" font-size="21" fill="#20334a" text-anchor="start">15</text><text x="146" y="319" font-size="21" fill="#20334a" text-anchor="start">9</text><text x="240" y="319" font-size="20" fill="#20334a" text-anchor="start">真 / 真</text><text x="433" y="319" font-size="20" fill="#20334a" text-anchor="start">另一个区间，加1</text><rect x="24" y="341" width="608" height="39" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="48" y="368" font-size="21" fill="#20334a" text-anchor="start">22</text><text x="146" y="368" font-size="21" fill="#20334a" text-anchor="start">16</text><text x="240" y="368" font-size="20" fill="#20334a" text-anchor="start">真 / 真</text><text x="433" y="368" font-size="20" fill="#20334a" text-anchor="start">上限仍包含，加1</text><rect x="24" y="390" width="608" height="39" rx="8" fill="#f0f3f7" stroke="#2d6db4" stroke-width="2"/><text x="48" y="417" font-size="21" fill="#20334a" text-anchor="start">23</text><text x="146" y="417" font-size="21" fill="#20334a" text-anchor="start">17</text><text x="240" y="417" font-size="20" fill="#20334a" text-anchor="start">不再读取</text><text x="433" y="417" font-size="20" fill="#20334a" text-anchor="start">循环边界排除</text><text x="24" y="481" font-size="20" fill="#20334a" text-anchor="start">省略的r=16..21也各加1；固定l=7共九个合法区间。</text><text x="24" y="521" font-size="21" fill="#20334a" text-anchor="start">每换一个l都重置标记；全部起点合计才是400。</text></g></svg>