<svg xmlns="http://www.w3.org/2000/svg" width="620" height="382" viewBox="0 0 620 382" role="img"><title>内部和等于右端点之前的前缀减去包含左端点的前缀</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="26" y="40" font-size="24" fill="#20334a" text-anchor="start">内部只取两端之间：a = [1, 2, 2, 1]</text><text x="126" y="82" font-size="18" fill="#20334a" text-anchor="middle">位置 1</text><rect x="72" y="96" width="108" height="62" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="126" y="135" font-size="28" fill="#20334a" text-anchor="middle">1</text><text x="256" y="82" font-size="18" fill="#20334a" text-anchor="middle">位置 2</text><rect x="202" y="96" width="108" height="62" rx="8" fill="#dcfce7" stroke="#087b48" stroke-width="2"/><text x="256" y="135" font-size="28" fill="#20334a" text-anchor="middle">2</text><text x="386" y="82" font-size="18" fill="#20334a" text-anchor="middle">位置 3</text><rect x="332" y="96" width="108" height="62" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="386" y="135" font-size="28" fill="#20334a" text-anchor="middle">2</text><text x="516" y="82" font-size="18" fill="#20334a" text-anchor="middle">位置 4</text><rect x="462" y="96" width="108" height="62" rx="8" fill="#f1f5f9" stroke="#8995a5" stroke-width="2"/><text x="516" y="135" font-size="28" fill="#20334a" text-anchor="middle">1</text><text x="126" y="190" font-size="19" fill="#20334a" text-anchor="middle">左端 l=1</text><text x="256" y="190" font-size="19" fill="#087b48" text-anchor="middle">内部</text><text x="386" y="190" font-size="19" fill="#20334a" text-anchor="middle">右端 r=3</text><text x="30" y="239" font-size="21" fill="#20334a" text-anchor="start">S₂ = 1 + 2 = 3   （到右端点之前为止）</text><text x="30" y="277" font-size="21" fill="#20334a" text-anchor="start">减 S₁ = 1          （左端点也一并减掉）</text><rect x="26" y="298" width="568" height="60" rx="8" fill="#ecfdf5" stroke="#087b48" stroke-width="2"/><text x="44" y="337" font-size="21" fill="#06613b" text-anchor="start">内部和 3 − 1 = 2 ；首尾乘积 1 × 2 = 2</text></g></svg>