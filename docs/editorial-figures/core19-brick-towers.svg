<svg xmlns="http://www.w3.org/2000/svg" width="800" height="630" viewBox="0 0 800 630" role="img"><title>实际三砖塔ZXY交换相邻逆序为ZYX，标出每块上方负荷并显示把X放到旧塔底部的完整背包候选</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="35" font-size="22" fill="#20334a" text-anchor="start">同样三块原砖：Z=(1,1)，X=(1,5)，Y=(2,3)</text><text x="70" y="87" font-size="22" fill="#20334a" text-anchor="start">交换前：Z、X、Y</text><rect x="70" y="115" width="155" height="68" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="147" y="143" font-size="20" fill="#20334a" text-anchor="middle">Z：w1,v1</text><text x="147" y="170" font-size="19" fill="#20334a" text-anchor="middle">键2</text><text x="239" y="153" font-size="19" fill="#20334a" text-anchor="start">负荷0≤1</text><rect x="70" y="215" width="155" height="68" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="147" y="243" font-size="20" fill="#20334a" text-anchor="middle">X：w1,v5</text><text x="147" y="270" font-size="19" fill="#20334a" text-anchor="middle">键6</text><text x="239" y="253" font-size="19" fill="#20334a" text-anchor="start">负荷1≤5</text><rect x="70" y="315" width="155" height="68" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><text x="147" y="343" font-size="20" fill="#20334a" text-anchor="middle">Y：w2,v3</text><text x="147" y="370" font-size="19" fill="#20334a" text-anchor="middle">键5</text><text x="239" y="353" font-size="19" fill="#20334a" text-anchor="start">负荷2≤3</text><text x="440" y="87" font-size="22" fill="#20334a" text-anchor="start">交换后：Z、Y、X</text><rect x="440" y="115" width="155" height="68" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="517" y="143" font-size="20" fill="#20334a" text-anchor="middle">Z：w1,v1</text><text x="517" y="170" font-size="19" fill="#20334a" text-anchor="middle">键2</text><text x="609" y="153" font-size="19" fill="#20334a" text-anchor="start">负荷0≤1</text><rect x="440" y="215" width="155" height="68" rx="8" fill="#fed7aa" stroke="#2d6db4" stroke-width="2"/><text x="517" y="243" font-size="20" fill="#20334a" text-anchor="middle">Y：w2,v3</text><text x="517" y="270" font-size="19" fill="#20334a" text-anchor="middle">键5</text><text x="609" y="253" font-size="19" fill="#20334a" text-anchor="start">负荷1≤3</text><rect x="440" y="315" width="155" height="68" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="517" y="343" font-size="20" fill="#20334a" text-anchor="middle">X：w1,v5</text><text x="517" y="370" font-size="19" fill="#20334a" text-anchor="middle">键6</text><text x="609" y="353" font-size="19" fill="#20334a" text-anchor="start">负荷3≤5</text><text x="24" y="455" font-size="22" fill="#20334a" text-anchor="start">上方真实总重：左0、1、2；右0、1、3，全部合法。</text><text x="24" y="504" font-size="22" fill="#20334a" text-anchor="start">右塔先有Z+Y：旧重量3，旧价值4。</text><text x="24" y="550" font-size="22" fill="#20334a" text-anchor="start">X放最底：3≤5；dp[4]候选=旧dp[3]+5=9。</text><text x="24" y="598" font-size="21" fill="#20334a" text-anchor="start">下层增加自身重量，上层每块承受的重量都不变。</text></g></svg>