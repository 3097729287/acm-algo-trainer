<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="735" viewBox="0 0 1000 735" role="img"><title>两个六岛实例的禁区和候选端点</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="38" font-size="28" fill="#20334a" text-anchor="start">距离端点必须同时通过全部禁区</text><text x="35" y="88" font-size="23" fill="#20334a" text-anchor="start">已知 b₂ = 2，b5 = 1；其余均未知</text><rect x="188" y="126" width="304" height="30" rx="5" fill="#ffe4df" stroke="#bc6259" stroke-width="2"/><text x="340.0" y="148" font-size="20" fill="#8a332d" text-anchor="middle">位置二的禁区 [1,3]</text><rect x="668" y="166" width="64" height="30" rx="5" fill="#ffe4df" stroke="#bc6259" stroke-width="2"/><text x="35" y="188" font-size="20" fill="#8a332d" text-anchor="start">位置5的禁区 [5,5]</text><path d="M267,181 L657,181" stroke="#bc6259" stroke-width="2" fill="none"/><rect x="68" y="225" width="64" height="45" rx="5" fill="#f1f2f4" stroke="#6d86a6" stroke-width="2"/><text x="100" y="256" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="188" y="225" width="64" height="45" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="220" y="256" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="308" y="225" width="64" height="45" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="340" y="256" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="428" y="225" width="64" height="45" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="460" y="256" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="548" y="225" width="64" height="45" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="580" y="256" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="668" y="225" width="64" height="45" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="700" y="256" font-size="24" fill="#20334a" text-anchor="middle">5</text><rect x="788" y="225" width="64" height="45" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="820" y="256" font-size="24" fill="#20334a" text-anchor="middle">6</text><text x="100" y="300" font-size="21" fill="#777" text-anchor="middle">越界</text><text x="580" y="300" font-size="21" fill="#286b4d" text-anchor="middle">候选 4</text><path d="M100,214 L100,196" stroke="#666" stroke-width="3" fill="none"/><path d="M580,214 L580,200" stroke="#2563a6" stroke-width="3" fill="none"/><text x="35" y="340" font-size="22" fill="#286b4d" text-anchor="start">选 {4,6}：到位置二最近距离 2，到位置五最近距离 1。</text><text x="35" y="407" font-size="23" fill="#20334a" text-anchor="start">已知 b₂ = 2，b4 = 1；其余均未知</text><rect x="188" y="445" width="304" height="30" rx="5" fill="#ffe4df" stroke="#bc6259" stroke-width="2"/><text x="340.0" y="467" font-size="20" fill="#8a332d" text-anchor="middle">位置二的禁区 [1,3]</text><rect x="548" y="485" width="64" height="30" rx="5" fill="#ffe4df" stroke="#bc6259" stroke-width="2"/><text x="35" y="507" font-size="20" fill="#8a332d" text-anchor="start">位置4的禁区 [4,4]</text><path d="M267,500 L537,500" stroke="#bc6259" stroke-width="2" fill="none"/><rect x="68" y="544" width="64" height="45" rx="5" fill="#f1f2f4" stroke="#6d86a6" stroke-width="2"/><text x="100" y="575" font-size="24" fill="#20334a" text-anchor="middle">0</text><rect x="188" y="544" width="64" height="45" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="220" y="575" font-size="24" fill="#20334a" text-anchor="middle">1</text><rect x="308" y="544" width="64" height="45" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="340" y="575" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="428" y="544" width="64" height="45" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="460" y="575" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="548" y="544" width="64" height="45" rx="5" fill="#ffe4df" stroke="#6d86a6" stroke-width="2"/><text x="580" y="575" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="668" y="544" width="64" height="45" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="700" y="575" font-size="24" fill="#20334a" text-anchor="middle">5</text><rect x="788" y="544" width="64" height="45" rx="5" fill="#dcf3e6" stroke="#6d86a6" stroke-width="2"/><text x="820" y="575" font-size="24" fill="#20334a" text-anchor="middle">6</text><text x="100" y="619" font-size="21" fill="#777" text-anchor="middle">越界</text><text x="580" y="619" font-size="21" fill="#a23b34" text-anchor="middle">候选 4</text><path d="M100,533 L100,515" stroke="#666" stroke-width="3" fill="none"/><path d="M580,533 L580,519" stroke="#2563a6" stroke-width="3" fill="none"/><text x="35" y="661" font-size="22" fill="#a23b34" text-anchor="start">只剩 {5,6}：端点零越界，端点四又被禁；位置二无距离二的宝藏。</text><text x="35" y="703" font-size="21" fill="#20334a" text-anchor="start">图中零只用于展示越界候选；真实岛链始终是位置一到六。</text></g></svg>