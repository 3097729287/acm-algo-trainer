<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1123" viewBox="0 0 640 1123" role="img"><title>四个原身份、两组完整蛋糕、实际一刀与子集路径</title><rect width="640" height="1123" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="35" class="title" text-anchor="start">四块原蛋糕：重排后只切一刀</text><text x="24" y="76" class="small" text-anchor="start">身份1/2/3/4，大小7/12/3/8；每人十</text><text x="24" y="108" class="" text-anchor="start">原顺序</text><rect x="50" y="143" width="126" height="54" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="113.0" y="177" class="" text-anchor="middle">7</text><text x="113.0" y="229" class="small" text-anchor="middle">原1</text><rect x="176" y="143" width="216" height="54" rx="5" fill="#ffedb3" stroke="#7394aa"/><text x="284.0" y="177" class="" text-anchor="middle">12</text><text x="284.0" y="229" class="small" text-anchor="middle">原2</text><rect x="392" y="143" width="54" height="54" rx="5" fill="#c0e8cd" stroke="#7394aa"/><text x="419.0" y="177" class="" text-anchor="middle">3</text><text x="419.0" y="229" class="small" text-anchor="middle">原3</text><rect x="446" y="143" width="144" height="54" rx="5" fill="#e2d6f2" stroke="#7394aa"/><text x="518.0" y="177" class="" text-anchor="middle">8</text><text x="518.0" y="229" class="small" text-anchor="middle">原4</text><text x="24" y="259" class="" text-anchor="start">重排后</text><rect x="50" y="294" width="126" height="54" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="113.0" y="328" class="" text-anchor="middle">7</text><text x="113.0" y="380" class="small" text-anchor="middle">原1</text><rect x="176" y="294" width="54" height="54" rx="5" fill="#c0e8cd" stroke="#7394aa"/><text x="203.0" y="328" class="" text-anchor="middle">3</text><text x="203.0" y="380" class="small" text-anchor="middle">原3</text><rect x="230" y="294" width="216" height="54" rx="5" fill="#ffedb3" stroke="#7394aa"/><text x="338.0" y="328" class="" text-anchor="middle">12</text><text x="338.0" y="380" class="small" text-anchor="middle">原2</text><rect x="446" y="294" width="144" height="54" rx="5" fill="#e2d6f2" stroke="#7394aa"/><text x="518.0" y="328" class="" text-anchor="middle">8</text><text x="518.0" y="380" class="small" text-anchor="middle">原4</text><line x1="230" y1="278" x2="230" y2="396" stroke="#3c8066" stroke-width="3" stroke-dasharray="6 4"/><line x1="410" y1="278" x2="410" y2="361" stroke="#b7463b" stroke-width="4" stroke-dasharray=""/><text x="135" y="427" class="small" text-anchor="middle">原组7+3=10</text><text x="432" y="427" class="small" text-anchor="middle">原组12+8=20</text><text x="24" y="469" class="small" text-anchor="start">红线仅切原十二：十二分成十与二</text><rect x="50" y="506" width="126" height="45" rx="5" fill="#cfe3f7" stroke="#7394aa"/><text x="113" y="535" class="small" text-anchor="middle">7</text><rect x="176" y="506" width="54" height="45" rx="5" fill="#c0e8cd" stroke="#7394aa"/><text x="203" y="535" class="small" text-anchor="middle">3</text><text x="274" y="535" class="small" text-anchor="start">甲：7+3=10，不切</text><rect x="50" y="585" width="180" height="45" rx="5" fill="#ffedb3" stroke="#7394aa"/><text x="140" y="614" class="small" text-anchor="middle">10</text><text x="274" y="614" class="small" text-anchor="start">乙：原十二切出的10</text><rect x="50" y="664" width="36" height="45" rx="5" fill="#ffedb3" stroke="#7394aa"/><text x="68" y="693" class="small" text-anchor="middle">2</text><rect x="86" y="664" width="144" height="45" rx="5" fill="#e2d6f2" stroke="#7394aa"/><text x="158" y="693" class="small" text-anchor="middle">8</text><text x="274" y="693" class="small" text-anchor="start">丙：原十二切出的2，加原8</text><line x1="24" y1="758" x2="616" y2="758" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="24" y="797" class="small" text-anchor="start">子集按原身份：每个边界最多结束一个原组</text><text x="47" y="858" class="" text-anchor="start">0001</text><text x="223" y="858" class="small" text-anchor="start">累计7</text><text x="442" y="858" class="small" text-anchor="start">最多0组</text><text x="47" y="913" class="" text-anchor="start">0101</text><text x="223" y="913" class="small" text-anchor="start">累计10</text><text x="442" y="913" class="small" text-anchor="start">最多1组</text><text x="47" y="968" class="" text-anchor="start">0111</text><text x="223" y="968" class="small" text-anchor="start">累计22</text><text x="442" y="968" class="small" text-anchor="start">最多1组</text><text x="47" y="1023" class="" text-anchor="start">1111</text><text x="223" y="1023" class="small" text-anchor="start">累计30</text><text x="442" y="1023" class="small" text-anchor="start">最多2组</text><text x="24" y="1087" class="" text-anchor="start">总组数2：三个人−两个原组=一刀</text></svg>