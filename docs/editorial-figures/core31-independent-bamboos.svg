<svg xmlns="http://www.w3.org/2000/svg" width="720" height="710" viewBox="0 0 720 710" role="img"><title>三根真实竹子长度三四五，横轴同单位长度，完整长二段各一二二个，余料一零一禁止拼接，逐根累计一三五</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">每根独立切：余料不能跨竹子拼接</text><text x="22" y="78" font-size="21" fill="#20334a" text-anchor="start">三根长3 / 4 / 5；每段长度2</text><text x="130" y="124" font-size="19" fill="#20334a" text-anchor="middle">0</text><text x="230" y="124" font-size="19" fill="#20334a" text-anchor="middle">1</text><text x="330" y="124" font-size="19" fill="#20334a" text-anchor="middle">2</text><text x="430" y="124" font-size="19" fill="#20334a" text-anchor="middle">3</text><text x="530" y="124" font-size="19" fill="#20334a" text-anchor="middle">4</text><text x="630" y="124" font-size="19" fill="#20334a" text-anchor="middle">5</text><text x="22" y="197" font-size="22" fill="#20334a" text-anchor="start">长3</text><rect x="130" y="160" width="200" height="56" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="230" y="197" font-size="21" fill="#20334a" text-anchor="middle">完整段1</text><rect x="330" y="160" width="100" height="56" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="380" y="197" font-size="21" fill="#20334a" text-anchor="middle">余1</text><text x="130" y="254" font-size="21" fill="#20334a" text-anchor="start">本根1段；ans: 0 + 1 = 1</text><text x="22" y="332" font-size="22" fill="#20334a" text-anchor="start">长4</text><rect x="130" y="295" width="200" height="56" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="230" y="332" font-size="21" fill="#20334a" text-anchor="middle">完整段1</text><rect x="330" y="295" width="200" height="56" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="430" y="332" font-size="21" fill="#20334a" text-anchor="middle">完整段2</text><text x="130" y="389" font-size="21" fill="#20334a" text-anchor="start">本根2段；ans: 1 + 2 = 3</text><text x="22" y="467" font-size="22" fill="#20334a" text-anchor="start">长5</text><rect x="130" y="430" width="200" height="56" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="230" y="467" font-size="21" fill="#20334a" text-anchor="middle">完整段1</text><rect x="330" y="430" width="200" height="56" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="430" y="467" font-size="21" fill="#20334a" text-anchor="middle">完整段2</text><rect x="530" y="430" width="100" height="56" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="580" y="467" font-size="21" fill="#20334a" text-anchor="middle">余1</text><text x="130" y="524" font-size="21" fill="#20334a" text-anchor="start">本根2段；ans: 3 + 2 = 5</text><text x="22" y="618" font-size="21" fill="#20334a" text-anchor="start">余料1 + 0 + 1 = 2，也不能拼成第6段。</text><text x="22" y="665" font-size="21" fill="#20334a" text-anchor="start">五段都有自己的原竹子；每根都已取到最多。</text></g></svg>