<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" viewBox="0 0 760 616" role="img"><title>前缀堆与当前末项的实际先后顺序</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="28" y="36" font-size="24" fill="#20334a" text-anchor="start">m=3：当前格先评分，随后才进入前缀堆</text><text x="225" y="78" font-size="19" fill="#20334a" text-anchor="middle">1</text><rect x="188" y="92" width="74" height="50" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="225" y="126" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="328" y="78" font-size="19" fill="#20334a" text-anchor="middle">2</text><rect x="291" y="92" width="74" height="50" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="328" y="126" font-size="26" fill="#20334a" text-anchor="middle">8</text><text x="431" y="78" font-size="19" fill="#20334a" text-anchor="middle">3</text><rect x="394" y="92" width="74" height="50" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="431" y="126" font-size="26" fill="#20334a" text-anchor="middle">1</text><text x="534" y="78" font-size="19" fill="#20334a" text-anchor="middle">4</text><rect x="497" y="92" width="74" height="50" rx="5" fill="#ffedd5" stroke="#6d86a6" stroke-width="2"/><text x="534" y="126" font-size="26" fill="#20334a" text-anchor="middle">7</text><text x="637" y="78" font-size="19" fill="#20334a" text-anchor="middle">5</text><rect x="600" y="92" width="74" height="50" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="637" y="126" font-size="26" fill="#20334a" text-anchor="middle">3</text><text x="28" y="180" font-size="22" fill="#20334a" text-anchor="start">原下标1、3作前项；原下标4作末项：0、1、7</text><text x="28" y="225" font-size="20" fill="#20334a" text-anchor="start">当前</text><text x="142" y="225" font-size="20" fill="#20334a" text-anchor="start">评分前堆</text><text x="345" y="225" font-size="20" fill="#20334a" text-anchor="start">本格候选</text><text x="580" y="225" font-size="20" fill="#20334a" text-anchor="start">入堆、弹出后</text><text x="28" y="267" font-size="21" fill="#20334a" text-anchor="start">k=1</text><text x="142" y="267" font-size="21" fill="#20334a" text-anchor="start">不足两项</text><text x="345" y="267" font-size="21" fill="#20334a" text-anchor="start">无</text><text x="580" y="267" font-size="21" fill="#20334a" text-anchor="start">[0]</text><text x="28" y="315" font-size="21" fill="#20334a" text-anchor="start">k=2</text><text x="142" y="315" font-size="21" fill="#20334a" text-anchor="start">不足两项</text><text x="345" y="315" font-size="21" fill="#20334a" text-anchor="start">无</text><text x="580" y="315" font-size="21" fill="#20334a" text-anchor="start">[0, 8]</text><text x="28" y="363" font-size="21" fill="#20334a" text-anchor="start">k=3</text><text x="142" y="363" font-size="21" fill="#20334a" text-anchor="start">[0, 8]</text><text x="345" y="363" font-size="21" fill="#20334a" text-anchor="start">3×1−8 = −5</text><text x="580" y="363" font-size="21" fill="#20334a" text-anchor="start">[0, 1]</text><text x="28" y="411" font-size="21" fill="#20334a" text-anchor="start">k=4</text><text x="142" y="411" font-size="21" fill="#20334a" text-anchor="start">[0, 1]</text><text x="345" y="411" font-size="21" fill="#20334a" text-anchor="start">3×7−1 = 20</text><text x="580" y="411" font-size="21" fill="#20334a" text-anchor="start">[0, 1]</text><text x="28" y="459" font-size="21" fill="#20334a" text-anchor="start">k=5</text><text x="142" y="459" font-size="21" fill="#20334a" text-anchor="start">[0, 1]</text><text x="345" y="459" font-size="21" fill="#20334a" text-anchor="start">3×3−1 = 8</text><text x="580" y="459" font-size="21" fill="#20334a" text-anchor="start">[0, 1]</text><text x="28" y="540" font-size="23" fill="#20334a" text-anchor="start">ans：尚无候选 → −5 → 20 → 20</text><text x="28" y="584" font-size="23" fill="#20334a" text-anchor="start">原式增量：1×0 + 2×1 + 3×6 = 20</text></g></svg>