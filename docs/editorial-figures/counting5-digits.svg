<svg xmlns="http://www.w3.org/2000/svg" width="640" height="533" viewBox="0 0 640 533" role="img"><title>D-Function：实际数字串的子集相减与进位损失</title><rect width="640" height="533" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">k=3：十六个允许串，减去上面一行四个</text><text x="24" y="71" class="" text-anchor="start">浅红：小于十，移除；绿色：十到九十九，保留</text><rect x="160" y="100" width="80" height="47" rx="5" fill="#fce0dc" stroke="#7394aa"/><text x="200" y="131" class="" text-anchor="middle">00</text><rect x="258" y="100" width="80" height="47" rx="5" fill="#fce0dc" stroke="#7394aa"/><text x="298" y="131" class="" text-anchor="middle">01</text><rect x="356" y="100" width="80" height="47" rx="5" fill="#fce0dc" stroke="#7394aa"/><text x="396" y="131" class="" text-anchor="middle">02</text><rect x="454" y="100" width="80" height="47" rx="5" fill="#fce0dc" stroke="#7394aa"/><text x="494" y="131" class="" text-anchor="middle">03</text><text x="24" y="132" class="" text-anchor="start">移除</text><rect x="160" y="159" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="200" y="190" class="" text-anchor="middle">10</text><rect x="258" y="159" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="298" y="190" class="" text-anchor="middle">11</text><rect x="356" y="159" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="396" y="190" class="" text-anchor="middle">12</text><rect x="454" y="159" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="494" y="190" class="" text-anchor="middle">13</text><text x="24" y="191" class="" text-anchor="start">保留</text><rect x="160" y="218" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="200" y="249" class="" text-anchor="middle">20</text><rect x="258" y="218" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="298" y="249" class="" text-anchor="middle">21</text><rect x="356" y="218" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="396" y="249" class="" text-anchor="middle">22</text><rect x="454" y="218" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="494" y="249" class="" text-anchor="middle">23</text><text x="24" y="250" class="" text-anchor="start">保留</text><rect x="160" y="277" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="200" y="308" class="" text-anchor="middle">30</text><rect x="258" y="277" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="298" y="308" class="" text-anchor="middle">31</text><rect x="356" y="277" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="396" y="308" class="" text-anchor="middle">32</text><rect x="454" y="277" width="80" height="47" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="494" y="308" class="" text-anchor="middle">33</text><text x="24" y="309" class="" text-anchor="start">保留</text><text x="24" y="369" class="" text-anchor="start">4² − 4¹ = 12；短串前面补零，恰好嵌在第一行</text><line x1="24" y1="393" x2="612" y2="393" stroke="#52677b" stroke-width="2" stroke-dasharray=""/><text x="24" y="426" class="" text-anchor="start">24×3：先写列系数（十位6，个位12）</text><text x="24" y="465" class="" text-anchor="start">十个个位换成一个十位： (6,12) → (7,2)</text><text x="24" y="504" class="" text-anchor="start">系数和 18 → 9，减少九；23×3=69 无进位</text></svg>