<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img"><title>三条真实纸带二八一五三四七六二各圈出八五七，每行重新求最大值，汇总答案从八降到五然后不变</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">纸带内圈最大，再拿圈出的数比较</text><text x="22" y="104" font-size="21" fill="#20334a" text-anchor="start">纸带1</text><rect x="92" y="131" width="76" height="55" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="130" y="168" font-size="25" fill="#20334a" text-anchor="middle">2</text><rect x="190" y="131" width="76" height="55" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="228" y="168" font-size="25" fill="#20334a" text-anchor="middle">8</text><ellipse cx="228" cy="158" rx="31" ry="22" fill="none" stroke="#b45309" stroke-width="2"/><rect x="288" y="131" width="76" height="55" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="326" y="168" font-size="25" fill="#20334a" text-anchor="middle">1</text><text x="430" y="153" font-size="22" fill="#20334a" text-anchor="start">本行8</text><text x="430" y="195" font-size="22" fill="#20334a" text-anchor="start">ans=8</text><text x="22" y="238" font-size="20" fill="#20334a" text-anchor="start">重置本行后：2→8→8</text><text x="22" y="285" font-size="21" fill="#20334a" text-anchor="start">纸带2</text><rect x="92" y="312" width="76" height="55" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="130" y="349" font-size="25" fill="#20334a" text-anchor="middle">5</text><ellipse cx="130" cy="339" rx="31" ry="22" fill="none" stroke="#b45309" stroke-width="2"/><rect x="190" y="312" width="76" height="55" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="228" y="349" font-size="25" fill="#20334a" text-anchor="middle">3</text><rect x="288" y="312" width="76" height="55" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="326" y="349" font-size="25" fill="#20334a" text-anchor="middle">4</text><text x="430" y="334" font-size="22" fill="#20334a" text-anchor="start">本行5</text><text x="430" y="376" font-size="22" fill="#20334a" text-anchor="start">ans=5</text><text x="22" y="419" font-size="20" fill="#20334a" text-anchor="start">重置本行后：5→5→5</text><text x="22" y="466" font-size="21" fill="#20334a" text-anchor="start">纸带3</text><rect x="92" y="493" width="76" height="55" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="130" y="530" font-size="25" fill="#20334a" text-anchor="middle">7</text><ellipse cx="130" cy="520" rx="31" ry="22" fill="none" stroke="#b45309" stroke-width="2"/><rect x="190" y="493" width="76" height="55" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="228" y="530" font-size="25" fill="#20334a" text-anchor="middle">6</text><rect x="288" y="493" width="76" height="55" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="326" y="530" font-size="25" fill="#20334a" text-anchor="middle">2</text><text x="430" y="515" font-size="22" fill="#20334a" text-anchor="start">本行7</text><text x="430" y="557" font-size="22" fill="#20334a" text-anchor="start">ans=5</text><text x="22" y="600" font-size="20" fill="#20334a" text-anchor="start">重置本行后：7→7→7</text><text x="22" y="705" font-size="22" fill="#20334a" text-anchor="start">只有圈出的8、5、7进入最后比较。</text><text x="22" y="755" font-size="22" fill="#20334a" text-anchor="start">ans：INT_MAX → 8 → 5 → 5</text></g></svg>