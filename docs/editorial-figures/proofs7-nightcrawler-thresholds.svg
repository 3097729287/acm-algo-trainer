<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img"><title>同一六点树在五个真实权值阈值下的节点数、最少链高代表上界及三四五链的实际高代表数，逐列同时达到最小值上界，解释同一构造兼顾全部k</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">同一6点树：逐个阈值T检查“至少达到T的链最大值”数量</text><text x="61" y="91" font-size="22" fill="#20334a" text-anchor="middle">T</text><text x="177" y="91" font-size="22" fill="#20334a" text-anchor="middle">N_T</text><text x="294" y="91" font-size="22" fill="#20334a" text-anchor="middle">H</text><text x="408" y="91" font-size="22" fill="#20334a" text-anchor="middle">k=3</text><text x="517" y="91" font-size="22" fill="#20334a" text-anchor="middle">k=4</text><text x="628" y="91" font-size="22" fill="#20334a" text-anchor="middle">k=5</text><rect x="22" y="114" width="676" height="57" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="61" y="152" font-size="24" fill="#20334a" text-anchor="middle">8</text><text x="177" y="152" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="294" y="152" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="408" y="152" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="517" y="152" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="628" y="152" font-size="24" fill="#20334a" text-anchor="middle">2</text><rect x="22" y="181" width="676" height="57" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="61" y="219" font-size="24" fill="#20334a" text-anchor="middle">7</text><text x="177" y="219" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="294" y="219" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="408" y="219" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="517" y="219" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="628" y="219" font-size="24" fill="#20334a" text-anchor="middle">3</text><rect x="22" y="248" width="676" height="57" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="61" y="286" font-size="24" fill="#20334a" text-anchor="middle">6</text><text x="177" y="286" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="294" y="286" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="408" y="286" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="517" y="286" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="628" y="286" font-size="24" fill="#20334a" text-anchor="middle">4</text><rect x="22" y="315" width="676" height="57" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="61" y="353" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="177" y="353" font-size="24" fill="#20334a" text-anchor="middle">5</text><text x="294" y="353" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="408" y="353" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="517" y="353" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="628" y="353" font-size="24" fill="#20334a" text-anchor="middle">5</text><rect x="22" y="382" width="676" height="57" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="61" y="420" font-size="24" fill="#20334a" text-anchor="middle">2</text><text x="177" y="420" font-size="24" fill="#20334a" text-anchor="middle">6</text><text x="294" y="420" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="408" y="420" font-size="24" fill="#20334a" text-anchor="middle">3</text><text x="517" y="420" font-size="24" fill="#20334a" text-anchor="middle">4</text><text x="628" y="420" font-size="24" fill="#20334a" text-anchor="middle">5</text><text x="22" y="503" font-size="20" fill="#20334a" text-anchor="start">例如T=6：高节点{1,2,5,6}共4个，三条叶子链至多贡献3个</text><text x="22" y="549" font-size="21" fill="#20334a" text-anchor="start">三个最大值[7,8,9]均高；多一条链时取出备用节点6，达到4个</text><text x="22" y="595" font-size="20" fill="#20334a" text-anchor="start">任意k链划分：L=3条含叶链最多H个高代表，另k−3条最多各1个</text><text x="22" y="641" font-size="21" fill="#20334a" text-anchor="start">上界 min(N_T,H+k−3)；实际每一列、每一阈值都同时达到</text><text x="22" y="687" font-size="20" fill="#20334a" text-anchor="start">不是为不同阈值分别改一份划分；前图同一套划分已经满足全部表格</text><text x="22" y="733" font-size="21" fill="#20334a" text-anchor="start">正整数分数之和 = 各阈值下高分个数之和，因此全k的总分最优</text></g></svg>