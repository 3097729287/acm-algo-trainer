34a" text-anchor="middle">1</text><text x="525" y="106" font-size="17" fill="#20334a" text-anchor="middle">4</text><path d="M557,142 L584,142" stroke="#8594a8" stroke-width="4" fill="none"/><text x="571" y="191" font-size="15" fill="#8594a8" text-anchor="middle">边4</text><rect x="584" y="115" width="64" height="55" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="616" y="151" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="616" y="106" font-size="17" fill="#20334a" text-anchor="middle">5</text><path d="M220,81 L648,81" stroke="#2563a6" stroke-width="5" fill="none"/><text x="28" y="227" font-size="23" fill="#20334a" text-anchor="start">翻字符 [2, 3] → 01010</text><text x="28" y="266" font-size="22" fill="#16804c" text-anchor="start">内部坏边：一、三；同时修好两条</text><text x="28" y="351" font-size="22" fill="#20334a" text-anchor="start">查询 [2, 4]</text><rect x="220" y="375" width="64" height="55" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="252" y="411" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="252" y="366" font-size="17" fill="#20334a" text-anchor="middle">1</text><path d="M284,402 L311,402" stroke="#c13041" stroke-width="4" fill="none"/><text x="298" y="451" font-size="15" fill="#c13041" text-anchor="middle">边1</text><rect x="311" y="375" width="64" height="55" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="343" y="411" font-size="26" fill="#20334a" text-anchor="middle">0</text><text x="343" y="366" font-size="17" fill="#20334a" text-anchor="middle">2</text><path d="M375,402 L402,402" stroke="#8594a8" stroke-width="4" fill="none"/><text x="389" y="451" font-size="15" fill="#8594a8" text-anchor="middle">边2</text><rect x="402" y="375" width="64" height="55" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="434" y="411" font-size="26" fill="#20334a" text-anchor="middle">1</text><text x="434" y="366" font-size="17" fill="#20334a" text-anchor="middle">3</text><path d="