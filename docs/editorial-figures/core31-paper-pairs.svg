<svg xmlns="http://www.w3.org/2000/svg" width="720" height="733" viewBox="0 0 720 733" role="img"><title>九面书五张A4实际正反面一二三四五六七八九空白，一五配成A3一二四配成A3二，中间五六面单留，第八面经第四张A4得到第二张A3</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">同一本九面书：五张A4首尾合并成A3</text><text x="22" y="78" font-size="21" fill="#20334a" text-anchor="start">每张A4两面；最后没有第10面，反面留空</text><path d="M95 190 Q359 80 623 190" fill="none" stroke="#059669" stroke-width="4"/><path d="M227 190 Q359 150 491 190" fill="none" stroke="#b45309" stroke-width="4"/><text x="359" y="116" font-size="19" fill="#20334a" text-anchor="middle">A3第1张：A4号1与5</text><text x="359" y="158" font-size="19" fill="#20334a" text-anchor="middle">A3第2张：A4号2与4</text><rect x="35" y="200" width="120" height="136" rx="8" fill="#d1fae5" stroke="#2d6db4" stroke-width="2"/><text x="95" y="236" font-size="21" fill="#20334a" text-anchor="middle">A4号1</text><text x="95" y="278" font-size="21" fill="#20334a" text-anchor="middle">1 / 2</text><text x="95" y="316" font-size="16" fill="#20334a" text-anchor="middle">正面 / 反面</text><rect x="167" y="200" width="120" height="136" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="227" y="236" font-size="21" fill="#20334a" text-anchor="middle">A4号2</text><text x="227" y="278" font-size="21" fill="#20334a" text-anchor="middle">3 / 4</text><text x="227" y="316" font-size="16" fill="#20334a" text-anchor="middle">正面 / 反面</text><rect x="299" y="200" width="120" height="136" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="359" y="236" font-size="21" fill="#20334a" text-anchor="middle">A4号3</text><text x="359" y="278" font-size="21" fill="#20334a" text-anchor="middle">5 / 6</text><text x="359" y="316" font-size="16" fill="#20334a" text-anchor="middle">正面 / 反面</text><rect x="431" y="200" width="120" height="136" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="491" y="236" font-size="21" fill="#20334a" text-anchor="middle">A4号4</text><text x="491" y="278" font-size="21" fill="#20334a" text-anchor="middle">7 / 8</text><text x="491" y="316" font-size="16" fill="#20334a" text-anchor="middle">正面 / 反面</text><rect x="563" y="200" width="120" height="136" rx="8" fill="#d1fae5" stroke="#2d6db4" stroke-width="2"/><text x="623" y="236" font-size="21" fill="#20334a" text-anchor="middle">A4号5</text><text x="623" y="278" font-size="21" fill="#20334a" text-anchor="middle">9 / 空</text><text x="623" y="316" font-size="16" fill="#20334a" text-anchor="middle">正面 / 反面</text><path d="M359 338 V405" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/><rect x="35" y="410" width="648" height="67" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="359" y="452" font-size="22" fill="#20334a" text-anchor="middle">正中A4号3单留：第5、6面输出0</text><text x="22" y="534" font-size="21" fill="#20334a" text-anchor="start">第8面 → A4号4 → 搭档A4号2 → A3第2张</text><text x="22" y="583" font-size="22" fill="#20334a" text-anchor="start">min(4, 5+1−4) = min(4,2) = 2</text><text x="22" y="636" font-size="21" fill="#20334a" text-anchor="start">若n=8，则k=4，号2与3配对，没有单留。</text><text x="22" y="689" font-size="21" fill="#20334a" text-anchor="start">先判断k为奇数且at在正中，其余才用min。</text></g></svg>