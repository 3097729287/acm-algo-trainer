<svg xmlns="http://www.w3.org/2000/svg" width="720" height="915" viewBox="0 0 720 915" role="img"><title>六人在同一圆上按顺时针编号Bob第一Alice第六，前后两个圆显示只交换一号四分与六号一分，三号八分保持不动</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">六个座位不动：Bob优先，最高分不一定被换</text><text x="22" y="85" font-size="20" fill="#20334a" text-anchor="start">使用前</text><circle cx="350" cy="238" r="127" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="305.0" y="87.0" width="90" height="49" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="350.0" y="121.0" font-size="20" fill="#20334a" text-anchor="middle">4分</text><text x="350.0" y="75.0" font-size="18" fill="#20334a" text-anchor="middle">1号Bob</text><rect x="414.9852262806237" y="150.5" width="90" height="49" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="459.9852262806237" y="184.5" font-size="20" fill="#20334a" text-anchor="middle">2分</text><text x="459.9852262806237" y="138.5" font-size="18" fill="#20334a" text-anchor="middle">2号</text><rect x="414.9852262806237" y="277.5" width="90" height="49" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="459.9852262806237" y="311.5" font-size="20" fill="#20334a" text-anchor="middle">8分</text><text x="459.9852262806237" y="265.5" font-size="18" fill="#20334a" text-anchor="middle">3号</text><rect x="305.0" y="341.0" width="90" height="49" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="350.0" y="375.0" font-size="20" fill="#20334a" text-anchor="middle">5分</text><text x="350.0" y="329.0" font-size="18" fill="#20334a" text-anchor="middle">4号</text><rect x="195.0147737193763" y="277.50000000000006" width="90" height="49" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="240.0147737193763" y="311.50000000000006" font-size="20" fill="#20334a" text-anchor="middle">7分</text><text x="240.0147737193763" y="265.50000000000006" font-size="18" fill="#20334a" text-anchor="middle">5号</text><rect x="195.0147737193763" y="150.5" width="90" height="49" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="240.0147737193763" y="184.5" font-size="20" fill="#20334a" text-anchor="middle">1分</text><text x="240.0147737193763" y="138.5" font-size="18" fill="#20334a" text-anchor="middle">6号Alice</text><text x="350" y="228" font-size="19" fill="#20334a" text-anchor="middle">编号顺时针1→6</text><text x="350" y="262" font-size="19" fill="#20334a" text-anchor="middle">3号8分保持</text><text x="22" y="485" font-size="20" fill="#20334a" text-anchor="start">使用后：座位不动</text><circle cx="350" cy="638" r="127" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="305.0" y="487.0" width="90" height="49" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="350.0" y="521.0" font-size="20" fill="#20334a" text-anchor="middle">1分</text><text x="350.0" y="475.0" font-size="18" fill="#20334a" text-anchor="middle">1号Bob</text><rect x="414.9852262806237" y="550.5" width="90" height="49" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="459.9852262806237" y="584.5" font-size="20" fill="#20334a" text-anchor="middle">2分</text><text x="459.9852262806237" y="538.5" font-size="18" fill="#20334a" text-anchor="middle">2号</text><rect x="414.9852262806237" y="677.5" width="90" height="49" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="459.9852262806237" y="711.5" font-size="20" fill="#20334a" text-anchor="middle">8分</text><text x="459.9852262806237" y="665.5" font-size="18" fill="#20334a" text-anchor="middle">3号</text><rect x="305.0" y="741.0" width="90" height="49" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="350.0" y="775.0" font-size="20" fill="#20334a" text-anchor="middle">5分</text><text x="350.0" y="729.0" font-size="18" fill="#20334a" text-anchor="middle">4号</text><rect x="195.0147737193763" y="677.5" width="90" height="49" rx="8" fill="#e2e8f0" stroke="#2d6db4" stroke-width="2"/><text x="240.0147737193763" y="711.5" font-size="20" fill="#20334a" text-anchor="middle">7分</text><text x="240.0147737193763" y="665.5" font-size="18" fill="#20334a" text-anchor="middle">5号</text><rect x="195.0147737193763" y="550.5" width="90" height="49" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><text x="240.0147737193763" y="584.5" font-size="20" fill="#20334a" text-anchor="middle">4分</text><text x="240.0147737193763" y="538.5" font-size="18" fill="#20334a" text-anchor="middle">6号Alice</text><text x="350" y="628" font-size="19" fill="#20334a" text-anchor="middle">编号顺时针1→6</text><text x="350" y="662" font-size="19" fill="#20334a" text-anchor="middle">3号8分保持</text><text x="22" y="831" font-size="20" fill="#20334a" text-anchor="start">4&gt;1已决定换Bob；不是总与3号最高分交换。</text><text x="22" y="875" font-size="21" fill="#20334a" text-anchor="start">最后仍按编号输出：1 2 8 5 7 4。</text></g></svg>