<svg xmlns="http://www.w3.org/2000/svg" width="640" height="484" viewBox="0 0 640 484" role="img"><title>Halving Subtraction：三条正整数起始数及各数组项真实贡献</title><rect width="640" height="484" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">把位的一分配给三条真实操作：11、1、1</text><text x="24" y="70" class="" text-anchor="start">A=[13,5,2]；c₀=3，c₁=1，尾项2整体放到第一条</text><text x="76" y="118" class="small" text-anchor="middle">起始x</text><text x="195" y="118" class="small" text-anchor="middle">二进制</text><text x="314" y="118" class="small" text-anchor="middle">减第一项</text><text x="433" y="118" class="small" text-anchor="middle">减第二项</text><text x="552" y="118" class="small" text-anchor="middle">减第三项</text><rect x="24" y="137" width="105" height="50" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="76" y="170" class="" text-anchor="middle">11</text><rect x="143" y="137" width="105" height="50" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="195" y="170" class="" text-anchor="middle">1011</text><rect x="262" y="137" width="105" height="50" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="314" y="170" class="" text-anchor="middle">11</text><rect x="381" y="137" width="105" height="50" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="433" y="170" class="" text-anchor="middle">5</text><rect x="500" y="137" width="105" height="50" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="552" y="170" class="" text-anchor="middle">2</text><rect x="24" y="201" width="105" height="50" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="76" y="234" class="" text-anchor="middle">1</text><rect x="143" y="201" width="105" height="50" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="195" y="234" class="" text-anchor="middle">0001</text><rect x="262" y="201" width="105" height="50" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="314" y="234" class="" text-anchor="middle">1</text><rect x="381" y="201" width="105" height="50" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="433" y="234" class="" text-anchor="middle">0</text><rect x="500" y="201" width="105" height="50" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="552" y="234" class="" text-anchor="middle">0</text><rect x="24" y="265" width="105" height="50" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="76" y="298" class="" text-anchor="middle">1</text><rect x="143" y="265" width="105" height="50" rx="5" fill="#d8edf9" stroke="#7394aa"/><text x="195" y="298" class="" text-anchor="middle">0001</text><rect x="262" y="265" width="105" height="50" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="314" y="298" class="" text-anchor="middle">1</text><rect x="381" y="265" width="105" height="50" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="433" y="298" class="" text-anchor="middle">0</text><rect x="500" y="265" width="105" height="50" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="552" y="298" class="" text-anchor="middle">0</text><text x="24" y="374" class="" text-anchor="start">列和：11+1+1=13，5+0+0=5，2+0+0=2</text><text x="24" y="414" class="" text-anchor="start">最低位三个一，下一位一个一；高位商只在第一条为2</text><text x="24" y="455" class="" text-anchor="start">真实状态：[13,5,2] → [2,0,0] → [1,0,0] → [0,0,0]</text></svg>