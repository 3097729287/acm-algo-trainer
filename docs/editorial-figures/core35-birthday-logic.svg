<svg xmlns="http://www.w3.org/2000/svg" width="760" height="924" viewBox="0 0 760 924" role="img"><title>Andrea到Bob，Cindy到Bob，Cindy与Dora双向有向图；Dora查询队列经Cindy到Bob为是；Andrea Bob出勤而Cindy Dora缺席仍合规，构成不必然出席的真实反例</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#12365a" font-size="24" text-anchor="start">Andrea=&gt;Bob&lt;=Cindy&lt;=&gt;Dora</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><rect x="35" y="94" width="150" height="68" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110" y="136" fill="#12365a" font-size="23" text-anchor="middle">Andrea</text><rect x="218" y="94" width="150" height="68" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="293" y="136" fill="#12365a" font-size="23" text-anchor="middle">Bob</text><rect x="400" y="94" width="150" height="68" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="475" y="136" fill="#12365a" font-size="23" text-anchor="middle">Cindy</text><rect x="586" y="94" width="150" height="68" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="661" y="136" fill="#12365a" font-size="23" text-anchor="middle">Dora</text><path d="M185 127 H218" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M400 127 H368" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 116 H586" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M586 144 H550" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="24" y="219" fill="#12365a" font-size="21" text-anchor="start">问Dora是否推出Bob：沿边Dora → Cindy → Bob。</text><text x="24" y="250" fill="#12365a" font-size="17" text-anchor="start">处理</text><text x="190" y="250" fill="#12365a" font-size="17" text-anchor="start">本步后的待出队者</text><text x="420" y="250" fill="#12365a" font-size="17" text-anchor="start">已访问者</text><text x="24" y="296" fill="#12365a" font-size="21" text-anchor="start">开始</text><rect x="151" y="265" width="240" height="48" rx="6" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="271" y="297" fill="#12365a" font-size="20" text-anchor="middle">Dora</text><text x="420" y="296" fill="#12365a" font-size="19" text-anchor="start">Dora</text><text x="24" y="382" fill="#12365a" font-size="21" text-anchor="start">弹Dora</text><rect x="151" y="351" width="240" height="48" rx="6" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="271" y="383" fill="#12365a" font-size="20" text-anchor="middle">Cindy</text><text x="420" y="382" fill="#12365a" font-size="19" text-anchor="start">Dora、Cindy</text><text x="24" y="468" fill="#12365a" font-size="21" text-anchor="start">弹Cindy</text><rect x="151" y="437" width="240" height="48" rx="6" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="271" y="469" fill="#12365a" font-size="20" text-anchor="middle">Bob</text><text x="420" y="468" fill="#12365a" font-size="19" text-anchor="start">Dora、Cindy、Bob</text><text x="24" y="554" fill="#12365a" font-size="21" text-anchor="start">弹Bob</text><rect x="151" y="523" width="240" height="48" rx="6" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="271" y="555" fill="#12365a" font-size="20" text-anchor="middle">空；命中目标，Yes</text><text x="420" y="554" fill="#12365a" font-size="19" text-anchor="start">Dora、Cindy、Bob</text><text x="24" y="662" fill="#12365a" font-size="21" text-anchor="start">问Andrea是否推出Cindy：下面是一种合法出勤。</text><rect x="29" y="701" width="162" height="84" rx="6" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="110" y="731" fill="#12365a" font-size="22" text-anchor="middle">Andrea</text><text x="110" y="765" fill="#12365a" font-size="21" text-anchor="middle">参加</text><rect x="213" y="701" width="162" height="84" rx="6" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="294" y="731" fill="#12365a" font-size="22" text-anchor="middle">Bob</text><text x="294" y="765" fill="#12365a" font-size="21" text-anchor="middle">参加</text><rect x="397" y="701" width="162" height="84" rx="6" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="478" y="731" fill="#12365a" font-size="22" text-anchor="middle">Cindy</text><text x="478" y="765" fill="#12365a" font-size="21" text-anchor="middle">不参加</text><rect x="581" y="701" width="162" height="84" rx="6" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="662" y="731" fill="#12365a" font-size="22" text-anchor="middle">Dora</text><text x="662" y="765" fill="#12365a" font-size="21" text-anchor="middle">不参加</text><text x="24" y="832" fill="#12365a" font-size="21" text-anchor="start">所有规则都满足，但Andrea来而Cindy不来：答No。</text><text x="24" y="880" fill="#12365a" font-size="22" text-anchor="start">No表示不保证，允许有人自愿参加。</text></svg>