<svg xmlns="http://www.w3.org/2000/svg" width="760" height="885" viewBox="0 0 760 885" role="img"><title>三个房间实际路径的每边容量二，三号三盒先分二盒一盒送二号，二号再送二盒一号，三步达到目标二一零，父边净需求二来自子树和</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="38" fill="#17324d" font-size="24" text-anchor="start">1—2—3：现有[0,0,3]，目标[2,1,0]</text><rect x="75" y="119" width="112" height="92" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="131" y="154" fill="#17324d" font-size="22" text-anchor="middle">房间1</text><text x="131" y="191" fill="#17324d" font-size="25" text-anchor="middle">0→2</text><line x1="190" y1="166" x2="323" y2="166" stroke="#64748b" stroke-width="3"/><text x="258" y="146" fill="#17324d" font-size="20" text-anchor="middle">容量2</text><rect x="327" y="119" width="112" height="92" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="383" y="154" fill="#17324d" font-size="22" text-anchor="middle">房间2</text><text x="383" y="191" fill="#17324d" font-size="25" text-anchor="middle">0→1</text><line x1="442" y1="166" x2="575" y2="166" stroke="#64748b" stroke-width="3"/><text x="510" y="146" fill="#17324d" font-size="20" text-anchor="middle">容量2</text><rect x="579" y="119" width="112" height="92" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="635" y="154" fill="#17324d" font-size="22" text-anchor="middle">房间3</text><text x="635" y="191" fill="#17324d" font-size="25" text-anchor="middle">3→0</text><text x="24" y="265" fill="#17324d" font-size="22" text-anchor="start">边2—3：右侧多3，至少ceil(3/2)=2趟。</text><text x="24" y="318" fill="#17324d" font-size="22" text-anchor="start">边1—2：右侧总多2，至少ceil(2/2)=1趟。</text><text x="24" y="412" fill="#17324d" font-size="22" text-anchor="start">初始</text><rect x="258" y="373" width="103" height="57" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="310" y="411" fill="#17324d" font-size="28" text-anchor="middle">0</text><rect x="398" y="3