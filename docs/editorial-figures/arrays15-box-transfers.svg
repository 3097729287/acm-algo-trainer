d" font-size="28" text-anchor="middle">1</text><rect x="538" y="646" width="103" height="57" rx="4" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="590" y="684" fill="#17324d" font-size="28" text-anchor="middle">0</text><text x="24" y="785" fill="#17324d" font-size="23" text-anchor="start">3趟全部可执行，同时达到两条边的下界。</text><text x="24" y="840" fill="#17324d" font-size="21" text-anchor="start">d[2]初始−1，合并孩子+3后才成为子树差额+2。</text></svg>