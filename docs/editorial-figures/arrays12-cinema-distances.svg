<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img"><title>观察点移动与四个实际距离</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="28" y="38" font-size="25" fill="#20334a" text-anchor="start">a = [1, 4, 2, 3]，观察点从二走到三</text><path d="M90,150 L665,150" stroke="#6d86a6" stroke-width="3" fill="none"/><path d="M130,140 L130,160" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="130" y="110" font-size="23" fill="#20334a" text-anchor="middle">a1 = 1</text><text x="130" y="188" font-size="20" fill="#20334a" text-anchor="middle">位置1</text><text x="130" y="246" font-size="24" fill="#20334a" text-anchor="middle">1 → 2</text><text x="130" y="284" font-size="21" fill="#16804c" text-anchor="middle">贡献 +1</text><path d="M290,140 L290,160" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="290" y="110" font-size="23" fill="#20334a" text-anchor="middle">a2 = 4</text><text x="290" y="188" font-size="20" fill="#20334a" text-anchor="middle">位置2</text><text x="290" y="246" font-size="24" fill="#20334a" text-anchor="middle">0 → 1</text><text x="290" y="284" font-size="21" fill="#16804c" text-anchor="middle">贡献 +4</text><path d="M450,140 L450,160" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="450" y="110" font-size="23" fill="#20334a" text-anchor="middle">a3 = 2</text><text x="450" y="188" font-size="20" fill="#20334a" text-anchor="middle">位置3</text><text x="450" y="246" font-size="24" fill="#20334a" text-anchor="middle">1 → 0</text><text x="450" y="284" font-size="21" fill="#b65e1a" text-anchor="middle">贡献 −2</text><path d="M610,140 L610,160" stroke="#6d86a6" stroke-width="3" fill="none"/><text x="610" y="110" font-size="23" fill="#20334a" text-anchor="middle">a4 = 3</text><text x="610" y="188" font-size="20" fill="#20334a" text-anchor="middle">位置4</text><text x="610" y="246" font-size="24" fill="#20334a" text-anchor="middle">2 → 1</text><text x="610" y="284" font-size="21" fill="#b65e1a" text-anchor="middle">贡献 −3</text><path d="M300,205 L440,205" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="370" y="226" font-size="16" fill="#20334a" text-anchor="middle">观察点移动</text><text x="28" y="329" font-size="21" fill="#20334a" text-anchor="start">左侧含位置二：距离 +1     右侧含位置三：距离 −1</text><text x="28" y="373" font-size="24" fill="#20334a" text-anchor="start">f(3) − f(2) = 9 − 9 = 1 + 4 − 2 − 3 = 0</text><text x="28" y="416" font-size="23" fill="#20334a" text-anchor="start">差分 d = [−8, 0, 4] → a₂ = 4，a₃ = 2</text><text x="28" y="458" font-size="21" fill="#20334a" text-anchor="start">左端减内部和 8 → a₄ = 3；右端减内部和 10 → a₁ = 1</text></g></svg>