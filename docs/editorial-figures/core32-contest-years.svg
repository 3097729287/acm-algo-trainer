<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img"><title>同一条年份轴上3000至3007八年，区间内3001三零零三三零零四停办，3008在外，逐个减一后剩五个实际举办年</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">八个真实年份：只扣区间内停办年</text><text x="22" y="76" font-size="19" fill="#20334a" text-anchor="start">开始3000；截至3007；停办3001/3003/3004/3008</text><rect x="42" y="112" width="573" height="100" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="343" y="144" font-size="20" fill="#20334a" text-anchor="middle">统计区间[3000,3007]：共8年</text><path d="M60 165 V244" stroke="#64748b"/><text x="60" y="270" font-size="17" fill="#087b48" text-anchor="middle">3000</text><circle cx="60" cy="190" r="15" fill="#a7f3d0" stroke="#087b48"/><path d="M134 165 V244" stroke="#64748b"/><text x="134" y="270" font-size="17" fill="#b91c1c" text-anchor="middle">3001</text><circle cx="134" cy="190" r="15" fill="#fecaca" stroke="#b91c1c"/><path d="M126 182 l16 16 M126 198 l16 -16" stroke="#b91c1c" stroke-width="3"/><path d="M208 165 V244" stroke="#64748b"/><text x="208" y="270" font-size="17" fill="#087b48" text-anchor="middle">3002</text><circle cx="208" cy="190" r="15" fill="#a7f3d0" stroke="#087b48"/><path d="M282 165 V244" stroke="#64748b"/><text x="282" y="270" font-size="17" fill="#b91c1c" text-anchor="middle">3003</text><circle cx="282" cy="190" r="15" fill="#fecaca" stroke="#b91c1c"/><path d="M274 182 l16 16 M274 198 l16 -16" stroke="#b91c1c" stroke-width="3"/><path d="M356 165 V244" stroke="#64748b"/><text x="356" y="270" font-size="17" fill="#b91c1c" text-anchor="middle">3004</text><circle cx="356" cy="190" r="15" fill="#fecaca" stroke="#b91c1c"/><path d="M348 182 l16 16 M348 198 l16 -16" stroke="#b91c1c" stroke-width="3"/><path d="M430 165 V244" stroke="#64748b"/><text x="430" y="270" font-size="17" fill="#087b48" text-anchor="middle">3005</text><circle cx="430" cy="190" r="15" fill="#a7f3d0" stroke="#087b48"/><path d="M504 165 V244" stroke="#64748b"/><text x="504" y="270" font-size="17" fill="#087b48" text-anchor="middle">3006</text><circle cx="504" cy="190" r="15" fill="#a7f3d0" stroke="#087b48"/><path d="M578 165 V244" stroke="#64748b"/><text x="578" y="270" font-size="17" fill="#087b48" text-anchor="middle">3007</text><circle cx="578" cy="190" r="15" fill="#a7f3d0" stroke="#087b48"/><path d="M652 165 V244" stroke="#64748b"/><text x="652" y="270" font-size="17" fill="#64748b" text-anchor="middle">3008</text><circle cx="652" cy="190" r="15" fill="#fecaca" stroke="#64748b"/><path d="M644 182 l16 16 M644 198 l16 -16" stroke="#64748b" stroke-width="3"/><text x="22" y="324" font-size="21" fill="#20334a" text-anchor="start">区间内划去3001、3003、3004；3008在外。</text><text x="22" y="376" font-size="23" fill="#20334a" text-anchor="start">ans：8 → 7 → 6 → 5 → 5</text><text x="22" y="431" font-size="21" fill="#20334a" text-anchor="start">留下3000/3002/3005/3006/3007，共5届。</text><text x="22" y="484" font-size="20" fill="#20334a" text-anchor="start">first以前无需再筛：输入保证停办年都&gt;first。</text><text x="22" y="533" font-size="21" fill="#20334a" text-anchor="start">每个停办年唯一，故不会重复扣同一年。</text></g></svg>