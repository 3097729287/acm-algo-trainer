<svg xmlns="http://www.w3.org/2000/svg" width="720" height="581" viewBox="0 0 720 581" role="img"><title>合法四张桌面牌二四一三的六次具体翻牌，位置排列三一四二的两次新最大值对应两次寻找未知目标，成功四次失败两次</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="23" fill="#20334a" text-anchor="start">桌面牌值 B=[2,4,1,3]；从左向右揭示未知位置</text><text x="113" y="80" font-size="20" fill="#20334a" text-anchor="middle">位置1</text><rect x="58" y="96" width="110" height="69" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="113" y="141" font-size="29" fill="#20334a" text-anchor="middle">2</text><text x="278" y="80" font-size="20" fill="#20334a" text-anchor="middle">位置2</text><rect x="223" y="96" width="110" height="69" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="278" y="141" font-size="29" fill="#20334a" text-anchor="middle">4</text><text x="443" y="80" font-size="20" fill="#20334a" text-anchor="middle">位置3</text><rect x="388" y="96" width="110" height="69" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="443" y="141" font-size="29" fill="#20334a" text-anchor="middle">1</text><text x="608" y="80" font-size="20" fill="#20334a" text-anchor="middle">位置4</text><rect x="553" y="96" width="110" height="69" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="608" y="141" font-size="29" fill="#20334a" text-anchor="middle">3</text><text x="22" y="210" font-size="23" fill="#20334a" text-anchor="start">因此 pos[1..4]=[3,1,4,2]，记录最大值为3、4</text><text x="22" y="251" font-size="22" fill="#20334a" text-anchor="start">下面六步是实际翻牌，不把位置序列误当成桌面牌值：</text><rect x="22" y="285" width="103" height="134" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="73" y="317" font-size="20" fill="#20334a" text-anchor="middle">第1步</text><text x="73" y="354" font-size="19" fill="#20334a" text-anchor="middle">翻位置1</text><text x="73" y="391" font-size="22" fill="#20334a" text-anchor="middle">错：2</text><rect x="137" y="285" width="103" height="134" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="188" y="317" font-size="20" fill="#20334a" text-anchor="middle">第2步</text><text x="188" y="354" font-size="19" fill="#20334a" text-anchor="middle">翻位置2</text><text x="188" y="391" font-size="22" fill="#20334a" text-anchor="middle">错：4</text><rect x="252" y="285" width="103" height="134" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="303" y="317" font-size="20" fill="#20334a" text-anchor="middle">第3步</text><text x="303" y="354" font-size="19" fill="#20334a" text-anchor="middle">翻位置3</text><text x="303" y="391" font-size="22" fill="#20334a" text-anchor="middle">吃1</text><rect x="367" y="285" width="103" height="134" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="418" y="317" font-size="20" fill="#20334a" text-anchor="middle">第4步</text><text x="418" y="354" font-size="19" fill="#20334a" text-anchor="middle">翻位置1</text><text x="418" y="391" font-size="22" fill="#20334a" text-anchor="middle">吃2</text><rect x="482" y="285" width="103" height="134" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="533" y="317" font-size="20" fill="#20334a" text-anchor="middle">第5步</text><text x="533" y="354" font-size="19" fill="#20334a" text-anchor="middle">翻位置4</text><text x="533" y="391" font-size="22" fill="#20334a" text-anchor="middle">吃3</text><rect x="597" y="285" width="103" height="134" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="648" y="317" font-size="20" fill="#20334a" text-anchor="middle">第6步</text><text x="648" y="354" font-size="19" fill="#20334a" text-anchor="middle">翻位置2</text><text x="648" y="391" font-size="22" fill="#20334a" text-anchor="middle">吃4</text><text x="22" y="468" font-size="22" fill="#20334a" text-anchor="start">寻找1：新揭3张，失败2次；寻找2：已知，直接吃</text><text x="22" y="511" font-size="22" fill="#20334a" text-anchor="start">寻找3：新揭1张，无失败；寻找4：已知，直接吃</text><text x="22" y="555" font-size="22" fill="#20334a" text-anchor="start">总计N=4次成功、N−R=2次失败，所以K=2N−R=6</text></g></svg>