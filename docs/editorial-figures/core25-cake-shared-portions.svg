0.0 86.0 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="442" y="157" font-size="21" fill="#20334a" text-anchor="start">蓝：大班4份</text><text x="442" y="196" font-size="21" fill="#20334a" text-anchor="start">4/12=1/3</text><text x="442" y="265" font-size="21" fill="#20334a" text-anchor="start">绿：中班3份</text><text x="442" y="304" font-size="21" fill="#20334a" text-anchor="start">3/12=1/4</text><text x="442" y="373" font-size="21" fill="#20334a" text-anchor="start">灰：余5份</text><text x="22" y="448" font-size="21" fill="#20334a" text-anchor="start">总需求7份；一只提供12份，确实同时够两人。</text><text x="22" y="498" font-size="20" fill="#20334a" text-anchor="start">分别向上取整会准备2只，这一实际分法只用1只。</text></g></svg>