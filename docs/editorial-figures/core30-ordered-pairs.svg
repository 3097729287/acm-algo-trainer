<svg xmlns="http://www.w3.org/2000/svg" width="640" height="775" viewBox="0 0 640 775" role="img"><title>n十二的实际整数坐标格，列为x一二三四，行为y三二一，七个合法有序数对标绿，其他点超界，贡献三二二零</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="22" fill="#20334a" text-anchor="start">n=12：绿色整数点各代表一个有序对</text><text x="22" y="79" font-size="20" fill="#20334a" text-anchor="start">格内写(x,y)，下方写2^x + y²</text><text x="120" y="124" font-size="21" fill="#20334a" text-anchor="middle">x=1</text><rect x="73" y="159" width="94" height="62" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="120" y="198" font-size="22" fill="#20334a" text-anchor="middle">(1,3)</text><text x="120" y="247" font-size="19" fill="#20334a" text-anchor="middle">11</text><rect x="73" y="271" width="94" height="62" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="120" y="310" font-size="22" fill="#20334a" text-anchor="middle">(1,2)</text><text x="120" y="359" font-size="19" fill="#20334a" text-anchor="middle">6</text><rect x="73" y="383" width="94" height="62" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="120" y="422" font-size="22" fill="#20334a" text-anchor="middle">(1,1)</text><text x="120" y="471" font-size="19" fill="#20334a" text-anchor="middle">3</text><text x="120" y="561" font-size="22" fill="#20334a" text-anchor="middle">加3</text><text x="255" y="124" font-size="21" fill="#20334a" text-anchor="middle">x=2</text><rect x="208" y="159" width="94" height="62" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="255" y="198" font-size="22" fill="#20334a" text-anchor="middle">(2,3)</text><text x="255" y="247" font-size="19" fill="#20334a" text-anchor="middle">13</text><rect x="208" y="271" width="94" height="62" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="255" y="310" font-size="22" fill="#20334a" text-anchor="middle">(2,2)</text><text x="255" y="359" font-size="19" fill="#20334a" text-anchor="middle">8</text><rect x="208" y="383" width="94" height="62" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="255" y="422" font-size="22" fill="#20334a" text-anchor="middle">(2,1)</text><text x="255" y="471" font-size="19" fill="#20334a" text-anchor="middle">5</text><text x="255" y="561" font-size="22" fill="#20334a" text-anchor="middle">加2</text><text x="390" y="124" font-size="21" fill="#20334a" text-anchor="middle">x=3</text><rect x="343" y="159" width="94" height="62" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="390" y="198" font-size="22" fill="#20334a" text-anchor="middle">(3,3)</text><text x="390" y="247" font-size="19" fill="#20334a" text-anchor="middle">17</text><rect x="343" y="271" width="94" height="62" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="390" y="310" font-size="22" fill="#20334a" text-anchor="middle">(3,2)</text><text x="390" y="359" font-size="19" fill="#20334a" text-anchor="middle">12</text><rect x="343" y="383" width="94" height="62" rx="8" fill="#bbf7d0" stroke="#2d6db4" stroke-width="2"/><text x="390" y="422" font-size="22" fill="#20334a" text-anchor="middle">(3,1)</text><text x="390" y="471" font-size="19" fill="#20334a" text-anchor="middle">9</text><text x="390" y="561" font-size="22" fill="#20334a" text-anchor="middle">加2</text><text x="525" y="124" font-size="21" fill="#20334a" text-anchor="middle">x=4</text><rect x="478" y="159" width="94" height="62" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="525" y="198" font-size="22" fill="#20334a" text-anchor="middle">(4,3)</text><text x="525" y="247" font-size="19" fill="#20334a" text-anchor="middle">25</text><rect x="478" y="271" width="94" height="62" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="525" y="310" font-size="22" fill="#20334a" text-anchor="middle">(4,2)</text><text x="525" y="359" font-size="19" fill="#20334a" text-anchor="middle">20</text><rect x="478" y="383" width="94" height="62" rx="8" fill="#fee2e2" stroke="#2d6db4" stroke-width="2"/><text x="525" y="422" font-size="22" fill="#20334a" text-anchor="middle">(4,1)</text><text x="525" y="471" font-size="19" fill="#20334a" text-anchor="middle">17</text><text x="525" y="561" font-size="22" fill="#20334a" text-anchor="middle">加0</text><text x="22" y="633" font-size="21" fill="#20334a" text-anchor="start">x=1的三个点：加3；x=2/3各加2。</text><text x="22" y="683" font-size="21" fill="#20334a" text-anchor="start">3+2+2=7；x=4整列不行，y=0不参与。</text><text x="22" y="733" font-size="21" fill="#20334a" text-anchor="start">(1,2)与(2,1)在两个不同位置，各数一次。</text></g></svg>