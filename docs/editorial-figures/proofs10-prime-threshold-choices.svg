<svg xmlns="http://www.w3.org/2000/svg" width="720" height="749" viewBox="0 0 720 749" role="img"><title>九个真实输入下标的二二三三八九一一一，在目标二下由障碍表得T二三T三八，按唯一最小值二三八九划分下标子集分别十二六二一总二十一，同值不同下标分别计数</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="20" fill="#20334a" text-anchor="start">真实输入n=9，a=[2,2,3,3,8,9,1,1,1]，目标下界x=2</text><text x="22" y="116" font-size="20" fill="#20334a" text-anchor="start">位置</text><rect x="130" y="83" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="158.0" y="116" font-size="21" fill="#20334a" text-anchor="middle">1</text><rect x="194" y="83" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="222.0" y="116" font-size="21" fill="#20334a" text-anchor="middle">2</text><rect x="258" y="83" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="286.0" y="116" font-size="21" fill="#20334a" text-anchor="middle">3</text><rect x="322" y="83" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="350.0" y="116" font-size="21" fill="#20334a" text-anchor="middle">4</text><rect x="386" y="83" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="414.0" y="116" font-size="21" fill="#20334a" text-anchor="middle">5</text><rect x="450" y="83" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="478.0" y="116" font-size="21" fill="#20334a" text-anchor="middle">6</text><rect x="514" y="83" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="542.0" y="116" font-size="21" fill="#20334a" text-anchor="middle">7</text><rect x="578" y="83" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="606.0" y="116" font-size="21" fill="#20334a" text-anchor="middle">8</text><rect x="642" y="83" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="670.0" y="116" font-size="21" fill="#20334a" text-anchor="middle">9</text><text x="22" y="181" font-size="20" fill="#20334a" text-anchor="start">原值</text><rect x="130" y="148" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="158.0" y="181" font-size="21" fill="#20334a" text-anchor="middle">2</text><rect x="194" y="148" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="222.0" y="181" font-size="21" fill="#20334a" text-anchor="middle">2</text><rect x="258" y="148" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="286.0" y="181" font-size="21" fill="#20334a" text-anchor="middle">3</text><rect x="322" y="148" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="350.0" y="181" font-size="21" fill="#20334a" text-anchor="middle">3</text><rect x="386" y="148" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="414.0" y="181" font-size="21" fill="#20334a" text-anchor="middle">8</text><rect x="450" y="148" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="478.0" y="181" font-size="21" fill="#20334a" text-anchor="middle">9</text><rect x="514" y="148" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="542.0" y="181" font-size="21" fill="#20334a" text-anchor="middle">1</text><rect x="578" y="148" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="606.0" y="181" font-size="21" fill="#20334a" text-anchor="middle">1</text><rect x="642" y="148" width="56" height="48" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="670.0" y="181" font-size="21" fill="#20334a" text-anchor="middle">1</text><text x="22" y="245" font-size="21" fill="#20334a" text-anchor="start">B(2)={2,4,8}，首个&gt;2为4，所以T[2]=3</text><text x="22" y="292" font-size="20" fill="#20334a" text-anchor="start">B(3)={3,9}，首个&gt;T[2]+1=4为9，所以T[3]=8</text><text x="22" y="339" font-size="20" fill="#20334a" text-anchor="start">[3,4]选2免费到[3,3]；9会拖到[2,8]而失败</text><rect x="22" y="379" width="676" height="53" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="34" y="414" font-size="20" fill="#20334a" text-anchor="start">最小值2</text><text x="165" y="414" font-size="19" fill="#20334a" text-anchor="start">位置1/2至少选一，位置3/4任选</text><text x="680" y="414" font-size="20" fill="#20334a" text-anchor="end">3×4=12</text><rect x="22" y="441" width="676" height="53" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="34" y="476" font-size="20" fill="#20334a" text-anchor="start">最小值3</text><text x="165" y="476" font-size="19" fill="#20334a" text-anchor="start">位置3/4至少选一，位置5任选</text><text x="680" y="476" font-size="20" fill="#20334a" text-anchor="end">3×2=6</text><rect x="22" y="503" width="676" height="53" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="34" y="538" font-size="20" fill="#20334a" text-anchor="start">最小值8</text><text x="165" y="538" font-size="19" fill="#20334a" text-anchor="start">位置5必选，位置6任选</text><text x="680" y="538" font-size="20" fill="#20334a" text-anchor="end">1×2=2</text><rect x="22" y="565" width="676" height="53" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="34" y="600" font-size="20" fill="#20334a" text-anchor="start">最小值9</text><text x="165" y="600" font-size="19" fill="#20334a" text-anchor="start">只选位置6</text><text x="680" y="600" font-size="20" fill="#20334a" text-anchor="end">1</text><text x="22" y="675" font-size="20" fill="#20334a" text-anchor="start">按唯一最小值分组：12+6+2+1=21个子序列满足f≥2</text><text x="22" y="721" font-size="21" fill="#20334a" text-anchor="start">同值不同下标分别选择；三个1都不能加入这21种</text></g></svg>