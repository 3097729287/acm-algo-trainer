<svg xmlns="http://www.w3.org/2000/svg" width="640" height="536" viewBox="0 0 640 536" role="img"><title>Four Coloring：颜色关系路径及真实二乘二网格</title><rect width="640" height="536" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#17324d;font-size:19px}.small{font-size:16px}.title{font-size:23px;font-weight:700}.line{stroke:#52677b;stroke-width:2}</style><text x="24" y="34" class="title" text-anchor="start">让差一的路径，对应到差至少二的路径</text><text x="24" y="116" class="" text-anchor="start">旧颜色</text><line x1="218" y1="109" x2="302" y2="109" stroke="#168377" stroke-width="4" stroke-dasharray=""/><circle cx="200" cy="109" r="21" fill="#d8edf9" stroke="#7394aa"/><text x="200" y="116" class="" text-anchor="middle">1</text><line x1="338" y1="109" x2="422" y2="109" stroke="#168377" stroke-width="4" stroke-dasharray=""/><circle cx="320" cy="109" r="21" fill="#d8edf9" stroke="#7394aa"/><text x="320" y="116" class="" text-anchor="middle">2</text><line x1="458" y1="109" x2="542" y2="109" stroke="#168377" stroke-width="4" stroke-dasharray=""/><circle cx="440" cy="109" r="21" fill="#d8edf9" stroke="#7394aa"/><text x="440" y="116" class="" text-anchor="middle">3</text><circle cx="560" cy="109" r="21" fill="#d8edf9" stroke="#7394aa"/><text x="560" y="116" class="" text-anchor="middle">4</text><text x="24" y="203" class="" text-anchor="start">新颜色</text><line x1="218" y1="196" x2="302" y2="196" stroke="#168377" stroke-width="4" stroke-dasharray=""/><circle cx="200" cy="196" r="21" fill="#d8edf9" stroke="#7394aa"/><text x="200" y="203" class="" text-anchor="middle">2</text><line x1="338" y1="196" x2="422" y2="196" stroke="#168377" stroke-width="4" stroke-dasharray=""/><circle cx="320" cy="196" r="21" fill="#d8edf9" stroke="#7394aa"/><text x="320" y="203" class="" text-anchor="middle">4</text><line x1="458" y1="196" x2="542" y2="196" stroke="#168377" stroke-width="4" stroke-dasharray=""/><circle cx="440" cy="196" r="21" fill="#d8edf9" stroke="#7394aa"/><text x="440" y="203" class="" text-anchor="middle">1</text><circle cx="560" cy="196" r="21" fill="#d8edf9" stroke="#7394aa"/><text x="560" y="203" class="" text-anchor="middle">3</text><text x="24" y="261" class="" text-anchor="start">旧边差：1, 1, 1；对应新边差：2, 3, 2</text><text x="24" y="303" class="" text-anchor="start">官方样例二的另一份合法输出</text><text x="184" y="343" class="" text-anchor="middle">X</text><rect x="130" y="360" width="52" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="156" y="394" class="" text-anchor="middle">1</text><rect x="186" y="360" width="52" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="212" y="394" class="" text-anchor="middle">4</text><rect x="130" y="416" width="52" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="156" y="450" class="" text-anchor="middle">4</text><rect x="186" y="416" width="52" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="212" y="450" class="" text-anchor="middle">1</text><text x="464" y="343" class="" text-anchor="middle">Y</text><rect x="410" y="360" width="52" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="436" y="394" class="" text-anchor="middle">2</text><rect x="466" y="360" width="52" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="492" y="394" class="" text-anchor="middle">3</text><rect x="410" y="416" width="52" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="436" y="450" class="" text-anchor="middle">3</text><rect x="466" y="416" width="52" height="52" rx="5" fill="#b8e6d1" stroke="#7394aa"/><text x="492" y="450" class="" text-anchor="middle">2</text><text x="306" y="423" class="" text-anchor="middle">→</text><text x="24" y="511" class="" text-anchor="start">每条水平、竖直邻边：原来差 3，现在差 1</text></svg>