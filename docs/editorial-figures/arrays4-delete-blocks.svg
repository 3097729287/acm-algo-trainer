ze="16" fill="#20334a" text-anchor="middle">原8</text><rect x="353" y="404" width="53" height="48" rx="5" fill="#fef3c7" stroke="#a26509" stroke-width="2"/><text x="379" y="436" font-size="25" fill="#20334a" text-anchor="middle">B</text><text x="24" y="536" font-size="21" fill="#20334a" text-anchor="start">原位置7的C：j=6失败→i=j；下一轮外层才将ans从0加到1。</text><text x="24" y="578" font-size="21" fill="#20334a" text-anchor="start">原位置8的B再贡献1；最后保留CB，长度2，每个位置只数一次。</text><text x="24" y="620" font-size="20" fill="#20334a" text-anchor="start">绿框可删除，黄框必须保留；“原编号”不随删除后的下标重排。</text></g></svg>