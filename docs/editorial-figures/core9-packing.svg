roke-width="2"/><text x="474" y="283" font-size="19" fill="#20334a" text-anchor="middle">第6层：25箱</text><rect x="365" y="298" width="218" height="29" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="474" y="319" font-size="19" fill="#20334a" text-anchor="middle">第7层：25箱</text><rect x="365" y="334" width="218" height="29" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="474" y="355" font-size="19" fill="#20334a" text-anchor="middle">第8层：25箱</text><text x="44" y="423" font-size="22" fill="#20334a" text-anchor="start">5列×5行 = 25箱</text><text x="335" y="408" font-size="21" fill="#20334a" text-anchor="start">每层厚30，8层=240</text><text x="24" y="473" font-size="21" fill="#20334a" text-anchor="start">实际摆放 25×8=200 箱；内部不重叠，边界恰好贴齐。</text><text x="24" y="516" font-size="21" fill="#20334a" text-anchor="start">总体积最多允许200箱，混合旋转也不能突破。</text></g></svg>