<svg xmlns="http://www.w3.org/2000/svg" width="480" height="825" viewBox="0 0 480 825"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#26826e"/></marker></defs><rect width="480" height="100%" rx="8" fill="#f7fafc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#17334d"><text x="18" y="28" font-size="16" font-weight="600">保留原位置：堆里是待定的右端点</text><text x="18" y="58">原串2432；每个“位置:数位”身份不同</text><text x="54" y="88">位置1</text><rect x="42" y="100" width="68" height="45" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="50" y="127.5">2</text><text x="160" y="88">位置2</text><rect x="148" y="100" width="68" height="45" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="156" y="127.5">4</text><text x="266" y="88">位置3</text><rect x="254" y="100" width="68" height="45" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="262" y="127.5">3</text><text x="372" y="88">位置4</text><rect x="360" y="100" width="68" height="45" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="368" y="127.5">2</text><text x="27" y="181">p</text><text x="71" y="181">容量</text><text x="131" y="181">加入后弹出</text><text x="294" y="181">保留的原身份</text><rect x="18" y="194" width="444" height="43" rx="4" fill="#eef4fc" stroke="#4984bd"/><text x="27" y="216">1</text><text x="71" y="216">0</text><text x="131" y="216">弹 1:2</text><text x="294" y="216">空</text><rect x="18" y="247" width="444" height="43" rx="4" fill="#eef4fc" stroke="#4984bd"/><text x="27" y="269">2</text><text x="71" y="269">1</text><text x="131" y="269">不弹</text><text x="294" y="269">2:4</text><rect x="18" y="300" width="444" height="43" rx="4" fill="#eef4fc" stroke="#4984bd"/><text x="27" y="322">3</text><text x="71" y="322">1</text><text x="131" y="322">弹 2:4</text><text x="294" y="322">3:3</text><rect x="18" y="353" width="444" height="43" rx="4" fill="#eef4fc" stroke="#4984bd"/><text x="27" y="375">4</text><text x="71" y="375">2</text><text x="131" y="375">不弹</text><text x="294" y="375">3:3，4:2</text><text x="18" y="430">右端点为原3、4；其余原1、2为左端点</text><rect x="42" y="500" width="68" height="45" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="50" y="527.5">(2</text><rect x="148" y="500" width="68" height="45" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="156" y="527.5">(4</text><rect x="254" y="500" width="68" height="45" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="262" y="527.5">)3</text><rect x="360" y="500" width="68" height="45" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="368" y="527.5">)2</text><path d="M182 493 Q235 447 288 493" fill="none" stroke="#26826e" stroke-width="2"/><path d="M76 493 Q235 385 394 493" fill="none" stroke="#4984bd" stroke-width="2"/><text x="18" y="587">先删原2、3的43，剩原1、4的22，再删空</text><rect x="30" y="610" width="130" height="40" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="38" y="635.0">2432</text><line x1="165" y1="630" x2="228" y2="630" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><rect x="238" y="610" width="80" height="40" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="246" y="635.0">22</text><line x1="322" y1="630" x2="376" y2="630" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><rect x="386" y="610" width="68" height="40" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="394" y="635.0">空</text><text x="174" y="669">+43</text><text x="331" y="669">+22</text><text x="18" y="709">总数位和11；右端位和3+2=5</text><text x="18" y="739">10×11−9×5=65，等于真实删除43+22</text><text x="18" y="778">弹出候选不等于已经删数位；最终才安排删除</text></g></svg>