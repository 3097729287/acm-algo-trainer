<svg xmlns="http://www.w3.org/2000/svg" width="720" height="843" viewBox="0 0 720 843" role="img"><title>真实三点链值二一二压成关键点一三的虚边距离二，上传零链仍含真实边，根一加零得一还原严格多数；对照四点链二一一二距离三上传负一，原全路径得分零不能通过</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">同值点是+1，其余为−1；先看零链为何必须保留</text><path d="M110 115 L110 232" stroke="#64748b" stroke-width="3" fill="none"/><path d="M110 232 L110 349" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="110" cy="115" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="110" y="122" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="110" cy="232" r="23" fill="#fee2e2" stroke="#285b87" stroke-width="2"/><text x="110" y="239" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="110" cy="349" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="110" y="356" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="154" y="122" font-size="20" fill="#20334a" text-anchor="start">a1=2，+1</text><text x="154" y="239" font-size="20" fill="#20334a" text-anchor="start">a2=1，−1</text><text x="154" y="356" font-size="20" fill="#20334a" text-anchor="start">a3=2，+1</text><path d="M454 115 L454 349" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="454" cy="115" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="454" y="122" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="454" cy="349" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="454" y="356" font-size="21" fill="#20334a" text-anchor="middle">3</text><text x="496" y="185" font-size="20" fill="#20334a" text-anchor="start">虚边d=2</text><text x="496" y="230" font-size="20" fill="#20334a" text-anchor="start">额外扣1</text><text x="383" y="407" font-size="20" fill="#20334a" text-anchor="start">关键点[1,3]，LCA=1</text><text x="22" y="467" font-size="21" fill="#20334a" text-anchor="start">点3上传到1：chain=−(2−1)+1=0，确实经过边</text><text x="22" y="514" font-size="21" fill="#20334a" text-anchor="start">点1处：val+b1+sec=1+0+0=1&gt;0</text><text x="22" y="561" font-size="21" fill="#20334a" text-anchor="start">展开路径1—2—3，值[2,1,2]，两个2严格过半</text><text x="22" y="625" font-size="21" fill="#20334a" text-anchor="start">若两点隔得更远：1—2—3—4，值[2,1,1,2]</text><path d="M98 698 L253 698" stroke="#64748b" stroke-width="3" fill="none"/><path d="M253 698 L408 698" stroke="#64748b" stroke-width="3" fill="none"/><path d="M408 698 L563 698" stroke="#64748b" stroke-width="3" fill="none"/><circle cx="98" cy="698" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="98" y="705" font-size="21" fill="#20334a" text-anchor="middle">1</text><circle cx="253" cy="698" r="23" fill="#fee2e2" stroke="#285b87" stroke-width="2"/><text x="253" y="705" font-size="21" fill="#20334a" text-anchor="middle">2</text><circle cx="408" cy="698" r="23" fill="#fee2e2" stroke="#285b87" stroke-width="2"/><text x="408" y="705" font-size="21" fill="#20334a" text-anchor="middle">3</text><circle cx="563" cy="698" r="23" fill="#bbf7d0" stroke="#285b87" stroke-width="2"/><text x="563" y="705" font-size="21" fill="#20334a" text-anchor="middle">4</text><text x="22" y="766" font-size="21" fill="#20334a" text-anchor="start">虚边d=3，链1−2=−1丢弃；全路径得分0，不合法</text><text x="22" y="813" font-size="20" fill="#20334a" text-anchor="start">丢负链不会丢掉正分非平凡路径；丢零链却会漏掉上例</text></g></svg>