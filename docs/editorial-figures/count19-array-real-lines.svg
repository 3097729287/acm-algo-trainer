<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#26826e"/></marker></defs><rect width="480" height="100%" rx="8" fill="#f7fafc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#17334d"><text x="18" y="28" font-size="16" font-weight="600">真实2×1×3数组：一个点连接三种查询</text><text x="18" y="59">维1固定为0；列是维2坐标，行是维0坐标</text><text x="129" y="93">坐标0</text><text x="240" y="93">坐标1</text><text x="351" y="93">坐标2</text><text x="18" y="147">行0</text><rect x="100" y="116" width="88" height="50" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="108" y="146.0">1</text><rect x="211" y="116" width="88" height="50" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="219" y="146.0">2</text><rect x="322" y="116" width="88" height="50" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="330" y="146.0">3</text><text x="18" y="220">行1</text><rect x="100" y="189" width="88" height="50" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="108" y="219.0">4</text><rect x="211" y="189" width="88" height="50" rx="4" fill="#fff0b4" stroke="#4984bd"/><text x="219" y="219.0">5→10</text><rect x="322" y="189" width="88" height="50" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="330" y="219.0">6</text><line x1="244" y1="163" x2="244" y2="184" stroke="#26826e" stroke-width="2" marker-end="url(#arr)"/><line x1="100" y1="256" x2="410" y2="256" stroke="#26826e" stroke-width="2"/><text x="264" y="278">维2：同一整行</text><text x="18" y="295">修改 a[1][0][1]：旧5→新10，Δ=+5</text><text x="18" y="329">展平步长：s0=3，s1=3，s2=1</text><rect x="27" y="354" width="65" height="39" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="35" y="378.5">0</text><rect x="101" y="354" width="65" height="39" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="109" y="378.5">1</text><rect x="175" y="354" width="65" height="39" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="183" y="378.5">2</text><rect x="249" y="354" width="65" height="39" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="257" y="378.5">3</text><rect x="323" y="354" width="65" height="39" rx="4" fill="#fff0b4" stroke="#4984bd"/><text x="331" y="378.5">4</text><rect x="397" y="354" width="65" height="39" rx="4" fill="#e7f2ff" stroke="#4984bd"/><text x="405" y="378.5">5</text><text x="18" y="423">idx=1×3+0×3+1×1=4（零基编号）</text><line x1="18" y1="443" x2="462" y2="443" stroke="#6c8294" stroke-width="2"/><text x="18" y="477">沿维0：实际位置1、4；值2、5→2、10</text><rect x="27" y="497" width="424" height="41" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="35" y="522.5">base=4−1×3=1；线和7→12</text><text x="18" y="573">沿维2：实际位置3、4、5；值4、5、6</text><rect x="27" y="593" width="424" height="41" rx="4" fill="#c8e9da" stroke="#4984bd"/><text x="35" y="618.5">base=4−1×1=3；线和15→20</text><text x="18" y="670">沿维1：该维长1，只有原位置4一个元素</text><rect x="27" y="690" width="424" height="41" rx="4" fill="#fff0b4" stroke="#4984bd"/><text x="35" y="715.5">无需表，直接返回当前 b[4]=10</text><text x="18" y="769">一次赋值让每张相关线表各加Δ一次，不加新值</text></g></svg>