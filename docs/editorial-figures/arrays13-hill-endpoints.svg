<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img"><title>两条真实空区间路径合并到同一状态</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="28" y="36" font-size="24" fill="#20334a" text-anchor="start">a=[5,3,4,6,2,1]：前三小值的两条路径</text><text x="28" y="79" font-size="22" fill="#20334a" text-anchor="start">右、右、右</text><text x="238" y="96" font-size="16" fill="#20334a" text-anchor="middle">1</text><rect x="205" y="105" width="66" height="49" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="238" y="137" font-size="23" fill="#20334a" text-anchor="middle">空</text><text x="320" y="96" font-size="16" fill="#20334a" text-anchor="middle">2</text><rect x="287" y="105" width="66" height="49" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="320" y="137" font-size="23" fill="#20334a" text-anchor="middle">空</text><text x="402" y="96" font-size="16" fill="#20334a" text-anchor="middle">3</text><rect x="369" y="105" width="66" height="49" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="402" y="137" font-size="23" fill="#20334a" text-anchor="middle">空</text><text x="484" y="96" font-size="16" fill="#20334a" text-anchor="middle">4</text><rect x="451" y="105" width="66" height="49" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="484" y="137" font-size="23" fill="#20334a" text-anchor="middle">3</text><text x="566" y="96" font-size="16" fill="#20334a" text-anchor="middle">5</text><rect x="533" y="105" width="66" height="49" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="566" y="137" font-size="23" fill="#20334a" text-anchor="middle">2</text><text x="648" y="96" font-size="16" fill="#20334a" text-anchor="middle">6</text><rect x="615" y="105" width="66" height="49" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="648" y="137" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="28" y="195" font-size="21" fill="#20334a" text-anchor="start">剩 [1,3]；左填 0 格 → q=0；两端都是奇位置</text><text x="28" y="259" font-size="22" fill="#20334a" text-anchor="start">右、左、左</text><text x="238" y="276" font-size="16" fill="#20334a" text-anchor="middle">1</text><rect x="205" y="285" width="66" height="49" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="238" y="317" font-size="23" fill="#20334a" text-anchor="middle">2</text><text x="320" y="276" font-size="16" fill="#20334a" text-anchor="middle">2</text><rect x="287" y="285" width="66" height="49" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="320" y="317" font-size="23" fill="#20334a" text-anchor="middle">3</text><text x="402" y="276" font-size="16" fill="#20334a" text-anchor="middle">3</text><rect x="369" y="285" width="66" height="49" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="402" y="317" font-size="23" fill="#20334a" text-anchor="middle">空</text><text x="484" y="276" font-size="16" fill="#20334a" text-anchor="middle">4</text><rect x="451" y="285" width="66" height="49" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="484" y="317" font-size="23" fill="#20334a" text-anchor="middle">空</text><text x="566" y="276" font-size="16" fill="#20334a" text-anchor="middle">5</text><rect x="533" y="285" width="66" height="49" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="566" y="317" font-size="23" fill="#20334a" text-anchor="middle">空</text><text x="648" y="276" font-size="16" fill="#20334a" text-anchor="middle">6</text><rect x="615" y="285" width="66" height="49" rx="5" fill="#f8fafc" stroke="#6d86a6" stroke-width="2"/><text x="648" y="317" font-size="23" fill="#20334a" text-anchor="middle">1</text><text x="28" y="375" font-size="21" fill="#20334a" text-anchor="start">剩 [3,5]；左填 2 格 → q=0；两端都是奇位置</text><text x="28" y="477" font-size="22" fill="#20334a" text-anchor="start">同一层、同一 q：下一步能接纳的奇偶完全相同</text><text x="28" y="521" font-size="23" fill="#20334a" text-anchor="start">第一条继续 左、右、左 → [4,6,5,3,2,1]</text><text x="28" y="565" font-size="22" fill="#20334a" text-anchor="start">实际交换 (1,3)，再交换 (2,4)，即得到该山形</text></g></svg>