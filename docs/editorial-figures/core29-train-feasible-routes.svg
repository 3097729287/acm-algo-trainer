<svg xmlns="http://www.w3.org/2000/svg" width="720" height="662" viewBox="0 0 720 662" role="img"><title>公交从一分钟出发两分钟到站再四分钟检票七分到站台，出租三分钟到站再四分钟检票八分到站台，发车八分垂线令出租等时失败只能选公交三元</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="22" fill="#20334a" text-anchor="start">发车第8分钟：比较到站台时刻，不是到车站</text><text x="22" y="78" font-size="20" fill="#20334a" text-anchor="start">现在1；公交路程2/价格3，出租路程3/价格2</text><text x="113" y="128" font-size="18" fill="#20334a" text-anchor="middle">1</text><text x="209" y="128" font-size="18" fill="#20334a" text-anchor="middle">3</text><text x="257" y="128" font-size="18" fill="#20334a" text-anchor="middle">4</text><text x="401" y="128" font-size="18" fill="#20334a" text-anchor="middle">7</text><text x="449" y="128" font-size="18" fill="#20334a" text-anchor="middle">8</text><text x="545" y="128" font-size="18" fill="#20334a" text-anchor="middle">10</text><path d="M449 140 V470" stroke="#c2410c" stroke-width="3" stroke-dasharray="6 5"/><text x="22" y="215" font-size="21" fill="#20334a" text-anchor="start">公交</text><rect x="113" y="182" width="96" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="209" y="182" width="192" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="161.0" y="214" font-size="20" fill="#20334a" text-anchor="middle">路程2</text><text x="305.0" y="214" font-size="20" fill="#20334a" text-anchor="middle">检票4</text><text x="401" y="271" font-size="18" fill="#20334a" text-anchor="middle">到站台7</text><text x="22" y="315" font-size="20" fill="#20334a" text-anchor="start">7&lt;8可行，价3</text><text x="22" y="386" font-size="21" fill="#20334a" text-anchor="start">出租</text><rect x="113" y="353" width="144" height="48" rx="8" fill="#bfdbfe" stroke="#2d6db4" stroke-width="2"/><rect x="257" y="353" width="192" height="48" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="185.0" y="385" font-size="20" fill="#20334a" text-anchor="middle">路程3</text><text x="353.0" y="385" font-size="20" fill="#20334a" text-anchor="middle">检票4</text><text x="449" y="442" font-size="18" fill="#20334a" text-anchor="middle">到站台8</text><text x="22" y="486" font-size="20" fill="#20334a" text-anchor="start">8=8不行，即使价2更低</text><text x="22" y="567" font-size="22" fill="#20334a" text-anchor="start">只在可行方案中取最低价：YES / 3 / bus。</text><text x="22" y="619" font-size="20" fill="#20334a" text-anchor="start">发车10：两者可行选taxi2；发车7：全不行NO。</text></g></svg>