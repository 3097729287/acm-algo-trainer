<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1055" viewBox="0 0 640 1055" role="img"><title>六真实物品的固定重量、最紧交换与六个实际重量序列</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247b65"/></marker></defs><rect width="640" height="1055" fill="#f7fafc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="36" font-size="24" text-anchor="start" fill="#123750">固定第三个二、第五个一的一类</text><text x="24" y="79" font-size="19" text-anchor="start" fill="#123750">六件价值10/9/8/3/2/1；固定选前三件</text><rect x="20" y="109" width="290" height="145" rx="7" fill="#bfe4ce" stroke="#91a9be"/><rect x="320" y="109" width="300" height="145" rx="7" fill="#e8edf1" stroke="#91a9be"/><text x="68" y="138" font-size="17" text-anchor="middle" fill="#123750">身份1</text><rect x="32" y="159" width="72" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="68.0" y="191" font-size="22" text-anchor="middle" fill="#123750">10</text><text x="165" y="138" font-size="17" text-anchor="middle" fill="#123750">身份2</text><rect x="129" y="159" width="72" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="165.0" y="191" font-size="22" text-anchor="middle" fill="#123750">9</text><text x="262" y="138" font-size="17" text-anchor="middle" fill="#123750">身份3</text><rect x="226" y="159" width="72" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="262.0" y="191" font-size="22" text-anchor="middle" fill="#123750">8</text><text x="359" y="138" font-size="17" text-anchor="middle" fill="#123750">身份4</text><rect x="323" y="159" width="72" height="48" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="359.0" y="191" font-size="22" text-anchor="middle" fill="#123750">3</text><text x="456" y="138" font-size="17" text-anchor="middle" fill="#123750">身份5</text><rect x="420" y="159" width="72" height="48" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="456.0" y="191" font-size="22" text-anchor="middle" fill="#123750">2</text><text x="553" y="138" font-size="17" text-anchor="middle" fill="#123750">身份6</text><rect x="517" y="159" width="72" height="48" rx="7" fill="#cfe3f5" stroke="#91a9be"/><text x="553.0" y="191" font-size="22" text-anchor="middle" fill="#123750">1</text><text x="168" y="239" font-size="18" text-anchor="middle" fill="#123750">G：价值和27</text><text x="470" y="239" font-size="18" text-anchor="middle" fill="#123750">外部物品</text><text x="68" y="290" font-size="17" text-anchor="middle" fill="#123750">自由</text><text x="165" y="290" font-size="17" text-anchor="middle" fill="#123750">自由</text><text x="262" y="290" font-size="17" text-anchor="middle" fill="#123750">二固定</text><text x="359" y="290" font-size="17" text-anchor="middle" fill="#123750">二固定</text><text x="456" y="290" font-size="17" text-anchor="middle" fill="#123750">一固定</text><text x="553" y="290" font-size="17" text-anchor="middle" fill="#123750">自由</text><path d="M263 305 L457 305" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="341" font-size="19" text-anchor="middle" fill="#123750">最紧价值差8−2=6</text><text x="24" y="397" font-size="19" text-anchor="start" fill="#123750">前两项t个二：x=4+t；6(4+t)≥27</text><text x="24" y="439" font-size="19" text-anchor="start" fill="#123750">所以t至少一；前两项只可三种选择</text><rect x="20" y="492" width="600" height="63" rx="7" fill="#fad2c9" stroke="#91a9be"/><text x="32" y="519" font-size="18" text-anchor="start" fill="#123750">不合格</text><text x="165" y="519" font-size="21" text-anchor="start" fill="#123750">1  1  2  2  1  1</text><text x="165" y="544" font-size="17" text-anchor="start" fill="#123750">27/4 &lt; 21/3</text><rect x="20" y="572" width="600" height="63" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="32" y="599" font-size="18" text-anchor="start" fill="#123750">合格</text><text x="165" y="599" font-size="21" text-anchor="start" fill="#123750">1  2  2  2  1  1</text><text x="165" y="624" font-size="17" text-anchor="start" fill="#123750">27/5 ≥ 21/4</text><text x="24" y="688" font-size="19" text-anchor="start" fill="#123750">三种自由前缀 × 第六件两种重量</text><text x="24" y="724" font-size="19" text-anchor="start" fill="#123750">中间固定为2/2/1，形成六个不同方案</text><rect x="70" y="765" width="110" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="125.0" y="797" font-size="22" text-anchor="middle" fill="#123750">1/2</text><path d="M182 789 L417 805" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M182 789 L417 905" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="841" width="110" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="125.0" y="873" font-size="22" text-anchor="middle" fill="#123750">2/1</text><path d="M182 865 L417 805" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M182 865 L417 905" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="917" width="110" height="48" rx="7" fill="#bfe4ce" stroke="#91a9be"/><text x="125.0" y="949" font-size="22" text-anchor="middle" fill="#123750">2/2</text><path d="M182 941 L417 805" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M182 941 L417 905" fill="none" stroke="#247b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="781" width="110" height="48" rx="7" fill="#fff0b3" stroke="#91a9be"/><text x="475.0" y="813" font-size="22" text-anchor="middle" fill="#123750">1</text><text x="475" y="844" font-size="17" text-anchor="middle" fill="#123750">末件重量</text><rect x="420" y="881" width="110" height="48" rx="7" fill="#fff0b3" stroke="#91a9be"/><text x="475.0" y="913" font-size="22" text-anchor="middle" fill="#123750">2</text><text x="475" y="944" font-size="17" text-anchor="middle" fill="#123750">末件重量</text><text x="24" y="1020" font-size="21" text-anchor="start" fill="#123750">2 × (C(2,1)+C(2,2)) = 2 × 3 = 6</text></g></svg>