<svg xmlns="http://www.w3.org/2000/svg" width="760" height="875" viewBox="0 0 760 875" role="img"><title>前缀二十五四进制追加实际区间，四百至四百一十五标出四百一十四及偏移十四和长度十六，另目标模一百零四时一百至一百零三缺少下一倍数且距离等于长度</title><rect width="760" height="875" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="24" y="38" font-size="24" fill="#17334d" text-anchor="start">prefix=25，k=4；目标是207的倍数</text><text x="24" y="92" font-size="22" fill="#17334d" text-anchor="start">追加一位：25×4+x，x可为0、1、2、3</text><rect x="69" y="125" width="138" height="61" rx="7" fill="#fee2e2" stroke="#476986" stroke-width="2"/><text x="138" y="166" font-size="25" fill="#17334d" text-anchor="middle">100</text><rect x="226" y="125" width="138" height="61" rx="7" fill="#fee2e2" stroke="#476986" stroke-width="2"/><text x="295" y="166" font-size="25" fill="#17334d" text-anchor="middle">101</text><rect x="383" y="125" width="138" height="61" rx="7" fill="#fee2e2" stroke="#476986" stroke-width="2"/><text x="452" y="166" font-size="25" fill="#17334d" text-anchor="middle">102</text><rect x="540" y="125" width="138" height="61" rx="7" fill="#fee2e2" stroke="#476986" stroke-width="2"/><text x="609" y="166" font-size="25" fill="#17334d" text-anchor="middle">103</text><text x="24" y="244" font-size="22" fill="#17334d" text-anchor="start">追加两位：400至415，中间每个整数都能到达。</text><line x1="49" y1="329" x2="710" y2="329" stroke="#476986" stroke-width="2"/><circle cx="49" cy="329" r="4" fill="#237bb6"/><text x="49" y="366" font-size="13" fill="#17334d" text-anchor="middle">400</text><circle cx="93" cy="329" r="4" fill="#237bb6"/><text x="93" y="366" font-size="13" fill="#17334d" text-anchor="middle">401</text><circle cx="137" cy="329" r="4" fill="#237bb6"/><text x="137" y="366" font-size="13" fill="#17334d" text-anchor="middle">402</text><circle cx="181" cy="329" r="4" fill="#237bb6"/><text x="181" y="366" font-size="13" fill="#17334d" text-anchor="middle">403</text><circle cx="225" cy="329" r="4" fill="#237bb6"/><text x="225" y="366" font-size="13" fill="#17334d" text-anchor="middle">404</text><circle cx="269" cy="329" r="4" fill="#237bb6"/><text x="269" y="366" font-size="13" fill="#17334d" text-anchor="middle">405</text><circle cx="313" cy="329" r="4" fill="#237bb6"/><text x="313" y="366" font-size="13" fill="#17334d" text-anchor="middle">406</text><circle cx="357" cy="329" r="4" fill="#237bb6"/><text x="357" y="366" font-size="13" fill="#17334d" text-anchor="middle">407</text><circle cx="401" cy="329" r="4" fill="#237bb6"/><text x="401" y="366" font-size="13" fill="#17334d" text-anchor="middle">408</text><circle cx="445" cy="329" r="4" fill="#237bb6"/><text x="445" y="366" font-size="13" fill="#17334d" text-anchor="middle">409</text><circle cx="489" cy="329" r="4" fill="#237bb6"/><text x="489" y="366" font-size="13" fill="#17334d" text-anchor="middle">410</text><circle cx="533" cy="329" r="4" fill="#237bb6"/><text x="533" y="366" font-size="13" fill="#17334d" text-anchor="middle">411</text><circle cx="577" cy="329" r="4" fill="#237bb6"/><text x="577" y="366" font-size="13" fill="#17334d" text-anchor="middle">412</text><circle cx="621" cy="329" r="4" fill="#237bb6"/><text x="621" y="366" font-size="13" fill="#17334d" text-anchor="middle">413</text><circle cx="665" cy="329" r="9" fill="#16806b"/><text x="665" y="366" font-size="13" fill="#17334d" text-anchor="middle">414</text><circle cx="709" cy="329" r="4" fill="#237bb6"/><text x="709" y="366" font-size="13" fill="#17334d" text-anchor="middle">415</text><text x="665" y="293" font-size="21" fill="#17334d" text-anchor="end">414=2×207</text><line x1="49" y1="399" x2="665" y2="399" stroke="#16806b" stroke-width="3"/><text x="24" y="442" font-size="22" fill="#17334d" text-anchor="start">余数193；下一倍数距离14；14&lt;长度16。</text><text x="24" y="493" font-size="22" fill="#17334d" text-anchor="start">偏移14的四进制为32：25 → 103 → 414。</text><text x="24" y="548" font-size="22" fill="#17334d" text-anchor="start">删除费用5，追加两次各3，总费用11。</text><text x="24" y="625" font-size="23" fill="#17334d" text-anchor="start">只改m=104：区间[100,103]不包含104</text><rect x="69" y="662" width="112" height="61" rx="7" fill="#dbeafe" stroke="#476986" stroke-width="2"/><text x="125" y="703" font-size="25" fill="#17334d" text-anchor="middle">100</text><rect x="202" y="662" width="112" height="61" rx="7" fill="#dbeafe" stroke="#476986" stroke-width="2"/><text x="258" y="703" font-size="25" fill="#17334d" text-anchor="middle">101</text><rect x="335" y="662" width="112" height="61" rx="7" fill="#dbeafe" stroke="#476986" stroke-width="2"/><text x="391" y="703" font-size="25" fill="#17334d" text-anchor="middle">102</text><rect x="468" y="662" width="112" height="61" rx="7" fill="#dbeafe" stroke="#476986" stroke-width="2"/><text x="524" y="703" font-size="25" fill="#17334d" text-anchor="middle">103</text><rect x="601" y="662" width="112" height="61" rx="7" fill="#fee2e2" stroke="#476986" stroke-width="2"/><text x="657" y="703" font-size="25" fill="#17334d" text-anchor="middle">104</text><text x="24" y="776" font-size="21" fill="#17334d" text-anchor="start">下一倍数距离4；长度也为4，但偏移只允许0到3。</text><text x="24" y="831" font-size="22" fill="#17334d" text-anchor="start">m−rem=length是失败，不能把严格小于改成≤。</text></g></svg>