<svg xmlns="http://www.w3.org/2000/svg" width="720" height="706" viewBox="0 0 720 706" role="img"><title>官方五点图所有标签边，点二分裂的两条真实可达集合交于二四，队列先后展开一类组一二、编号对组二四、一类组四五并只入队一次，点三被排除</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="34" font-size="20" fill="#20334a" text-anchor="start">官方第一例：边上数字是可通过者，1高桥 / 2Taka / 3Hashi</text><line x1="66" y1="192" x2="219" y2="192" stroke="#20334a" stroke-width="4"/><text x="142.5" y="180.0" font-size="23" fill="#20334a" text-anchor="start">1</text><line x1="219" y1="192" x2="378" y2="99" stroke="#2d6db4" stroke-width="4"/><text x="298.5" y="133.5" font-size="23" fill="#2d6db4" text-anchor="start">2</text><line x1="378" y1="99" x2="499" y2="192" stroke="#2d6db4" stroke-width="4"/><text x="438.5" y="133.5" font-size="23" fill="#2d6db4" text-anchor="start">2</text><line x1="219" y1="192" x2="499" y2="192" stroke="#b36b16" stroke-width="4"/><text x="359.0" y="180.0" font-size="23" fill="#b36b16" text-anchor="start">3</text><line x1="499" y1="192" x2="650" y2="192" stroke="#20334a" stroke-width="4"/><text x="574.5" y="180.0" font-size="23" fill="#20334a" text-anchor="start">1</text><circle cx="66" cy="192" r="26" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="66" y="200" font-size="25" fill="#20334a" text-anchor="middle">1</text><circle cx="219" cy="192" r="26" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="219" y="200" font-size="25" fill="#20334a" text-anchor="middle">2</text><circle cx="378" cy="99" r="26" fill="#fee2e2" stroke="#20334a" stroke-width="2"/><text x="378" y="107" font-size="25" fill="#20334a" text-anchor="middle">3</text><circle cx="499" cy="192" r="26" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="499" y="200" font-size="25" fill="#20334a" text-anchor="middle">4</text><circle cx="650" cy="192" r="26" fill="#dcfce7" stroke="#20334a" stroke-width="2"/><text x="650" y="200" font-size="25" fill="#20334a" text-anchor="middle">5</text><text x="22" y="277" font-size="22" fill="#20334a" text-anchor="start">在2分裂：Taka可到{2,3,4}；Hashi可到{2,4}</text><text x="22" y="319" font-size="21" fill="#20334a" text-anchor="start">交集{2,4}可合体；3只有Taka能到，不能算完整高桥可达</text><text x="46" y="369" font-size="21" fill="#20334a" text-anchor="start">队首</text><text x="180" y="369" font-size="21" fill="#20334a" text-anchor="start">首次展开的组</text><text x="601" y="369" font-size="21" fill="#20334a" text-anchor="start">新增点</text><rect x="22" y="401" width="676" height="49" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="46" y="434" font-size="23" fill="#20334a" text-anchor="start">1</text><text x="180" y="434" font-size="21" fill="#20334a" text-anchor="start">一类组{1,2}</text><text x="609" y="434" font-size="22" fill="#20334a" text-anchor="start">2</text><rect x="22" y="458" width="676" height="49" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="46" y="491" font-size="23" fill="#20334a" text-anchor="start">2</text><text x="180" y="491" font-size="21" fill="#20334a" text-anchor="start">编号对组{2,4}</text><text x="609" y="491" font-size="22" fill="#20334a" text-anchor="start">4</text><rect x="22" y="515" width="676" height="49" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="46" y="548" font-size="23" fill="#20334a" text-anchor="start">4</text><text x="180" y="548" font-size="21" fill="#20334a" text-anchor="start">一类组{4,5}</text><text x="609" y="548" font-size="22" fill="#20334a" text-anchor="start">5</text><rect x="22" y="572" width="676" height="49" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="46" y="605" font-size="23" fill="#20334a" text-anchor="start">5</text><text x="180" y="605" font-size="21" fill="#20334a" text-anchor="start">前面已展开的组</text><text x="609" y="605" font-size="22" fill="#20334a" text-anchor="start">无</text><text x="22" y="680" font-size="21" fill="#20334a" text-anchor="start">最终完整状态{1,2,4,5}；done标记的是组，inR标记的是顶点</text></g></svg>