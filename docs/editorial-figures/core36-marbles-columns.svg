<svg xmlns="http://www.w3.org/2000/svg" width="760" height="862" viewBox="0 0 760 862" role="img"><title>两行实际颜色一二一三四和二一二三四固定左端一，右扩前三列均两种面积二四六，第四色三出现两次只新增一种，种数三后第五列可剪枝</title><style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" fill="#153655" font-size="24" text-anchor="start">同一2×5矩阵，d=2；固定两行与左端1</text><rect x="69" y="117" width="99" height="73" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="119" y="165" fill="#153655" font-size="29" text-anchor="middle">1</text><rect x="201" y="117" width="99" height="73" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="251" y="165" fill="#153655" font-size="29" text-anchor="middle">2</text><rect x="333" y="117" width="99" height="73" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="383" y="165" fill="#153655" font-size="29" text-anchor="middle">1</text><rect x="465" y="117" width="99" height="73" rx="5" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/><text x="515" y="165" fill="#153655" font-size="29" text-anchor="middle">3</text><rect x="597" y="117" width="99" height="73" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="647" y="165" fill="#153655" font-size="29" text-anchor="middle">4</text><rect x="69" y="216" width="99" height="73" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="119" y="264" fill="#153655" font-size="29" text-anchor="middle">2</text><rect x="201" y="216" width="99" height="73" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="251" y="264" fill="#153655" font-size="29" text-anchor="middle">1</text><rect x="333" y="216" width="99" height="73" rx="5" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="383" y="264" fill="#153655" font-size="29" text-anchor="middle">2</text><rect x="465" y="216" width="99" height="73" rx="5" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/><text x="515" y="264" fill="#153655" font-size="29" text-anchor="middle">3</text><rect x="597" y="216" width="99" height="73" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="647" y="264" fill="#153655" font-size="29" text-anchor="middle">4</text><text x="119" y="94" fill="#153655" font-size="20" text-anchor="middle">列1</text><text x="251" y="94" fill="#153655" font-size="20" text-anchor="middle">列2</text><text x="383" y="94" fill="#153655" font-size="20" text-anchor="middle">列3</text><text x="515" y="94" fill="#153655" font-size="20" text-anchor="middle">列4</text><text x="647" y="94" fill="#153655" font-size="20" text-anchor="middle">列5</text><text x="25" y="363" fill="#153655" font-size="22" text-anchor="start">右端1</text><text x="188" y="363" fill="#153655" font-size="22" text-anchor="start">1、2</text><text x="388" y="363" fill="#153655" font-size="22" text-anchor="start">2</text><text x="486" y="363" fill="#153655" font-size="22" text-anchor="start">面积2，更新</text><text x="25" y="436" fill="#153655" font-size="22" text-anchor="start">右端2</text><text x="188" y="436" fill="#153655" font-size="22" text-anchor="start">1、2</text><text x="388" y="436" fill="#153655" font-size="22" text-anchor="start">2</text><text x="486" y="436" fill="#153655" font-size="22" text-anchor="start">面积4，更新</text><text x="25" y="509" fill="#153655" font-size="22" text-anchor="start">右端3</text><text x="188" y="509" fill="#153655" font-size="22" text-anchor="start">1、2</text><text x="388" y="509" fill="#153655" font-size="22" text-anchor="start">2</text><text x="486" y="509" fill="#153655" font-size="22" text-anchor="start">面积6，更新</text><text x="25" y="582" fill="#153655" font-size="22" text-anchor="start">右端4</text><text x="188" y="582" fill="#153655" font-size="22" text-anchor="start">1、2、3</text><text x="388" y="582" fill="#153655" font-size="22" text-anchor="start">3</text><text x="486" y="582" fill="#153655" font-size="22" text-anchor="start">超过2，停止</text><text x="24" y="704" fill="#153655" font-size="22" text-anchor="start">第4列第一个3：cnt[3]为0，种数2→3。</text><text x="24" y="760" fill="#153655" font-size="22" text-anchor="start">第4列第二个3：cnt[3]为1，种数仍3。</text><text x="24" y="816" fill="#153655" font-size="22" text-anchor="start">第5列不必再试：旧的三种颜色不可能消失。</text></svg>