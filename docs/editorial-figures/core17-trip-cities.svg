<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="795" viewBox="0 0 1000 795" role="img"><title>四城市真实行程与过期堆项的实际次序</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="38" font-size="27" fill="#20334a" text-anchor="start">四座真实城市：绿色道路组成 1 → 3 → 2 → 4</text><path d="M110,270 L450,140" stroke="#9baac0" stroke-width="5" fill="none"/><rect x="233" y="139" width="100" height="35" rx="5" fill="#fff" stroke="#6d86a6" stroke-width="2"/><text x="245" y="164" font-size="22" fill="#20334a" text-anchor="start">路 10</text><path d="M110,270 L450,440" stroke="#286b4d" stroke-width="5" fill="none"/><rect x="228" y="362" width="100" height="35" rx="5" fill="#fff" stroke="#6d86a6" stroke-width="2"/><text x="240" y="387" font-size="22" fill="#20334a" text-anchor="start">路 1</text><path d="M450,440 L450,140" stroke="#286b4d" stroke-width="5" fill="none"/><rect x="460" y="273" width="100" height="35" rx="5" fill="#fff" stroke="#6d86a6" stroke-width="2"/><text x="472" y="298" font-size="22" fill="#20334a" text-anchor="start">路 1</text><path d="M450,140 L830,270" stroke="#286b4d" stroke-width="5" fill="none"/><rect x="630" y="140" width="100" height="35" rx="5" fill="#fff" stroke="#6d86a6" stroke-width="2"/><text x="642" y="165" font-size="22" fill="#20334a" text-anchor="start">路 20</text><path d="M450,440 L830,270" stroke="#9baac0" stroke-width="5" fill="none"/><rect x="633" y="366" width="100" height="35" rx="5" fill="#fff" stroke="#6d86a6" stroke-width="2"/><text x="645" y="391" font-size="22" fill="#20334a" text-anchor="start">路 100</text><circle cx="110" cy="270" r="43" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="110" y="280" font-size="30" fill="#20334a" text-anchor="middle">1</text><circle cx="450" cy="140" r="43" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="450" y="150" font-size="30" fill="#20334a" text-anchor="middle">2</text><circle cx="450" cy="440" r="43" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="450" y="450" font-size="30" fill="#20334a" text-anchor="middle">3</text><circle cx="830" cy="270" r="43" fill="#e7f0ff" stroke="#5b7392" stroke-width="3"/><text x="830" y="280" font-size="30" fill="#20334a" text-anchor="middle">4</text><text x="110" y="350" font-size="20" fill="#20334a" text-anchor="middle">原等 50：起点不计</text><text x="450" y="77" font-size="22" fill="#20334a" text-anchor="middle">中转等 1</text><text x="450" y="516" font-size="22" fill="#20334a" text-anchor="middle">中转等 1</text><text x="830" y="350" font-size="20" fill="#20334a" text-anchor="middle">原等 50：终点不计</text><text x="35" y="568" font-size="23" fill="#286b4d" text-anchor="start">真实时间：开车 1 + 等 1 + 开车 1 + 等 1 + 开车 20 = 24</text><text x="35" y="620" font-size="23" fill="#20334a" text-anchor="start">弹出 1：d=[0,11,2,∞]；弹出 3：d=[0,4,2,102]</text><text x="35" y="663" font-size="23" fill="#20334a" text-anchor="start">弹出 2：终点改为 24，旧的 (11,2) 仍留在堆里。</text><text x="35" y="706" font-size="22" fill="#20334a" text-anchor="start">弹出旧 (11,2)：11 ≠ d[2]=4，跳过；再弹出有效 (24,4) 才结束。</text><text x="35" y="758" font-size="21" fill="#20334a" text-anchor="start">首次把终点 102 放入堆时不能停；原道路双向，附加等待按进入城市决定。</text></g></svg>