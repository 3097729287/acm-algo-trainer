<svg xmlns="http://www.w3.org/2000/svg" width="880" height="548" viewBox="0 0 880 548" role="img"><title>官方第三例按真实攻击和跳跃顺序得到后手获胜</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="24" fill="#20334a" text-anchor="start">官方第三例：Bea [4]，Ver [4,1]；圆点表示站立处</text><text x="25" y="77" font-size="21" fill="#20334a" text-anchor="start">前三轮后：各挨三击</text><text x="320" y="77" font-size="20" fill="#20334a" text-anchor="start">Bea</text><text x="585" y="77" font-size="20" fill="#20334a" text-anchor="start">Ver</text><rect x="320" y="120" width="68" height="37" rx="5" fill="#eaf3fd" stroke="#2563a6" stroke-width="2"/><text x="354" y="184" font-size="19" fill="#20334a" text-anchor="middle">a₁=1</text><circle cx="354" cy="107" r="8" fill="#2563a6"/><rect x="665" y="120" width="68" height="37" rx="5" fill="#fff3dd" stroke="#a65c12" stroke-width="2"/><text x="699" y="184" font-size="19" fill="#20334a" text-anchor="middle">b₁=1</text><circle cx="699" cy="107" r="8" fill="#a65c12"/><rect x="540" y="120" width="68" height="37" rx="5" fill="#fff3dd" stroke="#a65c12" stroke-width="2"/><text x="574" y="184" font-size="19" fill="#20334a" text-anchor="middle">b₂=1</text><text x="25" y="219" font-size="21" fill="#20334a" text-anchor="start">Bea 第四击后：Ver 第一座归零</text><rect x="320" y="262" width="68" height="37" rx="5" fill="#eaf3fd" stroke="#2563a6" stroke-width="2"/><text x="354" y="326" font-size="19" fill="#20334a" text-anchor="middle">a₁=1</text><circle cx="354" cy="249" r="8" fill="#2563a6"/><rect x="665" y="299" width="68" height="3" rx="5" fill="#fff3dd" stroke="#a65c12" stroke-width="2"/><text x="699" y="326" font-size="19" fill="#20334a" text-anchor="middle">b₁=0</text><circle cx="699" cy="286" r="8" fill="#a65c12"/><rect x="540" y="262" width="68" height="37" rx="5" fill="#fff3dd" stroke="#a65c12" stroke-width="2"/><text x="574" y="326" font-size="19" fill="#20334a" text-anchor="middle">b₂=1</text><path d="M402,247 L657,247" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="490" y="237" font-size="18" fill="#20334a" text-anchor="start">命中 b₁</text><text x="25" y="361" font-size="21" fill="#20334a" text-anchor="start">Ver 先跳第二座，再还击</text><rect x="320" y="441" width="68" height="3" rx="5" fill="#eaf3fd" stroke="#2563a6" stroke-width="2"/><text x="354" y="468" font-size="19" fill="#20334a" text-anchor="middle">a₁=0</text><circle cx="354" cy="428" r="8" fill="#2563a6"/><rect x="665" y="441" width="68" height="3" rx="5" fill="#fff3dd" stroke="#a65c12" stroke-width="2"/><text x="699" y="468" font-size="19" fill="#20334a" text-anchor="middle">b₁=0</text><rect x="540" y="404" width="68" height="37" rx="5" fill="#fff3dd" stroke="#a65c12" stroke-width="2"/><text x="574" y="468" font-size="19" fill="#20334a" text-anchor="middle">b₂=1</text><circle cx="574" cy="391" r="8" fill="#a65c12"/><path d="M699,371 L586,371" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="590" y="361" font-size="17" fill="#20334a" text-anchor="start">向前跳</text><path d="M532,413 L402,413" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="408" y="400" font-size="18" fill="#20334a" text-anchor="start">再命中 Bea</text><text x="25" y="516" font-size="23" fill="#9d2424" text-anchor="start">Bea 已无下一座：0 高且无路可跳，Ver 获胜（输出 2）</text></g></svg>