<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>真实凸五边形中右侧四边形由两个面积四的三角形组成，闭合边贡献不为零，区域重心不同于顶点均值</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="23" y="36" font-size="23" fill="#20334a" text-anchor="start">凸五边形：(1,1),(5,1),(5,3),(3,4),(1,3)</text><text x="23" y="76" font-size="22" fill="#20334a" text-anchor="start">询问 u=1、v=4；右侧切片是四边形 1→2→3→4→1</text><polygon points="200,440 480,440 480,300 340,230 200,300" fill="#f1f5f9" stroke="#8995a5" stroke-width="3"/><polygon points="200,440 480,440 480,300" fill="#dbeafe"/><polygon points="200,440 480,300 340,230" fill="#dcfce7"/><line x1="200" y1="440" x2="480" y2="300" stroke="#667488" stroke-width="2" stroke-dasharray="7 5"/><path d="M220.0,440.0 L460.0,440.0" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="460.0,440.0 450.0,445.0 450.0,435.0" fill="#2d6db4"/><path d="M480.0,420.0 L480.0,320.0" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="480.0,320.0 485.0,330.0 475.0,330.0" fill="#2d6db4"/><path d="M462.1114561800017,291.05572809000085 L357.8885438199983,238.94427190999915" fill="none" stroke="#2d6db4" stroke-width="3"/><polygon points="357.8885438199983,238.94427190999915 369.0688837074972,238.94427190999915 364.59674775249766,247.8885438199983" fill="#2d6db4"/><path d="M328.9059960754954,246.6410058867569 L211.0940039245046,423.3589941132431" fill="none" stroke="#087b48" stroke-width="3"/><polygon points="211.0940039245046,423.3589941132431 212.48075441506768,412.2649901887386 220.8012573584461,417.8119921509908" fill="#087b48"/><path d="M284,314 L328.9059960754954,246.6410058867569" fill="none" stroke="#b36b16" stroke-width="3"/><polygon points="328.9059960754954,246.6410058867569 327.5192455849323,257.7350098112615 319.1987426415539,252.18800784900918" fill="#b36b16"/><text x="70" y="233" font-size="20" fill="#b36b16" text-anchor="start">橙：询问1→4</text><text x="25" y="274" font-size="20" fill="#087b48" text-anchor="start">绿：闭合4→1</text><text x="391" y="408" font-size="22" fill="#2d6db4" text-anchor="start">面积4</text><text x="333" y="317" font-size="22" fill="#087b48" text-anchor="start">面积4</text><circle cx="200" cy="440" r="17" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="200" y="447" font-size="20" fill="#20334a" text-anchor="middle">1</text><circle cx="480" cy="440" r="17" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="480" y="447" font-size="20" fill="#20334a" text-anchor="middle">2</text><circle cx="480" cy="300" r="17" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="480" y="307" font-size="20" fill="#20334a" text-anchor="middle">3</text><circle cx="340" cy="230" r="17" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="340" y="237" font-size="20" fill="#20334a" text-anchor="middle">4</text><circle cx="200" cy="300" r="17" fill="#fff" stroke="#20334a" stroke-width="2"/><text x="200" y="307" font-size="20" fill="#20334a" text-anchor="middle">5</text><circle cx="363.33333333333337" cy="358.33333333333337" r="6" fill="#a32e36"/><text x="495" y="367" font-size="20" fill="#a32e36" text-anchor="start">红点：区域重心</text><text x="23" y="507" font-size="22" fill="#20334a" text-anchor="start">S=−4+10+11−1=16；闭合边的贡献−1也必须加入</text><text x="23" y="551" font-size="23" fill="#20334a" text-anchor="start">Sₓ=160，Sᵧ=104 → 重心(160/48,104/48)</text><text x="23" y="594" font-size="22" fill="#20334a" text-anchor="start">即 (10/3,13/6)，不是四个顶点平均的(3.5,2.25)</text></g></svg>