middle">10</text><path d="M470 144V156" stroke="#64748b"/><text x="470" y="179" font-size="17" fill="#20334a" text-anchor="middle">11</text><path d="M508 144V156" stroke="#64748b"/><text x="508" y="179" font-size="17" fill="#20334a" text-anchor="middle">12</text><path d="M546 144V156" stroke="#64748b"/><text x="546" y="179" font-size="17" fill="#20334a" text-anchor="middle">13</text><path d="M584 144V156" stroke="#64748b"/><text x="584" y="179" font-size="17" fill="#20334a" text-anchor="middle">14</text><path d="M622 144V156" stroke="#64748b"/><text x="622" y="179" font-size="17" fill="#20334a" text-anchor="middle">15</text><path d="M660 144V156" stroke="#64748b"/><text x="660" y="179" font-size="17" fill="#20334a" text-anchor="middle">16</text><path d="M52 440H678" stroke="#475569" stroke-width="2"/><path d="M671 435l8 5-8 5" fill="none" stroke="#475569" stroke-width="2"/><path d="M52 434V446" stroke="#64748b"/><text x="52" y="469" font-size="17" fill="#20334a" text-anchor="middle">0</text><path d="M90 434V446" stroke="#64748b"/><text x="90" y="469" font-size="17" fill="#20334a" text-anchor="middle">1</text><path d="M128 434V446" stroke="#64748b"/><text x="128" y="469" font-size="17" fill="#20334a" text-anchor="middle">2</text><path d="M166 434V446" stroke="#64748b"/><text x="166" y="469" font-size="17" fill="#20334a" text-anchor="middle">3</text><path d="M204 434V446" stroke="#64748b"/><text x="204" y="469" font-size="17" fill="#20334a" text-anchor="middle">4</text><path d="M242 434V446" stroke="#64748b"/><text x="242" y="469" font-size="17" fill="#20334a" text-anchor="middle">5</text><path d="M280 434V446" stroke="#64748b"/><text x="280" y="469" font-size="17" fill="#20334a" text-anchor="middle">6</text><path d="M318 434V446" stroke="#64748b"/><text x="318" y="469" font-size="17" fill="#20334a" text-anchor="middle">7</text><path d="M356 434V446" stroke="#64748b"/><text x="356" y="469" font-size="17" fill="#20334a" text-anchor="middle">8</text><path d="M394 434V44