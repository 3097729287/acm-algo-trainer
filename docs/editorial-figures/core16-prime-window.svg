<svg xmlns="http://www.w3.org/2000/svg" width="660" height="579" viewBox="0 0 660 579" role="img"><title>十一到二十五按真实数值排列的十五格，十个合数已灰标，五个质数中只有十三数位和四可通过</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="24" y="33" font-size="21" fill="#20334a" text-anchor="start">[11,25]仅十五格；绿色需同时通过两个条件</text><rect x="38" y="91" width="83" height="45" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="79" y="122" font-size="24" fill="#20334a" text-anchor="middle">11</text><rect x="158" y="91" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="199" y="122" font-size="24" fill="#20334a" text-anchor="middle">12</text><rect x="278" y="91" width="83" height="45" rx="8" fill="#dcfce7" stroke="#2d6db4" stroke-width="2"/><text x="319" y="122" font-size="24" fill="#20334a" text-anchor="middle">13</text><rect x="398" y="91" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="439" y="122" font-size="24" fill="#20334a" text-anchor="middle">14</text><rect x="518" y="91" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="559" y="122" font-size="24" fill="#20334a" text-anchor="middle">15</text><rect x="38" y="168" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="79" y="199" font-size="24" fill="#20334a" text-anchor="middle">16</text><rect x="158" y="168" width="83" height="45" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="199" y="199" font-size="24" fill="#20334a" text-anchor="middle">17</text><rect x="278" y="168" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="319" y="199" font-size="24" fill="#20334a" text-anchor="middle">18</text><rect x="398" y="168" width="83" height="45" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="439" y="199" font-size="24" fill="#20334a" text-anchor="middle">19</text><rect x="518" y="168" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="559" y="199" font-size="24" fill="#20334a" text-anchor="middle">20</text><rect x="38" y="245" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="79" y="276" font-size="24" fill="#20334a" text-anchor="middle">21</text><rect x="158" y="245" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="199" y="276" font-size="24" fill="#20334a" text-anchor="middle">22</text><rect x="278" y="245" width="83" height="45" rx="8" fill="#eff6ff" stroke="#2d6db4" stroke-width="2"/><text x="319" y="276" font-size="24" fill="#20334a" text-anchor="middle">23</text><rect x="398" y="245" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="439" y="276" font-size="24" fill="#20334a" text-anchor="middle">24</text><rect x="518" y="245" width="83" height="45" rx="8" fill="#f1f5f9" stroke="#2d6db4" stroke-width="2"/><text x="559" y="276" font-size="24" fill="#20334a" text-anchor="middle">25</text><text x="24" y="360" font-size="21" fill="#20334a" text-anchor="start">p=2起于12；p=3起于12；p=5起于25。</text><text x="24" y="405" font-size="21" fill="#20334a" text-anchor="start">剩余质数：11、13、17、19、23。</text><text x="24" y="450" font-size="20" fill="#20334a" text-anchor="start">数位和：  2、 4、 8、10、 5；只有4为平方。</text><text x="24" y="496" font-size="20" fill="#20334a" text-anchor="start">K=1：13处减到0并输出；K=2：最终输出−1。</text><text x="24" y="541" font-size="20" fill="#20334a" text-anchor="start">[2,10]中p=2从4起；1即使数位和为1也非质数。</text></g></svg>