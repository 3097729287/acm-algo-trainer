<svg xmlns="http://www.w3.org/2000/svg" width="885" height="625" viewBox="0 0 885 625" role="img"><title>原位置按间距三连成三条链，逐边翻转使每条链清零</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="33" font-size="24" fill="#20334a" text-anchor="start">n=8，k=3：每条边连接真正相距三的原位置</text><text x="199" y="76" font-size="17" fill="#20334a" text-anchor="middle">位置1</text><rect x="170" y="91" width="58" height="43" rx="5" fill="#eaf3fd" stroke="#2563a6" stroke-width="2"/><text x="199" y="121" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="276" y="76" font-size="17" fill="#20334a" text-anchor="middle">位置2</text><rect x="247" y="91" width="58" height="43" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="276" y="121" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="353" y="76" font-size="17" fill="#20334a" text-anchor="middle">位置3</text><rect x="324" y="91" width="58" height="43" rx="5" fill="#eaf5ec" stroke="#3e7751" stroke-width="2"/><text x="353" y="121" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="430" y="76" font-size="17" fill="#20334a" text-anchor="middle">位置4</text><rect x="401" y="91" width="58" height="43" rx="5" fill="#eaf3fd" stroke="#2563a6" stroke-width="2"/><text x="430" y="121" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="507" y="76" font-size="17" fill="#20334a" text-anchor="middle">位置5</text><rect x="478" y="91" width="58" height="43" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="507" y="121" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="584" y="76" font-size="17" fill="#20334a" text-anchor="middle">位置6</text><rect x="555" y="91" width="58" height="43" rx="5" fill="#eaf5ec" stroke="#3e7751" stroke-width="2"/><text x="584" y="121" font-size="24" fill="#20334a" text-anchor="middle">0</text><text x="661" y="76" font-size="17" fill="#20334a" text-anchor="middle">位置7</text><rect x="632" y="91" width="58" height="43" rx="5" fill="#eaf3fd" stroke="#2563a6" stroke-width="2"/><text x="661" y="121" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="738" y="76" font-size="17" fill="#20334a" text-anchor="middle">位置8</text><rect x="709" y="91" width="58" height="43" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="738" y="121" font-size="24" fill="#20334a" text-anchor="middle">1</text><text x="25" y="206" font-size="21" fill="#2563a6" text-anchor="start">余数 0</text><rect x="170" y="177" width="72" height="43" rx="5" fill="#eaf3fd" stroke="#2563a6" stroke-width="2"/><text x="206" y="206" font-size="22" fill="#20334a" text-anchor="middle">1: 1</text><path d="M249,198 L296,198" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="305" y="177" width="72" height="43" rx="5" fill="#eaf3fd" stroke="#2563a6" stroke-width="2"/><text x="341" y="206" font-size="22" fill="#20334a" text-anchor="middle">4: 0</text><path d="M384,198 L431,198" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="440" y="177" width="72" height="43" rx="5" fill="#eaf3fd" stroke="#2563a6" stroke-width="2"/><text x="476" y="206" font-size="22" fill="#20334a" text-anchor="middle">7: 1</text><text x="585" y="195" font-size="21" fill="#2563a6" text-anchor="start">101 → 011 → 000</text><text x="585" y="224" font-size="18" fill="#20334a" text-anchor="start">先翻前两位，再翻后两位</text><text x="25" y="326" font-size="21" fill="#a06115" text-anchor="start">余数 1</text><rect x="170" y="297" width="72" height="43" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="206" y="326" font-size="22" fill="#20334a" text-anchor="middle">2: 1</text><path d="M249,318 L296,318" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="305" y="297" width="72" height="43" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="341" y="326" font-size="22" fill="#20334a" text-anchor="middle">5: 0</text><path d="M384,318 L431,318" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="440" y="297" width="72" height="43" rx="5" fill="#fff0d5" stroke="#a06115" stroke-width="2"/><text x="476" y="326" font-size="22" fill="#20334a" text-anchor="middle">8: 1</text><text x="585" y="315" font-size="21" fill="#a06115" text-anchor="start">101 → 011 → 000</text><text x="585" y="344" font-size="18" fill="#20334a" text-anchor="start">先翻前两位，再翻后两位</text><text x="25" y="446" font-size="21" fill="#3e7751" text-anchor="start">余数 2</text><rect x="170" y="417" width="72" height="43" rx="5" fill="#eaf5ec" stroke="#3e7751" stroke-width="2"/><text x="206" y="446" font-size="22" fill="#20334a" text-anchor="middle">3: 0</text><path d="M249,438 L296,438" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="305" y="417" width="72" height="43" rx="5" fill="#eaf5ec" stroke="#3e7751" stroke-width="2"/><text x="341" y="446" font-size="22" fill="#20334a" text-anchor="middle">6: 0</text><text x="585" y="445" font-size="21" fill="#3e7751" text-anchor="start">00：无需操作</text><text x="25" y="558" font-size="21" fill="#20334a" text-anchor="start">每格“位置: 值”；余数按 C++ 的零基下标计算</text><text x="25" y="596" font-size="21" fill="#a22f25" text-anchor="start">反例 11000000：总共有两个 1，前两条链却各有一个，不能清零</text></g></svg>