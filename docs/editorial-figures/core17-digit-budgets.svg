<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img"><title>八八的两条真实九九路径与方向预算状态</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563a6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="35" y="38" font-size="27" fill="#20334a" text-anchor="start">88，加至多 1 次、减至多 9 次：较长方向仍可能必需</text><text x="35" y="81" font-size="22" fill="#20334a" text-anchor="start">若两个八都只选较短的 +1，总共需要两次加，预算不够。</text><rect x="40" y="250" width="60" height="49" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="70" y="284" font-size="27" fill="#20334a" text-anchor="middle">8</text><rect x="107" y="250" width="60" height="49" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="137" y="284" font-size="27" fill="#20334a" text-anchor="middle">8</text><rect x="365" y="150" width="60" height="49" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="395" y="184" font-size="27" fill="#20334a" text-anchor="middle">9</text><rect x="432" y="150" width="60" height="49" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="462" y="184" font-size="27" fill="#20334a" text-anchor="middle">8</text><rect x="365" y="370" width="60" height="49" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="395" y="404" font-size="27" fill="#20334a" text-anchor="middle">9</text><rect x="432" y="370" width="60" height="49" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="462" y="404" font-size="27" fill="#20334a" text-anchor="middle">8</text><rect x="800" y="260" width="60" height="49" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="830" y="294" font-size="27" fill="#20334a" text-anchor="middle">9</text><rect x="867" y="260" width="60" height="49" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="897" y="294" font-size="27" fill="#20334a" text-anchor="middle">9</text><path d="M200,265 L335,175" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M200,285 L335,394" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="215" y="184" font-size="22" fill="#20334a" text-anchor="start">首位 +1</text><text x="215" y="397" font-size="22" fill="#20334a" text-anchor="start">首位 −9</text><text x="365" y="132" font-size="22" fill="#20334a" text-anchor="start">剩余 (加0，减9)</text><text x="365" y="352" font-size="22" fill="#20334a" text-anchor="start">剩余 (加1，减0)</text><path d="M525,175 L765,275" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M525,395 L765,295" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="590" y="195" font-size="22" fill="#20334a" text-anchor="start">次位 −9</text><text x="590" y="425" font-size="22" fill="#20334a" text-anchor="start">次位 +1</text><text x="35" y="468" font-size="22" fill="#20334a" text-anchor="start">九次减法：8 → 7 → 6 → 5 → 4 → 3 → 2 → 1 → 0 → 9</text><path d="M35,492 L960,492" stroke="#bbc8d7" stroke-width="2" fill="none"/><text x="35" y="530" font-size="22" fill="#20334a" text-anchor="start">另看两个独立的子问题：原后缀只有 8，总预算同为 1。</text><rect x="50" y="561" width="220" height="55" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="160" y="595" font-size="21" fill="#20334a" text-anchor="middle">剩余 (加1，减0)</text><path d="M290,588 L365,588" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="390" y="598" font-size="25" fill="#286b4d" text-anchor="start">最优 9</text><rect x="550" y="561" width="220" height="55" rx="5" fill="#edf4ff" stroke="#6d86a6" stroke-width="2"/><text x="660" y="595" font-size="21" fill="#20334a" text-anchor="middle">剩余 (加0，减1)</text><path d="M790,588 L850,588" stroke="#2563a6" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="875" y="598" font-size="25" fill="#a23b34" text-anchor="start">最优 8</text><text x="35" y="663" font-size="22" fill="#20334a" text-anchor="start">方向不同，最大后缀不同；状态不能只记录两类剩余次数之和。</text></g></svg>