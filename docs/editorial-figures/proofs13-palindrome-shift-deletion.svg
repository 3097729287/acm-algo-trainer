<svg xmlns="http://www.w3.org/2000/svg" width="720" height="819" viewBox="0 0 720 819" role="img"><title>真实字符串abaaaa下标零到五，将删除ab的左区间零二平移为删除ba的一区间一三，两个结果均四个a有两对；一般不等式k加d小于h加d不大于n减h保证末h字符不受影响，恢复前k字符和剩余相同索引保证全部匹配</title><rect width="100%" height="100%" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20334a"><text x="22" y="33" font-size="21" fill="#20334a" text-anchor="start">S=abaaaa，k=1：同长度删除可右移，答案仍为2</text><rect x="95" y="83" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="125.5" y="113" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="161" y="83" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="191.5" y="113" font-size="23" fill="#20334a" text-anchor="middle">b</text><rect x="227" y="83" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="257.5" y="113" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="293" y="83" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="323.5" y="113" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="359" y="83" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="389.5" y="113" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="425" y="83" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="455.5" y="113" font-size="23" fill="#20334a" text-anchor="middle">a</text><text x="123" y="155" font-size="18" fill="#20334a" text-anchor="middle">0</text><text x="189" y="155" font-size="18" fill="#20334a" text-anchor="middle">1</text><text x="255" y="155" font-size="18" fill="#20334a" text-anchor="middle">2</text><text x="321" y="155" font-size="18" fill="#20334a" text-anchor="middle">3</text><text x="387" y="155" font-size="18" fill="#20334a" text-anchor="middle">4</text><text x="453" y="155" font-size="18" fill="#20334a" text-anchor="middle">5</text><text x="22" y="208" font-size="21" fill="#20334a" text-anchor="start">原删[0,2)：</text><rect x="183" y="177" width="61" height="43" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="213.5" y="207" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="249" y="177" width="61" height="43" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="279.5" y="207" font-size="23" fill="#20334a" text-anchor="middle">b</text><rect x="315" y="177" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="345.5" y="207" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="381" y="177" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="411.5" y="207" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="447" y="177" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="477.5" y="207" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="513" y="177" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="543.5" y="207" font-size="23" fill="#20334a" text-anchor="middle">a</text><text x="22" y="273" font-size="21" fill="#20334a" text-anchor="start">删掉ab → aaaa，前后各2个a，不重叠</text><text x="22" y="337" font-size="21" fill="#20334a" text-anchor="start">移至[1,3)：</text><rect x="183" y="306" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="213.5" y="336" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="249" y="306" width="61" height="43" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="279.5" y="336" font-size="23" fill="#20334a" text-anchor="middle">b</text><rect x="315" y="306" width="61" height="43" rx="8" fill="#fecaca" stroke="#2d6db4" stroke-width="2"/><text x="345.5" y="336" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="381" y="306" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="411.5" y="336" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="447" y="306" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="477.5" y="336" font-size="23" fill="#20334a" text-anchor="middle">a</text><rect x="513" y="306" width="61" height="43" rx="8" fill="#dbeafe" stroke="#2d6db4" stroke-width="2"/><text x="543.5" y="336" font-size="23" fill="#20334a" text-anchor="middle">a</text><text x="22" y="402" font-size="21" fill="#20334a" text-anchor="start">删掉ba → aaaa，原第0个a恢复，仍能配2对</text><rect x="22" y="449" width="676" height="139" rx="8" fill="#fef3c7" stroke="#2d6db4" stroke-width="2"/><text x="40" y="480" font-size="20" fill="#20334a" text-anchor="start">一般记删除长度d，剩长N=n−d，目标h&gt;k</text><text x="40" y="525" font-size="22" fill="#20334a" text-anchor="start">N≥2h且k&lt;h ⇒ k+d&lt;h+d≤n−h</text><text x="40" y="566" font-size="20" fill="#20334a" text-anchor="start">所以平移后删除终点仍在最后h字符之前</text><text x="22" y="640" font-size="21" fill="#20334a" text-anchor="start">位置j&lt;k：恢复原字符，它本就与末尾配对</text><text x="22" y="687" font-size="21" fill="#20334a" text-anchor="start">位置k≤j&lt;h：平移前后都取原字符S[j+d]</text><text x="22" y="734" font-size="21" fill="#20334a" text-anchor="start">末h字符未动；两段前缀合起来保持全部h对</text><text x="22" y="789" font-size="21" fill="#20334a" text-anchor="start">另一侧删除由反转处理；不改善时直接保留k</text></g></svg>