层</text><rect x="145" y="188" width="68" height="43" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="179" y="217" font-size="23" fill="#20334a" text-anchor="middle">6</text><rect x="225" y="188" width="68" height="43" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="259" y="217" font-size="23" fill="#20334a" text-anchor="middle">5</text><rect x="305" y="188" width="68" height="43" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="339" y="217" font-size="23" fill="#20334a" text-anchor="middle">3</text><text x="430" y="218" font-size="22" fill="#20334a" text-anchor="start">稳定度 100</text><text x="28" y="282" font-size="22" fill="#20334a" text-anchor="start">全局降序排名（灰格尚未加入，伤害按零）</text><text x="167" y="318" font-size="17" fill="#20334a" text-anchor="middle">1</text><rect x="142" y="331" width="50" height="43" rx="5" fill="#f1f5f9" stroke="#6d86a6" stroke-width="2"/><text x="167" y="360" font-size="22" fill="#20334a" text-anchor="middle">0</text><text x="229" y="318" font-size="17" fill="#20334a" text-anchor="middle">2</text><rect x="204" y="331" width="50" height="43" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="229" y="360" font-size="22" fill="#20334a" text-anchor="middle">9</text><text x="291" y="318" font-size="17" fill="#20334a" text-anchor="middle">3</text><rect x="266" y="331" width="50" height="43" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="291" y="360" font-size="22" fill="#20334a" text-anchor="middle">6</text><text x="353" y="318" font-size="17" fill="#20334a" text-anchor="middle">4</text><rect x="328" y="331" width="50" height="43" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="353" y="360" font-size="22" fill="#20334a" text-anchor="middle">5</text><text x="415" y="318" font-size="17" fill="#20334a" text-anchor="middle">5</text><rect x="390" y="331" width="50" height="43" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="415" y="360" font-size="22" fill="#20334a" text-anchor="middle">4</text><text x="477" y="318" font-size="17" fill="#20334a" text-anchor="middle">6</text><rect x="452" y="331" width="50" height="43" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="477" y="360" font-size="22" fill="#20334a" text-anchor="middle">3</text><text x="539" y="318" font-size="17" fill="#20334a" text-anchor="middle">7</text><rect x="514" y="331" width="50" height="43" rx="5" fill="#dcfce7" stroke="#6d86a6" stroke-width="2"/><text x="539" y="360" font-size="22" fill="#20334a" text-anchor="middle">2</text><text x="601" y="318" font-size="17" fill="#20334a" text-anchor="middle">8</text><rect x="576" y="331" width="50" height="43" rx="5" fill="#f1f5f9" stroke="#6d86a6" stroke-width="2"/><text x="601" y="360" font-size="22" fill="#20334a" text-anchor="middle">0</text><text x="663" y="318" font-size="17" fill="#20334a" text-anchor="middle">9</text><rect x="638" y="331" width="50" height="43" rx="5" fill="#f1f5f9" stroke="#6d86a6" stroke-width="2"/><text x="663" y="360" font-size="22" fill="#20334a" text-anchor="middle">0</text><text x="28" y="408" font-size="22" fill="#20334a" text-anchor="start">目标13：排名前3的和 0+9+6=15，实际只有2块</text><text x="28" y="451" font-size="21" fill="#20334a" text-anchor="start">步长8：0+29＜13？否；步长4：0+20＜13？否</text><text x="28" y="489" font-size="21" fill="#20334a" text-anchor="start">步长2：0+9＜13？是 → idx=2，acc=9</text><text x="28" y="527" font-size="21" fill="#20334a" text-anchor="start">步长1：9+6＜13？否 → 首次足够排名为3</text><text x="28" y="572" font-size="21" fill="#20334a" text-anchor="start">抽中层9，再抽底层6：中层稳定度 13 → 4 → −2</text><text x="28" y="611" font-size="23" fill="#20334a" text-anchor="start">best：抽空一行的3 → 压垮中层的2</text></g></svg>