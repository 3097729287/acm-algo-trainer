<svg xmlns="http://www.w3.org/2000/svg" width="760" height="675" viewBox="0 0 760 675" role="img" aria-labelledby="title"><title id="title">闭区间覆盖 x=5：先计入 6 条，再扣掉 2 条</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">闭区间覆盖 x=5：先计入 6 条，再扣掉 2 条</text>
<line x1="380" y1="75" x2="380" y2="520" stroke="#bc3645" stroke-width="2" stroke-dasharray="7 5"/>
<text x="380" y="70" fill="#bc3645" font-size="20" text-anchor="middle" font-weight="normal">查询 x=5</text>
<text x="25" y="119" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">A</text>
<line x1="120" y1="112" x2="250" y2="112" stroke="#12805c" stroke-width="6"/>
<circle cx="120" cy="112" r="6" fill="#12805c"/>
<circle cx="250" cy="112" r="6" fill="#12805c"/>
<text x="675" y="119" fill="#12805c" font-size="19" text-anchor="start" font-weight="normal">已结束</text>
<text x="25" y="168" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">B</text>
<line x1="185" y1="161" x2="315" y2="161" stroke="#12805c" stroke-width="6"/>
<circle cx="185" cy="161" r="6" fill="#12805c"/>
<circle cx="315" cy="161" r="6" fill="#12805c"/>
<text x="675" y="168" fill="#12805c" font-size="19" text-anchor="start" font-weight="normal">已结束</text>
<text x="25" y="217" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">C</text>
<line x1="120" y1="210" x2="510" y2="210" stroke="#bc3645" stroke-width="6"/>
<circle cx="120" cy="210" r="6" fill="#bc3645"/>
<circle cx="510" cy="210" r="6" fill="#bc3645"/>
<text x="675" y="217" fill="#bc3645" font-size="19" text-anchor="start" font-weight="normal">覆盖 x</text>
<text x="25" y="266" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">D</text>
<line x1="250" y1="259" x2="380" y2="259" stroke="#bc3645" stroke-width="6"/>
<circle cx="250" cy="259" r="6" fill="#bc3645"/>
<circle cx="380" cy="259" r="6" fill="#bc3645"/>
<text x="675" y="266" fill="#bc3645" font-size="19" text-anchor="start" font-weight="normal">覆盖 x</text>
<text x="368" y="246" fill="#bc3645" font-size="18" text-anchor="end" font-weight="normal">r=x，仍覆盖</text>
<text x="25" y="315" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">E</text>
<line x1="315" y1="308" x2="575" y2="308" stroke="#bc3645" stroke-width="6"/>
<circle cx="315" cy="308" r="6" fill="#bc3645"/>
<circle cx="575" cy="308" r="6" fill="#bc3645"/>
<text x="675" y="315" fill="#bc3645" font-size="19" text-anchor="start" font-weight="normal">覆盖 x</text>
<text x="25" y="364" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">F</text>
<line x1="380" y1="357" x2="445" y2="357" stroke="#bc3645" stroke-width="6"/>
<circle cx="380" cy="357" r="6" fill="#bc3645"/>
<circle cx="445" cy="357" r="6" fill="#bc3645"/>
<text x="675" y="364" fill="#bc3645" font-size="19" text-anchor="start" font-weight="normal">覆盖 x</text>
<text x="392" y="344" fill="#bc3645" font-size="18" text-anchor="start" font-weight="normal">l=x，已开始</text>
<text x="25" y="413" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">G</text>
<line x1="445" y1="406" x2="575" y2="406" stroke="#68778b" stroke-width="6"/>
<circle cx="445" cy="406" r="6" fill="#68778b"/>
<circle cx="575" cy="406" r="6" fill="#68778b"/>
<text x="675" y="413" fill="#68778b" font-size="19" text-anchor="start" font-weight="normal">未开始</text>
<text x="25" y="462" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">H</text>
<line x1="510" y1="455" x2="640" y2="455" stroke="#68778b" stroke-width="6"/>
<circle cx="510" cy="455" r="6" fill="#68778b"/>
<circle cx="640" cy="455" r="6" fill="#68778b"/>
<text x="675" y="462" fill="#68778b" font-size="19" text-anchor="start" font-weight="normal">未开始</text>
<line x1="105" y1="535" x2="655" y2="535" stroke="#68778b" stroke-width="3"/>
<line x1="120" y1="530" x2="120" y2="540" stroke="#68778b" stroke-width="3"/>
<text x="120" y="565" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">1</text>
<line x1="185" y1="530" x2="185" y2="540" stroke="#68778b" stroke-width="3"/>
<text x="185" y="565" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">2</text>
<line x1="250" y1="530" x2="250" y2="540" stroke="#68778b" stroke-width="3"/>
<text x="250" y="565" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">3</text>
<line x1="315" y1="530" x2="315" y2="540" stroke="#68778b" stroke-width="3"/>
<text x="315" y="565" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">4</text>
<line x1="380" y1="530" x2="380" y2="540" stroke="#68778b" stroke-width="3"/>
<text x="380" y="565" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">5</text>
<line x1="445" y1="530" x2="445" y2="540" stroke="#68778b" stroke-width="3"/>
<text x="445" y="565" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">6</text>
<line x1="510" y1="530" x2="510" y2="540" stroke="#68778b" stroke-width="3"/>
<text x="510" y="565" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">7</text>
<line x1="575" y1="530" x2="575" y2="540" stroke="#68778b" stroke-width="3"/>
<text x="575" y="565" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">8</text>
<line x1="640" y1="530" x2="640" y2="540" stroke="#68778b" stroke-width="3"/>
<text x="640" y="565" fill="#243449" font-size="19" text-anchor="middle" font-weight="normal">9</text>
<text x="35" y="602" fill="#bc3645" font-size="22" text-anchor="start" font-weight="normal">l ≤ x：A、B、C、D、E、F，共 6 条</text>
<text x="35" y="635" fill="#12805c" font-size="22" text-anchor="start" font-weight="normal">r &lt; x：A、B，共 2 条；留下 C、D、E、F</text>
</g></svg>
