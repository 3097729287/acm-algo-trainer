<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title"><title id="title">0/1 背包：比较两个独立的候选装法</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">0/1 背包：比较两个独立的候选装法</text>
<rect x="25" y="90" width="325" height="65" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="187.5" y="129.5" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">旧容量 5：选 A，价值 7</text>
<rect x="405" y="90" width="325" height="65" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="567.5" y="129.5" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">旧容量 3：选 B，价值 5</text>
<text x="420" y="205" fill="#bc3645" font-size="21" text-anchor="start" font-weight="normal">加 C：重量 2，价值 3</text>
<line x1="185" y1="155" x2="290" y2="265" stroke="#2365ab" stroke-width="3"/>
<line x1="565" y1="155" x2="490" y2="265" stroke="#bc3645" stroke-width="3"/>
<rect x="175" y="265" width="410" height="65" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="380.0" y="304.5" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">新容量 5：max(7, 5+3) = 8</text>
</g></svg>
