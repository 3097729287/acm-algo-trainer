<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title"><title id="title">每项有三种位置，因此集合与子集配对共三的 n 次方</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">每项有三种位置，因此集合与子集配对共三的 n 次方</text>
<rect x="35" y="75" width="690" height="320" rx="12" fill="#fff" stroke="#68778b" stroke-width="2"/>
<ellipse cx="435" cy="230" rx="245" ry="140" fill="#edf5ff" stroke="#2365ab" stroke-width="3"/>
<ellipse cx="485" cy="255" rx="145" ry="80" fill="#edfff5" stroke="#12805c" stroke-width="3"/>
<text x="400" y="120" fill="#2365ab" font-size="24" text-anchor="middle" font-weight="normal">S = {1,2,4}</text>
<text x="485" y="210" fill="#12805c" font-size="22" text-anchor="middle" font-weight="normal">sub = {2,4}</text>
<circle cx="115" cy="150" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="115" y="157" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<circle cx="115" cy="320" r="23" fill="#fff" stroke="#68778b" stroke-width="3"/>
<text x="115" y="327" fill="#68778b" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<circle cx="265" cy="220" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="265" y="227" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="420" cy="275" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="420" y="282" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="555" cy="275" r="23" fill="#fff" stroke="#12805c" stroke-width="3"/>
<text x="555" y="282" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">4</text>
<text x="45" y="435" fill="#243449" font-size="22" text-anchor="start" font-weight="normal">灰色不在 S；蓝色只在 S；绿色还在子集 sub 中</text>
</g></svg>
