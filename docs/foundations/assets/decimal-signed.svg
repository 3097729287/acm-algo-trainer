<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">异号相加先比较绝对值，结果取较大者的符号</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">异号相加先比较绝对值，结果取较大者的符号</text>
<rect x="55" y="95" width="180" height="60" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="145.0" y="132.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">−8</text>
<rect x="305" y="95" width="180" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="395.0" y="132.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">+12</text>
<rect x="560" y="95" width="145" height="60" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="632.5" y="132.0" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">+4</text>
<text x="265" y="133" fill="#243449" font-size="30" text-anchor="middle" font-weight="normal">+</text>
<text x="525" y="133" fill="#243449" font-size="30" text-anchor="middle" font-weight="normal">=</text>
<rect x="55" y="225" width="180" height="60" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="145.0" y="262.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">−8</text>
<rect x="305" y="225" width="180" height="60" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="395.0" y="262.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">+5</text>
<rect x="560" y="225" width="145" height="60" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="632.5" y="262.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">−3</text>
<text x="265" y="263" fill="#243449" font-size="30" text-anchor="middle" font-weight="normal">+</text>
<text x="525" y="263" fill="#243449" font-size="30" text-anchor="middle" font-weight="normal">=</text>
<text x="45" y="345" fill="#243449" font-size="23" text-anchor="start" font-weight="normal">存绝对值数字串与符号，零统一规范为非负</text>
</g></svg>
