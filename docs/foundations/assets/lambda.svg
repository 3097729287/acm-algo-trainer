<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title"><title id="title">lambda：捕获来自定义处，参数来自每次调用</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">lambda：捕获来自定义处，参数来自每次调用</text>
<rect x="30" y="90" width="205" height="65" rx="7" fill="#edf5ff" stroke="#12805c" stroke-width="2"/>
<text x="132.5" y="129.5" fill="#12805c" font-size="21" text-anchor="middle" font-weight="normal">threshold = 10</text>
<rect x="300" y="85" width="420" height="105" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="510.0" y="144.5" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">[threshold](int value)</text>
<line x1="235" y1="120" x2="295" y2="120" stroke="#12805c" stroke-width="3"/>
<rect x="30" y="235" width="205" height="58" rx="7" fill="#edf5ff" stroke="#bc3645" stroke-width="2"/>
<text x="132.5" y="271.0" fill="#bc3645" font-size="21" text-anchor="middle" font-weight="normal">enough(12)</text>
<line x1="235" y1="260" x2="320" y2="190" stroke="#bc3645" stroke-width="3"/>
<text x="360" y="225" fill="#2365ab" font-size="21" text-anchor="start" font-weight="normal">判断 12 ≥ 10</text>
<text x="360" y="275" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">返回 true</text>
</g></svg>
