<line x1="380" y1="90" x2="380" y2="180" stroke="#68778b" stroke-width="3"/>
<line x1="380" y1="180" x2="220" y2="280" stroke="#68778b" stroke-width="3"/>
<line x1="380" y1="180" x2="540" y2="280" stroke="#68778b" stroke-width="3"/>
