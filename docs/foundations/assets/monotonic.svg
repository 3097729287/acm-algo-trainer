<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title"><title id="title">单调栈：遇到三，依次解决一和二</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">单调栈：遇到三，依次解决一和二</text>
<rect x="210" y="85" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="266.0" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<rect x="325" y="85" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="381.0" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<rect x="440" y="85" width="112" height="48" rx="7" fill="#edf5ff" stroke="#2365ab" stroke-width="2"/>
<text x="496.0" y="116.0" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="150" y="195" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">3 &gt; 1：弹出 1，答案是当前位置</text>
<text x="150" y="235" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">3 &gt; 2：弹出 2，答案也是当前位置</text>
</g></svg>
