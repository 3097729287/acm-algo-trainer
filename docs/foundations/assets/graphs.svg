<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title"><title id="title">BFS 按层到达；DFS 沿分支深入</title>
<rect width="100%" height="100%" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243449">
<text x="28" y="36" fill="#243449" font-size="23" text-anchor="start" font-weight="bold">BFS 按层到达；DFS 沿分支深入</text>
<line x1="370" y1="95" x2="210" y2="190" stroke="#68778b" stroke-width="3"/>
<line x1="370" y1="95" x2="540" y2="190" stroke="#68778b" stroke-width="3"/>
<line x1="210" y1="190" x2="210" y2="285" stroke="#68778b" stroke-width="3"/>
<circle cx="370" cy="95" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="370" y="102" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">0</text>
<circle cx="210" cy="190" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="210" y="197" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">1</text>
<circle cx="540" cy="190" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="540" y="197" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">2</text>
<circle cx="210" cy="285" r="23" fill="#fff" stroke="#2365ab" stroke-width="3"/>
<text x="210" y="292" fill="#2365ab" font-size="21" text-anchor="middle" font-weight="normal">3</text>
<text x="590" y="105" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">距离 0</text>
<text x="590" y="200" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">距离 1</text>
<text x="420" y="295" fill="#12805c" font-size="21" text-anchor="start" font-weight="normal">距离 2</text>
<text x="30" y="340" fill="#243449" font-size="21" text-anchor="start" font-weight="normal">BFS：0 → 1,2 → 3      DFS 可为：0 → 1 → 3 → 2</text>
</g></svg>
