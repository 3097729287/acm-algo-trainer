xt><text x="343" y="60" font-size="19" fill="#223344" text-anchor="middle">同组：前缀 1</text><text x="565" y="245" font-size="18" fill="#223344" text-anchor="middle">先 12，后 19</text><text x="360" y="335" font-size="19" fill="#223344" text-anchor="middle">先收集整个组的出边，再按末位数字 1 → 9 处理</text></g></svg>