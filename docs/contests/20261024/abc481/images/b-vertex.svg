<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>折点和线段内部交点分开计数</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#61758a"/></marker></defs><rect width="720" height="360" rx="14" fill="#f7fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="360" y="32" font-size="21" fill="#223344" text-anchor="middle">折点和线段内部交点分开计数</text><line x1="75" y1="280" x2="660" y2="280" stroke="#61758a" stroke-width="2" marker-end="url(#arrow)"/><line x1="95" y1="290" x2="95" y2="65" stroke="#61758a" stroke-width="2" marker-end="url(#arrow)"/><line x1="95" y1="105" x2="650" y2="105" stroke="#d59a25" stroke-width="2" stroke-dasharray="7 5"/><text x="620" y="90" font-size="19" fill="#223344" text-anchor="middle">y = K = 3</text><polyline points="170,245 360,105 550,245" fill="none" stroke="#397c6e" stroke-width="4"/><circle cx="170" cy="245" r="6" fill="#397c6e"/><text x="170" y="274" font-size="19" fill="#223344" text-anchor="middle">(1,1)</text><circle cx="360" cy="105" r="6" fill="#397c6e"/><text x="360" y="85" font-size="19" fill="#223344" text-anchor="middle">(2,3)</text><circle cx="550" cy="245" r="6" fill="#397c6e"/><text x="550" y="274" font-size="19" fill="#223344" text-anchor="middle">(3,1)</text><text x="360" y="325" font-size="19" fill="#223344" text-anchor="middle">共享折点计 1 次；两条线段内部都没有交点</text></g></svg>