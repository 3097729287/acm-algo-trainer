<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>让当前最大的数承担清零</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#61758a"/></marker></defs><rect width="720" height="360" rx="14" fill="#f7fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="360" y="32" font-size="21" fill="#223344" text-anchor="middle">让当前最大的数承担清零</text><text x="115" y="85" font-size="19" fill="#223344" text-anchor="middle">操作</text><text x="350" y="85" font-size="19" fill="#223344" text-anchor="middle">三个实际整数</text><text x="600" y="85" font-size="19" fill="#223344" text-anchor="middle">二进制</text><text x="115" y="135" font-size="18" fill="#223344" text-anchor="middle">初始</text><text x="350" y="135" font-size="21" fill="#397c6e" text-anchor="middle">7，7，7</text><text x="600" y="135" font-size="18" fill="#223344" text-anchor="middle">111  111  111</text><line x1="350" y1="149" x2="350" y2="179" stroke="#61758a" stroke-width="2" marker-end="url(#arrow)"/><text x="115" y="205" font-size="18" fill="#223344" text-anchor="middle">清两个 4</text><text x="350" y="205" font-size="21" fill="#397c6e" text-anchor="middle">7，3，3</text><text x="600" y="205" font-size="18" fill="#223344" text-anchor="middle">111  011  011</text><line x1="350" y1="219" x2="350" y2="249" stroke="#61758a" stroke-width="2" marker-end="url(#arrow)"/><text x="115" y="275" font-size="18" fill="#223344" text-anchor="middle">清一个 1</text><text x="350" y="275" font-size="21" fill="#397c6e" text-anchor="middle">6，3，3</text><text x="600" y="275" font-size="18" fill="#223344" text-anchor="middle">110  011  011</text><text x="360" y="330" font-size="19" fill="#223344" text-anchor="middle">AND = 2，OR = 7，XOR = 6；最大乘积 6 × 3 × 3 = 54</text></g></svg>